<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Policitemia neonatal asintomática (hematocrito 68 %): hidratación EV y control del hematocrito"><title>Policitemia neonatal asintomática (hematocrito 68 %): hidratación EV y control del hematocrito</title><rect x="0.75" y="0.75" width="998.5" height="998.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · policitemia</tspan></text><rect x="355.1" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="411.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="411.6" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Policitemia neonatal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hematocrito venoso &gt; 65 %: la sangre se vuelve espesa (hiperviscosidad).</tspan><tspan x="58.0" dy="17">La conducta depende de los síntomas y del valor, no solo del número.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido de 41 semanas, 4000 g</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">A las 2 h: activo, buena succión, sin dificultad</tspan><tspan x="640.0" dy="16">respiratoria ni signos neurológicos.</tspan><tspan x="640.0" dy="16">Hematocrito 68 %, glucosa 60 mg/dL.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">IMAGEN DEL CASO Y SEMÁFORO DE CONDUCTA</tspan></text><rect x="40.0" y="285.0" width="310.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="154.5" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">HEMATOCRITO DEL CASO</tspan></text><g data-box="60.0 321.0 270.0 290.0"><g transform="translate(80.0,341.0) scale(1.05)"><rect x="80" y="20" width="36" height="180" rx="6" fill="#fef9c3" stroke="#64748b" stroke-width="2"/><rect x="82" y="78" width="32" height="120" rx="4" fill="#b91c1c"/><rect x="82" y="74" width="32" height="4" fill="#f8fafc"/><text x="130" y="83.6" font-size="14" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">68 %</text><text x="130" y="83.6" font-size="14" font-weight="800" fill="#7f1d1d" text-anchor="start" data-max="0">68 %</text><line x1="70" y1="83" x2="126" y2="83" stroke="#ea580c" stroke-width="2" stroke-dasharray="4 3"/><text x="66" y="87.0" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">65 %</text><text x="66" y="87.0" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="end" data-max="0">65 %</text><text x="98" y="224" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">plasma arriba, glóbulos rojos abajo</text><text x="98" y="224" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">plasma arriba, glóbulos rojos abajo</text></g></g><rect x="48.0" y="652.0" width="294.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="195.0" y="673.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">68 %: sobre el límite de 65 % (línea naranja).</tspan></text><text x="370.0" y="297.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="590"><tspan x="370.0" dy="0">¿TIENE SÍNTOMAS?</tspan></text><rect x="370.0" y="307.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="321.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="325.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="325.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Activo y con buena succión</tspan></text><rect x="370.0" y="339.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="353.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="357.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="357.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Sin dificultad respiratoria</tspan></text><rect x="370.0" y="371.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="385.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="389.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="389.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Glucosa 60 mg/dL: normal</tspan></text><rect x="370.0" y="403.0" width="590.0" height="28.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="386.0" cy="417.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="386.0" y="421.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">!</tspan></text><text x="404.0" y="421.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Hematocrito venoso 68 %</tspan></text><rect x="370.0" y="445.0" width="590.0" height="66.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><circle cx="400.0" cy="478.0" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="478.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hto 65-70 % sin síntomas</tspan></text><text x="430.0" y="484.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hidratar y controlar</tspan></text><text x="430.0" y="500.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Líquidos EV; hematocrito y glucosa seriados.</tspan></text><rect x="854.6" y="434.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="449.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ ESTE CASO</tspan></text><rect x="370.0" y="519.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="552.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="552.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="541.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hto 70-75 % sin síntomas</tspan></text><text x="430.0" y="558.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Vigilar de cerca</tspan></text><text x="430.0" y="574.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hidratación; decidir según la evolución.</tspan></text><rect x="370.0" y="593.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="626.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="626.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="615.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Síntomas o Hto &gt; 75 %</tspan></text><text x="430.0" y="632.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Exanguinotransfusión parcial</tspan></text><text x="430.0" y="648.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Con salino 0,9 %; nunca total.</tspan></text><text x="40.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="739.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="770.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Exanguinotransfusión</tspan><tspan x="303.8" dy="17">total</tspan></text><text x="491.2" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Exanguinotransfusión</tspan><tspan x="491.2" dy="17">parcial</tspan></text><text x="678.8" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Bolo de dextrosa 10 %</tspan></text><rect x="775.5" y="742.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Hidratación EV y</tspan><tspan x="866.2" dy="17">controles</tspan></text><rect x="40.0" y="793.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="793.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="814.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicada?</tspan></text><text x="303.8" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Nunca en policitemia</tspan></text><text x="491.2" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Solo con síntomas o &gt; 75 %</tspan></text><text x="678.8" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Glucosa normal</tspan></text><text x="866.2" y="814.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="739.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="851.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="879.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="901.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Asintomático con hematocrito 65-70 %: hidratación EV y control seriado del hematocrito y la glucosa.</tspan><tspan x="58.0" dy="18">• Exanguinotransfusión parcial (con salino 0,9 %): si hay síntomas de hiperviscosidad o hematocrito &gt; 75 %.</tspan><tspan x="58.0" dy="18">• La glucosa de 60 mg/dL es normal: no necesita bolo de dextrosa.</tspan></text><text x="58.0" y="959.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP; Cochrane, exanguinotransfusión parcial; SIBEN; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>