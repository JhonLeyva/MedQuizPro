<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sin contar al feto, el mayor componente del peso ganado entre las opciones es el volumen sanguíneo (1450 g)"><title>Sin contar al feto, el mayor componente del peso ganado entre las opciones es el volumen sanguíneo (1450 g)</title><rect x="0.75" y="0.75" width="998.5" height="1328.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · ganancia de peso gestacional</tspan></text><rect x="451.6" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="531.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="531.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ganancia de peso en el embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se reparte entre los productos de la concepción y los tejidos maternos.</tspan><tspan x="58.0" dy="17">La meta depende del IMC previo (Instituto de Medicina, 2009).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 30 años, 38 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Talla 1,60 m, peso basal 60 kg y ganancia de 12 kg.</tspan><tspan x="640.0" dy="16">¿A qué se debe principalmente el aumento, además</tspan><tspan x="640.0" dy="16">del feto?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COMPONENTES DEL PESO GANADO ENTRE LAS OPCIONES, DE MAYOR A MENOR</tspan></text><polygon points="200.0,285.0 300.0,285.0 332.0,341.0 168.0,341.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="318.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="285.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Volumen sanguíneo</tspan></text><text x="501.0" y="326.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cerca de 1450 g; aumento de 40 a 50 % del plasma y de la masa eritrocitaria</tspan></text><rect x="858.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="168.0,347.0 332.0,347.0 364.0,403.0 136.0,403.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="380.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="152"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="347.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="371.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Útero</tspan></text><text x="501.0" y="388.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cerca de 970 g</tspan></text><polygon points="136.0,409.0 364.0,409.0 396.0,465.0 104.0,465.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="216"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="409.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="433.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Líquido amniótico</tspan></text><text x="501.0" y="450.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cerca de 800 g</tspan></text><polygon points="104.0,471.0 396.0,471.0 428.0,527.0 72.0,527.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="280"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="471.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="495.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Placenta</tspan></text><text x="501.0" y="512.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cerca de 650 g</tspan></text><polygon points="72.0,533.0 428.0,533.0 460.0,589.0 40.0,589.0" fill="#14b8a6" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="566.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="344"><tspan x="250.0" dy="0">5</tspan></text><rect x="486.0" y="533.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="557.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Mamas</tspan></text><text x="501.0" y="574.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cerca de 405 g</tspan></text><text x="250.0" y="607.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ mayor masa · ▼ menor masa</tspan></text><rect x="40.0" y="629.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="655.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Después del feto, el volumen sanguíneo es el mayor de la lista</tspan></text><text x="60.0" y="674.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El líquido extracelular (1480 g) y la grasa (2300 g) también pesan, pero no figuran entre las opciones.</tspan></text><text x="40.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GANANCIA DE PESO RECOMENDADA SEGÚN EL IMC PREVIO (INSTITUTO DE MEDICINA, 2009)</tspan></text><rect x="40.0" y="747.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="766.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">IMC previo</tspan></text><text x="320.0" y="766.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Ganancia total</tspan></text><text x="645.0" y="766.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Ritmo en 2.º y 3.er trimestre</tspan></text><rect x="40.0" y="776.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="795.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Bajo peso (&lt; 18,5)</tspan></text><text x="320.0" y="795.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">12,5 a 18 kg</tspan></text><text x="645.0" y="795.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">0,51 kg por semana</tspan></text><rect x="40.0" y="805.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="824.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Normopeso (18,5 a 24,9)</tspan></text><text x="320.0" y="824.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">11,5 a 16 kg</tspan></text><text x="645.0" y="824.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">0,42 kg por semana</tspan></text><rect x="210.6" y="808.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="823.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="834.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="853.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Sobrepeso (25 a 29,9)</tspan></text><text x="320.0" y="853.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">7 a 11,5 kg</tspan></text><text x="645.0" y="853.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">0,28 kg por semana</tspan></text><rect x="40.0" y="863.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="882.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Obesidad (30 o más)</tspan></text><text x="320.0" y="882.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">5 a 9 kg</tspan></text><text x="645.0" y="882.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">0,22 kg por semana</tspan></text><text x="40.0" y="908.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Gestante del caso: IMC 23,4 y 12 kg ganados, dentro de lo recomendado.</tspan></text><text x="40.0" y="955.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="965.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="996.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="996.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Las mamas</tspan></text><text x="435.0" y="996.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">El útero</tspan></text><rect x="513.0" y="968.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">El volumen</tspan><tspan x="585.0" dy="17">sanguíneo</tspan></text><text x="735.0" y="996.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">La placenta</tspan></text><text x="885.0" y="996.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">El líquido amniótico</tspan></text><rect x="40.0" y="1019.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1019.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1056.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mayor componente?</tspan></text><text x="285.0" y="1048.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: cerca de 405 g, el</tspan><tspan x="285.0" dy="16">menor</tspan></text><text x="435.0" y="1056.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cerca de 970 g</tspan></text><text x="585.0" y="1040.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: cerca de 1450 g,</tspan><tspan x="585.0" dy="16">expansión de 40 a 50</tspan><tspan x="585.0" dy="16">%</tspan></text><text x="735.0" y="1056.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: cerca de 650 g</tspan></text><text x="885.0" y="1056.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cerca de 800 g</tspan></text><rect x="40.0" y="965.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1109.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1137.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1159.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• IMC de 23,4 kg/m² (normopeso): ganancia total recomendada de 11,5 a 16 kg, con 0,4 kg por semana en el segundo y tercer trimestre; los 12 kg del caso</tspan><tspan x="58.0" dy="18">   son adecuados.</tspan><tspan x="58.0" dy="18">• A término: feto cerca de 3400 g, placenta 650 g, líquido amniótico 800 g, útero 970 g, mamas 405 g, volumen sanguíneo 1450 g, líquido extracelular 1480</tspan><tspan x="58.0" dy="18">   g y grasa 2300 g.</tspan><tspan x="58.0" dy="18">• El volumen sanguíneo se expande 40 a 50 % (plasma y masa eritrocitaria): explica la anemia fisiológica por hemodilución.</tspan><tspan x="58.0" dy="18">• Alerta: ganancia excesiva se asocia a macrosomía, cesárea y retención de peso posparto; la insuficiente, a restricción del crecimiento y bajo peso al</tspan><tspan x="58.0" dy="18">   nacer.</tspan></text><text x="58.0" y="1289.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Committee Opinion 548 Weight gain during pregnancy (2013); Williams Obstetricia, 26.ª ed. (2022); Guyton y Hall, 14.ª ed. (2021).</tspan></text></svg>