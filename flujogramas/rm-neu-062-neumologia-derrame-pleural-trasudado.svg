<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1272" viewBox="0 0 1000 1272" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La insuficiencia cardiaca congestiva produce un derrame pleural trasudado por aumento de la presión hidrostática"><title>La insuficiencia cardiaca congestiva produce un derrame pleural trasudado por aumento de la presión hidrostática</title><rect x="0.75" y="0.75" width="998.5" height="1270.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · derrame pleural trasudado</tspan></text><rect x="438.6" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="496.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="496.0" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Derrame pleural</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trasudado: aumenta la presión hidrostática o baja la presión oncótica.</tspan><tspan x="58.0" dy="17">Exudado: inflamación o aumento de la permeabilidad capilar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de causa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué patología el derrame pleural es un trasudado?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE PIENSA EN ESTE ORDEN</tspan></text><rect x="40.0" y="253.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="298.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="326.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="253.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="281.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cómo se clasifica el líquido?</tspan></text><rect x="136.0" y="295.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="315.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Criterios de Light: un criterio basta para exudado</tspan></text><text x="152.0" y="334.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Proteína pleural/sérica &gt; 0,5, LDH &gt; 0,6 o LDH pleural &gt; 2/3 del límite superior.</tspan></text><line x1="77.0" y1="356.0" x2="77.0" y2="375.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,374.0 82.0,374.0 77.0,382.0" fill="#0f766e"/><text x="134.0" y="374.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="384.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="429.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="457.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="384.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="412.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué causa trasudado?</tspan></text><rect x="136.0" y="426.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="446.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Insuficiencia cardiaca congestiva, cirrosis, nefrótico</tspan></text><text x="152.0" y="465.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Sube la presión hidrostática o baja la oncótica; es la causa más frecuente.</tspan></text><line x1="77.0" y1="487.0" x2="77.0" y2="506.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,505.0 82.0,505.0 77.0,513.0" fill="#0f766e"/><text x="134.0" y="505.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="515.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="560.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="588.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="515.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="543.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Y si hay diuréticos?</tspan></text><rect x="136.0" y="557.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="577.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">El trasudado puede parecer exudado</tspan></text><text x="152.0" y="596.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Gradiente de albúmina sérica menos pleural mayor de 1,2 g/dL.</tspan></text><rect x="40.0" y="636.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="662.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Insuficiencia cardiaca congestiva = trasudado</tspan></text><text x="60.0" y="681.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Neumonía, tuberculosis y neoplasia producen exudado.</tspan></text><text x="40.0" y="742.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE LIGHT PARA EL EXUDADO PLEURAL</tspan></text><rect x="40.0" y="754.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="773.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Criterio</tspan></text><text x="340.0" y="773.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Exudado si</tspan></text><text x="655.0" y="773.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Nota</tspan></text><rect x="40.0" y="783.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="802.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Proteína pleural/sérica</tspan></text><text x="340.0" y="802.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Mayor de 0,5</tspan></text><text x="655.0" y="802.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Basta con cumplir uno</tspan></text><rect x="230.6" y="786.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="276.0" y="801.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="276.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="812.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="831.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">LDH pleural/sérica</tspan></text><text x="340.0" y="831.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Mayor de 0,6</tspan></text><text x="655.0" y="831.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Basta con cumplir uno</tspan></text><rect x="40.0" y="841.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="860.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">LDH pleural</tspan></text><text x="340.0" y="860.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Mayor de 2/3 del límite superior normal sérico</tspan></text><text x="655.0" y="860.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Basta con cumplir uno</tspan></text><text x="40.0" y="886.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Con diuréticos: gradiente de albúmina sérica menos pleural mayor de 1,2 g/dL orienta a trasudado.</tspan></text><text x="40.0" y="933.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="943.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="974.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="974.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Neumonía</tspan></text><text x="435.0" y="974.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tuberculosis</tspan></text><text x="585.0" y="974.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Neoplasia pulmonar</tspan></text><rect x="663.0" y="946.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="965.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Insuficiencia</tspan><tspan x="735.0" dy="17">cardiaca congestiva</tspan></text><text x="885.0" y="974.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome de Meigs</tspan></text><rect x="40.0" y="997.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="997.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1034.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Trasudado?</tspan></text><text x="285.0" y="1018.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: derrame</tspan><tspan x="285.0" dy="16">paraneumónico,</tspan><tspan x="285.0" dy="16">exudado</tspan></text><text x="435.0" y="1034.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: exudado</tspan></text><text x="585.0" y="1034.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: exudado</tspan></text><text x="735.0" y="1026.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: sube la presión</tspan><tspan x="735.0" dy="16">capilar y trasuda</tspan></text><text x="885.0" y="1018.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: puede ser de</tspan><tspan x="885.0" dy="16">ambos tipos; no es el</tspan><tspan x="885.0" dy="16">ejemplo clásico</tspan></text><rect x="40.0" y="943.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1087.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1115.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1137.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios de Light (1972): exudado si hay al menos uno: proteína pleural/sérica &gt; 0,5, LDH pleural/sérica &gt; 0,6 o LDH pleural &gt; 2/3 del límite superior</tspan><tspan x="58.0" dy="18">   sérico.</tspan><tspan x="58.0" dy="18">• Trasudado: insuficiencia cardiaca (la más frecuente), cirrosis, síndrome nefrótico, diálisis peritoneal e hipoalbuminemia.</tspan><tspan x="58.0" dy="18">• Neumonía, tuberculosis y neoplasia dan exudado; el síndrome de Meigs puede ser de ambos tipos y no es el ejemplo clásico.</tspan><tspan x="58.0" dy="18">• Alerta: con diuréticos el derrame cardiaco parece exudado; un gradiente de albúmina sérica menos pleural &gt; 1,2 g/dL lo corrige.</tspan></text><text x="58.0" y="1231.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: British Thoracic Society Guideline for pleural disease (Thorax 2023); Harrison, 21.ª ed. (2022).</tspan></text></svg>