<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1068" viewBox="0 0 1000 1068" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el paciente comatoso, la apnea persistente obliga a intubar y ventilar de inmediato"><title>En el paciente comatoso, la apnea persistente obliga a intubar y ventilar de inmediato</title><rect x="0.75" y="0.75" width="998.5" height="1067.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Emergencias · coma y vía aérea</tspan></text><rect x="388.0" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="431.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="431.2" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Coma e intubación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La intubación protege la vía aérea y asegura la oxigenación y la ventilación.</tspan><tspan x="58.0" dy="17">Se indica ante pérdida de reflejos protectores, hipoxemia refractaria o apnea.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente en coma</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Se pregunta en qué situación se indica la intubación</tspan><tspan x="640.0" dy="16">traqueal.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="379.0" x2="850.2" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="379.0" x2="149.8" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="144.8,407.0 154.8,407.0 149.8,415.0" fill="#94a3b8"/><line x1="383.2" y1="379.0" x2="383.2" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="378.2,407.0 388.2,407.0 383.2,415.0" fill="#94a3b8"/><line x1="616.8" y1="379.0" x2="616.8" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="611.8,407.0 621.8,407.0 616.8,415.0" fill="#94a3b8"/><line x1="850.2" y1="379.0" x2="850.2" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="845.2,407.0 855.2,407.0 850.2,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="149.8" y1="379.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="149.8" y1="379.0" x2="149.8" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="144.8,407.0 154.8,407.0 149.8,415.0" fill="#0f766e"/><rect x="41.7" y="388.0" width="216.2" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="149.8" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="149.8" dy="0">No respira de forma persistente (apnea)</tspan></text><rect x="283.5" y="388.0" width="199.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="383.2" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="383.2" dy="0">Hipercapnia que mejora con soporte</tspan></text><rect x="548.8" y="388.0" width="135.9" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="616.8" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="616.8" dy="0">Hipotensión persistente</tspan></text><rect x="763.9" y="388.0" width="172.8" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="850.2" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="850.2" dy="0">Mioclonias o midriasis bilateral</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Paciente en coma: ¿qué hallazgo respiratorio hay?</tspan></text><rect x="40.0" y="415.0" width="219.5" height="107.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="149.8" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">INTUBAR YA</tspan></text><text x="149.8" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">Ventilación mecánica inmediata</tspan><tspan x="149.8" dy="17">Falla total del centro respiratorio</tspan></text><rect x="273.5" y="415.0" width="219.5" height="107.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="383.2" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">SOPORTE PRIMERO</tspan></text><text x="383.2" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">Oxígeno, bolsa-mascarilla o</tspan><tspan x="383.2" dy="17">ventilación no invasiva</tspan><tspan x="383.2" dy="17">Intubar solo si falla</tspan></text><rect x="507.0" y="415.0" width="219.5" height="107.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="616.8" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">CORREGIR PRIMERO</tspan></text><text x="616.8" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">Volumen y vasopresores</tspan><tspan x="616.8" dy="17">Luego asegurar la vía aérea</tspan></text><rect x="740.5" y="415.0" width="219.5" height="107.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="850.2" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">TRATAR LA CAUSA</tspan></text><text x="850.2" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">Anticonvulsivantes o</tspan><tspan x="850.2" dy="17">neuroprotección</tspan><tspan x="850.2" dy="17">No son indicación por sí mismas</tspan></text><text x="40.0" y="556.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESCALA DE COMA DE GLASGOW Y VÍA AÉREA</tspan></text><rect x="40.0" y="568.5" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="587.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Puntaje</tspan></text><text x="160.0" y="587.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Nivel de conciencia</tspan></text><text x="565.0" y="587.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Vía aérea</tspan></text><rect x="40.0" y="597.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="616.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">13 a 15</tspan></text><text x="160.0" y="616.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Leve</tspan></text><text x="565.0" y="616.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Vigilar; sin intubación por la escala</tspan></text><rect x="40.0" y="626.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="645.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">9 a 12</tspan></text><text x="160.0" y="645.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Moderado</tspan></text><text x="565.0" y="645.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Reevaluar reflejos protectores</tspan></text><rect x="40.0" y="655.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="674.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">8 o menos</tspan></text><text x="160.0" y="674.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Grave</tspan></text><text x="565.0" y="674.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Valorar intubación por pérdida de reflejos protectores</tspan></text><text x="40.0" y="700.5" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La apnea persistente indica intubación con cualquier puntaje.</tspan></text><text x="40.0" y="747.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="757.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="788.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="780.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipoxia</tspan><tspan x="285.0" dy="17">hipercápnica</tspan></text><text x="435.0" y="780.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hipotensión</tspan><tspan x="435.0" dy="17">persistente</tspan></text><rect x="513.0" y="760.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="788.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Apnea persistente</tspan></text><text x="735.0" y="780.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mioclonias</tspan><tspan x="735.0" dy="17">localizadas</tspan></text><text x="885.0" y="780.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Midriasis paralítica</tspan><tspan x="885.0" dy="17">bilateral</tspan></text><rect x="40.0" y="811.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="811.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="848.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indica intubación?</tspan></text><text x="285.0" y="840.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se corrige primero</tspan><tspan x="285.0" dy="16">con oxígeno y soporte</tspan></text><text x="435.0" y="832.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se corrige con</tspan><tspan x="435.0" dy="16">volumen y</tspan><tspan x="435.0" dy="16">vasopresores</tspan></text><text x="585.0" y="840.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: falla total del centro</tspan><tspan x="585.0" dy="16">respiratorio</tspan></text><text x="735.0" y="840.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se tratan con</tspan><tspan x="735.0" dy="16">anticonvulsivantes</tspan></text><text x="885.0" y="832.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: signo de</tspan><tspan x="885.0" dy="16">herniación, no el</tspan><tspan x="885.0" dy="16">criterio</tspan></text><rect x="40.0" y="757.5" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="901.5" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="929.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="951.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Indicaciones: Glasgow igual o menor de 8, ausencia de reflejo nauseoso o tusígeno, riesgo de broncoaspiración, hipoxemia o hipercapnia refractarias.</tspan><tspan x="58.0" dy="18">• Apnea persistente: falla total del centro respiratorio; intubación y ventilación mecánica inmediatas.</tspan><tspan x="58.0" dy="18">• Midriasis bilateral paralítica: lesión del tronco o herniación; neuroprotección y vía aérea, pero no es el criterio de la pregunta.</tspan><tspan x="58.0" dy="18">• Antes de intubar: corregir la hipotensión y proteger la columna cervical si hay trauma; secuencia rápida con fármacos de acción corta.</tspan></text><text x="58.0" y="1027.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA, Guías de RCP y ACE, soporte vital avanzado del adulto (2025); Difficult Airway Society (2015); Harrison, 21.ª ed. (2022).</tspan></text></svg>