an x="760.0" dy="0">Polimialgia, miositis</tspan></text><rect x="634.0" y="473.0" width="326.0" height="52.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><rect x="634.0" y="473.0" width="10.0" height="52.0" rx="4" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="656.0" y="495.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">Sin inflamación</tspan></text><text x="760.0" y="495.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Fibromialgia</tspan></text><text x="760.0" y="513.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Ejercicio, educación, amitriptilina</tspan></text><polygon points="614.0,490.0 614.0,508.0 630.0,499.0" fill="#f59e0b"/><rect x="852.6" y="462.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="898.0" y="477.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="898.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="569.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="597.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="619.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Polimialgia reumática: &gt; 50 años, VSG muy alta.</tspan><tspan x="58.0" dy="18">• Polimiositis: debilidad y CPK alta.</tspan><tspan x="58.0" dy="18">• El ejercicio aeróbico gradual es el tratamiento más eficaz.</tspan></text><text x="58.0" y="677.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR – Fibromyalgia diagnostic criteria (2016 revision) · EULAR – Recommendations for fibromyalgia (2017)</tspan></text></svg>