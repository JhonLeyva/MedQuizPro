<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1168" viewBox="0 0 1000 1168" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Miopía: la imagen lejana se enfoca por delante de la retina; ve bien de cerca y entrecierra los párpados"><title>Miopía: la imagen lejana se enfoca por delante de la retina; ve bien de cerca y entrecierra los párpados</title><rect x="0.75" y="0.75" width="998.5" height="1166.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Oftalmología · miopía</tspan></text><rect x="327.8" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="408.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="408.9" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Miopía</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ojo demasiado largo o con poder dióptrico excesivo.</tspan><tspan x="58.0" dy="17">Las imágenes lejanas se enfocan delante de la retina.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 12 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">«Ve bien de cerca» y contrae los párpados para ver de</tspan><tspan x="640.0" dy="16">lejos.</tspan><tspan x="640.0" dy="16">¿Diagnóstico?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL DEFECTO ÓPTICO AL SÍNTOMA</tspan></text><text x="40.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">QUÉ OCURRE</tspan></text><text x="516.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ VE EL PACIENTE</tspan></text><rect x="40.0" y="307.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="336.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="333.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Ojo largo o poder dióptrico alto</tspan></text><text x="84.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Longitud axial aumentada</tspan></text><line x1="476.0" y1="336.5" x2="503.0" y2="336.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,331.5 502.0,341.5 510.0,336.5" fill="#ea580c"/><rect x="516.0" y="309.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="333.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Predisposición familiar y poco aire libre</tspan></text><text x="530.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="368.0" x2="255.0" y2="381.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,380.0 260.0,380.0 255.0,388.0" fill="#0f766e"/><rect x="40.0" y="390.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="419.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="424.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="416.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">La imagen lejana cae delante de la retina</tspan></text><text x="84.0" y="433.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Foco anterior a la retina</tspan></text><line x1="476.0" y1="419.5" x2="503.0" y2="419.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,414.5 502.0,424.5 510.0,419.5" fill="#ea580c"/><rect x="516.0" y="392.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Visión lejana borrosa</tspan></text><text x="530.0" y="433.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Síntoma principal</tspan></text><line x1="255.0" y1="451.0" x2="255.0" y2="464.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,463.0 260.0,463.0 255.0,471.0" fill="#0f766e"/><rect x="40.0" y="473.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="502.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="507.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="499.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">La imagen cercana sí llega a la retina</tspan></text><text x="84.0" y="516.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Los rayos divergentes alcanzan el foco</tspan></text><line x1="476.0" y1="502.5" x2="503.0" y2="502.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,497.5 502.0,507.5 510.0,502.5" fill="#ea580c"/><rect x="516.0" y="475.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="499.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Visión cercana nítida</tspan></text><text x="530.0" y="516.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">«Ve bien de cerca»</tspan></text><line x1="255.0" y1="534.0" x2="255.0" y2="547.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,546.0 260.0,546.0 255.0,554.0" fill="#0f766e"/><rect x="40.0" y="556.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="585.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="590.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="582.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Entrecierra los párpados</tspan></text><text x="84.0" y="599.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Reduce el círculo de desenfoque</tspan></text><line x1="476.0" y1="585.5" x2="503.0" y2="585.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,580.5 502.0,590.5 510.0,585.5" fill="#ea580c"/><rect x="516.0" y="558.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="582.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Mejora transitoriamente la visión lejana</tspan></text><text x="530.0" y="599.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Efecto estenopeico</tspan></text><line x1="255.0" y1="617.0" x2="255.0" y2="630.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,629.0 260.0,629.0 255.0,637.0" fill="#0f766e"/><rect x="40.0" y="639.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="668.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="673.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">5</tspan></text><text x="84.0" y="665.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Corrección</tspan></text><text x="84.0" y="682.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Refracción con cicloplejía y lentes negativas</tspan></text><line x1="476.0" y1="668.5" x2="503.0" y2="668.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,663.5 502.0,673.5 510.0,668.5" fill="#ea580c"/><rect x="516.0" y="641.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="665.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Atropina baja dosis si progresa</tspan></text><text x="530.0" y="682.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Frena la elongación axial</tspan></text><rect x="40.0" y="716.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="742.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ve bien de cerca + entrecierra para ver de lejos = miopía</tspan></text><text x="60.0" y="761.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hipermetropía, astigmatismo y anisometropía no explican la visión cercana nítida.</tspan></text><text x="40.0" y="828.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="838.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="860.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipermetropía</tspan></text><text x="435.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Astigmatismo</tspan></text><text x="585.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Anisometropía</tspan></text><rect x="663.0" y="841.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Miopía</tspan></text><text x="885.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Glaucoma</tspan></text><rect x="40.0" y="875.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="875.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="904.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="896.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ve mal de cerca y</tspan><tspan x="285.0" dy="16">compensa</tspan><tspan x="285.0" dy="16">acomodando</tspan></text><text x="435.0" y="904.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: borrosidad a todas</tspan><tspan x="435.0" dy="16">las distancias</tspan></text><text x="585.0" y="896.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: diferencia de</tspan><tspan x="585.0" dy="16">graduación; riesgo de</tspan><tspan x="585.0" dy="16">ambliopía</tspan></text><text x="735.0" y="896.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: ve bien de cerca y</tspan><tspan x="735.0" dy="16">entrecierra para ver de</tspan><tspan x="735.0" dy="16">lejos</tspan></text><text x="885.0" y="904.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es un defecto</tspan><tspan x="885.0" dy="16">refractivo</tspan></text><rect x="40.0" y="838.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="965.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="993.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1015.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Aparece en la edad escolar y progresa en la adolescencia; riesgos: antecedente familiar y poco tiempo al aire libre.</tspan><tspan x="58.0" dy="18">• Entrecerrar los párpados reduce el círculo de desenfoque (efecto estenopeico). Hipermetropía: mala visión cercana; astigmatismo: borrosidad a todas las</tspan><tspan x="58.0" dy="18">   distancias.</tspan><tspan x="58.0" dy="18">• Diagnóstico: refracción con cicloplejía; corrección con lentes negativas. Para frenar la elongación axial: atropina en dosis bajas, lentes de desenfoque</tspan><tspan x="58.0" dy="18">   periférico, ortoqueratología.</tspan><tspan x="58.0" dy="18">• Alerta: controlar el fondo de ojo por el riesgo de degeneración miópica y desprendimiento de retina.</tspan></text><text x="58.0" y="1127.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Consenso de manejo de la miopía en niños (Korean J Ophthalmol 2026); Kanski Oftalmología Clínica 9.ª ed. (2020)</tspan></text></svg>