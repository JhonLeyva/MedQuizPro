<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1249" viewBox="0 0 1000 1249" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La anomalía venosa del desarrollo (angioma venoso) sangra muy poco: 0,2 a 0,7 % por año"><title>La anomalía venosa del desarrollo (angioma venoso) sangra muy poco: 0,2 a 0,7 % por año</title><rect x="0.75" y="0.75" width="998.5" height="1247.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · malformaciones vasculares cerebrales</tspan></text><rect x="503.6" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="560.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="560.5" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Malformaciones vasculares</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Incluyen la malformación arteriovenosa, el cavernoma, la telangiectasia capilar y la</tspan><tspan x="58.0" dy="17">anomalía venosa del desarrollo.</tspan><tspan x="58.0" dy="17">La anomalía venosa es la más frecuente.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de estas lesiones vasculares tiene el menor</tspan><tspan x="640.0" dy="16">riesgo de sangrado intracraneal?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIESGO ANUAL DE SANGRADO SEGÚN LA LESIÓN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Riesgo de hemorragia por año</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Entre las lesiones con cifra publicada, la anomalía venosa queda en el extremo bajo.</tspan></text><rect x="70.0" y="378.0" width="172.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="156.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="162"><tspan x="156.0" dy="0">Angioma venoso</tspan></text><rect x="414.0" y="378.0" width="344.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="586.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="334"><tspan x="586.0" dy="0">MAV: 2 a 4 %</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0 %</tspan></text><line x1="242.0" y1="418.0" x2="242.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="242.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="242.0" dy="0">1 %</tspan></text><line x1="414.0" y1="418.0" x2="414.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="414.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="414.0" dy="0">2 %</tspan></text><line x1="586.0" y1="418.0" x2="586.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="586.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="586.0" dy="0">3 %</tspan></text><line x1="758.0" y1="418.0" x2="758.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="758.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="758.0" dy="0">4 %</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">5 %</tspan></text><polygon points="147.0,364.0 165.0,364.0 156.0,376.0" fill="#ea580c"/><rect x="52.0" y="338.0" width="256.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="180.0" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="244"><tspan x="180.0" dy="0">◆ ANGIOMA VENOSO: 0,2 A 0,7 % POR AÑO</tspan></text><text x="40.0" y="486.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE CON CADA LESIÓN</tspan></text><rect x="40.0" y="496.0" width="297.3" height="102.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="497.0" width="6.0" height="100.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Angioma venoso incidental</tspan></text><text x="58.0" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Observación; no se opera por el riesgo de infarto</tspan><tspan x="58.0" dy="16">venoso</tspan></text><rect x="351.3" y="496.0" width="297.3" height="102.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="497.0" width="6.0" height="100.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Cavernoma incidental</tspan></text><text x="369.3" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Sin cirugía salvo epilepsia refractaria o sangrado</tspan><tspan x="369.3" dy="16">recurrente</tspan></text><rect x="662.7" y="496.0" width="297.3" height="102.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="497.0" width="6.0" height="100.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Aneurismas y malformación</tspan><tspan x="680.7" dy="17">arteriovenosa</tspan></text><text x="680.7" y="558.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Riesgo de hemorragia alto: valoración</tspan><tspan x="680.7" dy="16">neuroquirúrgica o endovascular</tspan></text><text x="40.0" y="632.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIESGO DE SANGRADO SEGÚN LA LESIÓN VASCULAR</tspan></text><rect x="40.0" y="644.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Lesión</tspan></text><text x="360.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="289"><tspan x="360.0" dy="0">Riesgo de hemorragia</tspan></text><text x="665.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="289"><tspan x="665.0" dy="0">Dato clave</tspan></text><rect x="40.0" y="673.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="692.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Anomalía venosa (angioma venoso)</tspan></text><text x="360.0" y="692.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="289"><tspan x="360.0" dy="0">0,2 a 0,7 % por año</tspan></text><text x="665.0" y="692.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="289"><tspan x="665.0" dy="0">Cabeza de medusa; conservador</tspan></text><rect x="250.6" y="676.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="296.0" y="691.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="296.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="702.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="721.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Malformación arteriovenosa</tspan></text><text x="360.0" y="721.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="289"><tspan x="360.0" dy="0">2 a 4 % por año</tspan></text><text x="665.0" y="721.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="289"><tspan x="665.0" dy="0">Cortocircuito arteriovenoso</tspan></text><rect x="40.0" y="731.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="750.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Cavernoma</tspan></text><text x="360.0" y="750.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="289"><tspan x="360.0" dy="0">Variable según ubicación y sangrado previo</tspan></text><text x="665.0" y="750.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="289"><tspan x="665.0" dy="0">Cirugía solo si epilepsia refractaria o sangrado</tspan><tspan x="665.0" dy="15">recurrente</tspan></text><rect x="40.0" y="775.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="794.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Aneurisma (incluido micótico)</tspan></text><text x="360.0" y="794.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="289"><tspan x="360.0" dy="0">Alta morbimortalidad al romperse</tspan></text><text x="665.0" y="794.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="289"><tspan x="665.0" dy="0">Micótico: endocarditis</tspan></text><text x="40.0" y="844.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="854.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="893.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cavernoma</tspan></text><text x="435.0" y="885.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Aneurisma micótico</tspan><tspan x="435.0" dy="17">de la ACM</tspan></text><rect x="513.0" y="857.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Angioma venoso</tspan></text><text x="735.0" y="876.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Aneurisma de</tspan><tspan x="735.0" dy="17">comunicante</tspan><tspan x="735.0" dy="17">anterior</tspan></text><text x="885.0" y="885.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Malformación</tspan><tspan x="885.0" dy="17">arteriovenosa</tspan></text><rect x="40.0" y="925.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="925.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="962.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Menor riesgo de</tspan><tspan x="54.0" dy="16">sangrado?</tspan></text><text x="285.0" y="962.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: riesgo variable,</tspan><tspan x="285.0" dy="16">mayor si sangró antes</tspan></text><text x="435.0" y="962.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se rompe con alta</tspan><tspan x="435.0" dy="16">morbimortalidad</tspan></text><text x="585.0" y="954.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: 0,2 a 0,7 % por</tspan><tspan x="585.0" dy="16">año, hallazgo</tspan><tspan x="585.0" dy="16">incidental</tspan></text><text x="735.0" y="946.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el aneurisma</tspan><tspan x="735.0" dy="16">comunicante anterior</tspan><tspan x="735.0" dy="16">se rompe con</tspan><tspan x="735.0" dy="16">frecuencia</tspan></text><text x="885.0" y="970.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: 2 a 4 % por año</tspan></text><rect x="40.0" y="854.0" width="920.0" height="153.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1031.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1059.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1081.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Angioma venoso: venas medulares que convergen en una vena colectora; variante del drenaje normal; en la resonancia tiene aspecto de cabeza de</tspan><tspan x="58.0" dy="18">   medusa.</tspan><tspan x="58.0" dy="18">• Riesgo de hemorragia 0,2 a 0,7 % por año, casi siempre por un cavernoma asociado o por trombosis de la vena de drenaje.</tspan><tspan x="58.0" dy="18">• Malformación arteriovenosa: 2 a 4 % por año. Cavernoma: riesgo variable según ubicación y sangrado previo. Aneurismas (incluido el micótico): alta</tspan><tspan x="58.0" dy="18">   morbimortalidad.</tspan><tspan x="58.0" dy="18">• Conducta: no se opera, porque resecarlo causa infarto venoso; solo se interviene un cavernoma por epilepsia refractaria o sangrado recurrente.</tspan></text><text x="58.0" y="1193.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Epileptic Disord 2023, revisión sistemática de anomalías venosas del desarrollo y epilepsia; J Neurosurg 2017, hemorragia en malformaciones cavernosas cerebrales;</tspan><tspan x="58.0" dy="15">Harrison, 21.ª ed. (2022).</tspan></text></svg>