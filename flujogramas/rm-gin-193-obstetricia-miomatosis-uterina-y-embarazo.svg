<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1119" viewBox="0 0 1000 1119" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los miomas en el embarazo aumentan el riesgo de parto pretérmino; la placenta previa se liga a los submucosos"><title>Los miomas en el embarazo aumentan el riesgo de parto pretérmino; la placenta previa se liga a los submucosos</title><rect x="0.75" y="0.75" width="998.5" height="1117.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · miomatosis uterina y embarazo</tspan></text><rect x="461.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="540.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="540.9" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Miomas en la gestación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Presentes en 2 a 10 % de los embarazos.</tspan><tspan x="58.0" dy="17">Su efecto depende del tamaño, el número y la localización.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 31 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Miomas subserosos conocidos, un solo feto, altura</tspan><tspan x="640.0" dy="16">uterina de 38 cm.</tspan><tspan x="640.0" dy="16">¿Cuál es la complicación más probable?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE PIENSA EN ESTE ORDEN</tspan></text><rect x="40.0" y="285.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="330.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="358.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="285.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="313.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué hacen los miomas en el embarazo?</tspan></text><rect x="136.0" y="327.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="347.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Crecen con los estrógenos y distorsionan la cavidad</tspan></text><text x="152.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Irritan el útero; la degeneración roja da dolor y febrícula.</tspan></text><line x1="77.0" y1="388.0" x2="77.0" y2="407.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,406.0 82.0,406.0 77.0,414.0" fill="#0f766e"/><text x="134.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="416.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="461.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="489.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="416.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="444.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué complicación es la más probable?</tspan></text><rect x="136.0" y="458.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="478.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Parto pretérmino</tspan></text><text x="152.0" y="497.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">También desprendimiento, presentación anómala, cesárea y hemorragia posparto.</tspan></text><line x1="77.0" y1="519.0" x2="77.0" y2="538.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,537.0 82.0,537.0 77.0,545.0" fill="#0f766e"/><text x="134.0" y="537.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="547.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="592.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="620.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="547.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="575.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Y las otras opciones?</tspan></text><rect x="136.0" y="589.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="609.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Placenta previa: sobre todo submucosos o cervicales</tspan></text><text x="152.0" y="628.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Hipertensión, polihidramnios y rotura de membranas tienen otras causas.</tspan></text><rect x="40.0" y="668.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="694.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Miomas subserosos en el embarazo = riesgo de parto pretérmino</tspan></text><text x="60.0" y="713.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La placenta previa se asocia a miomas submucosos o cercanos al cuello.</tspan></text><text x="40.0" y="780.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="790.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="821.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="793.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Parto pretérmino</tspan></text><text x="435.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hipertensión</tspan><tspan x="435.0" dy="17">gestacional</tspan></text><text x="585.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Placenta previa</tspan></text><text x="735.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Rotura prematura</tspan><tspan x="735.0" dy="17">de membranas</tspan></text><text x="885.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Polihidramnios</tspan></text><rect x="40.0" y="844.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="844.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="873.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Complicación más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="873.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: mayor irritabilidad y</tspan><tspan x="285.0" dy="16">distorsión uterina</tspan></text><text x="435.0" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin relación</tspan><tspan x="435.0" dy="16">establecida con los</tspan><tspan x="435.0" dy="16">miomas</tspan></text><text x="585.0" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se liga a miomas</tspan><tspan x="585.0" dy="16">submucosos o</tspan><tspan x="585.0" dy="16">cervicales</tspan></text><text x="735.0" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se vincula a</tspan><tspan x="735.0" dy="16">infecciones</tspan><tspan x="735.0" dy="16">cervicovaginales</tspan></text><text x="885.0" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se vincula a</tspan><tspan x="885.0" dy="16">diabetes o anomalías</tspan><tspan x="885.0" dy="16">fetales</tspan></text><rect x="40.0" y="790.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="934.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="962.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="984.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los estrógenos pueden aumentar su volumen en el primer trimestre; la degeneración roja da dolor y febrícula.</tspan><tspan x="58.0" dy="18">• Aumentan el parto pretérmino, el desprendimiento de placenta, la presentación anómala, la cesárea y la hemorragia posparto.</tspan><tspan x="58.0" dy="18">• La placenta previa y el acretismo se ven sobre todo con miomas submucosos o cercanos al cuello; no hay relación establecida con hipertensión</tspan><tspan x="58.0" dy="18">   gestacional.</tspan><tspan x="58.0" dy="18">• Manejo expectante con analgesia, reposo e hidratación; no se hace miomectomía en el embarazo ni en la cesárea, salvo pediculados.</tspan></text><text x="58.0" y="1078.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Stout MJ et al., Obstet Gynecol 2010; ACOG, Practice Bulletin 228 (2021); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>