"340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Ictericia: ¿apareció antes de las 24 horas?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">HEMÓLISIS: INCOMPATIBILIDAD ABO</tspan></text><text x="266.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Bilirrubina, Coombs, Hb</tspan><tspan x="266.5" dy="17">Fototerapia según curvas</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Fisiológica o por lactancia</tspan></text><text x="733.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Medir y vigilar</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="573.5" width="920.0" height="323.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="587.5" width="166.8" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="139.4" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="139.4" dy="0">ZONAS DE KRAMER</tspan></text><text x="238.8" y="607.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="703"><tspan x="238.8" dy="0">La ictericia avanza de la cabeza a los pies; solo orienta, se confirma con bilirrubina.</tspan></text><rect x="56.0" y="647.5" width="168.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="648.1" width="166.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="140.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">ZONA 1</tspan></text><text x="140.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">Cabeza y cuello</tspan></text><circle cx="72.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">≈ 5-6 mg/dL</tspan></text><rect x="236.0" y="647.5" width="168.0" height="98.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="237.2" y="648.7" width="165.6" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="320.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">ZONA 2</tspan></text><text x="320.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">Hasta el ombligo</tspan></text><circle cx="252.0" cy="720.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="262.0" y="724.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="262.0" dy="0">≈ 9 mg/dL</tspan></text><rect x="274.6" y="636.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="320.0" y="651.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="320.0" dy="0">◆ ESTE CASO</tspan></text><rect x="416.0" y="647.5" width="168.0" height="98.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="417.2" y="648.7" width="165.6" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="500.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">ZONA 3</tspan></text><text x="500.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">Hasta las rodillas</tspan></text><circle cx="432.0" cy="720.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="442.0" y="724.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">≈ 12 mg/dL</tspan></text><rect x="454.6" y="636.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="651.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="596.0" y="647.5" width="168.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="648.1" width="166.8" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="680.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">ZONA 4</tspan></text><text x="680.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">Brazos y piernas</tspan></text><circle cx="612.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">≈ 15 mg/dL</tspan></text><rect x="776.0" y="647.5" width="168.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="648.1" width="166.8" height="63.0" rx="9" fill="#fecaca" stroke="none" stroke-width="0"/><text x="860.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">ZONA 5</tspan></text><text x="860.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">Palmas y plantas</tspan></text><circle cx="792.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="802.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">&gt; 15 mg/dL</tspan></text><text x="56.0" y="775.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="784.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="799.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="799.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Llega al abdomen: zona 2 a 3 a las 18 horas</tspan></text><rect x="56.0" y="806.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="821.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="821.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Antes de 24 horas cualquier ictericia visible es patológica</tspan></text><rect x="56.0" y="843.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="866.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Bilirrubina total y Coombs ya; fototerapia según las curvas de la AAP.</tspan></text><text x="40.0" y="936.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="946.5" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="994.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="994.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ictericia fisiológica</tspan></text><text x="435.0" y="986.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ictericia por leche</tspan><tspan x="435.0" dy="17">materna</tspan></text><rect x="513.0" y="949.5" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="969.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Enfermedad</tspan><tspan x="585.0" dy="17">hemolítica por</tspan><tspan x="585.0" dy="17">incompatibilidad</tspan><tspan x="585.0" dy="17">ABO</tspan></text><text x="735.0" y="986.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Atresia de vías</tspan><tspan x="735.0" dy="17">biliares</tspan></text><text x="885.0" y="994.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome de Gilbert</tspan></text><rect x="40.0" y="1034.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1034.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1063.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más probable?</tspan></text><text x="285.0" y="1055.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: nunca antes de 24</tspan><tspan x="285.0" dy="16">h</tspan></text><text x="435.0" y="1055.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: después de la 1.ª</tspan><tspan x="435.0" dy="16">semana</tspan></text><text x="585.0" y="1055.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: madre O, hijo A, &lt;</tspan><tspan x="585.0" dy="16">24 h</tspan></text><text x="735.0" y="1055.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: bilirrubina directa,</tspan><tspan x="735.0" dy="16">heces claras, semanas</tspan></text><text x="885.0" y="1055.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: leve, en ayuno o</tspan><tspan x="885.0" dy="16">enfermedad</tspan></text><rect x="40.0" y="946.5" width="920.0" height="138.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1108.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1136.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1158.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Medir bilirrubina total (no confiar en el ojo), Coombs directo, hemoglobina y reticulocitos.</tspan><tspan x="58.0" dy="18">• Fototerapia según las curvas de la AAP 2022 (edad en horas y factores de riesgo); exanguinotransfusión si no responde.</tspan><tspan x="58.0" dy="18">• La ictericia fisiológica aparece después de las 24 horas; la de la leche materna, después de la primera semana.</tspan></text><text x="58.0" y="1216.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Clinical practice guideline: hyperbilirubinemia in the newborn ≥ 35 weeks (2022); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>