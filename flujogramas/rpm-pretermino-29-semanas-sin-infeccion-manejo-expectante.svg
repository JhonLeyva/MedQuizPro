<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="967" viewBox="0 0 1000 967" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="RPM pretérmino a las 29 semanas sin infección: manejo expectante"><title>RPM pretérmino a las 29 semanas sin infección: manejo expectante</title><rect x="0.75" y="0.75" width="998.5" height="965.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Rotura prematura de membranas pretérmino</tspan></text><rect x="463.2" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="550.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="550.4" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">RPM pretérmino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La edad gestacional y la infección deciden: esperar o terminar.</tspan><tspan x="58.0" dy="17">Antes de las 34 semanas, sin infección ni compromiso fetal, se gana tiempo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Secundigesta de 29 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pérdida de líquido claro desde hace 3 días.</tspan><tspan x="640.0" dy="16">Afebril, útero indoloro, sin dinámica, LCF 150.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">IMAGEN DEL CASO Y SEMÁFORO DE CONDUCTA</tspan></text><rect x="40.0" y="269.0" width="310.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="128.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">MEMBRANAS ROTAS</tspan></text><g data-box="60.0 305.0 270.0 300.0"><g transform="translate(62.0,305.0) scale(0.88)"><ellipse cx="150" cy="150" rx="124" ry="142" fill="#fbcfe8" stroke="#be185d" stroke-width="3" /><ellipse cx="150" cy="150" rx="108" ry="126" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" /><path d="M40 70 C80 20 170 10 230 30 L210 62 C160 44 100 50 62 88 Z" fill="#9f1239" stroke="#881337" stroke-width="1.5" stroke-linejoin="round" /><ellipse cx="155.7" cy="124.4" rx="41.8" ry="55.099999999999994" fill="#fcd5b5" stroke="#e9b48f" stroke-width="1.6" transform="rotate(-10 155.7 124.4)" /><circle cx="150" cy="202.3" r="34.199999999999996" fill="#fcd5b5" stroke="#e9b48f" stroke-width="1.6" /><path d="M178.5 103.5 q26 17.099999999999998 8 41.8" fill="none" stroke="#e9b48f" stroke-width="4.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M123.4 151.0 q-18 20.9 6 34.199999999999996" fill="none" stroke="#e9b48f" stroke-width="4.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M138 288 L138 324 M162 288 L162 324" fill="none" stroke="#be185d" stroke-width="8" stroke-linejoin="round" /><path d="M146 330 q3 6 0 10" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1"/><path d="M154 334 q3 6 0 10" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1"/><text x="214" y="326" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">líquido claro</text><text x="214" y="326" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="start" data-max="0">líquido claro</text><path d="M142 290 L158 290" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" /><text x="250" y="60" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">placenta</text><text x="250" y="60" font-size="10" font-weight="800" fill="#9f1239" text-anchor="start" data-max="0">placenta</text></g></g><rect x="48.0" y="621.0" width="294.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="195.0" y="642.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">Líquido claro que sale por el cuello; sin signos de</tspan><tspan x="195.0" dy="15">infección.</tspan></text><text x="370.0" y="281.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="590"><tspan x="370.0" dy="0">¿HAY MOTIVO PARA TERMINAR?</tspan></text><rect x="370.0" y="291.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="305.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="309.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="309.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Sin fiebre ni taquicardia materna o fetal</tspan></text><rect x="370.0" y="323.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="337.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="341.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="341.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Útero indoloro, líquido claro</tspan></text><rect x="370.0" y="355.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="369.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="373.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="373.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Sin trabajo de parto</tspan></text><rect x="370.0" y="387.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="401.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="405.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="405.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">29 semanas: prematuro extremo si nace</tspan></text><rect x="370.0" y="429.0" width="590.0" height="66.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><circle cx="400.0" cy="462.0" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="462.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">&lt; 34 semanas sin infección</tspan></text><text x="430.0" y="468.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Expectante</tspan></text><text x="430.0" y="484.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Antibiótico, corticoides, magnesio si &lt; 32 sem; vigilar.</tspan></text><rect x="854.6" y="418.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="433.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ ESTE CASO</tspan></text><rect x="370.0" y="503.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="536.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="536.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="525.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">≥ 34 semanas</tspan></text><text x="430.0" y="542.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Terminar la gestación</tspan></text><text x="430.0" y="558.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Inducción si no hay contraindicación.</tspan></text><rect x="370.0" y="577.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="610.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="610.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="599.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Corioamnionitis, DPP o compromiso fetal</tspan></text><text x="430.0" y="616.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Terminar ya</tspan></text><text x="430.0" y="632.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Con antibiótico; vía según condiciones.</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="745.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Cesárea de emergencia</tspan></text><text x="491.2" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Cesárea a las 35 sem</tspan></text><text x="678.8" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Inducir</tspan></text><rect x="775.5" y="726.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Expectante</tspan></text><rect x="40.0" y="760.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="760.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="781.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sin indicación</tspan></text><text x="491.2" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Se termina a las 34</tspan></text><text x="678.8" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Prematurez innecesaria</tspan></text><text x="866.2" y="781.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Ninguno</tspan></text><rect x="40.0" y="723.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="818.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="846.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="868.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• RPM &lt; 34 semanas sin corioamnionitis ni sufrimiento fetal: manejo expectante hospitalizado.</tspan><tspan x="58.0" dy="18">• Antibiótico (prolonga la latencia), corticoides y sulfato de magnesio si &lt; 32 semanas.</tspan><tspan x="58.0" dy="18">• Terminar si aparece infección, desprendimiento, compromiso fetal o al llegar a las 34 semanas.</tspan></text><text x="58.0" y="926.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletins n.º 217 (2020); MINSA Perú.</tspan></text></svg>