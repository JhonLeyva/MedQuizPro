<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1062" viewBox="0 0 1000 1062" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El período de incubación del sarampión hasta el pródromo es de 8 a 12 días"><title>El período de incubación del sarampión hasta el pródromo es de 8 a 12 días</title><rect x="0.75" y="0.75" width="998.5" height="1060.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · sarampión</tspan></text><rect x="327.1" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="376.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="376.2" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sarampión</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Virus de la familia Paramyxoviridae; muy contagioso (R0 de 12 a 18), por vía aérea.</tspan><tspan x="58.0" dy="17">Contagia desde 4 días antes hasta 4 días después del exantema.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el período de incubación del sarampión?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÍAS DESDE LA EXPOSICIÓN HASTA CADA ETAPA DEL SARAMPIÓN</tspan></text><rect x="40.0" y="253.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="279.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Días desde la exposición</tspan></text><text x="60.0" y="298.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El pródromo comienza a los 8 a 12 días; el exantema, en promedio a los 14.</tspan></text><rect x="70.0" y="362.0" width="327.6" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="233.8" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="318"><tspan x="233.8" dy="0">Menos de 8: aún sin síntomas</tspan></text><rect x="397.6" y="362.0" width="204.8" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="500.0" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="195"><tspan x="500.0" dy="0">8 a 12: hasta el pródromo</tspan></text><rect x="602.4" y="362.0" width="327.6" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="766.2" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="318"><tspan x="766.2" dy="0">14 (7 a 21): exantema</tspan></text><line x1="70.0" y1="402.0" x2="70.0" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0 d</tspan></text><line x1="192.9" y1="402.0" x2="192.9" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="192.9" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="192.9" dy="0">3 d</tspan></text><line x1="356.7" y1="402.0" x2="356.7" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">7 d</tspan></text><line x1="397.6" y1="402.0" x2="397.6" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="397.6" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="397.6" dy="0">8 d</tspan></text><line x1="561.4" y1="402.0" x2="561.4" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="561.4" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="561.4" dy="0">12 d</tspan></text><line x1="643.3" y1="402.0" x2="643.3" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">14 d</tspan></text><line x1="930.0" y1="402.0" x2="930.0" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">21 d</tspan></text><polygon points="470.5,348.0 488.5,348.0 479.5,360.0" fill="#ea580c"/><rect x="349.6" y="322.0" width="259.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="479.5" y="337.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="248"><tspan x="479.5" dy="0">◆ INCUBACIÓN: 8 A 12 DÍAS (PROMEDIO 10)</tspan></text><text x="40.0" y="470.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DECIDE LA OPCIÓN</tspan></text><rect x="40.0" y="480.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="481.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">8 a 12 días</tspan></text><text x="58.0" y="525.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Incubación hasta el pródromo: la clave</tspan></text><rect x="351.3" y="480.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="481.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">14 (7 a 21) días</tspan></text><text x="369.3" y="525.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Tiempo hasta el exantema, no la incubación</tspan></text><rect x="662.7" y="480.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="481.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">14 a 21 o más de 14 días</tspan></text><text x="680.7" y="525.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Se acercan a la rubéola o la varicela</tspan></text><text x="40.0" y="583.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INCUBACIÓN DE ENFERMEDADES EXANTEMÁTICAS</tspan></text><rect x="40.0" y="595.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Enfermedad</tspan></text><text x="260.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Incubación</tspan></text><rect x="40.0" y="624.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Sarampión</tspan></text><text x="260.0" y="643.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">8 a 12 días hasta el pródromo; exantema a los 14 (7 a 21)</tspan></text><rect x="150.6" y="627.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="642.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="653.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="672.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Rubéola</tspan></text><text x="260.0" y="672.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">14 a 21 días</tspan></text><rect x="40.0" y="682.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="701.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Varicela</tspan></text><text x="260.0" y="701.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">10 a 21 días</tspan></text><text x="40.0" y="727.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Nota del banco: el libro toma 8 a 12 días (hasta el pródromo); hasta el exantema son 14 días.</tspan></text><text x="40.0" y="774.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="784.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="806.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="806.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">14 a 21 días</tspan></text><text x="435.0" y="806.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mayor de 14 días</tspan></text><text x="585.0" y="806.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">1 a 3 días</tspan></text><text x="735.0" y="806.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">3 a 7 días</tspan></text><rect x="813.0" y="787.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="806.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">8 a 12 días</tspan></text><rect x="40.0" y="821.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="821.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="850.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Incubación?</tspan></text><text x="285.0" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se acerca a la</tspan><tspan x="285.0" dy="16">rubéola</tspan></text><text x="435.0" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se acerca a la</tspan><tspan x="435.0" dy="16">rubéola o la varicela</tspan></text><text x="585.0" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: incubación</tspan><tspan x="585.0" dy="16">demasiado corta</tspan></text><text x="735.0" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: incubación</tspan><tspan x="735.0" dy="16">demasiado corta</tspan></text><text x="885.0" y="842.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: hasta el pródromo,</tspan><tspan x="885.0" dy="16">promedio 10 días</tspan></text><rect x="40.0" y="784.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="895.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="923.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="945.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Incubación hasta el pródromo: 8 a 12 días (promedio 10). El exantema aparece en promedio a los 14 días de la exposición, con rango de 7 a 21.</tspan><tspan x="58.0" dy="18">• Pródromo de 2 a 4 días: fiebre alta, tos, coriza y conjuntivitis (las tres C) y manchas de Koplik; luego exantema maculopapular cefalocaudal confluente.</tspan><tspan x="58.0" dy="18">• Rubéola incuba 14 a 21 días y varicela 10 a 21; 1 a 3 y 3 a 7 días corresponden a enfermedades de incubación corta.</tspan><tspan x="58.0" dy="18">• Alerta: notificación inmediata de todo caso sospechoso y aislamiento; vitamina A al niño enfermo; prevención con SPR a los 12 meses y refuerzo.</tspan></text><text x="58.0" y="1021.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Red Book 2024-2027, 33.ª ed. (2024); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>