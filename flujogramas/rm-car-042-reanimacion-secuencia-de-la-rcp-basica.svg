<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1119" viewBox="0 0 1000 1119" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la RCP básica se comprime antes de ventilar: secuencia C-A-B"><title>En la RCP básica se comprime antes de ventilar: secuencia C-A-B</title><rect x="0.75" y="0.75" width="998.5" height="1117.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reanimación · secuencia de la RCP básica</tspan></text><rect x="451.4" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="510.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="510.0" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">RCP básica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Prioridad: generar flujo sanguíneo al corazón y al cerebro lo antes posible.</tspan><tspan x="58.0" dy="17">Secuencia contemporánea C-A-B.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paro cardiorrespiratorio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Inconsciente y sin respiración normal.</tspan><tspan x="640.0" dy="16">¿Qué se hace primero?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SECUENCIA DE LA RCP BÁSICA EN EL ADULTO</tspan></text><text x="44.0" y="283.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Primero circulación, después vía aérea y ventilación.</tspan></text><line x1="155.0" y1="322.0" x2="293.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="322.0" x2="477.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="322.0" x2="661.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="322.0" x2="845.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">1</tspan></text><rect x="45.0" y="356.0" width="174.0" height="91.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Comprobar y activar</tspan></text><text x="132.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Inconsciente, sin respiración</tspan><tspan x="132.0" dy="16">normal; llamar y pedir el</tspan><tspan x="132.0" dy="16">desfibrilador</tspan></text><circle cx="316.0" cy="322.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="316.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">2</tspan></text><rect x="229.0" y="356.0" width="174.0" height="91.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="316.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">C: compresiones</tspan></text><text x="316.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">5 a 6 cm, 100 a 120 por</tspan><tspan x="316.0" dy="16">minuto, reexpansión completa</tspan></text><rect x="276.5" y="436.0" width="78.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="316.0" y="451.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="316.0" dy="0">◆ PRIMERO</tspan></text><circle cx="500.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3</tspan></text><rect x="413.0" y="356.0" width="174.0" height="91.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">A: vía aérea</tspan></text><text x="500.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Inclinar la cabeza y elevar el</tspan><tspan x="500.0" dy="16">mentón</tspan></text><circle cx="684.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">4</tspan></text><rect x="597.0" y="356.0" width="174.0" height="91.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">B: 2 ventilaciones</tspan></text><text x="684.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Por cada 30 compresiones;</tspan><tspan x="684.0" dy="16">pausa menor de 10 segundos</tspan></text><circle cx="868.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">5</tspan></text><rect x="781.0" y="356.0" width="174.0" height="91.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Desfibrilar</tspan></text><text x="868.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Con el desfibrilador apenas</tspan><tspan x="868.0" dy="16">esté disponible</tspan></text><rect x="40.0" y="479.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="505.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">RCP básica = compresiones primero</tspan></text><text x="60.0" y="524.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ventilar primero, dar fármacos o inmovilizar el cuello retrasa la circulación.</tspan></text><text x="40.0" y="585.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CALIDAD DE LA RCP DEL ADULTO</tspan></text><rect x="40.0" y="597.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="616.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Parámetro</tspan></text><text x="250.0" y="616.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Valor</tspan></text><text x="610.0" y="616.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Nota</tspan></text><rect x="40.0" y="626.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="645.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Secuencia</tspan></text><text x="250.0" y="645.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">C-A-B: compresiones, vía aérea, ventilación</tspan></text><text x="610.0" y="645.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Reemplaza al antiguo A-B-C</tspan></text><rect x="140.6" y="629.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="644.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="655.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="674.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Profundidad</tspan></text><text x="250.0" y="674.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">5 a 6 cm</tspan></text><text x="610.0" y="674.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Reexpansión completa del tórax</tspan></text><rect x="40.0" y="684.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="703.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Frecuencia</tspan></text><text x="250.0" y="703.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">100 a 120 por minuto</tspan></text><text x="610.0" y="703.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Minimizar las interrupciones</tspan></text><rect x="40.0" y="713.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="732.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Relación</tspan></text><text x="250.0" y="732.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">30 compresiones por 2 ventilaciones</tspan></text><text x="610.0" y="732.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Pausas de menos de 10 segundos</tspan></text><text x="40.0" y="782.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="792.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="831.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="823.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ventilación antes</tspan><tspan x="285.0" dy="17">del masaje</tspan></text><text x="435.0" y="823.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fármacos antes del</tspan><tspan x="435.0" dy="17">masaje</tspan></text><rect x="513.0" y="795.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="814.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Masaje cardiaco</tspan><tspan x="585.0" dy="17">antes de la</tspan><tspan x="585.0" dy="17">ventilación</tspan></text><text x="735.0" y="814.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Avisar a bomberos</tspan><tspan x="735.0" dy="17">después de la</tspan><tspan x="735.0" dy="17">desfibrilación</tspan></text><text x="885.0" y="823.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Collarín cervical</tspan><tspan x="885.0" dy="17">antes del masaje</tspan></text><rect x="40.0" y="863.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="863.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="892.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué se usa?</tspan></text><text x="285.0" y="884.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: retrasa las</tspan><tspan x="285.0" dy="16">compresiones</tspan></text><text x="435.0" y="884.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: son del soporte</tspan><tspan x="435.0" dy="16">vital avanzado</tspan></text><text x="585.0" y="892.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: secuencia C-A-B</tspan></text><text x="735.0" y="884.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la cadena se activa</tspan><tspan x="735.0" dy="16">desde el inicio</tspan></text><text x="885.0" y="884.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no debe demorar</tspan><tspan x="885.0" dy="16">el masaje</tspan></text><rect x="40.0" y="792.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="937.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="965.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="987.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Comprobar la inconsciencia y la ausencia de respiración normal, activar el sistema de emergencia y pedir el desfibrilador.</tspan><tspan x="58.0" dy="18">• Compresiones en el centro del tórax: 5 a 6 cm de profundidad, 100 a 120 por minuto, con reexpansión completa y pocas interrupciones.</tspan><tspan x="58.0" dy="18">• Luego abrir la vía aérea (frente-mentón) y dar 2 ventilaciones por cada 30 compresiones. Usar el desfibrilador apenas esté disponible.</tspan><tspan x="58.0" dy="18">• Los fármacos son del soporte vital avanzado. La inmovilización cervical no debe demorar el masaje.</tspan></text><text x="58.0" y="1063.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: American Heart Association, Guidelines for CPR and Emergency Cardiovascular Care (2025), Circulation 2025;152(suppl 2); European Resuscitation Council, Guidelines</tspan><tspan x="58.0" dy="15">(2021)</tspan></text></svg>