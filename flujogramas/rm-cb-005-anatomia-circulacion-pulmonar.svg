<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="884" viewBox="0 0 1000 884" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Las venas bronquiales drenan solo parte de la sangre aportada a los pulmones"><title>Las venas bronquiales drenan solo parte de la sangre aportada a los pulmones</title><rect x="0.75" y="0.75" width="998.5" height="882.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Anatomía · circulación pulmonar</tspan></text><rect x="393.4" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="465.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="465.4" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Doble circulación del pulmón</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Funcional: arteria pulmonar → capilar alveolar → venas pulmonares.</tspan><tspan x="58.0" dy="17">Nutricia: arterias bronquiales (de la aorta) → bronquios y parénquima.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué afirmación sobre la vascularización pulmonar es</tspan><tspan x="640.0" dy="16">correcta?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOS CIRCULACIONES, CUATRO VASOS</tspan></text><text x="202.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ TIPO DE VASO</tspan></text><rect x="202.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="388.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Arterias</tspan></text><rect x="587.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Venas</tspan></text><text x="40.0" y="312.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ CIRCULACIÓN</tspan></text><rect x="40.0" y="338.0" width="150.0" height="90.5" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="379.2" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Funcional</tspan><tspan x="115.0" dy="17">(intercambio)</tspan></text><rect x="202.0" y="338.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="339.0" width="6.0" height="88.5" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="388.5" y="366.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">A. pulmonares</tspan></text><text x="388.5" y="389.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Sangre desoxigenada</tspan><tspan x="388.5" dy="17">Del ventrículo derecho</tspan></text><rect x="587.0" y="338.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="339.0" width="6.0" height="88.5" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="366.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">V. pulmonares</tspan></text><text x="773.5" y="389.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Sangre oxigenada</tspan><tspan x="773.5" dy="17">A la aurícula izquierda</tspan></text><rect x="40.0" y="440.5" width="150.0" height="90.5" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="490.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Nutricia (bronquial)</tspan></text><rect x="202.0" y="440.5" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="441.5" width="6.0" height="88.5" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="468.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">A. bronquiales</tspan></text><text x="388.5" y="491.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Nacen de la aorta</tspan><tspan x="388.5" dy="17">Nutren bronquios</tspan></text><rect x="587.0" y="440.5" width="373.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="468.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">V. bronquiales</tspan></text><text x="773.5" y="491.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Drenan solo en parte</tspan><tspan x="773.5" dy="17">ácigos / hemiácigos</tspan></text><rect x="728.1" y="519.9" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="773.5" y="534.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="773.5" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="580.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="590.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="621.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="613.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">V. pulmonares:</tspan><tspan x="285.0" dy="17">sangre pobre en O₂</tspan></text><text x="435.0" y="613.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">A. pulmonares:</tspan><tspan x="435.0" dy="17">sangre oxigenada</tspan></text><text x="585.0" y="613.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">V. bronquial der. a</tspan><tspan x="585.0" dy="17">hemiácigos</tspan></text><rect x="663.0" y="593.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="613.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">V. bronquiales:</tspan><tspan x="735.0" dy="17">drenaje parcial</tspan></text><text x="885.0" y="613.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">V. bronquial izq. a</tspan><tspan x="885.0" dy="17">ácigos</tspan></text><rect x="40.0" y="644.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="644.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="681.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Correcta?</tspan></text><text x="285.0" y="665.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: las venas</tspan><tspan x="285.0" dy="16">pulmonares llevan</tspan><tspan x="285.0" dy="16">sangre oxigenada</tspan></text><text x="435.0" y="665.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: las arterias</tspan><tspan x="435.0" dy="16">pulmonares llevan</tspan><tspan x="435.0" dy="16">sangre desoxigenada</tspan></text><text x="585.0" y="673.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la derecha drena</tspan><tspan x="585.0" dy="16">en la ácigos</tspan></text><text x="735.0" y="665.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: solo una parte; el</tspan><tspan x="735.0" dy="16">resto va a las venas</tspan><tspan x="735.0" dy="16">pulmonares</tspan></text><text x="885.0" y="673.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la izquierda drena</tspan><tspan x="885.0" dy="16">en la hemiácigos</tspan></text><rect x="40.0" y="590.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="734.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="762.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="784.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Venas pulmonares: sangre oxigenada hacia la aurícula izquierda. Arterias pulmonares: sangre pobre en oxígeno hacia el pulmón.</tspan><tspan x="58.0" dy="18">• Las venas bronquiales drenan solo parte de la sangre nutricia; el resto vuelve por las venas pulmonares (cortocircuito anatómico fisiológico).</tspan><tspan x="58.0" dy="18">• Vena bronquial derecha → ácigos; izquierda → hemiácigos o intercostal superior izquierda.</tspan></text><text x="58.0" y="842.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Moore Anatomía con orientación clínica 8.ª ed.; West Fisiología respiratoria 11.ª ed.</tspan></text></svg>