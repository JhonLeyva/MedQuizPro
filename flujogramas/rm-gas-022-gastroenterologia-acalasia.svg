<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1367" viewBox="0 0 1000 1367" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La acalasia es un trastorno motor del esófago"><title>La acalasia es un trastorno motor del esófago</title><rect x="0.75" y="0.75" width="998.5" height="1365.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gastroenterología · acalasia</tspan></text><rect x="366.8" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="449.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="449.5" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Acalasia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Falta de relajación del esfínter esofágico inferior y pérdida del peristaltismo.</tspan><tspan x="58.0" dy="17">Degeneran las neuronas inhibidoras (óxido nítrico y VIP) del plexo mientérico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿La acalasia es una patología de qué órgano?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL SÍNTOMA AL TRATAMIENTO, EN ORDEN</tspan></text><rect x="40.0" y="253.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="253.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="313.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Síntoma</tspan></text><rect x="40.0" y="365.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="365.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Estudio</tspan></text><rect x="40.0" y="477.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="477.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="537.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Hallazgo</tspan></text><rect x="40.0" y="589.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="589.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Tratamiento</tspan></text><line x1="348.0" y1="300.5" x2="355.0" y2="300.5" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="300.5" x2="355.0" y2="421.0" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="421.0" x2="353.0" y2="421.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="353.0,426.0 353.0,416.0 362.0,421.0" fill="#ea580c"/><line x1="552.0" y1="421.0" x2="559.0" y2="421.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="421.0" x2="559.0" y2="533.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="533.0" x2="557.0" y2="533.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,538.0 557.0,528.0 566.0,533.0" fill="#0f766e"/><line x1="756.0" y1="533.0" x2="763.0" y2="533.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="533.0" x2="763.0" y2="645.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="645.0" x2="761.0" y2="645.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,650.0 761.0,640.0 770.0,645.0" fill="#0f766e"/><rect x="158.0" y="266.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="282.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Disfagia a sólidos y líquidos</tspan></text><text x="168.0" y="299.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Regurgitación, pérdida de peso y</tspan><tspan x="168.0" dy="14.5">dolor torácico.</tspan></text><circle cx="158.0" cy="266.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="270.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="378.0" width="190.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="372.0" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Manometría de alta</tspan><tspan x="372.0" dy="16">resolución</tspan></text><text x="372.0" y="427.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Prueba de elección; bario y</tspan><tspan x="372.0" dy="14.5">endoscopia complementan.</tspan></text><circle cx="362.0" cy="378.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="382.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="490.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="506.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Esfínter que no se relaja y</tspan><tspan x="576.0" dy="16">sin peristaltismo</tspan></text><text x="576.0" y="539.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">«Pico de pájaro» en el</tspan><tspan x="576.0" dy="14.5">esofagograma con bario.</tspan></text><circle cx="566.0" cy="490.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="494.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="602.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="618.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Dilatación, miotomía de</tspan><tspan x="780.0" dy="16">Heller o POEM</tspan></text><text x="780.0" y="651.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Se elige según el subtipo y el</tspan><tspan x="780.0" dy="14.5">paciente.</tspan></text><circle cx="770.0" cy="602.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="606.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="719.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="745.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Acalasia = trastorno motor del esófago</tspan></text><text x="60.0" y="764.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Faringe, estómago, duodeno y yeyuno no están afectados.</tspan></text><text x="40.0" y="825.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SUBTIPOS DE ACALASIA POR MANOMETRÍA (CHICAGO V4.0)</tspan></text><rect x="40.0" y="837.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="856.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="130.0" y="856.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Cuerpo esofágico</tspan></text><text x="550.0" y="856.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Característica en la manometría</tspan></text><rect x="40.0" y="866.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="885.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">I</tspan></text><text x="130.0" y="885.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Sin contracciones</tspan></text><text x="550.0" y="885.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Peristalsis fallida en el 100 % de las degluciones, sin presurización</tspan></text><rect x="40.0" y="895.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="914.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">II</tspan></text><text x="130.0" y="914.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Presurización</tspan></text><text x="550.0" y="914.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Peristalsis fallida en el 100 %; presurización panesofágica en el 20 % o</tspan><tspan x="550.0" dy="15">más de las degluciones</tspan></text><rect x="40.0" y="939.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="958.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">III</tspan></text><text x="130.0" y="958.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Contracciones prematuras</tspan></text><text x="550.0" y="958.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Sin peristalsis normal; contracciones prematuras (latencia distal menor de</tspan><tspan x="550.0" dy="15">4,5 s) en el 20 % o más</tspan></text><text x="40.0" y="999.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">En los tres tipos el esfínter esofágico inferior no se relaja (presión de relajación integrada elevada, requisito de los tres tipos). El subtipo orienta la elección del tratamiento.</tspan></text><text x="40.0" y="1046.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1056.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1078.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1078.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Estómago</tspan></text><rect x="363.0" y="1059.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="1078.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Esófago</tspan></text><text x="585.0" y="1078.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Faringe</tspan></text><text x="735.0" y="1078.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Duodeno</tspan></text><text x="885.0" y="1078.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Yeyuno</tspan></text><rect x="40.0" y="1093.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1093.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1122.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Órgano afectado?</tspan></text><text x="285.0" y="1114.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el estómago no es</tspan><tspan x="285.0" dy="16">el sitio de la lesión</tspan></text><text x="435.0" y="1114.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: el esófago pierde el</tspan><tspan x="435.0" dy="16">peristaltismo</tspan></text><text x="585.0" y="1114.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la faringe no está</tspan><tspan x="585.0" dy="16">afectada</tspan></text><text x="735.0" y="1114.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el duodeno no está</tspan><tspan x="735.0" dy="16">afectado</tspan></text><text x="885.0" y="1114.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el yeyuno no está</tspan><tspan x="885.0" dy="16">afectado</tspan></text><rect x="40.0" y="1056.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1167.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1195.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1217.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Clínica: disfagia a sólidos y líquidos, regurgitación de alimento sin digerir, pérdida de peso y dolor torácico.</tspan><tspan x="58.0" dy="18">• Manometría de alta resolución: es la prueba diagnóstica de elección. El esofagograma con bario muestra el «pico de pájaro»; la endoscopia descarta</tspan><tspan x="58.0" dy="18">   pseudoacalasia por cáncer.</tspan><tspan x="58.0" dy="18">• Tratamiento: dilatación neumática, miotomía de Heller o miotomía endoscópica oral (POEM).</tspan><tspan x="58.0" dy="18">• Chagas produce un cuadro idéntico en zonas endémicas.</tspan></text><text x="58.0" y="1311.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Vaezi MF et al., ACG (Am J Gastroenterol 2020;115:1393-1411); Yadlapati R et al., Chicago Classification v4.0 (Neurogastroenterol Motil 2021;33:e14058); Harrison 21.ª</tspan><tspan x="58.0" dy="15">ed. (2022).</tspan></text></svg>