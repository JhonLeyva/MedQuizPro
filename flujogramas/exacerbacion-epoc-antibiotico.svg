<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1114" viewBox="0 0 1000 1114" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Enfisematoso con más tos y disnea y fiebre de 38 °C sin neumonía en la Rx: antibiótico"><title>Enfisematoso con más tos y disnea y fiebre de 38 °C sin neumonía en la Rx: antibiótico</title><rect x="0.75" y="0.75" width="998.5" height="1113.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">EPOC · exacerbación</tspan></text><rect x="326.5" y="32.0" width="129.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="391.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="114"><tspan x="391.4" dy="0">NEUMOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Exacerbación de la EPOC</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Empeoramiento agudo de disnea, tos o esputo; la causa más común es una infección.</tspan><tspan x="58.0" dy="17">Se trata con broncodilatadores, corticoide oral y antibiótico si hay datos de infección</tspan><tspan x="58.0" dy="17">bacteriana.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 58 años con enfisema</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Más tos y disnea; 3 días de fiebre de 38 °C.</tspan><tspan x="640.0" dy="16">Rx: tórax en tonel, sin condensación.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="733.5" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#94a3b8"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#0f766e"/><rect x="190.8" y="388.0" width="151.4" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Fiebre, más tos (este caso)</tspan></text><rect x="719.4" y="388.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Exacerbación de EPOC: ¿datos de infección bacteriana?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">ANTIBIÓTICO</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Preguntar por esputo purulento</tspan><tspan x="266.5" dy="17">+ broncodilatador y prednisona</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Broncodilatador + corticoide</tspan></text><text x="733.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Sin antibiótico</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="557.5" width="920.0" height="213.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="599.5" x2="938.0" y2="599.5" stroke="#64748b" stroke-width="2"/><line x1="62.0" y1="599.5" x2="62.0" y2="607.5" stroke="#64748b" stroke-width="2"/><line x1="938.0" y1="599.5" x2="938.0" y2="607.5" stroke="#64748b" stroke-width="2"/><rect x="360.9" y="587.5" width="278.2" height="24.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="500.0" y="603.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">CRITERIOS DE ANTHONISEN · 2 de 3 en el caso</tspan></text><rect x="56.0" y="619.5" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="94.0" dy="0">Más disnea</tspan></text><text x="68.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="68.0" dy="0">Sí</tspan></text><rect x="68.0" y="689.5" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="200.0" y="704.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="200.0" dy="0">✓ EN EL CASO</tspan></text><rect x="356.0" y="619.5" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="376.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="376.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><text x="394.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="394.0" dy="0">Más volumen de esputo</tspan></text><text x="368.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="368.0" dy="0">Más tos</tspan></text><rect x="368.0" y="689.5" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="500.0" y="704.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="500.0" dy="0">✓ EN EL CASO</tspan></text><rect x="656.0" y="619.5" width="288.0" height="104.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="676.0" cy="642.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="676.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">3</tspan></text><text x="694.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="242"><tspan x="694.0" dy="0">Esputo purulento</tspan></text><text x="668.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="264"><tspan x="668.0" dy="0">No se informa</tspan></text><rect x="668.0" y="689.5" width="264.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="800.0" y="704.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="252"><tspan x="800.0" dy="0">— NO DESCRITO</tspan></text><text x="56.0" y="750.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Con fiebre y dos síntomas se indica antibiótico; el esputo purulento es el dato que más pesa (GOLD).</tspan></text><text x="40.0" y="810.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="820.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="860.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="823.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="851.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Antibióticos con</tspan><tspan x="285.0" dy="17">acción en el alveolo</tspan></text><text x="435.0" y="843.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ejercicios</tspan><tspan x="435.0" dy="17">respiratorios cada 2</tspan><tspan x="435.0" dy="17">h</tspan></text><text x="585.0" y="851.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Prescribir</tspan><tspan x="585.0" dy="17">antitusígenos</tspan></text><text x="735.0" y="851.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Solicitar una</tspan><tspan x="735.0" dy="17">espirometría</tspan></text><text x="885.0" y="851.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Corticoides orales</tspan><tspan x="885.0" dy="17">como única medida</tspan></text><rect x="40.0" y="891.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="891.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="920.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicación?</tspan></text><text x="285.0" y="912.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: la fiebre sugiere</tspan><tspan x="285.0" dy="16">infección bacteriana</tspan></text><text x="435.0" y="920.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No en la crisis</tspan></text><text x="585.0" y="912.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: retienen</tspan><tspan x="585.0" dy="16">secreciones</tspan></text><text x="735.0" y="912.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No en la crisis: espera</tspan><tspan x="735.0" dy="16">la estabilidad</tspan></text><text x="885.0" y="912.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">El corticoide va, pero</tspan><tspan x="885.0" dy="16">no como única medida</tspan></text><rect x="40.0" y="820.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="965.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="993.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1015.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Broncodilatador de acción corta (salbutamol ± ipratropio) y prednisona 40 mg por 5 días.</tspan><tspan x="58.0" dy="18">• Antibiótico si el esputo es purulento (con otro síntoma cardinal) o si necesita ventilación (GOLD 2025): amoxicilina-clavulánico o macrólido.</tspan><tspan x="58.0" dy="18">• La espirometría no se hace en la crisis; los antitusígenos no ayudan.</tspan></text><text x="58.0" y="1073.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GOLD 2025; Anthonisen et al., Ann Intern Med (1987).</tspan></text></svg>