<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1146" viewBox="0 0 1000 1146" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Anafilaxia con estridor: si no se logra intubar, cricotiroidotomía quirúrgica"><title>Anafilaxia con estridor: si no se logra intubar, cricotiroidotomía quirúrgica</title><rect x="0.75" y="0.75" width="998.5" height="1144.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Vía aérea · anafilaxia con obstrucción glótica</tspan></text><rect x="465.3" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="508.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="508.5" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vía aérea en la anafilaxia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El edema de glotis cierra la vía aérea en minutos.</tspan><tspan x="58.0" dy="17">Primero adrenalina; si la vía aérea se pierde, rescate quirúrgico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 27 años tras penicilina</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Edema de cara y cuello, estridor, FR 32, SatO₂ 70 %,</tspan><tspan x="640.0" dy="16">pulso 110.</tspan><tspan x="640.0" dy="16">Shock anafiláctico: ¿cómo permeabilizar la vía aérea?</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#94a3b8"/><line x1="500.0" y1="521.5" x2="500.0" y2="551.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="551.5" x2="500.0" y2="580.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,579.5 505.0,579.5 500.0,587.5" fill="#94a3b8"/><line x1="500.0" y1="645.5" x2="500.0" y2="675.5" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="675.5" x2="733.5" y2="675.5" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="675.5" x2="266.5" y2="704.5" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,703.5 271.5,703.5 266.5,711.5" fill="#94a3b8"/><line x1="733.5" y1="675.5" x2="733.5" y2="704.5" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,703.5 738.5,703.5 733.5,711.5" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#0f766e"/><line x1="500.0" y1="521.5" x2="500.0" y2="551.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="551.5" x2="500.0" y2="580.5" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,579.5 505.0,579.5 500.0,587.5" fill="#0f766e"/><line x1="500.0" y1="645.5" x2="500.0" y2="675.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="675.5" x2="733.5" y2="675.5" stroke="#0f766e" stroke-width="3"/><line x1="733.5" y1="675.5" x2="733.5" y2="704.5" stroke="#0f766e" stroke-width="3"/><polygon points="728.5,703.5 738.5,703.5 733.5,711.5" fill="#0f766e"/><rect x="450.5" y="404.0" width="99.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="500.0" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Siempre primero</tspan></text><rect x="195.0" y="684.5" width="143.0" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="266.5" y="697.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí, el experto lo consigue</tspan></text><rect x="630.8" y="684.5" width="205.4" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="733.5" y="697.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No: no intubo, no oxigeno (este caso)</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Anafilaxia con estridor y SatO₂ 70 %</tspan></text><rect x="240.0" y="431.0" width="520.0" height="90.5" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><text x="500.0" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="492"><tspan x="500.0" dy="0">ADRENALINA IM 0,5 mg + O₂</tspan></text><text x="500.0" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="492"><tspan x="500.0" dy="0">Muslo anterolateral</tspan><tspan x="500.0" dy="17">Cristaloides</tspan></text><rect x="240.0" y="431.0" width="520.0" height="90.5" rx="10" fill="none" stroke="#0f766e" stroke-width="2.2"/><polygon points="240.0,616.5 266.0,587.5 734.0,587.5 760.0,616.5 734.0,645.5 266.0,645.5" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="616.5" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="621.5" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="621.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Se logra intubar por vía oral?</tspan></text><rect x="40.0" y="711.5" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="739.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">INTUBACIÓN ORAL</tspan></text><text x="266.5" y="762.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Tubo fino, fijar vía</tspan></text><rect x="507.0" y="711.5" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="733.5" y="739.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">CRICOTIROIDOTOMÍA</tspan></text><text x="733.5" y="762.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Bisturí, &lt; 1 minuto</tspan></text><text x="40.0" y="824.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="834.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="865.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="857.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Oxigenación con</tspan><tspan x="285.0" dy="17">máscara</tspan></text><text x="435.0" y="857.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Intubación</tspan><tspan x="435.0" dy="17">orotraqueal</tspan></text><text x="585.0" y="865.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Traqueostomía</tspan></text><rect x="663.0" y="837.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="865.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cricotiroidotomía</tspan></text><text x="885.0" y="857.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Intubación</tspan><tspan x="885.0" dy="17">nasotraqueal</tspan></text><rect x="40.0" y="888.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="888.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="917.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Procedimiento de</tspan><tspan x="54.0" dy="16">elección?</tspan></text><text x="285.0" y="917.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no abre una glotis</tspan><tspan x="285.0" dy="16">cerrada</tspan></text><text x="435.0" y="909.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es el primer</tspan><tspan x="435.0" dy="16">intento, pero fracasa</tspan><tspan x="435.0" dy="16">por el edema</tspan></text><text x="585.0" y="917.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: más lenta y con</tspan><tspan x="585.0" dy="16">más complicaciones</tspan></text><text x="735.0" y="917.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: rescate rápido con</tspan><tspan x="735.0" dy="16">referencias palpables</tspan></text><text x="885.0" y="917.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: a ciegas, en</tspan><tspan x="885.0" dy="16">laringe edematizada</tspan></text><rect x="40.0" y="834.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="978.9" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1006.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1028.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Anafilaxia: adrenalina IM 0,5 mg (0,01 mg/kg) en el muslo anterolateral, repetible cada 5-15 min; oxígeno y cristaloides.</tspan><tspan x="58.0" dy="18">• Intubación orotraqueal por el más experto, con tubo fino y plan B listo (algoritmo ASA/DAS de vía aérea difícil).</tspan><tspan x="58.0" dy="18">• «No intubo, no oxigeno»: cricotiroidotomía por bisturí (&lt; 1 minuto, referencias palpables); la traqueostomía urgente es más lenta.</tspan><tspan x="58.0" dy="18">• Después: antihistamínico y corticoide (no sustituyen a la adrenalina) y observación 6-24 h por riesgo de reacción bifásica.</tspan></text><text x="58.0" y="1104.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WAO, anafilaxia (2020); EAACI (2022); ASA, vía aérea difícil (2022); DAS (2015).</tspan></text></svg>