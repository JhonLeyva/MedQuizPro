<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="982" viewBox="0 0 1000 982" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Un mes de irritabilidad, desinterés, inutilidad, mal sueño e ideación suicida en un adolescente: depresión mayor"><title>Un mes de irritabilidad, desinterés, inutilidad, mal sueño e ideación suicida en un adolescente: depresión mayor</title><rect x="0.75" y="0.75" width="998.5" height="980.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Psiquiatría · depresión mayor del adolescente</tspan></text><rect x="470.7" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="525.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="525.4" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Depresión mayor del adolescente</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dos semanas o más de cinco síntomas con ánimo deprimido o irritable, o pérdida de</tspan><tspan x="58.0" dy="17">interés.</tspan><tspan x="58.0" dy="17">Lo urgente es estimar el riesgo suicida.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 15 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Treinta días de irritabilidad, pérdida de interés,</tspan><tspan x="640.0" dy="16">inutilidad y sueño alterado.</tspan><tspan x="640.0" dy="16">Pensamientos suicidas.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ EXIGE CADA DIAGNÓSTICO Y SI LO CUMPLE EL ADOLESCENTE</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="150"><tspan x="54.0" dy="0">DIAGNÓSTICO</tspan></text><text x="397.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="355"><tspan x="397.5" dy="0">Qué exige</tspan></text><text x="772.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="355"><tspan x="772.5" dy="0">En el caso</tspan></text><rect x="40.0" y="325.0" width="164.0" height="73.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="359.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Depresión mayor</tspan></text><text x="54.0" y="376.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Episodio depresivo mayor</tspan></text><rect x="213.0" y="325.0" width="369.0" height="73.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="225.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Cinco síntomas por 2 semanas, con ánimo irritable o</tspan><tspan x="225.0" dy="16">pérdida de interés</tspan></text><text x="225.0" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Son 30 días</tspan></text><rect x="588.0" y="325.0" width="369.0" height="73.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="600.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Cumple: irritabilidad, desinterés, inutilidad, sueño y</tspan><tspan x="600.0" dy="16">suicidio</tspan></text><text x="600.0" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Diagnóstico</tspan></text><rect x="856.2" y="314.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="329.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="404.0" width="164.0" height="71.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="430.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Distimia</tspan></text><text x="54.0" y="447.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Trastorno depresivo</tspan><tspan x="54.0" dy="14">persistente</tspan></text><rect x="213.0" y="404.0" width="369.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="225.0" y="436.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Un año de síntomas en adolescentes, más leves</tspan></text><text x="225.0" y="452.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Más tiempo</tspan></text><rect x="588.0" y="404.0" width="369.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="600.0" y="436.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">No cumple: solo 30 días</tspan></text><text x="600.0" y="452.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Se descarta</tspan></text><rect x="40.0" y="481.0" width="164.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="507.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Trastorno bipolar</tspan></text><text x="54.0" y="524.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Antecedente de manía</tspan></text><rect x="213.0" y="481.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="225.0" y="506.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Episodio maniaco o hipomaniaco previo</tspan></text><text x="225.0" y="522.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Preguntar siempre</tspan></text><rect x="588.0" y="481.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="600.0" y="506.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">No hay datos de euforia ni de menor sueño</tspan></text><text x="600.0" y="522.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Se descarta</tspan></text><text x="44.0" y="560.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Lo más urgente es estimar el riesgo suicida: ideación, plan, intento previo y acceso a medios.</tspan></text><text x="40.0" y="608.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="618.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="640.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="640.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Distimia</tspan></text><text x="435.0" y="640.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Trastorno bipolar</tspan></text><text x="585.0" y="640.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ansiedad</tspan></text><rect x="663.0" y="621.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="640.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Depresión mayor</tspan></text><text x="885.0" y="640.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Autismo</tspan></text><rect x="40.0" y="655.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="655.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="700.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="692.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: exige un año de</tspan><tspan x="285.0" dy="16">síntomas más leves</tspan></text><text x="435.0" y="684.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: exige episodio</tspan><tspan x="435.0" dy="16">maniaco o</tspan><tspan x="435.0" dy="16">hipomaniaco previo</tspan></text><text x="585.0" y="684.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: preocupación y</tspan><tspan x="585.0" dy="16">síntomas autonómicos,</tspan><tspan x="585.0" dy="16">sin inutilidad</tspan></text><text x="735.0" y="676.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: más de 2 semanas</tspan><tspan x="735.0" dy="16">de síntomas</tspan><tspan x="735.0" dy="16">depresivos con</tspan><tspan x="735.0" dy="16">ideación suicida</tspan></text><text x="885.0" y="684.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es del</tspan><tspan x="885.0" dy="16">neurodesarrollo y</tspan><tspan x="885.0" dy="16">desde la infancia</tspan></text><rect x="40.0" y="618.0" width="920.0" height="119.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="761.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="789.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="811.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• DSM-5-TR: cinco síntomas por 2 semanas con ánimo deprimido o irritable, o pérdida de interés. Distimia: 1 año en adolescentes. Bipolar: exige episodio</tspan><tspan x="58.0" dy="18">   maniaco o hipomaniaco previo.</tspan><tspan x="58.0" dy="18">• Antes de dar antidepresivo se pregunta por euforia, grandiosidad y menor necesidad de sueño. Ansiedad: preocupación sin inutilidad. Autismo: desde la</tspan><tspan x="58.0" dy="18">   primera infancia.</tspan><tspan x="58.0" dy="18">• Riesgo suicida: ideación, plan, intento previo y acceso a medios; si es alto, hospitalizar; si no, plan de seguridad. Preguntar por el suicidio no lo induce.</tspan><tspan x="58.0" dy="18">• GLAD-PC 2018: depresión moderada o grave con psicoterapia cognitivo-conductual o interpersonal y fluoxetina; vigilancia semanal del riesgo el primer</tspan><tspan x="58.0" dy="18">   mes.</tspan></text><text x="58.0" y="941.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GLAD-PC, depresión adolescente en atención primaria (Pediatrics 2018); APA, DSM-5-TR (2022); Kaplan y Sadock, Sinopsis de Psiquiatría, 12.ª ed. (2021).</tspan></text></svg>