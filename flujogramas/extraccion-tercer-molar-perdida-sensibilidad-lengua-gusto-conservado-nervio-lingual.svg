1.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Función</tspan></text><text x="303.8" y="854.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Tacto 2/3 anteriores</tspan></text><text x="491.2" y="854.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">1/3 posterior</tspan></text><text x="678.8" y="854.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Gusto 2/3 anteriores</tspan></text><text x="866.2" y="854.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Motor</tspan></text><rect x="40.0" y="796.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="891.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="919.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="941.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pérdida de sensibilidad general con gusto conservado = lesión del nervio lingual (pasa junto al tercer molar).</tspan><tspan x="58.0" dy="18">• Si se perdiera el gusto: cuerda del tímpano; si no moviera la lengua: hipogloso.</tspan><tspan x="58.0" dy="18">• El glosofaríngeo inerva el 1/3 posterior.</tspan></text><text x="58.0" y="999.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Moore, Anatomía con orientación clínica 9.ª ed.; Latarjet, Anatomía humana 5.ª ed..</tspan></text></svg>