 por el lingual (V3)</text><text x="150" y="220" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">2/3 anteriores: tacto por el lingual (V3)</text><text x="150" y="238" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">sabor por la cuerda del tímpano (VII)</text><text x="150" y="238" font-size="10.5" font-weight="800" fill="#7c3aed" text-anchor="middle" data-max="0">sabor por la cuerda del tímpano (VII)</text></g><text x="54.0" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">Naranja: zona sin tacto (lingual); el gusto sigue intacto.</tspan></text><rect x="522.0" y="295.0" width="438.0" height="342.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="534.0" y="305.0" width="159.9" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">JUNTO AL TERCER MOLAR</tspan></text><g transform="translate(571.0,353.0) scale(1.0)"><rect x="10" y="6" width="280" height="40" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="24" y="23" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Nervio lingual</text><text x="24" y="23" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="start" data-max="0">Nervio lingual</text><text x="24" y="38" font-size="9.5" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">pasa por dentro del 3.er molar</text><text x="24" y="38" font-size="9.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">pasa por dentro del 3.er molar</text><line x1="150.0" y1="46.0" x2="15