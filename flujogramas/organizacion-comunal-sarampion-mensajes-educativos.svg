ta-max="272"><tspan x="810.0" dy="0">Apoyo con el equipo de salud</tspan></text><text x="40.0" y="580.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="592.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="616.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Líderes comunales</tspan></text><line x1="248.5" y1="612.7" x2="267.5" y2="612.7" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,607.7 266.5,617.7 274.5,612.7" fill="#0f766e"/><rect x="278.5" y="592.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="616.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Conocen a su población</tspan></text><line x1="487.0" y1="612.7" x2="506.0" y2="612.7" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,607.7 505.0,617.7 513.0,612.7" fill="#0f766e"/><rect x="517.0" y="592.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="616.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Informan y motivan</tspan></text><line x1="725.5" y1="612.7" x2="744.5" y2="612.7" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,607.7 743.5,617.7 751.5,612.7" fill="#0f766e"/><rect x="755.5" y="592.2" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="616.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">MENSAJES CLAVE</tspan></text><rect x="40.0" y="657.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="685.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="707.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mensaje clave: fiebre + erupción = acudir al establecimiento.</tspan><tspan x="58.0" dy="18">• La vacuna SPR se aplica a los 12 y 18 meses.</tspan><tspan x="58.0" dy="18">• Los agentes comunitarios ayudan a ubicar a no vacunados.</tspan></text><text x="58.0" y="765.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – Plan nacional de mantenimiento de la eliminación del sarampión · OPS – Comunicación de riesgos (2019)</tspan></text></svg>