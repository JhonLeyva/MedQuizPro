<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="999" viewBox="0 0 1000 999" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Primigesta de 42 semanas con feto y cuello sin alteraciones: se indica la inducción del trabajo de parto"><title>Primigesta de 42 semanas con feto y cuello sin alteraciones: se indica la inducción del trabajo de parto</title><rect x="0.75" y="0.75" width="998.5" height="997.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · embarazo prolongado</tspan></text><rect x="405.7" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="485.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="485.5" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Embarazo prolongado</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Llega a 42 semanas completas o más.</tspan><tspan x="58.0" dy="17">Aumenta la morbimortalidad perinatal por insuficiencia placentaria.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 42 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Contracciones esporádicas, test no estresante reactivo.</tspan><tspan x="640.0" dy="16">Sin cambios cervicales; pelvis ginecoide. ¿Qué</tspan><tspan x="640.0" dy="16">conducta se sigue?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE SEGÚN LAS SEMANAS DE GESTACIÓN</tspan></text><line x1="290.0" y1="307.0" x2="290.0" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">37</tspan></text><line x1="382.9" y1="307.0" x2="382.9" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="382.9" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="382.9" dy="0">38</tspan></text><line x1="475.7" y1="307.0" x2="475.7" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="475.7" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="475.7" dy="0">39</tspan></text><line x1="568.6" y1="307.0" x2="568.6" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="568.6" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="568.6" dy="0">40</tspan></text><line x1="661.4" y1="307.0" x2="661.4" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="661.4" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="661.4" dy="0">41</tspan></text><line x1="754.3" y1="307.0" x2="754.3" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="754.3" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="754.3" dy="0">42</tspan></text><line x1="847.1" y1="307.0" x2="847.1" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="847.1" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="847.1" dy="0">43</tspan></text><line x1="940.0" y1="307.0" x2="940.0" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">44</tspan></text><text x="940.0" y="289.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">semanas</tspan></text><rect x="40.0" y="311.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="327.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Término completo (39 a 40+6)</tspan></text><text x="48.0" y="342.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Vigilancia; inducir si hay indicación o por ARRIVE</tspan></text><rect x="475.7" y="319.0" width="185.7" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="365.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Término tardío (41 a 41+6)</tspan></text><text x="48.0" y="380.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Ofrecer la inducción tras confirmar el bienestar</tspan></text><rect x="661.4" y="357.0" width="92.9" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="387.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="403.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Postérmino (42 o más)</tspan></text><text x="48.0" y="418.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Intervenir: no se espera más</tspan></text><rect x="754.3" y="395.0" width="185.7" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="441.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Límite para inducir</tspan></text><text x="48.0" y="456.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">A más tardar a las 42+6 semanas</tspan></text><rect x="754.3" y="433.0" width="92.9" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><line x1="754.3" y1="309.0" x2="754.3" y2="469.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="694.9" y="469.0" width="118.7" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="754.3" y="484.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="754.3" dy="0">Caso: 42 semanas</tspan></text><rect x="40.0" y="515.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="541.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">42 semanas con bienestar fetal conservado = inducir</tspan></text><text x="60.0" y="560.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La observación es para menos de 41 semanas; la cesárea, para sufrimiento o desproporción.</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="637.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="668.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Observación</tspan><tspan x="285.0" dy="17">hospitalizada</tspan></text><rect x="363.0" y="640.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Inducción del</tspan><tspan x="435.0" dy="17">trabajo de parto</tspan></text><text x="585.0" y="668.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Parto por cesárea</tspan></text><text x="735.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Observación</tspan><tspan x="735.0" dy="17">ambulatoria</tspan></text><text x="885.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ruptura de</tspan><tspan x="885.0" dy="17">membranas</tspan></text><rect x="40.0" y="691.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="691.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="728.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="712.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: conducta pasiva,</tspan><tspan x="285.0" dy="16">solo antes de 41</tspan><tspan x="285.0" dy="16">semanas</tspan></text><text x="435.0" y="720.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: ya pasó el límite</tspan><tspan x="435.0" dy="16">para esperar</tspan></text><text x="585.0" y="712.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se reserva para</tspan><tspan x="585.0" dy="16">sufrimiento o</tspan><tspan x="585.0" dy="16">desproporción</tspan></text><text x="735.0" y="712.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: conducta pasiva,</tspan><tspan x="735.0" dy="16">solo antes de 41</tspan><tspan x="735.0" dy="16">semanas</tspan></text><text x="885.0" y="720.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no resuelve el</tspan><tspan x="885.0" dy="16">cuello desfavorable</tspan></text><rect x="40.0" y="637.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="781.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="809.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="831.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Riesgos: oligohidramnios, compresión del cordón, aspiración de meconio, macrosomía y distocia de hombros; el riesgo de muerte fetal crece con las</tspan><tspan x="58.0" dy="18">   semanas.</tspan><tspan x="58.0" dy="18">• La inducción se ofrece desde las 41 semanas y se indica a más tardar a las 42 semanas más 6 días, tras confirmar el bienestar fetal (test no estresante,</tspan><tspan x="58.0" dy="18">   ILA o perfil biofísico).</tspan><tspan x="58.0" dy="18">• Cuello desfavorable: misoprostol o sonda Foley, y luego oxitocina. La cesárea se reserva para sufrimiento fetal, desproporción o macrosomía extrema.</tspan><tspan x="58.0" dy="18">• Alerta: confirmar la edad gestacional con la ecografía más precoz; el error de fechas es la causa más frecuente de falso embarazo prolongado.</tspan></text><text x="58.0" y="943.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 146 (2014); Grobman WA et al., ARRIVE, N Engl J Med 2018; OMS, Recomendaciones para la inducción del trabajo de parto (2011); Williams</tspan><tspan x="58.0" dy="15">Obstetricia, 26.ª ed. (2022).</tspan></text></svg>