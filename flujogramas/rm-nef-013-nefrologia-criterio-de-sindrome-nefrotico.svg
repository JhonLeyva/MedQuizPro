<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1216" viewBox="0 0 1000 1216" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El síndrome nefrótico se define por proteinuria mayor de 3,5 g/24 horas"><title>El síndrome nefrótico se define por proteinuria mayor de 3,5 g/24 horas</title><rect x="0.75" y="0.75" width="998.5" height="1214.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · criterio de síndrome nefrótico</tspan></text><rect x="448.1" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="539.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="539.4" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome nefrótico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Proteinuria masiva por daño del podocito y de la barrera de filtración.</tspan><tspan x="58.0" dy="17">Se acompaña de hipoalbuminemia, edema, hiperlipidemia y lipiduria.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de criterio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de las opciones es un criterio que define el</tspan><tspan x="640.0" dy="16">síndrome nefrótico?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SIGNIFICA CADA CIFRA DE PROTEINURIA EN EL ADULTO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Proteinuria en 24 horas</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Solo el rango nefrótico define el síndrome.</tspan></text><rect x="70.0" y="378.0" width="501.7" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="320.8" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="492"><tspan x="320.8" dy="0">Menos de 3,5 g: no cumple el criterio</tspan></text><rect x="571.7" y="378.0" width="358.3" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="750.8" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="348"><tspan x="750.8" dy="0">Más de 3,5 g/24 h: rango nefrótico</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0 g</tspan></text><line x1="213.3" y1="418.0" x2="213.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="213.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="213.3" dy="0">1 g</tspan></text><line x1="356.7" y1="418.0" x2="356.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">2 g</tspan></text><line x1="500.0" y1="418.0" x2="500.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">3 g</tspan></text><line x1="571.7" y1="418.0" x2="571.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="571.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="571.7" dy="0">3,5 g</tspan></text><line x1="643.3" y1="418.0" x2="643.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">4 g</tspan></text><line x1="786.7" y1="418.0" x2="786.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="786.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="786.7" dy="0">5 g</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">6 g</tspan></text><polygon points="605.7,364.0 623.7,364.0 614.7,376.0" fill="#ea580c"/><rect x="473.6" y="338.0" width="282.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="614.7" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="270"><tspan x="614.7" dy="0">◆ MAYOR DE 3,5 g/24 h: SÍNDROME NEFRÓTICO</tspan></text><text x="40.0" y="486.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ACOMPAÑA AL CRITERIO</tspan></text><rect x="40.0" y="496.0" width="297.3" height="86.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="497.0" width="6.0" height="84.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Hipoalbuminemia menor de 3 g/dL y</tspan><tspan x="58.0" dy="17">edema</tspan></text><text x="58.0" y="558.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Consecuencia de la pérdida de proteínas</tspan></text><rect x="351.3" y="496.0" width="297.3" height="86.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="497.0" width="6.0" height="84.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Hiperlipidemia y lipiduria</tspan></text><text x="369.3" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Triglicéridos y colesterol aumentados, no</tspan><tspan x="369.3" dy="16">disminuidos</tspan></text><rect x="662.7" y="496.0" width="297.3" height="86.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="497.0" width="6.0" height="84.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Cilindros hemáticos</tspan></text><text x="680.7" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Orientan al síndrome nefrítico</tspan></text><text x="40.0" y="616.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SÍNDROME NEFRÓTICO FRENTE A NEFRÍTICO</tspan></text><rect x="40.0" y="628.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="647.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Rasgo</tspan></text><text x="260.0" y="647.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Síndrome nefrótico</tspan></text><text x="615.0" y="647.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Síndrome nefrítico</tspan></text><rect x="40.0" y="657.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="676.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Proteinuria</tspan></text><text x="260.0" y="676.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Masiva: más de 3,5 g/24 h (niños: más de 40 mg/m²/h)</tspan></text><text x="615.0" y="676.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Generalmente menos de 3 g/día</tspan></text><rect x="150.6" y="660.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="675.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="686.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="705.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Albúmina sérica</tspan></text><text x="260.0" y="705.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Menos de 3 g/dL (hipoalbuminemia)</tspan></text><text x="615.0" y="705.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Variable</tspan></text><rect x="40.0" y="715.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="734.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Sedimento urinario</tspan></text><text x="260.0" y="734.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Cuerpos ovales grasos y cruces de Malta; sin hematíes</tspan><tspan x="260.0" dy="15">dismórficos</tspan></text><text x="615.0" y="734.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Hematíes dismórficos y cilindros hemáticos</tspan></text><rect x="40.0" y="759.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="778.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Lípidos</tspan></text><text x="260.0" y="778.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Hiperlipidemia y lipiduria</tspan></text><text x="615.0" y="778.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Sin dislipidemia propia</tspan></text><rect x="40.0" y="788.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="807.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Presión y función renal</tspan></text><text x="260.0" y="807.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Edema; presión y filtrado a menudo conservados</tspan></text><text x="615.0" y="807.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Hipertensión, edema y filtrado glomerular reducido</tspan></text><text x="40.0" y="857.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="867.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="898.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="889.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Disminución de las</tspan><tspan x="285.0" dy="17">globulinas séricas</tspan></text><rect x="363.0" y="870.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="889.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Proteinuria mayor</tspan><tspan x="435.0" dy="17">de 3,5 g/24 horas</tspan></text><text x="585.0" y="889.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cilindros hemáticos</tspan><tspan x="585.0" dy="17">en orina</tspan></text><text x="735.0" y="889.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Disminución de los</tspan><tspan x="735.0" dy="17">triglicéridos</tspan></text><text x="885.0" y="889.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Disminución de la</tspan><tspan x="885.0" dy="17">eritropoyetina</tspan></text><rect x="40.0" y="921.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="921.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="942.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Criterio que define el</tspan><tspan x="54.0" dy="16">síndrome nefrótico?</tspan></text><text x="285.0" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: pueden bajar, pero</tspan><tspan x="285.0" dy="16">no definen el síndrome</tspan></text><text x="435.0" y="942.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: proteinuria masiva</tspan><tspan x="435.0" dy="16">en rango nefrótico</tspan></text><text x="585.0" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: son propios del</tspan><tspan x="585.0" dy="16">síndrome nefrítico</tspan></text><text x="735.0" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: los triglicéridos</tspan><tspan x="735.0" dy="16">están aumentados</tspan></text><text x="885.0" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: pertenece a la</tspan><tspan x="885.0" dy="16">ERC avanzada</tspan></text><rect x="40.0" y="867.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="995.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1023.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1045.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Adulto: proteinuria mayor de 3,5 g/24 h por 1,73 m² o relación proteína/creatinina mayor de 3 a 3,5 g/g; niños: más de 40 mg/m²/h o relación mayor de 2</tspan><tspan x="58.0" dy="18">   mg/mg.</tspan><tspan x="58.0" dy="18">• Triglicéridos y colesterol están aumentados; la antitrombina III se pierde por la orina (riesgo de trombosis de vena renal) y también las inmunoglobulinas</tspan><tspan x="58.0" dy="18">   (infecciones).</tspan><tspan x="58.0" dy="18">• Cilindros hemáticos = síndrome nefrítico; la anemia por déficit de eritropoyetina pertenece a la ERC avanzada. Las globulinas pueden bajar, pero no</tspan><tspan x="58.0" dy="18">   definen el síndrome.</tspan><tspan x="58.0" dy="18">• Adulto: biopsia renal; niño: se prueba primero con corticoide. Causa secundaria más común: diabetes.</tspan></text><text x="58.0" y="1175.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO, manejo de las enfermedades glomerulares (2021); KDIGO, evaluación y manejo de la ERC (2024); Harrison, 21.ª ed. (2022).</tspan></text></svg>