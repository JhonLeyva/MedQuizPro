<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1085" viewBox="0 0 1000 1085" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El bromuro de ipratropio es un antagonista competitivo muscarínico que reduce el tono broncomotor"><title>El bromuro de ipratropio es un antagonista competitivo muscarínico que reduce el tono broncomotor</title><rect x="0.75" y="0.75" width="998.5" height="1083.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · ipratropio</tspan></text><rect x="350.4" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="422.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="422.3" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fármacos respiratorios</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cada grupo actúa sobre un receptor o una enzima distinta.</tspan><tspan x="58.0" dy="17">El antagonista muscarínico bloquea la acetilcolina del vago.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué fármaco es antagonista competitivo de la</tspan><tspan x="640.0" dy="16">acetilcolina en los receptores muscarínicos?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUATRO MECANISMOS DE BRONCODILATACIÓN</tspan></text><rect x="40.0" y="269.0" width="453.0" height="79.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="54.0" y="296.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Ipratropio (este caso)</tspan></text><text x="54.0" y="313.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Antagonista muscarínico competitivo de M1, M2 y M3</tspan><tspan x="54.0" dy="16">Bloquea la acetilcolina del vago; poca absorción sistémica</tspan></text><rect x="391.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="436.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="436.6" dy="0">◆ ESTE CASO</tspan></text><rect x="507.0" y="269.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="296.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Albuterol (salbutamol)</tspan></text><text x="521.0" y="313.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Agonista beta-2: activa la adenilil ciclasa y eleva el AMPc</tspan><tspan x="521.0" dy="16">Inicio rápido: primera línea en la crisis</tspan></text><rect x="40.0" y="362.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="54.0" y="389.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Teofilina y metilxantinas</tspan></text><text x="54.0" y="406.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Inhiben la fosfodiesterasa y antagonizan la adenosina</tspan><tspan x="54.0" dy="16">Margen terapéutico estrecho</tspan></text><rect x="507.0" y="362.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="389.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Sulfato de magnesio</tspan></text><text x="521.0" y="406.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Relaja el músculo liso al bloquear el ingreso de calcio</tspan><tspan x="521.0" dy="16">Se usa en la crisis asmática grave</tspan></text><rect x="40.0" y="459.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="485.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Antagonista muscarínico = ipratropio</tspan></text><text x="60.0" y="504.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se asocia al beta-2 en la crisis grave; el tiotropio es su equivalente de larga duración.</tspan></text><text x="40.0" y="565.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MECANISMO DE LOS FÁRMACOS DE LAS OPCIONES</tspan></text><rect x="40.0" y="577.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="596.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Fármaco</tspan></text><text x="260.0" y="596.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Receptor o diana</tspan></text><text x="615.0" y="596.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Efecto</tspan></text><rect x="40.0" y="606.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="625.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Albuterol</tspan></text><text x="260.0" y="625.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Receptor beta-2</tspan></text><text x="615.0" y="625.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Sube el AMPc: broncodilatación</tspan></text><rect x="40.0" y="635.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="654.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Metilxantina y teofilina</tspan></text><text x="260.0" y="654.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Fosfodiesterasa y adenosina</tspan></text><text x="615.0" y="654.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Sube el AMPc: broncodilatación</tspan></text><rect x="40.0" y="664.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="683.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Ipratropio</tspan></text><text x="260.0" y="683.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Receptores muscarínicos M1, M2 y M3</tspan></text><text x="615.0" y="683.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Bloquea la acetilcolina: menos tono y moco</tspan></text><rect x="150.6" y="667.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="682.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="693.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="712.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Sulfato de magnesio</tspan></text><text x="260.0" y="712.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Canales de calcio</tspan></text><text x="615.0" y="712.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Relaja el músculo liso</tspan></text><text x="40.0" y="762.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="772.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="803.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="794.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Albuterol</tspan><tspan x="285.0" dy="17">(salbutamol)</tspan></text><text x="435.0" y="803.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Metilxantina</tspan></text><rect x="513.0" y="775.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="794.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Bromuro de</tspan><tspan x="585.0" dy="17">ipratropio</tspan></text><text x="735.0" y="794.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Sulfato de</tspan><tspan x="735.0" dy="17">magnesio</tspan></text><text x="885.0" y="803.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Teofilina</tspan></text><rect x="40.0" y="826.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="826.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="847.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Antagonista</tspan><tspan x="54.0" dy="16">muscarínico?</tspan></text><text x="285.0" y="847.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es un agonista</tspan><tspan x="285.0" dy="16">beta-2</tspan></text><text x="435.0" y="847.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: inhibe la</tspan><tspan x="435.0" dy="16">fosfodiesterasa</tspan></text><text x="585.0" y="847.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: bloquea M1, M2 y</tspan><tspan x="585.0" dy="16">M3</tspan></text><text x="735.0" y="847.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: relaja el músculo al</tspan><tspan x="735.0" dy="16">bloquear el calcio</tspan></text><text x="885.0" y="847.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: inhibe la</tspan><tspan x="885.0" dy="16">fosfodiesterasa</tspan></text><rect x="40.0" y="772.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="900.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="928.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="950.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El ipratropio, amina cuaternaria derivada de la atropina, bloquea los receptores M1, M2 y M3: baja el tono broncomotor y la secreción de moco.</tspan><tspan x="58.0" dy="18">• Casi no se absorbe por vía sistémica: causa sequedad bucal y sabor amargo, no efectos atropínicos generales.</tspan><tspan x="58.0" dy="18">• Inicio más lento que el salbutamol (pico a los 30 a 60 minutos): en la crisis asmática grave se asocia a un beta-2 de acción corta y reduce</tspan><tspan x="58.0" dy="18">   hospitalizaciones.</tspan><tspan x="58.0" dy="18">• Alerta: si el aerosol llega a los ojos con la mascarilla mal ajustada puede precipitar glaucoma de ángulo estrecho; en la EPOC se prefiere el tiotropio.</tspan></text><text x="58.0" y="1044.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman y Gilman, 14.ª ed. (2023); Katzung, 16.ª ed. (2024); Harrison, 21.ª ed. (2022).</tspan></text></svg>