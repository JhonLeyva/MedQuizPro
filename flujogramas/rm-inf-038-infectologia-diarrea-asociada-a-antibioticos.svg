<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1307" viewBox="0 0 1000 1307" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diarrea y fiebre tras un antibiótico: el agente más frecuente es Clostridioides difficile"><title>Diarrea y fiebre tras un antibiótico: el agente más frecuente es Clostridioides difficile</title><rect x="0.75" y="0.75" width="998.5" height="1305.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infectología · diarrea asociada a antibióticos</tspan></text><rect x="461.8" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="522.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="522.7" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección por C. difficile</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La microbiota alterada por un antibiótico permite su crecimiento.</tspan><tspan x="58.0" dy="17">Las toxinas A y B dañan el colon.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 22 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tres días con deposiciones líquidas con sangre,</tspan><tspan x="640.0" dy="16">vómitos, fiebre y cólico.</tspan><tspan x="640.0" dy="16">Recibió antibióticos hace una semana; T 38 °C,</tspan><tspan x="640.0" dy="16">deshidratado.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ AGENTE PRODUCE DIARREA TRAS UN ANTIBIÓTICO</tspan></text><line x1="406.0" y1="453.8" x2="340.0" y2="453.8" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="453.8" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.9" y1="506.1" x2="340.0" y2="560.9" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="560.9" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="423.9" x2="660.0" y2="400.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="400.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="483.6" x2="660.0" y2="507.3" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="507.3" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.9" y1="401.4" x2="340.0" y2="346.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="346.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="453.8" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="453.8" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="449.3" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">DIARREA TRAS</tspan><tspan x="500.0" dy="19">ANTIBIÓTICO</tspan></text><text x="500.0" y="487.3" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">3 días, fiebre y cólico</tspan></text><rect x="40.0" y="301.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="329.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CLOSTRIDIOIDES DIFFICILE</tspan></text><text x="190.0" y="353.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Antibiótico previo: toxinas A y B</tspan><tspan x="190.0" dy="17">Colitis pseudomembranosa</tspan></text><rect x="144.6" y="382.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="397.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="408.2" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="409.2" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="437.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ROTAVIRUS</tspan></text><text x="190.0" y="460.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Diarrea acuosa viral</tspan><tspan x="190.0" dy="17">Sin sangre; típico del lactante</tspan></text><rect x="40.0" y="515.3" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="516.3" width="6.0" height="89.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="544.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CAMPYLOBACTER JEJUNI</tspan></text><text x="190.0" y="567.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Alimento contaminado</tspan><tspan x="190.0" dy="17">Sin antibiótico previo</tspan></text><rect x="660.0" y="354.6" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="355.6" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="383.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">VIBRIO CHOLERAE</tspan></text><text x="810.0" y="407.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Diarrea acuosa profusa</tspan><tspan x="810.0" dy="17">Sin sangre</tspan></text><rect x="660.0" y="461.8" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="462.8" width="6.0" height="89.2" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="490.6" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">SHIGELLA</tspan></text><text x="810.0" y="514.2" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Disentería con pujo y tenesmo</tspan><tspan x="810.0" dy="17">Sin antibiótico previo</tspan></text><text x="40.0" y="642.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="654.5" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="687.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Antibiótico previo</tspan></text><line x1="248.5" y1="683.5" x2="267.5" y2="683.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,678.5 266.5,688.5 274.5,683.5" fill="#0f766e"/><rect x="278.5" y="654.5" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="687.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Toxinas A y B</tspan></text><line x1="487.0" y1="683.5" x2="506.0" y2="683.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,678.5 505.0,688.5 513.0,683.5" fill="#0f766e"/><rect x="517.0" y="654.5" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="687.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">GDH + toxina o PCR</tspan></text><line x1="725.5" y1="683.5" x2="744.5" y2="683.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,678.5 743.5,688.5 751.5,683.5" fill="#0f766e"/><rect x="755.5" y="654.5" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="679.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Fidaxomicina o vancomicina</tspan><tspan x="857.8" dy="17">oral</tspan></text><text x="40.0" y="746.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA INFECCIÓN POR C. DIFFICILE (IDSA/SHEA 2017, ACTUALIZACIÓN 2021)</tspan></text><rect x="40.0" y="758.5" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="777.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">Gravedad</tspan></text><text x="170.0" y="777.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">Criterio</tspan></text><text x="570.0" y="777.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Tratamiento</tspan></text><rect x="40.0" y="787.5" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="806.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">No grave</tspan></text><text x="170.0" y="806.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">Leucocitos ≤ 15 000/µL y creatinina &lt; 1,5 mg/dL</tspan></text><text x="570.0" y="806.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Fidaxomicina 200 mg c/12 h (preferida) o vancomicina oral 125 mg</tspan><tspan x="570.0" dy="15">c/6 h, 10 días</tspan></text><rect x="40.0" y="831.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="850.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">Grave</tspan></text><text x="170.0" y="850.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">Leucocitos ≥ 15 000/µL o creatinina &gt; 1,5 mg/dL</tspan></text><text x="570.0" y="850.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Igual: fidaxomicina o vancomicina oral, 10 días</tspan></text><rect x="40.0" y="860.5" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="879.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">Fulminante</tspan></text><text x="170.0" y="879.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">Hipotensión o shock, íleo o megacolon tóxico</tspan></text><text x="570.0" y="879.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Vancomicina oral 500 mg c/6 h más metronidazol IV; vancomicina</tspan><tspan x="570.0" dy="15">rectal si hay íleo; valorar cirugía</tspan></text><text x="40.0" y="920.5" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El metronidazol solo se acepta en el episodio no grave si no hay fidaxomicina ni vancomicina.</tspan></text><text x="40.0" y="967.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="977.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1008.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="980.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1008.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Clostridium difficile</tspan></text><text x="435.0" y="1008.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Rotavirus</tspan></text><text x="585.0" y="1000.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Campylobacter</tspan><tspan x="585.0" dy="17">jejuni</tspan></text><text x="735.0" y="1008.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Vibrio cholerae</tspan></text><text x="885.0" y="1008.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Shigella sp</tspan></text><rect x="40.0" y="1031.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1031.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1060.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente causal más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="1060.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: antibiótico previo y</tspan><tspan x="285.0" dy="16">toxinas A y B</tspan></text><text x="435.0" y="1060.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: diarrea viral</tspan><tspan x="435.0" dy="16">acuosa sin sangre</tspan></text><text x="585.0" y="1052.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin antibiótico</tspan><tspan x="585.0" dy="16">previo, tras alimento</tspan><tspan x="585.0" dy="16">contaminado</tspan></text><text x="735.0" y="1060.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: diarrea acuosa tipo</tspan><tspan x="735.0" dy="16">agua de arroz</tspan></text><text x="885.0" y="1060.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: disentería sin</tspan><tspan x="885.0" dy="16">antibiótico previo</tspan></text><rect x="40.0" y="977.5" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1121.5" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1149.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1171.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Factor decisivo: antibiótico en las semanas previas (clindamicina, cefalosporinas, quinolonas); cuadro: diarrea, fiebre, cólico y leucocitosis.</tspan><tspan x="58.0" dy="18">• Grave: colitis pseudomembranosa, íleo y megacolon tóxico; la forma fulminante requiere vancomicina oral en dosis altas y valoración quirúrgica.</tspan><tspan x="58.0" dy="18">• Diagnóstico: GDH más toxina o PCR en heces diarreicas; no repetir la prueba para confirmar la cura.</tspan><tspan x="58.0" dy="18">• IDSA/SHEA 2021: fidaxomicina 200 mg c/12 h por 10 días (1.ª línea) o vancomicina oral 125 mg c/6 h; suspender el antibiótico causal y evitar</tspan><tspan x="58.0" dy="18">   antimotilidad.</tspan></text><text x="58.0" y="1265.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IDSA/SHEA, actualización de la guía de C. difficile (Clin Infect Dis 2021;73:e1029); ACG, C. difficile (Am J Gastroenterol 2021;116:1124)</tspan></text></svg>