<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1084" viewBox="0 0 1000 1084" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lupus con tres óbitos fetales: buscar anticuerpos antifosfolípido"><title>Lupus con tres óbitos fetales: buscar anticuerpos antifosfolípido</title><rect x="0.75" y="0.75" width="998.5" height="1082.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Embarazo y enfermedades autoinmunes · síndrome antifosfolípido</tspan></text><rect x="592.4" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="679.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="679.6" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome antifosfolípido (SAF)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Anticuerpos que forman trombos, también en la placenta.</tspan><tspan x="58.0" dy="17">Diagnóstico: 1 criterio clínico + 1 de laboratorio (repetido a las 12 semanas).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 20 semanas con lupus</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tres óbitos fetales previos.</tspan><tspan x="640.0" dy="16">El laboratorio solo puede procesar una prueba.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿CUMPLE CRITERIOS DE SAF?</tspan></text><rect x="40.0" y="269.0" width="596.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="466"><tspan x="56.0" dy="0">CRITERIOS DEL SAF</tspan></text><text x="620.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="620.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="303.0" width="596.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="313.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="328.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="327.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Clínico: ≥ 1 muerte fetal ≥ 10 semanas</tspan></text><text x="86.0" y="343.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Tres óbitos fetales</tspan></text><text x="620.0" y="327.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sí</tspan></text><rect x="40.0" y="349.0" width="596.0" height="46.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="359.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="374.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="373.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Clínico: trombosis venosa o arterial</tspan></text><text x="86.0" y="389.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">No se menciona</tspan></text><text x="620.0" y="373.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="395.0" width="596.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="405.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="420.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="419.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Clínico: parto &lt; 34 sem por preeclampsia o insuficiencia placentaria</tspan></text><text x="86.0" y="435.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">No se menciona</tspan></text><text x="620.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="441.0" width="596.0" height="46.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="451.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="466.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="465.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Laboratorio: anticardiolipina IgG o IgM</tspan></text><text x="86.0" y="481.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Es la prueba a pedir</tspan></text><text x="620.0" y="465.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="487.0" width="596.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="497.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="512.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="511.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Laboratorio: anticoagulante lúpico o anti-β2GPI</tspan></text><text x="86.0" y="527.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Alternativas</tspan></text><text x="620.0" y="511.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="533.0" width="596.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="555.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="564"><tspan x="56.0" dy="0">Cumple 1 de 5 · 1 clínico + 1 de laboratorio</tspan></text><text x="56.0" y="575.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="564"><tspan x="56.0" dy="0">Tiene el criterio clínico: pedir anticardiolipina para confirmar SAF</tspan></text><rect x="40.0" y="269.0" width="596.0" height="321.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="656.0" y="269.0" width="304.0" height="410.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="668.0" y="279.0" width="180.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="677.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="677.0" dy="0">POR QUÉ MUEREN LOS FETOS</tspan></text><g data-box="670.0 307.0 276.0 318.0"><g transform="translate(670.0,307.0) scale(0.92)"><ellipse cx="150" cy="150" rx="124" ry="142" fill="#fbcfe8" stroke="#be185d" stroke-width="3" /><ellipse cx="150" cy="150" rx="108" ry="126" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" /><path d="M40 70 C80 20 170 10 230 30 L210 62 C160 44 100 50 62 88 Z" fill="#9f1239" stroke="#881337" stroke-width="1.5" stroke-linejoin="round" /><ellipse cx="155.7" cy="124.4" rx="41.8" ry="55.099999999999994" fill="#fcd5b5" stroke="#e9b48f" stroke-width="1.6" transform="rotate(-10 155.7 124.4)" /><circle cx="150" cy="202.3" r="34.199999999999996" fill="#fcd5b5" stroke="#e9b48f" stroke-width="1.6" /><path d="M178.5 103.5 q26 17.099999999999998 8 41.8" fill="none" stroke="#e9b48f" stroke-width="4.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M123.4 151.0 q-18 20.9 6 34.199999999999996" fill="none" stroke="#e9b48f" stroke-width="4.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M138 288 L138 324 M162 288 L162 324" fill="none" stroke="#be185d" stroke-width="8" stroke-linejoin="round" /><circle cx="96" cy="66" r="5" fill="#1f2937" stroke="none" stroke-width="0" /><circle cx="130" cy="50" r="5" fill="#1f2937" stroke="none" stroke-width="0" /><circle cx="170" cy="44" r="5" fill="#1f2937" stroke="none" stroke-width="0" /><circle cx="204" cy="48" r="5" fill="#1f2937" stroke="none" stroke-width="0" /><text x="238" y="24" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Trombos en la</text><text x="238" y="24" font-size="10.5" font-weight="800" fill="#1f2937" text-anchor="start" data-max="0">Trombos en la</text><text x="238" y="38" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">placenta</text><text x="238" y="38" font-size="10.5" font-weight="800" fill="#1f2937" text-anchor="start" data-max="0">placenta</text></g></g><text x="670.0" y="641.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="276"><tspan x="670.0" dy="0">Trombos en los vasos de la placenta: el feto deja de</tspan><tspan x="670.0" dy="15">recibir sangre.</tspan></text><text x="40.0" y="711.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="721.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="722.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="745.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Anti-ADN de doble cadena</tspan></text><text x="58.0" y="766.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Mide actividad del lupus, no explica las pérdidas.</tspan></text><rect x="351.3" y="721.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="722.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="745.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Anti-Ro/SSA y anti-La</tspan></text><text x="369.3" y="766.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Bloqueo cardiaco congénito (lupus neonatal).</tspan></text><rect x="662.7" y="721.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="722.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="745.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Dímero D</tspan></text><text x="680.7" y="766.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Inespecífico: sube en todo embarazo.</tspan></text><text x="40.0" y="830.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="840.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="862.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="862.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Anti-ADNdc</tspan></text><rect x="400.5" y="843.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="862.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Anticardiolipina</tspan></text><text x="678.8" y="862.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Anti-Ro/La</tspan></text><text x="866.2" y="862.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Dímero D</tspan></text><rect x="40.0" y="877.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="877.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="898.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Confirma SAF?</tspan></text><text x="303.8" y="898.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="898.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí (criterio de laboratorio)</tspan></text><text x="678.8" y="898.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="898.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="840.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="935.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="963.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="985.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pérdidas fetales repetidas en lupus: sospechar SAF secundario.</tspan><tspan x="58.0" dy="18">• Laboratorio: anticardiolipina (IgG/IgM), anti-β2-glicoproteína I o anticoagulante lúpico.</tspan><tspan x="58.0" dy="18">• Tratamiento en el embarazo: aspirina en dosis bajas + heparina de bajo peso molecular.</tspan></text><text x="58.0" y="1043.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Criterios de Sídney (2006) y ACR/EULAR (2023); ACOG Practice Bulletins n.º 132.</tspan></text></svg>