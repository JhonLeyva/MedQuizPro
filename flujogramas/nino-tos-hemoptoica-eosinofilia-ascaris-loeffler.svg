<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1152" viewBox="0 0 1000 1152" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño con molestias digestivas, tos con esputo hemoptoico y eosinofilia: ascariasis en fase de migración pulmonar (síndrome de Löffler)"><title>Niño con molestias digestivas, tos con esputo hemoptoico y eosinofilia: ascariasis en fase de migración pulmonar (síndrome de Löffler)</title><rect x="0.75" y="0.75" width="998.5" height="1150.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parasitosis intestinal · Ascaris</tspan></text><rect x="380.0" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="448.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="448.4" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ascaris lumbricoides</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se traga el huevo → la larva sale en el intestino, viaja por la sangre al pulmón, sube por la</tspan><tspan x="58.0" dy="17">tráquea y se traga de nuevo → adulto en el intestino.</tspan><tspan x="58.0" dy="17">Al pasar por el pulmón: tos, sibilancias, esputo con sangre y eosinofilia (síndrome de</tspan><tspan x="58.0" dy="17">Löffler).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 8 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Episodios de diarrea y distensión; hace 3 semanas tos</tspan><tspan x="640.0" dy="16">con esputo con sangre.</tspan><tspan x="640.0" dy="16">Afebril; roncantes; leucocitos 15 000 con 10 % de</tspan><tspan x="640.0" dy="16">eosinófilos; Hb 10,8.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CICLO DE ASCARIS: POR QUÉ TOSE</tspan></text><rect x="40.0" y="301.0" width="228.0" height="397.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="143.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">DÓNDE PASA LA LARVA</tspan></text><g data-box="54.0 339.0 200.0 320.0"><g transform="translate(84.0,339.0) scale(0.6)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde68a" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fecaca" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g></g><text x="54.0" y="675.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Pulmón (fase de Löffler) e intestino.</tspan></text><ellipse cx="622.0" cy="465.0" rx="246.0" ry="120.0" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><polygon points="804.0,384.1 787.5,383.8 793.6,371.2" fill="#0f766e"/><polygon points="787.9,553.8 798.3,540.9 804.4,553.5" fill="#0f766e"/><polygon points="440.0,545.9 456.5,546.2 450.4,558.8" fill="#0f766e"/><polygon points="456.1,376.2 445.7,389.1 439.6,376.5" fill="#0f766e"/><text x="622.0" y="469.0" font-size="12.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="300"><tspan x="622.0" dy="0">Ascaris</tspan></text><rect x="534.0" y="318.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="536.0" cy="320.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="536.0" y="324.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="536.0" dy="0">1</tspan></text><text x="622.0" y="340.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="622.0" dy="0">Huevo ingerido</tspan></text><text x="622.0" y="356.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="622.0" dy="0">tierra, manos, verduras</tspan></text><rect x="780.0" y="438.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="782.0" cy="440.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="782.0" y="444.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="782.0" dy="0">2</tspan></text><text x="868.0" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="868.0" dy="0">Larva en el intestino</tspan></text><text x="868.0" y="476.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="868.0" dy="0">atraviesa la pared</tspan></text><rect x="534.0" y="551.0" width="176.0" height="68.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><circle cx="536.0" cy="553.0" r="11" fill="#7c2d12" stroke="none" stroke-width="0"/><text x="536.0" y="557.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="536.0" dy="0">3</tspan></text><text x="622.0" y="573.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="156"><tspan x="622.0" dy="0">Pulmón (Löffler)</tspan></text><text x="622.0" y="589.0" font-size="10.5" font-weight="500" font-style="normal" fill="#fff7ed" text-anchor="middle" data-max="156"><tspan x="622.0" dy="0">tos, esputo con sangre,</tspan><tspan x="622.0" dy="14">eosinofilia</tspan></text><rect x="576.6" y="608.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="622.0" y="623.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="622.0" dy="0">◆ ESTE CASO</tspan></text><rect x="288.0" y="438.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="290.0" cy="440.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="290.0" y="444.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="290.0" dy="0">4</tspan></text><text x="376.0" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="376.0" dy="0">Adulto en el intestino</tspan></text><text x="376.0" y="476.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="376.0" dy="0">tras tragar la larva</tspan></text><text x="40.0" y="730.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACER</tspan></text><rect x="40.0" y="740.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="741.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="764.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Albendazol</tspan></text><text x="58.0" y="785.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">400 mg dosis única</tspan></text><rect x="237.5" y="729.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="744.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="740.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="741.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="764.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Heces más adelante</tspan></text><text x="369.3" y="785.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Huevos a las 6-8 semanas</tspan></text><rect x="662.7" y="740.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="741.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="764.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Prevención</tspan></text><text x="680.7" y="785.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Lavado de manos y verduras</tspan></text><text x="40.0" y="849.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="859.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="890.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="890.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Giardia lamblia</tspan></text><text x="435.0" y="881.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Enterobius</tspan><tspan x="435.0" dy="17">vermicularis</tspan></text><rect x="513.0" y="862.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="881.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ascaris</tspan><tspan x="585.0" dy="17">lumbricoides</tspan></text><text x="735.0" y="890.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tricocephalo dispar</tspan></text><text x="885.0" y="881.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Strongyloides</tspan><tspan x="885.0" dy="17">stercoralis</tspan></text><rect x="40.0" y="913.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="913.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="950.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente?</tspan></text><text x="285.0" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no pasa por el</tspan><tspan x="285.0" dy="16">pulmón</tspan></text><text x="435.0" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no pasa por el</tspan><tspan x="435.0" dy="16">pulmón</tspan></text><text x="585.0" y="950.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: ciclo pulmonar</tspan></text><text x="735.0" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no tiene fase</tspan><tspan x="735.0" dy="16">pulmonar</tspan></text><text x="885.0" y="934.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">También pasa por el</tspan><tspan x="885.0" dy="16">pulmón, pero clásico</tspan><tspan x="885.0" dy="16">en inmunodeprimidos</tspan></text><rect x="40.0" y="859.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1003.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1031.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1053.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Examen de heces (huevos) a las 6-8 semanas; en la fase pulmonar aún no hay huevos.</tspan><tspan x="58.0" dy="18">• Albendazol 400 mg dosis única (o mebendazol 100 mg c/12 h 3 días).</tspan><tspan x="58.0" dy="18">• Complicaciones: obstrucción intestinal por ovillos, migración a vía biliar.</tspan></text><text x="58.0" y="1111.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, geohelmintiasis (2023); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>