<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="854" viewBox="0 0 1000 854" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Pseudomonas y otros gramnegativos en el agua potable del hospital: transmisión por vehículo (objeto o sustancia inanimada)"><title>Pseudomonas y otros gramnegativos en el agua potable del hospital: transmisión por vehículo (objeto o sustancia inanimada)</title><rect x="0.75" y="0.75" width="998.5" height="852.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · mecanismos de transmisión</tspan></text><rect x="462.5" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="534.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="534.2" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mecanismos de transmisión</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Directa: contacto, gotitas. Indirecta: vehículo (agua, alimentos, objetos), vector (insectos) o</tspan><tspan x="58.0" dy="17">aérea (núcleos de gotitas).</tspan><tspan x="58.0" dy="17">El agua contaminada es un vehículo común: muchos se exponen a la vez.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hospital</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pseudomonas y otros gramnegativos en el agua</tspan><tspan x="640.0" dy="16">potable.</tspan><tspan x="640.0" dy="16">¿Contra qué vía se toman medidas?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LA CADENA DE ESTA INFECCIÓN Y DÓNDE SE CORTA</tspan></text><rect x="40.0" y="285.0" width="163.2" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="121.6" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Agente</tspan></text><text x="121.6" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Pseudomonas,</tspan><tspan x="121.6" dy="16">gramnegativos</tspan></text><line x1="206.2" y1="322.5" x2="219.2" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="218.2,317.5 218.2,327.5 226.2,322.5" fill="#0f766e"/><line x1="121.6" y1="362.0" x2="121.6" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="378.0" width="163.2" height="47.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="121.6" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">✂ CORTA</tspan></text><text x="121.6" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Cultivos de vigilancia</tspan></text><rect x="229.2" y="285.0" width="163.2" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="310.8" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Reservorio</tspan></text><text x="310.8" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Tuberías, tanques, grifos</tspan></text><line x1="395.4" y1="322.5" x2="408.4" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="407.4,317.5 407.4,327.5 415.4,322.5" fill="#0f766e"/><line x1="310.8" y1="362.0" x2="310.8" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="229.2" y="378.0" width="163.2" height="47.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="310.8" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">✂ CORTA</tspan></text><text x="310.8" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Desinfectar el sistema</tspan></text><rect x="418.4" y="285.0" width="163.2" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="500.0" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Vehículo</tspan></text><text x="500.0" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Agua potable del hospital</tspan></text><line x1="584.6" y1="322.5" x2="597.6" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="596.6,317.5 596.6,327.5 604.6,322.5" fill="#0f766e"/><line x1="500.0" y1="362.0" x2="500.0" y2="376.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="418.4" y="378.0" width="163.2" height="47.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="500.0" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">✂ CORTA</tspan></text><text x="500.0" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Filtros y agua estéril</tspan></text><rect x="454.6" y="414.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="429.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="607.6" y="285.0" width="163.2" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="689.2" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Entrada</tspan></text><text x="689.2" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Heridas, vías, mucosas</tspan></text><line x1="773.8" y1="322.5" x2="786.8" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="785.8,317.5 785.8,327.5 793.8,322.5" fill="#0f766e"/><line x1="689.2" y1="362.0" x2="689.2" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="607.6" y="378.0" width="163.2" height="47.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="689.2" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">✂ CORTA</tspan></text><text x="689.2" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Asepsia de dispositivos</tspan></text><rect x="796.8" y="285.0" width="163.2" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="878.4" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Huésped</tspan></text><text x="878.4" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">UCI, inmunodeprimidos</tspan></text><line x1="878.4" y1="362.0" x2="878.4" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="796.8" y="378.0" width="163.2" height="47.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="878.4" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">✂ CORTA</tspan></text><text x="878.4" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Vigilancia</tspan></text><rect x="40.0" y="455.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="481.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Agua contaminada = transmisión por vehículo</tspan></text><text x="60.0" y="500.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se corta tratando la fuente de agua.</tspan></text><text x="40.0" y="567.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="577.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="608.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="608.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aérea</tspan></text><rect x="363.0" y="580.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="608.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Vehículo</tspan></text><text x="585.0" y="608.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Vectorial</tspan></text><text x="735.0" y="608.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Fluidos</tspan></text><text x="885.0" y="599.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Contacto directo</tspan><tspan x="885.0" dy="17">persona a persona</tspan></text><rect x="40.0" y="631.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="631.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="660.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Vía?</tspan></text><text x="285.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: núcleos de gotitas</tspan><tspan x="285.0" dy="16">en el aire</tspan></text><text x="435.0" y="652.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: el agua es el</tspan><tspan x="435.0" dy="16">vehículo</tspan></text><text x="585.0" y="660.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no hay insecto</tspan></text><text x="735.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no son fluidos</tspan><tspan x="735.0" dy="16">corporales</tspan></text><text x="885.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es de persona a</tspan><tspan x="885.0" dy="16">persona</tspan></text><rect x="40.0" y="577.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="705.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="733.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="755.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cortar la fuente: desinfectar el sistema de agua, filtros en grifos de áreas críticas, cultivos de control.</tspan><tspan x="58.0" dy="18">• Vigilar infecciones en pacientes de UCI e inmunodeprimidos.</tspan><tspan x="58.0" dy="18">• No usar agua del grifo para dispositivos (nebulizadores, humidificadores).</tspan></text><text x="58.0" y="813.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, control ambiental de infecciones (2003; act. 2019); OMS.</tspan></text></svg>