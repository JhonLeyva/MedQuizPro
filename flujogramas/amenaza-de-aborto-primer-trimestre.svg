xt><rect x="668.0" y="215.0" width="292" height="114.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M668.0,225.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="814.0" y="239.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Aborto retenido (frustro)</tspan></text><text x="814.0" y="271.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Cérvix cerrado</tspan><tspan x="814.0" dy="17">Embrión SIN latido</tspan><tspan x="814.0" dy="17">Poco o ningún sangrado</tspan></text><line x1="186.0" y1="329.0" x2="186.0" y2="350.0" stroke="#0f766e" stroke-width="2"/><polygon points="181.0,349.0 191.0,349.0 186.0,357.0" fill="#0f766e"/><rect x="100.0" y="357.0" width="800" height="82.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="383.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">MANEJO DE LA AMENAZA DE ABORTO</tspan></text><text x="500.0" y="406.0" font-size="12.5" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">Reposo relativo, evitar relaciones sexuales, analgesia</tspan><tspan x="500.0" dy="17.5">Control ecográfico y signos de alarma</tspan></text><rect x="40" y="465.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="493.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="515.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Lo que diferencia los tipos de aborto: estado del cérvix y vitalidad embrionaria.</tspan><tspan x="58.0" dy="18">• La mayoría de amenazas de aborto con latido positivo continúan la gestación.</tspan></text><text x="58.0" y="555.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: INMP – Guías de Práctica Clínica en Obstetricia 2023 · Williams Obstetricia 26.ª ed.</tspan></text></svg>
