<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="855" viewBox="0 0 1000 855" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La dopamina es el neurotransmisor de la vía mesolímbica de recompensa y de la adicción"><title>La dopamina es el neurotransmisor de la vía mesolímbica de recompensa y de la adicción</title><rect x="0.75" y="0.75" width="998.5" height="853.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurofisiología · recompensa y adicción</tspan></text><rect x="438.6" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="495.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="495.4" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sistema mesocorticolímbico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nace en el área tegmental ventral y proyecta al núcleo accumbens, amígdala, hipocampo y</tspan><tspan x="58.0" dy="17">corteza prefrontal.</tspan><tspan x="58.0" dy="17">La dopamina señala saliencia y aprendizaje.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué neurotransmisor del sistema mesolímbico</tspan><tspan x="640.0" dy="16">participa en la recompensa y la adicción?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA RECOMPENSA A LA ADICCIÓN</tspan></text><rect x="40.0" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Área tegmental ventral</tspan></text><text x="145.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Neuronas dopaminérgicas del</tspan><tspan x="145.2" dy="16">mesencéfalo</tspan></text><line x1="253.5" y1="306.5" x2="266.5" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,301.5 265.5,311.5 273.5,306.5" fill="#0f766e"/><line x1="145.2" y1="346.0" x2="145.2" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="362.0" width="210.5" height="47.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.2" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Origen de la vía</tspan></text><rect x="276.5" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Núcleo accumbens</tspan></text><text x="381.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Libera dopamina ante el placer</tspan></text><line x1="490.0" y1="306.5" x2="503.0" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,301.5 502.0,311.5 510.0,306.5" fill="#0f766e"/><line x1="381.8" y1="346.0" x2="381.8" y2="360.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="362.0" width="210.5" height="47.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="381.8" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Señala saliencia</tspan></text><rect x="337.6" y="398.0" width="88.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="381.8" y="413.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="381.8" dy="0">◆ PREGUNTA</tspan></text><rect x="513.0" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Corteza prefrontal</tspan></text><text x="618.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Control de impulsos</tspan></text><line x1="726.5" y1="306.5" x2="739.5" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,301.5 738.5,311.5 746.5,306.5" fill="#0f766e"/><line x1="618.2" y1="346.0" x2="618.2" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="362.0" width="210.5" height="47.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="618.2" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Se deteriora con el uso crónico</tspan></text><rect x="749.5" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Adicción</tspan></text><text x="854.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Deseo condicionado y recaída</tspan></text><line x1="854.8" y1="346.0" x2="854.8" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="362.0" width="210.5" height="47.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="854.8" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Neuroadaptación</tspan></text><rect x="40.0" y="439.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="465.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Recompensa y adicción = dopamina</tspan></text><text x="60.0" y="484.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Serotonina, acetilcolina y glutamato modulan, pero no son el transmisor central.</tspan></text><text x="40.0" y="551.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="561.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="583.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="583.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Serotonina</tspan></text><text x="435.0" y="583.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Acetilcolina</tspan></text><rect x="513.0" y="564.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="583.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Dopamina</tspan></text><text x="735.0" y="583.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Glutamato</tspan></text><text x="885.0" y="583.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Adrenalina</tspan></text><rect x="40.0" y="598.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="598.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="627.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Transmisor de la</tspan><tspan x="54.0" dy="16">recompensa?</tspan></text><text x="285.0" y="619.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: modula ánimo e</tspan><tspan x="285.0" dy="16">impulsos, no es el</tspan><tspan x="285.0" dy="16">mediador central</tspan></text><text x="435.0" y="627.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: interviene en</tspan><tspan x="435.0" dy="16">memoria y aprendizaje</tspan></text><text x="585.0" y="619.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: vía del área</tspan><tspan x="585.0" dy="16">tegmental ventral al</tspan><tspan x="585.0" dy="16">accumbens</tspan></text><text x="735.0" y="619.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: excitador principal,</tspan><tspan x="735.0" dy="16">participa en la</tspan><tspan x="735.0" dy="16">plasticidad</tspan></text><text x="885.0" y="627.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: papel periférico y</tspan><tspan x="885.0" dy="16">de alerta</tspan></text><rect x="40.0" y="561.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="688.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="716.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="738.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Casi todas las sustancias adictivas (cocaína, anfetaminas, opioides, nicotina, alcohol) elevan la dopamina sináptica en el núcleo accumbens.</tspan><tspan x="58.0" dy="18">• Con el consumo crónico hay neuroadaptación: menos reacción a recompensas naturales, deseo condicionado por señales y menor control prefrontal.</tspan><tspan x="58.0" dy="18">• Serotonina: ánimo e impulsos. Acetilcolina: memoria. Glutamato: excitador y plasticidad. Adrenalina: papel periférico y de alerta.</tspan><tspan x="58.0" dy="18">• Perla: los antipsicóticos bloquean D2 y pueden causar anhedonia y disforia; en la adicción se usan naltrexona y terapias psicosociales.</tspan></text><text x="58.0" y="814.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman y Gilman 14.ª ed. (2023); Kandel, Principles of Neural Science 6.ª ed. (2021).</tspan></text></svg>