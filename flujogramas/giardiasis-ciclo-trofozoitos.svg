<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="767" viewBox="0 0 1000 767" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diarrea aguda por Giardia: en las heces diarreicas se encuentran trofozoítos"><title>Diarrea aguda por Giardia: en las heces diarreicas se encuentran trofozoítos</title><rect x="0.75" y="0.75" width="998.5" height="765.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parasitosis intestinales · giardiasis</tspan></text><rect x="407.2" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="475.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="475.5" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Giardiasis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Giardia lamblia (G. intestinalis) se transmite por agua o manos con quistes.</tspan><tspan x="58.0" dy="17">Diarrea acuosa, distensión, flatulencia; puede dar malabsorción en niños.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preescolar</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diarrea aguda.</tspan><tspan x="640.0" dy="16">Examen de heces confirma Giardia.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CICLO DE GIARDIA LAMBLIA</tspan></text><rect x="42.0" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="193.3" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">INGESTIÓN</tspan></text><text x="193.3" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Agua o manos</tspan></text><rect x="348.7" y="279.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="500.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">DUODENO</tspan></text><text x="500.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Se desenquista</tspan></text><rect x="655.3" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">COLON</tspan></text><text x="806.7" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Heces formadas</tspan></text><rect x="454.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="290.7" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="193.3" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">QUISTE INFECTANTE</tspan></text><text x="193.3" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Resiste el cloro</tspan><tspan x="193.3" dy="17">Bastan 10 quistes</tspan></text><rect x="354.7" y="349.0" width="290.7" height="108.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">TROFOZOÍTO</tspan></text><text x="500.0" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Se pega con su disco ventral</tspan><tspan x="500.0" dy="17">Causa la diarrea</tspan><tspan x="500.0" dy="17">Este caso: en heces líquidas</tspan></text><rect x="661.3" y="349.0" width="290.7" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">QUISTE</tspan></text><text x="806.7" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Sale al ambiente</tspan><tspan x="806.7" dy="17">Contagia</tspan></text><text x="40.0" y="497.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="507.2" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="529.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="529.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Huevos</tspan></text><rect x="363.0" y="510.2" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="529.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Trofozoítos</tspan></text><text x="585.0" y="529.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Quistes</tspan></text><text x="735.0" y="529.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Larvas</tspan></text><text x="885.0" y="529.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cisticercos</tspan></text><rect x="40.0" y="544.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="544.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="573.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Estadío?</tspan></text><text x="285.0" y="565.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: Giardia no pone</tspan><tspan x="285.0" dy="16">huevos</tspan></text><text x="435.0" y="565.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: forma que vive en</tspan><tspan x="435.0" dy="16">el intestino</tspan></text><text x="585.0" y="565.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">En heces formadas, no</tspan><tspan x="585.0" dy="16">en diarrea</tspan></text><text x="735.0" y="573.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no tiene larvas</tspan></text><text x="885.0" y="565.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es de Taenia</tspan><tspan x="885.0" dy="16">solium</tspan></text><rect x="40.0" y="507.2" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="618.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="646.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="668.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Heces líquidas (tránsito rápido): trofozoítos; heces formadas: quistes.</tspan><tspan x="58.0" dy="18">• Se pide examen seriado (3 muestras) o antígeno en heces.</tspan><tspan x="58.0" dy="18">• Tratamiento: metronidazol 5-7 días, tinidazol dosis única o nitazoxanida.</tspan></text><text x="58.0" y="726.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, DPDx giardiasis (2024); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>