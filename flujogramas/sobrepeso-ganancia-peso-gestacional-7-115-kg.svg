fff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="928.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="957.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Ganancia?</tspan></text><text x="285.0" y="957.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sobrepeso</tspan></text><text x="435.0" y="949.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Cerca del rango</tspan><tspan x="435.0" dy="16">normal (11,5-16)</tspan></text><text x="585.0" y="957.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Es para bajo peso</tspan></text><text x="735.0" y="957.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Es para obesidad</tspan></text><text x="885.0" y="957.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Excesivo</tspan></text><rect x="40.0" y="891.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1002.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1030.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1052.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Controlar el peso en cada consulta y graficarlo.</tspan><tspan x="58.0" dy="18">• Actividad física moderada 150 min/semana si no hay contraindicación.</tspan><tspan x="58.0" dy="18">• Dieta saludable; el embarazo no es «comer por dos».</tspan></text><text x="58.0" y="1110.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IOM/NAM (2009, vigente); ACOG (2020); MINSA Perú.</tspan></text></svg>