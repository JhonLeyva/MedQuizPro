 25 y 29,9?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">SUBIR 7 A 11,5 KG</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">≈ 0,3 kg/semana en 2.º-3.er trimestre</tspan></text><rect x="507.0" y="415.0" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Subir 5 a 9 kg</tspan></text><text x="733.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Obesidad</tspan></text><text x="40.0" y="528.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="540.5" width="920.0" height="301.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="554.5" width="359.0" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="235.5" y="574.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="235.5" dy="0">GANANCIA DE PESO RECOMENDADA (IOM 2009)</tspan></text><text x="431.0" y="574.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="511"><tspan x="431.0" dy="0">Según el IMC antes del embarazo (gestación única).</tspan></text><rect x="56.0" y="614.5" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="615.1" width="211.8" 