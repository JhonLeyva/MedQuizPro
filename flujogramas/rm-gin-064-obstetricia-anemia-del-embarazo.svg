<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1136" viewBox="0 0 1000 1136" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hematocrito de 31 % con VCM, HCM y CHCM bajos en la semana 28: anemia microcítica hipocrómica ferropénica"><title>Hematocrito de 31 % con VCM, HCM y CHCM bajos en la semana 28: anemia microcítica hipocrómica ferropénica</title><rect x="0.75" y="0.75" width="998.5" height="1134.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · anemia del embarazo</tspan></text><rect x="401.7" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="481.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="481.4" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Anemia en el embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La hemodilución fisiológica baja el hematocrito, pero los índices corpusculares deben ser</tspan><tspan x="58.0" dy="17">normales.</tspan><tspan x="58.0" dy="17">La causa más frecuente es la deficiencia de hierro.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 22 años, 28 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hematocrito de 31 %.</tspan><tspan x="640.0" dy="16">VCM, HCM y CHCM disminuidos; sin hemorragia.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LEER EL HEMOGRAMA DE LA GESTANTE</tspan></text><rect x="40.0" y="269.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="307.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="331.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Hematocrito</tspan></text><text x="250.0" y="332.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">31 %  ↓</tspan></text><text x="400.0" y="331.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Descenso fisiológico leve</tspan></text><text x="550.0" y="331.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Hemodilución, pero con índices bajos es anemia.</tspan></text><rect x="40.0" y="351.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="375.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">VCM</tspan></text><text x="250.0" y="376.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Disminuido  ↓</tspan></text><text x="400.0" y="375.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">80-100 fL</tspan></text><text x="550.0" y="375.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Microcitosis: glóbulos pequeños.</tspan></text><rect x="40.0" y="395.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">HCM</tspan></text><text x="250.0" y="420.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Disminuida  ↓</tspan></text><text x="400.0" y="419.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">27-33 pg</tspan></text><text x="550.0" y="419.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Menos hemoglobina por glóbulo.</tspan></text><rect x="40.0" y="439.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="463.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">CHCM</tspan></text><text x="250.0" y="464.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Menor de 30 %  ↓</tspan></text><text x="400.0" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">32-36 %</tspan></text><text x="550.0" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Hipocromía: déficit de hierro.</tspan></text><rect x="40.0" y="497.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="523.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">VCM, HCM y CHCM bajos = anemia ferropénica</tspan></text><text x="60.0" y="542.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La hemodilución no baja los índices corpusculares.</tspan></text><text x="40.0" y="603.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ANEMIA EN LA GESTANTE SEGÚN LA HEMOGLOBINA (OMS 2024)</tspan></text><rect x="40.0" y="615.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Trimestre</tspan></text><text x="250.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="250.0" dy="0">Sin anemia</tspan></text><text x="430.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="430.0" dy="0">Leve</tspan></text><text x="610.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="610.0" dy="0">Moderada</tspan></text><text x="790.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="790.0" dy="0">Grave</tspan></text><rect x="40.0" y="644.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Primero y tercero</tspan></text><text x="250.0" y="663.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="250.0" dy="0">11 g/dL o más</tspan></text><text x="430.0" y="663.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="430.0" dy="0">10 a 10,9</tspan></text><text x="610.0" y="663.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="610.0" dy="0">7 a 9,9</tspan></text><text x="790.0" y="663.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="790.0" dy="0">Menos de 7</tspan></text><rect x="40.0" y="673.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="692.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Segundo</tspan></text><text x="250.0" y="692.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="250.0" dy="0">10,5 g/dL o más</tspan></text><text x="430.0" y="692.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="430.0" dy="0">9,5 a 10,4</tspan></text><text x="610.0" y="692.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="610.0" dy="0">7 a 9,4</tspan></text><text x="790.0" y="692.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="790.0" dy="0">Menos de 7</tspan></text><rect x="140.6" y="676.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="691.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="718.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Se ajusta por altitud y tabaquismo. La NTS 213-2024 adopta los mismos cortes de 11 y 10,5 g/dL.</tspan></text><text x="40.0" y="765.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="775.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="814.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="778.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="806.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Anemia microcítica,</tspan><tspan x="285.0" dy="17">hipocrómica</tspan></text><text x="435.0" y="814.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Normal</tspan></text><text x="585.0" y="814.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Anemia macrocítica</tspan></text><text x="735.0" y="814.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hemólisis</tspan></text><text x="885.0" y="797.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Anemia</tspan><tspan x="885.0" dy="17">normocítica,</tspan><tspan x="885.0" dy="17">normocrómica</tspan></text><rect x="40.0" y="846.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="846.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="875.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="875.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: índices bajos,</tspan><tspan x="285.0" dy="16">patrón ferropénico</tspan></text><text x="435.0" y="875.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el hematocrito de</tspan><tspan x="435.0" dy="16">31 % es bajo</tspan></text><text x="585.0" y="875.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la macrocitosis</tspan><tspan x="585.0" dy="16">sugiere folato o B12</tspan></text><text x="735.0" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no hay</tspan><tspan x="735.0" dy="16">reticulocitosis ni LDH</tspan><tspan x="735.0" dy="16">alta</tspan></text><text x="885.0" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: los índices</tspan><tspan x="885.0" dy="16">corpusculares están</tspan><tspan x="885.0" dy="16">bajos</tspan></text><rect x="40.0" y="775.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="936.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="964.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="986.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Microcitosis e hipocromía = deficiencia de hierro. Macrocítica: folato o B12; normocítica: enfermedad crónica o pérdida aguda; hemólisis: reticulocitos,</tspan><tspan x="58.0" dy="18">   LDH y bilirrubina indirecta altos.</tspan><tspan x="58.0" dy="18">• Con hemoglobina menor de 10,5 g/dL en el segundo trimestre (menor de 11 en el primero y tercero) hay anemia; ajustar por altitud.</tspan><tspan x="58.0" dy="18">• Tratamiento: hierro oral elemental diario; hierro intravenoso si hay intolerancia, falla del tratamiento oral o anemia grave.</tspan><tspan x="58.0" dy="18">• Alerta: ferritina baja confirma el déficit; la anemia grave aumenta el riesgo de parto pretérmino y de hemorragia posparto.</tspan></text><text x="58.0" y="1080.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, NTS 213-MINSA/DGIESP-2024; WHO, Guideline on haemoglobin cutoffs to define anaemia (2024); ACOG, Practice Bulletin 233 (2021); Williams Obstetricia,</tspan><tspan x="58.0" dy="15">26.ª ed. (2022).</tspan></text></svg>