4.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="557.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Sí</tspan></text><rect x="485.9" y="544.5" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="557.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">No</tspan></text><polygon points="317.8,320.0 343.8,291.0 811.8,291.0 837.8,320.0 811.8,349.0 343.8,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="363.8" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="363.8" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="363.8" dy="0">?</tspan></text><text x="596.8" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="596.8" dy="0">¿Mediador principal?</tspan></text><polygon points="84.3,444.0 110.3,415.0 578.3,415.0 604.3,444.0 578.3,473.0 110.3,473.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="130.3" cy="444.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="130.3" y="449.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="130.3" dy="0">?</tspan></text><text x="363.3" y="448.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="363.3" dy="0">¿Compromiso de vía aérea?</tspan></text><rect x="40.0" y="571.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="599.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">ADRENALINA IM</tspan></text><text x="188.7" y="622.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">0,3-0,5 mg en el muslo</tspan><tspan x="188.7" dy="17">Repetir cada 5-15 min</tspan></text><rect x="351.3" y="571.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="608.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Antihistamínico</tspan></text><text x="500.0" y="631.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Y corticoide</tspan></text><rect x="662.7" y="415.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">C1 inhibidor</tspan></text><text x="811.3" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Hereditario o por IECA</tspan><tspan x="811.3" dy="17">Icatibant</tspan></text><text x="40.0" y="705.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ADRENALINA: EFECTOS</tspan></text><rect x="40.0" y="715.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="738.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="718.9" width="369.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="397.5" y="738.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="355"><tspan x="397.5" dy="0">Alfa</tspan></text><text x="772.5" y="738.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="355"><tspan x="772.5" dy="0">Beta</tspan></text><rect x="40.0" y="752.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="752.9" width="369.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="773.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Acción</tspan></text><text x="397.5" y="773.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="397.5" dy="0">Vasoconstricción</tspan></text><text x="772.5" y="773.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="353"><tspan x="772.5" dy="0">Broncodilatación</tspan></text><rect x="40.0" y="786.9" width="920.0" height="34.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="786.9" width="369.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="807.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Resultado</tspan></text><text x="397.5" y="807.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="397.5" dy="0">Menos edema</tspan></text><text x="772.5" y="807.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="353"><tspan x="772.5" dy="0">Frena mastocitos</tspan></text><rect x="40.0" y="715.9" width="920.0" height="105.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="844.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="872.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="894.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Antihistamínicos y corticoides actúan tarde.</tspan><tspan x="58.0" dy="18">• Angioedema por IECA: no responde a adrenalina.</tspan><tspan x="58.0" dy="18">• Preparar vía aérea difícil.</tspan></text><text x="58.0" y="952.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WAO – Anaphylaxis guidance (2020) · Harrison. Principios de Medicina Interna 22.ª ed. (2025)</tspan></text></svg>