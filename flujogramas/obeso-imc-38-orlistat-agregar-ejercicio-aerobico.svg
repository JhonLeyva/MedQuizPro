<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1359" viewBox="0 0 1000 1359" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Obeso con IMC 38 que usa orlistat y recupera peso: lo que se debe añadir es actividad física (ejercicio aeróbico) dentro de un cambio de estilo de vida"><title>Obeso con IMC 38 que usa orlistat y recupera peso: lo que se debe añadir es actividad física (ejercicio aeróbico) dentro de un cambio de estilo de vida</title><rect x="0.75" y="0.75" width="998.5" height="1357.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obesidad · tratamiento</tspan></text><rect x="336.0" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="413.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="413.7" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tratamiento de la obesidad</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pilares: dieta con déficit calórico, actividad física (≥ 150-300 min/semana), terapia</tspan><tspan x="58.0" dy="17">conductual; fármacos y cirugía como apoyo.</tspan><tspan x="58.0" dy="17">El ejercicio es clave para mantener el peso perdido y mejora el riesgo cardiometabólico</tspan><tspan x="58.0" dy="17">aunque se baje poco.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 38 años, IMC 38</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Obeso desde los 17 años; pierde y recupera peso.</tspan><tspan x="640.0" dy="16">Se automedica orlistat; ¿qué añadir?</tspan></text><line x1="640.0" y1="218.0" x2="670.0" y2="218.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS PILARES DEL TRATAMIENTO DE LA OBESIDAD</tspan></text><line x1="421.1" y1="376.5" x2="340.0" y2="324.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="324.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="478.7" x2="340.0" y2="531.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="531.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="399.5" x2="660.0" y2="377.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="377.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="455.6" x2="660.0" y2="477.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="477.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="427.6" x2="340.0" y2="427.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="427.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="427.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="427.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="432.6" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">OBESIDAD</tspan></text><text x="500.0" y="451.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">IMC 38</tspan></text><rect x="40.0" y="282.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="283.0" width="6.0" height="82.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="315.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">DIETA</tspan></text><text x="190.0" y="339.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Déficit de 500-750 kcal/día</tspan></text><rect x="40.0" y="382.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="410.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">EJERCICIO AERÓBICO</tspan></text><text x="190.0" y="434.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">150-300 min/semana</tspan><tspan x="190.0" dy="17">Esta pregunta</tspan></text><rect x="144.6" y="463.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="478.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="489.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="490.2" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="522.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">TERAPIA CONDUCTUAL</tspan></text><text x="190.0" y="546.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Hábitos y metas</tspan></text><rect x="660.0" y="335.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="336.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="369.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">FÁRMACOS</tspan></text><text x="810.0" y="393.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Orlistat, semaglutida, tirzepatida</tspan></text><rect x="660.0" y="435.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="436.6" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="469.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CIRUGÍA BARIÁTRICA</tspan></text><text x="810.0" y="493.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">IMC ≥ 40 o ≥ 35 + comorbilidad</tspan></text><text x="40.0" y="609.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="621.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="645.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">IMC 38</tspan></text><line x1="248.5" y1="641.7" x2="267.5" y2="641.7" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,636.7 266.5,646.7 274.5,641.7" fill="#0f766e"/><rect x="278.5" y="621.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="645.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Estilo de vida + ejercicio</tspan></text><line x1="487.0" y1="641.7" x2="506.0" y2="641.7" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,636.7 505.0,646.7 513.0,641.7" fill="#0f766e"/><rect x="517.0" y="621.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="645.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Fármaco si hace falta</tspan></text><line x1="725.5" y1="641.7" x2="744.5" y2="641.7" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,636.7 743.5,646.7 751.5,641.7" fill="#0f766e"/><rect x="755.5" y="621.2" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="645.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Cirugía si falla</tspan></text><text x="40.0" y="702.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="714.2" width="920.0" height="301.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="728.2" width="369.5" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="240.8" y="748.2" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="240.8" dy="0">CLASIFICACIÓN DE LA OBESIDAD POR IMC (OMS)</tspan></text><text x="441.5" y="748.2" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="441.5" dy="0">IMC = peso (kg) ÷ talla² (m).</tspan></text><rect x="56.0" y="788.2" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="788.8" width="211.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="162.5" y="816.2" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">25-29,9</tspan></text><text x="162.5" y="836.2" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Sobrepeso</tspan></text><rect x="281.0" y="788.2" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="788.8" width="211.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="387.5" y="816.2" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">30-34,9</tspan></text><text x="387.5" y="836.2" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Obesidad I</tspan></text><rect x="506.0" y="788.2" width="213.0" height="98.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="507.2" y="789.4" width="210.6" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="612.5" y="816.2" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">35-39,9</tspan></text><text x="612.5" y="836.2" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Obesidad II</tspan></text><circle cx="522.0" cy="861.2" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="532.0" y="865.2" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Cirugía si hay comorbilidades</tspan></text><rect x="567.1" y="777.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="612.5" y="792.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="612.5" dy="0">◆ ESTE CASO</tspan></text><rect x="731.0" y="788.2" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="731.6" y="788.8" width="211.8" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="837.5" y="816.2" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">≥ 40</tspan></text><text x="837.5" y="836.2" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Obesidad III</tspan></text><circle cx="747.0" cy="861.2" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="757.0" y="865.2" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Considerar cirugía bariátrica</tspan></text><text x="56.0" y="916.2" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="925.2" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="940.2" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="940.2" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">IMC 38</tspan></text><rect x="56.0" y="962.2" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="985.2" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Estilo de vida con ejercicio aeróbico; fármacos (semaglutida o tirzepatida) con indicación médica.</tspan></text><text x="40.0" y="1055.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1065.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1104.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1104.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Dieta vegana</tspan></text><text x="435.0" y="1104.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Metformina</tspan></text><text x="585.0" y="1104.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Dieta mediterránea</tspan></text><rect x="663.0" y="1068.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1096.2" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ejercicios</tspan><tspan x="735.0" dy="17">aeróbicos</tspan></text><text x="885.0" y="1087.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Suspender el</tspan><tspan x="885.0" dy="17">orlistat y solo</tspan><tspan x="885.0" dy="17">vigilar</tspan></text><rect x="40.0" y="1136.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1136.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1165.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué añadir?</tspan></text><text x="285.0" y="1157.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es superior a</tspan><tspan x="285.0" dy="16">otras dietas</tspan></text><text x="435.0" y="1157.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es fármaco</tspan><tspan x="435.0" dy="16">para obesidad</tspan></text><text x="585.0" y="1157.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Útil, pero la pregunta</tspan><tspan x="585.0" dy="16">busca el ejercicio</tspan></text><text x="735.0" y="1165.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: pilar del tratamiento</tspan></text><text x="885.0" y="1157.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: abandona el</tspan><tspan x="885.0" dy="16">tratamiento</tspan></text><rect x="40.0" y="1065.2" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1210.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1238.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1260.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ejercicio aeróbico 150-300 min/semana + fuerza 2 veces/semana; dieta con déficit de 500-750 kcal/día.</tspan><tspan x="58.0" dy="18">• Fármacos con más eficacia hoy: semaglutida o tirzepatida (con indicación médica).</tspan><tspan x="58.0" dy="18">• IMC ≥ 35 con comorbilidades o ≥ 40: considerar cirugía bariátrica.</tspan></text><text x="58.0" y="1318.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA Standards of Care in Diabetes 2026; Endocrine Society; AACE, obesidad (2025); OMS, IMC.</tspan></text></svg>