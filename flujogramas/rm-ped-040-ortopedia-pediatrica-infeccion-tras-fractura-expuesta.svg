<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1177" viewBox="0 0 1000 1177" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fiebre y dolor 15 días después de una fractura expuesta tratada: osteomielitis postraumática"><title>Fiebre y dolor 15 días después de una fractura expuesta tratada: osteomielitis postraumática</title><rect x="0.75" y="0.75" width="998.5" height="1175.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ortopedia pediátrica · infección tras fractura expuesta</tspan></text><rect x="518.6" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="567.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="567.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección relacionada con fractura</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La fractura expuesta contamina el hueso.</tspan><tspan x="58.0" dy="17">El riesgo crece con el grado de Gustilo-Anderson.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 12 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fractura expuesta de tibia hace 15 días, con reducción</tspan><tspan x="640.0" dy="16">e inmovilización.</tspan><tspan x="640.0" dy="16">Dolor, fiebre e impotencia funcional.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVOLUCIÓN DE UNA FRACTURA EXPUESTA, EN ORDEN</tspan></text><text x="44.0" y="299.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Cada problema tiene su momento: el del caso aparece a las dos semanas.</tspan></text><line x1="155.0" y1="338.0" x2="293.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="338.0" x2="477.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="338.0" x2="661.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="338.0" x2="845.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">1</tspan></text><rect x="45.0" y="372.0" width="174.0" height="107.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Primera hora</tspan></text><text x="132.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Antibiótico (cefazolina) y</tspan><tspan x="132.0" dy="16">lavado; cobertura</tspan><tspan x="132.0" dy="16">gramnegativa en lesiones</tspan><tspan x="132.0" dy="16">graves</tspan></text><circle cx="316.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="316.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">2</tspan></text><rect x="229.0" y="372.0" width="174.0" height="107.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="316.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Primeras 24 a 48 horas</tspan></text><text x="316.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Vigilar el síndrome</tspan><tspan x="316.0" dy="16">compartimental: dolor</tspan><tspan x="316.0" dy="16">desproporcionado</tspan></text><circle cx="500.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3</tspan></text><rect x="413.0" y="372.0" width="174.0" height="107.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Desbridamiento y</tspan><tspan x="500.0" dy="17">estabilización</tspan></text><text x="500.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Cierre del foco contaminado y</tspan><tspan x="500.0" dy="16">fijación</tspan></text><circle cx="684.0" cy="338.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="684.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">4</tspan></text><rect x="597.0" y="372.0" width="174.0" height="107.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="684.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Día 15: dolor, fiebre e</tspan><tspan x="684.0" dy="17">impotencia</tspan></text><text x="684.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Osteomielitis postraumática</tspan><tspan x="684.0" dy="16">por Staphylococcus aureus</tspan></text><rect x="653.0" y="468.0" width="61.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="684.0" y="483.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="684.0" dy="0">◆ DÍA 15</tspan></text><circle cx="868.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">5</tspan></text><rect x="781.0" y="372.0" width="174.0" height="107.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Confirmar y tratar</tspan></text><text x="868.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">VSG, PCR, resonancia y</tspan><tspan x="868.0" dy="16">cultivo de hueso;</tspan><tspan x="868.0" dy="16">desbridamiento y antibiótico</tspan><tspan x="868.0" dy="16">prolongado</tspan></text><rect x="40.0" y="511.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="537.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Fiebre y dolor creciente sobre una fractura tratada = osteomielitis</tspan></text><text x="60.0" y="556.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Pseudoartrosis, hemoartrosis y consolidación viciosa no dan fiebre.</tspan></text><text x="40.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE GUSTILO-ANDERSON DE LA FRACTURA EXPUESTA</tspan></text><rect x="40.0" y="629.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="648.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="130.0" y="648.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Herida</tspan></text><text x="550.0" y="648.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Antibiótico inicial</tspan></text><rect x="40.0" y="658.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="677.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">I</tspan></text><text x="130.0" y="677.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Menos de 1 cm, limpia</tspan></text><text x="550.0" y="677.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Cefazolina</tspan></text><rect x="40.0" y="687.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">II</tspan></text><text x="130.0" y="706.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">De 1 a 10 cm, sin daño extenso de partes blandas</tspan></text><text x="550.0" y="706.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Cefazolina</tspan></text><rect x="40.0" y="716.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">III</tspan></text><text x="130.0" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Más de 10 cm o daño extenso (IIIA cobertura adecuada; IIIB pérdida de</tspan><tspan x="130.0" dy="15">partes blandas; IIIC lesión arterial)</tspan></text><text x="550.0" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Cefazolina con cobertura gramnegativa</tspan></text><text x="40.0" y="776.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El riesgo de infección aumenta del tipo I al III; en el caso no se informa el grado.</tspan></text><text x="40.0" y="823.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="833.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="864.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="836.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="864.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Osteomielitis</tspan></text><text x="435.0" y="855.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Síndrome</tspan><tspan x="435.0" dy="17">compartimental</tspan></text><text x="585.0" y="864.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Pseudoartrosis</tspan></text><text x="735.0" y="864.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hemoartrosis</tspan></text><text x="885.0" y="855.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Consolidación</tspan><tspan x="885.0" dy="17">viciosa</tspan></text><rect x="40.0" y="887.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="887.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="924.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="916.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dolor y fiebre tras</tspan><tspan x="285.0" dy="16">fractura expuesta</tspan></text><text x="435.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es precoz, 24 a 48</tspan><tspan x="435.0" dy="16">horas, sin fiebre típica</tspan></text><text x="585.0" y="908.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: falta de</tspan><tspan x="585.0" dy="16">consolidación a los 6-9</tspan><tspan x="585.0" dy="16">meses</tspan></text><text x="735.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sangrado</tspan><tspan x="735.0" dy="16">intraarticular precoz</tspan></text><text x="885.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: deformidad sin</tspan><tspan x="885.0" dy="16">fiebre</tspan></text><rect x="40.0" y="833.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="977.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1005.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1027.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Antibiótico en la primera hora (cefazolina; añadir gramnegativos en lesiones graves), desbridamiento temprano y estabilización.</tspan><tspan x="58.0" dy="18">• Dolor creciente, fiebre, eritema o secreción a las 2 semanas: infección hasta demostrar lo contrario. Germen principal: Staphylococcus aureus.</tspan><tspan x="58.0" dy="18">• Se confirma con VSG, PCR, resonancia y cultivo de hueso o secreción profunda; tratamiento: desbridamiento, implante si es estable y antibiótico</tspan><tspan x="58.0" dy="18">   prolongado.</tspan><tspan x="58.0" dy="18">• Alerta: el síndrome compartimental aparece en 24-48 horas, con dolor desproporcionado y dolor al estiramiento pasivo; la pseudoartrosis no tiene fiebre.</tspan></text><text x="58.0" y="1121.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: PIDS/IDSA, osteomielitis hematógena aguda pediátrica (J Pediatric Infect Dis Soc 2021;10:801-844); Consenso internacional 2018 de infección musculoesquelética en</tspan><tspan x="58.0" dy="15">trauma ortopédico (J Bone Joint Surg Am 2020;102:e44); Nelson Tratado de Pediatría, 22.ª ed. (2024)</tspan></text></svg>