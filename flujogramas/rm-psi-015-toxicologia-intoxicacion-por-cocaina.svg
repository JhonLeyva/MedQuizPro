<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Euforia, taquicardia, hipertensión, hipertermia y midriasis con epistaxis y rinorrea crónicas: cocaína"><title>Euforia, taquicardia, hipertensión, hipertermia y midriasis con epistaxis y rinorrea crónicas: cocaína</title><rect x="0.75" y="0.75" width="998.5" height="938.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · intoxicación por cocaína</tspan></text><rect x="424.6" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="479.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="479.3" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Intoxicación por cocaína</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bloquea la recaptación de noradrenalina, dopamina y serotonina.</tspan><tspan x="58.0" dy="17">Produce un síndrome simpaticomimético.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 15 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Euforia y ansiedad; FC 120, FR 28, PA 160/110 mmHg,</tspan><tspan x="640.0" dy="16">T 38 °C, midriasis bilateral.</tspan><tspan x="640.0" dy="16">Epistaxis y rinorrea crónica.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL BLOQUEO DE LA RECAPTACIÓN A LAS COMPLICACIONES</tspan></text><rect x="40.0" y="285.0" width="210.5" height="91.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Bloqueo de la recaptación</tspan></text><text x="145.2" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Noradrenalina, dopamina y</tspan><tspan x="145.2" dy="16">serotonina quedan en la sinapsis</tspan></text><line x1="253.5" y1="330.5" x2="266.5" y2="330.5" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,325.5 265.5,335.5 273.5,330.5" fill="#0f766e"/><line x1="145.2" y1="378.0" x2="145.2" y2="392.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="394.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.2" y="408.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Es el mecanismo de la cocaína</tspan></text><rect x="276.5" y="285.0" width="210.5" height="91.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Síndrome simpaticomimético</tspan></text><text x="381.8" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Euforia, taquicardia, hipertensión,</tspan><tspan x="381.8" dy="16">hipertermia y midriasis</tspan></text><line x1="490.0" y1="330.5" x2="503.0" y2="330.5" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,325.5 502.0,335.5 510.0,330.5" fill="#0f766e"/><line x1="381.8" y1="378.0" x2="381.8" y2="392.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="394.0" width="210.5" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="381.8" y="408.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Es el cuadro del adolescente</tspan></text><rect x="336.3" y="447.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="381.8" y="462.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="381.8" dy="0">◆ ESTE CASO</tspan></text><rect x="513.0" y="285.0" width="210.5" height="91.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Daño según la vía</tspan></text><text x="618.2" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Inhalada: epistaxis, rinorrea y</tspan><tspan x="618.2" dy="16">perforación del tabique</tspan></text><line x1="726.5" y1="330.5" x2="739.5" y2="330.5" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,325.5 738.5,335.5 746.5,330.5" fill="#0f766e"/><line x1="618.2" y1="378.0" x2="618.2" y2="392.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="394.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="618.2" y="408.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Explica el antecedente nasal</tspan></text><rect x="749.5" y="285.0" width="210.5" height="91.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Complicaciones graves</tspan></text><text x="854.8" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Isquemia coronaria, arritmias,</tspan><tspan x="854.8" dy="16">disección aórtica, ACV,</tspan><tspan x="854.8" dy="16">convulsiones</tspan></text><line x1="854.8" y1="378.0" x2="854.8" y2="392.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="394.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="854.8" y="408.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Electrocardiograma y</tspan><tspan x="854.8" dy="16">troponinas</tspan></text><rect x="40.0" y="488.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="514.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Simpaticomimético con daño nasal = cocaína</tspan></text><text x="60.0" y="533.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La marihuana, el ácido lisérgico, la heroína y las benzodiazepinas no dan hipertensión con midriasis.</tspan></text><text x="40.0" y="600.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="610.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="632.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="613.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cocaína</tspan></text><text x="435.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Marihuana</tspan></text><text x="585.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ácido lisérgico</tspan></text><text x="735.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Heroína</tspan></text><text x="885.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Benzodiazepinas</tspan></text><rect x="40.0" y="647.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="647.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="684.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sustancia causante?</tspan></text><text x="285.0" y="668.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: simpaticomimético</tspan><tspan x="285.0" dy="16">con midriasis y daño</tspan><tspan x="285.0" dy="16">nasal</tspan></text><text x="435.0" y="668.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: conjuntivas rojas y</tspan><tspan x="435.0" dy="16">boca seca, sin</tspan><tspan x="435.0" dy="16">hipertensión marcada</tspan></text><text x="585.0" y="668.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: alucinaciones y</tspan><tspan x="585.0" dy="16">distorsiones</tspan><tspan x="585.0" dy="16">sensoriales</tspan></text><text x="735.0" y="668.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: miosis, bradipnea</tspan><tspan x="735.0" dy="16">y depresión del</tspan><tspan x="735.0" dy="16">sensorio</tspan></text><text x="885.0" y="676.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: producen</tspan><tspan x="885.0" dy="16">sedación, no excitación</tspan></text><rect x="40.0" y="610.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="737.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="765.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="787.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Síndrome simpaticomimético: euforia, agitación, taquicardia, hipertensión, hipertermia, midriasis y sudoración; epistaxis y rinorrea crónica indican vía</tspan><tspan x="58.0" dy="18">   inhalada.</tspan><tspan x="58.0" dy="18">• Marihuana: conjuntivas rojas, boca seca y apetito. Ácido lisérgico: alucinaciones. Heroína: miosis y bradipnea. Benzodiazepinas: sedación, no excitación.</tspan><tspan x="58.0" dy="18">• Tratamiento: benzodiazepinas para agitación, taquicardia e hipertensión, enfriamiento y líquidos; si persiste la hipertensión, nitratos o fentolamina. Evitar</tspan><tspan x="58.0" dy="18">   betabloqueadores sin acción alfa.</tspan><tspan x="58.0" dy="18">• Alerta: dolor torácico, arritmias, disección aórtica, ACV, convulsiones y rabdomiólisis; se pide electrocardiograma y troponinas.</tspan></text><text x="58.0" y="899.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Kaplan y Sadock, Sinopsis de Psiquiatría, 12.ª ed. (2021); Harrison, Principios de Medicina Interna, 21.ª ed. (2022); APA, DSM-5-TR (2022).</tspan></text></svg>