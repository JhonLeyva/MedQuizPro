<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La precarga es el volumen al final de la diástole"><title>La precarga es el volumen al final de la diástole</title><rect x="0.75" y="0.75" width="998.5" height="1008.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología cardiaca · precarga y poscarga</tspan></text><rect x="444.1" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="516.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="516.0" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Precarga</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estiramiento de la fibra antes de contraerse.</tspan><tspan x="58.0" dy="17">Se mide como volumen o presión telediastólica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué parámetro determina la precarga?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASA PRESIÓN-VOLUMEN DEL VENTRÍCULO IZQUIERDO</tspan></text><rect x="40.0" y="253.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><line x1="98.0" y1="545.0" x2="562.0" y2="545.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="549.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">0</tspan></text><line x1="98.0" y1="467.3" x2="562.0" y2="467.3" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="471.3" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">40</tspan></text><line x1="98.0" y1="389.6" x2="562.0" y2="389.6" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="393.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">80</tspan></text><line x1="98.0" y1="311.9" x2="562.0" y2="311.9" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="315.9" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">120</tspan></text><line x1="98.0" y1="545.0" x2="98.0" y2="550.0" stroke="#94a3b8" stroke-width="1.5"/><text x="98.0" y="564.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="98.0" dy="0">0</tspan></text><line x1="252.7" y1="545.0" x2="252.7" y2="550.0" stroke="#94a3b8" stroke-width="1.5"/><text x="252.7" y="564.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="252.7" dy="0">50</tspan></text><line x1="407.3" y1="545.0" x2="407.3" y2="550.0" stroke="#94a3b8" stroke-width="1.5"/><text x="407.3" y="564.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="407.3" dy="0">100</tspan></text><line x1="562.0" y1="545.0" x2="562.0" y2="550.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="564.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">150</tspan></text><line x1="98.0" y1="545.0" x2="562.0" y2="545.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="273.0" x2="98.0" y2="545.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="583.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Volumen (mL)</tspan></text><text x="56.0" y="409.0" transform="rotate(-90 56.0 409.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Presión (mmHg)</text><polyline points="252.7,529.5 469.2,525.6 484.7,389.6 484.7,311.9 252.7,350.7 252.7,529.5" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="469.2" y1="525.6" x2="469.2" y2="545.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="469.2" cy="525.6" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="382.6" y="500.6" width="173.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="469.2" y="515.6" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="469.2" dy="0">◆ Fin de la diástole = precarga</tspan></text><rect x="602.0" y="332.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="356.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Volumen telediastólico (≈ 120 mL)</tspan></text><text x="617.0" y="373.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Precarga: llenado máximo.</tspan></text><rect x="602.0" y="395.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="419.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Presión aórtica (≈ 120 mmHg)</tspan></text><text x="617.0" y="436.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Poscarga.</tspan></text><rect x="602.0" y="458.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="482.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Volumen telesistólico (≈ 50 mL)</tspan></text><text x="617.0" y="499.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Lo que queda tras la eyección.</tspan></text><rect x="40.0" y="611.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="637.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Precarga = volumen al final de la diástole</tspan></text><text x="60.0" y="656.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se estima con la presión de enclavamiento capilar pulmonar.</tspan></text><text x="40.0" y="723.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="733.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="764.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="755.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Presión al final de la</tspan><tspan x="285.0" dy="17">sístole</tspan></text><text x="435.0" y="755.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Volumen al inicio de</tspan><tspan x="435.0" dy="17">la diástole</tspan></text><text x="585.0" y="755.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Presión al inicio de</tspan><tspan x="585.0" dy="17">la diástole</tspan></text><text x="735.0" y="755.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Volumen al final de</tspan><tspan x="735.0" dy="17">la sístole</tspan></text><rect x="813.0" y="736.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="755.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Volumen al final de</tspan><tspan x="885.0" dy="17">la diástole</tspan></text><rect x="40.0" y="787.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="787.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="816.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Precarga?</tspan></text><text x="285.0" y="808.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: determina la</tspan><tspan x="285.0" dy="16">poscarga</tspan></text><text x="435.0" y="808.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es el parámetro</tspan><tspan x="435.0" dy="16">de precarga</tspan></text><text x="585.0" y="808.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: refleja la presión</tspan><tspan x="585.0" dy="16">de llenado inicial</tspan></text><text x="735.0" y="808.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: determina el</tspan><tspan x="735.0" dy="16">volumen sistólico</tspan></text><text x="885.0" y="816.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: telediastólico</tspan></text><rect x="40.0" y="733.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="861.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="889.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="911.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Poscarga: resistencia que debe vencer el ventrículo (presión aórtica o tensión de pared en sístole).</tspan><tspan x="58.0" dy="18">• Frank-Starling: más volumen telediastólico, más fuerza de contracción, hasta un límite.</tspan><tspan x="58.0" dy="18">• Baja la precarga: diuréticos y nitratos. La sube: volumen. Se estima con el enclavamiento capilar pulmonar.</tspan></text><text x="58.0" y="969.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall Tratado de Fisiología Médica 14.ª ed.; Braunwald Tratado de Cardiología 12.ª ed.</tspan></text></svg>