<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1308" viewBox="0 0 1000 1308" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fiebre, secreción cervical y tumor anexial doloroso tras un legrado: absceso tuboovárico"><title>Fiebre, secreción cervical y tumor anexial doloroso tras un legrado: absceso tuboovárico</title><rect x="0.75" y="0.75" width="998.5" height="1306.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · enfermedad inflamatoria pélvica</tspan></text><rect x="471.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="551.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="551.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad inflamatoria pélvica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección ascendente polimicrobiana del tracto genital superior: Chlamydia, gonococo,</tspan><tspan x="58.0" dy="17">anaerobios y gramnegativos.</tspan><tspan x="58.0" dy="17">El legrado facilita la ascensión desde el cérvix.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 22 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Legrado por aborto provocado hace 1 mes; dolor</tspan><tspan x="640.0" dy="16">pélvico intenso, fiebre 38,4 °C y peritonismo.</tspan><tspan x="640.0" dy="16">Secreción mucopurulenta, dolor a la lateralización del</tspan><tspan x="640.0" dy="16">cuello y tumor anexial derecho doloroso.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS DEL CASO QUE APUNTAN A ABSCESO TUBOOVÁRICO</tspan></text><rect x="40.0" y="301.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">QUÉ HACER SEGÚN LOS HALLAZGOS</tspan></text><text x="626.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="341.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,356.5 74.0,376.5 50.0,376.5" fill="#dc2626"/><text x="62.0" y="373.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Fiebre 38,4 °C, taquicardia y leucocitosis</tspan></text><text x="84.0" y="381.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Infección sistémica: hospitalizar</tspan></text><text x="626.0" y="371.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="400.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,415.5 74.0,435.5 50.0,435.5" fill="#dc2626"/><text x="62.0" y="432.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="423.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Tumor anexial derecho muy doloroso</tspan></text><text x="84.0" y="440.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Absceso tuboovárico: complicación supurada</tspan></text><text x="626.0" y="430.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="459.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,474.5 74.0,494.5 50.0,494.5" fill="#dc2626"/><text x="62.0" y="491.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="482.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Reacción peritoneal</tspan></text><text x="84.0" y="499.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Vigilar rotura (estadio IV de Monif)</tspan></text><text x="626.0" y="489.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="518.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,533.5 74.0,553.5 50.0,553.5" fill="#dc2626"/><text x="62.0" y="550.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="541.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Secreción cervical mucopurulenta y dolor a la lateralización</tspan></text><text x="84.0" y="558.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Criterio de enfermedad inflamatoria pélvica</tspan></text><text x="626.0" y="548.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="577.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,592.5 74.0,612.5 50.0,612.5" fill="#cbd5e1"/><text x="62.0" y="609.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="600.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Legrado reciente como puerta de entrada</tspan></text><text x="84.0" y="617.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Antecedente que explica la ascensión</tspan></text><text x="626.0" y="607.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="660.0" y="301.0" width="300.0" height="329.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="325.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">CON ABSCESO TUBOOVÁRICO</tspan></text><text x="676.0" y="400.5" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Hospitalizar con antibióticos</tspan><tspan x="676.0" dy="17">parenterales</tspan></text><text x="676.0" y="434.5" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Cefoxitina más doxiciclina, o clindamicina con</tspan><tspan x="676.0" dy="16">gentamicina; drenaje por imagen o cirugía si</tspan><tspan x="676.0" dy="16">no mejora en 48-72 horas o si hay rotura.</tspan><tspan x="676.0" dy="16">Pedir siempre hCG ante una masa anexial</tspan><tspan x="676.0" dy="16">febril. Estadio III de Monif: si se rompe (estadio</tspan><tspan x="676.0" dy="16">IV) hay shock séptico y se opera de urgencia.</tspan><tspan x="676.0" dy="16">Seguimiento: reevaluar a las 48-72 horas con</tspan><tspan x="676.0" dy="16">fiebre, dolor y leucocitos, y tratar a la pareja</tspan><tspan x="676.0" dy="16">sexual; buscar Chlamydia y gonococo.</tspan></text><rect x="40.0" y="648.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="674.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Legrado + fiebre + tumor anexial doloroso = absceso tuboovárico</tspan></text><text x="60.0" y="693.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Apendicitis, torsión, ectópico roto y perforación uterina no explican la secreción cervical con fiebre y masa anexial.</tspan></text><text x="40.0" y="754.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESTADIOS DE LA ENFERMEDAD INFLAMATORIA PÉLVICA (MONIF)</tspan></text><rect x="40.0" y="766.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Estadio</tspan></text><text x="175.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="779"><tspan x="175.0" dy="0">Cuadro</tspan></text><rect x="40.0" y="795.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="814.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">I</tspan></text><text x="175.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="779"><tspan x="175.0" dy="0">Salpingitis aguda sin peritonitis</tspan></text><rect x="40.0" y="824.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="843.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">II</tspan></text><text x="175.0" y="843.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="779"><tspan x="175.0" dy="0">Salpingitis aguda con peritonitis</tspan></text><rect x="40.0" y="853.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">III</tspan></text><text x="175.0" y="872.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="779"><tspan x="175.0" dy="0">Oclusión tubaria o absceso tuboovárico: el caso</tspan></text><rect x="65.6" y="856.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="871.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="882.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="901.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">IV</tspan></text><text x="175.0" y="901.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="779"><tspan x="175.0" dy="0">Absceso tuboovárico roto: emergencia con shock séptico</tspan></text><text x="40.0" y="951.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="961.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="992.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Apendicitis aguda</tspan></text><text x="435.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Torsión anexial</tspan></text><text x="585.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Embarazo ectópico</tspan><tspan x="585.0" dy="17">roto</tspan></text><text x="735.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Perforación uterina</tspan></text><rect x="813.0" y="964.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Absceso</tspan><tspan x="885.0" dy="17">tuboovárico</tspan></text><rect x="40.0" y="1015.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="1015.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1044.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="1036.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no explica la</tspan><tspan x="285.0" dy="16">secreción cervical ni el</tspan><tspan x="285.0" dy="16">dolor al mover el cuello</tspan></text><text x="435.0" y="1044.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: de inicio súbito, sin</tspan><tspan x="435.0" dy="16">fiebre ni leucocitosis</tspan></text><text x="585.0" y="1036.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: hay amenorrea,</tspan><tspan x="585.0" dy="16">hCG positiva y</tspan><tspan x="585.0" dy="16">hemoperitoneo</tspan></text><text x="735.0" y="1036.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: habría aparecido</tspan><tspan x="735.0" dy="16">de inmediato tras el</tspan><tspan x="735.0" dy="16">legrado</tspan></text><text x="885.0" y="1036.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: fiebre, tumor</tspan><tspan x="885.0" dy="16">anexial doloroso y</tspan><tspan x="885.0" dy="16">peritonismo</tspan></text><rect x="40.0" y="961.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1105.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1133.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1155.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterio mínimo (CDC 2021): dolor pélvico con dolor a la movilización cervical, uterino o anexial; la fiebre, la secreción mucopurulenta, la leucocitosis y la</tspan><tspan x="58.0" dy="18">   VSG elevada lo refuerzan.</tspan><tspan x="58.0" dy="18">• Tumor anexial doloroso con fiebre y signos peritoneales = absceso tuboovárico (Monif III); su rotura (IV) es emergencia con shock séptico.</tspan><tspan x="58.0" dy="18">• Tratamiento hospitalario con antibióticos parenterales (cefoxitina más doxiciclina, o clindamicina con gentamicina); drenaje o cirugía si no mejora en</tspan><tspan x="58.0" dy="18">   48-72 horas o si se rompe.</tspan><tspan x="58.0" dy="18">• Alerta: ante una masa anexial febril se descarta el embarazo con hCG; la torsión no cursa con fiebre ni leucocitosis.</tspan></text><text x="58.0" y="1267.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Sexually Transmitted Infections Treatment Guidelines 2021. MMWR Recomm Rep 2021;70(4); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>