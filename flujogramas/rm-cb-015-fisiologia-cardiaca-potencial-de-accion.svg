<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1055" viewBox="0 0 1000 1055" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el período refractario absoluto el miocito no puede responder a ningún estímulo"><title>En el período refractario absoluto el miocito no puede responder a ningún estímulo</title><rect x="0.75" y="0.75" width="998.5" height="1053.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología cardiaca · potencial de acción</tspan></text><rect x="437.9" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="509.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="509.8" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Período refractario absoluto</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Canales de sodio inactivados: no se genera otro potencial de acción, sea cual sea el</tspan><tspan x="58.0" dy="17">estímulo.</tspan><tspan x="58.0" dy="17">La meseta del miocardio lo prolonga y evita el tétanos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué es el período refractario absoluto?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POTENCIAL DE ACCIÓN DEL MIOCITO Y REFRACTARIEDAD</tspan></text><rect x="40.0" y="265.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="98.0" y="285.0" width="309.3" height="272.0" rx="0" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="252.7" y="301.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="303"><tspan x="252.7" dy="0"></tspan></text><rect x="407.3" y="285.0" width="92.8" height="272.0" rx="0" fill="#fef3c7" stroke="none" stroke-width="0"/><text x="453.7" y="301.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="87"><tspan x="453.7" dy="0"></tspan></text><line x1="98.0" y1="557.0" x2="562.0" y2="557.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="561.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">-90</tspan></text><line x1="98.0" y1="489.0" x2="562.0" y2="489.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="493.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">-60</tspan></text><line x1="98.0" y1="421.0" x2="562.0" y2="421.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="425.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">-30</tspan></text><line x1="98.0" y1="353.0" x2="562.0" y2="353.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="357.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">0</tspan></text><line x1="98.0" y1="285.0" x2="562.0" y2="285.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="289.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">+30</tspan></text><line x1="98.0" y1="557.0" x2="98.0" y2="562.0" stroke="#94a3b8" stroke-width="1.5"/><text x="98.0" y="576.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="98.0" dy="0">0</tspan></text><line x1="252.7" y1="557.0" x2="252.7" y2="562.0" stroke="#94a3b8" stroke-width="1.5"/><text x="252.7" y="576.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="252.7" dy="0">100</tspan></text><line x1="407.3" y1="557.0" x2="407.3" y2="562.0" stroke="#94a3b8" stroke-width="1.5"/><text x="407.3" y="576.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="407.3" dy="0">200</tspan></text><line x1="562.0" y1="557.0" x2="562.0" y2="562.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="576.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">300</tspan></text><line x1="98.0" y1="557.0" x2="562.0" y2="557.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="285.0" x2="98.0" y2="557.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="595.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Tiempo (ms)</tspan></text><text x="56.0" y="421.0" transform="rotate(-90 56.0 421.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Voltaje (mV)</text><polyline points="98.0,557.0 105.7,285.0 113.5,307.7 175.3,319.0 376.4,330.3 438.3,489.0 500.1,557.0 562.0,557.0" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="252.7" y1="319.0" x2="252.7" y2="557.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="252.7" cy="319.0" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="186.1" y="294.0" width="133.0" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="252.7" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="252.7" dy="0">◆ Sin reacción posible</tspan></text><rect x="602.0" y="336.5" width="358.0" height="71.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="360.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Refractario absoluto</tspan></text><text x="617.0" y="377.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Fases 0-2 y parte de la 3: ningún estímulo genera otro</tspan><tspan x="617.0" dy="16">potencial.</tspan></text><rect x="602.0" y="415.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="439.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Refractario relativo</tspan></text><text x="617.0" y="456.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Final de la fase 3: solo un estímulo mayor.</tspan></text><rect x="602.0" y="478.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="502.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Fase vulnerable</tspan></text><text x="617.0" y="519.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Pico de la onda T: riesgo de R sobre T.</tspan></text><rect x="40.0" y="623.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="649.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Absoluto = la célula no puede responder a un estímulo</tspan></text><text x="60.0" y="668.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Evita el tétanos del miocardio y protege el llenado ventricular.</tspan></text><text x="40.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="745.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="784.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="748.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="767.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">La célula no</tspan><tspan x="285.0" dy="17">responde a ningún</tspan><tspan x="285.0" dy="17">estímulo</tspan></text><text x="435.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Responde a un</tspan><tspan x="435.0" dy="17">estímulo menor</tspan></text><text x="585.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Responde a un</tspan><tspan x="585.0" dy="17">estímulo mayor</tspan></text><text x="735.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Responde a un</tspan><tspan x="735.0" dy="17">estímulo igual</tspan></text><text x="885.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Se debe al flujo de</tspan><tspan x="885.0" dy="17">calcio</tspan></text><rect x="40.0" y="816.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="816.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="853.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Correcta?</tspan></text><text x="285.0" y="845.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ningún estímulo</tspan><tspan x="285.0" dy="16">genera otro potencial</tspan></text><text x="435.0" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: eso describe el</tspan><tspan x="435.0" dy="16">período relativo</tspan></text><text x="585.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: eso es el período</tspan><tspan x="585.0" dy="16">relativo con estímulo</tspan><tspan x="585.0" dy="16">supraumbral</tspan></text><text x="735.0" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: en el absoluto no</tspan><tspan x="735.0" dy="16">hay reacción posible</tspan></text><text x="885.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el calcio causa la</tspan><tspan x="885.0" dy="16">meseta, no la</tspan><tspan x="885.0" dy="16">refractariedad</tspan></text><rect x="40.0" y="745.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="906.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="934.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="956.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Absoluto: fases 0, 1, 2 y parte de la 3. Relativo: final de la fase 3, con un estímulo supraumbral.</tspan><tspan x="58.0" dy="18">• En el ECG: QRS, segmento ST y primera parte de la onda T; la fase vulnerable es el pico de la T (R sobre T).</tspan><tspan x="58.0" dy="18">• La refractariedad larga permite que el corazón se relaje y se llene entre latidos.</tspan></text><text x="58.0" y="1014.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall Tratado de Fisiología Médica 14.ª ed.; Braunwald Tratado de Cardiología 12.ª ed.</tspan></text></svg>