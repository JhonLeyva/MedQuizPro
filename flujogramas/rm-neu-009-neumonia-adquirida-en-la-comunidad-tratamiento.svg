<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1232" viewBox="0 0 1000 1232" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Neumonía grave con hipoxemia: oxígeno y ceftriaxona más azitromicina"><title>Neumonía grave con hipoxemia: oxígeno y ceftriaxona más azitromicina</title><rect x="0.75" y="0.75" width="998.5" height="1230.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumonía adquirida en la comunidad · tratamiento</tspan></text><rect x="498.7" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="556.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="556.2" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neumonía adquirida en la comunidad grave</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infiltrado lobar, hipoxemia, polipnea y alteración de la conciencia.</tspan><tspan x="58.0" dy="17">Justifica hospitalizar y valorar cuidados intensivos.</tspan><tspan x="58.0" dy="17">El tratamiento empieza por el oxígeno y sigue con antibiótico empírico por vía intravenosa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 54 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">3 días de tos con secreción verdosa y alza térmica;</tspan><tspan x="640.0" dy="16">polipneica, SatO₂ 85 %, Glasgow 13.</tspan><tspan x="640.0" dy="16">Rx: radiopacidad en lóbulo inferior izquierdo;</tspan><tspan x="640.0" dy="16">leucocitosis.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ANTIBIÓTICO EMPÍRICO SEGÚN LA GRAVEDAD</tspan></text><rect x="40.0" y="301.0" width="920.0" height="70.0" rx="12" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="54.0" y="320.0" width="74.0" height="32.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="91.0" y="341.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="64"><tspan x="91.0" dy="0">PRIMERO</tspan></text><text x="144.0" y="326.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">Oxigenoterapia hasta SatO₂ de 92-96 %</tspan></text><text x="144.0" y="345.0" font-size="12" font-weight="600" font-style="normal" fill="#fff7ed" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">SatO₂ 85 % es hipoxemia grave: se corrige antes que cualquier otra cosa.</tspan></text><line x1="500.0" y1="373.0" x2="500.0" y2="388.0" stroke="#ea580c" stroke-width="2"/><polygon points="495.0,387.0 505.0,387.0 500.0,395.0" fill="#ea580c"/><rect x="40.0" y="401.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="423.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">GRAVEDAD</tspan></text><text x="412.5" y="423.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">Sin factores de riesgo para Pseudomonas ni MRSA</tspan></text><text x="777.5" y="423.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">Con esos factores de riesgo</tspan></text><rect x="40.0" y="441.0" width="184.0" height="72.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="474.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Hospitalizada no grave</tspan></text><text x="54.0" y="491.5" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Sala general</tspan></text><rect x="233.0" y="441.0" width="359.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="473.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Ceftriaxona + azitromicina</tspan></text><text x="245.0" y="489.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">O fluoroquinolona respiratoria sola</tspan></text><rect x="598.0" y="441.0" width="359.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="466.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Ampliar la cobertura</tspan></text><text x="610.0" y="482.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Según el factor de riesgo</tspan><tspan x="610.0" dy="15">Cultivos antes del antibiótico</tspan></text><rect x="40.0" y="519.0" width="184.0" height="72.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="552.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Grave: este caso</tspan></text><text x="54.0" y="569.5" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Hipoxemia, confusión y polipnea</tspan></text><rect x="233.0" y="519.0" width="359.0" height="72.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="245.0" y="544.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Ceftriaxona + azitromicina</tspan></text><text x="245.0" y="560.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">O β-lactámico + fluoroquinolona</tspan><tspan x="245.0" dy="15">Valorar UCI</tspan></text><rect x="491.2" y="508.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="536.6" y="523.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="536.6" dy="0">◆ ESTE CASO</tspan></text><rect x="598.0" y="519.0" width="359.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="544.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Ampliar la cobertura</tspan></text><text x="610.0" y="560.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Añadir MRSA o Pseudomonas</tspan><tspan x="610.0" dy="15">Hemocultivos y esputo</tspan></text><text x="44.0" y="613.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Cubre neumococo, H. influenzae y atípicos (Mycoplasma, Chlamydophila, Legionella).</tspan></text><text x="40.0" y="655.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PUNTAJE CURB-65: 1 PUNTO POR CADA CRITERIO Y DECISIÓN DEL SITIO DE ATENCIÓN</tspan></text><rect x="40.0" y="667.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="686.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Puntaje</tspan></text><text x="160.0" y="686.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Riesgo</tspan></text><text x="565.0" y="686.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Conducta</tspan></text><rect x="40.0" y="696.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="715.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">0-1</tspan></text><text x="160.0" y="715.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Bajo</tspan></text><text x="565.0" y="715.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Manejo ambulatorio</tspan></text><rect x="40.0" y="725.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="744.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">2</tspan></text><text x="160.0" y="744.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Intermedio</tspan></text><text x="565.0" y="744.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Hospitalizar (sala general)</tspan></text><rect x="40.0" y="754.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="773.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">3-5</tspan></text><text x="160.0" y="773.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Alto: neumonía grave</tspan></text><text x="565.0" y="773.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Hospitalizar y valorar cuidados intensivos</tspan></text><text x="40.0" y="799.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Criterios: Confusión, Urea &gt; 7 mmol/L (BUN &gt; 19 mg/dL), frecuencia Respiratoria ≥ 30/min, presión sistólica &lt; 90 o diastólica ≤ 60 mmHg, edad ≥ 65. La hipoxemia grave de</tspan><tspan x="40.0" dy="15">este caso exige manejo como grave aunque el puntaje sea bajo.</tspan></text><text x="40.0" y="861.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="871.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="910.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="874.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Oxígeno +</tspan><tspan x="285.0" dy="17">ceftriaxona +</tspan><tspan x="285.0" dy="17">azitromicina</tspan></text><text x="435.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Oxígeno +</tspan><tspan x="435.0" dy="17">ceftriaxona +</tspan><tspan x="435.0" dy="17">amikacina</tspan></text><text x="585.0" y="902.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Intubación +</tspan><tspan x="585.0" dy="17">ciprofloxacino</tspan></text><text x="735.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ceftriaxona +</tspan><tspan x="735.0" dy="17">claritromicina oral</tspan><tspan x="735.0" dy="17">10 días</tspan></text><text x="885.0" y="902.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ciprofloxacino +</tspan><tspan x="885.0" dy="17">nebulizaciones</tspan></text><rect x="40.0" y="942.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="942.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="979.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="963.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: oxígeno y</tspan><tspan x="285.0" dy="16">β-lactámico +</tspan><tspan x="285.0" dy="16">macrólido</tspan></text><text x="435.0" y="971.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la amikacina no</tspan><tspan x="435.0" dy="16">cubre neumococo</tspan></text><text x="585.0" y="963.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no hay falla</tspan><tspan x="585.0" dy="16">ventilatoria y el</tspan><tspan x="585.0" dy="16">ciprofloxacino es pobre</tspan></text><text x="735.0" y="963.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la vía oral es</tspan><tspan x="735.0" dy="16">insuficiente en un</tspan><tspan x="735.0" dy="16">cuadro grave</tspan></text><text x="885.0" y="963.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el ciprofloxacino</tspan><tspan x="885.0" dy="16">tiene poca actividad</tspan><tspan x="885.0" dy="16">contra neumococo</tspan></text><rect x="40.0" y="871.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1032.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1060.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1082.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primero oxigenoterapia hasta lograr SatO₂ de 92-96 %; con hipoxemia, confusión y polipnea se trata como grave.</tspan><tspan x="58.0" dy="18">• Hospitalizado sin factores de riesgo para Pseudomonas ni MRSA: β-lactámico (ceftriaxona 1-2 g/día) + macrólido (azitromicina), o fluoroquinolona</tspan><tspan x="58.0" dy="18">   respiratoria sola.</tspan><tspan x="58.0" dy="18">• Cubre neumococo, H. influenzae y atípicos; la amikacina no cubre neumococo y el ciprofloxacino tiene actividad pobre contra él.</tspan><tspan x="58.0" dy="18">• Calcular CURB-65 o PSI para decidir el sitio de atención; la intubación solo si hay falla ventilatoria.</tspan></text><text x="58.0" y="1176.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Metlay JP et al., ATS/IDSA, neumonía adquirida en la comunidad (Am J Respir Crit Care Med 2019;200:e45-e67); Mandell, Douglas y Bennett Enfermedades Infecciosas</tspan><tspan x="58.0" dy="15">9.ª ed. (2020)</tspan></text></svg>