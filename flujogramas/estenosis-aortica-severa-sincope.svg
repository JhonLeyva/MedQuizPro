<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="614" viewBox="0 0 1000 614" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Soplos sistólicos: estenosis aórtica"><title>Soplos sistólicos: estenosis aórtica</title><rect x="0.75" y="0.75" width="998.5" height="612.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="649"><tspan x="184.0" dy="0">CARDIOLOGÍA ENAM: SOPLOS SISTÓLICOS: ESTENOSIS AÓRTICA</tspan></text><rect x="853.3" y="32.0" width="110.7" height="24" rx="12" fill="#134e4a"/><text x="908.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="95"><tspan x="908.6" dy="0">CARDIOLOGÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="84.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Varón de 76 años con síncope de esfuerzo y disnea</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Pulso parvus et tardus · soplo eyectivo aórtico irradiado a carótidas · 2.º ruido</tspan><tspan x="500.0" dy="17">apagado</tspan></text><line x1="500.0" y1="174.0" x2="500.0" y2="194.0" stroke="#0f766e" stroke-width="2"/><line x1="186.0" y1="194.0" x2="814.0" y2="194.0" stroke="#0f766e" stroke-width="2"/><line x1="186.0" y1="194.0" x2="186.0" y2="213.0" stroke="#0f766e" stroke-width="2"/><polygon points="181.0,212.0 191.0,212.0 186.0,220.0" fill="#0f766e"/><line x1="500.0" y1="194.0" x2="500.0" y2="213.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,212.0 505.0,212.0 500.0,220.0" fill="#0f766e"/><line x1="814.0" y1="194.0" x2="814.0" y2="213.0" stroke="#0f766e" stroke-width="2"/><polygon points="809.0,212.0 819.0,212.0 814.0,220.0" fill="#0f766e"/><rect x="40.0" y="220.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><path d="M40.0,230.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#0f766e"/><text x="186.0" y="244.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="264"><tspan x="186.0" dy="0">Estenosis aórtica severa</tspan></text><text x="186.0" y="276.0" font-size="12" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="186.0" dy="0">Pulso parvus et tardus</tspan><tspan x="186.0" dy="17">Soplo eyectivo aórtico</tspan><tspan x="186.0" dy="17">irradiado a carótidas</tspan><tspan x="186.0" dy="17">2.º ruido disminuido</tspan></text><rect x="239.8" y="210.0" width="84.2" height="20" rx="10" fill="#f59e0b"/><text x="281.9" y="224.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="281.9" dy="0">✓ RESPUESTA</tspan></text><rect x="354.0" y="220.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M354.0,230.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="500.0" y="244.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Miocardiopatía hipertrófica</tspan></text><text x="500.0" y="276.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Pulso bífido</tspan><tspan x="500.0" dy="17">Soplo que AUMENTA</tspan><tspan x="500.0" dy="17">con Valsalva</tspan><tspan x="500.0" dy="17">Pacientes jóvenes</tspan></text><rect x="668.0" y="220.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M668.0,230.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="814.0" y="244.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Insuficiencia mitral</tspan></text><text x="814.0" y="276.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Soplo holosistólico</tspan><tspan x="814.0" dy="17">en ápex, irradiado</tspan><tspan x="814.0" dy="17">a la axila</tspan></text><line x1="186.0" y1="351.0" x2="186.0" y2="372.0" stroke="#0f766e" stroke-width="2"/><polygon points="181.0,371.0 191.0,371.0 186.0,379.0" fill="#0f766e"/><rect x="100.0" y="379.0" width="800" height="82.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="405.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">ESTENOSIS AÓRTICA SINTOMÁTICA</tspan></text><text x="500.0" y="428.0" font-size="12.5" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">Tríada: angina, síncope de esfuerzo e insuficiencia cardiaca</tspan><tspan x="500.0" dy="17.5">Reemplazo valvular: cirugía o TAVI según riesgo y edad</tspan></text><rect x="40" y="487.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="515.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="537.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Una vez sintomática, la supervivencia de la estenosis aórtica cae en pocos años sin tratamiento.</tspan><tspan x="58.0" dy="18">• El ecocardiograma confirma la severidad: área valvular &lt; 1 cm² o gradiente medio ≥ 40 mmHg.</tspan></text><text x="58.0" y="577.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC/EACTS 2025 Valvular Heart Disease Guidelines · Braunwald Tratado de Cardiología</tspan></text></svg>
