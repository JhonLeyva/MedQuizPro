xt-anchor="start" data-max="524"><tspan x="58.0" dy="0">La gestante Rh D negativa se expone a eritrocitos fetales Rh D positivos.</tspan><tspan x="58.0" dy="17">Los anticuerpos IgG cruzan la placenta y causan anemia hemolítica fetal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de seguimiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante Rh negativo: ¿en qué semana se repite el</tspan><tspan x="640.0" dy="16">Coombs indirecto?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SE REPITE EL COOMBS INDIRECTO SEGÚN CADA PROTOCOLO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="134"><tspan x="52.0" dy="0">MEDIDA</tspan></text><text x="242.8" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">1.ª consulta</tspan></text><text x="348.4" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="348.4" dy="0">10 sem</tspan></text><text x="454.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="454.0" dy="0">24 sem</tspan></text><text x="559.6" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="559.6" dy="0">28 sem</tspan></text><text x="665.2" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">34-36 sem</tspan></text><text x="734.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="220"><tspan x="734.0" dy="0">REGLA</tspan></text><rect x="403.2" y="305.0" width="101.6" height="176.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><rect x="40.0" y="309.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="331.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Coombs indirecto:</tspan><tspan x="50.0" dy="16">protocolo del libro</tspan></text><line x1="198.0" y1="335.0" x2="710.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="242.8" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="242.8" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="242.8" dy="0">✓</tspan></text><text x="242.8" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">Sí</tspan></text><circle cx="348.4" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="348.4" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="348.4" dy="0">✓</tspan></text><text x="348.4" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="348.4" dy="0">Sí</tspan></text><circle cx="454.0" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="454.0" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="454.0" dy="0">✓</tspan></text><text x="454.0" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="454.0" dy="0">Sí</tspan></text><circle cx="665.2" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="665.2" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="665.2" dy="0">✓</tspan></text><text x="665.2" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">Sí</tspan></text><rect x="730.0" y="309.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="339.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Cada trimestre si es negativo.</tspan></text><rect x="40.0" y="367.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Coombs indirecto:</tspan><tspan x="50.0" dy="16">ACOG 2017</tspan></text><line x1="198.0" y1="393.0" x2="710.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="242.8" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="242.8" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="242.8" dy="0">✓</tspan></text><text x="242.8" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">Sí</tspan></text><circle cx="559.6" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="559.6" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="559.6" dy="0">✓</tspan></text><text x="559.6" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="559.6" dy="0">Sí</tspan></text><rect x="730.0" y="367.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="397.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Antes de la anti-D.</tspan></text><rect x="40.0" y="425.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="447.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Inmunoglobulina</tspan><tspan x="50.0" dy="16">anti-D 300 µg</tspan></text><line x1="198.0" y1="451.0" x2="710.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="559.6" cy="446.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="559.6" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="559.6" dy="0">✓</tspan></text><text x="559.6" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="559.6" dy="0">Sí</tspan></text><rect x="730.0" y="425.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="455.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">No medir Coombs el mes siguiente.</tspan></text><rect x="405.3" y="294.0" width="97.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="454.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="454.0" dy="0">◆ 24 SEMANAS</tspan></text><text x="44.0" y="497.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ se indica · sin marca: no se indica en ese momento</tspan></text><rect x="40.0" y="521.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="547.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Coombs indirecto a las 24 semanas</tspan></text><text x="60.0" y="566.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La clave sigue el protocolo del libro; ACOG lo repite alrededor de las 28 semanas, antes de la anti-D.</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SE DA LA INMUNOGLOBULINA ANTI-D EN LA GESTANTE RH NEGATIVO</tspan></text><rect x="40.0" y="639.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Situación</tspan></text><text x="320.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="634"><tspan x="320.0" dy="0">Conducta</tspan></text><rect x="40.0" y="668.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="687.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Alrededor de las 28 semanas</tspan></text><text x="320.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="634"><tspan x="320.0" dy="0">300 microgramos de inmunoglobulina anti-D (tras tomar el Coombs)</tspan></text><rect x="40.0" y="697.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Posparto con recién nacido Rh positivo</tspan></text><text x="320.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="634"><tspan x="320.0" dy="0">Repetir la anti-D</tspan></text><rect x="40.0" y="726.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Aborto, ectópico, sangrado, amniocentesis</tspan><tspan x="50.0" dy="15">o trauma</tspan></text><text x="320.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="634"><tspan x="320.0" dy="0">Anti-D también indicada</tspan></text><rect x="40.0" y="770.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Coombs positivo</tspan></text><text x="320.0" y="789.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="634"><tspan x="320.0" dy="0">Título y Doppler de la arteria cerebral media fetal</tspan></text><text x="40.0" y="839.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="849.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="871.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="852.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="871.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">24</tspan></text><text x="435.0" y="871.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">20</tspan></text><text x="585.0" y="871.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">18</tspan></text><text x="735.0" y="871.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">33</tspan></text><text x="885.0" y="871.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">29</tspan></text><rect x="40.0" y="886.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="886.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="915.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿En qué semana se</tspan><tspan x="54.0" dy="16">repite el Coombs?</tspan></text><text x="285.0" y="907.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: protocolo del libro</tspan><tspan x="285.0" dy="16">(10, 24 y 34-36</tspan><tspan x="285.0" dy="16">semanas)</tspan></text><text x="435.0" y="915.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no coincide con el</tspan><tspan x="435.0" dy="16">protocolo del libro</tspan></text><text x="585.0" y="915.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no coincide con el</tspan><tspan x="585.0" dy="16">protocolo del libro</tspan></text><text x="735.0" y="915.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no coincide con el</tspan><tspan x="735.0" dy="16">protocolo del libro</tspan></text><text x="885.0" y="915.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ACOG usa 28</tspan><tspan x="885.0" dy="16">semanas, no 29</tspan></text><rect x="40.0" y="849.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="976.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1004.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1026.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primera visita: grupo, Rh y Coombs indirecto, que detecta anticuerpos irregulares en suero materno.</tspan><tspan x="58.0" dy="18">• Protocolo del libro (Coombs negativo): repetir en cada trimestre, a las 10, 24 y 34-36 semanas; la clave de la pregunta es 24 semanas.</tspan><tspan x="58.0" dy="18">• ACOG 2017 lo repite alrededor de las 28 semanas, justo antes de 300 µg de inmunoglobulina anti-D; no medirlo en el mes posterior a la anti-D</tspan><tspan x="58.0" dy="18">   (anticuerpo pasivo).</tspan><tspan x="58.0" dy="18">• Alerta: Coombs positivo exige título y vigilancia con Doppler de la arteria cerebral media fetal para detectar anemia.</tspan></text><text x="58.0" y="1120.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletin N.º 181, Prevention of Rh D alloimmunization, Obstet Gynecol 2017;130:e57-e70; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>