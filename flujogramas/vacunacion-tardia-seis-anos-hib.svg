text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿NO es necesaria?</tspan></text><text x="285.0" y="804.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: después de 5 años</tspan><tspan x="285.0" dy="16">no se indica</tspan></text><text x="435.0" y="812.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sí la necesita</tspan></text><text x="585.0" y="812.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sí la necesita</tspan></text><text x="735.0" y="812.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sí la necesita</tspan></text><text x="885.0" y="812.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sí la necesita</tspan></text><rect x="40.0" y="729.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="857.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="885.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="907.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sí necesita: difteria-tétanos-tos convulsiva (DPT o dT según edad), polio, hepatitis B, SPR (sarampión), varicela.</tspan><tspan x="58.0" dy="18">• Hib y neumococo conjugado: solo en mayores de 5 años con riesgo (asplenia, VIH, inmunodeficiencia).</tspan><tspan x="58.0" dy="18">• No reiniciar esquemas: se continúa donde quedó.</tspan></text><text x="58.0" y="965.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, esquema nacional de vacunación (NTS 196, 2022); CDC, esquema de recuperación (2025).</tspan></text></svg>