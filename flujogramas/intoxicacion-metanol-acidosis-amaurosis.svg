y="0">Acidosis metabólica con anión gap elevado y respiración de</tspan><tspan x="108" dy="22">Kussmaul</tspan></text><line x1="410.0" y1="352" x2="410.0" y2="372" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,370 417.0,370 410.0,380" fill="#94a3b8"/><rect x="90" y="382" width="640" height="76" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="420.0" r="12" fill="#d97706"/><text x="120" y="425.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="410" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="434" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Alteración visual? Visión borrosa o amaurosis</tspan></text><line x1="410.0" y1="460" x2="410.0" y2="480" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,478 417.0,478 410.0,488" fill="#94a3b8"/><rect x="90" y="490" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="518" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="542" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sospechar metanol: su metabolito, el ácido fórmico, daña el</tspan><tspan x="108" dy="22">nervio óptico</tspan></text><line x1="410.0" y1="590" x2="410.0" y2="610" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,608 417.0,608 410.0,618" fill="#94a3b8"/><rect x="90" y="620" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="648" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="672" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Fomepizol o etanol (bloquean la alcohol deshidrogenasa) +</tspan><tspan x="108" dy="22">bicarbonato</tspan></text><line x1="410.0" y1="720" x2="410.0" y2="740" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,738 417.0,738 410.0,748" fill="#94a3b8"/><rect x="90" y="750" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="778" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="802" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Hemodiálisis si la acidosis es grave o hay daño visual;</tspan><tspan x="108" dy="22">ácido fólico</tspan></text><rect x="40" y="878" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="878" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="904" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="928" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Etilenglicol: acidosis con insuficiencia renal y cristales de oxalato.</tspan><tspan x="62" dy="21">Metanol: acidosis con ceguera.</tspan></text><text x="410.0" y="1004" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
