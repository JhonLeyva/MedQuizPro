<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Con CD4 mayor de 300 la infección oportunista que aún aparece es la tuberculosis"><title>Con CD4 mayor de 300 la infección oportunista que aún aparece es la tuberculosis</title><rect x="0.75" y="0.75" width="998.5" height="908.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">VIH · infecciones oportunistas según CD4</tspan></text><rect x="446.8" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="507.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="507.7" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">CD4 y oportunistas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cada germen aparece cuando el CD4 baja de su umbral.</tspan><tspan x="58.0" dy="17">La tuberculosis es la excepción: ocurre con cualquier recuento.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué oportunista en SIDA cursa con CD4 mayor de</tspan><tspan x="640.0" dy="16">300/µL al diagnóstico?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">UMBRAL DE CD4 EN QUE APARECE CADA INFECCIÓN OPORTUNISTA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Recuento de CD4 (células/µL)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cuanto menor es el CD4, más oportunistas posibles; la tuberculosis no tiene umbral.</tspan></text><rect x="70.0" y="378.0" width="107.5" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="123.8" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="98"><tspan x="123.8" dy="0">CMV, MAC</tspan></text><rect x="177.5" y="378.0" width="107.5" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="231.2" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="98"><tspan x="231.2" dy="0">Toxo, cripto</tspan></text><rect x="285.0" y="378.0" width="215.0" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="392.5" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="205"><tspan x="392.5" dy="0">Pneumocystis</tspan></text><rect x="500.0" y="378.0" width="430.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="715.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="420"><tspan x="715.0" dy="0">Tuberculosis (y cualquier valor)</tspan></text><line x1="177.5" y1="418.0" x2="177.5" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="177.5" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="177.5" dy="0">50</tspan></text><line x1="285.0" y1="418.0" x2="285.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="285.0" dy="0">100</tspan></text><line x1="500.0" y1="418.0" x2="500.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">200</tspan></text><line x1="715.0" y1="418.0" x2="715.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">300</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">400</tspan></text><polygon points="813.5,364.0 831.5,364.0 822.5,376.0" fill="#ea580c"/><rect x="732.0" y="338.0" width="181.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="822.5" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="169"><tspan x="822.5" dy="0">◆ TUBERCULOSIS: CD4 &gt; 300</tspan></text><text x="40.0" y="486.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACER CON LA TUBERCULOSIS EN EL VIH</tspan></text><rect x="40.0" y="496.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="497.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Tamizar</tspan></text><text x="58.0" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">W4SS en cada consulta</tspan></text><rect x="351.3" y="496.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="497.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Tratar primero la TB</tspan></text><text x="369.3" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Isoniacida, rifampicina, pirazinamida, etambutol</tspan></text><rect x="662.7" y="496.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="497.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Iniciar el TARV</tspan></text><text x="680.7" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">≤ 2 semanas si CD4 &lt; 50; ≤ 8 semanas si mayor</tspan></text><text x="40.0" y="605.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="615.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="646.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="618.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="646.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tuberculosis</tspan></text><text x="435.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Neumonía por</tspan><tspan x="435.0" dy="17">Pneumocystis</tspan></text><text x="585.0" y="646.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Toxoplasmosis</tspan></text><text x="735.0" y="646.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Criptococosis</tspan></text><text x="885.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Retinitis por</tspan><tspan x="885.0" dy="17">citomegalovirus</tspan></text><rect x="40.0" y="669.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="669.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="698.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Con CD4 &gt; 300?</tspan></text><text x="285.0" y="690.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: puede aparecer con</tspan><tspan x="285.0" dy="16">cualquier CD4</tspan></text><text x="435.0" y="690.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: aparece con CD4</tspan><tspan x="435.0" dy="16">&lt; 200</tspan></text><text x="585.0" y="690.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: aparece con CD4</tspan><tspan x="585.0" dy="16">&lt; 100</tspan></text><text x="735.0" y="690.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: aparece con CD4</tspan><tspan x="735.0" dy="16">&lt; 100</tspan></text><text x="885.0" y="690.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: aparece con CD4</tspan><tspan x="885.0" dy="16">&lt; 50</tspan></text><rect x="40.0" y="615.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="743.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="771.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="793.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Umbrales: Pneumocystis &lt; 200; toxoplasmosis y criptococosis &lt; 100; citomegalovirus (retinitis) y Mycobacterium avium &lt; 50.</tspan><tspan x="58.0" dy="18">• La tuberculosis es la principal causa de enfermedad definitoria y de muerte en VIH en el Perú; puede ser pulmonar típica con CD4 alto.</tspan><tspan x="58.0" dy="18">• Tamizaje en toda consulta: tos, fiebre, sudoración nocturna o pérdida de peso (W4SS) obliga a estudiar.</tspan><tspan x="58.0" dy="18">• TB y VIH: tratar la TB primero y empezar el TARV dentro de 2 semanas si CD4 &lt; 50, o de 8 semanas si es mayor.</tspan></text><text x="58.0" y="869.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NIH/CDC/IDSA, oportunistas en adultos con VIH (2024-2025); OMS, directrices consolidadas sobre VIH (2021); MINSA, NTS 221-MINSA/DGIESP-2024.</tspan></text></svg>