<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1237" viewBox="0 0 1000 1237" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El glucocorticoide oral es el fármaco del EPOC que causa osteoporosis: el riesgo depende de la dosis y de la vía"><title>El glucocorticoide oral es el fármaco del EPOC que causa osteoporosis: el riesgo depende de la dosis y de la vía</title><rect x="0.75" y="0.75" width="998.5" height="1235.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · osteoporosis por glucocorticoides</tspan></text><rect x="485.7" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="543.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="543.2" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Osteoporosis por glucocorticoides</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Es la causa secundaria más frecuente de osteoporosis.</tspan><tspan x="58.0" dy="17">Pierde sobre todo hueso trabecular en los primeros 3 a 6 meses.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 42 años con EPOC</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">EPOC de 10 años de evolución.</tspan><tspan x="640.0" dy="16">Se diagnostica osteoporosis en el control.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FÁRMACOS DEL EPOC Y SU EFECTO SOBRE EL HUESO</tspan></text><rect x="493.0" y="319.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 524.0 H560.0 L540.0 504.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="319.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="300.9" x2="614.6" y2="337.1" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="300.9" x2="357.4" y2="362.9" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="300.9" x2="413.4" y2="362.9" stroke="#64748b" stroke-width="2"/><path d="M347.4 362.9 H423.4 Q385.4 406.9 347.4 362.9 Z" fill="#64748b"/><text x="385.4" y="377.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">BAJO</tspan></text><line x1="614.6" y1="337.1" x2="586.6" y2="399.1" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="337.1" x2="642.6" y2="399.1" stroke="#64748b" stroke-width="2"/><path d="M576.6 399.1 H652.6 Q614.6 443.1 576.6 399.1 Z" fill="#ea580c"/><text x="614.6" y="414.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">ALTO</tspan></text><text x="500.0" y="551.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Cuál se asocia a osteoporosis?</tspan></text><rect x="40.0" y="289.0" width="290.0" height="174.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Sin efecto óseo relevante</tspan></text><circle cx="62.0" cy="342.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Fenoterol</tspan></text><circle cx="62.0" cy="368.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Teofilina</tspan></text><circle cx="62.0" cy="394.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Bromuro de ipratropio</tspan></text><circle cx="62.0" cy="420.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Corticoide inhalado: efecto menor, solo en</tspan><tspan x="74.0" dy="16">dosis altas por años</tspan></text><rect x="670.0" y="289.0" width="290.0" height="190.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="688.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Asociado a osteoporosis (este caso)</tspan></text><circle cx="692.0" cy="342.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Glucocorticoide oral: cursos repetidos o</tspan><tspan x="704.0" dy="16">prolongados</tspan></text><circle cx="692.0" cy="384.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Pérdida de hueso trabecular: vértebras y</tspan><tspan x="704.0" dy="16">costillas</tspan></text><circle cx="692.0" cy="426.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="430.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Menos calcio absorbido y más pérdida renal</tspan></text><circle cx="692.0" cy="452.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Riesgo sumado al tabaquismo y al bajo peso</tspan></text><rect x="844.6" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="585.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="613.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Glucocorticoide oral = osteoporosis secundaria</tspan></text><text x="500.0" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Dosis acumulada y vía determinan el riesgo.</tspan><tspan x="500.0" dy="17">Los demás fármacos no tienen ese efecto.</tspan></text><text x="40.0" y="712.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PREVENCIÓN Y TRATAMIENTO DE LA OSTEOPOROSIS POR GLUCOCORTICOIDES (ACR 2022)</tspan></text><rect x="40.0" y="724.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="384"><tspan x="50.0" dy="0">Situación</tspan></text><text x="450.0" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="504"><tspan x="450.0" dy="0">Conducta</tspan></text><rect x="40.0" y="753.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="772.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="384"><tspan x="50.0" dy="0">Prednisona de 2,5 mg o más por más de 3 meses</tspan></text><text x="450.0" y="772.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="504"><tspan x="450.0" dy="0">Evaluar el riesgo de fractura</tspan></text><rect x="340.6" y="756.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="386.0" y="771.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="782.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="801.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="384"><tspan x="50.0" dy="0">Todo paciente en tratamiento</tspan></text><text x="450.0" y="801.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="504"><tspan x="450.0" dy="0">Asegurar calcio y vitamina D; evitar tabaco y mantener la actividad</tspan></text><rect x="40.0" y="811.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="830.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="384"><tspan x="50.0" dy="0">Riesgo de fractura moderado o alto</tspan></text><text x="450.0" y="830.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="504"><tspan x="450.0" dy="0">Tratar con bisfosfonato</tspan></text><text x="40.0" y="880.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="890.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="921.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="912.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Glucocorticoides</tspan><tspan x="285.0" dy="17">inhalados</tspan></text><text x="435.0" y="921.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fenoterol</tspan></text><text x="585.0" y="921.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Teofilina</tspan></text><text x="735.0" y="912.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Bromuro de</tspan><tspan x="735.0" dy="17">ipratropio</tspan></text><rect x="813.0" y="893.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="912.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Glucocorticoides</tspan><tspan x="885.0" dy="17">orales</tspan></text><rect x="40.0" y="944.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="944.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="981.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Fármaco asociado?</tspan></text><text x="285.0" y="965.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: efecto sistémico</tspan><tspan x="285.0" dy="16">menor, solo en dosis</tspan><tspan x="285.0" dy="16">altas por años</tspan></text><text x="435.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: agonista beta 2 sin</tspan><tspan x="435.0" dy="16">efecto óseo</tspan></text><text x="585.0" y="981.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no afecta el hueso</tspan></text><text x="735.0" y="965.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: acción</tspan><tspan x="735.0" dy="16">anticolinérgica local,</tspan><tspan x="735.0" dy="16">sin efecto óseo</tspan></text><text x="885.0" y="965.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: dosis acumulada y</tspan><tspan x="885.0" dy="16">vía oral producen</tspan><tspan x="885.0" dy="16">pérdida ósea</tspan></text><rect x="40.0" y="890.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1034.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1062.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1084.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mecanismo: el glucocorticoide inhibe al osteoblasto, aumenta la apoptosis del osteocito, prolonga la vida del osteoclasto y reduce la absorción de calcio.</tspan><tspan x="58.0" dy="18">• En el EPOC se suman tabaquismo, sedentarismo y bajo peso. Los inhalados tienen menor efecto sistémico; fenoterol, teofilina e ipratropio no afectan el</tspan><tspan x="58.0" dy="18">   hueso.</tspan><tspan x="58.0" dy="18">• ACR 2022: evaluar el riesgo de fractura con prednisona de 2,5 mg o más por más de 3 meses; calcio y vitamina D; bisfosfonato si el riesgo es moderado</tspan><tspan x="58.0" dy="18">   o alto.</tspan><tspan x="58.0" dy="18">• Alerta: la exacerbación de EPOC se trata con prednisona 40 mg por 5 días, no más, para limitar la toxicidad ósea.</tspan></text><text x="58.0" y="1196.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR 2022 Guideline for Glucocorticoid-Induced Osteoporosis (Arthritis Rheumatol 2023); GOLD 2025 (goldcopd.org); Harrison, 21.ª ed. (2022).</tspan></text></svg>