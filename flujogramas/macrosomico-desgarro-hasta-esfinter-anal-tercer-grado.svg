<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Parto de un feto de 4200 g con desgarro que llega al esfínter anal: desgarro perineal de III grado, reparación en sala de operaciones"><title>Parto de un feto de 4200 g con desgarro que llega al esfínter anal: desgarro perineal de III grado, reparación en sala de operaciones</title><rect x="0.75" y="0.75" width="998.5" height="1058.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Desgarros perineales</tspan></text><rect x="327.2" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="414.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="414.3" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Clasificación de los desgarros perineales</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se gradúan por la capa más profunda rota: piel → músculos del periné → esfínter anal →</tspan><tspan x="58.0" dy="17">mucosa del recto.</tspan><tspan x="58.0" dy="17">El III grado compromete el esfínter anal; el IV llega además a la mucosa rectal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 40 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Feto de 4200 g; sangrado de 1000 mL (hemorragia</tspan><tspan x="640.0" dy="16">posparto).</tspan><tspan x="640.0" dy="16">Desgarro con lesión muscular hasta el esfínter del ano.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL MÁS SUPERFICIAL AL MÁS PROFUNDO (RCOG)</tspan></text><polygon points="190.0,285.0 290.0,285.0 327.5,341.0 152.5,341.0" fill="#ccfbf1" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="318.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="88"><tspan x="240.0" dy="0">I</tspan></text><rect x="466.0" y="285.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Piel del periné y mucosa vaginal</tspan></text><text x="481.0" y="326.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Sin músculo.</tspan></text><polygon points="152.5,347.0 327.5,347.0 365.0,403.0 115.0,403.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="380.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="163"><tspan x="240.0" dy="0">II</tspan></text><rect x="466.0" y="347.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="371.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Músculos del periné</tspan></text><text x="481.0" y="388.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Sin tocar el esfínter anal.</tspan></text><polygon points="115.0,409.0 365.0,409.0 402.5,465.0 77.5,465.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="238"><tspan x="240.0" dy="0">III</tspan></text><rect x="466.0" y="409.0" width="494.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="481.0" y="433.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Esfínter anal</tspan></text><text x="481.0" y="450.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">IIIa &lt; 50 % del externo · IIIb &gt; 50 % · IIIc también el interno.</tspan></text><rect x="858.2" y="398.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="413.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="77.5,471.0 402.5,471.0 440.0,527.0 40.0,527.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="313"><tspan x="240.0" dy="0">IV</tspan></text><rect x="466.0" y="471.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="495.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Mucosa del recto</tspan></text><text x="481.0" y="512.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Esfínter y mucosa rectal: el más grave.</tspan></text><text x="240.0" y="545.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="400"><tspan x="240.0" dy="0">Más profundo hacia abajo</tspan></text><rect x="40.0" y="567.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="593.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Llega al esfínter, no a la mucosa rectal: III grado</tspan></text><text x="60.0" y="612.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Reparación en sala de operaciones; tacto rectal para descartar el IV.</tspan></text><text x="40.0" y="671.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ADEMÁS EN ESTE PARTO</tspan></text><rect x="40.0" y="681.0" width="453.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="682.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="705.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="423"><tspan x="58.0" dy="0">Hemorragia posparto</tspan></text><text x="58.0" y="726.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="423"><tspan x="58.0" dy="0">1000 mL: uterotónicos y revisar el canal</tspan></text><rect x="507.0" y="681.0" width="453.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="508.0" y="682.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="525.0" y="705.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="423"><tspan x="525.0" dy="0">Feto de 4200 g</tspan></text><text x="525.0" y="726.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="423"><tspan x="525.0" dy="0">Macrosomía: factor de riesgo</tspan></text><text x="40.0" y="790.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="800.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="822.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="822.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cervicovaginal</tspan></text><text x="435.0" y="822.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Perineal IV grado</tspan></text><rect x="513.0" y="803.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="822.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Perineal III grado</tspan></text><text x="735.0" y="822.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Perineal II grado</tspan></text><text x="885.0" y="822.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Perineal I grado</tspan></text><rect x="40.0" y="837.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="837.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="866.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tipo de desgarro?</tspan></text><text x="285.0" y="858.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es del cuello y la</tspan><tspan x="285.0" dy="16">vagina</tspan></text><text x="435.0" y="858.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no llega a la</tspan><tspan x="435.0" dy="16">mucosa rectal</tspan></text><text x="585.0" y="858.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: llega al esfínter</tspan><tspan x="585.0" dy="16">anal</tspan></text><text x="735.0" y="858.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: pasa los músculos</tspan><tspan x="735.0" dy="16">del periné</tspan></text><text x="885.0" y="866.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es más que la piel</tspan></text><rect x="40.0" y="800.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="911.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="939.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="961.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Reparar en sala de operaciones con anestesia y buena luz: esfínter con sutura de reabsorción lenta (término a término o superpuesta).</tspan><tspan x="58.0" dy="18">• Antibiótico (cefalosporina + metronidazol), laxantes y analgesia; rehabilitación del piso pélvico.</tspan><tspan x="58.0" dy="18">• Riesgos: macrosomía, primer parto, fórceps, episiotomía media. Control por incontinencia anal.</tspan></text><text x="58.0" y="1019.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: RCOG Green-top n.º 29 (2015; act.); ACOG n.º 198 (2016; act.).</tspan></text></svg>