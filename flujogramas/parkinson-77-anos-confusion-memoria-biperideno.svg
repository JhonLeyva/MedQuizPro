</text><rect x="40.0" y="743.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="771.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="793.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios de Beers: evitar anticolinérgicos en mayores.</tspan><tspan x="58.0" dy="18">• Retirar el fármaco y reevaluar la cognición.</tspan><tspan x="58.0" dy="18">• Levodopa es de elección en mayores de 65 años.</tspan></text><text x="58.0" y="851.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AGS – Beers Criteria (2023) · Harrison. Principios de Medicina Interna 22.ª ed. (2025)</tspan></text></svg>