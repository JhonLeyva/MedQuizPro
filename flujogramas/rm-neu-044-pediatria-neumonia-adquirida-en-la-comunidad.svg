<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1174" viewBox="0 0 1000 1174" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la neumonía infantil, tras la taquipnea sigue la retracción torácica (tiraje subcostal)"><title>En la neumonía infantil, tras la taquipnea sigue la retracción torácica (tiraje subcostal)</title><rect x="0.75" y="0.75" width="998.5" height="1172.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · neumonía adquirida en la comunidad</tspan></text><rect x="482.3" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="539.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="539.8" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neumonía infantil</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La taquipnea es el signo más precoz y sensible.</tspan><tspan x="58.0" dy="17">El tiraje refleja mayor trabajo respiratorio por pérdida de distensibilidad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de gravedad</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué signo de agravamiento sigue a la taquipnea en la</tspan><tspan x="640.0" dy="16">neumonía infantil?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESCALERA DE GRAVEDAD DE LA NEUMONÍA INFANTIL</tspan></text><rect x="70.0" y="279.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="503.0" width="24.0" height="102.0" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="554.0" x2="130.0" y2="554.0" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="504.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="526.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Taquipnea</tspan></text><text x="240.0" y="526.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Primer signo</tspan></text><text x="144.0" y="547.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">50 o más por minuto de 2 a 11 meses; 40 o más de 1 a</tspan><tspan x="144.0" dy="15">5 años</tspan></text><rect x="75.0" y="393.0" width="24.0" height="102.0" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="444.0" x2="130.0" y2="444.0" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="394.0" width="330.0" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Tiraje</tspan></text><text x="240.0" y="416.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Signo que le sigue</tspan></text><text x="144.0" y="437.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Tiraje subcostal: neumonía grave en el esquema AIEPI</tspan></text><rect x="354.6" y="383.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="398.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="283.0" width="24.0" height="102.0" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="334.0" x2="130.0" y2="334.0" stroke="#f97316" stroke-width="2"/><rect x="130.0" y="284.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="306.0" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Peligro</tspan></text><text x="240.0" y="306.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Signos más tardíos</tspan></text><text x="144.0" y="327.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Cianosis, no beber, convulsiones, letargo, SpO2 menor</tspan><tspan x="144.0" dy="15">de 90 %</tspan></text><text x="470.0" y="283.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">CÓMO SE AVANZA</tspan></text><rect x="470.0" y="297.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="339.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="344.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="332.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Contar la frecuencia respiratoria</tspan></text><text x="528.0" y="355.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Durante un minuto completo, con el niño tranquilo</tspan></text><line x1="498.0" y1="383.0" x2="498.0" y2="396.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,395.0 503.0,395.0 498.0,403.0" fill="#0f766e"/><rect x="470.0" y="405.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="447.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="452.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="440.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Buscar retracción torácica inferior</tspan></text><text x="528.0" y="463.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Hundimiento de la parte baja del tórax al inspirar</tspan></text><rect x="857.8" y="394.0" width="64.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="409.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ CLAVE</tspan></text><line x1="498.0" y1="491.0" x2="498.0" y2="504.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,503.0 503.0,503.0 498.0,511.0" fill="#0f766e"/><rect x="470.0" y="513.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="555.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="560.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="548.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Buscar signos de peligro</tspan></text><text x="528.0" y="571.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Oxígeno y hospitalización si están presentes</tspan></text><text x="40.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TAQUIPNEA SEGÚN LA EDAD (OMS)</tspan></text><rect x="40.0" y="655.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="674.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Edad</tspan></text><text x="250.0" y="674.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Frecuencia respiratoria de taquipnea</tspan></text><text x="610.0" y="674.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Comentario</tspan></text><rect x="40.0" y="684.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="703.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Menor de 2 meses</tspan></text><text x="250.0" y="703.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">60 o más por minuto</tspan></text><text x="610.0" y="703.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Ya se considera enfermedad grave</tspan></text><rect x="40.0" y="713.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="732.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">2 a 11 meses</tspan></text><text x="250.0" y="732.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">50 o más por minuto</tspan></text><text x="610.0" y="732.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Primer signo de neumonía</tspan></text><rect x="40.0" y="742.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="761.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">12 meses a 5 años</tspan></text><text x="250.0" y="761.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">40 o más por minuto</tspan></text><text x="610.0" y="761.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Primer signo de neumonía</tspan></text><text x="40.0" y="787.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Tos con taquipnea es neumonía; tiraje o signos de peligro indican gravedad.</tspan></text><text x="40.0" y="834.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="844.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="866.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="847.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="866.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Retracción torácica</tspan></text><text x="435.0" y="866.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Estridor inspiratorio</tspan></text><text x="585.0" y="866.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Aleteo nasal</tspan></text><text x="735.0" y="866.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cianosis</tspan></text><text x="885.0" y="866.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Quejido espiratorio</tspan></text><rect x="40.0" y="881.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="881.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="910.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Signo que sigue a la</tspan><tspan x="54.0" dy="16">taquipnea?</tspan></text><text x="285.0" y="902.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sigue a la</tspan><tspan x="285.0" dy="16">taquipnea por el mayor</tspan><tspan x="285.0" dy="16">trabajo respiratorio</tspan></text><text x="435.0" y="902.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sugiere</tspan><tspan x="435.0" dy="16">obstrucción de la vía</tspan><tspan x="435.0" dy="16">aérea superior</tspan></text><text x="585.0" y="910.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: signo avanzado de</tspan><tspan x="585.0" dy="16">dificultad respiratoria</tspan></text><text x="735.0" y="910.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: signo de peligro,</tspan><tspan x="735.0" dy="16">aparece más tarde</tspan></text><text x="885.0" y="910.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: signo avanzado de</tspan><tspan x="885.0" dy="16">dificultad respiratoria</tspan></text><rect x="40.0" y="844.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="971.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="999.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1021.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Taquipnea según la edad: 60 o más por minuto bajo 2 meses (ya enfermedad grave); 50 o más de 2 a 11 meses; 40 o más de 12 meses a 5 años.</tspan><tspan x="58.0" dy="18">• AIEPI clásico: tos con taquipnea es neumonía; tiraje subcostal o retracción torácica inferior, neumonía grave. Es el signo que sigue a la taquipnea.</tspan><tspan x="58.0" dy="18">• Signos de peligro: cianosis central, no poder beber, convulsiones, letargo, estridor en reposo y SpO2 menor de 90 %: enfermedad muy grave, hospitalizar</tspan><tspan x="58.0" dy="18">   con oxígeno.</tspan><tspan x="58.0" dy="18">• Alerta: el estridor inspiratorio sugiere obstrucción alta (crup, cuerpo extraño). La OMS 2014 trata el tiraje aislado con amoxicilina oral; con peligro,</tspan><tspan x="58.0" dy="18">   hospitalizar.</tspan></text><text x="58.0" y="1133.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Revised WHO classification and treatment of childhood pneumonia at health facilities (2014); Nelson, 22.ª ed. (2024); Harrison, 21.ª ed. (2022).</tspan></text></svg>