<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="987" viewBox="0 0 1000 987" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="EPOC exacerbado con fiebre y más disnea: se inicia antibiótico junto al broncodilatador y al corticoide"><title>EPOC exacerbado con fiebre y más disnea: se inicia antibiótico junto al broncodilatador y al corticoide</title><rect x="0.75" y="0.75" width="998.5" height="985.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">EPOC · exacerbación infecciosa</tspan></text><rect x="390.1" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="447.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="447.5" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Exacerbación de EPOC</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Empeoramiento agudo de tos, disnea o esputo en menos de 14 días.</tspan><tspan x="58.0" dy="17">La fiebre orienta a causa infecciosa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 58 años con EPOC</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">3 días de fiebre de 38 °C, más tos y más disnea.</tspan><tspan x="640.0" dy="16">Rx: tórax en tonel, sin condensación.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA EXACERBACIÓN Y QUÉ SE AGREGA EN CADA NIVEL</tspan></text><rect x="70.0" y="279.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="503.0" width="24.0" height="102.0" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="554.0" x2="130.0" y2="554.0" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="504.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="526.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Leve</tspan></text><text x="240.0" y="526.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Solo broncodilatadores</tspan></text><text x="144.0" y="547.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Ambulatorio; sin antibiótico ni corticoide</tspan></text><rect x="75.0" y="393.0" width="24.0" height="102.0" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="444.0" x2="130.0" y2="444.0" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="394.0" width="330.0" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Moderada</tspan></text><text x="240.0" y="416.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Con antibiótico o corticoide</tspan></text><text x="144.0" y="437.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Fiebre y más disnea: la causa infecciosa es probable</tspan></text><rect x="354.6" y="383.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="398.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="283.0" width="24.0" height="102.0" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="334.0" x2="130.0" y2="334.0" stroke="#f97316" stroke-width="2"/><rect x="130.0" y="284.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="306.0" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Grave</tspan></text><text x="240.0" y="306.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Consulta de urgencia u hospital</tspan></text><text x="144.0" y="327.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Insuficiencia respiratoria aguda</tspan></text><text x="470.0" y="283.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">TRATAMIENTO SEGÚN GOLD</tspan></text><rect x="470.0" y="297.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="339.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="344.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="332.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Broncodilatador de acción corta</tspan></text><text x="528.0" y="355.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Salbutamol, con o sin bromuro de ipratropio</tspan></text><line x1="498.0" y1="383.0" x2="498.0" y2="396.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,395.0 503.0,395.0 498.0,403.0" fill="#0f766e"/><rect x="470.0" y="405.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="447.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="452.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="440.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Corticoide sistémico</tspan></text><text x="528.0" y="463.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Prednisona 40 mg por 5 días</tspan></text><line x1="498.0" y1="491.0" x2="498.0" y2="504.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,503.0 503.0,503.0 498.0,511.0" fill="#0f766e"/><rect x="470.0" y="513.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="555.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="560.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="548.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Antibiótico por 5 días</tspan></text><text x="528.0" y="571.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Amoxicilina-clavulánico, macrólido o doxiciclina</tspan></text><rect x="844.6" y="502.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="517.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="659.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="698.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ejercicios</tspan><tspan x="285.0" dy="17">respiratorios</tspan></text><text x="435.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antitusígenos</tspan></text><text x="585.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Espirometría</tspan></text><rect x="663.0" y="662.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Antibióticos con</tspan><tspan x="735.0" dy="17">actividad en el</tspan><tspan x="735.0" dy="17">alveolo</tspan></text><text x="885.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tomografía de alta</tspan><tspan x="885.0" dy="17">resolución</tspan></text><rect x="40.0" y="730.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="730.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="767.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Acción inmediata?</tspan></text><text x="285.0" y="759.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: apoyo, no trata la</tspan><tspan x="285.0" dy="16">infección</tspan></text><text x="435.0" y="759.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: retienen</tspan><tspan x="435.0" dy="16">secreciones</tspan></text><text x="585.0" y="759.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es confiable en</tspan><tspan x="585.0" dy="16">la exacerbación</tspan></text><text x="735.0" y="751.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: exacerbación</tspan><tspan x="735.0" dy="16">infecciosa, cubrir</tspan><tspan x="735.0" dy="16">gérmenes</tspan></text><text x="885.0" y="759.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no cambia la</tspan><tspan x="885.0" dy="16">conducta inmediata</tspan></text><rect x="40.0" y="659.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="820.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="848.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="870.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Antibiótico si hay los 3 síntomas cardinales (disnea, volumen y purulencia del esputo), o 2 si uno es la purulencia, o si necesita ventilación.</tspan><tspan x="58.0" dy="18">• Esquema: broncodilatador de acción corta, prednisona 40 mg por 5 días y antibiótico por 5 días (amoxicilina-clavulánico, macrólido o doxiciclina).</tspan><tspan x="58.0" dy="18">• Gérmenes: H. influenzae, S. pneumoniae y M. catarrhalis. Con condensación en la radiografía se trata como neumonía.</tspan><tspan x="58.0" dy="18">• Alerta: insuficiencia respiratoria, confusión o mala evolución exigen hospitalizar. Espirometría solo en fase estable; antitusígenos no.</tspan></text><text x="58.0" y="946.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GOLD, informe 2026 sobre diagnóstico, manejo y prevención de la EPOC; Harrison Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>