<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="883" viewBox="0 0 1000 883" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La uretritis no gonocócica la causa con mayor frecuencia Chlamydia trachomatis"><title>La uretritis no gonocócica la causa con mayor frecuencia Chlamydia trachomatis</title><rect x="0.75" y="0.75" width="998.5" height="881.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ITS · uretritis no gonocócica</tspan></text><rect x="368.1" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="429.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="429.1" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Uretritis no gonocócica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Secreción uretral mucoide o escasa con disuria.</tspan><tspan x="58.0" dy="17">El Gram muestra leucocitos sin diplococos gramnegativos intracelulares.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el agente causal frecuente de la uretritis no</tspan><tspan x="640.0" dy="16">gonocócica de transmisión sexual?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIPO DE URETRITIS Y SU GERMEN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="54.0" dy="0">TIPO</tspan></text><text x="382.5" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="365"><tspan x="382.5" dy="0">Secreción y Gram</tspan></text><text x="767.5" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">Agente más frecuente</tspan></text><rect x="40.0" y="309.0" width="144.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="335.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">Gonocócica</tspan></text><text x="54.0" y="352.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">N. gonorrhoeae</tspan></text><rect x="193.0" y="309.0" width="379.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="205.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">Purulenta y abundante</tspan></text><text x="205.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">Diplococos gramnegativos intracelulares</tspan></text><rect x="578.0" y="309.0" width="379.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="590.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">Neisseria gonorrhoeae</tspan></text><text x="590.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">Forma gonocócica</tspan></text><rect x="40.0" y="372.0" width="144.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="398.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">No gonocócica</tspan></text><text x="54.0" y="415.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">Chlamydia</tspan></text><rect x="193.0" y="372.0" width="379.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="205.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">Mucoide o escasa</tspan></text><text x="205.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">Leucocitos sin diplococos</tspan></text><rect x="578.0" y="372.0" width="379.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="590.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">Chlamydia trachomatis</tspan></text><text x="590.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">La más frecuente: este caso</tspan></text><rect x="856.2" y="361.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="376.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="435.0" width="144.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="461.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">No gonocócica</tspan></text><text x="54.0" y="478.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">Otros</tspan></text><rect x="193.0" y="435.0" width="379.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="205.0" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">Mucoide o escasa</tspan></text><text x="205.0" y="476.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">Pruebas moleculares</tspan></text><rect x="578.0" y="435.0" width="379.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="590.0" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">Mycoplasma, Ureaplasma, Trichomonas</tspan></text><text x="590.0" y="476.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">Adenovirus y herpes simple, menos frecuentes</tspan></text><text x="44.0" y="514.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Sin diplococos gramnegativos intracelulares: no gonocócica; el agente más frecuente es Chlamydia trachomatis.</tspan></text><text x="40.0" y="562.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="572.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="603.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="603.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Adenovirus</tspan></text><text x="435.0" y="594.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bacilos</tspan><tspan x="435.0" dy="17">gramnegativos</tspan></text><rect x="513.0" y="575.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="594.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Chlamydia</tspan><tspan x="585.0" dy="17">trachomatis</tspan></text><text x="735.0" y="594.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Neisseria</tspan><tspan x="735.0" dy="17">meningitidis</tspan></text><text x="885.0" y="603.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Microsporidios</tspan></text><rect x="40.0" y="626.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="626.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="663.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente más frecuente?</tspan></text><text x="285.0" y="647.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: causa conjuntivitis</tspan><tspan x="285.0" dy="16">o resfrío, es</tspan><tspan x="285.0" dy="16">infrecuente</tspan></text><text x="435.0" y="655.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causan infección</tspan><tspan x="435.0" dy="16">urinaria, no ITS</tspan></text><text x="585.0" y="647.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: la causa más</tspan><tspan x="585.0" dy="16">frecuente de uretritis</tspan><tspan x="585.0" dy="16">no gonocócica</tspan></text><text x="735.0" y="655.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: causa meningitis;</tspan><tspan x="735.0" dy="16">rara vez uretritis</tspan></text><text x="885.0" y="655.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: afectan a</tspan><tspan x="885.0" dy="16">inmunodeprimidos</tspan></text><rect x="40.0" y="572.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="716.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="744.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="766.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Gonocócica: secreción purulenta abundante y diplococos gramnegativos intracelulares en el Gram (Neisseria gonorrhoeae).</tspan><tspan x="58.0" dy="18">• No gonocócica: Chlamydia trachomatis (la más frecuente), luego Mycoplasma genitalium, Ureaplasma, Trichomonas y adenovirus o herpes simple.</tspan><tspan x="58.0" dy="18">• Se estudia con pruebas de amplificación de ácidos nucleicos para clamidia y gonococo; tratar a la pareja.</tspan><tspan x="58.0" dy="18">• Los bacilos gramnegativos entéricos causan infección urinaria, y Neisseria meningitidis solo ocasionalmente uretritis tras sexo oral.</tspan></text><text x="58.0" y="842.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, tratamiento de infecciones de transmisión sexual (2021); OMS, N. gonorrhoeae, C. trachomatis y T. pallidum (2024); guía IUSTI (2016).</tspan></text></svg>