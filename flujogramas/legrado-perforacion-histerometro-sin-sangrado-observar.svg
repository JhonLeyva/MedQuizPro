<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="845" viewBox="0 0 1000 845" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Perforación uterina con el histerómetro durante un legrado, sin sangrado activo: observación con control de funciones vitales"><title>Perforación uterina con el histerómetro durante un legrado, sin sangrado activo: observación con control de funciones vitales</title><rect x="0.75" y="0.75" width="998.5" height="844.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Complicaciones del legrado · perforación uterina</tspan></text><rect x="488.5" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="575.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="575.7" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Perforación uterina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Con un instrumento romo y fino (histerómetro, dilatador) en el fondo uterino suele cerrar</tspan><tspan x="58.0" dy="17">sola.</tspan><tspan x="58.0" dy="17">Con cánula de succión o legra, con sangrado, en la pared lateral (vasos uterinos) o si se</tspan><tspan x="58.0" dy="17">sospecha lesión de intestino: laparoscopia o laparotomía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Legrado por aborto incompleto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Se produce una perforación con el histerómetro.</tspan><tspan x="640.0" dy="16">Sin sangrado activo externo.</tspan></text><line x1="640.0" y1="218.0" x2="670.0" y2="218.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="238.0" x2="320.0" y2="268.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="268.0" x2="500.0" y2="268.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="268.0" x2="500.0" y2="297.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,296.0 505.0,296.0 500.0,304.0" fill="#94a3b8"/><line x1="500.0" y1="362.0" x2="500.0" y2="392.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="392.0" x2="733.5" y2="392.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="392.0" x2="266.5" y2="421.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,420.0 271.5,420.0 266.5,428.0" fill="#94a3b8"/><line x1="733.5" y1="392.0" x2="733.5" y2="421.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,420.0 738.5,420.0 733.5,428.0" fill="#94a3b8"/><line x1="320.0" y1="238.0" x2="320.0" y2="268.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="268.0" x2="500.0" y2="268.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="268.0" x2="500.0" y2="297.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,296.0 505.0,296.0 500.0,304.0" fill="#0f766e"/><line x1="500.0" y1="362.0" x2="500.0" y2="392.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="392.0" x2="500.0" y2="392.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="392.0" x2="266.5" y2="421.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,420.0 271.5,420.0 266.5,428.0" fill="#0f766e"/><rect x="139.1" y="401.0" width="254.8" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="413.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Histerómetro, sin sangrado, estable (este caso)</tspan></text><rect x="649.2" y="401.0" width="168.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="413.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Succión, sangrado o inestable</tspan></text><polygon points="240.0,333.0 266.0,304.0 734.0,304.0 760.0,333.0 734.0,362.0 266.0,362.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="333.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="338.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="337.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Perforación uterina: ¿con qué y cómo está la paciente?</tspan></text><rect x="40.0" y="428.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="456.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">OBSERVAR Y CONTROLAR FUNCIONES VITALES</tspan></text><text x="266.5" y="479.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Uterotónico y antibiótico</tspan><tspan x="266.5" dy="17">Hb seriada</tspan></text><rect x="507.0" y="428.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="464.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Laparoscopia o laparotomía</tspan></text><text x="733.5" y="487.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Revisar intestino y vasos</tspan></text><text x="40.0" y="558.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="568.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="599.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Administrar</tspan><tspan x="285.0" dy="17">analgésicos</tspan></text><text x="435.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Laparotomía</tspan><tspan x="435.0" dy="17">exploratoria</tspan></text><rect x="513.0" y="571.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Control de</tspan><tspan x="585.0" dy="17">funciones vitales</tspan></text><text x="735.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Transfusión</tspan><tspan x="735.0" dy="17">sanguínea</tspan></text><text x="885.0" y="599.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Histerectomía</tspan></text><rect x="40.0" y="622.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="622.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="651.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="651.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Insuficiente sin vigilar</tspan></text><text x="435.0" y="643.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay sangrado ni</tspan><tspan x="435.0" dy="16">inestabilidad</tspan></text><text x="585.0" y="643.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: perforación</tspan><tspan x="585.0" dy="16">pequeña y estable</tspan></text><text x="735.0" y="651.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no hay sangrado</tspan></text><text x="885.0" y="651.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: excesivo</tspan></text><rect x="40.0" y="568.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="696.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="724.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="746.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Suspender el procedimiento (completarlo después bajo guía ecográfica o laparoscópica).</tspan><tspan x="58.0" dy="18">• Hospitalizar: funciones vitales, dolor, hemoglobina; uterotónico y antibiótico profiláctico.</tspan><tspan x="58.0" dy="18">• Si hay inestabilidad, dolor creciente o sangrado: laparoscopia o laparotomía.</tspan></text><text x="58.0" y="804.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed. (2022); RCOG (2010; act.); OMS, atención del aborto (2022).</tspan></text></svg>