<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="833" viewBox="0 0 1000 833" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El plexo cardiaco nace de las ramas cervicales del vago y del tronco simpático"><title>El plexo cardiaco nace de las ramas cervicales del vago y del tronco simpático</title><rect x="0.75" y="0.75" width="998.5" height="831.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Anatomía · inervación del corazón</tspan></text><rect x="402.3" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="474.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="474.3" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Plexo cardiaco</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Red nerviosa de la base del corazón y del arco aórtico.</tspan><tspan x="58.0" dy="17">Recibe fibras simpáticas (aceleran) y vagales parasimpáticas (enlentecen).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿De dónde proviene el plexo cardiaco?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS DOS SISTEMAS QUE FORMAN EL PLEXO</tspan></text><rect x="40.0" y="253.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="275.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">SISTEMA</tspan></text><text x="420.0" y="275.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="340"><tspan x="420.0" dy="0">Origen de las fibras</tspan></text><text x="780.0" y="275.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="340"><tspan x="780.0" dy="0">Efecto en el corazón</tspan></text><rect x="40.0" y="293.0" width="194.0" height="72.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="326.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Simpático</tspan></text><text x="54.0" y="343.5" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Ganglios cervicales y T1-T4</tspan></text><rect x="243.0" y="293.0" width="354.0" height="72.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="255.0" y="325.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Ganglios cervicales y torácicos</tspan></text><text x="255.0" y="341.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Nervios cardiacos</tspan></text><rect x="496.2" y="282.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="541.6" y="297.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="541.6" dy="0">◆ ESTE CASO</tspan></text><rect x="603.0" y="293.0" width="354.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="318.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Acelera y contrae más</tspan></text><text x="615.0" y="334.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">↑ FC, ↑ contractilidad</tspan><tspan x="615.0" dy="15">Receptores beta-1</tspan></text><rect x="40.0" y="371.0" width="194.0" height="72.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="404.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Parasimpático</tspan></text><text x="54.0" y="421.5" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Nervios vagos</tspan></text><rect x="243.0" y="371.0" width="354.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="403.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Ramos cardiacos del vago</tspan></text><text x="255.0" y="419.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Cervicales y torácicos</tspan></text><rect x="603.0" y="371.0" width="354.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="396.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Enlentece</tspan></text><text x="615.0" y="412.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">↓ FC y conducción AV</tspan><tspan x="615.0" dy="15">Receptores M2</tspan></text><text x="44.0" y="465.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">El plexo cardiaco mezcla ambas: la pregunta pide el origen conjunto (vago + tronco simpático).</tspan></text><text x="40.0" y="513.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="523.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="562.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="526.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="554.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Vago cervical y</tspan><tspan x="285.0" dy="17">tronco simpático</tspan></text><text x="435.0" y="554.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Vago y ganglios</tspan><tspan x="435.0" dy="17">simpáticos</tspan></text><text x="585.0" y="554.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ramas cervicales</tspan><tspan x="585.0" dy="17">anteriores y C5</tspan></text><text x="735.0" y="554.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ramas anteriores</tspan><tspan x="735.0" dy="17">del vago y T12</tspan></text><text x="885.0" y="545.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ganglios</tspan><tspan x="885.0" dy="17">simpáticos y ramas</tspan><tspan x="885.0" dy="17">posteriores C3-C5</tspan></text><rect x="40.0" y="594.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="594.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="631.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Origen?</tspan></text><text x="285.0" y="623.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: vago cervical y</tspan><tspan x="285.0" dy="16">tronco simpático</tspan></text><text x="435.0" y="615.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el plexo es</tspan><tspan x="435.0" dy="16">autonómico, no solo</tspan><tspan x="435.0" dy="16">vagal ni solo simpático</tspan></text><text x="585.0" y="615.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: son raíces del</tspan><tspan x="585.0" dy="16">plexo cervical, no</tspan><tspan x="585.0" dy="16">cardiacas</tspan></text><text x="735.0" y="623.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: T12 inerva la</tspan><tspan x="735.0" dy="16">pared abdominal</tspan></text><text x="885.0" y="623.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: C3-C5 forman el</tspan><tspan x="885.0" dy="16">nervio frénico</tspan></text><rect x="40.0" y="523.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="684.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="712.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="734.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Simpático: ganglios cervicales superior, medio e inferior y torácicos altos → ↑ frecuencia, contractilidad y conducción.</tspan><tspan x="58.0" dy="18">• Parasimpático: nervios vagos (ramos cardiacos cervicales y torácicos) → ↓ frecuencia y conducción AV.</tspan><tspan x="58.0" dy="18">• El dolor isquémico viaja por aferentes simpáticas T1-T4: por eso se irradia al brazo izquierdo y al cuello.</tspan></text><text x="58.0" y="792.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Moore Anatomía con orientación clínica 8.ª ed.; Guyton y Hall Tratado de Fisiología Médica 14.ª ed.</tspan></text></svg>