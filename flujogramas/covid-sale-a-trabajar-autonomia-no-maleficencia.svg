<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="999" viewBox="0 0 1000 999" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Paciente con COVID-19 que sale a trabajar sin avisar invocando su autonomía: predomina el principio de no maleficencia (no dañar a terceros)"><title>Paciente con COVID-19 que sale a trabajar sin avisar invocando su autonomía: predomina el principio de no maleficencia (no dañar a terceros)</title><rect x="0.75" y="0.75" width="998.5" height="997.8" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioética · conflicto de principios</tspan></text><rect x="392.1" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="463.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="463.8" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="168.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los cuatro principios de la bioética</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Autonomía, beneficencia, no maleficencia y justicia. Cuando chocan, se pondera el caso.</tspan><tspan x="58.0" dy="17">La autonomía tiene un límite: no puede usarse para dañar a otros. En salud pública pesa</tspan><tspan x="58.0" dy="17">más evitar el contagio.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="168.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="166.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Vendedor de 28 años con COVID-19</tspan><tspan x="640.0" dy="17">sintomático</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">No avisa a sus vecinos y sale a trabajar «por</tspan><tspan x="640.0" dy="16">autonomía».</tspan><tspan x="640.0" dy="16">Debería aislarse para no contagiar.</tspan></text><line x1="640.0" y1="238.0" x2="670.0" y2="238.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="242.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="290.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ PRINCIPIO PESA MÁS AQUÍ?</tspan></text><line x1="421.1" y1="400.1" x2="340.0" y2="347.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="347.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.9" y1="503.5" x2="340.0" y2="558.3" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="558.3" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="421.3" x2="660.0" y2="397.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="397.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="479.2" x2="660.0" y2="501.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="501.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="453.3" x2="340.0" y2="454.8" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="454.8" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="451.2" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="451.2" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="456.2" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">BIOÉTICA</tspan></text><text x="500.0" y="475.2" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">4 principios</tspan></text><rect x="40.0" y="302.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="303.0" width="6.0" height="89.2" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="330.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">AUTONOMÍA</tspan></text><text x="190.0" y="354.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Decidir sobre uno mismo</tspan><tspan x="190.0" dy="17">Su límite: dañar a otros</tspan></text><rect x="40.0" y="409.2" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="438.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">NO MALEFICENCIA</tspan></text><text x="190.0" y="461.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">No dañar (no contagiar)</tspan><tspan x="190.0" dy="17">Este caso</tspan></text><rect x="144.6" y="490.3" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="505.3" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="516.3" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="517.3" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="550.1" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">BENEFICENCIA</tspan></text><text x="190.0" y="573.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Hacer el bien al paciente</tspan></text><rect x="660.0" y="355.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="356.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="389.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">JUSTICIA</tspan></text><text x="810.0" y="413.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Equidad en los recursos</tspan></text><rect x="660.0" y="455.6" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="456.6" width="6.0" height="89.2" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="484.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CONFIDENCIALIDAD</tspan></text><text x="810.0" y="508.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Deber, no principio</tspan><tspan x="810.0" dy="17">Cede ante riesgo a terceros</tspan></text><text x="40.0" y="636.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="648.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="672.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Conflicto</tspan></text><line x1="248.5" y1="668.8" x2="267.5" y2="668.8" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,663.8 266.5,673.8 274.5,668.8" fill="#0f766e"/><rect x="278.5" y="648.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="672.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Autonomía vs daño a otros</tspan></text><line x1="487.0" y1="668.8" x2="506.0" y2="668.8" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,663.8 505.0,673.8 513.0,668.8" fill="#0f766e"/><rect x="517.0" y="648.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="672.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Gana no maleficencia</tspan></text><line x1="725.5" y1="668.8" x2="744.5" y2="668.8" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,663.8 743.5,673.8 751.5,668.8" fill="#0f766e"/><rect x="755.5" y="648.3" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="672.8" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Aislamiento</tspan></text><text x="40.0" y="729.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="739.3" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="761.8" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="761.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Autonomía</tspan></text><rect x="363.0" y="742.3" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="761.8" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">No maleficencia</tspan></text><text x="585.0" y="761.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Justicia</tspan></text><text x="735.0" y="761.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Beneficencia</tspan></text><text x="885.0" y="761.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Confidencialidad</tspan></text><rect x="40.0" y="776.3" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="776.3" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="805.3" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Predomina?</tspan></text><text x="285.0" y="797.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: tiene límite cuando</tspan><tspan x="285.0" dy="16">daña a otros</tspan></text><text x="435.0" y="805.3" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: evitar contagiar</tspan></text><text x="585.0" y="797.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: reparte recursos</tspan><tspan x="585.0" dy="16">con equidad</tspan></text><text x="735.0" y="797.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: hacer el bien al</tspan><tspan x="735.0" dy="16">paciente</tspan></text><text x="885.0" y="797.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es uno de los 4</tspan><tspan x="885.0" dy="16">principios</tspan></text><rect x="40.0" y="739.3" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="850.3" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="878.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="900.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• No maleficencia: no causar daño (aquí, contagiar a otros).</tspan><tspan x="58.0" dy="18">• El aislamiento obligatorio en una epidemia es una limitación legítima de la autonomía (Ley General de Salud).</tspan><tspan x="58.0" dy="18">• La confidencialidad no es uno de los cuatro principios; se rompe si hay riesgo grave para terceros.</tspan></text><text x="58.0" y="958.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Beauchamp y Childress, Principios de ética biomédica 8.ª ed.; Ley General de Salud n.º 26842 (art. 76-79: enfermedades transmisibles).</tspan></text></svg>