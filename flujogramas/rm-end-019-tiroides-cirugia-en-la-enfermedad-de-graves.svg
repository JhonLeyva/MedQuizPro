<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la enfermedad de Graves severa la operación de elección es la tiroidectomía total"><title>En la enfermedad de Graves severa la operación de elección es la tiroidectomía total</title><rect x="0.75" y="0.75" width="998.5" height="1038.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tiroides · cirugía en la enfermedad de Graves</tspan></text><rect x="468.5" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="538.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="538.7" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cirugía en Graves</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se indica con falla de antitiroideos, bocio grande, orbitopatía activa moderada a grave,</tspan><tspan x="58.0" dy="17">sospecha de cáncer, recaída o embarazo con contraindicación a fármacos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de técnica</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la operación de elección en una paciente con</tspan><tspan x="640.0" dy="16">enfermedad de Graves-Basedow severa?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RUTA DE LA PACIENTE CON GRAVES QUE VA A CIRUGÍA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="329.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Endocrinología</tspan></text><rect x="40.0" y="381.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="381.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="441.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Cirugía</tspan></text><rect x="40.0" y="493.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="493.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="553.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Posoperatorio</tspan></text><line x1="307.2" y1="317.0" x2="314.2" y2="317.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="317.0" x2="314.2" y2="324.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="324.5" x2="312.2" y2="324.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,329.5 312.2,319.5 321.2,324.5" fill="#0f766e"/><line x1="470.4" y1="324.5" x2="477.4" y2="324.5" stroke="#ea580c" stroke-width="2.2"/><line x1="477.4" y1="324.5" x2="477.4" y2="436.5" stroke="#ea580c" stroke-width="2.2"/><line x1="477.4" y1="436.5" x2="475.4" y2="436.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="475.4,441.5 475.4,431.5 484.4,436.5" fill="#ea580c"/><line x1="633.6" y1="436.5" x2="640.6" y2="436.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="436.5" x2="640.6" y2="540.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="540.5" x2="638.6" y2="540.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,545.5 638.6,535.5 647.6,540.5" fill="#0f766e"/><line x1="796.8" y1="540.5" x2="803.8" y2="540.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="540.5" x2="803.8" y2="549.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="549.0" x2="801.8" y2="549.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,554.0 801.8,544.0 810.8,549.0" fill="#0f766e"/><rect x="158.0" y="282.0" width="149.2" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Antitiroideos y</tspan><tspan x="168.0" dy="16">betabloqueante</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Hasta lograr eutiroidismo</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="282.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Lugol 7-10 días</tspan></text><text x="331.2" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Reduce la</tspan><tspan x="331.2" dy="14.5">vascularización de la</tspan><tspan x="331.2" dy="14.5">glándula</tspan></text><circle cx="321.2" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="394.0" width="149.2" height="85.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="494.4" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Tiroidectomía total</tspan></text><text x="494.4" y="427.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Elimina el tejido</tspan><tspan x="494.4" dy="14.5">autoinmune y evita la</tspan><tspan x="494.4" dy="14.5">recaída</tspan></text><circle cx="484.4" cy="394.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="398.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="506.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="522.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Calcio y voz</tspan></text><text x="657.6" y="539.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Hipocalcemia y lesión del</tspan><tspan x="657.6" dy="14.5">laríngeo recurrente</tspan></text><circle cx="647.6" cy="506.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="510.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="506.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="522.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Levotiroxina de por</tspan><tspan x="820.8" dy="16">vida</tspan></text><text x="820.8" y="555.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Reemplazo hormonal</tspan><tspan x="820.8" dy="14.5">permanente</tspan></text><circle cx="810.8" cy="506.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="510.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="623.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="649.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Tiroidectomía total en Graves severo</tspan></text><text x="60.0" y="668.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La subtotal, la lobectomía y la resección parcial dejan tejido y recaída.</tspan></text><text x="40.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="745.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="776.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="767.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tiroidectomía</tspan><tspan x="285.0" dy="17">subtotal</tspan></text><text x="435.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Istmectomía</tspan></text><text x="585.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Lobectomía</tspan></text><rect x="663.0" y="748.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tiroidectomía total</tspan></text><text x="885.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Resección</tspan></text><rect x="40.0" y="799.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="799.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="828.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Operación?</tspan></text><text x="285.0" y="820.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: deja tejido y riesgo</tspan><tspan x="285.0" dy="16">de recaída</tspan></text><text x="435.0" y="828.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: deja tejido residual</tspan></text><text x="585.0" y="828.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: deja tejido residual</tspan></text><text x="735.0" y="820.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: elimina el tejido</tspan><tspan x="735.0" dy="16">autoinmune</tspan></text><text x="885.0" y="828.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: deja tejido residual</tspan></text><rect x="40.0" y="745.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="873.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="901.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="923.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ATA 2016: tiroidectomía total o casi total; elimina el tejido autoinmune y evita la recaída, mientras que la subtotal conserva riesgo de recurrencia.</tspan><tspan x="58.0" dy="18">• Preparación: antitiroideos hasta eutiroidismo, betabloqueante y solución de Lugol por 7-10 días para reducir la vascularización.</tspan><tspan x="58.0" dy="18">• Complicaciones: hipocalcemia por hipoparatiroidismo y lesión del nervio laríngeo recurrente; levotiroxina de por vida.</tspan><tspan x="58.0" dy="18">• Bandera roja: operar sin preparación puede desencadenar una tormenta tiroidea. Lobectomía, istmectomía y resección parcial dejan tejido residual.</tspan></text><text x="58.0" y="999.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATA, tirotoxicosis (2016); ETA, hipertiroidismo de Graves (2018); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>