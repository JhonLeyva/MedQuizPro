<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1068" viewBox="0 0 1000 1068" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cefalea pulsátil recurrente con náuseas, vómitos, fotofobia y madre con lo mismo: migraña"><title>Cefalea pulsátil recurrente con náuseas, vómitos, fotofobia y madre con lo mismo: migraña</title><rect x="0.75" y="0.75" width="998.5" height="1066.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología pediátrica · migraña</tspan></text><rect x="386.6" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="435.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="435.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Migraña en el adolescente</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Causa más frecuente de cefalea aguda recurrente en niños y adolescentes.</tspan><tspan x="58.0" dy="17">Predomina en mujeres tras la pubertad; fuerte componente hereditario.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 13 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cefalea pulsátil frontal de moderada intensidad.</tspan><tspan x="640.0" dy="16">Náuseas, vómitos, fotofobia y madre con cuadro</tspan><tspan x="640.0" dy="16">similar.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ RASGOS DEL CASO CUMPLEN LA MIGRAÑA Y CUÁLES SON BANDERAS ROJAS</tspan></text><rect x="40.0" y="285.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">CRITERIOS ICHD-3 Y BANDERAS ROJAS</tspan></text><text x="626.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="325.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,340.5 74.0,360.5 50.0,360.5" fill="#dc2626"/><text x="62.0" y="357.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="348.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Cefalea pulsátil</tspan></text><text x="84.0" y="365.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Criterio de migraña</tspan></text><text x="626.0" y="355.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="384.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,399.5 74.0,419.5 50.0,419.5" fill="#dc2626"/><text x="62.0" y="416.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="407.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Intensidad moderada, en incremento</tspan></text><text x="84.0" y="424.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Criterio de migraña</tspan></text><text x="626.0" y="414.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="443.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,458.5 74.0,478.5 50.0,478.5" fill="#dc2626"/><text x="62.0" y="475.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="466.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Náuseas, vómitos y fotofobia</tspan></text><text x="84.0" y="483.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Síntomas asociados</tspan></text><text x="626.0" y="473.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="502.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,517.5 74.0,537.5 50.0,537.5" fill="#dc2626"/><text x="62.0" y="534.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="525.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Antecedente familiar: la madre</tspan></text><text x="84.0" y="542.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Fuerte componente hereditario</tspan></text><text x="626.0" y="532.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="561.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,576.5 74.0,596.5 50.0,596.5" fill="#cbd5e1"/><text x="62.0" y="593.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="584.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Cefalea nocturna o matutina, déficit focal</tspan></text><text x="84.0" y="601.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Bandera roja de tumor: no referida</tspan></text><text x="626.0" y="591.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="40.0" y="620.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,635.5 74.0,655.5 50.0,655.5" fill="#cbd5e1"/><text x="62.0" y="652.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="643.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Cefalea súbita en trueno</tspan></text><text x="84.0" y="660.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Bandera roja de aneurisma: no referida</tspan></text><text x="626.0" y="650.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="660.0" y="285.0" width="300.0" height="388.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="309.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">EXAMEN NEUROLÓGICO NORMAL</tspan></text><text x="676.0" y="454.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Sin banderas rojas: no se pide</tspan><tspan x="676.0" dy="17">neuroimagen</tspan></text><text x="676.0" y="488.0" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Ibuprofeno o paracetamol al inicio de la crisis;</tspan><tspan x="676.0" dy="16">triptanes en adolescentes seleccionados.</tspan><tspan x="676.0" dy="16">Prevención: sueño regular, hidratación y evitar</tspan><tspan x="676.0" dy="16">desencadenantes.</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="745.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Depresión</tspan></text><text x="435.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ametropía</tspan></text><text x="585.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tumor cerebral</tspan></text><rect x="663.0" y="726.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Migraña</tspan></text><text x="885.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Aneurisma</tspan></text><rect x="40.0" y="760.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="760.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="797.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: causa cefalea</tspan><tspan x="285.0" dy="16">tensional, no pulsátil</tspan><tspan x="285.0" dy="16">con fotofobia</tspan></text><text x="435.0" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: da cefalea frontal</tspan><tspan x="435.0" dy="16">vespertina tras</tspan><tspan x="435.0" dy="16">esfuerzo visual</tspan></text><text x="585.0" y="789.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: requiere banderas</tspan><tspan x="585.0" dy="16">rojas</tspan></text><text x="735.0" y="789.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: cumple casi todos</tspan><tspan x="735.0" dy="16">los criterios</tspan></text><text x="885.0" y="789.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: requiere cefalea</tspan><tspan x="885.0" dy="16">súbita en trueno</tspan></text><rect x="40.0" y="723.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="850.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="878.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="900.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ICHD-3 (2018), migraña sin aura: al menos 5 crisis de 4 a 72 horas (2 a 72 en niños), con 2 de 4: unilateral (en niños, bifrontal o bitemporal), pulsátil,</tspan><tspan x="58.0" dy="18">   moderada o grave, empeora con actividad.</tspan><tspan x="58.0" dy="18">• Más una de: náuseas o vómitos, o fotofobia con fonofobia. La paciente cumple casi todo.</tspan><tspan x="58.0" dy="18">• Banderas rojas de tumor o aneurisma: cefalea progresiva, nocturna o matutina, vómitos sin náuseas, déficit focal, papiledema o cefalea súbita en trueno.</tspan><tspan x="58.0" dy="18">• Tratamiento agudo: ibuprofeno o paracetamol; triptanes en adolescentes seleccionados. Examen neurológico normal con criterios de migraña no requiere</tspan><tspan x="58.0" dy="18">   neuroimagen.</tspan></text><text x="58.0" y="1012.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Headache Classification Committee of the IHS, ICHD-3 (Cephalalgia 2018;38:1-211); Oskoui y cols., AAN/AHS, migraña pediátrica (Neurology 2019;93:500-9); Nelson</tspan><tspan x="58.0" dy="15">Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>