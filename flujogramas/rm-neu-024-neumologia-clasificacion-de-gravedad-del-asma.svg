<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1038" viewBox="0 0 1000 1038" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Síntomas menos de 2 veces por semana, noches menos de 2 veces por mes y asintomático entre crisis: asma intermitente"><title>Síntomas menos de 2 veces por semana, noches menos de 2 veces por mes y asintomático entre crisis: asma intermitente</title><rect x="0.75" y="0.75" width="998.5" height="1036.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · clasificación de gravedad del asma</tspan></text><rect x="489.2" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="546.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="546.7" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Gravedad del asma (NAEPP / EPR-3)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se mide antes del tratamiento por síntomas, despertares, uso de rescate, limitación y</tspan><tspan x="58.0" dy="17">función pulmonar.</tspan><tspan x="58.0" dy="17">Ya no ordena el tratamiento en GINA.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cuadro de asma</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sibilancias, tos y disnea menos de 2 veces por</tspan><tspan x="640.0" dy="16">semana; exacerbaciones breves.</tspan><tspan x="640.0" dy="16">Síntomas nocturnos menos de 2 veces por mes;</tspan><tspan x="640.0" dy="16">asintomático entre crisis.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="277.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="303.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Síntomas ≤ 2 veces por semana y asintomático entre crisis = asma intermitente</tspan></text><text x="60.0" y="322.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">No existe la categoría «intermitente moderado».</tspan></text><text x="40.0" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DEL ASMA ANTES DEL TRATAMIENTO (NAEPP EPR-3, ADULTOS)</tspan></text><rect x="40.0" y="395.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Clasificación</tspan></text><text x="270.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="159"><tspan x="270.0" dy="0">Síntomas diurnos</tspan></text><text x="445.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="159"><tspan x="445.0" dy="0">Despertares nocturnos</tspan></text><text x="620.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="159"><tspan x="620.0" dy="0">Rescate con SABA</tspan></text><text x="795.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="159"><tspan x="795.0" dy="0">VEF₁</tspan></text><rect x="40.0" y="424.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="443.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Intermitente</tspan></text><text x="270.0" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="270.0" dy="0">≤ 2 días por semana</tspan></text><text x="445.0" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="445.0" dy="0">≤ 2 veces al mes</tspan></text><text x="620.0" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="620.0" dy="0">≤ 2 días por semana</tspan></text><text x="795.0" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="795.0" dy="0">&gt; 80 %</tspan></text><rect x="160.6" y="427.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="442.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="453.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="472.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Persistente leve</tspan></text><text x="270.0" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="270.0" dy="0">&gt; 2 días por semana, no</tspan><tspan x="270.0" dy="15">diarios</tspan></text><text x="445.0" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="445.0" dy="0">3 a 4 veces al mes</tspan></text><text x="620.0" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="620.0" dy="0">&gt; 2 días por semana, no</tspan><tspan x="620.0" dy="15">diarios</tspan></text><text x="795.0" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="795.0" dy="0">&gt; 80 %</tspan></text><rect x="40.0" y="497.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="516.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Persistente moderado</tspan></text><text x="270.0" y="516.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="270.0" dy="0">Diarios</tspan></text><text x="445.0" y="516.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="445.0" dy="0">&gt; 1 vez por semana, no</tspan><tspan x="445.0" dy="15">cada noche</tspan></text><text x="620.0" y="516.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="620.0" dy="0">Diario</tspan></text><text x="795.0" y="516.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="795.0" dy="0">60 a 80 %</tspan></text><rect x="40.0" y="541.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="560.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Persistente grave</tspan></text><text x="270.0" y="560.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="270.0" dy="0">Todo el día</tspan></text><text x="445.0" y="560.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="445.0" dy="0">Frecuentes, a menudo cada</tspan><tspan x="445.0" dy="15">noche</tspan></text><text x="620.0" y="560.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="620.0" dy="0">Varias veces al día</tspan></text><text x="795.0" y="560.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="159"><tspan x="795.0" dy="0">&lt; 60 %</tspan></text><text x="40.0" y="601.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Se clasifica por el criterio más grave. Intermitente: sin limitación de actividades y sin síntomas entre exacerbaciones.</tspan></text><text x="40.0" y="648.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="658.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="689.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="661.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="689.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Intermitente</tspan></text><text x="435.0" y="689.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Persistente leve</tspan></text><text x="585.0" y="680.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Persistente</tspan><tspan x="585.0" dy="17">moderado</tspan></text><text x="735.0" y="689.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Persistente grave</tspan></text><text x="885.0" y="680.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Intermitente</tspan><tspan x="885.0" dy="17">moderado</tspan></text><rect x="40.0" y="712.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="712.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="749.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Gravedad?</tspan></text><text x="285.0" y="733.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: cumple</tspan><tspan x="285.0" dy="16">exactamente los</tspan><tspan x="285.0" dy="16">criterios</tspan></text><text x="435.0" y="733.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: serían síntomas</tspan><tspan x="435.0" dy="16">más de 2 días por</tspan><tspan x="435.0" dy="16">semana</tspan></text><text x="585.0" y="741.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: serían síntomas</tspan><tspan x="585.0" dy="16">diarios</tspan></text><text x="735.0" y="741.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: serían síntomas</tspan><tspan x="735.0" dy="16">todo el día</tspan></text><text x="885.0" y="741.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: esa categoría no</tspan><tspan x="885.0" dy="16">existe</tspan></text><rect x="40.0" y="658.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="802.0" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="830.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="852.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Intermitente: síntomas ≤ 2 días por semana, despertares ≤ 2 veces al mes, rescate ≤ 2 días por semana, sin limitación y VEF₁ &gt; 80 % con variabilidad &lt;</tspan><tspan x="58.0" dy="18">   20 %.</tspan><tspan x="58.0" dy="18">• Persistente leve: síntomas &gt; 2 días por semana pero no diarios y despertares 3 a 4 veces al mes. Moderado: síntomas diarios y despertares más de una</tspan><tspan x="58.0" dy="18">   vez por semana.</tspan><tspan x="58.0" dy="18">• Persistente grave: síntomas todo el día, despertares frecuentes, limitación extrema y VEF₁ &lt; 60 %. «Intermitente moderado» no existe.</tspan><tspan x="58.0" dy="18">• GINA 2025 trata por control y riesgo de exacerbaciones: corticoide inhalado con formoterol a demanda desde el primer escalón; el salbutamol solo está</tspan><tspan x="58.0" dy="18">   desaconsejado.</tspan></text><text x="58.0" y="982.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA, Global Strategy for Asthma Management and Prevention (informe 2025); NAEPP, Expert Panel Report 3 (2007); Harrison Principios de Medicina Interna, 21.ª ed.</tspan><tspan x="58.0" dy="15">(2022).</tspan></text></svg>