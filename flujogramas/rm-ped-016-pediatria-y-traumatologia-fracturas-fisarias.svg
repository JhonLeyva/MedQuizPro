<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="973" viewBox="0 0 1000 973" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el hueso largo del niño el punto más débil es el cartílago de crecimiento (fisis): fractura de Salter-Harris"><title>En el hueso largo del niño el punto más débil es el cartílago de crecimiento (fisis): fractura de Salter-Harris</title><rect x="0.75" y="0.75" width="998.5" height="971.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría y traumatología · fracturas fisarias</tspan></text><rect x="459.1" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="508.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="508.2" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fractura fisaria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">En el hueso inmaduro la fisis, en su zona hipertrófica, es menos resistente que los</tspan><tspan x="58.0" dy="17">ligamentos y la cápsula.</tspan><tspan x="58.0" dy="17">Un trauma que en el adulto da un esguince origina una lesión fisaria.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de localización</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué parte del hueso largo es frecuente la fractura</tspan><tspan x="640.0" dy="16">en el niño?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hueso en crecimiento = fractura en el cartílago de crecimiento</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Salter-Harris: mayor número, peor pronóstico por cierre prematuro de la fisis.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE SALTER-HARRIS DE LAS FRACTURAS FISARIAS</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="175.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Trazo de fractura</tspan></text><text x="572.5" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Pronóstico y manejo</tspan></text><rect x="40.0" y="392.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">I</tspan></text><text x="175.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Separación a través de la fisis</tspan></text><text x="572.5" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Reducción cerrada e inmovilización</tspan></text><rect x="40.0" y="421.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="440.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">II</tspan></text><text x="175.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Fisis con fragmento metafisario (la más común, casi 75 %)</tspan></text><text x="572.5" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Reducción cerrada e inmovilización</tspan></text><rect x="65.6" y="424.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="439.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="450.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="469.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">III</tspan></text><text x="175.0" y="469.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Fisis con fragmento epifisario intraarticular</tspan></text><text x="572.5" y="469.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Reducción anatómica y fijación</tspan></text><rect x="40.0" y="479.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="498.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">IV</tspan></text><text x="175.0" y="498.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Atraviesa metáfisis, fisis y epífisis</tspan></text><text x="572.5" y="498.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Reducción anatómica y fijación</tspan></text><rect x="40.0" y="508.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="527.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">V</tspan></text><text x="175.0" y="527.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Compresión de la fisis</tspan></text><text x="572.5" y="527.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Peor pronóstico: cierre prematuro y deformidad</tspan></text><text x="40.0" y="553.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El tipo II es el más frecuente. La fractura más común del niño, en general, es la del radio distal (metáfisis).</tspan></text><text x="40.0" y="600.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="610.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="641.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tercio medio de</tspan><tspan x="285.0" dy="17">diáfisis</tspan></text><text x="435.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tercio distal de</tspan><tspan x="435.0" dy="17">diáfisis</tspan></text><rect x="513.0" y="613.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cartílago de</tspan><tspan x="585.0" dy="17">crecimiento</tspan></text><text x="735.0" y="641.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Epífisis distal</tspan></text><text x="885.0" y="641.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Epífisis proximal</tspan></text><rect x="40.0" y="664.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="664.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="701.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dónde es frecuente la</tspan><tspan x="54.0" dy="16">fractura?</tspan></text><text x="285.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: menos específica</tspan><tspan x="285.0" dy="16">de esta edad</tspan></text><text x="435.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: menos específica</tspan><tspan x="435.0" dy="16">de esta edad</tspan></text><text x="585.0" y="685.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: punto</tspan><tspan x="585.0" dy="16">mecánicamente más</tspan><tspan x="585.0" dy="16">débil del hueso</tspan><tspan x="585.0" dy="16">inmaduro</tspan></text><text x="735.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la epífisis es</tspan><tspan x="735.0" dy="16">resistente</tspan></text><text x="885.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la epífisis es</tspan><tspan x="885.0" dy="16">resistente</tspan></text><rect x="40.0" y="610.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="770.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="798.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="820.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Las lesiones fisarias son de 15 a 30 % de las fracturas pediátricas; predominan en varones, en el miembro superior (radio distal) y en edad escolar.</tspan><tspan x="58.0" dy="18">• Salter-Harris (1963): I separación fisaria; II fisis con fragmento metafisario (casi 75 %); III fisis con fragmento epifisario intraarticular; IV metáfisis, fisis y</tspan><tspan x="58.0" dy="18">   epífisis; V compresión.</tspan><tspan x="58.0" dy="18">• Mayor número, peor pronóstico por cierre prematuro, acortamiento y deformidad angular. Tratamiento: reducción cerrada e inmovilización en I y II;</tspan><tspan x="58.0" dy="18">   reducción anatómica con fijación en III y IV.</tspan><tspan x="58.0" dy="18">• Alerta: dolor localizado en la fisis con radiografía normal se trata como Salter I; en menores de 3 años pensar en maltrato.</tspan></text><text x="58.0" y="932.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); Tachdjian Ortopedia Pediátrica 6.ª ed. (2020); Salter RB, Harris WR, J Bone Joint Surg Am 1963;45:587.</tspan></text></svg>