<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1118" viewBox="0 0 1000 1118" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Se considera recién nacido de bajo peso el que pesa menos de 2500 gramos, sin importar la edad gestacional"><title>Se considera recién nacido de bajo peso el que pesa menos de 2500 gramos, sin importar la edad gestacional</title><rect x="0.75" y="0.75" width="998.5" height="1116.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · bajo peso al nacer</tspan></text><rect x="398.2" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="447.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="447.3" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bajo peso al nacer (OMS)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Peso menor de 2500 g, medido en las primeras horas de vida, independiente de la edad</tspan><tspan x="58.0" dy="17">gestacional.</tspan><tspan x="58.0" dy="17">Predice mortalidad y secuelas neurológicas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de definición</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Por debajo de qué peso en gramos se considera</tspan><tspan x="640.0" dy="16">recién nacido de bajo peso?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PESO AL NACER Y SU CLASIFICACIÓN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Peso al nacer (gramos)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Corte de bajo peso: 2500 g; los demás cortes delimitan categorías menores o la macrosomía.</tspan></text><rect x="70.0" y="378.0" width="172.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="156.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="162"><tspan x="156.0" dy="0">Extremo</tspan></text><rect x="242.0" y="378.0" width="86.0" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="285.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="76"><tspan x="285.0" dy="0">Muy bajo</tspan></text><rect x="328.0" y="378.0" width="172.0" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="414.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="162"><tspan x="414.0" dy="0">Bajo peso</tspan></text><rect x="500.0" y="378.0" width="258.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="629.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="248"><tspan x="629.0" dy="0">Peso adecuado</tspan></text><rect x="758.0" y="378.0" width="172.0" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="844.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="162"><tspan x="844.0" dy="0">Macrosomía</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0</tspan></text><line x1="242.0" y1="418.0" x2="242.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="242.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="242.0" dy="0">1000</tspan></text><line x1="328.0" y1="418.0" x2="328.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="328.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="328.0" dy="0">1500</tspan></text><line x1="500.0" y1="418.0" x2="500.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">2500</tspan></text><line x1="758.0" y1="418.0" x2="758.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="758.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="758.0" dy="0">4000</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">5000</tspan></text><polygon points="491.0,364.0 509.0,364.0 500.0,376.0" fill="#ea580c"/><rect x="446.8" y="338.0" width="106.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="94"><tspan x="500.0" dy="0">◆ Límite: 2500 g</tspan></text><text x="40.0" y="486.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DICEN LOS DEMÁS CORTES</tspan></text><rect x="40.0" y="496.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="497.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Menos de 2500 g</tspan></text><text x="58.0" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Bajo peso al nacer: la opción correcta</tspan></text><rect x="351.3" y="496.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="497.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Menos de 1500 g y menos de 1000 g</tspan></text><text x="369.3" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Muy bajo y extremadamente bajo peso</tspan></text><rect x="662.7" y="496.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="497.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">3000 g y 2000 g</tspan></text><text x="680.7" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No son cortes oficiales</tspan></text><text x="40.0" y="599.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DEL PESO AL NACER (OMS)</tspan></text><rect x="40.0" y="611.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Categoría</tspan></text><text x="290.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Peso</tspan></text><text x="630.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Nota</tspan></text><rect x="40.0" y="640.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="659.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Bajo peso al nacer</tspan></text><text x="290.0" y="659.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Menos de 2500 g</tspan></text><text x="630.0" y="659.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Corte de la pregunta</tspan></text><rect x="180.6" y="643.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="226.0" y="658.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="669.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Muy bajo peso</tspan></text><text x="290.0" y="688.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Menos de 1500 g</tspan></text><text x="630.0" y="688.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Mayor mortalidad y secuelas</tspan></text><rect x="40.0" y="698.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Extremadamente bajo peso</tspan></text><text x="290.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Menos de 1000 g</tspan></text><text x="630.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Categoría de menor peso</tspan></text><rect x="40.0" y="727.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="746.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Macrosomía</tspan></text><text x="290.0" y="746.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Más de 4000 g o percentil 90</tspan></text><text x="630.0" y="746.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Asociada a diabetes materna</tspan></text><text x="40.0" y="796.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="806.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="828.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="828.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">1500 g</tspan></text><text x="435.0" y="828.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">3000 g</tspan></text><text x="585.0" y="828.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">2000 g</tspan></text><rect x="663.0" y="809.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="828.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">2500 g</tspan></text><text x="885.0" y="828.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">1000 g</tspan></text><rect x="40.0" y="843.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="843.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="880.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Punto de corte?</tspan></text><text x="285.0" y="872.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es el corte de muy</tspan><tspan x="285.0" dy="16">bajo peso</tspan></text><text x="435.0" y="872.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es un corte</tspan><tspan x="435.0" dy="16">oficial</tspan></text><text x="585.0" y="872.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es un corte</tspan><tspan x="585.0" dy="16">oficial</tspan></text><text x="735.0" y="880.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: corte de la OMS</tspan></text><text x="885.0" y="864.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es el corte de</tspan><tspan x="885.0" dy="16">extremadamente bajo</tspan><tspan x="885.0" dy="16">peso</tspan></text><rect x="40.0" y="806.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="933.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="961.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="983.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Subcategorías: muy bajo peso menos de 1500 g y extremadamente bajo peso menos de 1000 g. Macrosomía: más de 4000 g o percentil 90.</tspan><tspan x="58.0" dy="18">• No confundir con el crecimiento: pretérmino con peso adecuado no es igual a término pequeño para la edad gestacional (menos del percentil 10, con</tspan><tspan x="58.0" dy="18">   restricción del crecimiento).</tspan><tspan x="58.0" dy="18">• Riesgos: hipotermia, hipoglucemia, policitemia, infecciones y enterocolitis necrosante; cuidado piel con piel (método madre canguro).</tspan><tspan x="58.0" dy="18">• Los valores de 3000 y 2000 g no son puntos de corte oficiales; 1500 y 1000 g delimitan las categorías menores.</tspan></text><text x="58.0" y="1077.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, CIE-11 (2022), capítulo perinatal; NTS 214-2024 MINSA, Atención integral de la persona recién nacida; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>