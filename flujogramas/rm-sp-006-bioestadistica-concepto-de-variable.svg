<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="898" viewBox="0 0 1000 898" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Una característica observable y medible que toma distintos valores en cada unidad de estudio es una variable"><title>Una característica observable y medible que toma distintos valores en cada unidad de estudio es una variable</title><rect x="0.75" y="0.75" width="998.5" height="897.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioestadística · concepto de variable</tspan></text><rect x="418.8" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="483.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="483.1" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Variable</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Característica del individuo o de su entorno que se observa, se mide y adopta valores</tspan><tspan x="58.0" dy="17">distintos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de definición</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cómo se llama la característica observable y medible</tspan><tspan x="640.0" dy="16">que toma diferentes valores según el elemento</tspan><tspan x="640.0" dy="16">muestral?</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="395.0" x2="850.2" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="395.0" x2="149.8" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="144.8,423.0 154.8,423.0 149.8,431.0" fill="#94a3b8"/><line x1="383.2" y1="395.0" x2="383.2" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="378.2,423.0 388.2,423.0 383.2,431.0" fill="#94a3b8"/><line x1="616.8" y1="395.0" x2="616.8" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="611.8,423.0 621.8,423.0 616.8,431.0" fill="#94a3b8"/><line x1="850.2" y1="395.0" x2="850.2" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="845.2,423.0 855.2,423.0 850.2,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="383.2" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="383.2" y1="395.0" x2="383.2" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="378.2,423.0 388.2,423.0 383.2,431.0" fill="#0f766e"/><rect x="67.8" y="404.0" width="163.8" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="149.8" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="149.8" dy="0">Valor concreto en una unidad</tspan></text><rect x="288.0" y="404.0" width="190.6" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="383.2" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="383.2" dy="0">Cambia entre unidades (este caso)</tspan></text><rect x="526.2" y="404.0" width="181.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="616.8" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="616.8" dy="0">Medida calculada con la muestra</tspan></text><rect x="777.0" y="404.0" width="146.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="850.2" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="850.2" dy="0">Valor en toda la población</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Característica observable y medible</tspan></text><rect x="40.0" y="431.0" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="149.8" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">DATO</tspan></text><text x="149.8" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">Es el registro de la variable</tspan><tspan x="149.8" dy="17">Ejemplo: PA 120/80 en un paciente</tspan></text><rect x="273.5" y="431.0" width="219.5" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="383.2" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">VARIABLE</tspan></text><text x="383.2" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">Edad, presión arterial, diabetes</tspan><tspan x="383.2" dy="17">Cualitativa o cuantitativa</tspan></text><rect x="507.0" y="431.0" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="616.8" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">ESTADÍSTICO</tspan></text><text x="616.8" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">Ejemplo: media muestral</tspan><tspan x="616.8" dy="17">Estima al parámetro</tspan></text><rect x="740.5" y="431.0" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="850.2" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">PARÁMETRO</tspan></text><text x="850.2" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">Casi siempre desconocido</tspan><tspan x="850.2" dy="17">Es lo que se desea estimar</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="571.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="594.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Dato</tspan></text><text x="435.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Indicador</tspan></text><rect x="513.0" y="574.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Variable</tspan></text><text x="735.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Estadístico</tspan></text><text x="885.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Parámetro</tspan></text><rect x="40.0" y="608.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="608.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="645.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Concepto?</tspan></text><text x="285.0" y="637.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es el valor</tspan><tspan x="285.0" dy="16">concreto registrado</tspan></text><text x="435.0" y="629.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una medida</tspan><tspan x="435.0" dy="16">resumen de un</tspan><tspan x="435.0" dy="16">aspecto de salud</tspan></text><text x="585.0" y="637.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: cambia entre</tspan><tspan x="585.0" dy="16">unidades de estudio</tspan></text><text x="735.0" y="637.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se calcula con la</tspan><tspan x="735.0" dy="16">muestra</tspan></text><text x="885.0" y="637.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es el valor de la</tspan><tspan x="885.0" dy="16">población</tspan></text><rect x="40.0" y="571.5" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="698.5" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="726.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="748.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Se clasifican por su naturaleza en cualitativas (nominales, ordinales) y cuantitativas (discretas, continuas); por su función en independientes,</tspan><tspan x="58.0" dy="18">   dependientes y de confusión.</tspan><tspan x="58.0" dy="18">• Dato: valor concreto registrado. Indicador: medida resumen de salud, como una tasa. Estadístico: medida de la muestra. Parámetro: valor poblacional.</tspan><tspan x="58.0" dy="18">• Antes de elegir una prueba estadística se identifica el tipo de variable y su escala de medición.</tspan><tspan x="58.0" dy="18">• El estadístico estima al parámetro, que casi siempre se desconoce.</tspan></text><text x="58.0" y="842.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed. (2019); Szklo y Nieto, Epidemiology: Beyond the Basics 4.ª ed. (2019); Argimon y Jiménez, Métodos de investigación clínica y</tspan><tspan x="58.0" dy="15">epidemiológica 5.ª ed. (2019).</tspan></text></svg>