<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Del inicio de la gastrulación a la semana 8 tras la concepción se forman los órganos: período embrionario, el más sensible a malformaciones"><title>Del inicio de la gastrulación a la semana 8 tras la concepción se forman los órganos: período embrionario, el más sensible a malformaciones</title><rect x="0.75" y="0.75" width="998.5" height="748.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Embriología · períodos del desarrollo</tspan></text><rect x="420.1" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="499.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="499.5" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Período embrionario</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Semanas 3 a 8 tras la concepción (algunos textos: 2 a 8): se forman todos los órganos.</tspan><tspan x="58.0" dy="17">Un teratógeno aquí causa malformaciones mayores.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Período que va de la 2.ª a la 8.ª semana.</tspan><tspan x="640.0" dy="16">Abarca la organogénesis.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PERÍODOS DEL DESARROLLO Y TERATÓGENOS</tspan></text><rect x="42.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="155.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">SEMANAS 1-2</tspan></text><text x="155.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">Preembrionario</tspan></text><rect x="272.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="385.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">SEMANAS 3-8</tspan></text><text x="385.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">Embrionario</tspan></text><rect x="502.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">SEMANA 9 AL PARTO</tspan></text><text x="615.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">Fetal</tspan></text><rect x="732.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">ALREDEDOR DEL PARTO</tspan></text><text x="845.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">Perinatal</tspan></text><rect x="339.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="385.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="385.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="214.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="155.0" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">TODO O NADA</tspan></text><text x="155.0" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Muere o sigue sano</tspan></text><rect x="278.0" y="349.0" width="214.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="385.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">ORGANOGÉNESIS</tspan></text><text x="385.0" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Malformaciones mayores</tspan><tspan x="385.0" dy="17">Este caso</tspan></text><rect x="508.0" y="349.0" width="214.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">CRECIMIENTO</tspan></text><text x="615.0" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Defectos funcionales</tspan></text><rect x="738.0" y="349.0" width="214.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">ADAPTACIÓN</tspan></text><text x="845.0" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">No es del desarrollo</tspan></text><text x="40.0" y="480.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="490.2" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="512.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="512.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fetal</tspan></text><rect x="363.0" y="493.2" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="512.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Embrionario</tspan></text><text x="585.0" y="512.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Preimplantación</tspan></text><text x="735.0" y="512.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Teratogénico</tspan></text><text x="885.0" y="512.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Perinatal</tspan></text><rect x="40.0" y="527.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="527.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="556.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Período?</tspan></text><text x="285.0" y="556.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: desde la semana 9</tspan></text><text x="435.0" y="556.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: organogénesis</tspan></text><text x="585.0" y="548.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: semanas 1-2, todo</tspan><tspan x="585.0" dy="16">o nada</tspan></text><text x="735.0" y="548.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No es un período, es</tspan><tspan x="735.0" dy="16">un efecto</tspan></text><text x="885.0" y="556.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: alrededor del parto</tspan></text><rect x="40.0" y="490.2" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="601.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="629.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="651.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Semanas 1-2: «todo o nada» (muere o sigue sano).</tspan><tspan x="58.0" dy="18">• Semanas 3-8: malformaciones estructurales.</tspan><tspan x="58.0" dy="18">• Desde la semana 9 (fetal): crecimiento; defectos funcionales o de tamaño.</tspan></text><text x="58.0" y="709.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Moore, Embriología clínica (11.ª ed.); Langman (15.ª ed.).</tspan></text></svg>