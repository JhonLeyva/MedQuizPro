<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1178" viewBox="0 0 1000 1178" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Masa testicular sólida e indolora: marcadores tumorales y orquiectomía radical inguinal"><title>Masa testicular sólida e indolora: marcadores tumorales y orquiectomía radical inguinal</title><rect x="0.75" y="0.75" width="998.5" height="1177.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Urología · cáncer testicular</tspan></text><rect x="360.6" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="424.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="424.3" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Masa testicular</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">En un varón joven, una masa sólida intratesticular es cáncer germinal hasta demostrar lo</tspan><tspan x="58.0" dy="17">contrario.</tspan><tspan x="58.0" dy="17">Se diagnostica y trata a la vez con la orquiectomía radical por vía inguinal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 25 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">1 mes de aumento del testículo derecho, indoloro.</tspan><tspan x="640.0" dy="16">Masa firme que no transilumina; eco: masa sólida</tspan><tspan x="640.0" dy="16">intratesticular.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#94a3b8"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="395.0" x2="733.5" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#0f766e"/><rect x="176.9" y="404.0" width="179.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="266.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No: quística o fuera del testículo</tspan></text><rect x="721.4" y="404.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="733.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿La ecografía muestra una masa sólida dentro del testículo?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Benigna probable</tspan></text><text x="266.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Hidrocele, espermatocele, quiste</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="733.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">MARCADORES + ORQUIECTOMÍA RADICAL INGUINAL</tspan></text><text x="733.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">AFP, β-hCG y LDH antes de operar</tspan><tspan x="733.5" dy="17">Nunca biopsia ni vía escrotal</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="573.5" width="298.0" height="294.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="583.5" width="230.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="597.5" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="256"><tspan x="61.0" dy="0">TESTÍCULOS DEL PACIENTE (ESQUEMA)</tspan></text><g data-box="54.0 611.5 270.0 232.0"><g transform="translate(64.0,611.5) scale(1.0)"><path d="M40 70 C30 150 70 210 130 212 C190 210 230 150 220 70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M130 76 L130 206" fill="none" stroke="#e9b48f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M70 10 L86 74 M190 10 L174 74" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="48" y="14" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">conducto inguinal</text><text x="8" y="226" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="252" y="226" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text><ellipse cx="88" cy="140" rx="30" ry="40" fill="#fde7f3" stroke="#9d174d" stroke-width="2" /><path d="M74 124 C82 110 104 114 106 132 C108 150 92 160 80 152 C70 146 68 134 74 124 Z" fill="#78716c" stroke="#44403c" stroke-width="1.5" stroke-linejoin="round" /><text x="88" y="196" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">masa sólida</text><text x="88" y="196" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">masa sólida</text><ellipse cx="172" cy="140" rx="30" ry="40" fill="#fde7f3" stroke="#9d174d" stroke-width="2" /></g></g><rect x="360.0" y="573.5" width="600.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="378.0" cy="589.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="378.0" y="593.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="378.0" dy="0">1</tspan></text><text x="396.0" y="593.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="556"><tspan x="396.0" dy="0">Masa sólida en el testículo derecho (en el dibujo, a la izquierda).</tspan></text><rect x="360.0" y="611.5" width="600.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="378.0" cy="627.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="378.0" y="631.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="378.0" dy="0">2</tspan></text><text x="396.0" y="631.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="556"><tspan x="396.0" dy="0">Firme, indolora, no transilumina.</tspan></text><rect x="360.0" y="649.5" width="600.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="378.0" cy="665.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="378.0" y="669.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="378.0" dy="0">3</tspan></text><text x="396.0" y="669.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="556"><tspan x="396.0" dy="0">Se saca todo el testículo con su cordón por la ingle.</tspan></text><text x="40.0" y="907.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="917.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="948.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="920.5" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="940.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Marcadores +</tspan><tspan x="303.8" dy="17">orquiectomía inguinal</tspan></text><text x="491.2" y="948.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Biopsia con aguja fina</tspan></text><text x="678.8" y="948.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Serología para Brucella</tspan></text><text x="866.2" y="948.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Antibióticos y reevaluar</tspan></text><rect x="40.0" y="971.5" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="971.5" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="992.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="992.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Ninguno</tspan></text><text x="491.2" y="992.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Siembra el tumor</tspan></text><text x="678.8" y="992.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No hay infección</tspan></text><text x="866.2" y="992.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Retrasa el diagnóstico</tspan></text><rect x="40.0" y="917.5" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1029.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1057.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1079.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Masa sólida intratesticular: marcadores (AFP, β-hCG, LDH) y orquiectomía radical inguinal.</tspan><tspan x="58.0" dy="18">• Nunca biopsia ni cirugía por el escroto: se siembra el tumor en otras vías linfáticas.</tspan><tspan x="58.0" dy="18">• Los antibióticos o la serología no tienen lugar sin signos de infección.</tspan></text><text x="58.0" y="1137.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EAU, guías de urología (2024), cáncer testicular; NCCN.</tspan></text></svg>