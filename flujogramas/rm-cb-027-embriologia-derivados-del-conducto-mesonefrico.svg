<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1131" viewBox="0 0 1000 1131" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sin conducto mesonéfrico faltan el riñón, el uréter y la vesícula seminal"><title>Sin conducto mesonéfrico faltan el riñón, el uréter y la vesícula seminal</title><rect x="0.75" y="0.75" width="998.5" height="1129.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Embriología · derivados del conducto mesonéfrico</tspan></text><rect x="498.7" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="570.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="570.7" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Conducto mesonéfrico (de Wolff)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estructura clave del aparato urogenital.</tspan><tspan x="58.0" dy="17">De su porción distal nace la yema ureteral.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Agenesia unilateral</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Uno de los conductos mesonéfricos no se desarrolla.</tspan><tspan x="640.0" dy="16">¿Qué estructuras faltan?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="577.8" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="577.8" y1="255.0" x2="577.8" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="572.8,283.0 582.8,283.0 577.8,291.0" fill="#94a3b8"/><line x1="577.8" y1="349.0" x2="577.8" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="379.0" x2="811.3" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="379.0" x2="344.3" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,407.0 349.3,407.0 344.3,415.0" fill="#94a3b8"/><line x1="811.3" y1="379.0" x2="811.3" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,407.0 816.3,407.0 811.3,415.0" fill="#94a3b8"/><line x1="344.3" y1="505.5" x2="344.3" y2="535.5" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="535.5" x2="344.3" y2="564.5" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,563.5 349.3,563.5 344.3,571.5" fill="#94a3b8"/><line x1="344.3" y1="629.5" x2="344.3" y2="659.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="659.5" x2="500.0" y2="659.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="659.5" x2="188.7" y2="688.5" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,687.5 193.7,687.5 188.7,695.5" fill="#94a3b8"/><line x1="500.0" y1="659.5" x2="500.0" y2="688.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,687.5 505.0,687.5 500.0,695.5" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="577.8" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="577.8" y1="255.0" x2="577.8" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="572.8,283.0 582.8,283.0 577.8,291.0" fill="#0f766e"/><line x1="577.8" y1="349.0" x2="577.8" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="379.0" x2="811.3" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="379.0" x2="344.3" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,407.0 349.3,407.0 344.3,415.0" fill="#0f766e"/><line x1="811.3" y1="379.0" x2="811.3" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="806.3,407.0 816.3,407.0 811.3,415.0" fill="#0f766e"/><line x1="344.3" y1="505.5" x2="344.3" y2="535.5" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="535.5" x2="344.3" y2="564.5" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,563.5 349.3,563.5 344.3,571.5" fill="#0f766e"/><line x1="344.3" y1="629.5" x2="344.3" y2="659.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="659.5" x2="344.3" y2="659.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="659.5" x2="188.7" y2="688.5" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,687.5 193.7,687.5 188.7,695.5" fill="#0f766e"/><rect x="286.2" y="388.0" width="116.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="344.3" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="344.3" dy="0">De su porción distal</tspan></text><rect x="722.6" y="388.0" width="177.5" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="811.3" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Del propio conducto en el varón</tspan></text><rect x="94.5" y="668.5" width="188.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="681.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Uréter, pelvis, cálices y colectores</tspan></text><rect x="432.4" y="668.5" width="135.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="681.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Nefronas (del blastema)</tspan></text><polygon points="317.8,320.0 343.8,291.0 811.8,291.0 837.8,320.0 811.8,349.0 343.8,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="363.8" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="363.8" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="363.8" dy="0">?</tspan></text><text x="596.8" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="596.8" dy="0">Conducto mesonéfrico (de Wolff) ausente</tspan></text><rect x="84.3" y="415.0" width="520.0" height="90.5" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><text x="344.3" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="492"><tspan x="344.3" dy="0">YEMA URETERAL</tspan></text><text x="344.3" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="492"><tspan x="344.3" dy="0">Induce al blastema metanéfrico</tspan></text><rect x="84.3" y="415.0" width="520.0" height="90.5" rx="10" fill="none" stroke="#0f766e" stroke-width="2.2"/><polygon points="84.3,600.5 110.3,571.5 578.3,571.5 604.3,600.5 578.3,629.5 110.3,629.5" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="130.3" cy="600.5" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="130.3" y="605.5" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="130.3" dy="0">?</tspan></text><text x="363.3" y="605.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="363.3" dy="0">¿Qué origina la yema?</tspan></text><rect x="40.0" y="695.5" width="297.3" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="723.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">RIÑÓN Y URÉTER</tspan></text><text x="188.7" y="746.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Sin yema: agenesia renal</tspan></text><rect x="351.3" y="695.5" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="723.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Dependen de la inducción</tspan></text><text x="500.0" y="746.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Sin yema, no se forman</tspan></text><rect x="662.7" y="415.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="811.3" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">ESTRUCTURAS GENITALES</tspan></text><text x="811.3" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Epidídimo, deferente</tspan><tspan x="811.3" dy="17">Vesícula seminal y eyaculador</tspan></text><text x="40.0" y="808.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="818.9" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="858.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="821.9" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="849.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Riñones, uréteres y</tspan><tspan x="285.0" dy="17">vesícula seminal</tspan></text><text x="435.0" y="841.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Riñones, colon</tspan><tspan x="435.0" dy="17">transverso y</tspan><tspan x="435.0" dy="17">descendente</tspan></text><text x="585.0" y="849.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Páncreas, riñones y</tspan><tspan x="585.0" dy="17">vesícula seminal</tspan></text><text x="735.0" y="849.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Uretra, recto y</tspan><tspan x="735.0" dy="17">vesícula seminal</tspan></text><text x="885.0" y="841.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Recto, colon</tspan><tspan x="885.0" dy="17">transverso y</tspan><tspan x="885.0" dy="17">descendente</tspan></text><rect x="40.0" y="889.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="889.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="918.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué falta?</tspan></text><text x="285.0" y="910.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: riñón (yema), uréter</tspan><tspan x="285.0" dy="16">y vesícula seminal</tspan></text><text x="435.0" y="910.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el colon no</tspan><tspan x="435.0" dy="16">depende del conducto</tspan></text><text x="585.0" y="910.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el páncreas deriva</tspan><tspan x="585.0" dy="16">del intestino</tspan></text><text x="735.0" y="910.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la uretra y el recto</tspan><tspan x="735.0" dy="16">no son derivados</tspan></text><text x="885.0" y="910.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: recto y colon</tspan><tspan x="885.0" dy="16">derivan del intestino</tspan></text><rect x="40.0" y="818.9" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="963.9" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="991.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1013.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Yema ureteral: induce al blastema metanéfrico y forma uréter, pelvis, cálices y túbulos colectores; sin yema no hay riñón.</tspan><tspan x="58.0" dy="18">• En el varón, bajo la testosterona, el conducto da epidídimo, deferente, vesícula seminal y conducto eyaculador.</tspan><tspan x="58.0" dy="18">• Alerta: la agenesia renal unilateral con ausencia del deferente o de la vesícula seminal obliga a buscar el defecto del conducto mesonéfrico.</tspan><tspan x="58.0" dy="18">• Páncreas, colon y recto derivan del intestino (endodermo) y no dependen de este conducto; la uretra viene del seno urogenital.</tspan></text><text x="58.0" y="1089.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Langman Embriología Médica 14.ª ed.; Moore Embriología Clínica 11.ª ed.</tspan></text></svg>