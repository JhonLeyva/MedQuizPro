<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="979" viewBox="0 0 1000 979" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El diencéfalo deriva del prosencéfalo, junto con el telencéfalo"><title>El diencéfalo deriva del prosencéfalo, junto con el telencéfalo</title><rect x="0.75" y="0.75" width="998.5" height="977.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Embriología · vesículas encefálicas</tspan></text><rect x="409.2" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="481.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="481.1" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vesículas encefálicas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">En la 4.ª semana: prosencéfalo, mesencéfalo y rombencéfalo.</tspan><tspan x="58.0" dy="17">En la 5.ª semana se subdividen en cinco vesículas secundarias.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿A qué segmento del encéfalo corresponde el</tspan><tspan x="640.0" dy="16">diencéfalo?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LAS VESÍCULAS PRIMARIAS A LAS SECUNDARIAS</tspan></text><rect x="40.0" y="293.0" width="300.0" height="54.0" rx="0" fill="#fbe38e" stroke="#ffffff" stroke-width="2"/><rect x="40" y="293.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="318.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Prosencéfalo</tspan></text><text x="54.0" y="334.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Telencéfalo</tspan></text><rect x="376.0" y="295.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="313.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Hemisferios, cuerpo estriado, ventrículos laterales</tspan></text><text x="388.0" y="329.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Forma la corteza y los ganglios basales.</tspan></text><rect x="40.0" y="347.0" width="300.0" height="54.0" rx="0" fill="#f5b8a2" stroke="#ffffff" stroke-width="2"/><rect x="40" y="347.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="372.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Prosencéfalo</tspan></text><text x="54.0" y="388.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Diencéfalo</tspan></text><text x="328.0" y="378.0" font-size="11" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="end" data-max="96"><tspan x="328.0" dy="0">◄ llega aquí</tspan></text><rect x="376.0" y="349.0" width="584.0" height="50.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="388.0" y="367.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Tálamo, hipotálamo, epitálamo, neurohipófisis</tspan></text><text x="388.0" y="383.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Cavidad: tercer ventrículo; da origen a las vesículas ópticas.</tspan></text><rect x="40.0" y="401.0" width="300.0" height="54.0" rx="0" fill="#fbd5c4" stroke="#ffffff" stroke-width="2"/><text x="54.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Mesencéfalo</tspan></text><text x="54.0" y="442.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Mesencéfalo</tspan></text><rect x="376.0" y="403.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="421.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Techo y pedúnculos cerebrales</tspan></text><text x="388.0" y="437.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Conserva el acueducto de Silvio y no se divide.</tspan></text><rect x="40.0" y="455.0" width="300.0" height="54.0" rx="0" fill="#e89c84" stroke="#ffffff" stroke-width="2"/><text x="54.0" y="480.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Rombencéfalo</tspan></text><text x="54.0" y="496.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Metencéfalo y mielencéfalo</tspan></text><rect x="376.0" y="457.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="475.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Protuberancia, cerebelo y bulbo</tspan></text><text x="388.0" y="491.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Cavidad: cuarto ventrículo.</tspan></text><line x1="346.0" y1="299.0" x2="346.0" y2="503.0" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="346.0" y1="499.0" x2="346.0" y2="494.0" stroke="#b91c1c" stroke-width="2.2"/><polygon points="341.0,494.0 351.0,494.0 346.0,503.0" fill="#b91c1c"/><text x="376.0" y="287.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="584"><tspan x="376.0" dy="0">QUÉ FORMA CADA VESÍCULA</tspan></text><text x="40.0" y="287.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="300"><tspan x="40.0" dy="0">CAPAS (DE SUPERFICIAL A PROFUNDA)</tspan></text><rect x="851.0" y="338.0" width="98.0" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="353.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ DIENCÉFALO</tspan></text><rect x="40.0" y="527.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="553.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Diencéfalo = prosencéfalo</tspan></text><text x="60.0" y="572.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Metencéfalo y mielencéfalo son del rombencéfalo.</tspan></text><text x="40.0" y="639.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="649.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="671.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="671.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Romboencéfalo</tspan></text><rect x="363.0" y="652.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="671.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Prosencéfalo</tspan></text><text x="585.0" y="671.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Mesencéfalo</tspan></text><text x="735.0" y="671.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Metencéfalo</tspan></text><text x="885.0" y="671.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Mielencéfalo</tspan></text><rect x="40.0" y="686.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="686.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="715.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Segmento del</tspan><tspan x="54.0" dy="16">diencéfalo?</tspan></text><text x="285.0" y="707.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: origina el</tspan><tspan x="285.0" dy="16">metencéfalo y el</tspan><tspan x="285.0" dy="16">mielencéfalo</tspan></text><text x="435.0" y="715.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: prosencéfalo, con</tspan><tspan x="435.0" dy="16">telencéfalo</tspan></text><text x="585.0" y="715.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se llama igual y no</tspan><tspan x="585.0" dy="16">se divide</tspan></text><text x="735.0" y="715.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es parte del</tspan><tspan x="735.0" dy="16">rombencéfalo</tspan></text><text x="885.0" y="715.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es parte del</tspan><tspan x="885.0" dy="16">rombencéfalo</tspan></text><rect x="40.0" y="649.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="776.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="804.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="826.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Prosencéfalo: telencéfalo (hemisferios, cuerpo estriado, ventrículos laterales) y diencéfalo (tálamo, hipotálamo, epitálamo, subtálamo, neurohipófisis,</tspan><tspan x="58.0" dy="18">   vesículas ópticas).</tspan><tspan x="58.0" dy="18">• Mesencéfalo: no se divide y conserva el acueducto de Silvio. Rombencéfalo: metencéfalo (protuberancia y cerebelo) y mielencéfalo (bulbo), con el cuarto</tspan><tspan x="58.0" dy="18">   ventrículo.</tspan><tspan x="58.0" dy="18">• Cavidad del diencéfalo: tercer ventrículo.</tspan><tspan x="58.0" dy="18">• Clínica: falla en el cierre del prosencéfalo produce holoprosencefalia (trisomías 13 y 18, gen SHH, diabetes materna), con ciclopía y labio hendido.</tspan></text><text x="58.0" y="938.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Langman, Embriología médica 14.ª ed. (2019); Moore, Embriología clínica 11.ª ed. (2020).</tspan></text></svg>