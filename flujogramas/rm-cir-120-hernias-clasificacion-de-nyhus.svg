<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1071" viewBox="0 0 1000 1071" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hernia inguinal indirecta con ciego en el saco: Nyhus IIIB"><title>Hernia inguinal indirecta con ciego en el saco: Nyhus IIIB</title><rect x="0.75" y="0.75" width="998.5" height="1069.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hernias · clasificación de Nyhus</tspan></text><rect x="390.7" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="433.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="433.9" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Clasificación de Nyhus</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ordena las hernias inguinales según el anillo interno y la pared posterior.</tspan><tspan x="58.0" dy="17">Los tipos III y IV indican un defecto de la pared posterior o recidiva.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 45 años, hernia inguinal derecha</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Saco lateral a los vasos epigástricos con el ciego como</tspan><tspan x="640.0" dy="16">contenido.</tspan><tspan x="640.0" dy="16">¿Qué tipo de Nyhus es?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS TIPOS DE NYHUS Y QUÉ HERNIA ES CADA UNO</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="110"><tspan x="54.0" dy="0">TIPO DE NYHUS</tspan></text><text x="367.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="375"><tspan x="367.5" dy="0">Hernia</tspan></text><text x="762.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="375"><tspan x="762.5" dy="0">Anillo interno y pared posterior</tspan></text><rect x="40.0" y="325.0" width="124.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">I</tspan></text><text x="54.0" y="368.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">Niños</tspan></text><rect x="173.0" y="325.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="185.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">Indirecta</tspan></text><text x="185.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">En niños</tspan></text><rect x="568.0" y="325.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="580.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Anillo normal</tspan></text><text x="580.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Pared posterior sana</tspan></text><rect x="40.0" y="388.0" width="124.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="414.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">II</tspan></text><text x="54.0" y="431.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">Indirecta</tspan></text><rect x="173.0" y="388.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="185.0" y="413.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">Indirecta</tspan></text><text x="185.0" y="429.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">Anillo dilatado</tspan></text><rect x="568.0" y="388.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="580.0" y="413.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Pared posterior intacta</tspan></text><text x="580.0" y="429.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Anillo ensanchado</tspan></text><rect x="40.0" y="451.0" width="124.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="477.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">IIIA</tspan></text><text x="54.0" y="494.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">Directa</tspan></text><rect x="173.0" y="451.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="185.0" y="476.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">Directa</tspan></text><text x="185.0" y="492.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">Triángulo de Hesselbach</tspan></text><rect x="568.0" y="451.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="580.0" y="476.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Pared posterior débil</tspan></text><text x="580.0" y="492.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Medial a los epigástricos</tspan></text><rect x="40.0" y="514.0" width="124.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="540.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">IIIB</tspan></text><text x="54.0" y="557.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">Deslizada</tspan></text><rect x="173.0" y="514.0" width="389.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="185.0" y="539.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">Indirecta grande o deslizada</tspan></text><text x="185.0" y="555.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">Pantalón o contenido en el saco</tspan></text><rect x="461.2" y="503.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="506.6" y="518.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="506.6" dy="0">◆ ESTE CASO</tspan></text><rect x="568.0" y="514.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="580.0" y="539.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Pared posterior invadida</tspan></text><text x="580.0" y="555.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Anillo muy dilatado: este caso</tspan></text><rect x="40.0" y="577.0" width="124.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="603.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">IIIC</tspan></text><text x="54.0" y="620.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">Femoral</tspan></text><rect x="173.0" y="577.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="185.0" y="602.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">Femoral</tspan></text><text x="185.0" y="618.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">Bajo el ligamento inguinal</tspan></text><rect x="568.0" y="577.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="580.0" y="602.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Defecto del canal femoral</tspan></text><text x="580.0" y="618.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Por dentro de la vena femoral</tspan></text><rect x="40.0" y="640.0" width="124.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="666.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">IV</tspan></text><text x="54.0" y="683.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="54.0" dy="0">Recidiva</tspan></text><rect x="173.0" y="640.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="185.0" y="665.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">Recidivada</tspan></text><text x="185.0" y="681.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="185.0" dy="0">A directa, B indirecta, C femoral, D mixta</tspan></text><rect x="568.0" y="640.0" width="389.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="580.0" y="665.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Defecto tras cirugía previa</tspan></text><text x="580.0" y="681.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="371"><tspan x="580.0" dy="0">Malla o sutura fallida</tspan></text><text x="44.0" y="719.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">El saco lateral a los vasos epigástricos es indirecto; si contiene el ciego es IIIB.</tspan></text><text x="40.0" y="767.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="777.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="799.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="799.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">II</tspan></text><text x="435.0" y="799.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">IV</tspan></text><text x="585.0" y="799.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">III</tspan></text><rect x="663.0" y="780.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="799.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">IIIB</tspan></text><text x="885.0" y="799.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">IIIA</tspan></text><rect x="40.0" y="814.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="814.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="851.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Nyhus?</tspan></text><text x="285.0" y="835.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el anillo dilatado</tspan><tspan x="285.0" dy="16">sin pared posterior</tspan><tspan x="285.0" dy="16">dañada</tspan></text><text x="435.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es la hernia</tspan><tspan x="435.0" dy="16">recidivada</tspan></text><text x="585.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el III es el grupo,</tspan><tspan x="585.0" dy="16">falta el subtipo</tspan></text><text x="735.0" y="835.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: indirecta con pared</tspan><tspan x="735.0" dy="16">posterior dañada</tspan><tspan x="735.0" dy="16">(deslizada)</tspan></text><text x="885.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: IIIA es la hernia</tspan><tspan x="885.0" dy="16">directa</tspan></text><rect x="40.0" y="777.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="904.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="932.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="954.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Saco lateral a los epigástricos = indirecta; el ciego en el saco es una hernia deslizada, con la pared posterior dañada.</tspan><tspan x="58.0" dy="18">• Nyhus: I indirecta con anillo normal; II indirecta con anillo dilatado; III defecto posterior (A directa, B indirecta grande o deslizada, C femoral); IV recidiva.</tspan><tspan x="58.0" dy="18">• En la deslizada el órgano forma parte del saco: no se reseca el ciego, se reduce con cuidado y se refuerza la pared.</tspan><tspan x="58.0" dy="18">• Reparación con malla sin tensión, abierta (Lichtenstein) o laparoscópica (TEP o TAPP) según la guía HerniaSurge 2018.</tspan></text><text x="58.0" y="1030.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: HerniaSurge, hernia inguinal (2018); Nyhus, Hernia 1993; Schwartz Principios de Cirugía 11.ª ed.</tspan></text></svg>