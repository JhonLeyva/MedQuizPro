<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1024" viewBox="0 0 1000 1024" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hernia inguinal indirecta con ciego en el saco: Nyhus IIIB"><title>Hernia inguinal indirecta con ciego en el saco: Nyhus IIIB</title><rect x="0.75" y="0.75" width="998.5" height="1022.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hernias · clasificación de Nyhus</tspan></text><rect x="390.7" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="433.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="433.9" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Clasificación de Nyhus</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ordena las hernias inguinales según el anillo interno y la pared posterior.</tspan><tspan x="58.0" dy="17">Los tipos III y IV indican un defecto de la pared posterior o recidiva.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 45 años, hernia inguinal derecha</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Saco lateral a los vasos epigástricos con el ciego como</tspan><tspan x="640.0" dy="16">contenido.</tspan><tspan x="640.0" dy="16">¿Qué tipo de Nyhus es?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="261.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="287.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Saco lateral a los epigástricos con el ciego = Nyhus IIIB</tspan></text><text x="60.0" y="306.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hernia indirecta grande o deslizada: pared posterior invadida; se repara con malla.</tspan></text><text x="40.0" y="367.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE NYHUS DE LA HERNIA INGUINAL</tspan></text><rect x="40.0" y="379.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="200.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Hernia</tspan></text><text x="456.7" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Anillo interno y pared posterior</tspan></text><text x="713.3" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Técnica</tspan></text><rect x="40.0" y="408.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">I</tspan></text><text x="200.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Indirecta</tspan></text><text x="456.7" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Anillo interno normal; pared posterior</tspan><tspan x="456.7" dy="15">intacta</tspan></text><text x="713.3" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Ligadura alta del saco (niño) o reparación</tspan><tspan x="713.3" dy="15">con malla</tspan></text><rect x="40.0" y="452.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="471.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">II</tspan></text><text x="200.0" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Indirecta</tspan></text><text x="456.7" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Anillo interno dilatado; pared posterior</tspan><tspan x="456.7" dy="15">intacta</tspan></text><text x="713.3" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Reparación con malla</tspan></text><rect x="40.0" y="496.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="515.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">IIIA</tspan></text><text x="200.0" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Directa</tspan></text><text x="456.7" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Defecto de la pared posterior (cualquier</tspan><tspan x="456.7" dy="15">tamaño)</tspan></text><text x="713.3" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Malla</tspan></text><rect x="40.0" y="540.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">IIIB</tspan></text><text x="200.0" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Indirecta grande, en pantalón o deslizada</tspan></text><text x="456.7" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Anillo muy dilatado que invade la pared</tspan><tspan x="456.7" dy="15">posterior</tspan></text><text x="713.3" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Malla</tspan></text><rect x="90.6" y="551.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="136.0" y="566.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="136.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="584.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="603.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">IIIC</tspan></text><text x="200.0" y="603.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Femoral</tspan></text><text x="456.7" y="603.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Defecto bajo el ligamento inguinal</tspan></text><text x="713.3" y="603.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Malla (abordaje inguinal o preperitoneal)</tspan></text><rect x="40.0" y="613.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="632.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">IVA-D</tspan></text><text x="200.0" y="632.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Recurrente: directa (A), indirecta (B),</tspan><tspan x="200.0" dy="15">femoral (C) o mixta (D)</tspan></text><text x="456.7" y="632.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Recidiva tras reparación previa</tspan></text><text x="713.3" y="632.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Malla, preferible por abordaje distinto al</tspan><tspan x="713.3" dy="15">previo</tspan></text><text x="40.0" y="673.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Clasificación de Nyhus (1993); la EHS la reemplazó por L/M/F con tamaño 0-3. Reparación con malla según HerniaSurge.</tspan></text><text x="40.0" y="720.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="730.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="752.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="752.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">II</tspan></text><text x="435.0" y="752.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">IV</tspan></text><text x="585.0" y="752.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">III</tspan></text><rect x="663.0" y="733.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="752.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">IIIB</tspan></text><text x="885.0" y="752.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">IIIA</tspan></text><rect x="40.0" y="767.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="767.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="804.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Nyhus?</tspan></text><text x="285.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el anillo dilatado</tspan><tspan x="285.0" dy="16">sin pared posterior</tspan><tspan x="285.0" dy="16">dañada</tspan></text><text x="435.0" y="796.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es la hernia</tspan><tspan x="435.0" dy="16">recidivada</tspan></text><text x="585.0" y="796.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el III es el grupo,</tspan><tspan x="585.0" dy="16">falta el subtipo</tspan></text><text x="735.0" y="788.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: indirecta con pared</tspan><tspan x="735.0" dy="16">posterior dañada</tspan><tspan x="735.0" dy="16">(deslizada)</tspan></text><text x="885.0" y="796.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: IIIA es la hernia</tspan><tspan x="885.0" dy="16">directa</tspan></text><rect x="40.0" y="730.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="857.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="885.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="907.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Saco lateral a los epigástricos = indirecta; el ciego en el saco es una hernia deslizada, con la pared posterior dañada.</tspan><tspan x="58.0" dy="18">• Nyhus: I indirecta con anillo normal; II indirecta con anillo dilatado; III defecto posterior (A directa, B indirecta grande o deslizada, C femoral); IV recidiva.</tspan><tspan x="58.0" dy="18">• En la deslizada el órgano forma parte del saco: no se reseca el ciego, se reduce con cuidado y se refuerza la pared.</tspan><tspan x="58.0" dy="18">• Reparación con malla sin tensión, abierta (Lichtenstein) o laparoscópica (TEP o TAPP) según la guía HerniaSurge 2018.</tspan></text><text x="58.0" y="983.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: HerniaSurge, hernia inguinal (Hernia 2018; actualización BJS Open 2023); Nyhus, Surgery 1993;114:1-2; Schwartz Principios de Cirugía 11.ª ed.</tspan></text></svg>