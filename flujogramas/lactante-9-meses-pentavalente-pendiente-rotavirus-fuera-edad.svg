<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="908" viewBox="0 0 1000 908" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante de 9 meses al que le falta la 3.ª dosis de pentavalente y la 2.ª de rotavirus: solo se aplica la pentavalente, porque la edad del rotavirus ya pasó"><title>Lactante de 9 meses al que le falta la 3.ª dosis de pentavalente y la 2.ª de rotavirus: solo se aplica la pentavalente, porque la edad del rotavirus ya pasó</title><rect x="0.75" y="0.75" width="998.5" height="906.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Inmunizaciones · esquema atrasado</tspan></text><rect x="413.3" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="469.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="469.8" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vacunas atrasadas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Regla general: no se reinicia el esquema; se completa la dosis que falta respetando los</tspan><tspan x="58.0" dy="17">intervalos.</tspan><tspan x="58.0" dy="17">Excepción: el rotavirus tiene edad máxima (la 2.ª dosis no se aplica después de los 8</tspan><tspan x="58.0" dy="17">meses por riesgo de invaginación).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 9 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Le falta la 3.ª dosis de pentavalente.</tspan><tspan x="640.0" dy="16">Solo tiene 1 dosis de rotavirus.</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS VACUNAS DE ESTE LACTANTE</tspan></text><rect x="40.0" y="282.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="134"><tspan x="52.0" dy="0">VACUNA</tspan></text><text x="256.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="256.0" dy="0">2 meses</tspan></text><text x="388.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="388.0" dy="0">4 meses</tspan></text><text x="520.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="520.0" dy="0">6 meses</tspan></text><text x="652.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="652.0" dy="0">Hoy (9 m)</tspan></text><text x="734.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="220"><tspan x="734.0" dy="0">REGLA</tspan></text><rect x="588.0" y="318.0" width="128.0" height="118.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><rect x="40.0" y="322.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="352.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Pentavalente</tspan></text><line x1="198.0" y1="348.0" x2="710.0" y2="348.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="256.0" cy="343.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="256.0" y="347.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">✓</tspan></text><text x="256.0" y="370.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="256.0" dy="0">1.ª</tspan></text><circle cx="388.0" cy="343.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="388.0" y="347.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">✓</tspan></text><text x="388.0" y="370.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="388.0" dy="0">2.ª</tspan></text><circle cx="652.0" cy="343.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="652.0" y="347.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="652.0" dy="0">!</tspan></text><text x="652.0" y="370.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="128"><tspan x="652.0" dy="0">3.ª</tspan></text><rect x="730.0" y="322.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="344.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Se completa a cualquier edad (&lt; 5</tspan><tspan x="740.0" dy="15">años); no se reinicia.</tspan></text><rect x="40.0" y="380.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="410.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Rotavirus</tspan></text><line x1="198.0" y1="406.0" x2="710.0" y2="406.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="256.0" cy="401.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="256.0" y="405.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">✓</tspan></text><text x="256.0" y="428.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="256.0" dy="0">1.ª</tspan></text><circle cx="652.0" cy="401.0" r="13" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="2"/><text x="652.0" y="405.5" font-size="12" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="652.0" dy="0">✕</tspan></text><text x="652.0" y="428.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="652.0" dy="0">2.ª</tspan></text><rect x="730.0" y="380.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="402.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Edad máxima: 8 meses. Después ya no</tspan><tspan x="740.0" dy="15">se aplica.</tspan></text><rect x="599.8" y="307.0" width="104.3" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="652.0" y="322.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="652.0" dy="0">◆ HOY: 9 MESES</tspan></text><text x="44.0" y="452.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ dada · ! aplicar ahora · ✕ ya no corresponde (pasó la edad)</tspan></text><rect x="40.0" y="476.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="502.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Solo la 3.ª dosis de pentavalente</tspan></text><text x="60.0" y="521.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El rotavirus fuera de edad no se aplica.</tspan></text><text x="40.0" y="588.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="598.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="637.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="601.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="620.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Solamente</tspan><tspan x="285.0" dy="17">pentavalente la</tspan><tspan x="285.0" dy="17">tercera dosis</tspan></text><text x="435.0" y="620.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">La dosis faltante de</tspan><tspan x="435.0" dy="17">pentavalente y de</tspan><tspan x="435.0" dy="17">rotavirus</tspan></text><text x="585.0" y="629.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Iniciar nuevo</tspan><tspan x="585.0" dy="17">esquema completo</tspan></text><text x="735.0" y="629.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Solamente la dosis</tspan><tspan x="735.0" dy="17">faltante de rotavirus</tspan></text><text x="885.0" y="629.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Solo la dosis</tspan><tspan x="885.0" dy="17">faltante de rotavirus</tspan></text><rect x="40.0" y="669.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="669.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="706.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Recomendación?</tspan></text><text x="285.0" y="698.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: pentavalente sí,</tspan><tspan x="285.0" dy="16">rotavirus ya no</tspan></text><text x="435.0" y="698.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: rotavirus fuera de</tspan><tspan x="435.0" dy="16">edad</tspan></text><text x="585.0" y="706.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no se reinicia</tspan></text><text x="735.0" y="690.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: falta la</tspan><tspan x="735.0" dy="16">pentavalente y</tspan><tspan x="735.0" dy="16">rotavirus ya no</tspan></text><text x="885.0" y="690.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: falta la</tspan><tspan x="885.0" dy="16">pentavalente y</tspan><tspan x="885.0" dy="16">rotavirus ya no</tspan></text><rect x="40.0" y="598.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="759.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="787.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="809.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pentavalente: aplicar la 3.ª dosis ahora (se completa hasta los 4 años 11 meses) y los refuerzos DPT a los 18 meses y 4 años.</tspan><tspan x="58.0" dy="18">• Rotavirus: con 9 meses ya no se pone; no se reinicia.</tspan><tspan x="58.0" dy="18">• Aprovechar la visita para revisar las demás vacunas (neumococo, polio, influenza, SPR a los 12 meses).</tspan></text><text x="58.0" y="867.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, NTS n.º 196 del Esquema Nacional de Vacunación (2022; act.); OMS.</tspan></text></svg>