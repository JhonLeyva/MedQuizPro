<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1202" viewBox="0 0 1000 1202" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Con dos reanimadores en un niño de 8 años la relación compresión-ventilación es 15:2"><title>Con dos reanimadores en un niño de 8 años la relación compresión-ventilación es 15:2</title><rect x="0.75" y="0.75" width="998.5" height="1200.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · reanimación cardiopulmonar</tspan></text><rect x="433.8" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="482.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="482.8" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">RCP pediátrica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La parada del niño suele ser asfíctica: hipoxia, insuficiencia respiratoria o shock.</tspan><tspan x="58.0" dy="17">Por eso la ventilación pesa más que en el adulto.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 8 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dos reanimadores presentes.</tspan><tspan x="640.0" dy="16">¿Qué relación de compresiones y ventilaciones se</tspan><tspan x="640.0" dy="16">usa?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CAMBIA CUANDO LLEGA EL SEGUNDO REANIMADOR</tspan></text><rect x="40.0" y="285.0" width="385.0" height="180.0" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="232.5" y="311.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="365"><tspan x="232.5" dy="0">UN REANIMADOR</tspan></text><text x="56.0" y="341.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Relación</tspan></text><text x="409.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">30:2</tspan></text><line x1="52.0" y1="349.0" x2="413.0" y2="349.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="367.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Compresiones</tspan></text><text x="409.0" y="367.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">30 seguidas</tspan></text><line x1="52.0" y1="375.0" x2="413.0" y2="375.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="393.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Ventilaciones</tspan></text><text x="409.0" y="393.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">2 al final</tspan></text><line x1="52.0" y1="401.0" x2="413.0" y2="401.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="419.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Edad</tspan></text><text x="409.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Lactante, niño y adulto</tspan></text><line x1="52.0" y1="427.0" x2="413.0" y2="427.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="445.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Pausas</tspan></text><text x="409.0" y="445.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Más largas</tspan></text><line x1="52.0" y1="453.0" x2="413.0" y2="453.0" stroke="#ffffff" stroke-width="1.4"/><rect x="575.0" y="285.0" width="385.0" height="180.0" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="767.5" y="311.0" font-size="13" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">DOS REANIMADORES (NIÑO)</tspan></text><text x="591.0" y="341.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Relación</tspan></text><text x="944.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">15:2</tspan></text><line x1="587.0" y1="349.0" x2="948.0" y2="349.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="367.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Compresiones</tspan></text><text x="944.0" y="367.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">15 seguidas</tspan></text><line x1="587.0" y1="375.0" x2="948.0" y2="375.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="393.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Ventilaciones</tspan></text><text x="944.0" y="393.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">2 al final</tspan></text><line x1="587.0" y1="401.0" x2="948.0" y2="401.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="419.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Edad</tspan></text><text x="944.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Hasta la pubertad</tspan></text><line x1="587.0" y1="427.0" x2="948.0" y2="427.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="445.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Pausas</tspan></text><text x="944.0" y="445.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Más cortas</tspan></text><line x1="587.0" y1="453.0" x2="948.0" y2="453.0" stroke="#ffffff" stroke-width="1.4"/><rect x="434.0" y="339.0" width="132.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="365.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="118"><tspan x="500.0" dy="0">Llega un segundo</tspan><tspan x="500.0" dy="16">reanimador</tspan></text><line x1="429.0" y1="431.0" x2="562.0" y2="431.0" stroke="#0f766e" stroke-width="3"/><polygon points="562.0,436.0 562.0,426.0 571.0,431.0" fill="#0f766e"/><rect x="40.0" y="481.0" width="300.0" height="48.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="56.0" y="510.0" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">▲</tspan></text><text x="72.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="72.0" dy="0">Se reduce a 15 el número de compresiones</tspan><tspan x="72.0" dy="15">por ciclo</tspan></text><rect x="350.0" y="481.0" width="300.0" height="48.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="366.0" y="510.0" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="366.0" dy="0">=</tspan></text><text x="382.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="382.0" dy="0">Se mantienen las 2 ventilaciones</tspan></text><rect x="660.0" y="481.0" width="300.0" height="48.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="676.0" y="510.0" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">=</tspan></text><text x="692.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="692.0" dy="0">El recién nacido usa 3:1, no esta relación</tspan></text><rect x="40.0" y="547.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="573.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Niño de 8 años, 2 reanimadores = 15:2</tspan></text><text x="60.0" y="592.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">30:2 es de un solo reanimador; 3:1 es neonatal; 5:1 y 10:1 son antiguos.</tspan></text><text x="40.0" y="653.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RELACIÓN COMPRESIÓN-VENTILACIÓN SEGÚN EDAD Y REANIMADORES</tspan></text><rect x="40.0" y="665.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Situación</tspan></text><text x="310.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Relación</tspan></text><text x="640.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Nota</tspan></text><rect x="40.0" y="694.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Recién nacido en sala de partos</tspan></text><text x="310.0" y="713.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">3:1</tspan></text><text x="640.0" y="713.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Esquema neonatal</tspan></text><rect x="40.0" y="723.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="742.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Un reanimador, cualquier edad</tspan></text><text x="310.0" y="742.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">30:2</tspan></text><text x="640.0" y="742.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Adulto, niño y lactante</tspan></text><rect x="40.0" y="752.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="771.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Dos reanimadores, lactante o niño hasta</tspan><tspan x="50.0" dy="15">la pubertad</tspan></text><text x="310.0" y="771.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">15:2</tspan></text><text x="640.0" y="771.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Caso del examen</tspan></text><rect x="200.6" y="763.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="246.0" y="778.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="246.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="796.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="815.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Vía aérea avanzada colocada</tspan></text><text x="310.0" y="815.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Continua</tspan></text><text x="640.0" y="815.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">100-120 compresiones por minuto y una ventilación cada</tspan><tspan x="640.0" dy="15">2 a 3 segundos</tspan></text><text x="40.0" y="880.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="890.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="912.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="893.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="912.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">15:2</tspan></text><text x="435.0" y="912.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">30:2</tspan></text><text x="585.0" y="912.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">5:1</tspan></text><text x="735.0" y="912.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">3:1</tspan></text><text x="885.0" y="912.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">10:1</tspan></text><rect x="40.0" y="927.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="927.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="956.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Relación con 2</tspan><tspan x="54.0" dy="16">reanimadores?</tspan></text><text x="285.0" y="948.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dos reanimadores</tspan><tspan x="285.0" dy="16">en niño hasta la</tspan><tspan x="285.0" dy="16">pubertad</tspan></text><text x="435.0" y="956.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es la de un solo</tspan><tspan x="435.0" dy="16">reanimador</tspan></text><text x="585.0" y="964.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: esquema antiguo</tspan></text><text x="735.0" y="948.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se usa en el recién</tspan><tspan x="735.0" dy="16">nacido en sala de</tspan><tspan x="735.0" dy="16">partos</tspan></text><text x="885.0" y="964.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: esquema antiguo</tspan></text><rect x="40.0" y="890.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1017.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1045.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1067.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Un reanimador: 30 compresiones por 2 ventilaciones a cualquier edad. Dos reanimadores en lactantes y niños hasta la pubertad: 15 por 2 (AHA 2020).</tspan><tspan x="58.0" dy="18">• El 3:1 es la relación del recién nacido en sala de partos; 5:1 y 10:1 son esquemas antiguos.</tspan><tspan x="58.0" dy="18">• Con vía aérea avanzada: compresiones continuas a 100-120 por minuto y una ventilación cada 2 a 3 segundos; profundidad de un tercio del tórax (unos</tspan><tspan x="58.0" dy="18">   5 cm).</tspan><tspan x="58.0" dy="18">• Alerta: sin pulso, o pulso menor de 60 por minuto con mala perfusión, se inicia compresión sin esperar; la oxigenación es prioridad.</tspan></text><text x="58.0" y="1161.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Topjian AA y cols., Part 4: Pediatric Basic and Advanced Life Support, AHA Guidelines 2020 (Circulation 2020).</tspan></text></svg>