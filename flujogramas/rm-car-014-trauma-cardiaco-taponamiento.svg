<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1104" viewBox="0 0 1000 1104" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El taponamiento pericárdico traumático se caracteriza por pulso paradójico"><title>El taponamiento pericárdico traumático se caracteriza por pulso paradójico</title><rect x="0.75" y="0.75" width="998.5" height="1102.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma cardiaco · taponamiento</tspan></text><rect x="391.4" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="450.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="450.0" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pulso paradójico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Caída de la PA sistólica de más de 10 mmHg durante la inspiración.</tspan><tspan x="58.0" dy="17">El pericardio limita el volumen total del corazón.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cómo se caracteriza el taponamiento traumático?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS SIGNOS DEL TAPONAMIENTO</tspan></text><rect x="40.0" y="253.0" width="470.0" height="418.0" rx="16" fill="#0b1220" stroke="#334155" stroke-width="3"/><rect x="52.0" y="265.0" width="150.0" height="24.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/><text x="62.0" y="282.0" font-size="10.5" font-weight="800" font-style="normal" fill="#5eead4" text-anchor="start" data-max="132"><tspan x="62.0" dy="0">MONITOR · TRAUMA</tspan></text><polyline points="60.0,361.0 72.0,361.0 75.0,355.0 78.0,361.0 81.0,365.0 84.0,331.0 87.0,369.0 90.0,361.0 98.0,353.0 104.0,361.0 106.0,361.0 118.0,361.0 121.0,355.0 124.0,361.0 127.0,365.0 130.0,331.0 133.0,369.0 136.0,361.0 144.0,353.0 150.0,361.0 152.0,361.0 164.0,361.0 167.0,355.0 170.0,361.0 173.0,365.0 176.0,331.0 179.0,369.0 182.0,361.0 190.0,353.0 196.0,361.0 198.0,361.0 210.0,361.0 213.0,355.0 216.0,361.0 219.0,365.0 222.0,331.0 225.0,369.0 228.0,361.0 236.0,353.0 242.0,361.0 244.0,361.0 256.0,361.0 259.0,355.0 262.0,361.0 265.0,365.0 268.0,331.0 271.0,369.0 274.0,361.0 282.0,353.0 288.0,361.0 290.0,361.0 302.0,361.0 305.0,355.0 308.0,361.0 311.0,365.0 314.0,331.0 317.0,369.0 320.0,361.0 328.0,353.0 334.0,361.0 336.0,361.0 348.0,361.0 351.0,355.0 354.0,361.0 357.0,365.0 360.0,331.0 363.0,369.0 366.0,361.0 374.0,353.0 380.0,361.0 382.0,361.0 394.0,361.0 397.0,355.0 400.0,361.0 403.0,365.0 406.0,331.0 409.0,369.0 412.0,361.0 420.0,353.0 426.0,361.0 428.0,361.0 440.0,361.0 443.0,355.0 446.0,361.0 449.0,365.0 452.0,331.0 455.0,369.0 458.0,361.0 466.0,353.0 472.0,361.0" fill="none" stroke="#4ade80" stroke-width="2"/><text x="490.0" y="309.0" font-size="10.5" font-weight="800" font-style="normal" fill="#4ade80" text-anchor="end" data-max="200"><tspan x="490.0" dy="0">taquicardia · voltajes bajos</tspan></text><rect x="58.0" y="387.0" width="211.0" height="82.0" rx="10" fill="#0c1e3d" stroke="#60a5fa" stroke-width="1.5"/><text x="70.0" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">PA</tspan></text><text x="163.5" y="445.0" font-size="26" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">88/60</tspan></text><text x="257.0" y="409.0" font-size="10.5" font-weight="700" font-style="normal" fill="#60a5fa" text-anchor="end" data-max="106"><tspan x="257.0" dy="0">mmHg ▼</tspan></text><rect x="281.0" y="387.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="293.0" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">Δ PA al inspirar</tspan></text><text x="386.5" y="445.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">−14</tspan></text><text x="480.0" y="409.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="480.0" dy="0">mmHg ▲</tspan></text><rect x="58.0" y="479.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="70.0" y="501.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">FC</tspan></text><text x="163.5" y="537.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">120</tspan></text><text x="257.0" y="501.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="257.0" dy="0">lpm ▲</tspan></text><rect x="281.0" y="479.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="293.0" y="501.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">YUGULARES</tspan></text><text x="386.5" y="537.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">ingurgitadas</tspan></text><text x="480.0" y="501.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="480.0" dy="0"> ▲</tspan></text><rect x="58.0" y="571.0" width="211.0" height="82.0" rx="10" fill="#0c1e3d" stroke="#60a5fa" stroke-width="1.5"/><text x="70.0" y="593.0" font-size="11.5" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">RUIDOS</tspan></text><text x="163.5" y="629.0" font-size="26" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">apagados</tspan></text><text x="257.0" y="593.0" font-size="10.5" font-weight="700" font-style="normal" fill="#60a5fa" text-anchor="end" data-max="106"><tspan x="257.0" dy="0"> ▼</tspan></text><rect x="281.0" y="571.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="293.0" y="593.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">PVC</tspan></text><text x="386.5" y="629.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">16</tspan></text><text x="480.0" y="593.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="480.0" dy="0">cmH₂O ▲</tspan></text><rect x="528.0" y="336.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="361.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Caída de la PA &gt; 10 mmHg al inspirar</tspan></text><text x="543.0" y="378.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Pulso paradójico: el corazón comprimido se llena menos.</tspan></text><rect x="528.0" y="401.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Tríada de Beck</tspan></text><text x="543.0" y="443.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Hipotensión, yugulares y ruidos apagados.</tspan></text><rect x="528.0" y="466.0" width="432.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="543.0" y="491.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Ecografía FAST</tspan></text><text x="543.0" y="508.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Hemopericardio en segundos.</tspan></text><rect x="528.0" y="531.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="556.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Conducta</tspan></text><text x="543.0" y="573.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Ventana pericárdica o esternotomía; no pericardiocentesis ciega.</tspan></text><rect x="40.0" y="689.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="715.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Pulso paradójico + Beck = taponamiento</tspan></text><text x="60.0" y="734.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Drenar y reparar el corazón.</tspan></text><text x="40.0" y="801.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="811.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="842.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="833.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipotensión</tspan><tspan x="285.0" dy="17">ortostática</tspan></text><rect x="363.0" y="814.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="842.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Pulso paradójico</tspan></text><text x="585.0" y="833.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ruidos cardiacos</tspan><tspan x="585.0" dy="17">aumentados</tspan></text><text x="735.0" y="833.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ansiedad y</tspan><tspan x="735.0" dy="17">sudoración</tspan></text><text x="885.0" y="833.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Bradicardia</tspan><tspan x="885.0" dy="17">persistente</tspan></text><rect x="40.0" y="865.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="865.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="902.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Característica?</tspan></text><text x="285.0" y="886.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una causa de</tspan><tspan x="285.0" dy="16">síncope, no del</tspan><tspan x="285.0" dy="16">taponamiento</tspan></text><text x="435.0" y="894.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: la PA cae &gt; 10</tspan><tspan x="435.0" dy="16">mmHg al inspirar</tspan></text><text x="585.0" y="894.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: los ruidos están</tspan><tspan x="585.0" dy="16">apagados</tspan></text><text x="735.0" y="902.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: inespecíficas</tspan></text><text x="885.0" y="902.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: hay taquicardia</tspan></text><rect x="40.0" y="811.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="955.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="983.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1005.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Normal: la sistólica baja 3-5 mmHg al inspirar; en el taponamiento más de 10 mmHg.</tspan><tspan x="58.0" dy="18">• Tríada de Beck: hipotensión, ingurgitación yugular y ruidos apagados (no aumentados).</tspan><tspan x="58.0" dy="18">• Otras causas: asma grave, EPOC, embolia pulmonar y pericarditis constrictiva. Tratamiento: ventana pericárdica o esternotomía.</tspan></text><text x="58.0" y="1063.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025); ESC, enfermedades del pericardio (2015); Schwartz Principios de Cirugía 11.ª ed.</tspan></text></svg>