font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Combinados</tspan></text><text x="280.0" y="719.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Categoría 1 (sin restricción)</tspan></text><text x="625.0" y="719.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Joven, no fumadora, sin otros riesgos; eficaz</tspan></text><rect x="170.6" y="703.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="718.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="729.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Dispositivo con levonorgestrel</tspan></text><text x="280.0" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Categoría 4 si hay EPI actual</tspan></text><text x="625.0" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Podría favorecer la progresión de la infección</tspan></text><rect x="40.0" y="758.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="777.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Métodos de barrera y naturales</tspan></text><text x="280.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Sin restricción médica</tspan></text><text x="625.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Mayor tasa de falla con el uso habitual</tspan></text><rect x="40.0" y="787.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="806.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Bloqueo tubárico bilateral</tspan></text><text x="280.0" y="806.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Definitivo</tspan></text><text x="625.0" y="806.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">No se aconseja a los 25 años con dolor pélvico activo</tspan></text><text x="40.0" y="856.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="866.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="897.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="869.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="888.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Anticonceptivos</tspan><tspan x="285.0" dy="17">orales combinados</tspan></text><text x="435.0" y="897.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Métodos naturales</tspan></text><text x="585.0" y="888.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Dispositivo con</tspan><tspan x="585.0" dy="17">levonorgestrel</tspan></text><text x="735.0" y="897.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Métodos de barrera</tspan></text><text x="885.0" y="888.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Bloqueo de trompas</tspan><tspan x="885.0" dy="17">bilateral</tspan></text><rect x="40.0" y="920.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="920.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="949.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Método más seguro?</tspan></text><text x="285.0" y="949.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sin restricción</tspan></text><text x="435.0" y="941.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: mayor tasa de falla</tspan><tspan x="435.0" dy="16">con uso habitual</tspan></text><text x="585.0" y="941.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: DIU, categoría 4</tspan><tspan x="585.0" dy="16">con EPI actual</tspan></text><text x="735.0" y="941.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: falla más con el</tspan><tspan x="735.0" dy="16">uso habitual</tspan></text><text x="885.0" y="941.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: definitivo, no se</tspan><tspan x="885.0" dy="16">aconseja a los 25 años</tspan></text><rect x="40.0" y="866.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="994.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1022.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1044.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Con EPI actual o muy reciente el DIU, de cobre o de levonorgestrel, es categoría 4 para colocarlo (CDC 2024); la opción C se descarta.</tspan><tspan x="58.0" dy="18">• Los combinados no tienen contraindicación en una joven no fumadora, son muy eficaces y reducen la dismenorrea y la enfermedad pélvica sintomática.</tspan><tspan x="58.0" dy="18">• Naturales y de barrera fallan más con el uso habitual; la esterilización es definitiva y no se aconseja a los 25 años con dolor activo y trompas patológicas.</tspan><tspan x="58.0" dy="18">• Ante EPI sospechada: tratar, descartar embarazo e ITS antes de elegir método; el preservativo protege siempre contra ITS.</tspan></text><text x="58.0" y="1120.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, US MEC (MMWR Recomm Rep 2024); CDC, Guía de tratamiento de ITS 2021 (MMWR Recomm Rep 2021); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>