<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1053" viewBox="0 0 1000 1053" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Adolescente que tras una discusión presenta desconexión, opistótonos y movimientos rotatorios en la cama, con recuperación inmediata y sin antecedentes: crisis psicógena no epiléptica"><title>Adolescente que tras una discusión presenta desconexión, opistótonos y movimientos rotatorios en la cama, con recuperación inmediata y sin antecedentes: crisis psicógena no epiléptica</title><rect x="0.75" y="0.75" width="998.5" height="1051.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Crisis psicógena no epiléptica · diagnóstico diferencial</tspan></text><rect x="524.0" y="32.0" width="124.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="586.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="108"><tspan x="586.2" dy="0">PSIQUIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis psicógena no epiléptica (pseudocrisis)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Episodios que parecen convulsiones pero no tienen descarga eléctrica cerebral; suelen</tspan><tspan x="58.0" dy="17">tener un desencadenante emocional.</tspan><tspan x="58.0" dy="17">Pistas: ojos cerrados, movimientos asincrónicos o de lado a lado, arqueo de la espalda,</tspan><tspan x="58.0" dy="17">duración larga y recuperación rápida.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 17 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tras discutir con la madre: desconexión, movimientos</tspan><tspan x="640.0" dy="16">tónicos, opistótonos, giros en la cama.</tspan><tspan x="640.0" dy="16">Recupera la conexión al terminar; escoriación en la</tspan><tspan x="640.0" dy="16">punta de la lengua.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿EPILÉPTICA O PSICÓGENA?</tspan></text><rect x="493.0" y="351.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 556.0 H560.0 L540.0 536.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="351.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="332.9" x2="614.6" y2="369.1" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="332.9" x2="357.4" y2="394.9" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="332.9" x2="413.4" y2="394.9" stroke="#64748b" stroke-width="2"/><path d="M347.4 394.9 H423.4 Q385.4 438.9 347.4 394.9 Z" fill="#64748b"/><text x="385.4" y="409.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">EPILÉPTICA</tspan></text><line x1="614.6" y1="369.1" x2="586.6" y2="431.1" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="369.1" x2="642.6" y2="431.1" stroke="#64748b" stroke-width="2"/><path d="M576.6 431.1 H652.6 Q614.6 475.1 576.6 431.1 Z" fill="#ea580c"/><text x="614.6" y="446.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">PSICÓGENA</tspan></text><text x="500.0" y="583.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Hacia dónde se inclina este caso?</tspan></text><rect x="40.0" y="321.0" width="290.0" height="184.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Crisis epiléptica</tspan></text><circle cx="62.0" cy="374.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Ojos abiertos</tspan></text><circle cx="62.0" cy="400.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="404.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Mordedura lateral de la lengua</tspan></text><circle cx="62.0" cy="426.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="430.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Confusión posictal</tspan></text><circle cx="62.0" cy="452.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Prolactina alta</tspan></text><circle cx="62.0" cy="478.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="482.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Durante el sueño</tspan></text><rect x="670.0" y="321.0" width="290.0" height="184.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="688.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Crisis psicógena</tspan></text><circle cx="692.0" cy="374.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Tras una discusión</tspan></text><circle cx="692.0" cy="400.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="404.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Opistótonos y giros en la cama</tspan></text><circle cx="692.0" cy="426.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="430.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Recupera de inmediato</tspan></text><circle cx="692.0" cy="452.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Lengua: solo la punta</tspan></text><circle cx="692.0" cy="478.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="482.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Sin antecedentes</tspan></text><rect x="844.6" y="310.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="617.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="645.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Crisis psicógena no epiléptica</tspan></text><text x="500.0" y="666.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Confirmar con video-EEG si se repite.</tspan><tspan x="500.0" dy="17">Psicoterapia; no antiepilépticos.</tspan></text><text x="40.0" y="750.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="760.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="791.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Mioclónica</tspan></text><text x="435.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Parcial simple</tspan></text><text x="585.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Focal generalizada</tspan></text><rect x="663.0" y="763.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pseudoepiléptica</tspan></text><text x="885.0" y="782.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tónico-clónica</tspan><tspan x="885.0" dy="17">generalizada</tspan></text><rect x="40.0" y="814.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="814.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="851.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tipo de crisis?</tspan></text><text x="285.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sacudidas breves</tspan><tspan x="285.0" dy="16">sin desconexión</tspan></text><text x="435.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin pérdida de</tspan><tspan x="435.0" dy="16">conciencia</tspan></text><text x="585.0" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: término incorrecto</tspan></text><text x="735.0" y="843.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: emoción previa y</tspan><tspan x="735.0" dy="16">recupera de inmediato</tspan></text><text x="885.0" y="835.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: daría confusión</tspan><tspan x="885.0" dy="16">posictal y mordedura</tspan><tspan x="885.0" dy="16">lateral</tspan></text><rect x="40.0" y="760.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="904.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="932.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="954.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El estándar es el video-EEG (crisis sin descarga).</tspan><tspan x="58.0" dy="18">• Prolactina a los 10-20 min: sube tras una crisis tónico-clónica real, no en la psicógena.</tspan><tspan x="58.0" dy="18">• Tratamiento: explicar el diagnóstico sin culpar, psicoterapia; no dar antiepilépticos.</tspan></text><text x="58.0" y="1012.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ILAE, crisis psicógenas no epilépticas (2013; act.); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>