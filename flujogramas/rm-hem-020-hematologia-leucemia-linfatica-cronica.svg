<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1256" viewBox="0 0 1000 1256" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Anciano con adenopatías, esplenomegalia, linfocitosis y sombras de Gumprecht: leucemia linfática crónica"><title>Anciano con adenopatías, esplenomegalia, linfocitosis y sombras de Gumprecht: leucemia linfática crónica</title><rect x="0.75" y="0.75" width="998.5" height="1254.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hematología · leucemia linfática crónica</tspan></text><rect x="436.5" y="32.0" width="120.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="496.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="104"><tspan x="496.8" dy="0">HEMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Leucemia linfática crónica (LLC)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neoplasia de linfocitos B maduros CD5 y CD23 positivos; la más frecuente del adulto en</tspan><tspan x="58.0" dy="17">Occidente.</tspan><tspan x="58.0" dy="17">Mediana de edad cercana a los 70 años.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 74 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Infecciones respiratorias a repetición, astenia y baja de</tspan><tspan x="640.0" dy="16">peso.</tspan><tspan x="640.0" dy="16">Adenopatías, esplenomegalia; leucocitos 30 000 con</tspan><tspan x="640.0" dy="16">80 % de linfocitos; sombras de Gumprecht.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LEER EL HEMOGRAMA DEL PACIENTE</tspan></text><rect x="40.0" y="301.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="339.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="363.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Leucocitos</tspan></text><text x="250.0" y="364.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">30 000/µL  ↑</tspan></text><text x="400.0" y="363.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">4000-11 000</tspan></text><text x="550.0" y="363.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Leucocitosis a expensas de linfocitos.</tspan></text><rect x="40.0" y="383.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="407.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Linfocitos</tspan></text><text x="250.0" y="408.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">80 % (≈ 24 000/µL)  ↑</tspan></text><text x="400.0" y="407.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Menos de 5000/µL</tspan></text><text x="550.0" y="407.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Linfocitosis B madura: criterio de LLC.</tspan></text><rect x="40.0" y="427.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="451.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Frotis</tspan></text><text x="250.0" y="452.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Gumprecht  ↑</tspan></text><text x="400.0" y="451.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">No se ven</tspan></text><text x="550.0" y="451.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Linfocitos frágiles que se rompen al extender.</tspan></text><rect x="40.0" y="471.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="495.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Clínica</tspan></text><text x="250.0" y="496.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Ganglios y bazo  ↑</tspan></text><text x="400.0" y="495.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Sin adenopatías</tspan></text><text x="550.0" y="495.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Infiltración linfoide: estadio Rai II como mínimo.</tspan></text><rect x="40.0" y="529.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="555.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Linfocitosis madura + adenopatías + sombras de Gumprecht = LLC</tspan></text><text x="60.0" y="574.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El linfoma no se define por el frotis; la mononucleosis es autolimitada; las demás son agudas o de células peludas.</tspan></text><text x="40.0" y="635.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESTADIFICACIÓN DE RAI MODIFICADA DE LA LLC</tspan></text><rect x="40.0" y="647.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Estadio</tspan></text><text x="175.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Hallazgos</tspan></text><text x="572.5" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Riesgo</tspan></text><rect x="40.0" y="676.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="695.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">0</tspan></text><text x="175.0" y="695.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Linfocitosis sola</tspan></text><text x="572.5" y="695.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Bajo</tspan></text><rect x="40.0" y="705.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="724.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">I</tspan></text><text x="175.0" y="724.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Linfocitosis con adenopatías</tspan></text><text x="572.5" y="724.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Intermedio</tspan></text><rect x="40.0" y="734.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="753.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">II</tspan></text><text x="175.0" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Linfocitosis con esplenomegalia o hepatomegalia</tspan></text><text x="572.5" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Intermedio</tspan></text><rect x="65.6" y="737.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="752.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="763.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="782.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">III</tspan></text><text x="175.0" y="782.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Linfocitosis con anemia (Hb menor de 11 g/dL)</tspan></text><text x="572.5" y="782.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Alto</tspan></text><rect x="40.0" y="792.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="811.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">IV</tspan></text><text x="175.0" y="811.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Linfocitosis con plaquetas menores de 100 000/µL</tspan></text><text x="572.5" y="811.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Alto</tspan></text><text x="40.0" y="837.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Sin hemoglobina ni plaquetas en el enunciado, el caso es al menos estadio II. Binet: A, menos de 3 áreas linfoides; B, 3 o más; C, anemia o trombocitopenia.</tspan></text><text x="40.0" y="884.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="894.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="925.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="925.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Linfoma</tspan></text><rect x="363.0" y="897.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="916.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Leucemia linfática</tspan><tspan x="435.0" dy="17">crónica</tspan></text><text x="585.0" y="916.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Mononucleosis</tspan><tspan x="585.0" dy="17">infecciosa</tspan></text><text x="735.0" y="916.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Leucemia a células</tspan><tspan x="735.0" dy="17">peludas</tspan></text><text x="885.0" y="916.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Leucemia linfática</tspan><tspan x="885.0" dy="17">aguda</tspan></text><rect x="40.0" y="948.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="948.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="977.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="977.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el frotis no lo</tspan><tspan x="285.0" dy="16">define</tspan></text><text x="435.0" y="969.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: linfocitosis madura,</tspan><tspan x="435.0" dy="16">adenopatías y sombras</tspan><tspan x="435.0" dy="16">de Gumprecht</tspan></text><text x="585.0" y="969.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: tendría linfocitos</tspan><tspan x="585.0" dy="16">atípicos y sería</tspan><tspan x="585.0" dy="16">autolimitada</tspan></text><text x="735.0" y="969.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: cursa con</tspan><tspan x="735.0" dy="16">pancitopenia y sin</tspan><tspan x="735.0" dy="16">adenopatías</tspan></text><text x="885.0" y="977.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es de niños y</tspan><tspan x="885.0" dy="16">jóvenes, con blastos</tspan></text><rect x="40.0" y="894.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1038.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1066.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1088.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Diagnóstico (iwCLL 2018): linfocitosis B monoclonal de 5000/µL o más, confirmada por citometría de flujo. El frotis muestra linfocitos pequeños maduros y</tspan><tspan x="58.0" dy="18">   sombras de Gumprecht (células rotas al extender).</tspan><tspan x="58.0" dy="18">• Clínica: adenopatías, esplenomegalia, infecciones por hipogammaglobulinemia y fenómenos autoinmunes (anemia hemolítica, trombocitopenia).</tspan><tspan x="58.0" dy="18">• Estadios de Rai o Binet: en estadios iniciales asintomáticos se observa; se trata la enfermedad activa, hoy con inhibidores de BTK o venetoclax antes</tspan><tspan x="58.0" dy="18">   que con quimioinmunoterapia.</tspan><tspan x="58.0" dy="18">• Alerta: la deleción 17p y la mutación de TP53 predicen mala reacción a la quimioterapia.</tspan></text><text x="58.0" y="1200.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Hallek M. y cols., iwCLL guidelines for diagnosis, indications for treatment, response assessment and supportive management of CLL (Blood 2018); Harrison Principios</tspan><tspan x="58.0" dy="15">de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>