<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1076" viewBox="0 0 1000 1076" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La vacuna neumocócica polisacárida se aplica desde los 2 años; antes, las conjugadas"><title>La vacuna neumocócica polisacárida se aplica desde los 2 años; antes, las conjugadas</title><rect x="0.75" y="0.75" width="998.5" height="1074.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · vacuna neumocócica</tspan></text><rect x="389.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="438.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="438.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vacunas neumocócicas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Conjugadas: memoria dependiente de linfocitos T, eficaces desde los 2 meses.</tspan><tspan x="58.0" dy="17">Polisacárida de 23 serotipos: reacción independiente de T.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la edad mínima para aplicar la vacuna</tspan><tspan x="640.0" dy="16">neumocócica polisacárida?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">A QUÉ EDAD SE APLICA CADA VACUNA NEUMOCÓCICA</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="398.3" y1="291.0" x2="398.3" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="398.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="398.3" dy="0">6</tspan></text><line x1="506.7" y1="291.0" x2="506.7" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="506.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="506.7" dy="0">12</tspan></text><line x1="615.0" y1="291.0" x2="615.0" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">18</tspan></text><line x1="723.3" y1="291.0" x2="723.3" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="723.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="723.3" dy="0">24</tspan></text><line x1="831.7" y1="291.0" x2="831.7" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="831.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="831.7" dy="0">30</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">36</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">meses</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Conjugada: primera dosis</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">A los 2 y 4 meses del esquema</tspan></text><rect x="326.1" y="303.0" width="36.1" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Conjugada: refuerzo</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">A los 12 meses</tspan></text><rect x="506.7" y="341.0" width="18.1" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Polisacárida (PPSV23)</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Desde los 2 años, solo con factores de riesgo</tspan></text><rect x="723.3" y="379.0" width="216.7" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><line x1="723.3" y1="293.0" x2="723.3" y2="415.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="696.7" y="415.0" width="53.3" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="723.3" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="723.3" dy="0">2 años</tspan></text><rect x="40.0" y="461.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="487.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Polisacárida = desde los 2 años</tspan></text><text x="60.0" y="506.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Antes de esa edad la inmunidad independiente de linfocitos T es débil o ausente.</tspan></text><text x="40.0" y="567.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">VACUNAS NEUMOCÓCICAS CONJUGADA Y POLISACÁRIDA</tspan></text><rect x="40.0" y="579.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Vacuna</tspan></text><text x="300.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="207"><tspan x="300.0" dy="0">Inmunidad</tspan></text><text x="523.3" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="207"><tspan x="523.3" dy="0">Edad</tspan></text><text x="746.7" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="207"><tspan x="746.7" dy="0">Uso</tspan></text><rect x="40.0" y="608.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Conjugada (13, 15, 20, 21 valentes)</tspan></text><text x="300.0" y="627.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="300.0" dy="0">Memoria dependiente de linfocitos T</tspan></text><text x="523.3" y="627.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="523.3" dy="0">Desde los 2 meses</tspan></text><text x="746.7" y="627.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="746.7" dy="0">Esquema infantil: 2, 4 y 12 meses</tspan></text><rect x="40.0" y="637.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="656.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Polisacárida (PPSV23)</tspan></text><text x="300.0" y="656.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="300.0" dy="0">Independiente de linfocitos T; débil</tspan><tspan x="300.0" dy="15">bajo 2 años</tspan></text><text x="523.3" y="656.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="523.3" dy="0">Desde los 2 años</tspan></text><text x="746.7" y="656.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="746.7" dy="0">Grupos de riesgo, tras las conjugadas</tspan></text><rect x="190.6" y="648.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="663.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="721.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="731.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="753.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="753.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">6 semanas</tspan></text><rect x="363.0" y="734.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="753.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">2 años</tspan></text><text x="585.0" y="753.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">4 meses</tspan></text><text x="735.0" y="753.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">1 año</tspan></text><text x="885.0" y="753.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">2 meses</tspan></text><rect x="40.0" y="768.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="768.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="797.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Edad mínima de la</tspan><tspan x="54.0" dy="16">polisacárida?</tspan></text><text x="285.0" y="789.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es edad de la</tspan><tspan x="285.0" dy="16">primera dosis de la</tspan><tspan x="285.0" dy="16">conjugada</tspan></text><text x="435.0" y="797.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: antes la inmunidad</tspan><tspan x="435.0" dy="16">es débil o ausente</tspan></text><text x="585.0" y="797.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es edad de la</tspan><tspan x="585.0" dy="16">conjugada</tspan></text><text x="735.0" y="797.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es el refuerzo de la</tspan><tspan x="735.0" dy="16">conjugada</tspan></text><text x="885.0" y="797.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es edad de la</tspan><tspan x="885.0" dy="16">conjugada</tspan></text><rect x="40.0" y="731.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="858.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="886.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="908.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La polisacárida (PPSV23) induce una inmunidad débil o ausente en menores de 2 años: su edad mínima es de 2 años.</tspan><tspan x="58.0" dy="18">• Se usa desde los 2 años en asplenia, anemia drepanocítica, inmunodeficiencia, VIH, fístula de LCR, implante coclear y enfermedad crónica pulmonar,</tspan><tspan x="58.0" dy="18">   cardiaca o renal o diabetes, después de completar las conjugadas.</tspan><tspan x="58.0" dy="18">• Las conjugadas (13, 15, 20 y 21 valentes) van desde los 2 meses; el esquema peruano usa 2, 4 y 12 meses. 6 semanas, 2 meses y 4 meses son edades</tspan><tspan x="58.0" dy="18">   de las conjugadas.</tspan><tspan x="58.0" dy="18">• Alerta: con asplenia o inmunodeficiencia se revacuna una vez a los 5 años; en mayores de 65 años las conjugadas son la elección actual.</tspan></text><text x="58.0" y="1020.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Kobayashi M et al., ACIP, vacunas neumocócicas conjugadas 15 y 20 valentes en adultos, MMWR 2022;71:109; ACIP, MMWR 2025;74:1; Nelson Tratado de Pediatría</tspan><tspan x="58.0" dy="15">22.ª ed. (2024).</tspan></text></svg>