<svg xmlns="http://www.w3.org/2000/svg" width="820" height="970" viewBox="0 0 820 970" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Determinantes sociales: saneamiento y desnutrición"><title>Determinantes sociales: saneamiento y desnutrición</title><rect width="820" height="970" fill="#ffffff"/><rect x="0" y="0" width="820" height="142" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Determinantes sociales: saneamiento y</tspan><tspan x="40" dy="30">desnutrición</tspan></text><text x="40" y="126" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · SP-017 · Salud Pública, Gestión y Epidemiología</tspan></text><rect x="90" y="174" width="640" height="98" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="202" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="226" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Niño con diarrea a repetición y talla baja (Talla/Edad &lt; −2</tspan><tspan x="108" dy="22">DE)</tspan></text><line x1="410.0" y1="274" x2="410.0" y2="294" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,292 417.0,292 410.0,302" fill="#94a3b8"/><rect x="90" y="304" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="332" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="356" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Determinantes estructurales: pobreza, nivel educativo y</tspan><tspan x="108" dy="22">empleo</tspan></text><line x1="410.0" y1="404" x2="410.0" y2="424" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,422 417.0,422 410.0,432" fill="#94a3b8"/><rect x="90" y="434" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="462" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="486" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Determinantes intermedios: vivienda con piso de tierra, sin</tspan><tspan x="108" dy="22">agua potable ni desagüe</tspan></text><line x1="410.0" y1="534" x2="410.0" y2="554" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,552 417.0,552 410.0,562" fill="#94a3b8"/><rect x="90" y="564" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="592" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="616" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Mayor exposición a enteropatógenos → diarreas repetidas →</tspan><tspan x="108" dy="22">desnutrición crónica</tspan></text><line x1="410.0" y1="664" x2="410.0" y2="684" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,682 417.0,682 410.0,692" fill="#94a3b8"/><rect x="90" y="694" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="722" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="746" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Priorizar vivienda, agua segura y saneamiento con acción</tspan><tspan x="108" dy="22">intersectorial</tspan></text><rect x="40" y="822" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="822" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="848" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="872" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">El acceso a agua segura y saneamiento es de los determinantes que más pesan</tspan><tspan x="62" dy="21">en la desnutrición crónica infantil.</tspan></text><text x="410.0" y="948" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
