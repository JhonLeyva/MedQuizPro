pan x="834.0" dy="17">Piso de tierra</tspan></text><line x1="310.0" y1="376.0" x2="330.0" y2="376.0" stroke="#f59e0b" stroke-width="2"/><circle cx="330.0" cy="376.0" r="4" fill="#f59e0b"/><rect x="40.0" y="326.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="327.0" width="6" height="98.0" rx="3" fill="#f59e0b"/><text x="184.0" y="353.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Mecanismo</tspan></text><text x="184.0" y="376.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Enteropatógenos</tspan><tspan x="184.0" dy="17">→ diarrea repetida</tspan><tspan x="184.0" dy="17">→ talla baja</tspan></text><line x1="690.0" y1="376.0" x2="670.0" y2="376.0" stroke="#10b981" stroke-width="2"/><circle cx="670.0" cy="376.0" r="4" fill="#10b981"/><rect x="690.0" y="326.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="327.0" width="6" height="98.0" rx="3" fill="#10b981"/><text x="834.0" y="353.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Acción</tspan></text><text x="834.0" y="376.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Intersectorial</tspan><tspan x="834.0" dy="17">Agua segura</tspan><tspan x="834.0" dy="17">Lavado de manos</tspan></text><rect x="40" y="452.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="480.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="502.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La diarrea repetida en la primera infancia es causa de desnutrición crónica.</tspan><tspan x="58.0" dy="18">• Modelo de determinantes de la OMS (Solar e Irwin).</tspan></text><text x="58.0" y="542.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS – Comisión sobre Determinantes Sociales de la Salud · MINSA – Plan multisectorial contra la anemia y DCI</tspan></text></svg>
