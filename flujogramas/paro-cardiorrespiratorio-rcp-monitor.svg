.0" y="557.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">FV / TV sin pulso</tspan></text><rect x="763.2" y="544.5" width="96.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="557.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Asistolia / AESP</tspan></text><polygon points="162.2,320.0 188.2,291.0 656.2,291.0 682.2,320.0 656.2,349.0 188.2,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">RCP en curso: ¿qué se hace a la vez?</tspan></text><rect x="40.0" y="415.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">OXÍGENO + MONITOR/DESFIBRILADOR</tspan></text><text x="188.7" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Bolsa-mascarilla 30:2</tspan><tspan x="188.7" dy="17">Ver el ritmo</tspan></text><polygon points="395.7,444.0 421.7,415.0 889.7,415.0 915.7,444.0 889.7,473.0 421.7,473.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="441.7" cy="444.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="449.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="448.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">¿Ritmo desfibrilable?</tspan></text><rect x="351.3" y="571.5" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="599.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Descarga</tspan></text><text x="500.0" y="622.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Luego RCP 2 min</tspan></text><rect x="662.7" y="571.5" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="599.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Adrenalina 1 mg</tspan></text><text x="811.3" y="622.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Cada 3-5 min</tspan></text><text x="40.0" y="684.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="694.9" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="734.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="725.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Infundir adrenalina</tspan><tspan x="285.0" dy="17">5mg EV</tspan></text><text x="435.0" y="717.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Administrar</tspan><tspan x="435.0" dy="17">oxígeno y</tspan><tspan x="435.0" dy="17">adrenalina</tspan></text><rect x="513.0" y="697.9" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="725.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Oxígeno +</tspan><tspan x="585.0" dy="17">monitor/desfibrilador</tspan></text><text x="735.0" y="725.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cristaloides a goteo</tspan><tspan x="735.0" dy="17">rápido</tspan></text><text x="885.0" y="717.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Intubar antes de</tspan><tspan x="885.0" dy="17">continuar las</tspan><tspan x="885.0" dy="17">compresiones</tspan></text><rect x="40.0" y="765.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="765.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="802.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Acción simultánea?</tspan></text><text x="285.0" y="802.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la dosis es 1 mg</tspan></text><text x="435.0" y="786.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin conocer el</tspan><tspan x="435.0" dy="16">ritmo, primero</tspan><tspan x="435.0" dy="16">monitorear</tspan></text><text x="585.0" y="794.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: ver el ritmo y</tspan><tspan x="585.0" dy="16">ventilar</tspan></text><text x="735.0" y="802.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no de rutina</tspan></text><text x="885.0" y="794.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no se interrumpen</tspan><tspan x="885.0" dy="16">las compresiones</tspan></text><rect x="40.0" y="694.9" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="855.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="883.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="905.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mientras se comprime: oxígeno con bolsa-mascarilla (30:2) y conectar el monitor/desfibrilador.</tspan><tspan x="58.0" dy="18">• FV o TV sin pulso: descarga inmediata; asistolia o AESP: adrenalina 1 mg EV cuanto antes.</tspan><tspan x="58.0" dy="18">• Adrenalina 1 mg cada 3-5 minutos; intubar sin interrumpir las compresiones.</tspan></text><text x="58.0" y="963.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ILCOR, guías de reanimación 2025.</tspan></text></svg>