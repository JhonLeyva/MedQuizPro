<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1105" viewBox="0 0 1000 1105" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el trauma testicular cerrado la imagen de elección es la ecografía escrotal con Doppler color"><title>En el trauma testicular cerrado la imagen de elección es la ecografía escrotal con Doppler color</title><rect x="0.75" y="0.75" width="998.5" height="1103.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Urología · trauma escrotal cerrado</tspan></text><rect x="403.0" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="494.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="494.3" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trauma escrotal cerrado</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Golpe directo, caída a horcajadas o deporte.</tspan><tspan x="58.0" dy="17">La lesión clave es la rotura de la túnica albugínea.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de imagen</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué estudio de imágenes se recomienda en el</tspan><tspan x="640.0" dy="16">traumatismo testicular cerrado?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ESTUDIO CORRESPONDE EN EL TRAUMA TESTICULAR</tspan></text><rect x="40.0" y="269.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="337.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Primera línea</tspan></text><rect x="40.0" y="397.0" width="920.0" height="128.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="465.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Si queda duda</tspan></text><rect x="40.0" y="525.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="525.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="593.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No útiles</tspan></text><line x1="307.2" y1="325.0" x2="314.2" y2="325.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="325.0" x2="314.2" y2="453.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="453.0" x2="312.2" y2="453.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,458.0 312.2,448.0 321.2,453.0" fill="#0f766e"/><line x1="470.4" y1="453.0" x2="477.4" y2="453.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="453.0" x2="477.4" y2="461.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="461.0" x2="475.4" y2="461.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,466.0 475.4,456.0 484.4,461.0" fill="#0f766e"/><line x1="633.6" y1="461.0" x2="640.6" y2="461.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="461.0" x2="640.6" y2="572.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="572.5" x2="638.6" y2="572.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,577.5 638.6,567.5 647.6,572.5" fill="#0f766e"/><line x1="796.8" y1="572.5" x2="803.8" y2="572.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="572.5" x2="803.8" y2="572.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="572.5" x2="801.8" y2="572.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,577.5 801.8,567.5 810.8,572.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="149.2" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Ecografía escrotal</tspan><tspan x="168.0" dy="16">con Doppler color</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Rotura de albugínea,</tspan><tspan x="168.0" dy="14.5">hematocele y perfusión</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="410.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Exploración</tspan><tspan x="331.2" dy="16">quirúrgica</tspan></text><text x="331.2" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Rotura o hematocele</tspan><tspan x="331.2" dy="14.5">grande; ideal en 72 horas</tspan></text><circle cx="321.2" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="410.0" width="149.2" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Resonancia</tspan><tspan x="494.4" dy="16">magnética</tspan></text><text x="494.4" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Precisa, pero costosa y</tspan><tspan x="494.4" dy="14.5">poco accesible en</tspan><tspan x="494.4" dy="14.5">urgencias</tspan></text><circle cx="484.4" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="538.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="554.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Tomografía</tspan></text><text x="657.6" y="571.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">No evalúa bien el</tspan><tspan x="657.6" dy="14.5">testículo</tspan></text><circle cx="647.6" cy="538.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="542.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="538.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="554.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Angiografía</tspan></text><text x="820.8" y="571.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Sin papel en el trauma</tspan><tspan x="820.8" dy="14.5">testicular</tspan></text><circle cx="810.8" cy="538.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="542.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="671.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="697.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Trauma escrotal cerrado = ecografía con Doppler</tspan></text><text x="60.0" y="716.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Doppler no es un estudio aparte: forma parte de la ecografía.</tspan></text><text x="40.0" y="783.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="793.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="815.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">TAC</tspan></text><text x="435.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">RMN</tspan></text><text x="585.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Doppler</tspan></text><rect x="663.0" y="796.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ecografía</tspan></text><text x="885.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Angiografía</tspan></text><rect x="40.0" y="830.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="830.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="867.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Imagen recomendada?</tspan></text><text x="285.0" y="859.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es útil en</tspan><tspan x="285.0" dy="16">trauma testicular</tspan></text><text x="435.0" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: precisa pero</tspan><tspan x="435.0" dy="16">costosa y poco</tspan><tspan x="435.0" dy="16">accesible</tspan></text><text x="585.0" y="859.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es parte del mismo</tspan><tspan x="585.0" dy="16">estudio</tspan></text><text x="735.0" y="859.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: ecografía escrotal</tspan><tspan x="735.0" dy="16">con Doppler color</tspan></text><text x="885.0" y="859.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es útil en</tspan><tspan x="885.0" dy="16">trauma testicular</tspan></text><rect x="40.0" y="793.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="920.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="948.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="970.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ecografía escrotal de alta resolución con Doppler color: rápida, disponible y no invasiva; sensibilidad y especificidad cercanas a 90 % para rotura.</tspan><tspan x="58.0" dy="18">• Rotura: pérdida del contorno testicular, discontinuidad de la albugínea y parénquima heterogéneo; el Doppler valora la perfusión y descarta torsión.</tspan><tspan x="58.0" dy="18">• Rotura o hematocele grande: exploración y reparación precoz, idealmente en 72 horas, salva el testículo en más de 90 %. Hematoma pequeño con</tspan><tspan x="58.0" dy="18">   albugínea íntegra: conservador.</tspan><tspan x="58.0" dy="18">• Alerta: ante duda ecográfica, exploración quirúrgica. La tomografía y la angiografía no son útiles; la resonancia es costosa y poco accesible.</tspan></text><text x="58.0" y="1064.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Morey AF et al., Urotrauma Guideline 2020: AUA Guideline, J Urol 2021;205:30-35; Urology 2008;71:52-56; Campbell-Walsh-Wein Urología 12.ª ed. (2020).</tspan></text></svg>