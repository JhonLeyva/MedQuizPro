<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="864" viewBox="0 0 1000 864" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cólico lumbar derecho irradiado al testículo en un obeso: tomografía sin contraste (UroTAC)"><title>Cólico lumbar derecho irradiado al testículo en un obeso: tomografía sin contraste (UroTAC)</title><rect x="0.75" y="0.75" width="998.5" height="863.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Urología · litiasis urinaria</tspan></text><rect x="349.7" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="413.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="413.4" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cólico renal por litiasis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Un cálculo obstruye el uréter: dolor lumbar cólico que irradia a la ingle o el testículo.</tspan><tspan x="58.0" dy="17">Náuseas, sudoración e inquietud (no encuentra posición).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 36 años, IMC 34</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor cólico 5/10 en fosa lumbar derecha, irradiado al</tspan><tspan x="640.0" dy="16">flanco y testículo.</tspan><tspan x="640.0" dy="16">Náuseas y sudoración.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#94a3b8"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#0f766e"/><rect x="186.4" y="404.0" width="160.2" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No: adulto obeso (este caso)</tspan></text><rect x="721.4" y="404.0" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Sospecha de cólico renal: ¿embarazada o niño?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">TC SIN CONTRASTE</tspan></text><text x="266.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Baja dosis de radiación</tspan><tspan x="266.5" dy="17">Tamaño y ubicación del cálculo</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Ecografía primero</tspan></text><text x="733.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Sin radiación</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="571.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="602.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Resonancia</tspan><tspan x="285.0" dy="17">magnética nuclear</tspan></text><text x="435.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Radiografía simple</tspan><tspan x="435.0" dy="17">de abdomen</tspan></text><text x="585.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ecografía renal y de</tspan><tspan x="585.0" dy="17">vías urinarias</tspan></text><rect x="663.0" y="574.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">UroTAC (TC sin</tspan><tspan x="735.0" dy="17">contraste)</tspan></text><text x="885.0" y="602.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Urografía excretora</tspan></text><rect x="40.0" y="625.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="625.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="662.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen de elección?</tspan></text><text x="285.0" y="654.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es de primera</tspan><tspan x="285.0" dy="16">línea</tspan></text><text x="435.0" y="662.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Poco sensible</tspan></text><text x="585.0" y="646.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Primera en</tspan><tspan x="585.0" dy="16">embarazadas y niños;</tspan><tspan x="585.0" dy="16">limitada en obesos</tspan></text><text x="735.0" y="662.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: la más sensible</tspan></text><text x="885.0" y="654.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: obsoleta, usa</tspan><tspan x="885.0" dy="16">contraste</tspan></text><rect x="40.0" y="571.5" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="715.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="743.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="765.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La TC sin contraste de baja dosis es el examen de elección en adultos: ve casi todos los cálculos, su tamaño y la obstrucción.</tspan><tspan x="58.0" dy="18">• La ecografía va primero en embarazadas y niños, y sirve para seguimiento.</tspan><tspan x="58.0" dy="18">• Analgesia con AINE (diclofenaco); tamsulosina si el cálculo es distal de 5-10 mm.</tspan></text><text x="58.0" y="823.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EAU, guía de urolitiasis (2024); AUA, guía de cálculos (2016, act. 2019).</tspan></text></svg>