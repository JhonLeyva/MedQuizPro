ill="#0f766e"/><text x="62.0" y="231.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><rect x="74.0" y="202.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="88.0" y="229.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Sospechar</tspan></text><text x="88.0" y="252.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Lesiones de distinta evolución</tspan><tspan x="88.0" dy="17">y relato inconsistente</tspan></text><line x1="335.0" y1="243.5" x2="345.0" y2="243.5" stroke="#0f766e" stroke-width="2"/><polygon points="344.0,238.5 344.0,248.5 352.0,243.5" fill="#0f766e"/><rect x="354.0" y="202.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="376.0" cy="226.0" r="13" fill="#0f766e"/><text x="376.0" y="231.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><rect x="388.0" y="202.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="402.0" y="229.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Entrevista</tspan></text><text x="402.0" y="252.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">En privado, sin la pareja, con</tspan><tspan x="402.0" dy="17">escucha activa</tspan></text><line x1="649.0" y1="243.5" x2="659.0" y2="243.5" stroke="#0f766e" stroke-width="2"/><polygon points="658.0,238.5 658.0,248.5 666.0,243.5" fill="#0f766e"/><rect x="668.0" y="202.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="690.0" cy="226.0" r="13" fill="#0f766e"/><text x="690.0" y="231.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="690.0" dy="0">3</tspan></text><rect x="702.0" y="202.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="716.0" y="229.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Atender</tspan></text><text x="716.0" y="252.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Lesiones físicas y salud mental</tspan></text><line x1="500.0" y1="285.0" x2="500.0" y2="304.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,303.0 505.0,303.0 500.0,311.0" fill="#0f766e"/><rect x="197.0" y="311.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="219.0" cy="335.0" r="13" fill="#0f766e"/><text x="219.0" y="340.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="219.0" dy="0">4</tspan></text><rect x="231.0" y="311.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="245.0" y="338.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">Evaluar riesgo</tspan></text><text x="245.0" y="361.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">Valorar el peligro y activar</tspan><tspan x="245.0" dy="17">protección</tspan></text><line x1="492.0" y1="352.5" x2="502.0" y2="352.5" stroke="#0f766e" stroke-width="2"/><polygon points="501.0,347.5 501.0,357.5 509.0,352.5" fill="#0f766e"/><rect x="511.0" y="311.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="533.0" cy="335.0" r="13" fill="#0f766e"/><text x="533.0" y="340.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="533.0" dy="0">5</tspan></text><rect x="545.0" y="311.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="559.0" y="338.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">Denunciar</tspan></text><text x="559.0" y="361.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">Comunicar a la PNP, Fiscalía o</tspan><tspan x="559.0" dy="17">CEM (Ley 30364)</tspan></text><line x1="500.0" y1="394.0" x2="500.0" y2="413.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,412.0 505.0,412.0 500.0,420.0" fill="#0f766e"/><rect x="90.0" y="420.0" width="820" height="67.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="446.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">SOSPECHA DIAGNÓSTICA</tspan></text><text x="500.0" y="471.5" font-size="15" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">Violencia familiar (de pareja)</tspan></text><rect x="40" y="513.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="541.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="563.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Signos de sofocación cervical indican alto riesgo de feminicidio.</tspan><tspan x="58.0" dy="18">• El personal de salud está obligado a comunicar los casos (Ley N.° 30364).</tspan></text><text x="58.0" y="603.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ley N.° 30364 · MINSA – Guía técnica de salud mental en mujeres víctimas de violencia de pareja (RM 670-2021)</tspan></text></svg>
