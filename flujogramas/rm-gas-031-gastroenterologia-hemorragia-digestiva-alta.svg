<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1303" viewBox="0 0 1000 1303" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La úlcera péptica es la causa más frecuente de hemorragia digestiva alta en el adulto"><title>La úlcera péptica es la causa más frecuente de hemorragia digestiva alta en el adulto</title><rect x="0.75" y="0.75" width="998.5" height="1301.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gastroenterología · hemorragia digestiva alta</tspan></text><rect x="467.3" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="550.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="550.0" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hemorragia digestiva alta</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sangrado proximal al ángulo de Treitz: hematemesis o melena.</tspan><tspan x="58.0" dy="17">La incidencia de la úlcera ha bajado con la erradicación de H. pylori y los IBP.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la causa más frecuente de hemorragia</tspan><tspan x="640.0" dy="16">digestiva alta en adultos?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS DE HEMORRAGIA DIGESTIVA ALTA, DE MÁS A MENOS FRECUENTE</tspan></text><polygon points="200.0,269.0 300.0,269.0 340.0,325.0 160.0,325.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="302.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="269.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="293.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Úlcera péptica</tspan></text><text x="501.0" y="310.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Duodenal o gástrica; AINE, antiagregantes y H. pylori</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,331.0 340.0,331.0 380.0,387.0 120.0,387.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="331.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="355.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Erosiones y esofagitis</tspan></text><text x="501.0" y="372.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Gastropatía por AINE o alcohol; reflujo</tspan></text><polygon points="120.0,393.0 380.0,393.0 420.0,449.0 80.0,449.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="393.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="417.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Várices y Mallory-Weiss</tspan></text><text x="501.0" y="434.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Várices: menos frecuentes pero graves; Mallory-Weiss, 5-10 %</tspan></text><polygon points="80.0,455.0 420.0,455.0 460.0,511.0 40.0,511.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="488.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="455.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="479.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cáncer gástrico</tspan></text><text x="501.0" y="496.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Sangrado crónico y de poca cuantía</tspan></text><text x="250.0" y="529.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más frecuente · ▼ menos frecuente</tspan></text><rect x="40.0" y="551.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="577.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Úlcera péptica = causa más frecuente de sangrado digestivo alto</tspan></text><text x="60.0" y="596.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Reanimar, endoscopía temprana y IBP; erradicar H. pylori.</tspan></text><text x="40.0" y="657.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE FORREST DE LA ÚLCERA CON HEMORRAGIA: RIESGO DE RESANGRADO Y CONDUCTA</tspan></text><rect x="40.0" y="669.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="44"><tspan x="50.0" dy="0">Forrest</tspan></text><text x="110.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="271"><tspan x="110.0" dy="0">Hallazgo endoscópico</tspan></text><text x="396.7" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="271"><tspan x="396.7" dy="0">Resangrado sin tratar (aprox.)</tspan></text><text x="683.3" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="271"><tspan x="683.3" dy="0">Conducta</tspan></text><rect x="40.0" y="698.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="44"><tspan x="50.0" dy="0">Ia</tspan></text><text x="110.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="110.0" dy="0">Sangrado en chorro</tspan></text><text x="396.7" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="396.7" dy="0">Cerca de 55 %</tspan></text><text x="683.3" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="683.3" dy="0">Terapia endoscópica e IBP</tspan></text><rect x="40.0" y="727.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="746.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="44"><tspan x="50.0" dy="0">Ib</tspan></text><text x="110.0" y="746.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="110.0" dy="0">Sangrado en napa</tspan></text><text x="396.7" y="746.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="396.7" dy="0">Cerca de 55 %</tspan></text><text x="683.3" y="746.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="683.3" dy="0">Terapia endoscópica e IBP</tspan></text><rect x="40.0" y="756.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="775.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="44"><tspan x="50.0" dy="0">IIa</tspan></text><text x="110.0" y="775.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="110.0" dy="0">Vaso visible sin sangrado</tspan></text><text x="396.7" y="775.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="396.7" dy="0">Cerca de 43 %</tspan></text><text x="683.3" y="775.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="683.3" dy="0">Terapia endoscópica e IBP</tspan></text><rect x="40.0" y="785.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="44"><tspan x="50.0" dy="0">IIb</tspan></text><text x="110.0" y="804.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="110.0" dy="0">Coágulo adherido</tspan></text><text x="396.7" y="804.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="396.7" dy="0">Cerca de 22 %</tspan></text><text x="683.3" y="804.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="683.3" dy="0">Retirar el coágulo y tratar la lesión de base si se</tspan><tspan x="683.3" dy="15">encuentra; ACG 2021 no emite recomendación</tspan></text><rect x="40.0" y="829.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="848.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="44"><tspan x="50.0" dy="0">IIc</tspan></text><text x="110.0" y="848.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="110.0" dy="0">Base con mancha plana pigmentada</tspan></text><text x="396.7" y="848.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="396.7" dy="0">Cerca de 10 %</tspan></text><text x="683.3" y="848.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="683.3" dy="0">IBP; sin terapia endoscópica</tspan></text><rect x="40.0" y="858.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="877.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="44"><tspan x="50.0" dy="0">III</tspan></text><text x="110.0" y="877.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="110.0" dy="0">Base limpia</tspan></text><text x="396.7" y="877.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="396.7" dy="0">Cerca de 5 %</tspan></text><text x="683.3" y="877.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="271"><tspan x="683.3" dy="0">IBP; alta temprana</tspan></text><text x="40.0" y="903.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Cifras clásicas de resangrado sin tratamiento, citadas en revisiones; series recientes muestran riesgos menores. Tras la hemostasia de una lesión de alto riesgo: IBP en dosis</tspan><tspan x="40.0" dy="15">alta por 3 días (ACG 2021). La pregunta no pide esta clasificación: se agrega como referencia.</tspan></text><text x="40.0" y="965.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="975.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1006.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1006.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Várices esofágicas</tspan></text><text x="435.0" y="997.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Desgarro de</tspan><tspan x="435.0" dy="17">Mallory-Weiss</tspan></text><text x="585.0" y="1006.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Esofagitis erosiva</tspan></text><rect x="663.0" y="978.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1006.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Úlcera péptica</tspan></text><text x="885.0" y="1006.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cáncer gástrico</tspan></text><rect x="40.0" y="1029.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1029.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1058.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa más frecuente?</tspan></text><text x="285.0" y="1050.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: menos frecuentes,</tspan><tspan x="285.0" dy="16">pero más graves</tspan></text><text x="435.0" y="1058.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causa 5-10 %</tspan></text><text x="585.0" y="1050.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: menos frecuente</tspan><tspan x="585.0" dy="16">que la úlcera</tspan></text><text x="735.0" y="1050.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: erosión de un vaso</tspan><tspan x="735.0" dy="16">de la base ulcerosa</tspan></text><text x="885.0" y="1050.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sangra poco a</tspan><tspan x="885.0" dy="16">poco</tspan></text><rect x="40.0" y="975.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1103.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1131.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1153.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La úlcera péptica (por AINE, antiagregantes y H. pylori) explica la mayoría; las de la cara posterior del bulbo comprometen la arteria gastroduodenal.</tspan><tspan x="58.0" dy="18">• Las várices (hipertensión portal) son menos frecuentes pero más mortales; el cáncer gástrico sangra poco a poco y sin gran cuantía.</tspan><tspan x="58.0" dy="18">• Conducta: reanimación hemodinámica, transfusión restrictiva (hemoglobina &lt; 7 g/dL) y endoscopía temprana; Forrest define quién necesita terapia</tspan><tspan x="58.0" dy="18">   endoscópica.</tspan><tspan x="58.0" dy="18">• Después de la terapia, IBP en dosis alta; en el sangrado variceal se agregan vasoactivos y antibiótico.</tspan></text><text x="58.0" y="1247.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Laine L et al., ACG, hemorragia digestiva alta (Am J Gastroenterol 2021;116:899-917); Cervera-Caballero L et al., EsSalud, GPC de hemorragia digestiva alta (Rev</tspan><tspan x="58.0" dy="15">Gastroenterol Peru 2025;45:202-212); Barkun AN et al. (Ann Intern Med 2019;171:805-822); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>