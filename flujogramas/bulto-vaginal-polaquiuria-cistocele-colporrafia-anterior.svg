<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer de 52 años con polaquiuria y bulto vaginal por prolapso del compartimento anterior (cistocele): colporrafia anterior"><title>Mujer de 52 años con polaquiuria y bulto vaginal por prolapso del compartimento anterior (cistocele): colporrafia anterior</title><rect x="0.75" y="0.75" width="998.5" height="1258.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Prolapso de órganos pélvicos</tspan></text><rect x="377.0" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="464.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="464.2" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Compartimentos del prolapso</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Anterior: vejiga (cistocele). Apical: útero o cúpula (histerocele). Posterior: recto (rectocele).</tspan><tspan x="58.0" dy="17">La cirugía repara el compartimento que falla: en el anterior, plicatura de la fascia</tspan><tspan x="58.0" dy="17">(colporrafia anterior).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 52 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">2 años de polaquiuria y sensación de bulto en la</tspan><tspan x="640.0" dy="16">vagina.</tspan><tspan x="640.0" dy="16">Alteración del compartimento anterior.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="811.3" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="188.7" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,423.0 193.7,423.0 188.7,431.0" fill="#94a3b8"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#94a3b8"/><line x1="811.3" y1="395.0" x2="811.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,423.0 816.3,423.0 811.3,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="395.0" x2="188.7" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,423.0 193.7,423.0 188.7,431.0" fill="#0f766e"/><rect x="111.5" y="404.0" width="154.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Anterior (vejiga) · este caso</tspan></text><rect x="435.0" y="404.0" width="129.9" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Apical (útero o cúpula)</tspan></text><rect x="762.7" y="404.0" width="97.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Posterior (recto)</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Prolapso: ¿qué compartimento cae?</tspan></text><rect x="40.0" y="431.0" width="297.3" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="460.1" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">COLPORRAFIA ANTERIOR</tspan></text><text x="188.7" y="483.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Cistocele</tspan><tspan x="188.7" dy="17">Polaquiuria, bulto</tspan></text><rect x="351.3" y="431.0" width="297.3" height="91.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Histerectomía vaginal o</tspan><tspan x="500.0" dy="18.5">colposacropexia</tspan></text><text x="500.0" y="500.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Histerocele</tspan></text><rect x="662.7" y="431.0" width="297.3" height="91.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="460.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Colporrafia posterior</tspan></text><text x="811.3" y="483.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Rectocele</tspan><tspan x="811.3" dy="17">Dificultad para defecar</tspan></text><text x="40.0" y="562.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="574.9" width="920.0" height="342.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="588.9" width="271.4" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="191.7" y="608.9" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="191.7" dy="0">ESTADIOS DEL PROLAPSO (POP-Q)</tspan></text><text x="343.4" y="608.9" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="599"><tspan x="343.4" dy="0">Se mide el punto más descendido respecto al himen (en cm).</tspan></text><rect x="56.0" y="648.9" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="649.5" width="166.8" height="82.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="140.0" y="676.9" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">0</tspan></text><text x="140.0" y="696.9" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">Sin prolapso</tspan></text><rect x="236.0" y="648.9" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="236.6" y="649.5" width="166.8" height="82.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="320.0" y="676.9" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">I</tspan></text><text x="320.0" y="696.9" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">&gt; 1 cm sobre el</tspan><tspan x="320.0" dy="19">himen</tspan></text><rect x="416.0" y="648.9" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="416.6" y="649.5" width="166.8" height="82.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="500.0" y="676.9" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">II</tspan></text><text x="500.0" y="696.9" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">± 1 cm del himen</tspan></text><circle cx="432.0" cy="740.9" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="442.0" y="744.9" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Se ve al pujar</tspan></text><rect x="596.0" y="648.9" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="649.5" width="166.8" height="82.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="680.0" y="676.9" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">III</tspan></text><text x="680.0" y="696.9" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">&gt; 1 cm fuera del</tspan><tspan x="680.0" dy="19">himen</tspan></text><circle cx="612.0" cy="740.9" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="744.9" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">Sin eversión total</tspan></text><rect x="776.0" y="648.9" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="649.5" width="166.8" height="82.0" rx="9" fill="#fecaca" stroke="none" stroke-width="0"/><text x="860.0" y="676.9" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">IV</tspan></text><text x="860.0" y="696.9" font-size="14" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">Eversión total</tspan></text><text x="56.0" y="795.9" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="804.9" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="819.9" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="819.9" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Siente un bulto en la vagina (suele ser ≥ II)</tspan></text><rect x="56.0" y="826.9" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="841.9" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="841.9" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">El estadio se mide al examinarla</tspan></text><rect x="56.0" y="863.9" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="886.9" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Sintomático: pesario o colporrafia anterior; descartar incontinencia oculta.</tspan></text><text x="40.0" y="956.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="966.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="997.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="969.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="989.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Colporrafía vaginal</tspan><tspan x="285.0" dy="17">anterior</tspan></text><text x="435.0" y="989.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Histerectomía</tspan><tspan x="435.0" dy="17">vaginal</tspan></text><text x="585.0" y="997.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Colposuspensión</tspan></text><text x="735.0" y="989.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Suspensión</tspan><tspan x="735.0" dy="17">colposacra</tspan></text><text x="885.0" y="989.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Pesario como</tspan><tspan x="885.0" dy="17">definitivo</tspan></text><rect x="40.0" y="1020.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1020.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1057.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="1049.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: repara la pared</tspan><tspan x="285.0" dy="16">anterior</tspan></text><text x="435.0" y="1049.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es para el apical</tspan><tspan x="435.0" dy="16">(útero)</tspan></text><text x="585.0" y="1041.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es para la</tspan><tspan x="585.0" dy="16">incontinencia de</tspan><tspan x="585.0" dy="16">esfuerzo</tspan></text><text x="735.0" y="1049.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es para el apical</tspan><tspan x="735.0" dy="16">(cúpula)</tspan></text><text x="885.0" y="1049.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es alternativa, no</tspan><tspan x="885.0" dy="16">definitivo</tspan></text><rect x="40.0" y="966.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1110.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1138.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1160.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Prolapso sintomático: pesario (si no desea cirugía) o cirugía según el compartimento.</tspan><tspan x="58.0" dy="18">• Antes: estudiar incontinencia de esfuerzo oculta (puede aparecer al corregir el cistocele).</tspan><tspan x="58.0" dy="18">• Ejercicios de piso pélvico en prolapsos leves.</tspan></text><text x="58.0" y="1218.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG n.º 214 (2019; prolapso); IUGA/ICS, POP-Q.</tspan></text></svg>