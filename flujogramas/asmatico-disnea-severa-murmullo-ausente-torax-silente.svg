"28.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="386.0" cy="353.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="386.0" y="357.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">!</tspan></text><text x="404.0" y="357.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">FC 110, FR 22, SatO₂ 91 %</tspan></text><rect x="370.0" y="371.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="385.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="389.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="389.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Disnea grave</tspan></text><rect x="370.0" y="413.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="446.0" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="446.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="435.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Leve-moderada</tspan></text><text x="430.0" y="452.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Habla en frases, FR &lt; 30, SatO₂ 90-95 %</tspan></text><text x="430.0" y="468.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Salbutamol y corticoide</tspan></text><rect x="370.0" y="487.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="520.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="520.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="509.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Grave</tspan></text><text x="430.0" y="526.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Habla en palabras, FR &gt; 30, SatO₂ &lt; 90 %</tspan></text><text x="430.0" y="542.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">+ ipratropio, magnesio</tspan></text><rect x="370.0" y="561.0" width="590.0" height="66.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/><circle cx="400.0" cy="594.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="594.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="583.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Riesgo vital</tspan></text><text x="430.0" y="600.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Tórax silente, cianosis, confusión</tspan></text><text x="430.0" y="616.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">UCI, preparar intubación</tspan></text><rect x="854.6" y="550.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="565.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="739.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="770.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Frecuencia cardiaca</tspan><tspan x="285.0" dy="17">de 110 X'</tspan></text><rect x="363.0" y="742.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tórax silente</tspan></text><text x="585.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Saturación O2 91%</tspan></text><text x="735.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Frecuencia</tspan><tspan x="735.0" dy="17">respiratoria de 22 X'</tspan></text><text x="885.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Temperatura de 37</tspan><tspan x="885.0" dy="17">°C</tspan></text><rect x="40.0" y="793.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="793.0" width="144.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="814.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Criterio de gravedad?</tspan></text><text x="285.0" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: rango moderado</tspan></text><text x="435.0" y="814.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: riesgo vital</tspan></text><text x="585.0" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: rango moderado</tspan></text><text x="735.0" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: &lt; 30</tspan></text><text x="885.0" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: normal</tspan></text><rect x="40.0" y="739.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="851.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="879.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="901.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Oxígeno (meta 93-95 %), salbutamol + ipratropio repetidos, corticoide sistémico.</tspan><tspan x="58.0" dy="18">• Sulfato de magnesio EV; UCI y preparar intubación.</tspan><tspan x="58.0" dy="18">• El tórax silente significa que casi no entra aire: no confundirlo con mejoría.</tspan></text><text x="58.0" y="959.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA 2025.</tspan></text></svg>