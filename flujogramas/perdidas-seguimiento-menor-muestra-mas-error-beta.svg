<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="842" viewBox="0 0 1000 842" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Pérdidas de seguimiento y potencia"><title>Pérdidas de seguimiento y potencia</title><rect x="0.75" y="0.75" width="998.5" height="840.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">SALUD PÚBLICA ENAM: ERROR TIPO II</tspan></text><rect x="436.0" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="490.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="490.7" dy="0">SALUD PÚBLICA</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Error tipo II (β)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">No detectar una diferencia que sí existe (falso negativo)</tspan><tspan x="58.0" dy="17">Depende del tamaño de muestra: si baja n, sube β</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Estudio prospectivo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Algunos sujetos se pierden o abandonan</tspan><tspan x="640.0" dy="16">¿Qué pasa con el error tipo II?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CADENA DE EFECTOS</tspan></text><rect x="42.0" y="269.0" width="226.0" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="155.0" y="287.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">PÉRDIDAS</tspan></text><text x="155.0" y="477.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">Seguimiento</tspan></text><rect x="272.0" y="269.0" width="226.0" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="385.0" y="287.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">MUESTRA</tspan></text><text x="385.0" y="477.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">n baja</tspan></text><rect x="502.0" y="269.0" width="226.0" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="287.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">POTENCIA</tspan></text><text x="615.0" y="477.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">1 − β</tspan></text><rect x="732.0" y="269.0" width="226.0" height="216.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="845.0" y="287.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">ERROR Β</tspan></text><text x="845.0" y="477.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">Resultado</tspan></text><path d="M 60.0,367.2 L 206.7,372.3 L 353.3,387.6 L 500.0,402.9 L 646.7,413.1 L 793.3,423.3 L 940.0,428.4" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M 60.0,448.8 L 206.7,443.7 L 353.3,428.4 L 500.0,413.1 L 646.7,402.9 L 793.3,392.7 L 940.0,387.6" fill="none" stroke="#e11d48" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="58.0" y1="309.0" x2="80.0" y2="309.0" stroke="#0ea5e9" stroke-width="3"/><text x="86.0" y="313.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0ea5e9" text-anchor="start" data-max="200"><tspan x="86.0" dy="0">Potencia</tspan></text><line x1="144.8" y1="309.0" x2="166.8" y2="309.0" stroke="#e11d48" stroke-width="3"/><text x="172.8" y="313.0" font-size="10.5" font-weight="700" font-style="normal" fill="#e11d48" text-anchor="start" data-max="200"><tspan x="172.8" dy="0">Error β</tspan></text><line x1="845.0" y1="271.0" x2="845.0" y2="461.0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><rect x="799.6" y="444.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="845.0" y="459.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="845.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="499.0" width="214.0" height="90.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="155.0" y="535.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Abandonos</tspan></text><text x="155.0" y="559.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Sujetos que se van</tspan></text><rect x="278.0" y="499.0" width="214.0" height="90.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="385.0" y="535.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Menos datos</tspan></text><text x="385.0" y="559.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Menos precisión</tspan></text><rect x="508.0" y="499.0" width="214.0" height="90.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="535.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Disminuye</tspan></text><text x="615.0" y="559.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Cuesta ver diferencias</tspan></text><rect x="738.0" y="499.0" width="214.0" height="90.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="845.0" y="535.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">SE INCREMENTA</tspan></text><text x="845.0" y="559.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Más falsos negativos</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ERROR TIPO II · MARCADO EL CORRECTO</tspan></text><rect x="40.0" y="639.0" width="114.1" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="97.1" y="658.5" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="97.1" dy="0">✓ Se incrementa</tspan></text><rect x="162.1" y="639.0" width="87.4" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="205.8" y="658.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="205.8" dy="0">Disminuye</tspan></text><rect x="257.6" y="639.0" width="99.1" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="307.1" y="658.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="307.1" dy="0">Se mantiene</tspan></text><rect x="364.6" y="639.0" width="95.0" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="412.1" y="658.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="412.1" dy="0">Es aleatorio</tspan></text><rect x="40.0" y="693.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="721.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="743.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El error tipo I (α) lo fija el investigador (0,05).</tspan><tspan x="58.0" dy="18">• Las pérdidas también pueden introducir sesgo si no son al azar.</tspan><tspan x="58.0" dy="18">• Calcular la muestra previendo 10-20 % de pérdidas.</tspan></text><text x="58.0" y="801.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis. Epidemiología 6.ª ed. (2019)</tspan></text></svg>