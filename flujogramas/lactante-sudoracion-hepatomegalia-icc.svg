<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1327" viewBox="0 0 1000 1327" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante de 4 meses con mala ganancia de peso, sudoración al lactar, polipnea, taquicardia y hepatomegalia: insuficiencia cardiaca congestiva"><title>Lactante de 4 meses con mala ganancia de peso, sudoración al lactar, polipnea, taquicardia y hepatomegalia: insuficiencia cardiaca congestiva</title><rect x="0.75" y="0.75" width="998.5" height="1326.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cardiopatías congénitas · insuficiencia cardiaca en el lactante</tspan></text><rect x="565.1" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="621.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="621.6" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Insuficiencia cardiaca en el lactante</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Suele deberse a un cortocircuito izquierda-derecha (CIV, ductus, canal AV) que inunda los</tspan><tspan x="58.0" dy="17">pulmones.</tspan><tspan x="58.0" dy="17">Aparece a las 4-8 semanas, cuando bajan las resistencias pulmonares.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 4 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Desde el nacimiento: poca ganancia de peso,</tspan><tspan x="640.0" dy="16">sudoración profusa, lactancia entrecortada, polipnea.</tspan><tspan x="640.0" dy="16">Afebril, pálido, sibilantes, taquicardia; hígado a 4 cm</tspan><tspan x="640.0" dy="16">del reborde.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="733.5" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#94a3b8"/><line x1="733.5" y1="423.0" x2="733.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,451.0 738.5,451.0 733.5,459.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#0f766e"/><rect x="225.0" y="432.0" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí (este caso)</tspan></text><rect x="656.3" y="432.0" width="154.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No, con fiebre y crepitantes</tspan></text><polygon points="240.0,358.0 266.0,323.0 734.0,323.0 760.0,358.0 734.0,393.0 266.0,393.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="358.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="363.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="354.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Lactante que suda al lactar y no gana peso: ¿hay</tspan><tspan x="519.0" dy="17">hepatomegalia y taquicardia?</tspan></text><rect x="40.0" y="459.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">INSUFICIENCIA CARDIACA</tspan></text><text x="266.5" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Ecocardiograma</tspan><tspan x="266.5" dy="17">Furosemida, IECA</tspan></text><rect x="507.0" y="459.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="495.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Neumonía</tspan></text><text x="733.5" y="518.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Rx, antibiótico</tspan></text><text x="40.0" y="589.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="601.5" width="920.0" height="366.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="615.5" width="520.7" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="316.4" y="635.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="316.4" dy="0">CLASIFICACIÓN DE ROSS (INSUFICIENCIA CARDIACA EN EL LACTANTE)</tspan></text><text x="592.7" y="627.0" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="592.7" dy="0">Versión pediátrica de la clase funcional NYHA, basada en</tspan><tspan x="592.7" dy="17">la alimentación y el crecimiento.</tspan></text><rect x="56.0" y="679.5" width="213.0" height="137.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="680.1" width="211.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="162.5" y="707.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">CLASE I</tspan></text><text x="162.5" y="727.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Sin síntomas</tspan></text><circle cx="72.0" cy="752.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="756.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Sin limitación</tspan></text><rect x="281.0" y="679.5" width="213.0" height="137.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="680.1" width="211.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="387.5" y="707.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">CLASE II</tspan></text><text x="387.5" y="727.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Leve</tspan></text><circle cx="297.0" cy="752.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="756.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Taquipnea o sudor leve al lactar</tspan></text><rect x="506.0" y="679.5" width="213.0" height="137.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="680.1" width="211.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="612.5" y="707.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">CLASE III</tspan></text><text x="612.5" y="727.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Moderada</tspan></text><circle cx="522.0" cy="752.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="756.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Taquipnea o sudor marcado al</tspan><tspan x="532.0" dy="16">lactar</tspan></text><circle cx="522.0" cy="791.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="795.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Tomas largas, no crece</tspan></text><rect x="731.0" y="679.5" width="213.0" height="137.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="732.2" y="680.7" width="210.6" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="837.5" y="707.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">CLASE IV</tspan></text><text x="837.5" y="727.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Grave</tspan></text><circle cx="747.0" cy="752.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="757.0" y="756.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Taquipnea, tiraje o sudor en</tspan><tspan x="757.0" dy="16">reposo</tspan></text><rect x="792.1" y="668.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="837.5" y="683.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="837.5" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="846.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="855.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="870.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="870.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Polipnea que aumenta en reposo en los últimos días</tspan></text><rect x="56.0" y="877.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="892.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="892.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">No gana peso y suda al lactar</tspan></text><rect x="56.0" y="914.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="937.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Hospitalizar, ecocardiograma, furosemida e inicio de IECA.</tspan></text><text x="40.0" y="1007.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1017.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1057.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1057.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Miocarditis viral</tspan></text><text x="435.0" y="1040.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Síndrome</tspan><tspan x="435.0" dy="17">obstructivo</tspan><tspan x="435.0" dy="17">bronquial</tspan></text><text x="585.0" y="1048.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Bronconeumonía</tspan><tspan x="585.0" dy="17">bacteriana</tspan></text><rect x="663.0" y="1020.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1048.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Insuficiencia</tspan><tspan x="735.0" dy="17">cardíaca congestiva</tspan></text><text x="885.0" y="1048.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Anemia ferropénica</tspan><tspan x="885.0" dy="17">severa</tspan></text><rect x="40.0" y="1088.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1088.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1125.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuadro?</tspan></text><text x="285.0" y="1109.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Aguda tras un virus;</tspan><tspan x="285.0" dy="16">aquí desde el</tspan><tspan x="285.0" dy="16">nacimiento</tspan></text><text x="435.0" y="1117.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no explica la</tspan><tspan x="435.0" dy="16">hepatomegalia</tspan></text><text x="585.0" y="1125.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: afebril, sin foco</tspan></text><text x="735.0" y="1117.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: sudoración al lactar</tspan><tspan x="735.0" dy="16">+ hepatomegalia</tspan></text><text x="885.0" y="1117.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No explica la</tspan><tspan x="885.0" dy="16">sudoración ni el hígado</tspan></text><rect x="40.0" y="1017.5" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1178.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1206.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1228.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ecocardiograma para hallar la cardiopatía.</tspan><tspan x="58.0" dy="18">• Furosemida, IECA y leche hipercalórica; corregir la anemia.</tspan><tspan x="58.0" dy="18">• Cirugía o cateterismo según la lesión antes de que dañe los pulmones.</tspan></text><text x="58.0" y="1286.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ISHLT, insuficiencia cardiaca pediátrica; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>