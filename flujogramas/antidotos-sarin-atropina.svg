<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1058" viewBox="0 0 1000 1058" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ataque con gas sarín (inhibidor de la colinesterasa) con sobreestimulación colinérgica: atropina EV"><title>Ataque con gas sarín (inhibidor de la colinesterasa) con sobreestimulación colinérgica: atropina EV</title><rect x="0.75" y="0.75" width="998.5" height="1057.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · agentes nerviosos</tspan></text><rect x="388.4" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="467.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="467.8" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Agentes nerviosos (sarín)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Organofosforados de guerra: bloquean la acetilcolinesterasa y la acetilcolina se acumula.</tspan><tspan x="58.0" dy="17">Muerte por broncorrea, broncoespasmo y parálisis respiratoria.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Atentado del metro de Tokio (1995)</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">14 muertos.</tspan><tspan x="640.0" dy="16">Sobreestimulación colinérgica.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="733.5" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#94a3b8"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#0f766e"/><rect x="208.1" y="388.0" width="116.8" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Antídoto (este caso)</tspan></text><rect x="672.7" y="388.0" width="121.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Exposición a cianuro</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Exceso colinérgico (sarín, organofosforado)</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">ATROPINA EV</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Hasta secar los bronquios</tspan><tspan x="266.5" dy="17">+ pralidoxima, diazepam</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Hidroxocobalamina</tspan></text><text x="733.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Nitritos como alternativa</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SÍNDROME CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="557.5" width="920.0" height="191.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="599.5" x2="938.0" y2="599.5" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="599.5" x2="62.0" y2="607.5" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="599.5" x2="938.0" y2="607.5" stroke="#0f766e" stroke-width="2"/><rect x="383.9" y="587.5" width="232.1" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="603.5" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="218"><tspan x="500.0" dy="0">EFECTOS MUSCARÍNICOS (DUMBELS)</tspan></text><rect x="56.0" y="619.5" width="168.0" height="82.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="94.0" dy="0">Miosis</tspan></text><text x="68.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="68.0" dy="0">Pupila puntiforme</tspan></text><rect x="236.0" y="619.5" width="168.0" height="82.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="256.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="256.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">2</tspan></text><text x="274.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="274.0" dy="0">Broncorrea y</tspan><tspan x="274.0" dy="17">broncoespasmo</tspan></text><text x="248.0" y="685.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="248.0" dy="0">Causa de muerte</tspan></text><rect x="416.0" y="619.5" width="168.0" height="82.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="436.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="436.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="436.0" dy="0">3</tspan></text><text x="454.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="454.0" dy="0">Bradicardia</tspan></text><text x="428.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="428.0" dy="0">Vagal</tspan></text><rect x="596.0" y="619.5" width="168.0" height="82.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="616.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="616.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="616.0" dy="0">4</tspan></text><text x="634.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="634.0" dy="0">Salivación y</tspan><tspan x="634.0" dy="17">lagrimeo</tspan></text><text x="608.0" y="685.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="608.0" dy="0">Secreciones</tspan></text><rect x="776.0" y="619.5" width="168.0" height="82.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="796.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="796.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="796.0" dy="0">5</tspan></text><text x="814.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="814.0" dy="0">Diarrea y vómitos</tspan></text><text x="788.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="788.0" dy="0">Digestivo</tspan></text><text x="56.0" y="728.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">La atropina revierte estos efectos; la pralidoxima trata la debilidad muscular (nicotínica).</tspan></text><text x="40.0" y="788.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="798.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="821.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="801.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Atropina</tspan></text><text x="435.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Flumazenil</tspan></text><text x="585.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Nitrito de amilo</tspan></text><text x="735.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Dimercaprol</tspan></text><text x="885.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Naloxona</tspan></text><rect x="40.0" y="835.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="835.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="864.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Antídoto?</tspan></text><text x="285.0" y="856.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: bloquea el receptor</tspan><tspan x="285.0" dy="16">muscarínico</tspan></text><text x="435.0" y="856.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es para</tspan><tspan x="435.0" dy="16">benzodiacepinas</tspan></text><text x="585.0" y="864.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es para cianuro</tspan></text><text x="735.0" y="856.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es para metales</tspan><tspan x="735.0" dy="16">pesados</tspan></text><text x="885.0" y="864.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es para opioides</tspan></text><rect x="40.0" y="798.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="909.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="937.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="959.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Atropina EV en dosis crecientes hasta secar los bronquios (no por las pupilas).</tspan><tspan x="58.0" dy="18">• Pralidoxima pronto (antes de que la unión se vuelva permanente); diazepam para las convulsiones.</tspan><tspan x="58.0" dy="18">• Descontaminar con protección: el personal también se intoxica.</tspan></text><text x="58.0" y="1017.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, manejo de intoxicaciones por plaguicidas; Goldfrank's Toxicologic Emergencies 11.ª ed. (2019).</tspan></text></svg>