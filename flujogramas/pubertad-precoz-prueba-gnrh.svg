t-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Pubertad antes de los 8 años: ¿LH tras GnRH?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">PUBERTAD PRECOZ CENTRAL</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">RM de hipófisis</tspan><tspan x="266.5" dy="17">Análogos de GnRH</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Periférica</tspan></text><text x="733.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Ovario, suprarrenal, McCune-Albright</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="557.5" width="920.0" height="342.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="571.5" width="249.7" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="180.9" y="591.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="180.9" dy="0">ESTADIOS DE TANNER (MAMAS)</tspan></text><text x="321.7" y="591.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="620"><tspan x="321.7" dy="0">Desarrollo mamario en las niñas.</tspan></text><rect x="56.0" y="631.5" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="632.1" width="166.8" height="82.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="140.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">M1</tspan></text><text x="140.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">Prepuberal</tspan></text><circle cx="72.0" cy="723.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="727.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">Sin tejido mamario</tspan></text><rect x="236.0" y="631.5" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="236.6" y="632.1" width="166.8" height="82.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="320.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">M2</tspan></text><text x="320.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">Botón mamario</tspan></text><circle cx="252.0" cy="723.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="262.0" y="727.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="262.0" dy="0">Inicio de la pubertad</tspan></text><rect x="416.0" y="631.5" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="416.6" y="632.1" width="166.8" height="82.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="500.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">M3</tspan></text><text x="500.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">Mama y areola</tspan><tspan x="500.0" dy="19">crecen</tspan></text><circle cx="432.0" cy="723.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="442.0" y="727.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Sin separar contornos</tspan></text><rect x="596.0" y="631.5" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="632.1" width="166.8" height="82.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="680.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">M4</tspan></text><text x="680.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">Areola</tspan><tspan x="680.0" dy="19">sobreelevada</tspan></text><circle cx="612.0" cy="723.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="727.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">Doble contorno</tspan></text><rect x="776.0" y="631.5" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="632.1" width="166.8" height="82.0" rx="9" fill="#fecaca" stroke="none" stroke-width="0"/><text x="860.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">M5</tspan></text><text x="860.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">Adulta</tspan></text><circle cx="792.0" cy="723.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="802.0" y="727.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">Contorno único</tspan></text><text x="56.0" y="778.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">PARA UBICAR ESTE CASO</tspan></text><rect x="56.0" y="787.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="802.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="802.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Telarquia a los 7 años: al menos M2 antes de los 8</tspan></text><rect x="56.0" y="809.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="824.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="824.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Edad ósea adelantada 2 años</tspan></text><rect x="56.0" y="846.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="869.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Prueba de GnRH; si es central, RM y análogos de GnRH.</tspan></text><text x="40.0" y="939.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="949.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="989.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="952.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="972.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Gonadotropinas</tspan><tspan x="285.0" dy="17">tras estímulo con</tspan><tspan x="285.0" dy="17">GnRH</tspan></text><text x="435.0" y="972.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tomografía</tspan><tspan x="435.0" dy="17">computada pélvica</tspan><tspan x="435.0" dy="17">con contraste</tspan></text><text x="585.0" y="989.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Dosaje de FSH</tspan></text><text x="735.0" y="980.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ecografía Doppler</tspan><tspan x="735.0" dy="17">de ovarios</tspan></text><text x="885.0" y="980.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Dosaje de estradiol</tspan><tspan x="885.0" dy="17">aislado</tspan></text><rect x="40.0" y="1020.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1020.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1049.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Estudio?</tspan></text><text x="285.0" y="1041.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: define si el eje está</tspan><tspan x="285.0" dy="16">activo</tspan></text><text x="435.0" y="1049.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no muestra el eje</tspan></text><text x="585.0" y="1049.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sola no distingue</tspan></text><text x="735.0" y="1041.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: ve ovarios, no el</tspan><tspan x="735.0" dy="16">eje</tspan></text><text x="885.0" y="1049.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no dice el origen</tspan></text><rect x="40.0" y="949.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1094.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1122.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1144.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Prueba de GnRH (o LH basal ultrasensible): pico de LH &gt; 5 UI/L = central.</tspan><tspan x="58.0" dy="18">• Central en niñas: casi siempre idiopática, pero hacer RM de hipófisis.</tspan><tspan x="58.0" dy="18">• Tratamiento: análogos de GnRH (leuprorelina o triptorelina) para frenar la pubertad y proteger la talla final.</tspan></text><text x="58.0" y="1202.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Consenso internacional sobre análogos de GnRH en pubertad precoz (2019); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>