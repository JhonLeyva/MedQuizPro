<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1003" viewBox="0 0 1000 1003" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los aminoglucósidos dañan el VIII par: toxicidad vestibular y coclear"><title>Los aminoglucósidos dañan el VIII par: toxicidad vestibular y coclear</title><rect x="0.75" y="0.75" width="998.5" height="1001.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · ototoxicidad de los aminoglucósidos</tspan></text><rect x="509.6" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="581.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="581.6" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aminoglucósidos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Gentamicina, amikacina, estreptomicina y kanamicina.</tspan><tspan x="58.0" dy="17">Se acumulan en el líquido del oído interno y dañan las células ciliadas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de farmacología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿A qué nivel se presenta la disfunción neurológica</tspan><tspan x="640.0" dy="16">tóxica de los aminoglucósidos?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RECORRIDO DEL AMINOGLUCÓSIDO HASTA EL VIII PAR</tspan></text><rect x="40.0" y="269.0" width="920.0" height="100.0" rx="0" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="269.0" width="112.0" height="100.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Sangre</tspan></text><rect x="40.0" y="369.0" width="920.0" height="83.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="369.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="410.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Líquidos del</tspan><tspan x="96.0" dy="14">oído interno</tspan></text><rect x="40.0" y="452.0" width="920.0" height="116.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="452.0" width="112.0" height="116.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="514.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Células ciliadas</tspan></text><line x1="322.0" y1="354.0" x2="322.0" y2="373.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,373.0 327.0,373.0 322.0,382.0" fill="#0f766e"/><line x1="322.0" y1="437.0" x2="303.3" y2="458.2" stroke="#0f766e" stroke-width="2.2"/><polygon points="299.5,454.9 307.0,461.6 297.3,465.0" fill="#0f766e"/><line x1="422.7" y1="493.5" x2="430.7" y2="497.8" stroke="#ea580c" stroke-width="2.2"/><polygon points="428.4,502.2 433.1,493.4 438.7,502.0" fill="#ea580c"/><line x1="689.3" y1="502.0" x2="697.3" y2="506.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="695.0,510.4 699.5,501.5 705.3,510.0" fill="#ea580c"/><rect x="172.0" y="284.0" width="300.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="300.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Gentamicina, amikacina, estreptomicina o</tspan><tspan x="182.0" dy="16">kanamicina</tspan></text><text x="182.0" y="333.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Pasan de la sangre al oído interno</tspan></text><circle cx="172.0" cy="284.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="288.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="384.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="400.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Se acumulan en perilinfa y endolinfa</tspan></text><text x="182.0" y="417.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Quedan más tiempo que en la sangre</tspan></text><circle cx="172.0" cy="384.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="388.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="172.0" y="467.0" width="250.7" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="231"><tspan x="182.0" dy="0">Entran a las células ciliadas</tspan></text><text x="182.0" y="500.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="231"><tspan x="182.0" dy="0">Estrés oxidativo y muerte celular</tspan></text><circle cx="172.0" cy="467.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="471.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">3</tspan></text><rect x="438.7" y="467.0" width="250.7" height="70.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="448.7" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="231"><tspan x="448.7" dy="0">Rama vestibular: vértigo, ataxia y</tspan><tspan x="448.7" dy="16">nistagmo</tspan></text><text x="448.7" y="516.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="231"><tspan x="448.7" dy="0">Sobre todo con estreptomicina y gentamicina</tspan></text><circle cx="438.7" cy="467.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="438.7" y="471.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.7" dy="0">4</tspan></text><rect x="705.3" y="467.0" width="250.7" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="715.3" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="231"><tspan x="715.3" dy="0">Rama coclear: tinnitus y sordera de</tspan><tspan x="715.3" dy="16">agudos</tspan></text><text x="715.3" y="516.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="231"><tspan x="715.3" dy="0">Sobre todo con amikacina y kanamicina; casi</tspan><tspan x="715.3" dy="14.5">siempre irreversible</tspan></text><circle cx="705.3" cy="467.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="705.3" y="471.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="705.3" dy="0">5</tspan></text><rect x="40.0" y="586.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="612.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Aminoglucósidos = VIII par: vestibular y coclear</tspan></text><text x="60.0" y="631.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La nefrotoxicidad es la otra toxicidad principal, y es reversible.</tspan></text><text x="40.0" y="698.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="708.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="739.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="739.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Coclear y olivar</tspan></text><text x="435.0" y="730.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cerebeloso y</tspan><tspan x="435.0" dy="17">vestibular</tspan></text><rect x="513.0" y="711.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="739.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Vestibular y coclear</tspan></text><text x="735.0" y="739.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Talámico y cortical</tspan></text><text x="885.0" y="730.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipotalámico y</tspan><tspan x="885.0" dy="17">talámico</tspan></text><rect x="40.0" y="762.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="762.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="791.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dónde daña?</tspan></text><text x="285.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la ototoxicidad no</tspan><tspan x="285.0" dy="16">es olivar ni cerebelosa</tspan></text><text x="435.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el cerebelo no es</tspan><tspan x="435.0" dy="16">el sitio característico</tspan></text><text x="585.0" y="783.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: las dos ramas del</tspan><tspan x="585.0" dy="16">VIII par</tspan></text><text x="735.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no hay daño</tspan><tspan x="735.0" dy="16">talámico ni cortical</tspan></text><text x="885.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no hay daño</tspan><tspan x="885.0" dy="16">hipotalámico</tspan></text><rect x="40.0" y="708.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="836.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="864.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="886.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Vestibulotoxicidad: vértigo, ataxia, nistagmo y oscilopsia; más con estreptomicina y gentamicina.</tspan><tspan x="58.0" dy="18">• Cocleotoxicidad: tinnitus y pérdida auditiva neurosensorial de agudos, casi siempre irreversible; más con amikacina y kanamicina.</tspan><tspan x="58.0" dy="18">• La otra toxicidad principal es la nefrotoxicidad (necrosis tubular aguda), reversible.</tspan><tspan x="58.0" dy="18">• Riesgo: edad avanzada, dosis acumulada, insuficiencia renal y diuréticos de asa; se previene con dosis diaria única y niveles.</tspan></text><text x="58.0" y="962.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman y Gilman Bases Farmacológicas de la Terapéutica 14.ª ed. (2023); Katzung Farmacología Básica y Clínica 16.ª ed. (2024)</tspan></text></svg>