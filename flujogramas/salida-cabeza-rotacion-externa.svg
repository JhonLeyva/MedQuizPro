<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="959" viewBox="0 0 1000 959" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tras la salida de la cabeza fetal, el siguiente movimiento cardinal es la rotación externa (restitución), que alinea los hombros"><title>Tras la salida de la cabeza fetal, el siguiente movimiento cardinal es la rotación externa (restitución), que alinea los hombros</title><rect x="0.75" y="0.75" width="998.5" height="957.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parto · mecanismo del parto en vértice</tspan></text><rect x="428.3" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="515.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="515.5" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Movimientos cardinales del parto</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El feto se acomoda al canal de la pelvis con 7 movimientos en orden.</tspan><tspan x="58.0" dy="17">Después de salir la cabeza, gira hacia el muslo de la madre (restitución) para que salgan</tspan><tspan x="58.0" dy="17">los hombros.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Parto vaginal a término</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ya salió la cabeza fetal.</tspan><tspan x="640.0" dy="16">¿Qué movimiento sigue?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS 7 MOVIMIENTOS CARDINALES, EN ORDEN</tspan></text><line x1="178.0" y1="295.0" x2="362.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="408.0" y1="295.0" x2="592.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="638.0" y1="295.0" x2="822.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><circle cx="155.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="155.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="155.0" dy="0">1</tspan></text><rect x="45.0" y="329.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="155.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Encajamiento</tspan></text><text x="155.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">El diámetro mayor de la cabeza pasa el</tspan><tspan x="155.0" dy="16">estrecho superior</tspan></text><circle cx="385.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="385.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="385.0" dy="0">2</tspan></text><rect x="275.0" y="329.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="385.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Descenso</tspan></text><text x="385.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Progresa por el canal</tspan></text><circle cx="615.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="615.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="615.0" dy="0">3</tspan></text><rect x="505.0" y="329.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Flexión</tspan></text><text x="615.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Mentón al pecho: presenta el diámetro</tspan><tspan x="615.0" dy="16">menor</tspan></text><circle cx="845.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="845.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="845.0" dy="0">4</tspan></text><rect x="735.0" y="329.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="845.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Rotación interna</tspan></text><text x="845.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Occipucio gira hacia el pubis</tspan></text><line x1="216.3" y1="452.0" x2="477.0" y2="452.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="452.0" x2="783.7" y2="452.0" stroke="#99f6e4" stroke-width="6"/><circle cx="193.3" cy="452.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="193.3" y="456.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="193.3" dy="0">5</tspan></text><rect x="45.0" y="486.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="193.3" y="506.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Extensión</tspan></text><text x="193.3" y="523.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Sale la cabeza (desprendimiento)</tspan></text><circle cx="500.0" cy="452.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="500.0" y="456.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">6</tspan></text><rect x="351.7" y="486.0" width="296.7" height="59.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="500.0" y="506.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Rotación externa</tspan></text><text x="500.0" y="523.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Restitución: gira hacia el muslo de la madre</tspan></text><rect x="447.9" y="534.0" width="104.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="549.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ SIGUE AHORA</tspan></text><circle cx="806.7" cy="452.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="806.7" y="456.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="806.7" dy="0">7</tspan></text><rect x="658.3" y="486.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="806.7" y="506.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Expulsión</tspan></text><text x="806.7" y="523.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Salen hombros y cuerpo</tspan></text><rect x="40.0" y="577.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="603.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Salió la cabeza → rotación externa (restitución)</tspan></text><text x="60.0" y="622.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Alinea los hombros con el diámetro anteroposterior de la salida de la pelvis.</tspan></text><text x="40.0" y="689.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="699.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="721.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="721.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Encajamiento</tspan></text><text x="435.0" y="721.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Flexión</tspan></text><text x="585.0" y="721.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Rotación interna</tspan></text><rect x="663.0" y="702.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="721.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Rotación externa</tspan></text><text x="885.0" y="721.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Descenso</tspan></text><rect x="40.0" y="736.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="736.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="765.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Siguiente movimiento?</tspan></text><text x="285.0" y="765.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ocurre al inicio</tspan></text><text x="435.0" y="757.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es antes del</tspan><tspan x="435.0" dy="16">descenso de la cabeza</tspan></text><text x="585.0" y="757.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es antes de la</tspan><tspan x="585.0" dy="16">salida de la cabeza</tspan></text><text x="735.0" y="757.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: restitución tras salir</tspan><tspan x="735.0" dy="16">la cabeza</tspan></text><text x="885.0" y="757.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: acompaña todo el</tspan><tspan x="885.0" dy="16">trabajo de parto</tspan></text><rect x="40.0" y="699.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="810.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="838.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="860.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Orden: encajamiento → descenso → flexión → rotación interna → extensión → rotación externa → expulsión.</tspan><tspan x="58.0" dy="18">• La rotación externa devuelve la cabeza a la posición del dorso y coloca los hombros en el diámetro anteroposterior.</tspan><tspan x="58.0" dy="18">• Si los hombros no salen tras la cabeza: distocia de hombros (McRoberts y presión suprapúbica).</tspan></text><text x="58.0" y="918.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed. (2022); MINSA Perú, guía de atención del parto.</tspan></text></svg>