<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1123" viewBox="0 0 1000 1123" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el prematuro de 29 semanas con distrés respiratorio, tras estabilizar con CPAP se da surfactante"><title>En el prematuro de 29 semanas con distrés respiratorio, tras estabilizar con CPAP se da surfactante</title><rect x="0.75" y="0.75" width="998.5" height="1121.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · distrés respiratorio del prematuro</tspan></text><rect x="488.5" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="537.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="537.5" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de distrés respiratorio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad de membrana hialina por déficit de surfactante de los neumocitos tipo II.</tspan><tspan x="58.0" dy="17">Es más frecuente cuanto menor la edad gestacional.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Prematuro de 29 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Nacido por cesárea con marcada dificultad respiratoria.</tspan><tspan x="640.0" dy="16">¿Terapia indicada tras la atención de urgencia?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL CONTROL PRENATAL AL TRATAMIENTO DEL RECIÉN NACIDO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="333.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Prevención</tspan><tspan x="94.0" dy="14">prenatal</tspan></text><rect x="40.0" y="397.0" width="920.0" height="128.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="465.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Sala de partos</tspan></text><rect x="40.0" y="525.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="525.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="589.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Tratamiento del</tspan><tspan x="94.0" dy="14">distrés</tspan></text><line x1="348.0" y1="333.0" x2="355.0" y2="333.0" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="333.0" x2="355.0" y2="444.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="444.5" x2="353.0" y2="444.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,449.5 353.0,439.5 362.0,444.5" fill="#0f766e"/><line x1="552.0" y1="444.5" x2="559.0" y2="444.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="444.5" x2="559.0" y2="581.0" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="581.0" x2="557.0" y2="581.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,586.0 557.0,576.0 566.0,581.0" fill="#ea580c"/><line x1="756.0" y1="581.0" x2="763.0" y2="581.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="581.0" x2="763.0" y2="589.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="589.0" x2="761.0" y2="589.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,594.0 761.0,584.0 770.0,589.0" fill="#0f766e"/><rect x="158.0" y="282.0" width="190.0" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Corticoide antenatal a la</tspan><tspan x="168.0" dy="16">madre</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Entre 24 y 34 semanas: menos</tspan><tspan x="168.0" dy="14.5">mortalidad y menos necesidad de</tspan><tspan x="168.0" dy="14.5">surfactante</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="410.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Estabilizar con CPAP</tspan></text><text x="372.0" y="443.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Desde los primeros minutos, sin</tspan><tspan x="372.0" dy="14.5">intubar de rutina</tspan></text><circle cx="362.0" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="538.0" width="190.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="554.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Surfactante de rescate</tspan><tspan x="576.0" dy="16">precoz</tspan></text><text x="576.0" y="587.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Si FiO2 mayor de 0,30 con CPAP;</tspan><tspan x="576.0" dy="14.5">técnica menos invasiva</tspan></text><circle cx="566.0" cy="538.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="542.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="538.0" width="190.0" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="554.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Tratamientos que no</tspan><tspan x="780.0" dy="16">corresponden</tspan></text><text x="780.0" y="587.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Óxido nítrico, vitamina K y</tspan><tspan x="780.0" dy="14.5">tetraciclina no tratan el déficit de</tspan><tspan x="780.0" dy="14.5">surfactante</tspan></text><circle cx="770.0" cy="538.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="542.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="671.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="697.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Prematuro con distrés = surfactante</tspan></text><text x="60.0" y="716.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El corticoide es prenatal; el óxido nítrico es para hipertensión pulmonar.</tspan></text><text x="40.0" y="783.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="793.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="815.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="796.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Surfactante</tspan></text><text x="435.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Corticoide</tspan></text><text x="585.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Óxido nítrico</tspan></text><text x="735.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Vitamina K</tspan></text><text x="885.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tetraciclina</tspan></text><rect x="40.0" y="830.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="830.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="867.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Terapia indicada?</tspan></text><text x="285.0" y="859.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: repone lo que falta</tspan><tspan x="285.0" dy="16">en el pulmón</tspan></text><text x="435.0" y="859.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se da a la madre</tspan><tspan x="435.0" dy="16">antes del parto</tspan></text><text x="585.0" y="859.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se reserva para</tspan><tspan x="585.0" dy="16">hipertensión pulmonar</tspan></text><text x="735.0" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es profilaxis de la</tspan><tspan x="735.0" dy="16">enfermedad</tspan><tspan x="735.0" dy="16">hemorrágica</tspan></text><text x="885.0" y="859.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no tiene lugar en el</tspan><tspan x="885.0" dy="16">recién nacido</tspan></text><rect x="40.0" y="793.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="920.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="948.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="970.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Incidencia: cerca de 60 % en menores de 28 semanas y menos de 5 % en mayores de 34. Riesgo: cesárea sin trabajo de parto, diabetes materna, sexo</tspan><tspan x="58.0" dy="18">   masculino.</tspan><tspan x="58.0" dy="18">• Clínica: quejido, aleteo, tiraje y cianosis desde las primeras horas; radiografía reticulogranular con broncograma aéreo.</tspan><tspan x="58.0" dy="18">• Guías europeas 2022: CPAP desde la sala de partos y surfactante de rescate precoz si requiere FiO2 mayor de 0,30 con CPAP, de preferencia con</tspan><tspan x="58.0" dy="18">   técnica menos invasiva.</tspan><tspan x="58.0" dy="18">• El corticoide antenatal (24 a 34 semanas) es prevención en la madre; óxido nítrico es para hipertensión pulmonar y vitamina K es profilaxis hemorrágica.</tspan></text><text x="58.0" y="1082.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Sweet y cols., Guías europeas de consenso para el SDR, actualización 2022 (Neonatology 2023;120:3-23); NTS 214-2024, Atención integral neonatal (MINSA).</tspan></text></svg>