="#ea580c" stroke-width="2.2"/><polygon points="557.0,554.0 557.0,544.0 566.0,549.0" fill="#ea580c"/><line x1="756.0" y1="549.0" x2="763.0" y2="549.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="549.0" x2="763.0" y2="652.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="652.5" x2="761.0" y2="652.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,657.5 761.0,647.5 770.0,652.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="190.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Parotiditis (triple viral, 12 y</tspan><tspan x="168.0" dy="16">18 meses)</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Virus vivo atenuado, subcutánea</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="394.0" width="190.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="372.0" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">El virus vacunal replica en el</tspan><tspan x="372.0" dy="16">huésped</tspan></text><text x="372.0" y="443.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Puede invadir el sistema nervioso</tspan><tspan x="372.0" dy="14.5">central</tspan></text><circle cx="362.0" cy="394.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="398.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="506.0" width="190.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="522.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Meningitis aséptica o</tspan><tspan x="576.0" dy="16">meningoencefalitis</tspan></text><text x="576.0" y="555.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">1 a 4 semanas tras la dosis;</tspan><tspan x="576.0" dy="14.5">benigna y autolimitada</tspan></text><circle cx="566.0" cy="506.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="510.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="618.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Soporte y LCR con PCR</tspan></text><text x="780.0" y="651.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Distingue la cepa vacunal de la</tspan><tspan x="780.0" dy="14.5">salvaje; la vacuna se mantiene</tspan></text><circle cx="770.0" cy="618.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="622.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="735.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="761.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Parotiditis (triple viral) = virus vivo que puede dar meningoencefalitis</tspan></text><text x="60.0" y="780.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Polio parenteral, hepatitis A, influenza inactivada y VPH no se replican.</tspan></text><text x="40.0" y="841.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIPO DE ANTÍGENO DE LAS VACUNAS DE LA PREGUNTA</tspan></text><rect x="40.0" y="853.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Vacuna</tspan></text><text x="340.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Tipo de antígeno</tspan></text><text x="655.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Meningoencefalitis posvacunal</tspan></text><rect x="40.0" y="882.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="901.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Parotiditis (triple viral)</tspan></text><text x="340.0" y="901.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Virus vivo atenuado</tspan></text><text x="655.0" y="901.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Posible; infrecuente, 1 a 4 semanas después</tspan></text><rect x="230.6" y="885.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="276.0" y="900.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="276.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="911.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="930.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Polio parenteral</tspan></text><text x="340.0" y="930.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Virus inactivado</tspan></text><text x="655.0" y="930.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">No: no se replica</tspan></text><rect x="40.0" y="940.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="959.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Hepatitis A</tspan></text><text x="340.0" y="959.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Virus inactivado</tspan></text><text x="655.0" y="959.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">No: no se replica</tspan></text><rect x="40.0" y="969.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="988.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Influenza H1N1</tspan></text><text x="340.0" y="988.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Inactivada</tspan></text><text x="655.0" y="988.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">No: no se replica</tspan></text><rect x="40.0" y="998.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="1017.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Papilomavirus</tspan></text><text x="340.0" y="1017.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Proteínas recombinantes (partículas similares al virus)</tspan></text><text x="655.0" y="1017.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">No: no se replica</tspan></text><text x="40.0" y="1067.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1077.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1099.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1080.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1099.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Parotiditis</tspan></text><text x="435.0" y="1099.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Polio parenteral</tspan></text><text x="585.0" y="1099.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hepatitis A</tspan></text><text x="735.0" y="1099.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Influenza H1N1</tspan></text><text x="885.0" y="1099.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Papilomavirus</tspan></text><rect x="40.0" y="1114.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1114.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1135.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Vacuna que puede</tspan><tspan x="54.0" dy="16">causar</tspan><tspan x="54.0" dy="16">meningoencefalitis?</tspan></text><text x="285.0" y="1135.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: virus vivo atenuado</tspan><tspan x="285.0" dy="16">que puede replicar en</tspan><tspan x="285.0" dy="16">el sistema nervioso</tspan></text><text x="435.0" y="1143.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: vacuna inactivada,</tspan><tspan x="435.0" dy="16">no replica</tspan></text><text x="585.0" y="1143.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: vacuna inactivada,</tspan><tspan x="585.0" dy="16">no replica</tspan></text><text x="735.0" y="1143.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: vacuna inactivada,</tspan><tspan x="735.0" dy="16">no replica</tspan></text><text x="885.0" y="1135.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: vacuna</tspan><tspan x="885.0" dy="16">recombinante, no</tspan><tspan x="885.0" dy="16">replica</tspan></text><rect x="40.0" y="1077.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1204.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1232.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1254.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Triple viral (sarampión, parotiditis y rubéola): virus vivos atenuados, por vía subcutánea a los 12 y 18 meses en el esquema peruano.</tspan><tspan x="58.0" dy="18">• Meningitis aséptica o meningoencefalitis entre la 1.ª y la 4.ª semana tras la dosis; infrecuente, benigna y autolimitada. Con la cepa Jeryl Lynn es de 1 por</tspan><tspan x="58.0" dy="18">   millón de dosis o menos.</tspan><tspan x="58.0" dy="18">• Las cepas Urabe y Leningrad-Zagreb se asociaron con más casos. Polio parenteral, hepatitis A, influenza inactivada y VPH usan antígenos que no se</tspan><tspan x="58.0" dy="18">   replican.</tspan><tspan x="58.0" dy="18">• Alerta: fiebre y signos meníngeos semanas después de la triple viral: LCR con PCR distingue la cepa vacunal de la salvaje. El beneficio supera al riesgo.</tspan></text><text x="58.0" y="1366.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, NTS 196-MINSA/DGIESP-2022 (Esquema Nacional de Vacunación); Hviid A et al., Mumps, Lancet 2008;371:932-944; Plotkin, Vaccines, 7.ª ed. (2018).</tspan></text></svg>