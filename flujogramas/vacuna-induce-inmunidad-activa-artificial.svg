<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="924" viewBox="0 0 1000 924" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Al administrar una vacuna se induce inmunidad activa artificial: el propio organismo produce anticuerpos y memoria"><title>Al administrar una vacuna se induce inmunidad activa artificial: el propio organismo produce anticuerpos y memoria</title><rect x="0.75" y="0.75" width="998.5" height="923.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Inmunología · tipos de inmunidad</tspan></text><rect x="398.9" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="478.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="478.2" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tipos de inmunidad adquirida</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Activa: el propio cuerpo responde al antígeno (tarda semanas, deja memoria, dura años).</tspan><tspan x="58.0" dy="17">Pasiva: recibe anticuerpos hechos (inmediata, sin memoria, dura semanas o meses).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué inmunidad induce una vacuna?</tspan><tspan x="640.0" dy="16"></tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUIÉN FABRICA LOS ANTICUERPOS Y CÓMO LLEGAN?</tspan></text><text x="202.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ CÓMO SE ADQUIERE</tspan></text><rect x="202.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="388.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Natural</tspan></text><rect x="587.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Artificial</tspan></text><text x="40.0" y="312.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ QUIÉN LOS PRODUCE</tspan></text><rect x="40.0" y="338.0" width="150.0" height="90.5" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="379.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">El propio cuerpo</tspan><tspan x="115.0" dy="17">(activa)</tspan></text><rect x="202.0" y="338.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="339.0" width="6.0" height="88.5" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="388.5" y="374.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Infección</tspan></text><text x="388.5" y="397.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Sarampión pasado</tspan></text><rect x="587.0" y="338.0" width="373.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="366.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">VACUNA</tspan></text><text x="773.5" y="389.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Este caso</tspan><tspan x="773.5" dy="17">Memoria inmunológica</tspan></text><rect x="728.1" y="417.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="773.5" y="432.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="773.5" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="440.5" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="483.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Otro (pasiva)</tspan></text><rect x="202.0" y="440.5" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="441.5" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="470.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Madre → hijo</tspan></text><text x="388.5" y="493.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Placenta, leche</tspan></text><rect x="587.0" y="440.5" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="441.5" width="6.0" height="74.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="773.5" y="470.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Inmunoglobulina</tspan></text><text x="773.5" y="493.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Antitetánica, antirrábica</tspan></text><rect x="40.0" y="528.5" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="571.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Duración</tspan></text><rect x="202.0" y="528.5" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="529.5" width="6.0" height="74.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="388.5" y="558.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Años (activa)</tspan></text><text x="388.5" y="581.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Con memoria</tspan></text><rect x="587.0" y="528.5" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="529.5" width="6.0" height="74.0" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="773.5" y="558.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Semanas (pasiva)</tspan></text><text x="773.5" y="581.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Sin memoria</tspan></text><text x="40.0" y="654.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="664.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="687.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="687.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Mixta</tspan></text><text x="435.0" y="687.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Pasiva</tspan></text><rect x="513.0" y="667.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="687.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Activa</tspan></text><text x="735.0" y="687.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Heterógrada</tspan></text><text x="885.0" y="687.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Innata</tspan></text><rect x="40.0" y="701.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="701.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="730.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tipo de inmunidad?</tspan></text><text x="285.0" y="722.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: mixta es vacuna +</tspan><tspan x="285.0" dy="16">inmunoglobulina juntas</tspan></text><text x="435.0" y="722.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: pasiva son</tspan><tspan x="435.0" dy="16">anticuerpos hechos</tspan></text><text x="585.0" y="722.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: el cuerpo produce y</tspan><tspan x="585.0" dy="16">recuerda</tspan></text><text x="735.0" y="722.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es un tipo de</tspan><tspan x="735.0" dy="16">inmunidad</tspan></text><text x="885.0" y="722.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la innata no se</tspan><tspan x="885.0" dy="16">induce con vacunas</tspan></text><rect x="40.0" y="664.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="775.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="803.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="825.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Activa natural: tener la infección. Activa artificial: vacuna.</tspan><tspan x="58.0" dy="18">• Pasiva natural: anticuerpos de la madre (placenta, leche). Pasiva artificial: inmunoglobulinas, sueros antiveneno.</tspan><tspan x="58.0" dy="18">• Por eso en la rabia grave se dan juntas: vacuna (activa) e inmunoglobulina (pasiva).</tspan></text><text x="58.0" y="883.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Abbas, Inmunología celular y molecular 10.ª ed.; OMS.</tspan></text></svg>