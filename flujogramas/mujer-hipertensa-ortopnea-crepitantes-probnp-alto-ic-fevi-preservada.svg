<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1346" viewBox="0 0 1000 1346" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer mayor hipertensa con ortopnea, crepitantes y proBNP alto: insuficiencia cardiaca con FEVI preservada"><title>Mujer mayor hipertensa con ortopnea, crepitantes y proBNP alto: insuficiencia cardiaca con FEVI preservada</title><rect x="0.75" y="0.75" width="998.5" height="1344.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Insuficiencia cardiaca · tipos</tspan></text><rect x="370.2" y="32.0" width="132.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="436.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="116"><tspan x="436.3" dy="0">CARDIOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">IC con fracción de eyección preservada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El VI bombea bien (FEVI ≥ 50 %) pero es rígido y se llena mal.</tspan><tspan x="58.0" dy="17">Típica de mujeres mayores con hipertensión de años, obesidad o diabetes.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 67 años con HTA de larga data</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">2 meses de disnea progresiva hasta ortopnea.</tspan><tspan x="640.0" dy="16">PA 150/90, crepitantes bibasales, edema maleolar;</tspan><tspan x="640.0" dy="16">proBNP alto.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA DISNEA A LA CAUSA</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 543.8,385.0 76.2,385.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Mujer hipertensa con disnea, ortopnea y proBNP alto</tspan></text><line x1="565.9" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="318.0" width="116.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="672.4" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="672.4" dy="0">Embolia pulmonar</tspan></text><rect x="736.9" y="318.0" width="145.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="809.4" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="809.4" dy="0">EPOC descompensada</tspan></text><rect x="614.0" y="350.0" width="95.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="662.0" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Taponamiento</tspan></text><rect x="715.9" y="350.0" width="147.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="789.7" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="789.7" dy="0">IC con FEVI preservada</tspan></text><polygon points="76.2,389.0 543.8,389.0 507.5,445.0 112.5,445.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="417.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="421.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="421.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Inicio súbito con dolor torácico o síncope?</tspan></text><line x1="529.6" y1="417.0" x2="606.0" y2="417.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="404.0" width="129.0" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="678.5" y="421.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="678.5" dy="0">✕ Embolia pulmonar</tspan></text><line x1="636.0" y1="417.5" x2="733.0" y2="417.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,449.0 507.5,449.0 471.2,509.0 148.8,509.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="479.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="483.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="475.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Fumadora con sibilancias y espiración</tspan><tspan x="320.0" dy="17">prolongada?</tspan></text><line x1="493.4" y1="479.0" x2="606.0" y2="479.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="466.0" width="157.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="692.5" y="483.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="692.5" dy="0">✕ EPOC descompensada</tspan></text><line x1="636.0" y1="479.5" x2="761.1" y2="479.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,513.0 471.2,513.0 435.0,573.0 185.0,573.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="543.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="547.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="539.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Hipotensión, yugulares</tspan><tspan x="320.0" dy="17">llenas y ruidos apagados?</tspan></text><line x1="457.1" y1="543.0" x2="606.0" y2="543.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="530.0" width="107.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="667.9" y="547.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="667.9" dy="0">✕ Taponamiento</tspan></text><line x1="636.0" y1="543.5" x2="711.8" y2="543.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="577.0" x2="310.0" y2="596.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,595.0 315.0,595.0 310.0,603.0" fill="#0f766e"/><rect x="140.0" y="607.0" width="340.0" height="74.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="636.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">IC con FEVI preservada</tspan></text><text x="310.0" y="660.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Congestión progresiva en una hipertensa de años</tspan></text><rect x="370.6" y="596.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="611.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="606.4" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="626.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="644.4" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">La disnea fue progresiva en 2 meses y el proBNP es alto:</tspan><tspan x="628.0" dy="16">el corazón es la causa.</tspan></text><text x="40.0" y="721.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="733.9" width="318.0" height="302.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="743.9" width="194.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="757.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="276"><tspan x="61.0" dy="0">CORAZÓN DEL CASO (ESQUEMA)</tspan></text><g data-box="54.0 771.9 290.0 240.0"><g transform="translate(74.0,771.9) scale(0.95)"><ellipse cx="82" cy="74" rx="42" ry="34" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" /><text x="82" y="78" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">AD</text><text x="82" y="78" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle" data-max="0">AD</text><ellipse cx="184" cy="74" rx="40" ry="30" fill="#fecaca" stroke="#b91c1c" stroke-width="2" /><text x="184" y="78" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">AI</text><text x="184" y="78" font-size="11" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">AI</text><ellipse cx="176" cy="162" rx="66" ry="78" fill="#f87171" stroke="#991b1b" stroke-width="2" /><ellipse cx="176" cy="162" rx="50" ry="62" fill="#fecaca" stroke="none" stroke-width="0" /><text x="176" y="166" font-size="12" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">VI</text><text x="176" y="166" font-size="12" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">VI</text><ellipse cx="86" cy="160" rx="58" ry="58" fill="#fca5a5" stroke="#991b1b" stroke-width="2" /><ellipse cx="86" cy="160" rx="52" ry="52" fill="#bfdbfe" stroke="none" stroke-width="0" /><text x="86" y="164" font-size="12" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">VD</text><text x="86" y="164" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle" data-max="0">VD</text><text x="176" y="246" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">pared gruesa y rígida</text><text x="176" y="246" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">pared gruesa y rígida</text></g></g><rect x="380.0" y="733.9" width="580.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="398.0" cy="749.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="398.0" y="753.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="398.0" dy="0">1</tspan></text><text x="416.0" y="753.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="536"><tspan x="416.0" dy="0">Años de hipertensión engrosan la pared del VI.</tspan></text><rect x="380.0" y="771.9" width="580.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="398.0" cy="787.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="398.0" y="791.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="398.0" dy="0">2</tspan></text><text x="416.0" y="791.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="536"><tspan x="416.0" dy="0">El VI rígido se llena mal: la presión sube y congestiona los pulmones.</tspan></text><rect x="380.0" y="809.9" width="580.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="398.0" cy="825.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="398.0" y="829.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="398.0" dy="0">3</tspan></text><text x="416.0" y="829.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="536"><tspan x="416.0" dy="0">Bombea bien: la FEVI se mantiene ≥ 50 % (se confirma con eco).</tspan></text><text x="40.0" y="1075.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1085.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1108.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1108.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Embolia pulmonar aguda</tspan></text><text x="491.2" y="1108.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">EPOC descompensada</tspan></text><rect x="588.0" y="1088.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="1108.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">IC con FEVI preservada</tspan></text><text x="866.2" y="1108.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Taponamiento cardiaco</tspan></text><rect x="40.0" y="1122.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1122.9" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1151.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="303.8" y="1151.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: sería súbita</tspan></text><text x="491.2" y="1151.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: sin tabaco ni sibilancias</tspan></text><text x="678.8" y="1151.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí</tspan></text><text x="866.2" y="1143.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: sin hipotensión ni ruidos</tspan><tspan x="866.2" dy="16">apagados</tspan></text><rect x="40.0" y="1085.9" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1196.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1224.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1246.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Congestión (ortopnea, crepitantes, edema) + proBNP alto + HTA crónica = insuficiencia cardiaca, probablemente con FEVI preservada.</tspan><tspan x="58.0" dy="18">• Se confirma con ecocardiograma: FEVI ≥ 50 % y signos de disfunción diastólica o hipertrofia.</tspan><tspan x="58.0" dy="18">• Tratamiento: diurético para la congestión, control de la PA e iSGLT2.</tspan></text><text x="58.0" y="1304.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, insuficiencia cardiaca (2021, actualización 2023); AHA/ACC/HFSA (2022).</tspan></text></svg>