<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1008" viewBox="0 0 1000 1008" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante con tuberculosis pulmonar en tratamiento: se administra piridoxina"><title>Gestante con tuberculosis pulmonar en tratamiento: se administra piridoxina</title><rect x="0.75" y="0.75" width="998.5" height="1006.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tuberculosis · embarazo y lactancia</tspan></text><rect x="412.4" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="473.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="473.3" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tuberculosis en el embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">No se retrasa el tratamiento: el esquema estándar es seguro para el feto.</tspan><tspan x="58.0" dy="17">La isoniazida consume vitamina B6.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante con tuberculosis pulmonar</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">En tratamiento antituberculoso.</tspan><tspan x="640.0" dy="16">¿Cuál es la acción correcta?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE Y QUÉ SE EVITA EN LA GESTANTE CON TUBERCULOSIS</tspan></text><rect x="40.0" y="269.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="302.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">1</tspan></text><rect x="78.0" y="286.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="302.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="294.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Esquema estándar sin demora</tspan></text><text x="114.0" y="311.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Isoniazida, rifampicina, pirazinamida y etambutol</tspan></text><rect x="40.0" y="334.0" width="602.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="60.0" y="367.5" font-size="14" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">2</tspan></text><rect x="78.0" y="351.5" width="22.0" height="22.0" rx="5" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="89.0" y="367.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="359.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Piridoxina (vitamina B6)</tspan></text><text x="114.0" y="376.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Previene la neuropatía por isoniazida: la acción correcta</tspan></text><rect x="541.2" y="323.0" width="88.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="585.6" y="338.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="585.6" dy="0">◆ CORRECTA</tspan></text><rect x="40.0" y="399.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="432.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">3</tspan></text><rect x="78.0" y="416.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="432.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="424.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Mantener la lactancia</tspan></text><text x="114.0" y="441.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">El fármaco pasa en cantidad mínima a la leche</tspan></text><rect x="40.0" y="464.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="497.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">4</tspan></text><rect x="78.0" y="481.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="497.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="489.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Profilaxis del recién nacido</tspan></text><text x="114.0" y="506.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Isoniazida y BCG según la norma si la madre es bacilífera</tspan></text><rect x="660.0" y="269.0" width="300.0" height="252.0" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/><text x="676.0" y="295.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">NO HACER</tspan></text><text x="682.0" y="349.5" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="349.5" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Estreptomicina</tspan></text><text x="700.0" y="366.5" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Atraviesa la placenta: sordera congénita</tspan></text><text x="682.0" y="398.5" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="398.5" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Contraindicar la lactancia</tspan></text><text x="700.0" y="415.5" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">No hay razón; la madre usa mascarilla</tspan></text><text x="682.0" y="447.5" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="447.5" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Cesárea sistemática</tspan></text><text x="700.0" y="464.5" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Solo por indicación obstétrica</tspan></text><rect x="40.0" y="539.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="565.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Gestante con tuberculosis: esquema estándar más piridoxina</tspan></text><text x="60.0" y="584.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sin estreptomicina y con lactancia materna.</tspan></text><text x="40.0" y="651.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="661.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="692.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="683.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Contraindicar</tspan><tspan x="285.0" dy="17">lactancia materna</tspan></text><text x="435.0" y="683.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Incluir</tspan><tspan x="435.0" dy="17">estreptomicina</tspan></text><text x="585.0" y="683.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Evitar el contacto</tspan><tspan x="585.0" dy="17">precoz</tspan></text><text x="735.0" y="692.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Indicar cesárea</tspan></text><rect x="813.0" y="664.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="683.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Administrar</tspan><tspan x="885.0" dy="17">piridoxina</tspan></text><rect x="40.0" y="715.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="715.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="752.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Acción correcta?</tspan></text><text x="285.0" y="744.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la lactancia se</tspan><tspan x="285.0" dy="16">mantiene</tspan></text><text x="435.0" y="744.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causa sordera</tspan><tspan x="435.0" dy="16">congénita</tspan></text><text x="585.0" y="744.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: solo si es bacilífera</tspan><tspan x="585.0" dy="16">y sin mascarilla</tspan></text><text x="735.0" y="744.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo por indicación</tspan><tspan x="735.0" dy="16">obstétrica</tspan></text><text x="885.0" y="736.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: previene la</tspan><tspan x="885.0" dy="16">neuropatía por</tspan><tspan x="885.0" dy="16">isoniazida</tspan></text><rect x="40.0" y="661.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="805.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="833.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="855.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Esquema estándar: isoniazida, rifampicina, pirazinamida y etambutol. Toda gestante o madre que lacta recibe piridoxina para prevenir la neuropatía</tspan><tspan x="58.0" dy="18">   periférica.</tspan><tspan x="58.0" dy="18">• Estreptomicina: contraindicada, atraviesa la placenta y produce sordera congénita (toxicidad del VIII par).</tspan><tspan x="58.0" dy="18">• Lactancia: se mantiene; el fármaco pasa en cantidad mínima. Contacto precoz: se evita solo si es bacilífera y sin mascarilla. Cesárea: solo por indicación</tspan><tspan x="58.0" dy="18">   obstétrica.</tspan><tspan x="58.0" dy="18">• Recién nacido de madre bacilífera: quimioprofilaxis con isoniazida y BCG diferida o según la norma.</tspan></text><text x="58.0" y="967.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, NTS N.º 221-MINSA/DGIESP-2024; Nahid P, et al., ATS/CDC/ERS/IDSA (Clin Infect Dis 2016;63:853-867); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>