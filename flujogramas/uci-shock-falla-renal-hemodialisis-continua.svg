<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1376" viewBox="0 0 1000 1376" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Paciente en UCI con shock, falla multiorgánica y lesión renal aguda: la mejor terapia de reemplazo es la hemodiálisis continua (TRRC)"><title>Paciente en UCI con shock, falla multiorgánica y lesión renal aguda: la mejor terapia de reemplazo es la hemodiálisis continua (TRRC)</title><rect x="0.75" y="0.75" width="998.5" height="1374.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Lesión renal aguda · terapia de reemplazo</tspan></text><rect x="447.5" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="511.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="511.2" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Terapia de reemplazo renal en el crítico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La hemodiálisis intermitente saca mucho líquido en pocas horas: el paciente en shock se</tspan><tspan x="58.0" dy="17">hipotensa más.</tspan><tspan x="58.0" dy="17">La terapia continua (hemofiltración/hemodiálisis venovenosa continua) es lenta y estable:</tspan><tspan x="58.0" dy="17">preferida si hay inestabilidad hemodinámica o edema cerebral.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adulto en UCI</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Neumonía asociada al ventilador.</tspan><tspan x="640.0" dy="16">Shock con disfunción de órganos y falla renal aguda.</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿CONTINUA O INTERMITENTE?</tspan></text><rect x="493.0" y="332.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 537.0 H560.0 L540.0 517.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="332.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="350.1" x2="614.6" y2="313.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="350.1" x2="357.4" y2="412.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="350.1" x2="413.4" y2="412.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 412.1 H423.4 Q385.4 456.1 347.4 412.1 Z" fill="#ea580c"/><text x="385.4" y="427.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">CONTINUA</tspan></text><line x1="614.6" y1="313.9" x2="586.6" y2="375.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="313.9" x2="642.6" y2="375.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 375.9 H652.6 Q614.6 419.9 576.6 375.9 Z" fill="#64748b"/><text x="614.6" y="390.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">CORTA</tspan></text><text x="500.0" y="564.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Qué conviene en el shock?</tspan></text><rect x="40.0" y="302.0" width="290.0" height="158.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="330.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Continua (TRRC)</tspan></text><circle cx="62.0" cy="355.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="359.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Lenta, 24 h al día</tspan></text><circle cx="62.0" cy="381.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="385.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Estable para la PA</tspan></text><circle cx="62.0" cy="407.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Paciente en shock (este caso)</tspan></text><circle cx="62.0" cy="433.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="437.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Edema cerebral</tspan></text><rect x="214.6" y="291.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="306.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="302.0" width="290.0" height="158.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="330.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Intermitente</tspan></text><circle cx="692.0" cy="355.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="359.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">3-4 horas</tspan></text><circle cx="692.0" cy="381.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="385.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Saca mucho líquido rápido</tspan></text><circle cx="692.0" cy="407.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Paciente estable</tspan></text><circle cx="692.0" cy="433.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="437.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Hiperpotasemia urgente</tspan></text><rect x="40.0" y="598.0" width="920.0" height="76.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="626.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Shock + falla renal = terapia continua</tspan></text><text x="500.0" y="647.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">La intermitente empeora la hipotensión.</tspan></text><text x="40.0" y="714.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="726.0" width="920.0" height="323.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="740.0" width="334.2" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="223.1" y="760.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="223.1" dy="0">ESTADIOS KDIGO DE LESIÓN RENAL AGUDA</tspan></text><text x="406.2" y="760.0" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="536"><tspan x="406.2" dy="0">Por la creatinina o la diuresis (lo que sea peor).</tspan></text><rect x="56.0" y="800.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="800.6" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="828.0" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">1</tspan></text><text x="200.0" y="848.0" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Creatinina × 1,5-1,9 o ↑ ≥ 0,3</tspan></text><circle cx="72.0" cy="873.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Diuresis &lt; 0,5 mL/kg/h por 6-12 h</tspan></text><rect x="356.0" y="800.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="800.6" width="286.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="828.0" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">2</tspan></text><text x="500.0" y="848.0" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Creatinina × 2-2,9</tspan></text><circle cx="372.0" cy="873.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">&lt; 0,5 mL/kg/h por ≥ 12 h</tspan></text><rect x="656.0" y="800.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="800.6" width="286.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="828.0" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">3</tspan></text><text x="800.0" y="848.0" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Creatinina × 3, ≥ 4 o diálisis</tspan></text><circle cx="672.0" cy="873.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">&lt; 0,3 mL/kg/h por ≥ 24 h o anuria ≥ 12 h</tspan></text><text x="56.0" y="928.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="937.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="952.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="952.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Falla renal aguda en choque con disfunción de órganos</tspan></text><rect x="56.0" y="959.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="974.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="974.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">La creatinina y la diuresis exactas no se dan</tspan></text><rect x="56.0" y="996.0" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="1019.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Hemodiálisis continua (TRRC) si hay indicación (AEIOU).</tspan></text><text x="40.0" y="1089.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1099.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1130.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1102.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1121.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hemodiálisis</tspan><tspan x="285.0" dy="17">continua</tspan></text><text x="435.0" y="1121.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hemodiálisis</tspan><tspan x="435.0" dy="17">intermitente</tspan></text><text x="585.0" y="1121.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hemodiálisis</tspan><tspan x="585.0" dy="17">interdiaria</tspan></text><text x="735.0" y="1130.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Diálisis peritoneal</tspan></text><text x="885.0" y="1121.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Diálisis peritoneal</tspan><tspan x="885.0" dy="17">intermitente</tspan></text><rect x="40.0" y="1153.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1153.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1182.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mejor opción?</tspan></text><text x="285.0" y="1174.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: estable para el</tspan><tspan x="285.0" dy="16">shock</tspan></text><text x="435.0" y="1182.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: hipotensión</tspan></text><text x="585.0" y="1182.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: hipotensión</tspan></text><text x="735.0" y="1174.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Menos eficiente en el</tspan><tspan x="735.0" dy="16">adulto crítico</tspan></text><text x="885.0" y="1182.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Menos eficiente</tspan></text><rect x="40.0" y="1099.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1227.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1255.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1277.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Indicaciones urgentes (AEIOU): acidosis grave, electrolitos (K alto), intoxicaciones, sobrecarga de volumen, uremia.</tspan><tspan x="58.0" dy="18">• Continua: inestable. Intermitente: estable. Diálisis peritoneal: niños o sin acceso a otras.</tspan><tspan x="58.0" dy="18">• Anticoagular el circuito con citrato regional.</tspan></text><text x="58.0" y="1335.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO, lesión renal aguda (2012; act. 2025).</tspan></text></svg>