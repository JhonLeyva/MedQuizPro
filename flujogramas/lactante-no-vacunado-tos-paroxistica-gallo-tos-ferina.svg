<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1048" viewBox="0 0 1000 1048" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño de 12 meses no vacunado con accesos de tos, estridor inspiratorio en «gallo», sofocación y cianosis: tos ferina (fase paroxística)"><title>Niño de 12 meses no vacunado con accesos de tos, estridor inspiratorio en «gallo», sofocación y cianosis: tos ferina (fase paroxística)</title><rect x="0.75" y="0.75" width="998.5" height="1046.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tos ferina (pertussis)</tspan></text><rect x="326.2" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="382.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="382.7" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tos ferina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bordetella pertussis: muy contagiosa; graves en lactantes no vacunados (apneas,</tspan><tspan x="58.0" dy="17">neumonía, encefalopatía).</tspan><tspan x="58.0" dy="17">Tres fases: catarral (como resfrío), paroxística (accesos, «gallo», vómitos, cianosis) y</tspan><tspan x="58.0" dy="17">convalecencia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 12 meses, no vacunado</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Una semana de accesos de tos con ruido inspiratorio</tspan><tspan x="640.0" dy="16">de «gallo».</tspan><tspan x="640.0" dy="16">Sofocación y cianosis.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS FASES DE LA TOS FERINA</tspan></text><rect x="42.0" y="295.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="193.3" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">CATARRAL</tspan></text><text x="193.3" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">1-2 semanas</tspan></text><rect x="348.7" y="295.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="500.0" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">PAROXÍSTICA</tspan></text><text x="500.0" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">2-6 semanas</tspan></text><rect x="655.3" y="295.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">CONVALECENCIA</tspan></text><text x="806.7" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Semanas a meses</tspan></text><rect x="454.6" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="365.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="193.3" y="393.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">MÁS CONTAGIOSA</tspan></text><text x="193.3" y="417.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Como un resfrío</tspan><tspan x="193.3" dy="17">El antibiótico rinde más aquí</tspan></text><rect x="354.7" y="365.0" width="290.7" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="393.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">ACCESOS + «GALLO»</tspan></text><text x="500.0" y="417.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Cianosis y vómito tras la tos</tspan><tspan x="500.0" dy="17">Este caso</tspan></text><rect x="661.3" y="365.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="402.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">TOS QUE VA CEDIENDO</tspan></text><text x="806.7" y="426.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Puede volver con otros resfríos</tspan></text><text x="40.0" y="496.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="508.2" width="920.0" height="213.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="550.2" x2="938.0" y2="550.2" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="550.2" x2="62.0" y2="558.2" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="550.2" x2="938.0" y2="558.2" stroke="#0f766e" stroke-width="2"/><rect x="363.4" y="538.2" width="273.2" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="554.2" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="259"><tspan x="500.0" dy="0">TOS FERINA CLÍNICA (OMS) · 3 de 3 en el caso</tspan></text><rect x="56.0" y="570.2" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="593.2" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="597.2" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="598.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="94.0" dy="0">Tos en accesos (paroxismos)</tspan></text><text x="68.0" y="624.2" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="68.0" dy="0">Sí</tspan></text><rect x="68.0" y="640.2" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="200.0" y="655.2" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="200.0" dy="0">✓ EN EL CASO</tspan></text><rect x="356.0" y="570.2" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="376.0" cy="593.2" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="376.0" y="597.2" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><text x="394.0" y="598.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="394.0" dy="0">Estridor inspiratorio en «gallo»</tspan></text><text x="368.0" y="624.2" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="368.0" dy="0">Sí</tspan></text><rect x="368.0" y="640.2" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="500.0" y="655.2" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="500.0" dy="0">✓ EN EL CASO</tspan></text><rect x="656.0" y="570.2" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="676.0" cy="593.2" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="676.0" y="597.2" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">3</tspan></text><text x="694.0" y="598.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="694.0" dy="0">Vómito o cianosis tras la tos</tspan></text><text x="668.0" y="624.2" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="668.0" dy="0">Cianosis</tspan></text><rect x="668.0" y="640.2" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="800.0" y="655.2" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="800.0" dy="0">✓ EN EL CASO</tspan></text><text x="56.0" y="701.2" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">En &lt; 6 meses puede haber solo apneas, sin «gallo».</tspan></text><text x="40.0" y="761.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="771.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="802.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="802.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Bronquiolitis</tspan></text><rect x="363.0" y="774.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="802.2" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tos ferina</tspan></text><text x="585.0" y="802.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Neumonía</tspan></text><text x="735.0" y="802.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Faringolaringitis</tspan></text><text x="885.0" y="793.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Laringotraqueítis</tspan><tspan x="885.0" dy="17">(crup)</tspan></text><rect x="40.0" y="825.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="825.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="854.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="846.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sibilancias, &lt; 2</tspan><tspan x="285.0" dy="16">años, sin «gallo»</tspan></text><text x="435.0" y="846.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: paroxismos +</tspan><tspan x="435.0" dy="16">«gallo» + no vacunado</tspan></text><text x="585.0" y="854.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: fiebre y crepitantes</tspan></text><text x="735.0" y="846.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: tos perruna y</tspan><tspan x="735.0" dy="16">estridor continuo</tspan></text><text x="885.0" y="846.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: tos perruna con</tspan><tspan x="885.0" dy="16">fiebre</tspan></text><rect x="40.0" y="771.2" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="899.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="927.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="949.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Azitromicina 10 mg/kg el día 1 y 5 mg/kg días 2-5 (en &lt; 1 mes: azitromicina 10 mg/kg/día por 5 días).</tspan><tspan x="58.0" dy="18">• Profilaxis con azitromicina a todos los contactos del hogar; completar vacunas (pentavalente/DPT).</tspan><tspan x="58.0" dy="18">• Hemograma: linfocitosis marcada; PCR de hisopado nasofaríngeo. Hospitalizar a los menores de 6 meses.</tspan></text><text x="58.0" y="1007.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, pertussis (2024); MINSA Perú, NTS de tos ferina; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>