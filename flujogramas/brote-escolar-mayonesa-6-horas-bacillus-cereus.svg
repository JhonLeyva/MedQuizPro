y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Si los síntomas aparecen en 1-6 horas, la toxina ya estaba en la comida: Staphylococcus</tspan><tspan x="58.0" dy="17">aureus o Bacillus cereus (emético, típico del arroz recalentado).</tspan><tspan x="58.0" dy="17">Con incubación de 8-72 horas: gérmenes que se multiplican en el intestino (C. perfringens,</tspan><tspan x="58.0" dy="17">Salmonella, Shigella).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Centro de salud</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">40 escolares con vómito, dolor abdominal y diarrea</tspan><tspan x="640.0" dy="16">líquida sin moco ni sangre (algunos con fiebre).</tspan><tspan x="640.0" dy="16">6 horas después de comer ensalada con mayonesa.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIEMPO ENTRE COMER Y ENFERMAR</tspan></text><rect x="40.0" y="285.0" width="350.0" height="350.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="223.7" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">BACILOS GRAMPOSITIVOS (ESQUEMA)</tspan></text><g data-box="50.0 321.0 330.0 240.0"><g transform="translate(105.0,361.0) scale(1.0)"><circle cx="110" cy="80" r="76" fill="#fdf4ff" stroke="#94a3b8" stroke-width="3" /><rect x="84" y="48" width="13" height="5" rx="2.5" fill="#6d28d9" transform="rotate(71 84 48)"/><rect x="75" y="45" width="13" height="5" rx="2.5" fill="#6d28d9" transform="rotate(72 75 45)"/><rect x="152" y="104" width="13" height="5" rx="2.5" fill="#6d28d9" transform="rotate(138 152 104)"/><rect x="82" y="83" width="13" height="5" rx="2.5" fill="#6d28d9" transform="rotate(50 82 83)"/><rect x="77" y="48" width="13" height="5" rx="2.5" fill="#6d28d9" transform="rotate(39 77 48)"/><rect x="153" y="106" width="13" height="5" rx="2.5" fill="#6d28d9" transform="rotate(145 153 106)"/><rect x="140" y="55" width="13" height="5" rx="2.5" fill="#6d28d9" transform="rotate(56 140 55)"/><rect x="123" y="99" width="13" height="5" rx="2.5" fill="#6d28d9" transform="rotate(154 123 99)"/></g></g><rect x="48.0" y="602.0" width="334.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="215.0" y="623.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="320"><tspan x="215.0" dy="0">B. cereus: bacilo grampositivo con esporas.</tspan></text><rect x="410.0" y="285.0" width="550.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="411.0" y="286.0" width="6.0" 