-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HORAS DESDE LA COMIDA</tspan></text><line x1="350.0" y1="701.0" x2="350.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="416.0" y1="701.0" x2="416.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="482.0" y1="701.0" x2="482.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="548.0" y1="701.0" x2="548.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="614.0" y1="701.0" x2="614.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="680.0" y1="701.0" x2="680.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="746.0" y1="701.0" x2="746.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="812.0" y1="701.0" x2="812.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="878.0" y1="701.0" x2="878.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="701.0" x2="944.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="705.0" width="920.0" height="32.0" rx="8" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="50.0" y="720.0" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">S. aureus / B. cereus emético</tspan></text><text x="50.0" y="734.0" font-size="10.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">toxina preformada</tspan></text><rect x="358.2" y="712.0" width="41.2" height="20.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0"/><text x="378.9" y="726.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="33"><tspan x="378.9" dy="0">1-6 h</tspan></text><line x1="330.0" y1="722.0" x2="354.2" y2="722.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="756.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"