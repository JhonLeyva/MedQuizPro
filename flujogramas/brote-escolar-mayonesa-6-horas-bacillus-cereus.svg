xt x="285.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Bacillus cereus</tspan></text><text x="435.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Shigella</tspan></text><text x="585.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Salmonella</tspan></text><text x="735.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Vibrio cholerae</tspan></text><text x="885.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Rotavirus</tspan></text><rect x="40.0" y="982.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="982.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1011.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente?</tspan></text><text x="285.0" y="1003.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: toxina preformada</tspan><tspan x="285.0" dy="16">(1-6 h)</tspan></text><text x="435.0" y="1003.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: incubación 1-3</tspan><tspan x="435.0" dy="16">días, disentería</tspan></text><text x="585.0" y="1011.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: 12-72 h</tspan></text><text x="735.0" y="1003.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: diarrea profusa,</tspan><tspan x="735.0" dy="16">otro contexto</tspan></text><text x="885.0" y="1003.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: niños pequeños,</tspan><tspan x="885.0" dy="16">1-3 días</tspan></text><rect x="40.0" y="945.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1056.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1084.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1106.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tratamiento de soporte: hidratación; no antibióticos.</tspan><tspan x="58.0" dy="18">• Notificar el brote, tomar muestras de alimentos y de los manipuladores.</tspan><tspan x="58.0" dy="18">• S. aureus (manipuladores, cremas, mayonesa) es igual de probable con 6 h; el banco elige B. cereus.</tspan></text><text x="58.0" y="1164.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, enfermedades transmitidas por alimentos; CDC.</tspan></text></svg>