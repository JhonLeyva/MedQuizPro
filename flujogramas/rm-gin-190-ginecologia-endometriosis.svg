<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1103" viewBox="0 0 1000 1103" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El síntoma más frecuente de la endometriosis es la dismenorrea: dolor cíclico, progresivo y que no cede con antiinflamatorios"><title>El síntoma más frecuente de la endometriosis es la dismenorrea: dolor cíclico, progresivo y que no cede con antiinflamatorios</title><rect x="0.75" y="0.75" width="998.5" height="1101.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · endometriosis</tspan></text><rect x="367.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="447.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="447.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Endometriosis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Glándulas y estroma endometrial fuera del útero.</tspan><tspan x="58.0" dy="17">Afecta cerca de 10 % de las mujeres en edad reproductiva.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de síntomas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la sintomatología más frecuente en la</tspan><tspan x="640.0" dy="16">endometriosis?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE RAZONA EL SÍNTOMA PRINCIPAL</tspan></text><rect x="40.0" y="269.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="314.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="342.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="269.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="297.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué es la endometriosis?</tspan></text><rect x="136.0" y="311.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="331.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Tejido endometrial fuera del útero</tspan></text><text x="152.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Inflamación crónica dependiente de estrógenos; ovarios, peritoneo, ligamentos uterosacros e intestino.</tspan></text><line x1="77.0" y1="372.0" x2="77.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,390.0 82.0,390.0 77.0,398.0" fill="#0f766e"/><text x="134.0" y="390.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="400.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="445.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="473.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="400.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="428.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cuál es el síntoma más frecuente?</tspan></text><rect x="136.0" y="442.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="462.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Dismenorrea cíclica y progresiva</tspan></text><text x="152.0" y="481.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">No mejora con antiinflamatorios y no guarda relación con la extensión de las lesiones.</tspan></text><line x1="77.0" y1="503.0" x2="77.0" y2="522.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,521.0 82.0,521.0 77.0,529.0" fill="#0f766e"/><text x="134.0" y="521.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="531.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="576.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="604.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="531.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="559.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué más tiene la tríada?</tspan></text><rect x="136.0" y="573.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="593.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Dispareunia profunda y disquecia</tspan></text><text x="152.0" y="612.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Con dolor pélvico crónico e infertilidad; la disuria y el estreñimiento indican compromiso vesical o intestinal.</tspan></text><rect x="40.0" y="652.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="678.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Endometriosis = dismenorrea como síntoma más frecuente</tspan></text><text x="60.0" y="697.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La disuria, el estreñimiento y la mastodinia son poco frecuentes o inespecíficos.</tspan></text><text x="40.0" y="764.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="774.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="805.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="777.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="805.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Dismenorrea</tspan></text><text x="435.0" y="805.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Disuria</tspan></text><text x="585.0" y="796.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Estreñimiento</tspan><tspan x="585.0" dy="17">crónico</tspan></text><text x="735.0" y="805.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Dolor anexial</tspan></text><text x="885.0" y="805.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Mastodinia</tspan></text><rect x="40.0" y="828.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="828.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="857.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Síntoma más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="865.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: cíclica y progresiva</tspan></text><text x="435.0" y="857.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: solo con</tspan><tspan x="435.0" dy="16">compromiso vesical</tspan></text><text x="585.0" y="857.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: solo con</tspan><tspan x="585.0" dy="16">compromiso intestinal</tspan></text><text x="735.0" y="849.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es menos</tspan><tspan x="735.0" dy="16">específico que la</tspan><tspan x="735.0" dy="16">dismenorrea</tspan></text><text x="885.0" y="857.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es</tspan><tspan x="885.0" dy="16">característica</tspan></text><rect x="40.0" y="774.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="918.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="946.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="968.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tríada clásica: dismenorrea, dispareunia profunda y disquecia, junto con dolor pélvico crónico e infertilidad (30 a 50 %).</tspan><tspan x="58.0" dy="18">• La dismenorrea es el síntoma más frecuente: cíclica, progresiva, que no mejora con antiinflamatorios y sin relación con la extensión de las lesiones.</tspan><tspan x="58.0" dy="18">• Disuria y estreñimiento aparecen solo con compromiso vesical o intestinal. La mastodinia no es característica.</tspan><tspan x="58.0" dy="18">• Alerta: dismenorrea que no cede tras 3 meses de antiinflamatorios y anticonceptivos obliga a pensar en endometriosis; la ecografía transvaginal busca</tspan><tspan x="58.0" dy="18">   endometriomas.</tspan></text><text x="58.0" y="1062.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Becker CM et al., ESHRE, Hum Reprod Open 2022;2022:hoac009; Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>