<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1122" viewBox="0 0 1000 1122" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Del cólico biliar a la pancreatitis biliar: el dolor cambió de patrón"><title>Del cólico biliar a la pancreatitis biliar: el dolor cambió de patrón</title><rect x="0.75" y="0.75" width="998.5" height="1120.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Litiasis biliar · pancreatitis aguda biliar</tspan></text><rect x="429.7" y="32.0" width="180.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="519.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="164"><tspan x="519.9" dy="0">GASTROENTEROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pancreatitis aguda biliar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Un cálculo migra y se impacta en la ampolla: bloquea el conducto pancreático.</tspan><tspan x="58.0" dy="17">El dolor pasa de cólico en HD a continuo en epigastrio, en cinturón hacia la espalda.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 45 años con cólicos biliares previos</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ahora dolor epigástrico continuo de 4 h, en banda</tspan><tspan x="640.0" dy="16">hacia la espalda.</tspan><tspan x="640.0" dy="16">Vómitos biliosos; no cede con hioscina; sin defensa.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ANTES Y AHORA</tspan></text><rect x="40.0" y="295.0" width="438.0" height="408.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="305.0" width="141.0" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">ANTES: CÓLICO BILIAR</tspan></text><g transform="translate(76.0,335.0) scale(1.13)"><path d="M10 20 C60 0 250 4 300 24 C306 50 262 76 206 86 C150 96 110 104 70 112 C36 116 8 92 10 20 Z" fill="#e7a882" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><text x="160" y="44" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Hígado</text><text x="160" y="44" font-size="11" font-weight="800" fill="#7c2d12" text-anchor="middle" data-max="0">Hígado</text><path d="M150 70 L158 110 M186 72 L166 110 M162 108 L162 150" fill="none" stroke="#15803d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M162 150 C162 176 170 196 186 212" fill="none" stroke="#15803d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M162 124 C140 128 128 138 118 146" fill="none" stroke="#15803d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 140 C92 140 62 160 58 186 C56 206 74 214 92 204 C112 190 126 166 124 146 Z" fill="#86efac" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><path d="M150 170 C150 200 162 238 204 242 C242 244 250 218 246 196" fill="none" stroke="#f9a8d4" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 206 C232 196 272 188 310 182 C314 196 306 206 296 208 C262 214 232 222 204 226 Z" fill="#fde68a" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><path d="M306 196 C270 200 232 206 192 212" fill="none" stroke="#a16207" stroke-width="3" stroke-linejoin="round" /><circle cx="188" cy="214" r="5" fill="#f472b6" stroke="#9d174d" stroke-width="1.5" /><circle cx="80" cy="186" r="6" fill="#78716c" stroke="#44403c" stroke-width="1.2"/><circle cx="92" cy="178" r="6" fill="#78716c" stroke="#44403c" stroke-width="1.2"/><circle cx="74" cy="176" r="6" fill="#78716c" stroke="#44403c" stroke-width="1.2"/></g><text x="54.0" y="651.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">Cálculos en la vesícula: dolor cólico en HD tras comer grasa, cede con</tspan><tspan x="54.0" dy="16">antiespasmódico.</tspan></text><rect x="522.0" y="295.0" width="438.0" height="408.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="534.0" y="305.0" width="179.9" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">AHORA: PANCREATITIS BILIAR</tspan></text><rect x="844.6" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><g transform="translate(558.0,335.0) scale(1.13)"><path d="M10 20 C60 0 250 4 300 24 C306 50 262 76 206 86 C150 96 110 104 70 112 C36 116 8 92 10 20 Z" fill="#e7a882" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><text x="160" y="44" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Hígado</text><text x="160" y="44" font-size="11" font-weight="800" fill="#7c2d12" text-anchor="middle" data-max="0">Hígado</text><path d="M150 70 L158 110 M186 72 L166 110 M162 108 L162 150" fill="none" stroke="#15803d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M162 150 C162 176 170 196 186 212" fill="none" stroke="#15803d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M162 124 C140 128 128 138 118 146" fill="none" stroke="#15803d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 140 C92 140 62 160 58 186 C56 206 74 214 92 204 C112 190 126 166 124 146 Z" fill="#86efac" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><path d="M150 170 C150 200 162 238 204 242 C242 244 250 218 246 196" fill="none" stroke="#f9a8d4" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 206 C232 196 272 188 310 182 C314 196 306 206 296 208 C262 214 232 222 204 226 Z" fill="#fdba74" stroke="#ea580c" stroke-width="3" stroke-linejoin="round" /><path d="M306 196 C270 200 232 206 192 212" fill="none" stroke="#a16207" stroke-width="3" stroke-linejoin="round" /><circle cx="188" cy="214" r="5" fill="#f472b6" stroke="#9d174d" stroke-width="1.5" /><path d="M206 232 q4 7 0 13" fill="none" stroke="#ea580c" stroke-width="2"/><path d="M226 232 q4 7 0 13" fill="none" stroke="#ea580c" stroke-width="2"/><path d="M246 232 q4 7 0 13" fill="none" stroke="#ea580c" stroke-width="2"/><path d="M266 232 q4 7 0 13" fill="none" stroke="#ea580c" stroke-width="2"/><path d="M286 232 q4 7 0 13" fill="none" stroke="#ea580c" stroke-width="2"/><circle cx="186" cy="208" r="5" fill="#78716c" stroke="#44403c" stroke-width="1.2"/><circle cx="176" cy="222" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="176" y="226" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text></g><text x="536.0" y="651.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="536.0" dy="0">1 = cálculo impactado en la ampolla: bloquea el conducto pancreático y el</tspan><tspan x="536.0" dy="16">páncreas se inflama.</tspan></text><circle cx="500.0" cy="483.0" r="17" fill="#ea580c" stroke="none" stroke-width="0"/><polygon points="494.0,475.0 494.0,491.0 508.0,483.0" fill="#ffffff"/><text x="40.0" y="733.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO CAMBIÓ EL DOLOR</tspan></text><rect x="40.0" y="743.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="744.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="767.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Cólico biliar</tspan></text><text x="58.0" y="788.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Hipocondrio derecho, cólico, cede con hioscina.</tspan></text><rect x="351.3" y="743.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="744.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="767.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Pancreatitis biliar</tspan></text><text x="369.3" y="788.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Epigastrio, continuo, en cinturón a la espalda, no</tspan><tspan x="369.3" dy="16">cede.</tspan></text><rect x="548.8" y="732.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="594.3" y="747.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="594.3" dy="0">◆ ESTE CASO</tspan></text><rect x="662.7" y="743.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="744.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="767.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Qué pedir</tspan></text><text x="680.7" y="788.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Lipasa o amilasa, eco abdominal y perfil hepático.</tspan></text><text x="40.0" y="868.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="878.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="900.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="881.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Pancreatitis biliar</tspan></text><text x="491.2" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Gastritis erosiva</tspan></text><text x="678.8" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Úlcera péptica</tspan></text><text x="866.2" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Colecistitis aguda</tspan></text><rect x="40.0" y="915.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="915.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="936.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Clave</tspan></text><text x="303.8" y="936.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Dolor en cinturón que no cede</tspan></text><text x="491.2" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ardor, sin cinturón</tspan></text><text x="678.8" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Dolor ligado a comidas</tspan></text><text x="866.2" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Murphy (+) y fiebre</tspan></text><rect x="40.0" y="878.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="973.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1001.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1023.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cólicos biliares previos + dolor epigástrico continuo en cinturón que no cede con antiespasmódico = pancreatitis biliar.</tspan><tspan x="58.0" dy="18">• Confirmar con lipasa o amilasa &gt; 3 veces y eco de vesícula.</tspan><tspan x="58.0" dy="18">• Tras el episodio leve: colecistectomía en la misma hospitalización.</tspan></text><text x="58.0" y="1081.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACG, pancreatitis aguda (2024); guías de Tokio.</tspan></text></svg>