<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1291" viewBox="0 0 1000 1291" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El atenolol, un betabloqueador, está contraindicado en el hipertenso con asma: provoca broncoespasmo"><title>El atenolol, un betabloqueador, está contraindicado en el hipertenso con asma: provoca broncoespasmo</title><rect x="0.75" y="0.75" width="998.5" height="1289.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · antihipertensivos y asma</tspan></text><rect x="440.0" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="497.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="497.4" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Betabloqueadores en asma</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bloquean los receptores beta-2 bronquiales que median la broncodilatación.</tspan><tspan x="58.0" dy="17">Dejan sin oposición el tono colinérgico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hipertenso con asma</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué antihipertensivo está contraindicado?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ANTIHIPERTENSIVOS EN EL PACIENTE ASMÁTICO</tspan></text><rect x="493.0" y="303.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 508.0 H560.0 L540.0 488.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="303.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="321.1" x2="614.6" y2="284.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="321.1" x2="357.4" y2="383.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="321.1" x2="413.4" y2="383.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 383.1 H423.4 Q385.4 427.1 347.4 383.1 Z" fill="#ea580c"/><text x="385.4" y="398.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">EVITAR</tspan></text><line x1="614.6" y1="284.9" x2="586.6" y2="346.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="284.9" x2="642.6" y2="346.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 346.9 H652.6 Q614.6 390.9 576.6 346.9 Z" fill="#64748b"/><text x="614.6" y="361.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">USAR</tspan></text><text x="500.0" y="535.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Cuál está contraindicado?</tspan></text><rect x="40.0" y="273.0" width="290.0" height="164.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="301.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Contraindicado (este caso)</tspan></text><circle cx="62.0" cy="326.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Atenolol: cardioselectivo, pierde selectividad</tspan><tspan x="74.0" dy="16">con dosis altas</tspan></text><circle cx="62.0" cy="368.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Propranolol, nadolol y timolol (incluso colirio)</tspan></text><circle cx="62.0" cy="394.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Broncoespasmo grave y refractario al</tspan><tspan x="74.0" dy="16">salbutamol</tspan></text><rect x="214.6" y="262.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="277.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="273.0" width="290.0" height="174.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="301.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Seguros</tspan></text><circle cx="692.0" cy="326.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Enalapril (IECA): puede dar tos, no</tspan><tspan x="704.0" dy="16">broncoconstricción</tspan></text><circle cx="692.0" cy="368.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Valsartán (ARA II): alternativa ante la tos</tspan></text><circle cx="692.0" cy="394.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Amlodipino: calcioantagonista seguro</tspan></text><circle cx="692.0" cy="420.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Metildopa: no afecta la vía aérea</tspan></text><rect x="40.0" y="569.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="597.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Betabloqueador = contraindicado en asma</tspan></text><text x="500.0" y="618.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Bloquea los receptores beta-2 bronquiales.</tspan><tspan x="500.0" dy="17">Los demás fármacos de la lista no producen broncoespasmo.</tspan></text><text x="40.0" y="696.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ANTIHIPERTENSIVOS Y ASMA</tspan></text><rect x="40.0" y="708.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="727.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Fármaco</tspan></text><text x="250.0" y="727.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Situación</tspan></text><text x="610.0" y="727.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Comentario</tspan></text><rect x="40.0" y="737.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="756.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Atenolol</tspan></text><text x="250.0" y="756.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Contraindicado o de último recurso</tspan></text><text x="610.0" y="756.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Bloquea beta-2 a dosis altas; riesgo de broncoespasmo</tspan></text><rect x="140.6" y="740.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="755.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="766.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Propranolol, nadolol, timolol</tspan></text><text x="250.0" y="785.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Contraindicados</tspan></text><text x="610.0" y="785.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">No selectivos; el timolol en colirio también</tspan></text><rect x="40.0" y="795.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="814.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Enalapril</tspan></text><text x="250.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Seguro</tspan></text><text x="610.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Tos seca por bradicinina</tspan></text><rect x="40.0" y="824.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="843.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Valsartán</tspan></text><text x="250.0" y="843.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Seguro</tspan></text><text x="610.0" y="843.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Alternativa cuando aparece la tos</tspan></text><rect x="40.0" y="853.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Amlodipino</tspan></text><text x="250.0" y="872.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Seguro</tspan></text><text x="610.0" y="872.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Calcioantagonista dihidropiridínico</tspan></text><rect x="40.0" y="882.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="901.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Metildopa</tspan></text><text x="250.0" y="901.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Seguro</tspan></text><text x="610.0" y="901.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Acción central; no afecta la vía aérea</tspan></text><text x="40.0" y="951.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="961.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="983.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="964.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Atenolol</tspan></text><text x="435.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Enalapril</tspan></text><text x="585.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Amlodipino</tspan></text><text x="735.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Valsartán</tspan></text><text x="885.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Metildopa</tspan></text><rect x="40.0" y="998.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="998.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1027.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Contraindicado en</tspan><tspan x="54.0" dy="16">asma?</tspan></text><text x="285.0" y="1019.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: betabloqueador que</tspan><tspan x="285.0" dy="16">precipita</tspan><tspan x="285.0" dy="16">broncoespasmo</tspan></text><text x="435.0" y="1027.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la tos del IECA no</tspan><tspan x="435.0" dy="16">es broncoconstricción</tspan></text><text x="585.0" y="1027.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: calcioantagonista</tspan><tspan x="585.0" dy="16">seguro y útil</tspan></text><text x="735.0" y="1027.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es la alternativa si</tspan><tspan x="735.0" dy="16">hay tos por IECA</tspan></text><text x="885.0" y="1027.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: de acción central,</tspan><tspan x="885.0" dy="16">no afecta la vía aérea</tspan></text><rect x="40.0" y="961.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1088.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1116.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1138.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los no selectivos (propranolol, nadolol, timolol, incluso en colirio) están contraindicados; los cardioselectivos (atenolol, metoprolol, bisoprolol) pierden</tspan><tspan x="58.0" dy="18">   selectividad a dosis altas.</tspan><tspan x="58.0" dy="18">• Enalapril (IECA) causa tos por bradicinina, no broncoconstricción; valsartán (ARA II) es la alternativa si hay tos; amlodipino es seguro; metildopa no</tspan><tspan x="58.0" dy="18">   afecta la vía aérea.</tspan><tspan x="58.0" dy="18">• Preferidos en el asmático: IECA o ARA II, calcioantagonistas y tiazidas, según la comorbilidad.</tspan><tspan x="58.0" dy="18">• Alerta: el broncoespasmo por betabloqueador puede ser grave y refractario al salbutamol; la contraindicación incluye la EPOC reactiva.</tspan></text><text x="58.0" y="1250.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Katzung, 16.ª ed. (2024); ESH, J Hypertens 2023;41; GINA 2025.</tspan></text></svg>