<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1068" viewBox="0 0 1000 1068" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diplococos gramnegativos intracelulares en una niña de 3 años: abuso sexual hasta demostrar lo contrario"><title>Diplococos gramnegativos intracelulares en una niña de 3 años: abuso sexual hasta demostrar lo contrario</title><rect x="0.75" y="0.75" width="998.5" height="1066.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · descarga vaginal con gonococo</tspan></text><rect x="452.2" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="501.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="501.3" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Gonorrea en la niña prepuberal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neisseria gonorrhoeae es una infección de transmisión sexual.</tspan><tspan x="58.0" dy="17">Su hallazgo, como el de sífilis, VIH, clamidia o tricomonas, es altamente sugestivo de abuso</tspan><tspan x="58.0" dy="17">sexual.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niña de 3 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Descarga vaginal verdosa.</tspan><tspan x="640.0" dy="16">El frotis muestra diplococos gramnegativos</tspan><tspan x="640.0" dy="16">intracelulares.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA AL DIAGNÓSTICO</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 531.7,385.0 88.3,385.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="348.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Niña de 3 años con descarga verdosa y diplococos</tspan><tspan x="310.0" dy="17">gramnegativos intracelulares</tspan></text><line x1="559.8" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="318.0" width="92.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="660.3" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="660.3" dy="0">Abuso sexual</tspan></text><rect x="712.7" y="318.0" width="107.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="766.5" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="766.5" dy="0">Irritación vaginal</tspan></text><rect x="826.4" y="318.0" width="133.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="893.0" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="893.0" dy="0">Ropa íntima ajustada</tspan></text><rect x="614.0" y="350.0" width="163.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="695.7" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="695.7" dy="0">Infección del tracto urinario</tspan></text><rect x="783.3" y="350.0" width="130.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="848.6" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="848.6" dy="0">Diarreas a repetición</tspan></text><polygon points="88.3,389.0 531.7,389.0 483.3,449.0 136.7,449.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="419.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="423.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="415.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿La irritación o la ropa ajustada producen</tspan><tspan x="320.0" dy="17">gonococo?</tspan></text><line x1="511.5" y1="419.0" x2="606.0" y2="419.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="406.0" width="119.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="673.9" y="423.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="673.9" dy="0">✕ Irritación vaginal</tspan></text><line x1="636.0" y1="419.5" x2="723.8" y2="419.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="739.8" y="406.0" width="145.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="812.5" y="423.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="812.5" dy="0">✕ Ropa íntima ajustada</tspan></text><line x1="761.8" y1="419.5" x2="875.1" y2="419.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,453.0 483.3,453.0 435.0,530.0 185.0,530.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="491.5" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="495.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="479.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿La infección urinaria o la</tspan><tspan x="320.0" dy="17">diarrea producen descarga</tspan><tspan x="320.0" dy="17">genital?</tspan></text><line x1="463.2" y1="491.5" x2="606.0" y2="491.5" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="478.5" width="175.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="701.7" y="496.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="701.7" dy="0">✕ Infección del tracto urinario</tspan></text><line x1="636.0" y1="492.0" x2="779.4" y2="492.0" stroke="#94a3b8" stroke-width="1.2"/><rect x="795.4" y="478.5" width="142.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="866.7" y="496.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="866.7" dy="0">✕ Diarreas a repetición</tspan></text><line x1="817.4" y1="492.0" x2="928.1" y2="492.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="534.0" x2="310.0" y2="553.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,552.0 315.0,552.0 310.0,560.0" fill="#0f766e"/><rect x="140.0" y="564.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="593.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">ABUSO SEXUAL</tspan></text><text x="310.0" y="617.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Notificar a protección infantil</tspan><tspan x="310.0" dy="17">Ceftriaxona IM y tamizaje de ITS</tspan></text><rect x="370.6" y="553.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="568.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="563.9" width="346.0" height="92.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="583.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="601.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Una infección de transmisión sexual en una niña</tspan><tspan x="628.0" dy="16">prepuberal, fuera del periodo perinatal, es sugestiva de</tspan><tspan x="628.0" dy="16">abuso sexual.</tspan></text><text x="40.0" y="695.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="705.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="736.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="736.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Irritación vaginal</tspan></text><text x="435.0" y="728.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ropa íntima</tspan><tspan x="435.0" dy="17">ajustada</tspan></text><text x="585.0" y="728.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Infección del tracto</tspan><tspan x="585.0" dy="17">urinario</tspan></text><rect x="663.0" y="708.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="736.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Abuso sexual</tspan></text><text x="885.0" y="728.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Diarreas a</tspan><tspan x="885.0" dy="17">repetición</tspan></text><rect x="40.0" y="759.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="759.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="788.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="780.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no produce</tspan><tspan x="285.0" dy="16">diplococos</tspan><tspan x="285.0" dy="16">intracelulares</tspan></text><text x="435.0" y="780.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no produce</tspan><tspan x="435.0" dy="16">diplococos</tspan><tspan x="435.0" dy="16">intracelulares</tspan></text><text x="585.0" y="788.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no produce</tspan><tspan x="585.0" dy="16">descarga genital</tspan></text><text x="735.0" y="780.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: infección de</tspan><tspan x="735.0" dy="16">transmisión sexual en</tspan><tspan x="735.0" dy="16">una prepuber</tspan></text><text x="885.0" y="788.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no produce</tspan><tspan x="885.0" dy="16">descarga genital</tspan></text><rect x="40.0" y="705.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="849.9" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="877.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="899.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La transmisión perinatal no explica un cuadro a los 3 años; la irritación, la ropa ajustada y los oxiuros no producen ese hallazgo, ni la infección urinaria ni</tspan><tspan x="58.0" dy="18">   la diarrea.</tspan><tspan x="58.0" dy="18">• Confirmar con cultivo o amplificación de ácidos nucleicos (el Gram no basta en niñas) y tamizar otras infecciones de transmisión sexual.</tspan><tspan x="58.0" dy="18">• Tratamiento: ceftriaxona intramuscular en dosis única ajustada al peso; notificación obligatoria a las autoridades de protección infantil.</tspan><tspan x="58.0" dy="18">• Alerta: no esperar la confesión del menor para notificar; entrevista no sugestiva en ambiente protegido, evaluar la seguridad del niño y dar apoyo</tspan><tspan x="58.0" dy="18">   psicológico.</tspan></text><text x="58.0" y="1011.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Sexually Transmitted Infections Treatment Guidelines 2021, MMWR Recomm Rep 2021;70(RR-4); Adams JA et al., J Pediatr Adolesc Gynecol 2016; Nelson</tspan><tspan x="58.0" dy="15">Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>