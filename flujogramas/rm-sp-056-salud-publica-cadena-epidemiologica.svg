<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1077" viewBox="0 0 1000 1077" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La vía respiratoria es la puerta de salida más importante y más difícil de controlar en la cadena epidemiológica"><title>La vía respiratoria es la puerta de salida más importante y más difícil de controlar en la cadena epidemiológica</title><rect x="0.75" y="0.75" width="998.5" height="1075.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · cadena epidemiológica</tspan></text><rect x="428.3" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="492.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="492.6" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cadena epidemiológica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Seis eslabones: agente, reservorio, puerta de salida, transmisión, puerta de entrada y</tspan><tspan x="58.0" dy="17">huésped susceptible.</tspan><tspan x="58.0" dy="17">La puerta de salida es por donde el agente deja el reservorio.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál puerta de salida es la más importante y difícil de</tspan><tspan x="640.0" dy="16">controlar?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PUERTAS DE SALIDA Y CÓMO SE CONTROLA CADA UNA</tspan></text><line x1="421.9" y1="369.4" x2="340.0" y2="314.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="314.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="421.8" x2="340.0" y2="421.8" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="421.8" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="391.9" x2="660.0" y2="368.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="368.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="451.6" x2="660.0" y2="475.3" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="475.3" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.9" y1="474.1" x2="340.0" y2="528.9" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="528.9" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="421.8" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="421.8" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="417.3" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">PUERTA DE</tspan><tspan x="500.0" dy="19">SALIDA</tspan></text><text x="500.0" y="455.3" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">¿cuál es la más difícil?</tspan></text><rect x="40.0" y="269.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="270.0" width="6.0" height="89.2" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="297.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">GENITOURINARIA</tspan></text><text x="190.0" y="321.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ITS: consejería, preservativo</tspan><tspan x="190.0" dy="17">Tratar a los contactos</tspan></text><rect x="40.0" y="376.2" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="377.2" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="405.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">DIGESTIVA</tspan></text><text x="190.0" y="428.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Heces y vómitos</tspan><tspan x="190.0" dy="17">Saneamiento y lavado de manos</tspan></text><rect x="40.0" y="483.3" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="512.2" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">RESPIRATORIA</tspan></text><text x="190.0" y="535.8" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Gotículas y aerosoles</tspan><tspan x="190.0" dy="17">Sin síntomas aún: la más difícil</tspan></text><rect x="144.6" y="564.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="579.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="660.0" y="322.6" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="323.6" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="351.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">PIEL</tspan></text><text x="810.0" y="375.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Heridas y lesiones supurativas</tspan><tspan x="810.0" dy="17">Curación y aislamiento de contacto</tspan></text><rect x="660.0" y="429.8" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="430.8" width="6.0" height="89.2" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="458.6" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">PLACENTA</tspan></text><text x="810.0" y="482.2" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Transmisión vertical</tspan><tspan x="810.0" dy="17">Tamizaje y tratamiento en la gestación</tspan></text><text x="40.0" y="610.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="622.5" width="204.5" height="75.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="664.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Todos respiramos</tspan></text><line x1="248.5" y1="660.0" x2="267.5" y2="660.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,655.0 266.5,665.0 274.5,660.0" fill="#0f766e"/><rect x="278.5" y="622.5" width="204.5" height="75.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="655.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">El agente sale al hablar, toser o</tspan><tspan x="380.8" dy="17">estornudar</tspan></text><line x1="487.0" y1="660.0" x2="506.0" y2="660.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,655.0 505.0,665.0 513.0,660.0" fill="#0f766e"/><rect x="517.0" y="622.5" width="204.5" height="75.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="655.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Se transmite antes de los</tspan><tspan x="619.2" dy="17">síntomas</tspan></text><line x1="725.5" y1="660.0" x2="744.5" y2="660.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,655.0 743.5,665.0 751.5,660.0" fill="#0f766e"/><rect x="755.5" y="622.5" width="204.5" height="75.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="647.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Control: ventilación,</tspan><tspan x="857.8" dy="17">mascarilla, aislamiento y</tspan><tspan x="857.8" dy="17">vacunas</tspan></text><text x="40.0" y="737.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="747.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="778.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tracto</tspan><tspan x="285.0" dy="17">genitourinario</tspan></text><text x="435.0" y="778.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tracto digestivo</tspan></text><rect x="513.0" y="750.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="778.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tracto respiratorio</tspan></text><text x="735.0" y="778.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">La piel</tspan></text><text x="885.0" y="778.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">La placenta</tspan></text><rect x="40.0" y="801.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="801.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="830.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿La más importante y</tspan><tspan x="54.0" dy="16">difícil de controlar?</tspan></text><text x="285.0" y="822.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se controla con</tspan><tspan x="285.0" dy="16">consejería y</tspan><tspan x="285.0" dy="16">preservativo</tspan></text><text x="435.0" y="822.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se controla con</tspan><tspan x="435.0" dy="16">saneamiento y agua</tspan><tspan x="435.0" dy="16">segura</tspan></text><text x="585.0" y="822.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: eliminación</tspan><tspan x="585.0" dy="16">continua, a veces</tspan><tspan x="585.0" dy="16">antes de los síntomas</tspan></text><text x="735.0" y="830.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: limitada a heridas</tspan><tspan x="735.0" dy="16">y lesiones supurativas</tspan></text><text x="885.0" y="830.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es la ruta de la</tspan><tspan x="885.0" dy="16">transmisión vertical</tspan></text><rect x="40.0" y="747.5" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="891.5" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="919.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="941.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Respiratoria: todos respiramos; se elimina al hablar, toser o estornudar, a menudo antes de los síntomas (tuberculosis, sarampión, varicela,</tspan><tspan x="58.0" dy="18">   SARS-CoV-2).</tspan><tspan x="58.0" dy="18">• Control: ventilación, mascarilla, aislamiento y vacunación, medidas que dependen del comportamiento colectivo.</tspan><tspan x="58.0" dy="18">• Digestivo: saneamiento, agua segura y lavado de manos. Genitourinario: consejería, preservativo y tratamiento de contactos.</tspan><tspan x="58.0" dy="18">• Piel: heridas y lesiones supurativas. Placenta: transmisión vertical, se previene con tamizaje y tratamiento en la gestación.</tspan></text><text x="58.0" y="1035.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed. (2019); Heymann DL (ed.), Control of Communicable Diseases Manual, 21.ª ed. (APHA, 2022); Harrison 21.ª ed. (2022).</tspan></text></svg>