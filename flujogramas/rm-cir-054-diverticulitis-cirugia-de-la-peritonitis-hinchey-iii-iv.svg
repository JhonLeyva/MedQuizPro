<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1209" viewBox="0 0 1000 1209" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La peritonitis fecal por diverticulitis (Hinchey IV) se opera con la técnica de Hartmann"><title>La peritonitis fecal por diverticulitis (Hinchey IV) se opera con la técnica de Hartmann</title><rect x="0.75" y="0.75" width="998.5" height="1207.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Diverticulitis · cirugía de la peritonitis (Hinchey III-IV)</tspan></text><rect x="510.3" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="553.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="553.5" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Peritonitis por diverticulitis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hinchey III: pus generalizado. Hinchey IV: contaminación fecal por perforación libre.</tspan><tspan x="58.0" dy="17">Es una emergencia quirúrgica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diverticulitis sigmoidea con peritonitis generalizada</tspan><tspan x="640.0" dy="16">(Hinchey IV).</tspan><tspan x="640.0" dy="16">¿Operación de elección?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ OPERACIÓN SEGÚN EL ESTADIO Y EL ESTADO DEL PACIENTE</tspan></text><rect x="40.0" y="285.0" width="920.0" height="70.0" rx="12" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="54.0" y="304.0" width="74.0" height="32.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="91.0" y="325.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="64"><tspan x="91.0" dy="0">PASO 1</tspan></text><text x="144.0" y="310.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">¿Peritonitis generalizada (Hinchey III-IV)?</tspan></text><text x="144.0" y="329.0" font-size="12" font-weight="600" font-style="normal" fill="#fff7ed" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">Sí: cirugía urgente; el drenaje percutáneo no basta.</tspan></text><line x1="500.0" y1="357.0" x2="500.0" y2="372.0" stroke="#ea580c" stroke-width="2"/><polygon points="495.0,371.0 505.0,371.0 500.0,379.0" fill="#ea580c"/><rect x="40.0" y="385.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="407.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">ESTADIO</tspan></text><text x="412.5" y="407.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">Paciente estable</tspan></text><text x="777.5" y="407.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">Inestable o inmunodeprimido</tspan></text><rect x="40.0" y="425.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Hinchey III</tspan></text><text x="54.0" y="468.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Peritonitis purulenta</tspan></text><rect x="233.0" y="425.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="450.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Resección + anastomosis</tspan></text><text x="245.0" y="466.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Con ileostomía de protección</tspan></text><rect x="598.0" y="425.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="450.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Hartmann</tspan></text><text x="610.0" y="466.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Control del daño</tspan></text><rect x="40.0" y="488.0" width="184.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="514.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Hinchey IV</tspan></text><text x="54.0" y="531.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Peritonitis fecal</tspan></text><rect x="233.0" y="488.0" width="359.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="245.0" y="513.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Hartmann o anastomosis protegida</tspan></text><text x="245.0" y="529.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Según el cirujano y el estado</tspan></text><rect x="598.0" y="488.0" width="359.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="610.0" y="513.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Hartmann</tspan></text><text x="610.0" y="529.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Operación de elección</tspan></text><rect x="856.2" y="477.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="492.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="579.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE HINCHEY MODIFICADA (KAISER) DE LA DIVERTICULITIS</tspan></text><rect x="40.0" y="591.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Estadio</tspan></text><text x="175.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Hallazgo en la TC</tspan></text><text x="572.5" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Conducta</tspan></text><rect x="40.0" y="620.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="639.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">0</tspan></text><text x="175.0" y="639.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Diverticulitis leve: pared engrosada y grasa pericólica sucia</tspan></text><text x="572.5" y="639.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Observación o antibiótico selectivo, dieta</tspan></text><rect x="40.0" y="649.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Ia</tspan></text><text x="175.0" y="668.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Flemón pericólico, sin absceso</tspan></text><text x="572.5" y="668.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Antibiótico o solo observación</tspan></text><rect x="40.0" y="678.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="697.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Ib</tspan></text><text x="175.0" y="697.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Absceso pericólico o mesentérico</tspan></text><text x="572.5" y="697.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Antibiótico; drenaje percutáneo si es &gt; 4-5 cm</tspan></text><rect x="40.0" y="707.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="726.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">II</tspan></text><text x="175.0" y="726.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Absceso pélvico, intraabdominal a distancia o retroperitoneal</tspan></text><text x="572.5" y="726.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Antibiótico; drenaje percutáneo guiado por TC si es grande (&gt; 4-5</tspan><tspan x="572.5" dy="15">cm); cirugía si falla</tspan></text><rect x="40.0" y="751.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="770.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">III</tspan></text><text x="175.0" y="770.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Peritonitis purulenta generalizada</tspan></text><text x="572.5" y="770.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Cirugía urgente: Hartmann o resección con anastomosis ± derivación</tspan><tspan x="572.5" dy="15">en casos elegidos</tspan></text><rect x="40.0" y="795.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="814.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">IV</tspan></text><text x="175.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Peritonitis fecal</tspan></text><text x="572.5" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Cirugía urgente: Hartmann y control del daño</tspan></text><rect x="65.6" y="798.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="813.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="840.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Conducta según WSES 2020 y ASCRS 2020; la TC con contraste IV define el estadio.</tspan></text><text x="40.0" y="887.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="897.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="919.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="919.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Whipple</tspan></text><text x="435.0" y="919.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Devine</tspan></text><text x="585.0" y="919.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Miles</tspan></text><rect x="663.0" y="900.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="919.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hartmann</tspan></text><text x="885.0" y="919.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Kock</tspan></text><rect x="40.0" y="934.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="934.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="971.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Operación?</tspan></text><text x="285.0" y="955.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una operación</tspan><tspan x="285.0" dy="16">del páncreas y el</tspan><tspan x="285.0" dy="16">duodeno</tspan></text><text x="435.0" y="963.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una derivación,</tspan><tspan x="435.0" dy="16">no reseca el sigmoides</tspan></text><text x="585.0" y="955.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es la resección</tspan><tspan x="585.0" dy="16">abdominoperineal del</tspan><tspan x="585.0" dy="16">recto</tspan></text><text x="735.0" y="955.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: resección, muñón</tspan><tspan x="735.0" dy="16">rectal y colostomía</tspan><tspan x="735.0" dy="16">terminal</tspan></text><text x="885.0" y="963.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es un reservorio</tspan><tspan x="885.0" dy="16">ileal continente</tspan></text><rect x="40.0" y="897.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1024.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1052.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1074.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hartmann: resección del sigmoides perforado, cierre del muñón rectal y colostomía terminal; es la operación clásica y la más segura en el inestable.</tspan><tspan x="58.0" dy="18">• En el paciente estable sin comorbilidad grave, la resección con anastomosis primaria e ileostomía de protección es una alternativa (WSES 2020; ASCRS</tspan><tspan x="58.0" dy="18">   2020).</tspan><tspan x="58.0" dy="18">• El lavado laparoscópico no se recomienda en la peritonitis fecal. Reconstrucción del tránsito a los 3-6 meses; hasta 40 % nunca se reconecta.</tspan><tspan x="58.0" dy="18">• Banderas rojas: hipotensión, acidosis, lactato alto o inmunosupresión = control del daño, Hartmann y UCI.</tspan></text><text x="58.0" y="1168.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WSES, diverticulitis aguda del colon izquierdo (2020); ASCRS, diverticulitis (2020); Kaiser et al., Aliment Pharmacol Ther 2005; Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>