<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1147" viewBox="0 0 1000 1147" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el rectocele la estructura comprometida es el elevador del ano, el sostén principal del piso pélvico"><title>En el rectocele la estructura comprometida es el elevador del ano, el sostén principal del piso pélvico</title><rect x="0.75" y="0.75" width="998.5" height="1145.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · prolapso de la pared posterior</tspan></text><rect x="460.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="540.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="540.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rectocele</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Herniación de la pared anterior del recto hacia la pared vaginal posterior.</tspan><tspan x="58.0" dy="17">Es un prolapso del compartimento posterior.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de anatomía</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué estructura anatómica está comprometida en el</tspan><tspan x="640.0" dy="16">rectocele?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS CAPAS DEL PISO PÉLVICO, DE SUPERFICIAL A PROFUNDO</tspan></text><rect x="40.0" y="293.0" width="300.0" height="54.0" rx="0" fill="#fbe38e" stroke="#ffffff" stroke-width="2"/><rect x="40" y="293.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="318.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Complejo esfinteriano anal</tspan></text><text x="54.0" y="334.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Esfínter externo e interno</tspan></text><rect x="376.0" y="295.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="313.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Esfínter anal externo (estriado) e interno (liso)</tspan></text><text x="388.0" y="329.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Continencia fecal; no sostiene el tabique rectovaginal.</tspan></text><rect x="40.0" y="347.0" width="300.0" height="54.0" rx="0" fill="#e89c84" stroke="#ffffff" stroke-width="2"/><rect x="40" y="347.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="372.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Periné superficial</tspan></text><text x="54.0" y="388.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Plano superficial</tspan></text><rect x="376.0" y="349.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="367.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Transverso superficial, bulbocavernoso e isquiocavernoso</tspan></text><text x="388.0" y="383.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Sostén accesorio; no es el soporte principal del recto.</tspan></text><rect x="40.0" y="401.0" width="300.0" height="54.0" rx="0" fill="#f5b8a2" stroke="#ffffff" stroke-width="2"/><rect x="40" y="401.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Membrana perineal</tspan></text><text x="54.0" y="442.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Plano medio</tspan></text><rect x="376.0" y="403.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="421.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Transverso profundo del periné y esfínter uretral</tspan></text><text x="388.0" y="437.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Sostiene la uretra y cierra el hiato urogenital.</tspan></text><rect x="40.0" y="455.0" width="300.0" height="54.0" rx="0" fill="#fbd5c4" stroke="#ffffff" stroke-width="2"/><rect x="40" y="455.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="480.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Diafragma pélvico</tspan></text><text x="54.0" y="496.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Plano profundo</tspan></text><text x="328.0" y="486.0" font-size="11" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="end" data-max="96"><tspan x="328.0" dy="0">◄ llega aquí</tspan></text><rect x="376.0" y="457.0" width="584.0" height="50.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="388.0" y="475.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Elevador del ano: pubococcígeo, puborrectal e iliococcígeo</tspan></text><text x="388.0" y="491.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Sostiene recto, vagina y vejiga; su debilidad produce el rectocele.</tspan></text><line x1="346.0" y1="299.0" x2="346.0" y2="503.0" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="346.0" y1="499.0" x2="346.0" y2="494.0" stroke="#b91c1c" stroke-width="2.2"/><polygon points="341.0,494.0 351.0,494.0 346.0,503.0" fill="#b91c1c"/><text x="376.0" y="287.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="584"><tspan x="376.0" dy="0">QUÉ CONTIENE CADA CAPA</tspan></text><text x="40.0" y="287.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="300"><tspan x="40.0" dy="0">CAPAS (DE SUPERFICIAL A PROFUNDA)</tspan></text><rect x="872.3" y="446.0" width="55.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="461.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ AQUÍ</tspan></text><rect x="40.0" y="527.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="553.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Rectocele = falla del elevador del ano y del tabique rectovaginal</tspan></text><text x="60.0" y="572.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El piramidal es un músculo abdominal; los demás son del periné o del esfínter anal.</tspan></text><text x="40.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PROLAPSO DE ÓRGANOS PÉLVICOS POR COMPARTIMENTO</tspan></text><rect x="40.0" y="645.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="664.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Compartimento</tspan></text><text x="250.0" y="664.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Órgano que desciende</tspan></text><text x="610.0" y="664.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Defecto de sostén</tspan></text><rect x="40.0" y="674.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="693.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Anterior</tspan></text><text x="250.0" y="693.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Vejiga: cistocele</tspan></text><text x="610.0" y="693.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Pared vaginal anterior</tspan></text><rect x="40.0" y="703.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="722.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Apical</tspan></text><text x="250.0" y="722.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Útero o cúpula vaginal</tspan></text><text x="610.0" y="722.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Ligamentos de sostén apical</tspan></text><rect x="40.0" y="732.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="751.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Posterior</tspan></text><text x="250.0" y="751.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Recto: rectocele</tspan></text><text x="610.0" y="751.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Tabique rectovaginal y elevador del ano</tspan></text><rect x="140.6" y="735.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="750.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="777.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Se estadifica con POP-Q de 0 a IV (ACOG 2019).</tspan></text><text x="40.0" y="824.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="834.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="865.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="865.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Piramidal</tspan></text><text x="435.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Transverso del</tspan><tspan x="435.0" dy="17">periné</tspan></text><text x="585.0" y="865.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Bulbo cavernoso</tspan></text><text x="735.0" y="865.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Esfínter anal</tspan></text><rect x="813.0" y="837.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="865.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Elevador del ano</tspan></text><rect x="40.0" y="888.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="888.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="909.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Estructura</tspan><tspan x="54.0" dy="16">comprometida?</tspan></text><text x="285.0" y="909.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es un músculo de</tspan><tspan x="285.0" dy="16">la pared abdominal</tspan></text><text x="435.0" y="917.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: periné superficial</tspan></text><text x="585.0" y="917.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: periné superficial</tspan></text><text x="735.0" y="909.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: forma parte del</tspan><tspan x="735.0" dy="16">complejo esfinteriano</tspan></text><text x="885.0" y="909.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: sostén principal del</tspan><tspan x="885.0" dy="16">piso pélvico</tspan></text><rect x="40.0" y="834.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="962.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="990.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1012.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Debilidad del tabique rectovaginal y del elevador del ano (pubococcígeo, puborrectal e iliococcígeo), por partos vaginales traumáticos, multiparidad,</tspan><tspan x="58.0" dy="18">   macrosomía, fórceps y esfuerzo crónico.</tspan><tspan x="58.0" dy="18">• Clínica: sensación de masa o peso vaginal, dificultad para evacuar que mejora con digitación vaginal o perineal, tenesmo y dispareunia.</tspan><tspan x="58.0" dy="18">• Se clasifica con POP-Q en estadios 0 a IV (ACOG PB 214, 2019).</tspan><tspan x="58.0" dy="18">• No son el sostén principal: el piramidal (músculo abdominal), el transverso del periné, el bulbocavernoso y el esfínter anal.</tspan></text><text x="58.0" y="1106.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletin N.º 214, Prolapso de órganos pélvicos (Obstet Gynecol 2019); Moore, Anatomía con orientación clínica, 9.ª ed. (2022).</tspan></text></svg>