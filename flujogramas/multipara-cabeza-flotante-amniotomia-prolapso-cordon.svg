<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="835" viewBox="0 0 1000 835" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gran multípara con presentación cefálica flotante: si se rompen las membranas, el riesgo más frecuente es el prolapso de cordón"><title>Gran multípara con presentación cefálica flotante: si se rompen las membranas, el riesgo más frecuente es el prolapso de cordón</title><rect x="0.75" y="0.75" width="998.5" height="833.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Amniotomía · prolapso de cordón</tspan></text><rect x="398.9" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="486.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="486.1" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Prolapso de cordón</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El cordón baja por delante de la presentación cuando la cabeza no ocupa la pelvis (flotante,</tspan><tspan x="58.0" dy="17">podálica, transversa, polihidramnios, gran multípara).</tspan><tspan x="58.0" dy="17">Por eso la amniotomía solo se hace con la cabeza encajada (fija).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gran multípara de 38 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fase activa; dilatación 1 cm.</tspan><tspan x="640.0" dy="16">Cefálica flotante; membranas íntegras: se hace</tspan><tspan x="640.0" dy="16">amniotomía.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿SE PUEDE ROMPER LA BOLSA?</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="160"><tspan x="54.0" dy="0">PRESENTACIÓN</tspan></text><text x="405.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="350"><tspan x="405.0" dy="0">Membranas íntegras</tspan></text><text x="775.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="350"><tspan x="775.0" dy="0">Tras romperlas</tspan></text><rect x="40.0" y="325.0" width="174.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Cabeza encajada</tspan></text><text x="54.0" y="368.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Fija en la pelvis</tspan></text><rect x="223.0" y="325.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="235.0" y="357.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Amniotomía segura</tspan></text><rect x="593.0" y="325.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="357.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Bajo riesgo</tspan></text><rect x="40.0" y="388.0" width="174.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="414.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Cabeza flotante</tspan></text><text x="54.0" y="431.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Este caso</tspan></text><rect x="223.0" y="388.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="235.0" y="413.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Procúbito posible</tspan></text><text x="235.0" y="429.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Cordón delante</tspan></text><rect x="593.0" y="388.0" width="364.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="605.0" y="413.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">PROLAPSO DE CORDÓN</tspan></text><text x="605.0" y="429.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Riesgo alto</tspan></text><rect x="856.2" y="377.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="392.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><text x="44.0" y="467.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Gran multípara: el útero y la pelvis laxos dejan la cabeza alta.</tspan></text><text x="40.0" y="515.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="525.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="564.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="556.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Procúbito de</tspan><tspan x="285.0" dy="17">cordón</tspan></text><rect x="363.0" y="528.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="564.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Prolapso de cordón</tspan></text><text x="585.0" y="556.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Asinclitismo</tspan><tspan x="585.0" dy="17">anterior</tspan></text><text x="735.0" y="556.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Asinclitismo</tspan><tspan x="735.0" dy="17">posterior</tspan></text><text x="885.0" y="547.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Desprendimiento</tspan><tspan x="885.0" dy="17">prematuro de</tspan><tspan x="885.0" dy="17">placenta</tspan></text><rect x="40.0" y="596.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="596.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="633.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Riesgo más frecuente?</tspan></text><text x="285.0" y="625.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Es antes de romper las</tspan><tspan x="285.0" dy="16">membranas</tspan></text><text x="435.0" y="625.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: cabeza no</tspan><tspan x="435.0" dy="16">encajada</tspan></text><text x="585.0" y="625.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es de la cabeza</tspan><tspan x="585.0" dy="16">encajada</tspan></text><text x="735.0" y="625.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es de la cabeza</tspan><tspan x="735.0" dy="16">encajada</tspan></text><text x="885.0" y="617.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Posible con</tspan><tspan x="885.0" dy="16">polihidramnios, menos</tspan><tspan x="885.0" dy="16">frecuente</tspan></text><rect x="40.0" y="525.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="686.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="714.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="736.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si ocurre: elevar la presentación con la mano, posición genupectoral o Trendelenburg, llenar la vejiga y cesárea de emergencia.</tspan><tspan x="58.0" dy="18">• No manipular el cordón (vasoespasmo).</tspan><tspan x="58.0" dy="18">• Procúbito: cordón delante con membranas íntegras (antes de romperlas).</tspan></text><text x="58.0" y="794.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: RCOG Green-top n.º 50 (2014); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>