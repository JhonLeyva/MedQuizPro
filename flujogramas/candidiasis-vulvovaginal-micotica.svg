<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1026" viewBox="0 0 820 1026" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Candidiasis vulvovaginal"><title>Candidiasis vulvovaginal</title><rect width="820" height="1026" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Candidiasis vulvovaginal</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · GIN-017 · Ginecología y Obstetricia</tspan></text><rect x="90" y="144" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Flujo vaginal anormal</tspan></text><line x1="410.0" y1="222" x2="410.0" y2="242" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,240 417.0,240 410.0,250" fill="#94a3b8"/><rect x="90" y="252" width="640" height="76" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="290.0" r="12" fill="#d97706"/><text x="120" y="295.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="280" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="304" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Cómo es el flujo?</tspan></text><line x1="410.0" y1="330" x2="410.0" y2="350" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,348 417.0,348 410.0,358" fill="#94a3b8"/><rect x="90" y="360" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="388" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="412" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Blanco grumoso («leche cortada») con prurito intenso, pH &lt;</tspan><tspan x="108" dy="22">4.5 → candidiasis</tspan></text><line x1="410.0" y1="460" x2="410.0" y2="480" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,478 417.0,478 410.0,488" fill="#94a3b8"/><rect x="90" y="490" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="518" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="542" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Gris homogéneo con olor a pescado, pH &gt; 4.5 → vaginosis</tspan><tspan x="108" dy="22">bacteriana</tspan></text><line x1="410.0" y1="590" x2="410.0" y2="610" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,608 417.0,608 410.0,618" fill="#94a3b8"/><rect x="90" y="620" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="648" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="672" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Amarillo verdoso espumoso con cérvix «en fresa» →</tspan><tspan x="108" dy="22">tricomoniasis</tspan></text><line x1="410.0" y1="720" x2="410.0" y2="740" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,738 417.0,738 410.0,748" fill="#94a3b8"/><rect x="90" y="750" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="778" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="802" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Candidiasis: clotrimazol vaginal o fluconazol 150 mg VO en</tspan><tspan x="108" dy="22">dosis única</tspan></text><rect x="40" y="878" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="878" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="904" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="928" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">La candidiasis no es de transmisión sexual: no se trata a la pareja</tspan><tspan x="62" dy="21">asintomática.</tspan></text><text x="410.0" y="1004" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
