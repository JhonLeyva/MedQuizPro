<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="487" viewBox="0 0 1000 487" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Síndrome de flujo vaginal"><title>Síndrome de flujo vaginal</title><rect x="0.75" y="0.75" width="998.5" height="485.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">GINECOLOGÍA Y OBSTETRICIA ENAM: SÍNDROME DE FLUJO VAGINAL</tspan></text><rect x="745.5" y="32.0" width="218.5" height="24" rx="12" fill="#134e4a"/><text x="854.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="202"><tspan x="854.8" dy="0">GINECOLOGÍA Y OBSTETRICIA</tspan></text><rect x="190.0" y="90.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Mujer de 25 años con flujo blanco grumoso y prurito intenso</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">¿Qué tipo de vaginitis presenta?</tspan></text><line x1="500.0" y1="157.0" x2="500.0" y2="177.0" stroke="#0f766e" stroke-width="2"/><line x1="186.0" y1="177.0" x2="814.0" y2="177.0" stroke="#0f766e" stroke-width="2"/><line x1="186.0" y1="177.0" x2="186.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><polygon points="181.0,195.0 191.0,195.0 186.0,203.0" fill="#0f766e"/><line x1="500.0" y1="177.0" x2="500.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,195.0 505.0,195.0 500.0,203.0" fill="#0f766e"/><line x1="814.0" y1="177.0" x2="814.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><polygon points="809.0,195.0 819.0,195.0 814.0,203.0" fill="#0f766e"/><rect x="40.0" y="203.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><path d="M40.0,213.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#0f766e"/><text x="186.0" y="227.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="264"><tspan x="186.0" dy="0">Candidiasis</tspan></text><text x="186.0" y="259.0" font-size="12" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="186.0" dy="0">Flujo blanco grumoso</tspan><tspan x="186.0" dy="17">(«leche cortada»)</tspan><tspan x="186.0" dy="17">Prurito intenso · pH &lt; 4.5</tspan><tspan x="186.0" dy="17">→ clotrimazol o fluconazol</tspan></text><rect x="239.8" y="193.0" width="84.2" height="20" rx="10" fill="#f59e0b"/><text x="281.9" y="207.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="281.9" dy="0">✓ RESPUESTA</tspan></text><rect x="354.0" y="203.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M354.0,213.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="500.0" y="227.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Vaginosis bacteriana</tspan></text><text x="500.0" y="259.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Flujo gris homogéneo</tspan><tspan x="500.0" dy="17">Olor a pescado (aminas)</tspan><tspan x="500.0" dy="17">pH &gt; 4.5 · células clave</tspan><tspan x="500.0" dy="17">→ metronidazol</tspan></text><rect x="668.0" y="203.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M668.0,213.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="814.0" y="227.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Tricomoniasis</tspan></text><text x="814.0" y="259.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Flujo amarillo verdoso</tspan><tspan x="814.0" dy="17">espumoso</tspan><tspan x="814.0" dy="17">Cérvix «en fresa»</tspan><tspan x="814.0" dy="17">→ metronidazol a la pareja</tspan></text><rect x="40" y="360.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="388.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="410.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La candidiasis no es de transmisión sexual: no se trata a la pareja asintomática.</tspan><tspan x="58.0" dy="18">• Fluconazol 150 mg VO dosis única o clotrimazol vaginal.</tspan></text><text x="58.0" y="450.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – NTS N.° 240-MINSA/DGIESP-2026 (ITS) · CDC STI Treatment Guidelines 2021</tspan></text></svg>
