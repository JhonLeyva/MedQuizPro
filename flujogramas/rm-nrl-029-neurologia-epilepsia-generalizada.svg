<polygon points="240.0,326.0 266.0,291.0 734.0,291.0 760.0,326.0 734.0,361.0 266.0,361.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="326.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="331.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="322.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Epilepsia generalizada con crisis tónico-clónicas: ¿quién la</tspan><tspan x="519.0" dy="17">recibe?</tspan></text><rect x="40.0" y="427.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">ÁCIDO VALPROICO</tspan></text><text x="188.7" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Mayor eficacia y espectro amplio</tspan><tspan x="188.7" dy="17">Cubre mioclonías y ausencias</tspan></text><rect x="351.3" y="427.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">LAMOTRIGINA O LEVETIRACETAM</tspan></text><text x="500.0" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Valproato solo si fallan otros</tspan><tspan x="500.0" dy="17">Con prevención de embarazo</tspan></text><rect x="662.7" y="427.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">EVITAR CARBAMAZEPINA Y FENITOÍNA</tspan></text><text x="811.3" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Pueden agravar las crisis</tspan><tspan x="811.3" dy="17">Bloqueadores de sodio</tspan></text><text x="40.0" y="557.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="567.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="590.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="570.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="590.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ácido valproico</tspan></text><text x="435.0" y="590.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fenobarbital</tspan></text><text x="585.0" y="590.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Fenitoína</tspan></text><text x="735.0" y="590.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Primidona</tspan></text><text x="885.0" y="590.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Carbamazepina</tspan></text><rect x="40.0" y="604.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="604.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="641.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primera línea?</tspan></text><text x="285.0" y="633.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: espectro amplio y</tspan><tspan x="285.0" dy="16">mejor evidencia</tspan></text><text x="435.0" y="625.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: segunda línea por</tspan><tspan x="435.0" dy="16">sedación y efectos</tspan><tspan x="435.0" dy="16">cognitivos</tspan></text><text x="585.0" y="633.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: puede agravar</tspan><tspan x="585.0" dy="16">mioclonías y ausencias</tspan></text><text x="735.0" y="625.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: segunda línea por</tspan><tspan x="735.0" dy="16">sedación y efectos</tspan><tspan x="735.0" dy="16">cognitivos</tspan></text><text x="885.0" y="633.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: puede agravar</tspan><tspan x="885.0" dy="16">mioclonías y ausencias</tspan></text><rect x="40.0" y="567.5" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="694.5" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="722.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="744.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Valproato: espectro amplio (canales de sodio, canales de calcio tipo T y GABA); controla también mioclonías y ausencias. ILAE 2013 lo ubica con la</tspan><tspan x="58.0" dy="18">   mejor evidencia.</tspan><tspan x="58.0" dy="18">• Teratogénico (tubo neural, malformaciones, neurodesarrollo): no usar en mujeres en edad fértil salvo que otros fallen y exista un programa de prevención</tspan><tspan x="58.0" dy="18">   de embarazo (NICE 2022).</tspan><tspan x="58.0" dy="18">• En mujeres en edad fértil se prefieren lamotrigina o levetiracetam. Carbamazepina y fenitoína pueden agravar mioclonías y ausencias.</tspan><tspan x="58.0" dy="18">• Fenobarbital y primidona: segunda línea por sedación y efectos cognitivos. Vigilar enzimas hepáticas y plaquetas con valproato.</tspan></text><text x="58.0" y="856.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ILAE, evidence review of antiepileptic drugs as initial monotherapy (Glauser, Epilepsia 2013;54:551); NICE NG217 (2022); Goodman y Gilman, 14.ª ed. (2023).</tspan></text></svg>