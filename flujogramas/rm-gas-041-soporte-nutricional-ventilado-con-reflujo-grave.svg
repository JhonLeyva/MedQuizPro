<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1073" viewBox="0 0 1000 1073" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el ventilado con reflujo grave la nutrición enteral por sonda nasoyeyunal reduce la aspiración"><title>En el ventilado con reflujo grave la nutrición enteral por sonda nasoyeyunal reduce la aspiración</title><rect x="0.75" y="0.75" width="998.5" height="1072.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Soporte nutricional · ventilado con reflujo grave</tspan></text><rect x="482.3" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="565.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="565.0" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nutrición del paciente ventilado</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La vía enteral temprana es preferible a la parenteral: preserva la barrera intestinal.</tspan><tspan x="58.0" dy="17">Se inicia con sonda nasogástrica y se pasa a vía pospilórica si hay riesgo de aspiración.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 65 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Accidente cerebrovascular con ventilación asistida.</tspan><tspan x="640.0" dy="16">Historia de reflujo gastroesofágico severo.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="391.0" x2="811.3" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="391.0" x2="188.7" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,419.0 193.7,419.0 188.7,427.0" fill="#94a3b8"/><line x1="500.0" y1="391.0" x2="500.0" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,419.0 505.0,419.0 500.0,427.0" fill="#94a3b8"/><line x1="811.3" y1="391.0" x2="811.3" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,419.0 816.3,419.0 811.3,427.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="391.0" x2="811.3" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="811.3" y1="391.0" x2="811.3" y2="420.0" stroke="#0f766e" stroke-width="3"/><polygon points="806.3,419.0 816.3,419.0 811.3,427.0" fill="#0f766e"/><rect x="124.6" y="400.0" width="128.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">No tolera la vía enteral</tspan></text><rect x="413.1" y="400.0" width="173.7" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Tolera, sin riesgo de aspiración</tspan></text><rect x="668.8" y="400.0" width="285.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="811.3" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Reflujo severo o alto riesgo de aspiración (este caso)</tspan></text><polygon points="240.0,326.0 266.0,291.0 734.0,291.0 760.0,326.0 734.0,361.0 266.0,361.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="326.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="331.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="322.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Paciente ventilado que necesita nutrición: ¿tolera la vía</tspan><tspan x="519.0" dy="17">enteral?</tspan></text><rect x="40.0" y="427.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">NUTRICIÓN PARENTERAL</tspan></text><text x="188.7" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Solo si falla la vía enteral</tspan><tspan x="188.7" dy="17">Más complicaciones infecciosas</tspan></text><rect x="351.3" y="427.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">SONDA NASOGÁSTRICA</tspan></text><text x="500.0" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Inicio habitual</tspan><tspan x="500.0" dy="17">Cabecera a 30-45 grados</tspan></text><rect x="662.7" y="427.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="811.3" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">SONDA NASOYEYUNAL</tspan></text><text x="811.3" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Posición pospilórica</tspan><tspan x="811.3" dy="17">Infusión continua y procinético</tspan></text><text x="40.0" y="551.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">VÍA DE NUTRICIÓN EN EL PACIENTE CRÍTICO</tspan></text><rect x="40.0" y="563.5" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="582.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Vía</tspan></text><text x="250.0" y="582.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Cuándo</tspan></text><text x="610.0" y="582.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Nota</tspan></text><rect x="40.0" y="592.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="611.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Nasogástrica</tspan></text><text x="250.0" y="611.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Inicio habitual si hay tolerancia</tspan></text><text x="610.0" y="611.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Cabecera elevada 30-45 grados</tspan></text><rect x="40.0" y="621.5" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="640.5" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Nasoyeyunal</tspan></text><text x="250.0" y="640.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Intolerancia gástrica persistente o alto riesgo de aspiración</tspan></text><text x="610.0" y="640.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Evita el llenado gástrico; este caso</tspan></text><rect x="140.6" y="625.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="640.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="650.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="669.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Parenteral</tspan></text><text x="250.0" y="669.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Cuando la vía enteral no se tolera</tspan></text><text x="610.0" y="669.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Más complicaciones infecciosas</tspan></text><text x="40.0" y="719.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="729.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="760.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="732.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="752.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Alimentación por</tspan><tspan x="285.0" dy="17">sonda nasoyeyunal</tspan></text><text x="435.0" y="752.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Nutrición parenteral</tspan><tspan x="435.0" dy="17">total</tspan></text><text x="585.0" y="752.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antibioticoterapia</tspan><tspan x="585.0" dy="17">prolongada</tspan></text><text x="735.0" y="752.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Alimentación por</tspan><tspan x="735.0" dy="17">sonda nasogástrica</tspan></text><text x="885.0" y="760.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Nada por vía oral</tspan></text><rect x="40.0" y="783.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="783.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="812.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Medida más</tspan><tspan x="54.0" dy="16">apropiada?</tspan></text><text x="285.0" y="812.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: evita el llenado</tspan><tspan x="285.0" dy="16">gástrico y el reflujo</tspan></text><text x="435.0" y="804.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: aumenta las</tspan><tspan x="435.0" dy="16">complicaciones</tspan><tspan x="435.0" dy="16">infecciosas</tspan></text><text x="585.0" y="812.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: favorece la</tspan><tspan x="585.0" dy="16">resistencia</tspan></text><text x="735.0" y="812.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: mantiene el riesgo</tspan><tspan x="735.0" dy="16">de aspiración</tspan></text><text x="885.0" y="812.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: deja al paciente sin</tspan><tspan x="885.0" dy="16">aporte calórico</tspan></text><rect x="40.0" y="729.5" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="873.5" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="901.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="923.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Riesgo de aspiración: conciencia reducida, disfagia, decúbito, vaciamiento gástrico lento y reflujo.</tspan><tspan x="58.0" dy="18">• Sonda nasoyeyunal (más allá del ángulo de Treitz): el estómago no se llena y disminuye la regurgitación. Se reserva para intolerancia gástrica o alto</tspan><tspan x="58.0" dy="18">   riesgo de aspiración.</tspan><tspan x="58.0" dy="18">• Medidas generales: cabecera a 30-45 grados, infusión continua, presión del balón de neumotaponamiento y procinéticos (metoclopramida o eritromicina).</tspan><tspan x="58.0" dy="18">• Alerta: confirmar la posición de la sonda con radiografía. La nutrición parenteral solo si no se tolera la vía enteral.</tspan></text><text x="58.0" y="1017.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Singer P et al., ESPEN practical and partially revised guideline: clinical nutrition in the intensive care unit, Clin Nutr 2023;42:1671-89; Harrison Principios de Medicina</tspan><tspan x="58.0" dy="15">Interna, 21.ª ed. (2022)</tspan></text></svg>