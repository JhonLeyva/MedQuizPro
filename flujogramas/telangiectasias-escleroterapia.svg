<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1408" viewBox="0 0 1000 1408" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Telangiectasias en muslos y piernas sin edema ni cambios de piel (CEAP C1): escleroterapia"><title>Telangiectasias en muslos y piernas sin edema ni cambios de piel (CEAP C1): escleroterapia</title><rect x="0.75" y="0.75" width="998.5" height="1407.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedad venosa crónica · várices</tspan></text><rect x="419.5" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="470.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="470.1" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad venosa crónica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Las venas superficiales se dilatan por válvulas insuficientes.</tspan><tspan x="58.0" dy="17">La clasificación CEAP gradúa la clínica de C0 a C6.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 33 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">3 meses notando cambios en las venas de ambas</tspan><tspan x="640.0" dy="16">piernas.</tspan><tspan x="640.0" dy="16">Telangiectasias en cara interna de muslos y piernas;</tspan><tspan x="640.0" dy="16">sin edema ni lesiones de piel.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="733.5" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#94a3b8"/><line x1="733.5" y1="411.0" x2="733.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,439.0 738.5,439.0 733.5,447.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#0f766e"/><rect x="170.5" y="420.0" width="191.9" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Telangiectasias &lt; 1 mm (este caso)</tspan></text><rect x="687.6" y="420.0" width="91.8" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Várices ≥ 3 mm</tspan></text><polygon points="240.0,352.0 266.0,323.0 734.0,323.0 760.0,352.0 734.0,381.0 266.0,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Venas visibles en las piernas: ¿qué tipo?</tspan></text><rect x="40.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">ESCLEROTERAPIA</tspan></text><text x="266.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Polidocanol</tspan><tspan x="266.5" dy="17">Medias de compresión</tspan></text><rect x="507.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Eco-Doppler</tspan></text><text x="733.5" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Reflujo de safena: ablación endovenosa</tspan></text><text x="40.0" y="577.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="589.5" width="920.0" height="475.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="603.5" width="250.8" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="181.4" y="623.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="181.4" dy="0">CLASIFICACIÓN CEAP (CLÍNICA)</tspan></text><text x="322.8" y="623.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="619"><tspan x="322.8" dy="0">Revisión 2020: de C0 (sin signos) a C6 (úlcera activa).</tspan></text><rect x="56.0" y="647.5" width="888.0" height="36.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="66.0" y="653.5" width="36.4" height="24.0" rx="12" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="84.2" y="670.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="84.2" dy="0">C0</tspan></text><text x="140.0" y="670.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="194"><tspan x="140.0" dy="0">Sin signos visibles</tspan></text><text x="350.0" y="669.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="562"><tspan x="350.0" dy="0">Puede haber síntomas</tspan></text><rect x="56.0" y="689.5" width="888.0" height="36.0" rx="8" fill="#fffbeb" stroke="#ea580c" stroke-width="2"/><rect x="66.0" y="695.5" width="36.4" height="24.0" rx="12" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="84.2" y="712.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="84.2" dy="0">C1</tspan></text><text x="140.0" y="712.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="140.0" dy="0">Telangiectasias o reticulares</tspan></text><text x="350.0" y="711.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="562"><tspan x="350.0" dy="0">&lt; 1 mm o &lt; 3 mm</tspan></text><rect x="880.6" y="696.5" width="53.4" height="22.0" rx="11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="907.3" y="711.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="907.3" dy="0">◆ AQUÍ</tspan></text><rect x="56.0" y="731.5" width="888.0" height="36.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="66.0" y="737.5" width="36.4" height="24.0" rx="12" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="84.2" y="754.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="84.2" dy="0">C2</tspan></text><text x="140.0" y="754.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="194"><tspan x="140.0" dy="0">Várices</tspan></text><text x="350.0" y="753.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="562"><tspan x="350.0" dy="0">≥ 3 mm</tspan></text><rect x="56.0" y="773.5" width="888.0" height="36.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="66.0" y="779.5" width="36.4" height="24.0" rx="12" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="84.2" y="796.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="84.2" dy="0">C3</tspan></text><text x="140.0" y="796.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="194"><tspan x="140.0" dy="0">Edema</tspan></text><text x="350.0" y="795.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="562"><tspan x="350.0" dy="0">De origen venoso</tspan></text><rect x="56.0" y="815.5" width="888.0" height="36.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="66.0" y="821.5" width="36.4" height="24.0" rx="12" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="84.2" y="838.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="84.2" dy="0">C4</tspan></text><text x="140.0" y="838.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="194"><tspan x="140.0" dy="0">Cambios de piel</tspan></text><text x="350.0" y="837.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="562"><tspan x="350.0" dy="0">Pigmentación, eccema, lipodermatoesclerosis</tspan></text><rect x="56.0" y="857.5" width="888.0" height="36.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="66.0" y="863.5" width="36.4" height="24.0" rx="12" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="84.2" y="880.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="84.2" dy="0">C5</tspan></text><text x="140.0" y="880.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="194"><tspan x="140.0" dy="0">Úlcera cicatrizada</tspan></text><text x="350.0" y="879.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="562"><tspan x="350.0" dy="0"></tspan></text><rect x="56.0" y="899.5" width="888.0" height="36.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="66.0" y="905.5" width="36.4" height="24.0" rx="12" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="84.2" y="922.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="84.2" dy="0">C6</tspan></text><text x="140.0" y="922.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="194"><tspan x="140.0" dy="0">Úlcera activa</tspan></text><text x="350.0" y="921.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="562"><tspan x="350.0" dy="0">La más grave</tspan></text><text x="56.0" y="965.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="974.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="989.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="989.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Solo telangiectasias, sin edema ni cambios de piel</tspan></text><rect x="56.0" y="1011.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="1034.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">C1: escleroterapia y medias de compresión; Doppler si aparecen várices o síntomas.</tspan></text><text x="40.0" y="1104.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1114.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1154.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1117.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1154.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Escleroterapia</tspan></text><text x="435.0" y="1145.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antiinflamatorios</tspan><tspan x="435.0" dy="17">tópicos</tspan></text><text x="585.0" y="1145.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Extracción</tspan><tspan x="585.0" dy="17">segmentaria</tspan></text><text x="735.0" y="1154.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Safenectomía</tspan></text><text x="885.0" y="1137.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ablación</tspan><tspan x="885.0" dy="17">endovenosa con</tspan><tspan x="885.0" dy="17">láser</tspan></text><rect x="40.0" y="1185.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1185.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1214.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicado?</tspan></text><text x="285.0" y="1214.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: telangiectasias C1</tspan></text><text x="435.0" y="1214.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no tratan la vena</tspan></text><text x="585.0" y="1214.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es para várices</tspan></text><text x="735.0" y="1206.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es para reflujo de</tspan><tspan x="735.0" dy="16">safena</tspan></text><text x="885.0" y="1206.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es para reflujo de</tspan><tspan x="885.0" dy="16">safena</tspan></text><rect x="40.0" y="1114.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1259.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1287.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1309.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• C1 (telangiectasias y venas reticulares): escleroterapia con polidocanol si molestan o por estética; medias de compresión.</tspan><tspan x="58.0" dy="18">• C2 con reflujo de la safena: ablación endovenosa (láser o radiofrecuencia), preferida sobre la safenectomía.</tspan><tspan x="58.0" dy="18">• Pedir eco-Doppler venoso si hay várices, edema o síntomas.</tspan></text><text x="58.0" y="1367.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESVS, guía de enfermedad venosa crónica (2022); CEAP revisada (2020).</tspan></text></svg>