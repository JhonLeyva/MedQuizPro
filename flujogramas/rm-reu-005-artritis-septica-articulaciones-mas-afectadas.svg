<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1031" viewBox="0 0 1000 1031" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La rodilla es la articulación más afectada en la artritis séptica, cerca de la mitad de los casos"><title>La rodilla es la articulación más afectada en la artritis séptica, cerca de la mitad de los casos</title><rect x="0.75" y="0.75" width="998.5" height="1029.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Artritis séptica · articulaciones más afectadas</tspan></text><rect x="470.1" y="32.0" width="227.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="583.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="211"><tspan x="583.8" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Artritis séptica bacteriana</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Urgencia médica: destruye el cartílago en pocos días.</tspan><tspan x="58.0" dy="17">En adultos es monoarticular en cerca del 90 %.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de epidemiología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la articulación más afectada en una artritis</tspan><tspan x="640.0" dy="16">infecciosa?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FRECUENCIA DE LAS ARTICULACIONES EN LA ARTRITIS SÉPTICA</tspan></text><polygon points="180.0,269.0 280.0,269.0 308.0,325.0 152.0,325.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="302.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="230.0" dy="0">Rodilla</tspan></text><rect x="446.0" y="269.0" width="514.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="461.0" y="293.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Alrededor de la mitad de los casos</tspan></text><text x="461.0" y="310.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Derrame, calor y limitación del movimiento activo y pasivo.</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="152.0,331.0 308.0,331.0 336.0,387.0 124.0,387.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="144"><tspan x="230.0" dy="0">Cadera</tspan></text><rect x="446.0" y="331.0" width="514.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="461.0" y="355.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Segunda en frecuencia</tspan></text><text x="461.0" y="372.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Sospechar siempre en niños y en pacientes con prótesis.</tspan></text><polygon points="124.0,393.0 336.0,393.0 364.0,449.0 96.0,449.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="200"><tspan x="230.0" dy="0">Hombro</tspan></text><rect x="446.0" y="393.0" width="514.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="461.0" y="417.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Tercera en frecuencia</tspan></text><text x="461.0" y="434.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Dolor con la movilidad pasiva.</tspan></text><polygon points="96.0,455.0 364.0,455.0 392.0,511.0 68.0,511.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="488.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="256"><tspan x="230.0" dy="0">Muñeca</tspan></text><rect x="446.0" y="455.0" width="514.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="461.0" y="479.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Cuarta en frecuencia</tspan></text><text x="461.0" y="496.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Diferenciar de gota y artritis reumatoide con la artrocentesis.</tspan></text><polygon points="68.0,517.0 392.0,517.0 420.0,573.0 40.0,573.0" fill="#14b8a6" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="550.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="230.0" dy="0">Tobillo</tspan></text><rect x="446.0" y="517.0" width="514.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="461.0" y="541.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Quinta en frecuencia</tspan></text><text x="461.0" y="558.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">En jóvenes activos, pensar en gonococo.</tspan></text><text x="230.0" y="591.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="380"><tspan x="230.0" dy="0">▲ más frecuente · ▼ menos</tspan></text><rect x="40.0" y="613.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="639.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Rodilla = articulación más frecuente</tspan></text><text x="60.0" y="658.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Toda monoartritis aguda febril exige artrocentesis y antibiótico endovenoso.</tspan></text><text x="40.0" y="725.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="735.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="757.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hombro</tspan></text><text x="435.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Muñeca</tspan></text><text x="585.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tobillo</tspan></text><rect x="663.0" y="738.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Rodilla</tspan></text><text x="885.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cadera</tspan></text><rect x="40.0" y="772.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="772.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="801.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿La más afectada?</tspan></text><text x="285.0" y="793.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es la tercera en</tspan><tspan x="285.0" dy="16">frecuencia</tspan></text><text x="435.0" y="793.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es la cuarta en</tspan><tspan x="435.0" dy="16">frecuencia</tspan></text><text x="585.0" y="793.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es la quinta en</tspan><tspan x="585.0" dy="16">frecuencia</tspan></text><text x="735.0" y="793.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: la más frecuente,</tspan><tspan x="735.0" dy="16">cerca de la mitad</tspan></text><text x="885.0" y="793.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es la segunda en</tspan><tspan x="885.0" dy="16">frecuencia</tspan></text><rect x="40.0" y="735.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="846.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="874.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="896.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Orden de frecuencia: rodilla (≈ la mitad), cadera, hombro, muñeca y tobillo. Agente más común: S. aureus, incluido el resistente a meticilina.</tspan><tspan x="58.0" dy="18">• Clínica: fiebre, dolor intenso, derrame, calor y limitación del movimiento activo y pasivo.</tspan><tspan x="58.0" dy="18">• Artrocentesis con recuento &gt; 50 000 células/mm³, tinción de Gram y cultivo; hemocultivos siempre. Tratamiento: antibiótico endovenoso más drenaje.</tspan><tspan x="58.0" dy="18">• Alerta: prótesis, diabetes y drogas inyectables elevan el riesgo; en jóvenes sexualmente activos pensar en gonococo (poliartralgia migratoria,</tspan><tspan x="58.0" dy="18">   tenosinovitis, lesiones cutáneas).</tspan></text><text x="58.0" y="990.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goldman-Cecil, Medicina Interna, 26.ª ed. (2020); Harrison, 21.ª ed. (2022).</tspan></text></svg>