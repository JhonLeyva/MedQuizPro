<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1258" viewBox="0 0 1000 1258" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Recién nacido de 2 horas, madre sin control y RPM de 20 horas, con intolerancia oral y distensión: sepsis neonatal temprana"><title>Recién nacido de 2 horas, madre sin control y RPM de 20 horas, con intolerancia oral y distensión: sepsis neonatal temprana</title><rect x="0.75" y="0.75" width="998.5" height="1257.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infecciones neonatales · sepsis</tspan></text><rect x="386.6" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="443.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="443.1" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sepsis neonatal temprana</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aparece en las primeras 72 horas; los gérmenes vienen del canal de parto (estreptococo B,</tspan><tspan x="58.0" dy="17">E. coli).</tspan><tspan x="58.0" dy="17">Los signos son sutiles: rechazo al alimento, distensión, temperatura inestable, dificultad</tspan><tspan x="58.0" dy="17">respiratoria.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido de 2 horas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Madre sin control prenatal; rotura de membranas de 20</tspan><tspan x="640.0" dy="16">horas.</tspan><tspan x="640.0" dy="16">Intolerancia oral y distensión abdominal.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="733.5" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#94a3b8"/><line x1="733.5" y1="407.0" x2="733.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,435.0 738.5,435.0 733.5,443.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#0f766e"/><rect x="171.2" y="416.0" width="190.5" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">RPM ≥ 18 h, sin control (este caso)</tspan></text><rect x="695.9" y="416.0" width="75.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sin factores</tspan></text><polygon points="240.0,342.0 266.0,307.0 734.0,307.0 760.0,342.0 734.0,377.0 266.0,377.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="342.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="347.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="338.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Recién nacido con signos sutiles: ¿factores de riesgo</tspan><tspan x="519.0" dy="17">infeccioso?</tspan></text><rect x="40.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">SEPSIS NEONATAL TEMPRANA</tspan></text><text x="266.5" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Hemocultivo</tspan><tspan x="266.5" dy="17">Ampicilina + gentamicina</tspan></text><rect x="507.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="479.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Buscar otra causa</tspan></text><text x="733.5" y="502.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Vigilar</tspan></text><text x="40.0" y="573.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="585.5" width="920.0" height="346.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="599.5" width="310.0" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="211.0" y="619.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">SEPSIS NEONATAL SEGÚN EL MOMENTO</tspan></text><text x="382.0" y="619.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">El momento orienta el germen y el antibiótico.</tspan></text><rect x="56.0" y="659.5" width="438.0" height="121.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="57.2" y="660.7" width="435.6" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="275.0" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="422"><tspan x="275.0" dy="0">&lt; 72 HORAS</tspan></text><text x="275.0" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="414"><tspan x="275.0" dy="0">Temprana</tspan></text><circle cx="72.0" cy="732.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="736.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="400"><tspan x="82.0" dy="0">Canal de parto: estreptococo B, E. coli</tspan></text><circle cx="72.0" cy="755.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="759.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="400"><tspan x="82.0" dy="0">Ampicilina + gentamicina</tspan></text><rect x="229.6" y="648.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="275.0" y="663.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="275.0" dy="0">◆ ESTE CASO</tspan></text><rect x="506.0" y="659.5" width="438.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="660.1" width="436.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="725.0" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="422"><tspan x="725.0" dy="0">&gt; 72 HORAS</tspan></text><text x="725.0" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="414"><tspan x="725.0" dy="0">Tardía</tspan></text><circle cx="522.0" cy="732.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="736.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">Hospital o comunidad: estafilococo, gramnegativos</tspan></text><circle cx="522.0" cy="755.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="759.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">Según la flora del servicio</tspan></text><text x="56.0" y="810.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="819.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="834.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="834.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">2 horas de vida</tspan></text><rect x="56.0" y="841.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="856.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="856.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">RPM de 20 horas y madre sin control</tspan></text><rect x="56.0" y="878.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="901.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Hemocultivo y ampicilina + gentamicina EV ya.</tspan></text><text x="40.0" y="971.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="981.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1012.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1012.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">APLV</tspan></text><text x="435.0" y="1004.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Obstrucción</tspan><tspan x="435.0" dy="17">intestinal</tspan></text><text x="585.0" y="1004.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Reflujo</tspan><tspan x="585.0" dy="17">gastroesofágico</tspan></text><rect x="663.0" y="984.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1004.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Sepsis neonatal</tspan><tspan x="735.0" dy="17">temprana</tspan></text><text x="885.0" y="1012.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Atresia esofágica</tspan></text><rect x="40.0" y="1035.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1035.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1064.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="1056.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: aparece con días</tspan><tspan x="285.0" dy="16">de leche de vaca</tspan></text><text x="435.0" y="1056.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: vómitos biliosos,</tspan><tspan x="435.0" dy="16">sin factores</tspan></text><text x="585.0" y="1064.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no da distensión</tspan></text><text x="735.0" y="1056.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: RPM 20 h + signos</tspan><tspan x="735.0" dy="16">sutiles</tspan></text><text x="885.0" y="1056.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: salivación, no pasa</tspan><tspan x="885.0" dy="16">la sonda</tspan></text><rect x="40.0" y="981.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1109.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1137.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1159.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Factores: RPM ≥ 18 horas, fiebre o corioamnionitis materna, estreptococo B, prematuridad.</tspan><tspan x="58.0" dy="18">• Hemocultivo y luego ampicilina + gentamicina EV de inmediato.</tspan><tspan x="58.0" dy="18">• Suspender a las 36-48 horas si el cultivo es negativo y el bebé está bien.</tspan></text><text x="58.0" y="1217.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, sepsis neonatal temprana (2018, act. 2024); NICE NG195 (2021, act. 2024); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>