<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="934" viewBox="0 0 1000 934" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Amenorrea primaria con mamas normales, vello escaso y cariotipo XY: insensibilidad a los andrógenos"><title>Amenorrea primaria con mamas normales, vello escaso y cariotipo XY: insensibilidad a los andrógenos</title><rect x="0.75" y="0.75" width="998.5" height="932.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · amenorrea primaria</tspan></text><rect x="398.3" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="478.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="478.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Insensibilidad completa a los andrógenos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mutación recesiva ligada al X del receptor de andrógenos.</tspan><tspan x="58.0" dy="17">Cariotipo 46,XY con testículos que secretan hormona antimülleriana.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 26 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Amenorrea primaria con desarrollo mamario normal.</tspan><tspan x="640.0" dy="16">Escaso vello púbico y axilar; cariotipo XY.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mamas normales + vello escaso + 46,XY = insensibilidad a los andrógenos</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Con cariotipo XX o 45,X se piensa en Mayer-Rokitansky, septum, aplasia cervical o Turner.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">AMENORREA PRIMARIA CON DESARROLLO MAMARIO NORMAL O AUSENTE</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Diagnóstico</tspan></text><text x="370.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="370.0" dy="0">Cariotipo</tspan></text><text x="570.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="570.0" dy="0">Mamas y vello</tspan></text><text x="770.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="770.0" dy="0">Útero</tspan></text><rect x="40.0" y="392.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Insensibilidad a los andrógenos</tspan></text><text x="370.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="370.0" dy="0">46,XY</tspan></text><text x="570.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="570.0" dy="0">Mamas normales; vello escaso o</tspan><tspan x="570.0" dy="15">ausente</tspan></text><text x="770.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="770.0" dy="0">Ausente; vagina ciega</tspan></text><rect x="260.6" y="403.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="306.0" y="418.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="306.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="436.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Mayer-Rokitansky</tspan></text><text x="370.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="370.0" dy="0">46,XX</tspan></text><text x="570.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="570.0" dy="0">Mamas y vello normales</tspan></text><text x="770.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="770.0" dy="0">Ausente o rudimentario</tspan></text><rect x="40.0" y="465.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="484.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Septum transverso o aplasia cervical</tspan></text><text x="370.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="370.0" dy="0">46,XX</tspan></text><text x="570.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="570.0" dy="0">Mamas y vello normales</tspan></text><text x="770.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="770.0" dy="0">Presente; dolor cíclico y</tspan><tspan x="770.0" dy="15">hematocolpos</tspan></text><rect x="40.0" y="509.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="528.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Síndrome de Turner</tspan></text><text x="370.0" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="370.0" dy="0">45,X</tspan></text><text x="570.0" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="570.0" dy="0">Mamas infantiles; sin pubertad</tspan></text><text x="770.0" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="184"><tspan x="770.0" dy="0">Presente, hipoplásico</tspan></text><text x="40.0" y="578.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="588.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="627.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="610.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Septum vaginal</tspan><tspan x="285.0" dy="17">transverso</tspan><tspan x="285.0" dy="17">completo</tspan></text><rect x="363.0" y="591.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="619.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Insensibilidad a los</tspan><tspan x="435.0" dy="17">andrógenos</tspan></text><text x="585.0" y="627.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Aplasia cervical</tspan></text><text x="735.0" y="627.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Síndrome de Turner</tspan></text><text x="885.0" y="619.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome de</tspan><tspan x="885.0" dy="17">Mayer-Rokitansky</tspan></text><rect x="40.0" y="659.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="659.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="696.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="688.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: tiene útero y vello</tspan><tspan x="285.0" dy="16">normal</tspan></text><text x="435.0" y="680.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: 46,XY con mamas</tspan><tspan x="435.0" dy="16">normales y vello</tspan><tspan x="435.0" dy="16">escaso</tspan></text><text x="585.0" y="688.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: tiene útero y</tspan><tspan x="585.0" dy="16">presenta dolor cíclico</tspan></text><text x="735.0" y="688.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es 45,X con</tspan><tspan x="735.0" dy="16">mamas infantiles</tspan></text><text x="885.0" y="688.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es 46,XX con vello</tspan><tspan x="885.0" dy="16">normal</tspan></text><rect x="40.0" y="588.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="749.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="777.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="799.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sin receptor funcional, la testosterona no actúa: no hay genitales masculinos y el vello depende de andrógenos, por eso es escaso o ausente.</tspan><tspan x="58.0" dy="18">• La testosterona se aromatiza a estrógenos y da mamas normales. La hormona antimülleriana impide útero y trompas: vagina corta y ciega.</tspan><tspan x="58.0" dy="18">• Diagnóstico: cariotipo 46,XY, ecografía sin útero y testosterona en rango masculino. Se cría como mujer; gonadectomía tras la pubertad y estrógenos.</tspan><tspan x="58.0" dy="18">• Alerta: gónadas intraabdominales con riesgo de tumor de células germinales; Mayer-Rokitansky es 46,XX con vello normal, y Turner, 45,X con mamas</tspan><tspan x="58.0" dy="18">   infantiles.</tspan></text><text x="58.0" y="893.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Hughes IA et al., Lancet 2012;380:1419-28; Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>