<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1167" viewBox="0 0 1000 1167" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Varón con prostatitis previa, disuria y puntos renoureterales positivos: levofloxacino"><title>Varón con prostatitis previa, disuria y puntos renoureterales positivos: levofloxacino</title><rect x="0.75" y="0.75" width="998.5" height="1165.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · infección urinaria complicada en el varón</tspan></text><rect x="515.8" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="607.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="607.1" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección urinaria en el varón</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se trata como complicada: puede comprometer riñón y próstata.</tspan><tspan x="58.0" dy="17">Se elige un antibiótico con buena penetración tisular y se ajusta al antibiograma.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 35 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Antecedente de prostatitis; disuria, polaquiuria y dolor</tspan><tspan x="640.0" dy="16">suprapúbico.</tspan><tspan x="640.0" dy="16">Puntos renoureterales medios positivos; 20 leucocitos</tspan><tspan x="640.0" dy="16">por campo; urocultivo en proceso.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL CUADRO CLÍNICO AL ANTIBIÓTICO</tspan></text><rect x="40.0" y="301.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="301.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="361.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Clínica</tspan></text><rect x="40.0" y="413.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="413.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="473.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Clasificación</tspan></text><rect x="40.0" y="525.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="525.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="585.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Antibiótico</tspan></text><rect x="40.0" y="637.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="637.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="697.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Seguimiento</tspan></text><line x1="348.0" y1="357.0" x2="355.0" y2="357.0" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="357.0" x2="355.0" y2="469.0" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="469.0" x2="353.0" y2="469.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,474.0 353.0,464.0 362.0,469.0" fill="#0f766e"/><line x1="552.0" y1="469.0" x2="559.0" y2="469.0" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="469.0" x2="559.0" y2="572.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="572.5" x2="557.0" y2="572.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,577.5 557.0,567.5 566.0,572.5" fill="#ea580c"/><line x1="756.0" y1="572.5" x2="763.0" y2="572.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="572.5" x2="763.0" y2="693.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="693.0" x2="761.0" y2="693.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,698.0 761.0,688.0 770.0,693.0" fill="#0f766e"/><rect x="158.0" y="314.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="330.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Disuria, polaquiuria y dolor</tspan><tspan x="168.0" dy="16">suprapúbico</tspan></text><text x="168.0" y="363.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Puntos renoureterales positivos y</tspan><tspan x="168.0" dy="14.5">piuria</tspan></text><circle cx="158.0" cy="314.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="318.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="426.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="442.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Infección urinaria</tspan><tspan x="372.0" dy="16">complicada</tspan></text><text x="372.0" y="475.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Varón con antecedente de</tspan><tspan x="372.0" dy="14.5">prostatitis</tspan></text><circle cx="362.0" cy="426.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="538.0" width="190.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="554.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Levofloxacino</tspan></text><text x="576.0" y="571.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Penetra en riñón y próstata;</tspan><tspan x="576.0" dy="14.5">ajustar al urocultivo</tspan></text><circle cx="566.0" cy="538.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="542.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="650.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">7 días; 10 a 14 si hay</tspan><tspan x="780.0" dy="16">prostatitis</tspan></text><text x="780.0" y="699.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Revisar el antibiograma y la</tspan><tspan x="780.0" dy="14.5">exposición previa a quinolonas</tspan></text><circle cx="770.0" cy="650.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="654.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="767.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="793.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Varón con síntomas altos: fluoroquinolona según antibiograma</tspan></text><text x="60.0" y="812.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Nitrofurantoína, amoxicilina y cefuroxima no sirven en riñón ni próstata.</tspan></text><text x="40.0" y="879.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="889.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="911.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Nitrofurantoína</tspan></text><text x="435.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Amoxicilina</tspan></text><rect x="513.0" y="892.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Levofloxacino</tspan></text><text x="735.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cotrimoxazol</tspan></text><text x="885.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cefuroxima</tspan></text><rect x="40.0" y="926.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="926.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="947.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento de</tspan><tspan x="54.0" dy="16">elección?</tspan></text><text x="285.0" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no alcanza niveles</tspan><tspan x="285.0" dy="16">tisulares</tspan></text><text x="435.0" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: mala penetración</tspan><tspan x="435.0" dy="16">prostática y resistencia</tspan></text><text x="585.0" y="947.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: buena penetración</tspan><tspan x="585.0" dy="16">renal y prostática</tspan></text><text x="735.0" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: alta resistencia de</tspan><tspan x="735.0" dy="16">E. coli</tspan></text><text x="885.0" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: mala penetración</tspan><tspan x="885.0" dy="16">prostática</tspan></text><rect x="40.0" y="889.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1000.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1028.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1050.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Las fluoroquinolonas (levofloxacino, ciprofloxacino) alcanzan buenas concentraciones en riñón y próstata y cubren enterobacterias.</tspan><tspan x="58.0" dy="18">• Nitrofurantoína no logra niveles tisulares; amoxicilina y cefuroxima penetran mal en la próstata y E. coli es resistente; cotrimoxazol tiene alta resistencia.</tspan><tspan x="58.0" dy="18">• IDSA 2025: la infección urinaria en el varón con síntomas altos es complicada; elegir según el antibiograma y el uso previo de quinolonas.</tspan><tspan x="58.0" dy="18">• Duración: 7 días si hay buena evolución; 10 a 14 si hay prostatitis. Tomar el urocultivo antes del antibiótico.</tspan></text><text x="58.0" y="1126.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IDSA, infecciones urinarias complicadas (Trautner BW, et al., Clin Infect Dis 2026;82:i24-i35); Campbell-Walsh-Wein Urología 12.ª ed. (2020).</tspan></text></svg>