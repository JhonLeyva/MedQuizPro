<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1071" viewBox="0 0 1000 1071" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Recién nacido con sospecha de hernia diafragmática: la radiografía de tórax confirma"><title>Recién nacido con sospecha de hernia diafragmática: la radiografía de tórax confirma</title><rect x="0.75" y="0.75" width="998.5" height="1070.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cirugía neonatal · hernia diafragmática congénita</tspan></text><rect x="491.2" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="547.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="547.7" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hernia diafragmática congénita</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Un defecto del diafragma deja pasar las vísceras al tórax: el pulmón no crece (hipoplasia).</tspan><tspan x="58.0" dy="17">Casi siempre es posterolateral izquierda (Bochdalek).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido con sospecha de hernia diafragmática.</tspan><tspan x="640.0" dy="16">¿Cómo se confirma?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="733.5" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#94a3b8"/><line x1="733.5" y1="391.0" x2="733.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,419.0 738.5,419.0 733.5,427.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="391.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#0f766e"/><rect x="204.5" y="400.0" width="124.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Confirmar (este caso)</tspan></text><rect x="689.9" y="400.0" width="87.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Mientras tanto</tspan></text><polygon points="240.0,326.0 266.0,291.0 734.0,291.0 760.0,326.0 734.0,361.0 266.0,361.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="326.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="331.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="322.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Recién nacido con dificultad respiratoria y abdomen</tspan><tspan x="519.0" dy="17">excavado</tspan></text><rect x="40.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">RADIOGRAFÍA DE TÓRAX</tspan></text><text x="266.5" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Asas en el tórax</tspan><tspan x="266.5" dy="17">Sonda que sube al tórax</tspan></text><rect x="507.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="463.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Intubar + sonda orogástrica</tspan></text><text x="733.5" y="486.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Nunca bolsa y mascarilla</tspan></text><text x="40.0" y="557.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PISTAS CLÍNICAS</tspan></text><rect x="40.0" y="569.5" width="920.0" height="191.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="611.5" x2="938.0" y2="611.5" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="611.5" x2="62.0" y2="619.5" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="611.5" x2="938.0" y2="619.5" stroke="#0f766e" stroke-width="2"/><rect x="353.1" y="599.5" width="293.7" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="615.5" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="280"><tspan x="500.0" dy="0">PISTAS CLÍNICAS DE LA HERNIA DE BOCHDALEK</tspan></text><rect x="56.0" y="631.5" width="213.0" height="82.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="654.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="658.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="659.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="94.0" dy="0">Abdomen excavado</tspan></text><text x="68.0" y="685.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="68.0" dy="0">Vísceras en el tórax</tspan></text><rect x="281.0" y="631.5" width="213.0" height="82.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="301.0" cy="654.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="301.0" y="658.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="301.0" dy="0">2</tspan></text><text x="319.0" y="659.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="319.0" dy="0">Ruidos intestinales en el</tspan><tspan x="319.0" dy="17">tórax</tspan></text><text x="293.0" y="697.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="293.0" dy="0">Lado izquierdo</tspan></text><rect x="506.0" y="631.5" width="213.0" height="82.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="526.0" cy="654.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="526.0" y="658.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="526.0" dy="0">3</tspan></text><text x="544.0" y="659.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="544.0" dy="0">Latido desplazado a la</tspan><tspan x="544.0" dy="17">derecha</tspan></text><text x="518.0" y="697.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="518.0" dy="0">Mediastino empujado</tspan></text><rect x="731.0" y="631.5" width="213.0" height="82.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="751.0" cy="654.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="751.0" y="658.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="751.0" dy="0">4</tspan></text><text x="769.0" y="659.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="769.0" dy="0">Dificultad respiratoria al</tspan><tspan x="769.0" dy="17">nacer</tspan></text><text x="743.0" y="697.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="743.0" dy="0">Hipoplasia pulmonar</tspan></text><text x="56.0" y="740.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Con estas pistas, Rx de tórax de inmediato.</tspan></text><text x="40.0" y="800.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="810.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="841.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="833.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Manometría</tspan><tspan x="285.0" dy="17">esofágica</tspan></text><text x="435.0" y="833.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ecografía</tspan><tspan x="435.0" dy="17">abdominal</tspan></text><text x="585.0" y="833.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Gammagrafía</tspan><tspan x="585.0" dy="17">abdominal</tspan></text><rect x="663.0" y="813.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Radiografía de tórax</tspan></text><text x="885.0" y="833.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Endoscopía</tspan><tspan x="885.0" dy="17">digestiva alta</tspan></text><rect x="40.0" y="864.5" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="864.5" width="144.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="885.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Confirma?</tspan></text><text x="285.0" y="885.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es para motilidad</tspan></text><text x="435.0" y="885.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no ve bien el tórax</tspan></text><text x="585.0" y="885.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no sirve aquí</tspan></text><text x="735.0" y="885.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: asas en el tórax</tspan></text><text x="885.0" y="885.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no ve el tórax</tspan></text><rect x="40.0" y="810.5" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="922.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="950.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="972.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Rx de tórax: asas con aire en el hemitórax izquierdo, mediastino desplazado; la sonda orogástrica sube al tórax.</tspan><tspan x="58.0" dy="18">• No ventilar con bolsa y mascarilla (llena de aire el intestino): intubar y colocar sonda orogástrica.</tspan><tspan x="58.0" dy="18">• La cirugía se hace después de estabilizar; hoy muchas se diagnostican en la ecografía prenatal.</tspan></text><text x="58.0" y="1030.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDH EURO Consortium, consenso (2015, act. 2024); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>