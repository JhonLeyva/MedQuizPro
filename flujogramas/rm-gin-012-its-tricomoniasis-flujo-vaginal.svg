<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Flujo verdoso con cérvix en fresa es tricomoniasis: metronidazol 500 mg cada 12 horas por 7 días"><title>Flujo verdoso con cérvix en fresa es tricomoniasis: metronidazol 500 mg cada 12 horas por 7 días</title><rect x="0.75" y="0.75" width="998.5" height="938.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ITS · tricomoniasis, flujo vaginal</tspan></text><rect x="390.7" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="470.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="470.5" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tricomoniasis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">ITS por el protozoo flagelado Trichomonas vaginalis.</tspan><tspan x="58.0" dy="17">Flujo espumoso amarillo-verdoso, irritación vulvovaginal, disuria y pH &gt; 4,5.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 23 años, G2 P1102</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Secreción vaginal verdosa abundante e irritación vulvar</tspan><tspan x="640.0" dy="16">por 7 días.</tspan><tspan x="640.0" dy="16">Cérvix en fresa.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUATRO CAUSAS DE FLUJO VAGINAL Y CÓMO DISTINGUIRLAS</tspan></text><rect x="40.0" y="285.0" width="453.0" height="79.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="54.0" y="312.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Tricomoniasis (este caso)</tspan></text><text x="54.0" y="329.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Flujo espumoso verdoso y cérvix en fresa; pH &gt; 4,5</tspan><tspan x="54.0" dy="16">Parásito móvil en fresco; metronidazol 500 mg cada 12 h por 7 días</tspan></text><rect x="391.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="436.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="436.6" dy="0">◆ ESTE CASO</tspan></text><rect x="507.0" y="285.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="312.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Vaginosis bacteriana</tspan></text><text x="521.0" y="329.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Flujo grisáceo con olor a pescado, sin inflamación</tspan><tspan x="521.0" dy="16">pH &gt; 4,5, células guía y aminas positivas (Amsel)</tspan></text><rect x="40.0" y="378.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="54.0" y="405.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Candidiasis</tspan></text><text x="54.0" y="422.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Flujo grumoso blanco y prurito intenso</tspan><tspan x="54.0" dy="16">pH normal; hifas con KOH; fluconazol 150 mg en dosis única</tspan></text><rect x="507.0" y="378.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="405.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Vaginitis atrófica</tspan></text><text x="521.0" y="422.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Menopáusicas: sequedad y dispareunia</tspan><tspan x="521.0" dy="16">Se trata con estrógeno vaginal</tspan></text><rect x="40.0" y="475.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="501.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cérvix en fresa + flujo verdoso = Trichomonas vaginalis</tspan></text><text x="60.0" y="520.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Metronidazol a la paciente y a la pareja; repetir la prueba a los 3 meses.</tspan></text><text x="40.0" y="587.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="597.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="636.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="600.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="628.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tricomoniasis /</tspan><tspan x="285.0" dy="17">metronidazol</tspan></text><text x="435.0" y="619.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Vaginosis</tspan><tspan x="435.0" dy="17">bacteriana /</tspan><tspan x="435.0" dy="17">metronidazol</tspan></text><text x="585.0" y="628.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Candidiasis /</tspan><tspan x="585.0" dy="17">fluconazol</tspan></text><text x="735.0" y="628.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Vulvovaginitis /</tspan><tspan x="735.0" dy="17">clindamicina</tspan></text><text x="885.0" y="628.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Vaginitis atrófica /</tspan><tspan x="885.0" dy="17">estrógenos</tspan></text><rect x="40.0" y="668.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="668.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="697.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico y</tspan><tspan x="54.0" dy="16">tratamiento?</tspan></text><text x="285.0" y="689.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: flujo verdoso con</tspan><tspan x="285.0" dy="16">cérvix en fresa;</tspan><tspan x="285.0" dy="16">metronidazol</tspan></text><text x="435.0" y="689.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: flujo grisáceo, sin</tspan><tspan x="435.0" dy="16">inflamación ni cérvix en</tspan><tspan x="435.0" dy="16">fresa</tspan></text><text x="585.0" y="697.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: flujo grumoso con</tspan><tspan x="585.0" dy="16">pH normal</tspan></text><text x="735.0" y="689.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: término genérico,</tspan><tspan x="735.0" dy="16">sin tratamiento</tspan><tspan x="735.0" dy="16">específico</tspan></text><text x="885.0" y="689.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es de</tspan><tspan x="885.0" dy="16">menopáusicas, sin flujo</tspan><tspan x="885.0" dy="16">verdoso</tspan></text><rect x="40.0" y="597.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="758.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="786.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="808.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tríada: flujo espumoso amarillo-verdoso, irritación vulvovaginal y cérvix en fresa (colpitis macular, solo en 2-5 %); pH &gt; 4,5 y abundantes leucocitos.</tspan><tspan x="58.0" dy="18">• Diagnóstico: prueba de amplificación de ácidos nucleicos (la más sensible) o parásito móvil en fresco, que tiene sensibilidad baja.</tspan><tspan x="58.0" dy="18">• Tratamiento de la mujer (CDC 2021): metronidazol 500 mg dos veces al día por 7 días; se trata también a la pareja.</tspan><tspan x="58.0" dy="18">• Alerta: repetir la prueba a los 3 meses por la alta reinfección; buscar otras ITS (VIH, sífilis, gonorrea, clamidia) según NTS 240-2026.</tspan></text><text x="58.0" y="884.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Sexually Transmitted Infections Treatment Guidelines (MMWR Recomm Rep 2021;70(4)); NTS 240-MINSA/DGIESP-2026 (RM 035-2026/MINSA); Williams</tspan><tspan x="58.0" dy="15">Obstetricia, 26.ª ed. (2022).</tspan></text></svg>