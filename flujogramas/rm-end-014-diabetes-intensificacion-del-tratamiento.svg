<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="947" viewBox="0 0 1000 947" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Con HbA1c de 8,5 % tras metformina más sitagliptina se asocia insulina basal"><title>Con HbA1c de 8,5 % tras metformina más sitagliptina se asocia insulina basal</title><rect x="0.75" y="0.75" width="998.5" height="945.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Diabetes · intensificación del tratamiento</tspan></text><rect x="442.0" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="512.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="512.2" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diabetes tipo 2 de 10 años</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La reserva de células beta disminuye con los años y la terapia dual deja de bastar.</tspan><tspan x="58.0" dy="17">Meta general: HbA1c &lt; 7 %.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 55 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Metformina y sitagliptina, poco ejercicio y dieta</tspan><tspan x="640.0" dy="16">adecuada.</tspan><tspan x="640.0" dy="16">Glicemias basales de 170-200 (antes 110-140); HbA1c</tspan><tspan x="640.0" dy="16">8,5 %. ¿Tratamiento indicado?</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE INTENSIFICA Y SE CONTROLA</tspan></text><text x="44.0" y="315.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Intensificar sin demora y titular la insulina basal.</tspan></text><line x1="178.0" y1="354.0" x2="362.0" y2="354.0" stroke="#99f6e4" stroke-width="6"/><line x1="408.0" y1="354.0" x2="592.0" y2="354.0" stroke="#99f6e4" stroke-width="6"/><line x1="638.0" y1="354.0" x2="822.0" y2="354.0" stroke="#99f6e4" stroke-width="6"/><circle cx="155.0" cy="354.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="155.0" y="358.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="155.0" dy="0">hoy</tspan></text><rect x="45.0" y="388.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="155.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Evaluar</tspan></text><text x="155.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">HbA1c 8,5 %: función renal, riesgo</tspan><tspan x="155.0" dy="16">cardiovascular y adherencia</tspan></text><circle cx="385.0" cy="354.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="385.0" y="358.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="385.0" dy="0">hoy</tspan></text><rect x="275.0" y="388.0" width="220.0" height="75.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="385.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Asociar insulina basal</tspan></text><text x="385.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">NPH o glargina, 10 U al acostarse</tspan></text><rect x="291.3" y="452.0" width="187.3" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="385.0" y="467.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="385.0" dy="0">◆ ESTE CASO: INSULINA BASAL</tspan></text><circle cx="615.0" cy="354.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="615.0" y="358.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="615.0" dy="0">3 días</tspan></text><rect x="505.0" y="388.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Titular</tspan></text><text x="615.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Subir según glucemia en ayunas; meta</tspan><tspan x="615.0" dy="16">80-130 mg/dL</tspan></text><circle cx="845.0" cy="354.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="845.0" y="358.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="845.0" dy="0">3 meses</tspan></text><rect x="735.0" y="388.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="845.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Controlar HbA1c</tspan></text><text x="845.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Meta &lt; 7 %; si no se logra, intensificar</tspan></text><rect x="40.0" y="495.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="521.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Insulina basal asociada a metformina y sitagliptina</tspan></text><text x="60.0" y="540.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hoy también se prefiere un agonista GLP-1, pero no figura entre las opciones.</tspan></text><text x="40.0" y="607.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="617.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="656.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="648.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aumentar ingesta</tspan><tspan x="285.0" dy="17">de proteínas</tspan></text><text x="435.0" y="639.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sustituir</tspan><tspan x="435.0" dy="17">metformina por</tspan><tspan x="435.0" dy="17">glimepirida</tspan></text><text x="585.0" y="656.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Asociar acarbosa</tspan></text><rect x="663.0" y="620.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="648.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Asociar insulina</tspan><tspan x="735.0" dy="17">basal</tspan></text><text x="885.0" y="648.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Sustituir sitagliptina</tspan><tspan x="885.0" dy="17">por pioglitazona</tspan></text><rect x="40.0" y="688.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="688.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="717.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no trata la diabetes</tspan></text><text x="435.0" y="709.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: retira un fármaco</tspan><tspan x="435.0" dy="16">útil y da hipoglucemia</tspan></text><text x="585.0" y="709.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: efecto pequeño en</tspan><tspan x="585.0" dy="16">la HbA1c</tspan></text><text x="735.0" y="709.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: intensifica con</tspan><tspan x="735.0" dy="16">insulina basal</tspan></text><text x="885.0" y="709.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cambia, no</tspan><tspan x="885.0" dy="16">intensifica</tspan></text><rect x="40.0" y="617.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="762.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="790.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="812.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Con HbA1c 8,5 % (meta &lt; 7 %) hay que intensificar sin demora. La ADA propone añadir un agonista GLP-1 (o dual GIP/GLP-1) o insulina basal.</tspan><tspan x="58.0" dy="18">• La insulina es preferible con síntomas catabólicos o HbA1c &gt; 10 %; entre las opciones listadas, la insulina basal es la adecuada.</tspan><tspan x="58.0" dy="18">• Insulina basal: NPH o glargina, 10 U o 0,1-0,2 U/kg al acostarse, titulada según la glucemia en ayunas (meta 80-130 mg/dL).</tspan><tspan x="58.0" dy="18">• Retirar metformina empeora el control; las sulfonilureas dan hipoglucemia; la acarbosa baja la HbA1c ~0,5 %. Evaluar función renal y riesgo</tspan><tspan x="58.0" dy="18">   cardiovascular.</tspan></text><text x="58.0" y="906.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA, Standards of Care in Diabetes-2026, sección 9; Davies et al., consenso ADA/EASD, Diabetes Care (2022)</tspan></text></svg>