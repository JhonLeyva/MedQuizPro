<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1332" viewBox="0 0 1000 1332" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante de 12 semanas con DIU y guía visible: retirar el dispositivo, no interrumpir el embarazo"><title>Gestante de 12 semanas con DIU y guía visible: retirar el dispositivo, no interrumpir el embarazo</title><rect x="0.75" y="0.75" width="998.5" height="1330.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · embarazo con DIU</tspan></text><rect x="390.7" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="470.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="470.5" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Embarazo con DIU</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La eficacia del DIU supera 99 %, pero si falla sube la proporción de ectópicos.</tspan><tspan x="58.0" dy="17">Si la gestación es intrauterina y se ven los hilos, se retira.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 12 semanas por FUR</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Usuaria de DIU hace 6 meses.</tspan><tspan x="640.0" dy="16">El espéculo muestra la guía del DIU en el cérvix.</tspan><tspan x="640.0" dy="16">¿Conducta?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE SEGÚN SE VEAN O NO LOS HILOS</tspan></text><rect x="40.0" y="285.0" width="920.0" height="144.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="144.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="361.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Antes de actuar</tspan></text><rect x="40.0" y="429.0" width="920.0" height="144.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="429.0" width="108.0" height="144.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="501.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Hilos visibles</tspan><tspan x="94.0" dy="14">(este caso)</tspan></text><rect x="40.0" y="573.0" width="920.0" height="144.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="573.0" width="108.0" height="144.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="645.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Hilos no</tspan><tspan x="94.0" dy="14">visibles</tspan></text><line x1="307.2" y1="340.5" x2="314.2" y2="340.5" stroke="#ea580c" stroke-width="2.2"/><line x1="314.2" y1="340.5" x2="314.2" y2="501.0" stroke="#ea580c" stroke-width="2.2"/><line x1="314.2" y1="501.0" x2="312.2" y2="501.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="312.2,506.0 312.2,496.0 321.2,501.0" fill="#ea580c"/><line x1="470.4" y1="501.0" x2="477.4" y2="501.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="501.0" x2="477.4" y2="501.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="501.0" x2="475.4" y2="501.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,506.0 475.4,496.0 484.4,501.0" fill="#0f766e"/><line x1="633.6" y1="501.0" x2="640.6" y2="501.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="501.0" x2="640.6" y2="629.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="629.0" x2="638.6" y2="629.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,634.0 638.6,624.0 647.6,629.0" fill="#0f766e"/><line x1="796.8" y1="629.0" x2="803.8" y2="629.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="629.0" x2="803.8" y2="628.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="628.5" x2="801.8" y2="628.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,633.5 801.8,623.5 810.8,628.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Descartar ectópico</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Ecografía para ubicar la</tspan><tspan x="168.0" dy="14.5">gestación; el DIU eleva la</tspan><tspan x="168.0" dy="14.5">proporción de ectópicos</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="442.0" width="149.2" height="118.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="331.2" y="458.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Retirar el DIU</tspan><tspan x="331.2" dy="16">suavemente</tspan></text><text x="331.2" y="491.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Lo antes posible,</tspan><tspan x="331.2" dy="14.5">idealmente antes de las</tspan><tspan x="331.2" dy="14.5">12-13 semanas y con</tspan><tspan x="331.2" dy="14.5">información a la paciente</tspan></text><circle cx="321.2" cy="442.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="446.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="442.0" width="149.2" height="118.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="458.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">No interrumpir el</tspan><tspan x="494.4" dy="16">embarazo</tspan></text><text x="494.4" y="491.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">AMEU, misoprostol y</tspan><tspan x="494.4" dy="14.5">legrado solo si hay aborto</tspan><tspan x="494.4" dy="14.5">instalado, incompleto o</tspan><tspan x="494.4" dy="14.5">séptico</tspan></text><circle cx="484.4" cy="442.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="446.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="586.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="602.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Ecografía para</tspan><tspan x="657.6" dy="16">localizarlo</tspan></text><text x="657.6" y="635.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Retiro guiado por</tspan><tspan x="657.6" dy="14.5">ecografía si es posible</tspan></text><circle cx="647.6" cy="586.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="590.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="586.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="602.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Si no se puede retirar</tspan></text><text x="820.8" y="619.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Vigilancia estrecha y</tspan><tspan x="820.8" dy="14.5">consulta ante fiebre,</tspan><tspan x="820.8" dy="14.5">sangrado o dolor</tspan></text><circle cx="810.8" cy="586.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="590.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="735.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="761.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Gestación intrauterina con hilos visibles = retirar el DIU</tspan></text><text x="60.0" y="780.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">No se indica interrumpir el embarazo; AMEU, misoprostol y legrado son para el aborto ya instalado.</tspan></text><text x="40.0" y="841.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVOLUCIÓN DEL EMBARAZO CON DIU SEGÚN LA CONDUCTA</tspan></text><rect x="40.0" y="853.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Conducta</tspan></text><text x="250.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Riesgo de aborto</tspan></text><text x="610.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Otros riesgos</tspan></text><rect x="40.0" y="882.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="901.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Retirar el DIU</tspan></text><text x="250.0" y="901.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Cerca de 25 %</tspan></text><text x="610.0" y="901.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Menor riesgo de infección y de parto pretérmino</tspan></text><rect x="140.6" y="885.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="900.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="911.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="930.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Dejarlo en su sitio</tspan></text><text x="250.0" y="930.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Cerca de 50 %</tspan></text><text x="610.0" y="930.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Corioamnionitis, parto pretérmino, rotura de membranas y</tspan><tspan x="610.0" dy="15">desprendimiento de placenta</tspan></text><text x="40.0" y="995.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1005.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1027.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1008.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Retiro del DIU</tspan></text><text x="435.0" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antibioticoterapia</tspan></text><text x="585.0" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">AMEU</tspan></text><text x="735.0" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Uso de misoprostol</tspan></text><text x="885.0" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Legrado uterino</tspan></text><rect x="40.0" y="1042.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1042.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1079.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="1071.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: reduce el riesgo de</tspan><tspan x="285.0" dy="16">aborto de 50 % a 25 %</tspan></text><text x="435.0" y="1071.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: solo se da si hay</tspan><tspan x="435.0" dy="16">infección</tspan></text><text x="585.0" y="1063.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: indicado en el</tspan><tspan x="585.0" dy="16">aborto instalado o</tspan><tspan x="585.0" dy="16">incompleto</tspan></text><text x="735.0" y="1071.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: indicado en el</tspan><tspan x="735.0" dy="16">aborto ya instalado</tspan></text><text x="885.0" y="1063.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: indicado en el</tspan><tspan x="885.0" dy="16">aborto incompleto o</tspan><tspan x="885.0" dy="16">séptico</tspan></text><rect x="40.0" y="1005.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1132.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1160.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1182.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primero se descarta un embarazo ectópico. Con gestación intrauterina y hilos visibles: retiro suave y temprano, idealmente antes de las 12-13 semanas.</tspan><tspan x="58.0" dy="18">• Dejarlo se asocia con aborto en cerca de 50 %, corioamnionitis, parto pretérmino, rotura de membranas y desprendimiento; al retirarlo el aborto baja a</tspan><tspan x="58.0" dy="18">   cerca de 25 %.</tspan><tspan x="58.0" dy="18">• AMEU, misoprostol y legrado se reservan para el aborto instalado, incompleto o séptico; antibióticos solo si hay infección.</tspan><tspan x="58.0" dy="18">• Si los hilos no se ven: ecografía y retiro guiado; si no se puede retirar, vigilancia estrecha y consulta por fiebre, sangrado o dolor.</tspan></text><text x="58.0" y="1276.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, U.S. Selected Practice Recommendations for Contraceptive Use (MMWR Recomm Rep 2024;73[RR-3]); ACOG, Practice Bulletin N.º 200: Early Pregnancy Loss</tspan><tspan x="58.0" dy="15">(2018); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>