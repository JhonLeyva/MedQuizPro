<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1249" viewBox="0 0 1000 1249" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El neumocito tipo II, célula alveolar cuboidea, sintetiza y secreta el surfactante pulmonar"><title>El neumocito tipo II, célula alveolar cuboidea, sintetiza y secreta el surfactante pulmonar</title><rect x="0.75" y="0.75" width="998.5" height="1247.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología neonatal · surfactante</tspan></text><rect x="403.7" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="452.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="452.7" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Surfactante pulmonar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lípidos (90 %, sobre todo dipalmitoilfosfatidilcolina) y proteínas SP-A, SP-B, SP-C y SP-D.</tspan><tspan x="58.0" dy="17">Reduce la tensión superficial y evita el colapso alveolar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué tipo celular sintetiza la sustancia surfactante?</tspan></text><line x1="640.0" y1="189.0" x2="670.0" y2="189.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACE CADA CÉLULA DEL PULMÓN</tspan></text><line x1="421.1" y1="347.5" x2="340.0" y2="295.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="295.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="396.5" x2="340.0" y2="395.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="395.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="370.5" x2="660.0" y2="348.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="348.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="428.4" x2="660.0" y2="452.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="452.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="448.4" x2="340.0" y2="498.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="498.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="398.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="398.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="403.6" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">SURFACTANTE</tspan></text><text x="500.0" y="422.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">¿quién lo sintetiza?</tspan></text><rect x="40.0" y="253.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="254.0" width="6.0" height="82.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="286.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">MACRÓFAGO</tspan></text><text x="190.0" y="310.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Fagocita partículas y microorganismos</tspan></text><rect x="40.0" y="353.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="354.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="386.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CALICIFORME</tspan></text><text x="190.0" y="410.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Secreta moco en la vía aérea</tspan></text><rect x="40.0" y="453.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="481.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">NEUMOCITO II (ALVEOLAR)</tspan></text><text x="190.0" y="505.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Sintetiza y secreta surfactante</tspan><tspan x="190.0" dy="17">Cuerpos lamelares</tspan></text><rect x="144.6" y="534.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="549.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="660.0" y="303.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="304.0" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="331.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">BRONQUIOLAR</tspan></text><text x="810.0" y="355.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Reviste el bronquiolo; no produce el surfactante</tspan><tspan x="810.0" dy="17">alveolar</tspan></text><rect x="660.0" y="410.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="411.2" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="443.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CILIADA</tspan></text><text x="810.0" y="467.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Moviliza el moco hacia la faringe</tspan></text><text x="40.0" y="580.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="592.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="625.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Neumocito tipo II</tspan></text><line x1="248.5" y1="621.2" x2="267.5" y2="621.2" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,616.2 266.5,626.2 274.5,621.2" fill="#0f766e"/><rect x="278.5" y="592.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="625.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Cuerpos lamelares</tspan></text><line x1="487.0" y1="621.2" x2="506.0" y2="621.2" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,616.2 505.0,626.2 513.0,621.2" fill="#0f766e"/><rect x="517.0" y="592.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="616.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Surfactante en la interfase</tspan><tspan x="619.2" dy="17">aire-líquido</tspan></text><line x1="725.5" y1="621.2" x2="744.5" y2="621.2" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,616.2 743.5,626.2 751.5,621.2" fill="#0f766e"/><rect x="755.5" y="592.2" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="616.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Menor tensión superficial y</tspan><tspan x="857.8" dy="17">alvéolo abierto</tspan></text><text x="40.0" y="684.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SURFACTANTE: COMPOSICIÓN Y MADUREZ</tspan></text><rect x="40.0" y="696.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="715.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Aspecto</tspan></text><text x="280.0" y="715.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Dato</tspan></text><rect x="40.0" y="725.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="744.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Composición</tspan></text><text x="280.0" y="744.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Lípidos cerca de 90 % (dipalmitoilfosfatidilcolina) y proteínas SP-A, B, C y D</tspan></text><rect x="40.0" y="754.2" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="773.2" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Célula productora</tspan></text><text x="280.0" y="773.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Neumocito tipo II, en cuerpos lamelares</tspan></text><rect x="170.6" y="757.7" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="772.7" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="783.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="802.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Inicio y madurez</tspan></text><text x="280.0" y="802.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Desde las 24-28 semanas; madura hacia las 34-36</tspan></text><rect x="40.0" y="812.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="831.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Prueba de madurez</tspan></text><text x="280.0" y="831.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Lecitina-esfingomielina mayor de 2 en el líquido amniótico</tspan></text><rect x="40.0" y="841.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="860.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Maduración inducida</tspan></text><text x="280.0" y="860.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Betametasona prenatal</tspan></text><text x="40.0" y="910.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="920.2" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="942.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="942.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Macrófago</tspan></text><text x="435.0" y="942.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Caliciforme</tspan></text><rect x="513.0" y="923.2" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="942.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Alveolar</tspan></text><text x="735.0" y="942.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Bronquiolar</tspan></text><text x="885.0" y="942.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ciliada</tspan></text><rect x="40.0" y="957.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="957.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="978.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Quién sintetiza el</tspan><tspan x="54.0" dy="16">surfactante?</tspan></text><text x="285.0" y="978.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: fagocita partículas</tspan><tspan x="285.0" dy="16">y microorganismos</tspan></text><text x="435.0" y="986.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: secreta moco</tspan></text><text x="585.0" y="978.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: neumocito tipo II</tspan><tspan x="585.0" dy="16">del alvéolo</tspan></text><text x="735.0" y="978.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: reviste los</tspan><tspan x="735.0" dy="16">bronquiolos</tspan></text><text x="885.0" y="978.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: moviliza las</tspan><tspan x="885.0" dy="16">secreciones</tspan></text><rect x="40.0" y="920.2" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1031.2" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1059.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1081.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El neumocito tipo II lo sintetiza, lo almacena en cuerpos lamelares y lo secreta; cubre cerca del 5 % de la superficie alveolar y es progenitor del</tspan><tspan x="58.0" dy="18">   neumocito tipo I.</tspan><tspan x="58.0" dy="18">• La producción empieza hacia las 24-28 semanas y madura hacia las 34-36: su déficit en el prematuro causa el síndrome de dificultad respiratoria.</tspan><tspan x="58.0" dy="18">• Madurez pulmonar: cociente lecitina-esfingomielina mayor de 2 en el líquido amniótico; los corticoides prenatales (betametasona) aceleran la</tspan><tspan x="58.0" dy="18">   maduración.</tspan><tspan x="58.0" dy="18">• El macrófago alveolar fagocita, la célula caliciforme secreta moco y la ciliada moviliza las secreciones; ninguna produce surfactante.</tspan></text><text x="58.0" y="1193.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Hall JE, Guyton y Hall, Tratado de Fisiología Médica 14.ª ed. (2021); Sweet DG et al. European Consensus Guidelines on RDS, 2022 update. Neonatology</tspan><tspan x="58.0" dy="15">2023;120:3-23; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>