<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="986" viewBox="0 0 1000 986" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Al amamantar, la succión del pezón aumenta la secreción de oxitocina (reflejo de eyección de la leche)"><title>Al amamantar, la succión del pezón aumenta la secreción de oxitocina (reflejo de eyección de la leche)</title><rect x="0.75" y="0.75" width="998.5" height="984.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología · lactancia</tspan></text><rect x="323.0" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="402.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="402.4" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reflejos de la lactancia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La succión estimula el hipotálamo: la neurohipófisis libera oxitocina (contrae las células</tspan><tspan x="58.0" dy="17">mioepiteliales: sale la leche).</tspan><tspan x="58.0" dy="17">La adenohipófisis libera prolactina (fabrica la leche). La prolactina alta frena la GnRH: bajan</tspan><tspan x="58.0" dy="17">FSH y LH (amenorrea de lactancia).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 30 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Está amamantando a su bebé.</tspan><tspan x="640.0" dy="16">¿Qué cambio hormonal se espera?</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS HORMONAS DURANTE LA LACTANCIA</tspan></text><rect x="40.0" y="282.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="303.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="303.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="303.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="303.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="320.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="344.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Oxitocina</tspan></text><text x="250.0" y="345.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Aumenta  ↑</tspan></text><text x="400.0" y="344.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Pulsos con la succión</tspan></text><text x="550.0" y="344.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Eyección de la leche y contracción del útero (la más directa).</tspan></text><rect x="40.0" y="364.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="388.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Prolactina</tspan></text><text x="250.0" y="389.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Aumenta  ↑</tspan></text><text x="400.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Basal alta en lactancia</tspan></text><text x="550.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Fabrica la leche.</tspan></text><rect x="40.0" y="408.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="432.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">FSH y LH</tspan></text><text x="250.0" y="433.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Bajan  ↓</tspan></text><text x="400.0" y="432.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">—</tspan></text><text x="550.0" y="432.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">La prolactina frena la GnRH: amenorrea.</tspan></text><rect x="40.0" y="452.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="476.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Estrógenos</tspan></text><text x="250.0" y="477.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Bajos  ↓</tspan></text><text x="400.0" y="476.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">—</tspan></text><text x="550.0" y="476.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Por la falta de ovulación.</tspan></text><rect x="40.0" y="496.0" width="920.0" height="40.0" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="520.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Vasopresina (ADH)</tspan></text><text x="250.0" y="521.0" font-size="13" font-weight="800" font-style="normal" fill="#15803d" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Sin cambio</tspan></text><text x="400.0" y="520.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">—</tspan></text><text x="550.0" y="520.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">No participa.</tspan></text><rect x="40.0" y="554.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="580.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Succión → oxitocina (sale la leche)</tspan></text><text x="60.0" y="599.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La prolactina sube y la FSH baja como efecto secundario.</tspan></text><text x="40.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="676.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="715.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="679.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aumento de la</tspan><tspan x="285.0" dy="17">secreción de</tspan><tspan x="285.0" dy="17">oxitocina</tspan></text><text x="435.0" y="715.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Disminuye la FSH</tspan></text><text x="585.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Disminución de la</tspan><tspan x="585.0" dy="17">secreción de</tspan><tspan x="585.0" dy="17">prolactina</tspan></text><text x="735.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Aumento de la</tspan><tspan x="735.0" dy="17">secreción de</tspan><tspan x="735.0" dy="17">vasopresina</tspan></text><text x="885.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Aumento de la</tspan><tspan x="885.0" dy="17">secreción de</tspan><tspan x="885.0" dy="17">estrógenos</tspan></text><rect x="40.0" y="747.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="747.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="784.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Hormona esperada?</tspan></text><text x="285.0" y="784.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: reflejo de eyección</tspan></text><text x="435.0" y="768.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">También ocurre, pero</tspan><tspan x="435.0" dy="16">no es el efecto directo</tspan><tspan x="435.0" dy="16">de la succión</tspan></text><text x="585.0" y="784.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: AUMENTA</tspan></text><text x="735.0" y="784.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es la esperada</tspan></text><text x="885.0" y="784.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: bajan</tspan></text><rect x="40.0" y="676.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="837.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="865.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="887.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La oxitocina también contrae el útero (cólicos al amamantar en el posparto): ayuda a la involución.</tspan><tspan x="58.0" dy="18">• El estrés y el dolor inhiben el reflejo de oxitocina.</tspan><tspan x="58.0" dy="18">• Método de lactancia y amenorrea (MELA): anticonceptivo en los primeros 6 meses si cumple condiciones.</tspan></text><text x="58.0" y="945.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall, Tratado de Fisiología Médica 14.ª ed.; OMS, lactancia materna.</tspan></text></svg>