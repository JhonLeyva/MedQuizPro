<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1085" viewBox="0 0 1000 1085" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Quemadura del 30 %: cálculo de Parkland paso a paso"><title>Quemadura del 30 %: cálculo de Parkland paso a paso</title><rect x="0.75" y="0.75" width="998.5" height="1083.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Quemaduras · reposición de líquidos con la fórmula de Parkland</tspan></text><rect x="579.4" y="32.0" width="170.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="664.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="155"><tspan x="664.8" dy="0">CIRUGÍA ENAM: QUEMADOS</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reanimación con líquidos en el gran quemado</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La superficie quemada (SCQ) se estima con la regla de los 9 y solo cuenta la quemadura</tspan><tspan x="58.0" dy="17">de 2.º y 3.º grado.</tspan><tspan x="58.0" dy="17">Parkland = 4 mL × peso (kg) × % SCQ en 24 h, con lactato de Ringer.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 36 años, 70 kg, explosión de gas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Flictenas en tórax, abdomen, brazos y cara anterior de</tspan><tspan x="640.0" dy="16">muslos; SCQ estimada 30 %.</tspan><tspan x="640.0" dy="16">Piden el volumen total de 24 h.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL CUERPO QUEMADO AL VOLUMEN DE CRISTALOIDE</tspan></text><rect x="40.0" y="285.0" width="250.0" height="470.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="160.5" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">REGLA DE LOS 9 (ADULTO)</tspan></text><g transform="translate(56.0,325.0) scale(0.72)"><ellipse cx="150" cy="42" rx="30" ry="36" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><rect x="140" y="74" width="20" height="14" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><path d="M100 88 H200 L206 170 H94 Z" fill="#ea580c" stroke="#e9b48f" stroke-width="2"/><path d="M94 170 H206 L200 250 H100 Z" fill="#ea580c" stroke="#e9b48f" stroke-width="2"/><path d="M100 92 L70 100 L40 230 L60 236 L88 130 Z" fill="#ea580c" stroke="#e9b48f" stroke-width="2"/><path d="M200 92 L230 100 L260 230 L240 236 L212 130 Z" fill="#ea580c" stroke="#e9b48f" stroke-width="2"/><circle cx="46" cy="246" r="13" fill="#ea580c" stroke="#e9b48f" stroke-width="2"/><circle cx="254" cy="246" r="13" fill="#ea580c" stroke="#e9b48f" stroke-width="2"/><path d="M140 250 H160 L156 270 H144 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><path d="M100 250 H146 L142 360 H104 Z" fill="#ea580c" stroke="#e9b48f" stroke-width="2"/><path d="M154 250 H200 L196 360 H158 Z" fill="#ea580c" stroke="#e9b48f" stroke-width="2"/><path d="M104 360 H142 L138 470 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><path d="M158 360 H196 L190 470 H162 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><ellipse cx="122" cy="478" rx="20" ry="9" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><ellipse cx="178" cy="478" rx="20" ry="9" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><text x="150" y="47" font-size="13" font-weight="800" fill="#7c2d12" text-anchor="middle" data-max="0">9 %</text><text x="150" y="134" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">Tórax 9 %</text><text x="150" y="214" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">Abdomen 9 %</text><text x="18" y="150" font-size="13" font-weight="800" fill="#7c2d12" text-anchor="middle" data-max="0">9 %</text><text x="282" y="150" font-size="13" font-weight="800" fill="#7c2d12" text-anchor="middle" data-max="0">9 %</text><path d="M156 262 L214 296" stroke="#7c2d12" stroke-width="1.5"/><text x="246" y="308" font-size="11.5" font-weight="800" fill="#7c2d12" text-anchor="middle" data-max="0">Periné 1 %</text><text x="123" y="420" font-size="13" font-weight="800" fill="#7c2d12" text-anchor="middle" data-max="0">18 %</text><text x="177" y="420" font-size="13" font-weight="800" fill="#7c2d12" text-anchor="middle" data-max="0">18 %</text><path d="M28 156 L52 170 M272 156 L248 170" stroke="#7c2d12" stroke-width="1.5"/></g><rect x="48.0" y="692.0" width="234.0" height="57.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="165.0" y="713.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="220"><tspan x="165.0" dy="0">Naranja: zonas del caso. Cada miembro</tspan><tspan x="165.0" dy="15">inferior vale 18 % y la espalda 18 %. El</tspan><tspan x="165.0" dy="15">enunciado da SCQ = 30 %.</tspan></text><circle cx="326.0" cy="307.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="312.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">1</tspan></text><rect x="350.0" y="285.0" width="610.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="286.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="309.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Datos del caso</tspan></text><text x="368.0" y="330.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Peso: 70 kg · SCQ de 2.º y 3.º grado: 30 %.</tspan><tspan x="368.0" dy="16">El eritema simple (1.er grado) no se suma.</tspan></text><circle cx="326.0" cy="404.0" r="14" fill="#0f766e" stroke="none" stroke-width="0"/><text x="326.0" y="409.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">2</tspan></text><rect x="350.0" y="382.0" width="610.0" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="351.0" y="383.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="368.0" y="406.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Fórmula de Parkland</tspan></text><text x="368.0" y="427.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">4 mL × 70 kg × 30 % = 8 400 mL en 24 horas.</tspan><tspan x="368.0" dy="16">Es el volumen TOTAL que pide la pregunta.</tspan></text><rect x="860.2" y="371.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="386.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><circle cx="326.0" cy="501.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="506.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">3</tspan></text><rect x="350.0" y="479.0" width="610.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="480.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="503.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Cómo se reparte</tspan></text><text x="368.0" y="524.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">La mitad (4 200 mL) en las primeras 8 h desde la quemadura;</tspan><tspan x="368.0" dy="16">la otra mitad (4 200 mL) en las 16 h siguientes.</tspan></text><circle cx="326.0" cy="598.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="603.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">4</tspan></text><rect x="350.0" y="576.0" width="610.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="577.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="600.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Cómo se ajusta</tspan></text><text x="368.0" y="621.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Meta de diuresis: 0,5-1 mL/kg/h = 35-70 mL/h en este paciente.</tspan><tspan x="368.0" dy="16">Guías actuales: 2-4 mL/kg/% para evitar la sobrecarga.</tspan></text><text x="310.0" y="691.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="650"><tspan x="310.0" dy="0">REPARTO DE LOS 8 400 ML EN 24 HORAS</tspan></text><rect x="310.0" y="701.0" width="212.7" height="40.0" rx="8" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="416.3" y="719.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="201"><tspan x="416.3" dy="0">4 200 mL</tspan></text><text x="416.3" y="734.0" font-size="10.5" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="201"><tspan x="416.3" dy="0">primeras 8 h</tspan></text><rect x="526.7" y="701.0" width="429.3" height="40.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="741.3" y="719.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="417"><tspan x="741.3" dy="0">4 200 mL</tspan></text><text x="741.3" y="734.0" font-size="10.5" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="417"><tspan x="741.3" dy="0">16 h siguientes</tspan></text><text x="40.0" y="797.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE VOLUMEN</tspan></text><rect x="40.0" y="807.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="829.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="335.0" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="230"><tspan x="335.0" dy="0">4 200 mL</tspan></text><rect x="463.0" y="810.0" width="244.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="230"><tspan x="585.0" dy="0">8 400 mL</tspan></text><text x="835.0" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="230"><tspan x="835.0" dy="0">10 500 mL</tspan></text><rect x="40.0" y="844.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="463.0" y="844.0" width="244.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="865.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">De dónde sale</tspan></text><text x="335.0" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="228"><tspan x="335.0" dy="0">Solo la mitad: primeras 8 h</tspan></text><text x="585.0" y="865.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="228"><tspan x="585.0" dy="0">4 × 70 × 30 (24 h)</tspan></text><text x="835.0" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="228"><tspan x="835.0" dy="0">5 × 70 × 30: fórmula errada</tspan></text><rect x="40.0" y="878.0" width="920.0" height="34.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="463.0" y="878.0" width="244.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="899.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Es el total de 24 h?</tspan></text><text x="335.0" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="228"><tspan x="335.0" dy="0">No</tspan></text><text x="585.0" y="899.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="228"><tspan x="585.0" dy="0">Sí</tspan></text><text x="835.0" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="228"><tspan x="835.0" dy="0">No</tspan></text><rect x="40.0" y="807.0" width="920.0" height="105.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="936.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="964.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="986.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Parkland: 4 mL × kg × % SCQ = volumen de 24 h; la mitad en las primeras 8 h desde la quemadura, no desde el ingreso.</tspan><tspan x="58.0" dy="18">• 4 200 mL es solo la mitad (primeras 8 h); 10 500 mL sale de usar 5 mL por kg y por %.</tspan><tspan x="58.0" dy="18">• El mejor monitor de la reanimación es la diuresis horaria (0,5-1 mL/kg/h en adultos).</tspan></text><text x="58.0" y="1044.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025); guía ISBI 2016 y American Burn Association.</tspan></text></svg>