<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1124" viewBox="0 0 1000 1124" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Translucencia nucal aumentada: qué detecta cada prueba prenatal"><title>Translucencia nucal aumentada: qué detecta cada prueba prenatal</title><rect x="0.75" y="0.75" width="998.5" height="1122.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tamizaje prenatal del primer trimestre · translucencia nucal</tspan></text><rect x="549.2" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="636.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="636.3" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tamizaje de aneuploidías en el primer trimestre</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La translucencia nucal (TN) se mide entre las 11 y 13+6 semanas.</tspan><tspan x="58.0" dy="17">Una TN mayor del percentil 95 eleva el riesgo de cromosomopatía (trisomía 21, 18, 13).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 35 años, 12 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primer control prenatal.</tspan><tspan x="640.0" dy="16">Ecografía: TN por encima del percentil 95.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HALLAZGO DEL CASO Y A QUÉ RIESGO APUNTA</tspan></text><rect x="40.0" y="269.0" width="350.0" height="350.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="171.0" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">ECOGRAFÍA DE 12 SEMANAS</tspan></text><g transform="translate(50.0,305.0) scale(1.0)"><defs><clipPath id="ecoclip"><rect x="0" y="0" width="330" height="270" rx="10"/></clipPath></defs><rect x="0" y="0" width="330" height="270" rx="10" fill="#0b0f19"/><g clip-path="url(#ecoclip)"><path d="M165 6 L10 262 Q165 300 320 262 Z" fill="#1f2937"/><ellipse cx="165" cy="170" rx="125" ry="70" fill="#0b0f19" stroke="#6b7280" stroke-width="3"/><circle cx="100" cy="168" r="38" fill="#9ca3af"/><path d="M130 150 C170 138 220 146 246 168 C252 184 236 200 206 202 C176 204 146 196 132 186 Z" fill="#9ca3af"/><path d="M240 190 C258 196 266 208 258 220" stroke="#9ca3af" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M70 176 C74 188 84 194 94 192" stroke="#d1d5db" stroke-width="3" fill="none"/><path d="M118 124 C132 118 150 120 164 130" stroke="#f3f4f6" stroke-width="3" fill="none"/><path d="M120 142 C134 134 150 136 162 144" stroke="#d1d5db" stroke-width="3" fill="none"/><path d="M119 133 C133 126 150 128 163 137" stroke="#0b0f19" stroke-width="10" fill="none"/><text x="140" y="124" font-size="15" font-weight="800" fill="#fde047" text-anchor="middle" data-max="0">+</text><text x="140" y="146" font-size="15" font-weight="800" fill="#fde047" text-anchor="middle" data-max="0">+</text><path d="M150 118 L200 78" stroke="#fde047" stroke-width="2"/></g><text x="204" y="74" font-size="14" font-weight="800" fill="#fde047" data-max="0">TN &gt; p95</text><text x="14" y="22" font-size="11" font-weight="700" fill="#9ca3af" data-max="0">12 sem · corte sagital</text></g><rect x="48.0" y="571.0" width="334.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="215.0" y="592.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="320"><tspan x="215.0" dy="0">La banda oscura de la nuca está engrosada: TN por encima</tspan><tspan x="215.0" dy="15">del percentil 95.</tspan></text><rect x="410.0" y="269.0" width="550.0" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="411.0" y="270.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="428.0" y="293.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">TN aumentada → cromosomopatía fetal</tspan></text><text x="428.0" y="314.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Principal riesgo: trisomía 21; también 18, 13 y cardiopatías.</tspan><tspan x="428.0" dy="16">Se ofrece ADN fetal libre o prueba invasiva (biopsia de corion, amniocentesis).</tspan></text><rect x="860.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="410.0" y="364.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="365.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="388.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Tubo neural → no es la TN</tspan></text><text x="428.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Se busca con alfafetoproteína y ecografía morfológica (18-22 sem).</tspan></text><rect x="410.0" y="443.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="444.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Preeclampsia precoz → no es la TN</tspan></text><text x="428.0" y="488.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Se predice con Doppler de arterias uterinas y PlGF a las 11-14 sem.</tspan></text><rect x="410.0" y="522.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="523.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="546.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Restricción del crecimiento → no es la TN</tspan></text><text x="428.0" y="567.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Se vigila con biometría y Doppler en el 3.er trimestre.</tspan></text><text x="40.0" y="653.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SE HACE CADA PRUEBA</tspan></text><line x1="350.0" y1="685.0" x2="350.0" y2="911.0" stroke="#e2e8f0" stroke-width="1"/><line x1="434.9" y1="685.0" x2="434.9" y2="911.0" stroke="#e2e8f0" stroke-width="1"/><line x1="519.7" y1="685.0" x2="519.7" y2="911.0" stroke="#e2e8f0" stroke-width="1"/><line x1="604.6" y1="685.0" x2="604.6" y2="911.0" stroke="#e2e8f0" stroke-width="1"/><line x1="689.4" y1="685.0" x2="689.4" y2="911.0" stroke="#e2e8f0" stroke-width="1"/><line x1="774.3" y1="685.0" x2="774.3" y2="911.0" stroke="#e2e8f0" stroke-width="1"/><line x1="859.1" y1="685.0" x2="859.1" y2="911.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="685.0" x2="944.0" y2="911.0" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="689.0" width="920.0" height="32.0" rx="8" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="50.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">TN + tamizaje combinado</tspan></text><text x="50.0" y="718.0" font-size="10.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">cromosomopatías</tspan></text><rect x="413.6" y="696.0" width="63.6" height="20.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0"/><text x="483.3" y="710.0" font-size="10" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="80"><tspan x="483.3" dy="0">11-14 sem</tspan></text><line x1="330.0" y1="706.0" x2="409.6" y2="706.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="740.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">ADN fetal libre</tspan></text><text x="50.0" y="754.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">cromosomopatías</tspan></text><rect x="392.4" y="732.0" width="254.6" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="519.7" y="746.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="247"><tspan x="519.7" dy="0">10-22 sem</tspan></text><line x1="330.0" y1="742.0" x2="388.4" y2="742.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="776.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Doppler uterinas</tspan></text><text x="50.0" y="790.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">preeclampsia</tspan></text><rect x="413.6" y="768.0" width="63.6" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="483.3" y="782.0" font-size="10" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="80"><tspan x="483.3" dy="0">11-14 sem</tspan></text><line x1="330.0" y1="778.0" x2="409.6" y2="778.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="812.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Alfafetoproteína</tspan></text><text x="50.0" y="826.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">tubo neural</tspan></text><rect x="498.5" y="804.0" width="106.1" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="551.5" y="818.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="551.5" dy="0">15-20 sem</tspan></text><line x1="330.0" y1="814.0" x2="494.5" y2="814.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="848.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Eco morfológica</tspan></text><text x="50.0" y="862.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">malformaciones</tspan></text><rect x="562.1" y="840.0" width="84.9" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="604.6" y="854.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="77"><tspan x="604.6" dy="0">18-22 sem</tspan></text><line x1="330.0" y1="850.0" x2="558.1" y2="850.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="884.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Biometría y Doppler</tspan></text><text x="50.0" y="898.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">crecimiento fetal</tspan></text><rect x="774.3" y="876.0" width="169.7" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="859.1" y="890.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="162"><tspan x="859.1" dy="0">28-36 sem</tspan></text><line x1="330.0" y1="886.0" x2="770.3" y2="886.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><line x1="350.0" y1="911.0" x2="944.0" y2="911.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="350.0" y1="907.0" x2="350.0" y2="915.0" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="929.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="350.0" dy="0">8</tspan></text><line x1="434.9" y1="907.0" x2="434.9" y2="915.0" stroke="#94a3b8" stroke-width="1.5"/><text x="434.9" y="929.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="434.9" dy="0">12</tspan></text><line x1="519.7" y1="907.0" x2="519.7" y2="915.0" stroke="#94a3b8" stroke-width="1.5"/><text x="519.7" y="929.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="519.7" dy="0">16</tspan></text><line x1="604.6" y1="907.0" x2="604.6" y2="915.0" stroke="#94a3b8" stroke-width="1.5"/><text x="604.6" y="929.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="604.6" dy="0">20</tspan></text><line x1="689.4" y1="907.0" x2="689.4" y2="915.0" stroke="#94a3b8" stroke-width="1.5"/><text x="689.4" y="929.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="689.4" dy="0">24</tspan></text><line x1="774.3" y1="907.0" x2="774.3" y2="915.0" stroke="#94a3b8" stroke-width="1.5"/><text x="774.3" y="929.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="774.3" dy="0">28</tspan></text><line x1="859.1" y1="907.0" x2="859.1" y2="915.0" stroke="#94a3b8" stroke-width="1.5"/><text x="859.1" y="929.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="859.1" dy="0">32</tspan></text><line x1="944.0" y1="907.0" x2="944.0" y2="915.0" stroke="#94a3b8" stroke-width="1.5"/><text x="944.0" y="929.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="944.0" dy="0">36</tspan></text><text x="944.0" y="945.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="200"><tspan x="944.0" dy="0">semanas de gestación</tspan></text><line x1="434.9" y1="683.0" x2="434.9" y2="911.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><rect x="389.4" y="666.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="434.9" y="681.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="434.9" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="975.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1003.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1025.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La TN se mide entre las 11 y 13+6 semanas (longitud craneocaudal 45-84 mm).</tspan><tspan x="58.0" dy="18">• TN &gt; p95 = mayor riesgo de aneuploidía: ofrecer ADN fetal libre o diagnóstico invasivo y ecocardiografía fetal.</tspan><tspan x="58.0" dy="18">• Tubo neural: alfafetoproteína y ecografía morfológica; preeclampsia: Doppler de uterinas.</tspan></text><text x="58.0" y="1083.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed.; Fetal Medicine Foundation; ACOG Practice Bulletin 226 (2020).</tspan></text></svg>