<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1203" viewBox="0 0 1000 1203" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Herida quirúrgica a las 36 horas: fase inflamatoria de la cicatrización"><title>Herida quirúrgica a las 36 horas: fase inflamatoria de la cicatrización</title><rect x="0.75" y="0.75" width="998.5" height="1201.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Patología general · cicatrización</tspan></text><rect x="390.0" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="469.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="469.4" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fases de la cicatrización</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamatoria (0-3 días), proliferativa (3 días-3 semanas) y remodelación (semanas-meses).</tspan><tspan x="58.0" dy="17">La diabetes mal controlada retrasa todas las fases.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 58 años con DM2 (HbA1c 9,5 %)</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Apendicectomía abierta hace 36 horas.</tspan><tspan x="640.0" dy="16">Bordes algo edematosos, eritema leve, exudado</tspan><tspan x="640.0" dy="16">serohemático escaso; sin pus ni dehiscencia.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS FASES DE LA CICATRIZACIÓN</tspan></text><rect x="42.0" y="285.0" width="302.7" height="216.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="193.3" y="303.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">INFLAMATORIA</tspan></text><text x="193.3" y="493.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Días 0-3</tspan></text><rect x="348.7" y="285.0" width="302.7" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="500.0" y="303.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">PROLIFERATIVA</tspan></text><text x="500.0" y="493.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Día 3 a semana 3</tspan></text><rect x="655.3" y="285.0" width="302.7" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="303.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">REMODELACIÓN</tspan></text><text x="806.7" y="493.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Semanas a meses</tspan></text><path d="M 60.0,383.2 L 206.7,393.4 L 353.3,429.1 L 500.0,449.5 L 646.7,464.8 L 793.3,469.9 L 940.0,471.9" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M 60.0,469.9 L 206.7,459.7 L 353.3,418.9 L 500.0,388.3 L 646.7,393.4 L 793.3,403.6 L 940.0,408.7" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="58.0" y1="325.0" x2="80.0" y2="325.0" stroke="#dc2626" stroke-width="3"/><text x="86.0" y="329.0" font-size="10.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="200"><tspan x="86.0" dy="0">Neutrófilos y macrófagos</tspan></text><line x1="233.5" y1="325.0" x2="255.5" y2="325.0" stroke="#0f766e" stroke-width="3"/><text x="261.5" y="329.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="200"><tspan x="261.5" dy="0">Fibroblastos y colágeno</tspan></text><line x1="193.3" y1="287.0" x2="193.3" y2="477.0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><rect x="147.9" y="460.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="193.3" y="475.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="193.3" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="515.0" width="290.7" height="90.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="193.3" y="551.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">NEUTRÓFILOS</tspan></text><text x="193.3" y="575.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Edema, eritema, exudado</tspan></text><rect x="354.7" y="515.0" width="290.7" height="90.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="551.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">FIBROBLASTOS</tspan></text><text x="500.0" y="575.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Granulación, colágeno III</tspan></text><rect x="661.3" y="515.0" width="290.7" height="90.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="551.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">COLÁGENO I</tspan></text><text x="806.7" y="575.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Más fuerza, cicatriz</tspan></text><text x="40.0" y="645.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="657.0" width="328.0" height="252.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="667.0" width="180.9" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="681.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="286"><tspan x="61.0" dy="0">HERIDA DEL CASO (ESQUEMA)</tspan></text><g transform="translate(54.0,695.0) scale(1.0)"><rect x="10" y="20" width="280" height="130" rx="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><ellipse cx="150" cy="85" rx="120" ry="34" fill="#fecaca" stroke="none" stroke-width="0" opacity="0.8"/><ellipse cx="150" cy="85" rx="100" ry="20" fill="#fca5a5" stroke="none" stroke-width="0" opacity="0.7"/><path d="M50 85 L250 85" fill="none" stroke="#7f1d1d" stroke-width="3" stroke-linejoin="round" /><path d="M70 72 L70 98" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round" /><path d="M100 72 L100 98" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round" /><path d="M130 72 L130 98" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round" /><path d="M160 72 L160 98" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round" /><path d="M190 72 L190 98" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round" /><path d="M220 72 L220 98" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round" /><ellipse cx="120" cy="96" rx="8" ry="4" fill="#fde68a" stroke="#ca8a04" stroke-width="1" /><text x="150" y="172" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">36 h: bordes edematosos, eritema leve, exudado escaso</text><text x="150" y="172" font-size="10" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">36 h: bordes edematosos, eritema leve, exudado escaso</text><text x="150" y="14" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">fase inflamatoria (normal)</text><text x="150" y="14" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">fase inflamatoria (normal)</text></g><rect x="390.0" y="657.0" width="570.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="408.0" cy="675.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="679.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">1</tspan></text><text x="428.0" y="679.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Bordes edematosos y eritema leve: inflamación normal.</tspan></text><rect x="390.0" y="688.0" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="706.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="710.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">2</tspan></text><text x="428.0" y="710.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Exudado serohemático escaso.</tspan></text><rect x="390.0" y="719.0" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="737.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="741.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">3</tspan></text><text x="428.0" y="741.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Sin pus ni dehiscencia.</tspan></text><text x="40.0" y="949.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="959.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="981.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="962.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="981.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Inflamatoria temprana</tspan></text><text x="491.2" y="981.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Remodelación</tspan></text><text x="678.8" y="981.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Epitelización avanzada</tspan></text><text x="866.2" y="981.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Fibroblástica</tspan></text><rect x="40.0" y="996.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="996.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1017.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿A las 36 h?</tspan></text><text x="303.8" y="1017.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="1017.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Meses después</tspan></text><text x="678.8" y="1017.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No tan pronto</tspan></text><text x="866.2" y="1017.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Desde el día 3-5</tspan></text><rect x="40.0" y="959.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1054.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1082.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1104.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• A las 36 horas: fase inflamatoria temprana (vasodilatación, exudado, neutrófilos y luego macrófagos).</tspan><tspan x="58.0" dy="18">• Desde el día 3-5 empieza la proliferación (fibroblastos, colágeno III, granulación).</tspan><tspan x="58.0" dy="18">• La remodelación (colágeno I) dura meses.</tspan></text><text x="58.0" y="1162.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Robbins y Cotran, Patología estructural y funcional 10.ª ed.; Guyton y Hall, Fisiología médica 14.ª ed..</tspan></text></svg>