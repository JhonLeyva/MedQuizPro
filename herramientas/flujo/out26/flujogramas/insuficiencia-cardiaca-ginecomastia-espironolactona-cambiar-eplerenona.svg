<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1429" viewBox="0 0 1000 1429" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ginecomastia por espironolactona en insuficiencia cardiaca: cambiar a eplerenona"><title>Ginecomastia por espironolactona en insuficiencia cardiaca: cambiar a eplerenona</title><rect x="0.75" y="0.75" width="998.5" height="1427.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Insuficiencia cardiaca · efectos adversos</tspan></text><rect x="441.4" y="32.0" width="132.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="507.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="116"><tspan x="507.4" dy="0">CARDIOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Antagonistas de la aldosterona</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reducen mortalidad en la insuficiencia cardiaca con FEVI reducida.</tspan><tspan x="58.0" dy="17">La espironolactona también bloquea andrógenos: ginecomastia y menos libido.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 45 años con IC</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Losartán, hidroclorotiazida, bisoprolol y</tspan><tspan x="640.0" dy="16">espironolactona.</tspan><tspan x="640.0" dy="16">2 meses de aumento de volumen mamario y menos</tspan><tspan x="640.0" dy="16">libido.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ CONVIENE?</tspan></text><rect x="493.0" y="351.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 556.0 H560.0 L540.0 536.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="351.0" r="11" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="369.1" x2="614.6" y2="332.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="369.1" x2="357.4" y2="431.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="369.1" x2="413.4" y2="431.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 431.1 H423.4 Q385.4 475.1 347.4 431.1 Z" fill="#ea580c"/><text x="385.4" y="446.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">elige</tspan></text><line x1="614.6" y1="332.9" x2="586.6" y2="394.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="332.9" x2="642.6" y2="394.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 394.9 H652.6 Q614.6 438.9 576.6 394.9 Z" fill="#64748b"/><text x="614.6" y="409.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">no</tspan></text><text x="500.0" y="583.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">Ginecomastia por espironolactona</tspan></text><rect x="40.0" y="321.0" width="290.0" height="132.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Cambiar a eplerenona</tspan></text><circle cx="62.0" cy="374.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Antagonista de aldosterona selectivo</tspan></text><circle cx="62.0" cy="400.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="404.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Mantiene el beneficio en la IC</tspan></text><circle cx="62.0" cy="426.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="430.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Casi sin efecto antiandrogénico</tspan></text><rect x="214.6" y="310.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="321.0" width="290.0" height="132.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Seguir con espironolactona</tspan></text><circle cx="692.0" cy="374.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Bloquea receptores de andrógenos</tspan></text><circle cx="692.0" cy="400.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="404.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Ginecomastia y menos libido</tspan></text><circle cx="692.0" cy="426.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="430.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Lleva a abandonar el tratamiento</tspan></text><rect x="40.0" y="617.0" width="920.0" height="76.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="645.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Reemplazar espironolactona por eplerenona</tspan></text><text x="500.0" y="666.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Enalapril, furosemida o metoprolol no hacen el trabajo de la espironolactona.</tspan></text><text x="40.0" y="733.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="745.0" width="278.0" height="374.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="755.0" width="87.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="769.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="236"><tspan x="61.0" dy="0">EL PACIENTE</tspan></text><g data-box="54.0 783.0 250.0 312.0"><g transform="translate(94.0,783.0) scale(0.7)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><ellipse cx="98" cy="120" rx="18" ry="12" fill="#fecdd3" stroke="#be185d" stroke-width="1.6" /><ellipse cx="142" cy="120" rx="18" ry="12" fill="#fecdd3" stroke="#be185d" stroke-width="1.6" /><circle cx="120" cy="140" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="120" y="144" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g></g><rect x="340.0" y="745.0" width="620.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="358.0" cy="760.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="764.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">1</tspan></text><text x="376.0" y="765.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Aumento de volumen de ambas mamas (ginecomastia).</tspan></text><rect x="340.0" y="783.0" width="620.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="798.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="802.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">2</tspan></text><text x="376.0" y="803.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Causa: efecto antiandrogénico de la espironolactona.</tspan></text><rect x="340.0" y="821.0" width="620.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="836.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="840.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">3</tspan></text><text x="376.0" y="841.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Suele mejorar al suspenderla.</tspan></text><text x="40.0" y="1159.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1169.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1191.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1191.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Enalapril</tspan></text><text x="491.2" y="1191.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Furosemida</tspan></text><rect x="588.0" y="1172.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="1191.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Eplerenona</tspan></text><text x="866.2" y="1191.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Metoprolol</tspan></text><rect x="40.0" y="1206.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1206.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1227.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Reemplaza a la</tspan><tspan x="54.0" dy="16">espironolactona?</tspan></text><text x="303.8" y="1235.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: ya recibe losartán</tspan></text><text x="491.2" y="1235.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: es diurético de asa</tspan></text><text x="678.8" y="1235.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí</tspan></text><text x="866.2" y="1235.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: ya recibe bisoprolol</tspan></text><rect x="40.0" y="1169.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1280.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1308.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1330.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ginecomastia + menos libido con espironolactona: efecto antiandrogénico.</tspan><tspan x="58.0" dy="18">• Se cambia por eplerenona: antagonista de aldosterona selectivo, mismo beneficio, casi sin efecto hormonal.</tspan><tspan x="58.0" dy="18">• Seguir vigilando potasio y creatinina.</tspan></text><text x="58.0" y="1388.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, insuficiencia cardiaca (2021); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>