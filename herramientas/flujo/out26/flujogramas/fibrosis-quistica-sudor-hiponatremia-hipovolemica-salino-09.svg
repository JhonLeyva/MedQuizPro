<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1075" viewBox="0 0 1000 1075" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fibrosis quística que pierde sal por el sudor: salino 0,9 % en bolo"><title>Fibrosis quística que pierde sal por el sudor: salino 0,9 % en bolo</title><rect x="0.75" y="0.75" width="998.5" height="1074.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trastornos del sodio · hiponatremia hipovolémica</tspan></text><rect x="493.2" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="549.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="549.7" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hiponatremia hipovolémica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se pierde sal y agua; el riñón retiene sodio (sodio urinario bajo).</tspan><tspan x="58.0" dy="17">El tratamiento es reponer volumen y sodio con solución isotónica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 8 años con fibrosis quística</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mucho sudor al jugar en zona cálida; debilidad,</tspan><tspan x="640.0" dy="16">mareos, vómitos.</tspan><tspan x="640.0" dy="16">PA 85/50, FC 120; Na 124, Na urinario 8; recibe salino</tspan><tspan x="640.0" dy="16">0,45 %.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="733.5" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#94a3b8"/><line x1="733.5" y1="411.0" x2="733.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,439.0 738.5,439.0 733.5,447.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#0f766e"/><rect x="254.4" y="420.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí</tspan></text><rect x="719.4" y="420.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,352.0 266.0,323.0 734.0,323.0 760.0,352.0 734.0,381.0 266.0,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Hipovolemia con hipoperfusión (PA baja, llenado lento)?</tspan></text><rect x="40.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">SALINO 0,9 % EN BOLO</tspan></text><text x="266.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">20 mL/kg y luego infusión isotónica</tspan><tspan x="266.5" dy="17">Controlar el sodio cada 4-6 h</tspan></text><rect x="507.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Reposición oral o EV isotónica</tspan></text><text x="733.5" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Suplementos de sal en la dieta</tspan></text><text x="40.0" y="577.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="589.5" width="358.0" height="192.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="599.5" width="154.7" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="613.5" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="316"><tspan x="61.0" dy="0">LABORATORIO DEL CASO</tspan></text><g transform="translate(54.0,627.5) scale(1.0)"><text x="118" y="12" font-size="10" font-weight="700" fill="#64748b" text-anchor="start" data-max="0">Sodio (mEq/L)</text><text x="110" y="39" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end" data-max="0">Na sérico</text><rect x="118" y="24" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="24" width="167.0" height="22" rx="4" fill="#ea580c"/><text x="278.9866666666667" y="39" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="end" data-max="0">124 mEq/L</text><text x="110" y="73" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Normal mínimo</text><rect x="118" y="58" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="58" width="181.8" height="22" rx="4" fill="#94a3b8"/><text x="293.8" y="73" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="end" data-max="0">135</text><text x="110" y="107" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Na urinario</text><rect x="118" y="92" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="92" width="10.8" height="22" rx="4" fill="#94a3b8"/><text x="134.77333333333334" y="107" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">8 mEq/L</text></g><rect x="420.0" y="589.5" width="540.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="438.0" cy="607.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="611.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">1</tspan></text><text x="458.0" y="611.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Sodio sérico bajo: 124.</tspan></text><rect x="420.0" y="620.5" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="638.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="642.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">2</tspan></text><text x="458.0" y="642.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Sodio urinario de 8: el riñón ahorra sal (la pérdida es por el sudor).</tspan></text><rect x="420.0" y="651.5" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="669.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="673.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">3</tspan></text><text x="458.0" y="673.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">PA 85/50 y FC 120: hipovolemia.</tspan></text><text x="40.0" y="821.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="831.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="854.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="854.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Suspender líquidos EV</tspan></text><text x="491.2" y="854.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Seguir con 0,45 %</tspan></text><rect x="588.0" y="834.5" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="854.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Salino 0,9 % en bolo</tspan></text><text x="866.2" y="854.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Dextrosa 5 % sola</tspan></text><rect x="40.0" y="868.5" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="868.5" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="889.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="889.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Deja la hipovolemia</tspan></text><text x="491.2" y="889.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Es hipotónico</tspan></text><text x="678.8" y="889.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Ninguno</tspan></text><text x="866.2" y="889.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Empeora la hiponatremia</tspan></text><rect x="40.0" y="831.5" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="926.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="954.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="976.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fibrosis quística + calor: el sudor tiene mucha sal → hiponatremia hipovolémica.</tspan><tspan x="58.0" dy="18">• Shock o hipoperfusión: salino 0,9 % 20 mL/kg en bolo, luego infusión; corregir el sodio ≤ 8-10 mEq/L en 24 h.</tspan><tspan x="58.0" dy="18">• Las soluciones hipotónicas (0,45 %, dextrosa sola) empeoran la hiponatremia.</tspan></text><text x="58.0" y="1034.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); CF Foundation, reposición de sal.</tspan></text></svg>