<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1448" viewBox="0 0 1000 1448" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cáncer gástrico con metástasis hepáticas: quimioterapia sistémica"><title>Cáncer gástrico con metástasis hepáticas: quimioterapia sistémica</title><rect x="0.75" y="0.75" width="998.5" height="1446.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cáncer gástrico · enfermedad metastásica</tspan></text><rect x="449.6" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="500.2" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="184.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cáncer gástrico estadio IV</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Con metástasis a distancia la cirugía ya no cura.</tspan><tspan x="58.0" dy="17">El objetivo pasa a ser vivir más y con menos síntomas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="184.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="182.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 70 años, adenocarcinoma</tspan><tspan x="640.0" dy="17">cuerpo-antral</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Metástasis hepáticas múltiples; baja de peso y</tspan><tspan x="640.0" dy="16">anorexia.</tspan><tspan x="640.0" dy="16">Estable, sin sangrado ni obstrucción; cirugía descarta</tspan><tspan x="640.0" dy="16">resecar.</tspan></text><rect x="640.0" y="245.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="258.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="258.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="306.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ PESA MÁS EN ESTE PACIENTE?</tspan></text><rect x="493.0" y="368.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 573.0 H560.0 L540.0 553.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="368.0" r="11" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="386.1" x2="614.6" y2="349.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="386.1" x2="357.4" y2="448.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="386.1" x2="413.4" y2="448.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 448.1 H423.4 Q385.4 492.1 347.4 448.1 Z" fill="#ea580c"/><text x="385.4" y="463.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">elige</tspan></text><line x1="614.6" y1="349.9" x2="586.6" y2="411.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="349.9" x2="642.6" y2="411.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 411.9 H652.6 Q614.6 455.9 576.6 411.9 Z" fill="#64748b"/><text x="614.6" y="426.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">no</tspan></text><text x="500.0" y="600.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">Estadio IV por metástasis hepáticas</tspan></text><rect x="40.0" y="338.0" width="290.0" height="132.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="366.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Quimioterapia sistémica</tspan></text><circle cx="62.0" cy="391.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="395.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Actúa en el estómago y en el hígado a la vez</tspan></text><circle cx="62.0" cy="417.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="421.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Prolonga la supervivencia y alivia síntomas</tspan></text><circle cx="62.0" cy="443.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="447.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Paciente estable y sin complicaciones</tspan></text><rect x="214.6" y="327.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="342.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="338.0" width="290.0" height="132.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="366.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Cirugía (gastrectomía o resección)</tspan></text><circle cx="692.0" cy="391.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="395.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">No cura: las metástasis quedan</tspan></text><circle cx="692.0" cy="417.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="421.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Mucha morbilidad sin ganar supervivencia</tspan></text><circle cx="692.0" cy="443.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="447.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Se reserva para sangrado u obstrucción</tspan></text><rect x="40.0" y="634.0" width="920.0" height="76.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="662.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Quimioterapia sistémica paliativa de primera línea</tspan></text><text x="500.0" y="683.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Con apoyo nutricional y control de síntomas; la cirugía queda para las complicaciones.</tspan></text><text x="40.0" y="750.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="762.0" width="328.0" height="392.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="772.0" width="193.0" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="786.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="286"><tspan x="61.0" dy="0">EXTENSIÓN DE LA ENFERMEDAD</tspan></text><g data-box="54.0 800.0 300.0 330.0"><g transform="translate(54.0,800.0) scale(1.0)"><path d="M18 16 Q150 -6 282 16 L292 300 Q150 334 8 300 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M28 40 Q150 10 272 40" fill="none" stroke="#d6a684" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M24 42 C60 20 176 22 188 42 L182 66 C150 92 86 110 26 112 Z" fill="#e7a882" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="112" cy="104" rx="11" ry="17" fill="#86efac" stroke="#9a6b52" stroke-width="1.8" transform="rotate(-20 112 104)" /><path d="M178 44 C214 30 256 46 254 84 C252 116 222 132 190 128 C178 126 172 116 180 110 C204 110 222 98 220 80 C218 62 200 58 184 64 Z" fill="#fbcfe8" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="266" cy="78" rx="14" ry="30" fill="#c4b5fd" stroke="#9a6b52" stroke-width="1.8" transform="rotate(12 266 78)" /><path d="M150 118 C124 116 116 142 124 160 C132 176 158 176 170 168" fill="none" stroke="#e879a0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 136 C176 124 214 122 246 116 C252 124 246 132 238 134 C206 140 178 146 156 150 Z" fill="#fde68a" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><path d="M58 262 L52 170" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 148 L240 146" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 160 L250 246" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 246 C250 268 226 286 196 286 C176 286 170 272 160 276" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="60" cy="270" rx="15" ry="13" fill="#fed7aa" stroke="#9a6b52" stroke-width="1.8" /><path d="M58 282 C56 296 66 304 74 300" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 180 C120 166 150 196 178 176 C206 158 226 190 206 206 C182 222 150 196 126 214 C104 230 136 248 162 236 C190 224 220 240 206 258 C190 272 150 250 120 262 C102 268 84 262 76 266" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 262 C84 264 78 266 72 268" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="306" rx="22" ry="12" fill="#fef9c3" stroke="#9a6b52" stroke-width="1.8" /><ellipse cx="200" cy="90" rx="40" ry="30" fill="#7c2d12" stroke="#431407" stroke-width="2" opacity="0.85"/><circle cx="60" cy="60" r="8" fill="#57534e" stroke="#1c1917" stroke-width="1.2" /><circle cx="96" cy="76" r="6" fill="#57534e" stroke="#1c1917" stroke-width="1.2" /><circle cx="130" cy="56" r="7" fill="#57534e" stroke="#1c1917" stroke-width="1.2" /><circle cx="80" cy="92" r="5" fill="#57534e" stroke="#1c1917" stroke-width="1.2" /><circle cx="150" cy="80" r="6" fill="#57534e" stroke="#1c1917" stroke-width="1.2" /><circle cx="200" cy="90" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="200" y="94" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="96" cy="44" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="96" y="48" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><text x="10" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g></g><rect x="390.0" y="762.0" width="570.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="777.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="781.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">1</tspan></text><text x="426.0" y="782.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Tumor en el estómago (cuerpo y antro).</tspan></text><rect x="390.0" y="800.0" width="570.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="815.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="819.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">2</tspan></text><text x="426.0" y="820.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Metástasis múltiples en el hígado: estadio IV.</tspan></text><rect x="390.0" y="838.0" width="570.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="853.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="857.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">3</tspan></text><text x="426.0" y="858.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Operar el estómago no elimina las lesiones del hígado.</tspan></text><text x="40.0" y="1194.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1204.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1226.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1207.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="1226.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Quimioterapia sistémica</tspan></text><text x="491.2" y="1226.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Gastrectomía total</tspan></text><text x="678.8" y="1226.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Inmunoterapia sola</tspan></text><text x="866.2" y="1226.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Resección + bypass</tspan></text><rect x="40.0" y="1241.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1241.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1262.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuándo?</tspan></text><text x="303.8" y="1262.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Este caso</tspan></text><text x="491.2" y="1262.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No en estadio IV</tspan></text><text x="678.8" y="1262.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No como monoterapia inicial</tspan></text><text x="866.2" y="1262.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Solo si hay obstrucción</tspan></text><rect x="40.0" y="1204.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1299.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1327.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1349.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Estadio IV sin complicaciones: quimioterapia sistémica paliativa (fluoropirimidina + platino).</tspan><tspan x="58.0" dy="18">• Añadir trastuzumab si HER2 (+); inmunoterapia combinada si PD-L1 alto.</tspan><tspan x="58.0" dy="18">• Cirugía o stent solo para complicaciones: sangrado u obstrucción.</tspan></text><text x="58.0" y="1407.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NCCN, cáncer gástrico (2024); ESMO (2022).</tspan></text></svg>