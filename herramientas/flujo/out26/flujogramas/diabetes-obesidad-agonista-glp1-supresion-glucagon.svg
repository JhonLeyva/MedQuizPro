ints="196.0,118.0 187.0,122.3 187.0,113.7" fill="#dc2626"/><text x="150" y="150" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">más insulina</text><text x="150" y="150" font-size="10" font-weight="800" fill="#166534" text-anchor="middle" data-max="0">más insulina</text><text x="236" y="150" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">menos glucagón</text><text x="236" y="150" font-size="10" font-weight="800" fill="#dc2626" text-anchor="middle" data-max="0">menos glucagón</text><line x1="214.0" y1="160.0" x2="263.3" y2="191.7" stroke="#dc2626" stroke-width="2.2"/><polygon points="270.0,196.0 260.1,194.8 264.8,187.5" fill="#dc2626"/><ellipse cx="296" cy="200" rx="34" ry="16" fill="#e7a882" stroke="#9a3412" stroke-width="1.5" /><text x="296" y="204" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">hígado</text><text x="296" y="204" font-size="9.5" font-weight="800" fill="#7c2d12" text-anchor="middle" data-max="0">hígado</text><text x="296" y="178" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">menos glucosa</text><text x="296" y="178" font-size="9.5" font-weight="800" fill="#dc2626" text-anchor="middle" data-max="0">menos glucosa</text></g><text x="54.0" y="623.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="54.0" dy="0">Menos glucagón: el hígado suelta menos glucosa.</tspan></text><ellipse cx="662.0" cy="426.0" rx="206.0" ry="120.0" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><polygon points="791.4,332.4 774.8,333.0 780.3,320.1" fill="#0f766e"/><polygon points="853.5,470.9 854.7,454.4 867.0,461.3" fill="#0f766e"/><polygon points="653.0,546.0 668.0,539.0 668.0,553.0" fill="#0f766e"/><polygon points="461.7,455.2 475.1,464.9 462.9,471.7" fill="#0f766e"/><polygon points="549.2,325.4 538.1,337.7 532.7,324.8" fill="#0f766e"/><text x="662.0" y="430.0" font-size="12.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="220"><tspan x="662.0" dy="0">Agonista GLP-1</tspan></text><rect x="574.0" y="279.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="576.0" cy="281.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="576.0" y="285.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="576.0" dy="0">1</tspan></text><text x="662.0" y="301.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">Glucosa alta</tspan></text><text x="662.0" y="317.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">después de comer</tspan></text><rect x="769.9" y="361.9" width="176.0" height="54.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><circle cx="771.9" cy="363.9" r="11" fill="#7c2d12" stroke="none" stroke-width="0"/><text x="771.9" y="367.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="771.9" dy="0">2</tspan></text><text x="857.9" y="383.9" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">Menos glucagón</tspan></text><text x="857.9" y="399.9" font-size="10.5" font-weight="500" font-style="normal" fill="#fff7ed" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">células α</tspan></text><rect x="812.5" y="404.9" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="857.9" y="419.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="857.9" dy="0">◆ ESTE CASO</tspan></text><rect x="695.1" y="496.1" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="697.1" cy="498.1" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="697.1" y="502.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="697.1" dy="0">3</tspan></text><text x="783.1" y="518.1" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">Hígado frena</tspan></text><text x="783.1" y="534.1" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">menos glucosa</tspan></text><rect x="452.9" y="496.1" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="454.9" cy="498.1" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="454.9" y="502.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="454.9" dy="0">4</tspan></text><text x="540.9" y="518.1" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">Más insulina</tspan></text><text x="540.9" y="534.1" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">células β</tspan></text><rect x="378.1" y="361.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="380.1" cy="363.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="380.1" y="367.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="380.1" dy="0">5</tspan></text><text x="466.1" y="383.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">Saciedad</tspan></text><text x="466.1" y="399.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">menos peso</tspan></text><text x="40.0" y="678.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="688.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="689.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="712.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Reabsorción renal de glucosa</tspan></text><text x="58.0" y="733.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Eso es lo que bloquean los iSGLT2.</tspan></text><rect x="351.3" y="688.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="689.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="712.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Independiente de la glucosa</tspan></text><text x="369.3" y="733.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Su efecto depende de la glucemia.</tspan></text><rect x="662.7" y="688.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="689.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="712.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Receptores β2</tspan></text><text x="680.7" y="733.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No es su mecanismo.</tspan></text><text x="40.0" y="797.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="807.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="838.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="810.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Menos glucagón y</tspan><tspan x="303.8" dy="17">glucosa hepática</tspan></text><text x="491.2" y="838.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Más reabsorción tubular</tspan></text><text x="678.8" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Gluconeogénesis</tspan><tspan x="678.8" dy="17">independiente</tspan></text><text x="866.2" y="838.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Receptores β2</tspan></text><rect x="40.0" y="861.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="861.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="882.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Correcto?</tspan></text><text x="303.8" y="882.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="882.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="882.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="882.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="807.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="919.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="947.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="969.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mecanismo pedido: menos glucagón → menos producción hepática de glucosa (dependiente de la glucemia).</tspan><tspan x="58.0" dy="18">• Por depender de la glucosa, dan poca hipoglucemia.</tspan><tspan x="58.0" dy="18">• No actúan en el riñón (eso es iSGLT2) ni en receptores β2.</tspan></text><text x="58.0" y="1027.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman &amp; Gilman, Bases farmacológicas 14.ª ed. (2023); ADA (2025).</tspan></text></svg>