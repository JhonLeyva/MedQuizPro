"0" /><circle cx="152" cy="100" r="3" fill="#6366f1" stroke="none" stroke-width="0" /><circle cx="188" cy="100" r="3" fill="#6366f1" stroke="none" stroke-width="0" /><circle cx="224" cy="100" r="3" fill="#6366f1" stroke="none" stroke-width="0" /><circle cx="260" cy="100" r="3" fill="#6366f1" stroke="none" stroke-width="0" /></g><rect x="413.0" y="622.0" width="547.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="431.0" cy="640.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="644.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">1</tspan></text><text x="451.0" y="644.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">La bomba saca H⁺ hacia el estómago a cambio de K⁺.</tspan></text><rect x="413.0" y="653.0" width="547.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="431.0" cy="671.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">2</tspan></text><text x="451.0" y="675.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">El IBP la bloquea de forma irreversible.</tspan></text><rect x="413.0" y="684.0" width="547.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="431.0" cy="702.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">3</tspan></text><text x="451.0" y="706.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">Baja la acidez y alivia el reflujo.</tspan></text><text x="40.0" y="934.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="944.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="966.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="966.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Mucosas</tspan></text><rect x="400.5" y="947.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="966.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Parietales</tspan></text><text x="678.8" y="966.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Células G</tspan></text><text x="866.2" y="966.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Principales</tspan></text><rect x="40.0" y="981.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="981.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1002.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Producen</tspan></text><text x="303.8" y="1002.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Moco</tspan></text><text x="491.2" y="1002.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ácido: este caso</tspan></text><text x="678.8" y="1002.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Gastrina</tspan></text><text x="866.2" y="1002.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Pepsinógeno</tspan></text><rect x="40.0" y="944.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1039.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1067.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1089.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los IBP (omeprazol y otros) bloquean de forma irreversible la H⁺/K⁺-ATPasa de las células parietales.</tspan><tspan x="58.0" dy="18">• Se toman 30-60 minutos antes del desayuno: actúan sobre bombas activas.</tspan><tspan x="58.0" dy="18">• Las células G producen gastrina; las principales, pepsinógeno; las mucosas, moco.</tspan></text><text x="58.0" y="1147.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall, Fisiología médica 14.ª ed.; Goodman &amp; Gilman, Bases farmacológicas 14.ª ed. (2023).</tspan></text></svg>