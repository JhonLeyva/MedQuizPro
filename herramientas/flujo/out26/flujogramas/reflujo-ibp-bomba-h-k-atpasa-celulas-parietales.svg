72"><tspan x="190.0" dy="0">Producen moco y bicarbonato</tspan></text><rect x="660.0" y="283.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="284.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="316.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Células G del antro</tspan></text><text x="810.0" y="340.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Producen gastrina</tspan></text><rect x="660.0" y="383.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="384.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="416.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Principales</tspan></text><text x="810.0" y="440.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Producen pepsinógeno</tspan></text><text x="40.0" y="517.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Pirosis por reflujo</tspan></text><line x1="248.5" y1="549.5" x2="267.5" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,544.5 266.5,554.5 274.5,549.5" fill="#0f766e"/><rect x="278.5" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Mucho ácido</tspan></text><line x1="487.0" y1="549.5" x2="506.0" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,544.5 505.0,554.5 513.0,549.5" fill="#0f766e"/><rect x="517.0" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Bomba H⁺/K⁺ parietal</tspan></text><line x1="725.5" y1="549.5" x2="744.5" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,544.5 743.5,554.5 751.5,549.5" fill="#0f766e"/><rect x="755.5" y="529.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="553.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">IBP la bloquea</tspan></text><text x="40.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="622.0" width="351.0" height="272.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="632.0" width="179.9" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="646.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="309"><tspan x="61.0" dy="0">CÉLULA PARIETAL (ESQUEMA)</tspan></text><g transform="translate(54.0,660.0) scale(0.95)"><path d="M60 30 L280 30 L300 190 L40 190 Z" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" stroke-linejoin="round" /><circle cx="170" cy="140" r="24" fill="#c7d2fe" stroke="#3730a3" stroke-width="1.5" /><text x="170" y="1