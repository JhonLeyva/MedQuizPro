<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1087" viewBox="0 0 1000 1087" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cáncer gástrico: la invasión hasta la serosa (T4a) es lo que más pesa"><title>Cáncer gástrico: la invasión hasta la serosa (T4a) es lo que más pesa</title><rect x="0.75" y="0.75" width="998.5" height="1085.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cáncer gástrico · estadificación TNM</tspan></text><rect x="418.1" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="468.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="468.7" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estadificación del cáncer gástrico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La T (profundidad en la pared) es el factor que más pesa en el pronóstico.</tspan><tspan x="58.0" dy="17">Más profundidad = más riesgo de ganglios y de siembra peritoneal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 55 años, gastrectomía subtotal</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Borrmann III de 4,5 cm, invade hasta la serosa (T4a).</tspan><tspan x="640.0" dy="16">Ganglios 2/20 (N1), borde libre, metaplasia intestinal</tspan><tspan x="640.0" dy="16">vecina.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HASTA DÓNDE LLEGA EL TUMOR EN LA PARED</tspan></text><rect x="40.0" y="285.0" width="440.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="144.2" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">PARED DEL ESTÓMAGO</tspan></text><g transform="translate(72.0,329.0) scale(1.15)"><rect x="20" y="30" width="170" height="30" fill="#f9a8d4" stroke="#ffffff" stroke-width="1"/><text x="200" y="49.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Mucosa</text><text x="200" y="49.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Mucosa</text><rect x="20" y="60" width="170" height="8" fill="#f472b6" stroke="#ffffff" stroke-width="1"/><text x="200" y="68.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Muscular de la mucosa</text><text x="200" y="68.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Muscular de la mucosa</text><rect x="20" y="68" width="170" height="36" fill="#fde68a" stroke="#ffffff" stroke-width="1"/><text x="200" y="90.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Submucosa</text><text x="200" y="90.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Submucosa</text><rect x="20" y="104" width="170" height="52" fill="#fca5a5" stroke="#ffffff" stroke-width="1"/><text x="200" y="134.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Muscular propia</text><text x="200" y="134.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Muscular propia</text><rect x="20" y="156" width="170" height="20" fill="#fef3c7" stroke="#ffffff" stroke-width="1"/><text x="200" y="170.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Subserosa</text><text x="200" y="170.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Subserosa</text><rect x="20" y="176" width="170" height="10" fill="#a7f3d0" stroke="#ffffff" stroke-width="1"/><text x="200" y="185.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Serosa</text><text x="200" y="185.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Serosa</text><text x="20" y="22" font-size="10" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">Luz del órgano</text><path d="M64 26 C60 60 70 176 98 186 C124 180 138 60 132 26 Z" fill="#ea580c" stroke="#9a3412" stroke-width="2" stroke-linejoin="round" opacity="0.9"/><text x="138" y="22" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Tumor</text><text x="138" y="22" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">Tumor</text><line x1="16" y1="32" x2="16" y2="58" stroke="#0f766e" stroke-width="3"/><text x="12" y="49.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T1a</text><text x="12" y="49.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T1a</text><line x1="16" y1="70" x2="16" y2="102" stroke="#0f766e" stroke-width="3"/><text x="12" y="90.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T1b</text><text x="12" y="90.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T1b</text><line x1="16" y1="106" x2="16" y2="154" stroke="#0f766e" stroke-width="3"/><text x="12" y="134.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T2</text><text x="12" y="134.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T2</text><line x1="16" y1="158" x2="16" y2="174" stroke="#0f766e" stroke-width="3"/><text x="12" y="170.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T3</text><text x="12" y="170.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T3</text><line x1="16" y1="178" x2="16" y2="184" stroke="#0f766e" stroke-width="3"/><text x="12" y="185.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T4a</text><text x="12" y="185.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T4a</text></g><rect x="48.0" y="652.0" width="424.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="260.0" y="673.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="410"><tspan x="260.0" dy="0">El tumor (naranja) atraviesa todas las capas y llega a la serosa: T4a.</tspan></text><rect x="500.0" y="285.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="286.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="309.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">1. T1a</tspan></text><text x="518.0" y="330.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Mucosa.</tspan></text><rect x="500.0" y="364.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="365.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="388.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">2. T1b</tspan></text><text x="518.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Submucosa.</tspan></text><rect x="500.0" y="443.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="444.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">3. T2</tspan></text><text x="518.0" y="488.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Muscular propia.</tspan></text><rect x="500.0" y="522.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="523.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="546.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">4. T3</tspan></text><text x="518.0" y="567.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Subserosa.</tspan></text><rect x="500.0" y="601.0" width="460.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="501.0" y="602.0" width="6.0" height="67.0" rx="3" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="518.0" y="625.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">5. T4a</tspan></text><text x="518.0" y="646.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Serosa: este caso; riesgo de siembra peritoneal.</tspan></text><rect x="860.2" y="590.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="605.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="699.0" width="920.0" height="78.0" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="60.0" y="725.0" font-size="13" font-weight="800" font-style="normal" fill="#92400e" text-anchor="start" data-max="700"><tspan x="60.0" dy="0">Por qué la T manda</tspan></text><text x="60.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#78350f" text-anchor="start" data-max="700"><tspan x="60.0" dy="0">Cada capa que atraviesa el tumor aumenta el riesgo de ganglios y de metástasis peritoneales.</tspan><tspan x="60.0" dy="16">Con T4a y N1 se indica quimioterapia (idealmente perioperatoria) además de la cirugía.</tspan></text><text x="40.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="827.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="849.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Metaplasia intestinal</tspan></text><text x="491.2" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Localización en cuerpo</tspan></text><rect x="588.0" y="830.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Invasión hasta serosa</tspan></text><text x="866.2" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Tamaño &gt; 4 cm</tspan></text><rect x="40.0" y="864.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="864.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="885.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cambia el estadio</tspan><tspan x="54.0" dy="16">TNM?</tspan></text><text x="303.8" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="893.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí: T4a</tspan></text><text x="866.2" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="827.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="938.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="966.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="988.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• T4a (serosa) = enfermedad localmente avanzada: peor pronóstico e indicación de adyuvancia.</tspan><tspan x="58.0" dy="18">• El tamaño, la localización y la metaplasia vecina no cambian el estadio.</tspan><tspan x="58.0" dy="18">• Lo ideal en T ≥ 2 o N+ es la quimioterapia perioperatoria (FLOT).</tspan></text><text x="58.0" y="1046.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AJCC 8.ª ed.; NCCN, cáncer gástrico (2024).</tspan></text></svg>