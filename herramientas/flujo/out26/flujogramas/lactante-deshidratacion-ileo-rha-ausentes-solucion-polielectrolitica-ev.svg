<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1369" viewBox="0 0 1000 1369" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante deshidratado con íleo: solución polielectrolítica por vía EV"><title>Lactante deshidratado con íleo: solución polielectrolítica por vía EV</title><rect x="0.75" y="0.75" width="998.5" height="1367.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedad diarreica aguda · planes de hidratación</tspan></text><rect x="504.9" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="561.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="561.4" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rehidratación en la diarrea</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Plan A sin deshidratación, plan B con deshidratación (SRO), plan C con shock.</tspan><tspan x="58.0" dy="17">Si el intestino no funciona (íleo), la vía digestiva no sirve: se hidrata por vena.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pedro, 11 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">2 días de heces líquidas y 2 vómitos; irritable.</tspan><tspan x="640.0" dy="16">Mucosas secas, pocas lágrimas, pliegue &gt; 2 s;</tspan><tspan x="640.0" dy="16">abdomen distendido, doloroso, sin ruidos.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="422.2" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="271.0" x2="422.2" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,299.0 427.2,299.0 422.2,307.0" fill="#94a3b8"/><line x1="422.2" y1="365.0" x2="422.2" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="655.7" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="188.7" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,423.0 193.7,423.0 188.7,431.0" fill="#94a3b8"/><line x1="655.7" y1="395.0" x2="655.7" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,423.0 660.7,423.0 655.7,431.0" fill="#94a3b8"/><line x1="655.7" y1="489.0" x2="655.7" y2="534.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="534.5" x2="811.3" y2="534.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="534.5" x2="500.0" y2="563.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,562.5 505.0,562.5 500.0,570.5" fill="#94a3b8"/><line x1="811.3" y1="534.5" x2="811.3" y2="563.5" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,562.5 816.3,562.5 811.3,570.5" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="422.2" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="271.0" x2="422.2" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,299.0 427.2,299.0 422.2,307.0" fill="#0f766e"/><line x1="422.2" y1="365.0" x2="422.2" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="395.0" x2="655.7" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="395.0" x2="655.7" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,423.0 660.7,423.0 655.7,431.0" fill="#0f766e"/><line x1="655.7" y1="489.0" x2="655.7" y2="534.5" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="534.5" x2="811.3" y2="534.5" stroke="#0f766e" stroke-width="3"/><line x1="811.3" y1="534.5" x2="811.3" y2="563.5" stroke="#0f766e" stroke-width="3"/><polygon points="806.3,562.5 816.3,562.5 811.3,570.5" fill="#0f766e"/><rect x="174.5" y="404.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">No</tspan></text><rect x="643.6" y="404.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="655.7" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="655.7" dy="0">Sí</tspan></text><rect x="487.9" y="543.5" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="556.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Sí</tspan></text><rect x="784.7" y="543.5" width="53.2" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="811.3" y="556.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No: íleo</tspan></text><polygon points="162.2,336.0 188.2,307.0 656.2,307.0 682.2,336.0 656.2,365.0 188.2,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">¿Tiene signos de deshidratación?</tspan></text><rect x="40.0" y="431.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Plan A: en casa</tspan></text><text x="188.7" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">SRO después de cada deposición</tspan></text><polygon points="395.7,460.0 421.7,431.0 889.7,431.0 915.7,460.0 889.7,489.0 421.7,489.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="441.7" cy="460.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="465.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="464.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">¿Puede usarse el intestino (sin íleo ni shock)?</tspan></text><rect x="351.3" y="570.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="598.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Plan B: SRO</tspan></text><text x="500.0" y="621.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">75 mL/kg en 4 h en el establecimiento</tspan><tspan x="500.0" dy="17">Si vomita mucho: gastroclisis</tspan></text><rect x="662.7" y="570.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="811.3" y="598.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">SPE POR VÍA EV</tspan></text><text x="811.3" y="621.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Solución polielectrolítica</tspan><tspan x="811.3" dy="17">Luego SRO al volver el tránsito</tspan></text><text x="40.0" y="700.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="712.9" width="278.0" height="362.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="722.9" width="149.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="736.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="236"><tspan x="61.0" dy="0">EL LACTANTE DEL CASO</tspan></text><g data-box="54.0 750.9 250.0 300.0"><g transform="translate(84.0,750.9) scale(0.9)"><path d="M76 128 C72 110 168 110 164 128 L172 222 C160 248 80 248 68 222 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M72 180 H168 L172 222 C160 248 80 248 68 222 Z" fill="#fed7aa" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M76 132 L40 170 L52 184 L82 156 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M164 132 L200 170 L188 184 L158 156 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="44" cy="182" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="196" cy="182" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M84 236 L70 300 L94 304 L108 244 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156 236 L170 300 L146 304 L132 244 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="80" cy="308" rx="14" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><ellipse cx="160" cy="308" rx="14" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="120" cy="70" r="54" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="100" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><circle cx="140" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><path d="M110 96 Q120 102 130 96" fill="none" stroke="#9a6b52" stroke-width="2"/><path d="M116 76 Q120 86 124 76" fill="none" stroke="#9a6b52" stroke-width="2" stroke-linejoin="round" /><circle cx="120" cy="214" r="3" fill="#9a6b52" stroke="none" stroke-width="0" /><circle cx="150" cy="92" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="96" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="120" cy="200" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="120" y="204" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><circle cx="156" cy="228" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="156" y="232" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text></g></g><rect x="340.0" y="712.9" width="620.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="728.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="732.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">1</tspan></text><text x="376.0" y="732.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Mucosas secas y pocas lágrimas: deshidratado.</tspan></text><rect x="340.0" y="750.9" width="620.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="358.0" cy="766.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="770.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">2</tspan></text><text x="376.0" y="770.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Abdomen distendido, sin ruidos: íleo.</tspan></text><rect x="340.0" y="788.9" width="620.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="804.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="808.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">3</tspan></text><text x="376.0" y="808.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Pliegue que vuelve en más de 2 segundos.</tspan></text><text x="40.0" y="1114.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1124.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1147.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1127.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="1147.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">SPE por vía EV</tspan></text><text x="491.2" y="1147.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Suero fisiológico EV</tspan></text><text x="678.8" y="1147.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Dextrosa 5 % EV</tspan></text><text x="866.2" y="1147.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">SRO por gastroclisis</tspan></text><rect x="40.0" y="1161.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1161.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1182.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1182.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Ninguno</tspan></text><text x="491.2" y="1182.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No aporta potasio ni base</tspan></text><text x="678.8" y="1182.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No repone sodio</tspan></text><text x="866.2" y="1182.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Con íleo no se absorbe</tspan></text><rect x="40.0" y="1124.9" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1219.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1247.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1269.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Deshidratación + íleo (distensión, RHA ausentes): contraindicada la vía oral y la gastroclisis.</tspan><tspan x="58.0" dy="18">• Rehidratar por vía EV con solución polielectrolítica (sodio, potasio, base y glucosa).</tspan><tspan x="58.0" dy="18">• Dextrosa al 5 % sola no repone sodio; volver a SRO cuando regrese el tránsito.</tspan></text><text x="58.0" y="1327.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, guía de enfermedad diarreica aguda en niños; OMS.</tspan></text></svg>