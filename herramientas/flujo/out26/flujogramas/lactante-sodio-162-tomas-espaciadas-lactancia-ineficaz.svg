<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1159" viewBox="0 0 1000 1159" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sodio de 162 en lactante con tomas espaciadas: deshidratación por lactancia ineficaz"><title>Sodio de 162 en lactante con tomas espaciadas: deshidratación por lactancia ineficaz</title><rect x="0.75" y="0.75" width="998.5" height="1157.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trastornos del sodio · hipernatremia en lactantes</tspan></text><rect x="489.9" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="546.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="546.3" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="168.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipernatremia en el lactante</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Casi siempre por pérdida de agua libre mayor que la de sodio o por poco aporte de agua.</tspan><tspan x="58.0" dy="17">La lactancia ineficaz es una causa frecuente y prevenible.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="168.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="166.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 4 meses con leche materna</tspan><tspan x="640.0" dy="17">exclusiva</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tomas muy espaciadas; 24 h de vómitos, somnolencia,</tspan><tspan x="640.0" dy="16">mucosas secas.</tspan><tspan x="640.0" dy="16">Pliegue (+); sodio 162 mEq/L, glucosa normal.</tspan></text><rect x="640.0" y="229.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="242.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="242.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="290.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL SODIO ALTO A LA CAUSA</tspan></text><text x="614.0" y="314.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,326.0 580.0,326.0 531.7,402.0 88.3,402.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="342.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="374.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Lactante con sodio de 162 mEq/L y deshidratación</tspan></text><line x1="559.8" y1="364.0" x2="606.0" y2="364.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="335.0" width="129.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="679.0" y="352.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="679.0" dy="0">Hiperaldosteronismo</tspan></text><rect x="749.9" y="335.0" width="150.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="825.4" y="352.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="825.4" dy="0">Diabetes insípida central</tspan></text><rect x="614.0" y="367.0" width="177.1" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="702.5" y="384.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="702.5" dy="0">Diabetes insípida nefrogénica</tspan></text><rect x="797.1" y="367.0" width="115.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="854.8" y="384.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="854.8" dy="0">Lactancia ineficaz</tspan></text><polygon points="88.3,406.0 531.7,406.0 483.3,462.0 136.7,462.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="434.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="438.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="438.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Hipertensión e hipopotasemia?</tspan></text><line x1="511.5" y1="434.0" x2="606.0" y2="434.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="421.0" width="142.0" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="685.0" y="438.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="685.0" dy="0">✕ Hiperaldosteronismo</tspan></text><line x1="636.0" y1="434.5" x2="746.0" y2="434.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,466.0 483.3,466.0 435.0,542.0 185.0,542.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="504.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="508.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="500.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Poliuria con orina diluida</tspan><tspan x="320.0" dy="17">desde antes?</tspan></text><line x1="463.2" y1="504.0" x2="606.0" y2="504.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="475.0" width="163.0" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="695.5" y="492.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="695.5" dy="0">✕ Diabetes insípida central</tspan></text><line x1="636.0" y1="488.5" x2="767.0" y2="488.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="614.0" y="507.0" width="189.2" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="708.6" y="524.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="708.6" dy="0">✕ Diabetes insípida nefrogénica</tspan></text><line x1="636.0" y1="520.5" x2="793.2" y2="520.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="546.0" x2="310.0" y2="565.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,564.0 315.0,564.0 310.0,572.0" fill="#0f766e"/><rect x="140.0" y="576.0" width="340.0" height="74.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="605.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Lactancia materna ineficaz</tspan></text><text x="310.0" y="629.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Poco aporte de agua libre con tomas espaciadas</tspan></text><rect x="370.6" y="565.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="580.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="575.4" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="595.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="613.4" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">No hay poliuria ni hipertensión: el bebé recibe poca leche</tspan><tspan x="628.0" dy="16">y pierde agua con los vómitos.</tspan></text><text x="40.0" y="690.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="702.9" width="358.0" height="162.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="712.9" width="154.7" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="726.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="316"><tspan x="61.0" dy="0">LABORATORIO DEL CASO</tspan></text><g transform="translate(54.0,740.9) scale(1.0)"><text x="118" y="12" font-size="10" font-weight="700" fill="#64748b" text-anchor="start" data-max="0">Sodio sérico (mEq/L)</text><text x="110" y="39" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end" data-max="0">Sodio</text><rect x="118" y="24" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="24" width="192.5" height="22" rx="4" fill="#ea580c"/><text x="304.49411764705883" y="39" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="end" data-max="0">162 mEq/L</text><text x="110" y="73" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Límite normal</text><rect x="118" y="58" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="58" width="172.3" height="22" rx="4" fill="#94a3b8"/><text x="284.2941176470588" y="73" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="end" data-max="0">145</text></g><rect x="420.0" y="702.9" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="720.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="724.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">1</tspan></text><text x="458.0" y="724.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Sodio de 162: hipernatremia marcada.</tspan></text><rect x="420.0" y="733.9" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="751.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="755.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">2</tspan></text><text x="458.0" y="755.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">La deshidratación hipertónica engaña: el pliegue se nota menos.</tspan></text><rect x="420.0" y="764.9" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="782.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="786.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">3</tspan></text><text x="458.0" y="786.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Corregir en 48 h.</tspan></text><text x="40.0" y="904.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="914.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="937.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="937.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Hiperaldosteronismo</tspan></text><rect x="400.5" y="917.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="937.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Lactancia ineficaz</tspan></text><text x="678.8" y="937.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">DI nefrogénica</tspan></text><text x="866.2" y="937.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">DI central</tspan></text><rect x="40.0" y="951.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="951.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="972.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="303.8" y="972.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: sin HTA ni hipopotasemia</tspan></text><text x="491.2" y="972.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="972.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: sin poliuria previa</tspan></text><text x="866.2" y="972.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: sin poliuria</tspan></text><rect x="40.0" y="914.9" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1009.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1037.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1059.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hipernatremia + deshidratación + tomas espaciadas = lactancia materna ineficaz.</tspan><tspan x="58.0" dy="18">• Corregir despacio: bajar el sodio ≤ 10-12 mEq/L en 24 h para evitar edema cerebral.</tspan><tspan x="58.0" dy="18">• Revisar la técnica de lactancia y la frecuencia de tomas.</tspan></text><text x="58.0" y="1117.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); AAP, lactancia materna.</tspan></text></svg>