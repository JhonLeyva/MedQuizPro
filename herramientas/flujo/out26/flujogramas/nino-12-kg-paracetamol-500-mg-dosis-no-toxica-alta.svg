="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">41,7</text><text x="186" y="270.64" font-size="11" font-weight="800" fill="#15803d" text-anchor="start" data-max="0">41,7</text><text x="164" y="316" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">mg/kg</text><text x="164" y="316" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">mg/kg</text></g><g transform="translate(62.0,445.0) scale(0.42)"><circle cx="110" cy="56" r="42" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="95" cy="52" r="3.5" fill="#334155" stroke="none" stroke-width="0" /><circle cx="125" cy="52" r="3.5" fill="#334155" stroke="none" stroke-width="0" /><path d="M100 74 Q110 80 120 74" fill="none" stroke="#9a6b52" stroke-width="2"/><rect x="102" y="96" width="16" height="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><path d="M74.0 106 H146.0 L150.0 170 H70.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70.0 170 H150.0 C154 206 148.0 222 144.0 232 H76.0 C72.0 222 66 206 70.0 170 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M74.0 110 L50.0 120 L40.0 214 L56.0 216 L70.0 150 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M146.0 110 L170.0 120 L180.0 214 L164.0 216 L150.0 150 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="48.0" cy="224" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="172.0" cy="224" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M80 232 H106 L104 364 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M114 232 H140 L136 364 H116 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="92" cy="370" rx="14" ry="6" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><ellipse cx="128" cy="370" rx="14" ry="6" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /></g><g transform="translate(56.0,325.0) scale(1.0)"><text x="52" y="290" font-size="12" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">12 kg</text><text x="52" y="290" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">12 kg</text><text x="109" y="352" font-size="12" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">500 ÷ 12 = 41,7 mg/kg</text><text x="109" y="352" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle" data-max="0">500 ÷ 12 = 41,7 mg/kg</text></g></g><rect x="48.0" y="707.0" width="234.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="165.0" y="728.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="220"><tspan x="165.0" dy="0">En verde la dosis del niño; en rojo, la</tspan><tspan x="165.0" dy="15">zona tóxica.</tspan></text><circle cx="326.0" cy="307.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="312.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">1</tspan></text><rect x="350.0" y="285.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="286.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="309.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Peso del niño</tspan></text><text x="368.0" y="330.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">12 kg.</tspan></text><circle cx="326.0" cy="388.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="393.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">2</tspan></text><rect x="350.0" y="366.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="367.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="390.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Dosis ingerida</tspan></text><text x="368.0" y="411.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">1 tableta = 500 mg, una sola vez.</tspan></text><circle cx="326.0" cy="469.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="474.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">3</tspan></text><rect x="350.0" y="447.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="448.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="471.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Dosis por kilo</tspan></text><text x="368.0" y="492.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">500 ÷ 12 = 41,7 mg/kg.</tspan></text><circle cx="326.0" cy="550.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="555.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">4</tspan></text><rect x="350.0" y="528.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="529.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="552.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Umbral tóxico</tspan></text><text x="368.0" y="573.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">≥ 150-200 mg/kg (≥ 1800-2400 mg en 12 kg).</tspan></text><circle cx="326.0" cy="631.0" r="14" fill="#0f766e" stroke="none" stroke-width="0"/><text x="326.0" y="636.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">5</tspan></text><rect x="350.0" y="609.0" width="610.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="351.0" y="610.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="368.0" y="633.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Resultado</tspan></text><text x="368.0" y="654.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">No tóxica: tranquilizar, alta y consejería.</tspan></text><rect x="860.2" y="598.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="613.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="799.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="809.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="831.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="812.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Tranquilizar y alta</tspan></text><text x="491.2" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Carbón activado</tspan></text><text x="678.8" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">N-acetilcisteína</tspan></text><text x="866.2" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Bicarbonato</tspan></text><rect x="40.0" y="846.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="846.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="867.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicado?</tspan></text><text x="303.8" y="867.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: dosis no tóxica</tspan></text><text x="678.8" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: dosis no tóxica</tspan></text><text x="866.2" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Nunca en esta intoxicación</tspan></text><rect x="40.0" y="809.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="904.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="932.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="954.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• 500 mg ÷ 12 kg = 41,7 mg/kg: muy por debajo del umbral tóxico.</tspan><tspan x="58.0" dy="18">• No necesita carbón activado ni N-acetilcisteína: tranquilizar, dar de alta y aconsejar guardar los medicamentos.</tspan><tspan x="58.0" dy="18">• Si la dosis fuera ≥ 150-200 mg/kg: nivel sérico a las 4 h y nomograma para decidir la N-acetilcisteína.</tspan></text><text x="58.0" y="1012.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); AAP y centros de toxicología, ingesta pediátrica de paracetamol.</tspan></text></svg>