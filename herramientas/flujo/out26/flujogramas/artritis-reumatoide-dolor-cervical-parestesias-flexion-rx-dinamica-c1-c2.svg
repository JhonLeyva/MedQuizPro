<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1277" viewBox="0 0 1000 1277" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Artritis reumatoide con dolor cervical y parestesias al flexionar: Rx dinámica en flexión y extensión"><title>Artritis reumatoide con dolor cervical y parestesias al flexionar: Rx dinámica en flexión y extensión</title><rect x="0.75" y="0.75" width="998.5" height="1275.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Columna · inestabilidad atlantoaxial</tspan></text><rect x="411.9" y="32.0" width="150.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="134"><tspan x="487.0" dy="0">TRAUMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Subluxación atlantoaxial en la AR</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La sinovitis erosiona el ligamento transverso y la odontoides.</tspan><tspan x="58.0" dy="17">El atlas se desliza en flexión y puede comprimir la médula.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 55 años con AR erosiva de 12 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">6 meses de dolor y rigidez cervical; parestesias en</tspan><tspan x="640.0" dy="16">manos al flexionar el cuello.</tspan><tspan x="640.0" dy="16">Sin déficit; reflejos algo vivos en las cuatro</tspan><tspan x="640.0" dy="16">extremidades.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="422.2" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="287.0" x2="422.2" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,315.0 427.2,315.0 422.2,323.0" fill="#94a3b8"/><line x1="422.2" y1="381.0" x2="422.2" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="411.0" x2="655.7" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="411.0" x2="188.7" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,439.0 193.7,439.0 188.7,447.0" fill="#94a3b8"/><line x1="655.7" y1="411.0" x2="655.7" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,439.0 660.7,439.0 655.7,447.0" fill="#94a3b8"/><line x1="655.7" y1="505.0" x2="655.7" y2="550.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="550.5" x2="811.3" y2="550.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="550.5" x2="500.0" y2="579.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,578.5 505.0,578.5 500.0,586.5" fill="#94a3b8"/><line x1="811.3" y1="550.5" x2="811.3" y2="579.5" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,578.5 816.3,578.5 811.3,586.5" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="422.2" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="287.0" x2="422.2" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,315.0 427.2,315.0 422.2,323.0" fill="#0f766e"/><line x1="422.2" y1="381.0" x2="422.2" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="411.0" x2="655.7" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="411.0" x2="655.7" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,439.0 660.7,439.0 655.7,447.0" fill="#0f766e"/><line x1="655.7" y1="505.0" x2="655.7" y2="550.5" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="550.5" x2="811.3" y2="550.5" stroke="#0f766e" stroke-width="3"/><line x1="811.3" y1="550.5" x2="811.3" y2="579.5" stroke="#0f766e" stroke-width="3"/><polygon points="806.3,578.5 816.3,578.5 811.3,586.5" fill="#0f766e"/><rect x="174.5" y="420.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">No</tspan></text><rect x="643.6" y="420.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="655.7" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="655.7" dy="0">Sí</tspan></text><rect x="487.9" y="559.5" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="572.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Sí</tspan></text><rect x="752.0" y="559.5" width="118.7" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="811.3" y="572.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No: solo parestesias</tspan></text><polygon points="162.2,352.0 188.2,323.0 656.2,323.0 682.2,352.0 656.2,381.0 188.2,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">¿AR de larga data con dolor cervical o síntomas al flexionar?</tspan></text><rect x="40.0" y="447.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Control habitual</tspan></text><text x="188.7" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Examen neurológico en cada visita</tspan></text><polygon points="395.7,476.0 421.7,447.0 889.7,447.0 915.7,476.0 889.7,505.0 421.7,505.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="441.7" cy="476.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="481.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="480.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">¿Déficit neurológico franco?</tspan></text><rect x="351.3" y="586.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="623.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">RM cervical urgente</tspan></text><text x="500.0" y="646.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Y cirujano de columna</tspan></text><rect x="662.7" y="586.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="811.3" y="614.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">RX DINÁMICA FLEXIÓN-EXTENSIÓN</tspan></text><text x="811.3" y="637.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Mide el espacio atlas-odontoides</tspan><tspan x="811.3" dy="17">&gt; 3 mm: inestable → RM</tspan></text><text x="40.0" y="716.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="728.9" width="373.0" height="254.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="738.9" width="171.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="752.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="331"><tspan x="61.0" dy="0">C1-C2 DE PERFIL (ESQUEMA)</tspan></text><g data-box="54.0 766.9 345.0 192.0"><g transform="translate(54.0,766.9) scale(0.95)"><g transform="translate(0,0)"><rect x="40" y="100" width="70" height="70" rx="8" fill="#e7e5e4" stroke="#78716c" stroke-width="2"/><path d="M66 100 L66 40 C66 26 86 26 86 40 L86 100 Z" fill="#e7e5e4" stroke="#78716c" stroke-width="2" stroke-linejoin="round" /><g transform="translate(0,0)"><rect x="18" y="44" width="34" height="26" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="96" y="44" width="34" height="26" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/></g><path d="M94 34 L94 80" fill="none" stroke="#0f172a" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 3"/></g><g transform="translate(190,0)"><rect x="40" y="100" width="70" height="70" rx="8" fill="#e7e5e4" stroke="#78716c" stroke-width="2"/><path d="M66 100 L66 40 C66 26 86 26 86 40 L86 100 Z" fill="#e7e5e4" stroke="#78716c" stroke-width="2" stroke-linejoin="round" /><g transform="translate(-22,0)"><rect x="18" y="44" width="34" height="26" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="96" y="44" width="34" height="26" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/></g><path d="M72 34 L72 80" fill="none" stroke="#0f172a" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 3"/></g><text x="85" y="190" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">extensión: normal</text><text x="85" y="190" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">extensión: normal</text><text x="275" y="190" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">flexión: C1 se desliza</text><text x="275" y="190" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">flexión: C1 se desliza</text><text x="85" y="24" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">C1 (atlas)</text><text x="85" y="24" font-size="10" font-weight="800" fill="#1d4ed8" text-anchor="middle" data-max="0">C1 (atlas)</text><text x="85" y="132" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">C2</text><text x="85" y="132" font-size="10.5" font-weight="800" fill="#57534e" text-anchor="middle" data-max="0">C2</text><text x="275" y="132" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">C2</text><text x="275" y="132" font-size="10.5" font-weight="800" fill="#57534e" text-anchor="middle" data-max="0">C2</text><line x1="250" y1="58" x2="276" y2="58" stroke="#ea580c" stroke-width="3"/><text x="262" y="92" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">espacio &gt; 3 mm</text><text x="262" y="92" font-size="10" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">espacio &gt; 3 mm</text></g></g><rect x="435.0" y="728.9" width="525.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="453.0" cy="744.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="453.0" y="748.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="453.0" dy="0">1</tspan></text><text x="471.0" y="748.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="481"><tspan x="471.0" dy="0">En extensión el atlas está en su sitio.</tspan></text><rect x="435.0" y="766.9" width="525.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="453.0" cy="782.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="453.0" y="786.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="453.0" dy="0">2</tspan></text><text x="471.0" y="786.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="481"><tspan x="471.0" dy="0">En flexión se desliza hacia adelante.</tspan></text><rect x="435.0" y="804.9" width="525.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="453.0" cy="820.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="453.0" y="824.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="453.0" dy="0">3</tspan></text><text x="471.0" y="824.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="481"><tspan x="471.0" dy="0">El espacio que crece comprime la médula.</tspan></text><text x="40.0" y="1022.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1032.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1055.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1055.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Rx lumbar</tspan></text><text x="491.2" y="1055.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">TC sacroilíacas</tspan></text><text x="678.8" y="1055.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">RM dorsal</tspan></text><rect x="775.5" y="1035.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="1055.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Rx cervical dinámica</tspan></text><rect x="40.0" y="1069.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="1069.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1090.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1090.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Otra región</tspan></text><text x="491.2" y="1090.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Otra enfermedad</tspan></text><text x="678.8" y="1090.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Otra región</tspan></text><text x="866.2" y="1090.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Ninguno</tspan></text><rect x="40.0" y="1032.9" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1127.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1155.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1177.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• AR de larga data + síntomas cervicales: Rx dinámica en flexión y extensión (intervalo atlas-odontoides &gt; 3 mm).</tspan><tspan x="58.0" dy="18">• Si hay inestabilidad o mielopatía: RM y evaluación quirúrgica.</tspan><tspan x="58.0" dy="18">• Cuidado al intubar: evitar la hiperextensión del cuello.</tspan></text><text x="58.0" y="1235.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR; Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>