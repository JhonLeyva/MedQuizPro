<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1226" viewBox="0 0 1000 1226" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dolor generalizado con fatiga, sueño no reparador y alodinia: fibromialgia, amitriptilina nocturna"><title>Dolor generalizado con fatiga, sueño no reparador y alodinia: fibromialgia, amitriptilina nocturna</title><rect x="0.75" y="0.75" width="998.5" height="1224.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reumatología · dolor crónico</tspan></text><rect x="372.9" y="32.0" width="242.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="494.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="226"><tspan x="494.1" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fibromialgia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dolor crónico generalizado por alteración del procesamiento del dolor (sensibilización</tspan><tspan x="58.0" dy="17">central).</tspan><tspan x="58.0" dy="17">Fatiga, sueño no reparador, problemas de concentración; exámenes normales.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 35 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">18 meses de dolor generalizado, fatiga y sueño no</tspan><tspan x="640.0" dy="16">reparador; estrés por violencia conyugal.</tspan><tspan x="640.0" dy="16">AINE sin efecto; alodinia y dolor difuso, sin artritis;</tspan><tspan x="640.0" dy="16">laboratorio normal.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PUNTOS DOLOROSOS Y ESCALERA DE TRATAMIENTO</tspan></text><rect x="40.0" y="301.0" width="920.0" height="338.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="199.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">PUNTOS DOLOROSOS (ESQUEMA)</tspan></text><g transform="translate(424.0,339.0) scale(0.56)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><circle cx="96" cy="84" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="144" cy="84" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="84" cy="104" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="156" cy="104" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="104" cy="128" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="136" cy="128" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="60" cy="160" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="180" cy="160" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="90" cy="262" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="150" cy="262" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="98" cy="330" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><circle cx="142" cy="330" r="5" fill="#ea580c" stroke="#7c2d12" stroke-width="1" /><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><text x="54.0" y="605.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="892"><tspan x="54.0" dy="0">Dolor difuso a la palpación en muchos puntos del cuerpo, sin articulaciones inflamadas.</tspan></text><text x="40.0" y="673.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="290"><tspan x="40.0" dy="0">¿QUÉ TIENE?</tspan></text><rect x="40.0" y="685.0" width="290.0" height="30.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="56.0" cy="700.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="56.0" y="704.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">!</tspan></text><text x="74.0" y="704.0" font-size="11.5" font-weight="600" font-style="normal" fill="#9f1239" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Dolor generalizado &gt; 3 meses</tspan></text><rect x="40.0" y="721.0" width="290.0" height="30.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="56.0" cy="736.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="56.0" y="740.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">!</tspan></text><text x="74.0" y="740.0" font-size="11.5" font-weight="600" font-style="normal" fill="#9f1239" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Fatiga y sueño no reparador</tspan></text><rect x="40.0" y="757.0" width="290.0" height="30.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="56.0" cy="772.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="56.0" y="776.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">!</tspan></text><text x="74.0" y="776.0" font-size="11.5" font-weight="600" font-style="normal" fill="#9f1239" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Exámenes normales; AINE sin efecto</tspan></text><rect x="40.0" y="797.0" width="290.0" height="35.0" rx="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="185.0" y="815.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="266"><tspan x="185.0" dy="0">FIBROMIALGIA: medidas base + fármaco</tspan></text><rect x="390.0" y="789.0" width="174.0" height="93.0" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="410.0" cy="809.0" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="410.0" y="814.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="410.0" dy="0">1</tspan></text><text x="400.0" y="841.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="400.0" dy="0">Educación y ejercicio</tspan></text><text x="400.0" y="861.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="154"><tspan x="400.0" dy="0">Terapia cognitivo-conductual.</tspan></text><line x1="567.0" y1="864.0" x2="578.0" y2="864.0" stroke="#94a3b8" stroke-width="2"/><polygon points="577.0,859.0 577.0,869.0 585.0,864.0" fill="#94a3b8"/><rect x="588.0" y="755.0" width="174.0" height="127.0" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="1.8"/><circle cx="608.0" cy="775.0" r="12" fill="#ffffff" stroke="none" stroke-width="0"/><text x="608.0" y="780.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="608.0" dy="0">2</tspan></text><text x="598.0" y="807.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="598.0" dy="0">Amitriptilina nocturna</tspan></text><text x="598.0" y="827.0" font-size="11" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="154"><tspan x="598.0" dy="0">10-25 mg en la noche.</tspan></text><line x1="765.0" y1="864.0" x2="776.0" y2="864.0" stroke="#94a3b8" stroke-width="2"/><polygon points="775.0,859.0 775.0,869.0 783.0,864.0" fill="#94a3b8"/><rect x="629.6" y="871.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="675.0" y="886.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="675.0" dy="0">◆ ESTE CASO</tspan></text><rect x="786.0" y="721.0" width="174.0" height="161.0" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="806.0" cy="741.0" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="806.0" y="746.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="806.0" dy="0">3</tspan></text><text x="796.0" y="773.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="796.0" dy="0">Duloxetina o pregabalina</tspan></text><text x="796.0" y="793.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="154"><tspan x="796.0" dy="0">Si no mejora.</tspan></text><path d="M330.0 814.5 H368.0 V691.0 H622.0 V745.0" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round"/><polygon points="615.0,743.0 629.0,743.0 622.0,754.0" fill="#ea580c"/><text x="506.0" y="683.0" font-size="11" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="232"><tspan x="506.0" dy="0">Primer fármaco</tspan></text><text x="392.0" y="912.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="570"><tspan x="392.0" dy="0">Siempre se empieza por educación y ejercicio; el fármaco se suma.</tspan></text><text x="392.0" y="928.0" font-size="11" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="start" data-max="570"><tspan x="392.0" dy="0">Este caso: AINE sin efecto → amitriptilina en dosis baja por la noche.</tspan></text><text x="40.0" y="972.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="982.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1004.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Etoricoxib</tspan></text><text x="491.2" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Morfina</tspan></text><rect x="588.0" y="985.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Amitriptilina nocturna</tspan></text><text x="866.2" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Tramadol + paracetamol</tspan></text><rect x="40.0" y="1019.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1019.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1040.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Comentario</tspan></text><text x="303.8" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Los AINE no sirven</tspan></text><text x="491.2" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Opioides: no</tspan></text><text x="678.8" y="1040.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Elección</tspan></text><text x="866.2" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Opioide: no de rutina</tspan></text><rect x="40.0" y="982.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1077.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1105.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1127.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Base: educación, ejercicio aeróbico gradual y terapia cognitivo-conductual; atender la violencia.</tspan><tspan x="58.0" dy="18">• Fármaco de inicio: amitriptilina 10-25 mg en la noche (mejora el sueño y el dolor).</tspan><tspan x="58.0" dy="18">• AINE y opioides no sirven en la fibromialgia; duloxetina o pregabalina son alternativas.</tspan></text><text x="58.0" y="1185.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EULAR, fibromialgia (2016); ACR (2016).</tspan></text></svg>