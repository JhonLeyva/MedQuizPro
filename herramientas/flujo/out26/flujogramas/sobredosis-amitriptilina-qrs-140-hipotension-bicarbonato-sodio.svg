t-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="806.0" dy="0">3</tspan></text><text x="796.0" y="595.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="796.0" dy="0">Arritmias que siguen</tspan></text><text x="796.0" y="615.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="154"><tspan x="796.0" dy="0">Más bicarbonato, lidocaína.</tspan></text><path d="M330.0 636.5 H368.0 V513.0 H622.0 V567.0" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round"/><polygon points="615.0,565.0 629.0,565.0 622.0,576.0" fill="#ea580c"/><text x="506.0" y="505.0" font-size="11" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="232"><tspan x="506.0" dy="0">QRS ancho</tspan></text><text x="392.0" y="734.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="570"><tspan x="392.0" dy="0">Siempre: vía aérea, fluidos y monitoreo.</tspan></text><text x="392.0" y="750.0" font-size="11" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="start" data-max="570"><tspan x="392.0" dy="0">Este caso: QRS 140 ms e hipotensión → bicarbonato de sodio EV.</tspan></text><text x="40.0" y="794.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="804.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="826.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="807.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="826.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Bicarbonato de sodio EV</tspan></text><text x="491.2" y="826.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Fisostigmina</tspan></text><text x="678.8" y="826.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Gluconato de calcio</tspan></text><text x="866.2" y="826.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Anti-H2</tspan></text><rect x="40.0" y="841.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="841.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="862.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Comentario</tspan></text><text x="303.8" y="862.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Elección</tspan></text><text x="491.2" y="862.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Contraindicada</tspan></text><text x="678.8" y="862.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Para hiperpotasemia</tspan></text><text x="866.2" y="862.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No sirve</tspan></text><rect x="40.0" y="804.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="899.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="927.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="949.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• QRS &gt; 100 ms: bicarbonato de sodio 1-2 mEq/kg en bolos hasta pH 7,45-7,55.</tspan><tspan x="58.0" dy="18">• El sodio y la alcalinización revierten el bloqueo de los canales.</tspan><tspan x="58.0" dy="18">• La fisostigmina está contraindicada (asistolia, convulsiones).</tspan></text><text x="58.0" y="1007.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman &amp; Gilman, Bases farmacológicas 14.ª ed. (2023); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>