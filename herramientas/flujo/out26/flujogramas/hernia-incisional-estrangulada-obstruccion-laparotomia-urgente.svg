<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1011" viewBox="0 0 1000 1011" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hernia incisional estrangulada: laparotomía de urgencia"><title>Hernia incisional estrangulada: laparotomía de urgencia</title><rect x="0.75" y="0.75" width="998.5" height="1009.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hernias de la pared abdominal · estrangulación</tspan></text><rect x="478.9" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="529.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="529.5" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hernia estrangulada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El contenido queda atrapado y se corta su irrigación: se necrosa en horas.</tspan><tspan x="58.0" dy="17">Irreductible + dolor intenso + piel roja u obstrucción = operar ya.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 50 años con laparotomía previa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">18 h de dolor constante, vómitos, sin gases ni heces.</tspan><tspan x="640.0" dy="16">Masa tensa, roja e irreductible sobre la cicatriz; RHA</tspan><tspan x="640.0" dy="16">abolidos.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿ESTÁ ESTRANGULADA?</tspan></text><rect x="40.0" y="285.0" width="568.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="438"><tspan x="56.0" dy="0">SIGNOS DE ESTRANGULACIÓN</tspan></text><text x="592.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="592.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="319.0" width="568.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="329.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="344.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="343.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="418"><tspan x="86.0" dy="0">Masa irreductible y tensa</tspan></text><text x="86.0" y="359.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="418"><tspan x="86.0" dy="0">Sobre la cicatriz mediana</tspan></text><text x="592.0" y="343.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="592.0" dy="0">Sí</tspan></text><rect x="40.0" y="365.0" width="568.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="375.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="390.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="389.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="418"><tspan x="86.0" dy="0">Dolor intenso y constante que empeora</tspan></text><text x="86.0" y="405.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="418"><tspan x="86.0" dy="0">18 h, peor en la última hora</tspan></text><text x="592.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="592.0" dy="0">Sí</tspan></text><rect x="40.0" y="411.0" width="568.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="421.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="436.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="435.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="418"><tspan x="86.0" dy="0">Piel roja sobre la hernia</tspan></text><text x="86.0" y="451.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="418"><tspan x="86.0" dy="0">Enrojecimiento</tspan></text><text x="592.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="592.0" dy="0">Sí</tspan></text><rect x="40.0" y="457.0" width="568.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="467.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="482.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="481.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="418"><tspan x="86.0" dy="0">Obstrucción intestinal</tspan></text><text x="86.0" y="497.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="418"><tspan x="86.0" dy="0">Vómitos, sin gases ni heces, RHA abolidos</tspan></text><text x="592.0" y="481.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="592.0" dy="0">Sí</tspan></text><rect x="40.0" y="503.0" width="568.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="513.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="528.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="527.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="418"><tspan x="86.0" dy="0">Fiebre, taquicardia o leucocitosis</tspan></text><text x="86.0" y="543.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="418"><tspan x="86.0" dy="0">No se describen</tspan></text><text x="592.0" y="527.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="592.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="549.0" width="568.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="571.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="536"><tspan x="56.0" dy="0">Cumple 4 de 5 · irreductible + dolor o eritema u obstrucción</tspan></text><text x="56.0" y="591.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="536"><tspan x="56.0" dy="0">Estrangulada: estabilizar y laparotomía exploradora de urgencia</tspan></text><rect x="40.0" y="285.0" width="568.0" height="321.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="628.0" y="285.0" width="332.0" height="311.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="640.0" y="295.0" width="116.7" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="649.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="649.0" dy="0">HERNIA DEL CASO</tspan></text><g transform="translate(642.0,323.0) scale(0.95)"><path d="M40 10 Q160 -4 280 10 L290 220 Q160 236 30 220 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><line x1="160" y1="30" x2="160" y2="200" stroke="#9f1239" stroke-width="2"/><line x1="152" y1="40" x2="168" y2="40" stroke="#9f1239" stroke-width="1.5"/><line x1="152" y1="56" x2="168" y2="56" stroke="#9f1239" stroke-width="1.5"/><line x1="152" y1="72" x2="168" y2="72" stroke="#9f1239" stroke-width="1.5"/><line x1="152" y1="88" x2="168" y2="88" stroke="#9f1239" stroke-width="1.5"/><line x1="152" y1="104" x2="168" y2="104" stroke="#9f1239" stroke-width="1.5"/><line x1="152" y1="120" x2="168" y2="120" stroke="#9f1239" stroke-width="1.5"/><line x1="152" y1="136" x2="168" y2="136" stroke="#9f1239" stroke-width="1.5"/><line x1="152" y1="152" x2="168" y2="152" stroke="#9f1239" stroke-width="1.5"/><line x1="152" y1="168" x2="168" y2="168" stroke="#9f1239" stroke-width="1.5"/><line x1="152" y1="184" x2="168" y2="184" stroke="#9f1239" stroke-width="1.5"/><ellipse cx="160" cy="120" rx="42" ry="34" fill="#fca5a5" stroke="#b91c1c" stroke-width="3" /><ellipse cx="160" cy="120" rx="42" ry="34" fill="#dc2626" stroke="none" stroke-width="0" transform="rotate(opacity="0.25" 160 120)" /><text x="214" y="76" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Masa tensa, roja,</text><text x="214" y="76" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Masa tensa, roja,</text><text x="214" y="90" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">irreductible</text><text x="214" y="90" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">irreductible</text><line x1="212" y1="86" x2="196" y2="104" stroke="#334155" stroke-width="1.3"/><circle cx="196" cy="104" r="2.6" fill="#334155"/><text x="40" y="214" font-size="10" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Cicatriz de laparotomía mediana</text><text x="40" y="214" font-size="10" font-weight="600" fill="#334155" text-anchor="start" data-max="0">Cicatriz de laparotomía mediana</text><rect x="200" y="140" width="110" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1"/><path d="M214 186 C230 150 280 150 296 186" fill="none" stroke="#7e22ce" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M232 178 L232 200 M278 178 L278 200" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" /><text x="255" y="206" font-size="9.5" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">cuello estrecho</text></g><text x="642.0" y="558.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="642.0" dy="0">Recuadro: el asa queda atrapada en el cuello estrecho</tspan><tspan x="642.0" dy="15">del defecto.</tspan></text><text x="40.0" y="638.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="648.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="649.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="672.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Laparoscopía electiva</tspan></text><text x="58.0" y="693.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Es para hernias no complicadas.</tspan></text><rect x="351.3" y="648.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="649.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="672.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Solo SNG y antibióticos</tspan></text><text x="369.3" y="693.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No libera el asa atrapada.</tspan></text><rect x="662.7" y="648.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="649.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="672.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Rx de abdomen primero</tspan></text><text x="680.7" y="693.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No cambia la conducta: retrasa la cirugía.</tspan></text><text x="40.0" y="757.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="767.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="789.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="770.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="789.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Estabilizar + laparotomía</tspan></text><text x="491.2" y="789.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Laparoscopía electiva</tspan></text><text x="678.8" y="789.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">ATB + SNG</tspan></text><text x="866.2" y="789.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Rx de abdomen</tspan></text><rect x="40.0" y="804.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="804.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="825.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Reduce la necrosis?</tspan></text><text x="303.8" y="825.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="825.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: la retrasa</tspan></text><text x="678.8" y="825.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: solo acompaña</tspan></text><text x="866.2" y="825.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="767.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="862.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="890.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="912.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hernia irreductible dolorosa con eritema y obstrucción: estrangulada hasta demostrar lo contrario.</tspan><tspan x="58.0" dy="18">• Reanimar, sonda nasogástrica y antibiótico mientras se prepara la laparotomía urgente.</tspan><tspan x="58.0" dy="18">• Esperar (electiva, solo SNG o más imágenes) aumenta la necrosis y la sepsis.</tspan></text><text x="58.0" y="970.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Schwartz Principios de Cirugía 11.ª ed.; guía de la European Hernia Society.</tspan></text></svg>