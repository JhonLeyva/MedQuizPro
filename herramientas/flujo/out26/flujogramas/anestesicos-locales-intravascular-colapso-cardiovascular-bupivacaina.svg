<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1177" viewBox="0 0 1000 1177" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Anestésico local con más cardiotoxicidad: bupivacaína"><title>Anestésico local con más cardiotoxicidad: bupivacaína</title><rect x="0.75" y="0.75" width="998.5" height="1175.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · anestésicos locales</tspan></text><rect x="408.5" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="487.9" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Toxicidad de los anestésicos locales</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Si pasan a la sangre: síntomas neurológicos y luego cardiovasculares.</tspan><tspan x="58.0" dy="17">Cuanto más liposoluble y más tiempo se une al canal de sodio, más cardiotóxico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál produce las complicaciones cardiovasculares</tspan><tspan x="640.0" dy="16">más graves?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CARDIOTOXICIDAD DE MAYOR A MENOR</tspan></text><rect x="70.0" y="279.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="530.5" width="24.0" height="74.5" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="567.8" x2="130.0" y2="567.8" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="531.5" width="330.0" height="72.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="553.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Bupivacaína</tspan></text><text x="240.0" y="553.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">La más cardiotóxica</tspan></text><text x="144.0" y="574.5" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Se une fuerte al canal</tspan></text><rect x="354.6" y="520.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="535.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="448.0" width="24.0" height="74.5" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="485.2" x2="130.0" y2="485.2" stroke="#f59e0b" stroke-width="2"/><rect x="130.0" y="449.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="471.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Isómero S</tspan></text><text x="240.0" y="471.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Levobupivacaína</tspan></text><text x="144.0" y="492.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Algo menos cardiotóxica</tspan></text><rect x="75.0" y="365.5" width="24.0" height="74.5" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="402.8" x2="130.0" y2="402.8" stroke="#f97316" stroke-width="2"/><rect x="130.0" y="366.5" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="388.5" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Ropivacaína</tspan></text><text x="240.0" y="388.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Menos</tspan></text><text x="144.0" y="409.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Menos liposoluble</tspan></text><rect x="75.0" y="283.0" width="24.0" height="74.5" rx="8" fill="#e11d48" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="320.2" x2="130.0" y2="320.2" stroke="#e11d48" stroke-width="2"/><rect x="130.0" y="284.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="306.0" font-size="12" font-weight="800" font-style="normal" fill="#e11d48" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Lidocaína</tspan></text><text x="240.0" y="306.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">La menos</tspan></text><text x="144.0" y="327.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Se suelta rápido</tspan></text><text x="470.0" y="283.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">SI OCURRE TOXICIDAD</tspan></text><rect x="470.0" y="297.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="339.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="344.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="332.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Detener la inyección</tspan></text><text x="528.0" y="355.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Pedir ayuda</tspan></text><rect x="844.6" y="286.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="301.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><line x1="498.0" y1="383.0" x2="498.0" y2="396.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,395.0 503.0,395.0 498.0,403.0" fill="#0f766e"/><rect x="470.0" y="405.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="447.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="452.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="440.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Emulsión lipídica 20 %</tspan></text><text x="528.0" y="463.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">1,5 mL/kg en bolo</tspan></text><line x1="498.0" y1="491.0" x2="498.0" y2="504.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,503.0 503.0,503.0 498.0,511.0" fill="#0f766e"/><rect x="470.0" y="513.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="555.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="560.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="548.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">RCP prolongada</tspan></text><text x="528.0" y="571.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Puede necesitar soporte circulatorio</tspan></text><text x="40.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="661.0" width="358.0" height="222.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="671.0" width="252.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="685.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="316"><tspan x="61.0" dy="0">BLOQUEO DEL CANAL DE SODIO CARDIACO</tspan></text><g transform="translate(54.0,699.0) scale(1.0)"><text x="118" y="12" font-size="10" font-weight="700" fill="#64748b" text-anchor="start" data-max="0">Riesgo cardiaco relativo</text><text x="110" y="39" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end" data-max="0">Bupivacaína</text><rect x="118" y="24" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="24" width="179.6" height="22" rx="4" fill="#ea580c"/><text x="291.55555555555554" y="39" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="end" data-max="0">muy alto</text><text x="110" y="73" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Levobupivacaína</text><rect x="118" y="58" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="58" width="134.7" height="22" rx="4" fill="#94a3b8"/><text x="258.66666666666663" y="73" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">alto</text><text x="110" y="107" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Ropivacaína</text><rect x="118" y="92" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="92" width="89.8" height="22" rx="4" fill="#94a3b8"/><text x="213.77777777777777" y="107" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">medio</text><text x="110" y="141" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Lidocaína</text><rect x="118" y="126" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="126" width="44.9" height="22" rx="4" fill="#94a3b8"/><text x="168.88888888888889" y="141" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">bajo</text></g><rect x="420.0" y="661.0" width="540.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="438.0" cy="679.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="683.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">1</tspan></text><text x="458.0" y="683.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">La bupivacaína entra rápido y sale lento del canal.</tspan></text><rect x="420.0" y="692.0" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="710.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="714.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">2</tspan></text><text x="458.0" y="714.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">El bloqueo se acumula latido a latido.</tspan></text><rect x="420.0" y="723.0" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="741.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">3</tspan></text><text x="458.0" y="745.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Por eso las arritmias son tan resistentes.</tspan></text><text x="40.0" y="923.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="933.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="955.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="936.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="955.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Bupivacaína</tspan></text><text x="491.2" y="955.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Levobupivacaína</tspan></text><text x="678.8" y="955.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Ropivacaína</tspan></text><text x="866.2" y="955.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Lidocaína</tspan></text><rect x="40.0" y="970.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="970.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="991.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Cardiotoxicidad</tspan></text><text x="303.8" y="991.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">La mayor</tspan></text><text x="491.2" y="991.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Menor</tspan></text><text x="678.8" y="991.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Menor</tspan></text><text x="866.2" y="991.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">La menor</tspan></text><rect x="40.0" y="933.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1028.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1056.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1078.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Bupivacaína: la más cardiotóxica (arritmias y colapso difíciles de revertir).</tspan><tspan x="58.0" dy="18">• Ropivacaína y levobupivacaína son menos cardiotóxicas; la lidocaína es la menos.</tspan><tspan x="58.0" dy="18">• Tratamiento de la toxicidad: emulsión lipídica al 20 % y RCP prolongada.</tspan></text><text x="58.0" y="1136.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman &amp; Gilman, Bases farmacológicas 14.ª ed. (2023); ASRA, toxicidad sistémica (2020).</tspan></text></svg>