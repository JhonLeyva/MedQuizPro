oke-width="0"/><text x="432.0" y="644.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="432.0" dy="0">1</tspan></text><text x="452.0" y="644.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="502"><tspan x="452.0" dy="0">La persona se mueve entre salud y enfermedad.</tspan></text><rect x="414.0" y="653.0" width="546.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="432.0" cy="671.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="432.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="432.0" dy="0">2</tspan></text><text x="452.0" y="675.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="502"><tspan x="452.0" dy="0">No es un punto fijo.</tspan></text><rect x="414.0" y="684.0" width="546.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="432.0" cy="702.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="432.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="432.0" dy="0">3</tspan></text><text x="452.0" y="706.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="502"><tspan x="452.0" dy="0">Influyen lo biológico, lo psicológico y lo social.</tspan></text><text x="40.0" y="859.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="869.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="900.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="900.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Sentirse bien</tspan></text><rect x="400.5" y="872.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="891.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Cambiante y</tspan><tspan x="491.2" dy="17">biopsicosocial</tspan></text><text x="678.8" y="900.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Completo bienestar</tspan></text><text x="866.2" y="900.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Ausencia de enfermedad</tspan></text><rect x="40.0" y="923.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="923.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="944.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Es dinámico?</tspan></text><text x="303.8" y="944.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="944.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="944.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: es un estado</tspan></text><text x="866.2" y="944.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="869.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="981.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1009.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1031.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Proceso cambiante y continuo, resultado de la interacción biológica, psicológica y social con el entorno.</tspan><tspan x="58.0" dy="18">• La definición de la OMS (1948) habla de un «estado» de completo bienestar: es estática.</tspan><tspan x="58.0" dy="18">• «Ausencia de enfermedad» es una visión biomédica reducida.</tspan></text><text x="58.0" y="1089.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS (1948); Engel, modelo biopsicosocial (1977).</tspan></text></svg>