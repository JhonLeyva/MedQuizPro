.2" y="1074.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Prestaciones: este caso</tspan></text><rect x="40.0" y="999.9" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1111.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1139.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1161.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Programa médico funcional: conjunto articulado de prestaciones según la necesidad de la población.</tspan><tspan x="58.0" dy="18">• Programa arquitectónico: traduce el PMF en ambientes y áreas (va después).</tspan><tspan x="58.0" dy="18">• Plan operativo anual y marco lógico son de gestión y proyectos, no de dimensionar servicios.</tspan></text><text x="58.0" y="1219.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, normas de infraestructura y equipamiento.</tspan></text></svg>