.5" x2="745.4" y2="467.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,501.0 471.2,501.0 435.0,561.0 185.0,561.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="531.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="535.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="527.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Define ambientes y metros</tspan><tspan x="320.0" dy="17">cuadrados?</tspan></text><line x1="457.1" y1="531.0" x2="606.0" y2="531.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="518.0" width="162.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="695.2" y="535.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="695.2" dy="0">✕ Programa arquitectónico</tspan></text><line x1="636.0" y1="531.5" x2="766.3" y2="531.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="565.0" x2="310.0" y2="584.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,583.0 315.0,583.0 310.0,591.0" fill="#0f766e"/><rect x="140.0" y="595.0" width="340.0" height="74.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="624.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Programa médico funcional</tspan></text><text x="310.0" y="648.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Qué prestaciones necesita la población</tspan></text><rect x="370.6" y="584.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="599.0" font-size="10" fo