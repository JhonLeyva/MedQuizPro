<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1051" viewBox="0 0 1000 1051" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Calambres en una carrera intensa: más lactato por glucólisis anaerobia"><title>Calambres en una carrera intensa: más lactato por glucólisis anaerobia</title><rect x="0.75" y="0.75" width="998.5" height="1049.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioquímica · metabolismo energético</tspan></text><rect x="420.8" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="500.2" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Glucólisis anaerobia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sin oxígeno suficiente, el piruvato se convierte en lactato para regenerar NAD⁺.</tspan><tspan x="58.0" dy="17">Así la glucólisis sigue dando ATP, pero se acumula lactato.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 25 años, maratonista</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Carrera de alta intensidad sin calentar.</tspan><tspan x="640.0" dy="16">Minutos después: dolor y calambres en las pantorrillas.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EL CICLO DEL MÚSCULO SIN OXÍGENO</tspan></text><rect x="40.0" y="269.0" width="308.0" height="377.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="164.6" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">DEL PIRUVATO AL LACTATO</tspan></text><g transform="translate(24.0,337.0) scale(0.98)"><rect x="120" y="6" width="100" height="30" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="170.0" y="24.675" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Glucosa</text><line x1="170.0" y1="36.0" x2="170.0" y2="62.0" stroke="#334155" stroke-width="2"/><polygon points="170.0,70.0 165.7,61.0 174.3,61.0" fill="#334155"/><rect x="120" y="72" width="100" height="30" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="170.0" y="90.675" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Piruvato</text><line x1="150.0" y1="102.0" x2="76.9" y2="145.9" stroke="#ea580c" stroke-width="3"/><polygon points="70.0,150.0 75.5,141.6 80.0,149.1" fill="#ea580c"/><rect x="14" y="152" width="116" height="40" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="72.0" y="168.85000000000002" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="middle" data-max="0">Lactato</text><text x="72.0" y="182.50000000000003" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="middle" data-max="0">(sin O₂)</text><line x1="190.0" y1="102.0" x2="263.1" y2="145.9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><polygon points="270.0,150.0 260.0,149.1 264.5,141.6" fill="#94a3b8"/><rect x="212" y="152" width="116" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="270.0" y="168.85000000000002" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">Mitocondria</text><text x="270.0" y="182.50000000000003" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">(con O₂)</text><text x="70" y="214" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">regenera NAD⁺: calambre</text><text x="70" y="214" font-size="10" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">regenera NAD⁺: calambre</text><text x="270" y="214" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">no alcanza el O₂</text><text x="270" y="214" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">no alcanza el O₂</text><text x="176" y="56" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">glucólisis</text><text x="176" y="56" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">glucólisis</text></g><text x="54.0" y="623.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="54.0" dy="0">Sin O₂ el piruvato se convierte en lactato.</tspan></text><ellipse cx="662.0" cy="426.0" rx="206.0" ry="120.0" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><polygon points="791.4,332.4 774.8,333.0 780.3,320.1" fill="#0f766e"/><polygon points="853.5,470.9 854.7,454.4 867.0,461.3" fill="#0f766e"/><polygon points="653.0,546.0 668.0,539.0 668.0,553.0" fill="#0f766e"/><polygon points="461.7,455.2 475.1,464.9 462.9,471.7" fill="#0f766e"/><polygon points="549.2,325.4 538.1,337.7 532.7,324.8" fill="#0f766e"/><text x="662.0" y="430.0" font-size="12.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="220"><tspan x="662.0" dy="0">Ejercicio intenso</tspan></text><rect x="574.0" y="279.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="576.0" cy="281.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="576.0" y="285.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="576.0" dy="0">1</tspan></text><text x="662.0" y="301.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">Mucha demanda de ATP</tspan></text><text x="662.0" y="317.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">carrera intensa</tspan></text><rect x="769.9" y="361.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="771.9" cy="363.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="771.9" y="367.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="771.9" dy="0">2</tspan></text><text x="857.9" y="383.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">O₂ insuficiente</tspan></text><text x="857.9" y="399.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">la mitocondria no alcanza</tspan></text><rect x="695.1" y="496.1" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="697.1" cy="498.1" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="697.1" y="502.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="697.1" dy="0">3</tspan></text><text x="783.1" y="518.1" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">Glucólisis rápida</tspan></text><text x="783.1" y="534.1" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">glucosa → piruvato</tspan></text><rect x="452.9" y="496.1" width="176.0" height="54.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><circle cx="454.9" cy="498.1" r="11" fill="#7c2d12" stroke="none" stroke-width="0"/><text x="454.9" y="502.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="454.9" dy="0">4</tspan></text><text x="540.9" y="518.1" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">Piruvato → lactato</tspan></text><text x="540.9" y="534.1" font-size="10.5" font-weight="500" font-style="normal" fill="#fff7ed" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">regenera NAD⁺</tspan></text><rect x="495.5" y="539.1" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="540.9" y="554.1" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="540.9" dy="0">◆ ESTE CASO</tspan></text><rect x="378.1" y="361.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="380.1" cy="363.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="380.1" y="367.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="380.1" dy="0">5</tspan></text><text x="466.1" y="383.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">Lactato acumulado</tspan></text><text x="466.1" y="399.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">dolor y fatiga</tspan></text><text x="40.0" y="678.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="688.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="689.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="712.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Menos piruvato</tspan></text><text x="58.0" y="733.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Se produce mucho; se desvía a lactato.</tspan></text><rect x="351.3" y="688.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="689.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="712.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Menos malonato</tspan></text><text x="369.3" y="733.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No participa en este proceso.</tspan></text><rect x="662.7" y="688.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="689.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="712.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Más oxalacetato</tspan></text><text x="680.7" y="733.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Es del ciclo de Krebs (aerobio).</tspan></text><text x="40.0" y="797.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="807.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="829.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Menos piruvato</tspan></text><text x="491.2" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Menos malonato</tspan></text><text x="678.8" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Más oxalacetato</tspan></text><rect x="775.5" y="810.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Más lactato</tspan></text><rect x="40.0" y="844.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="844.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="865.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Ocurre?</tspan></text><text x="303.8" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="865.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="807.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="902.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="930.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="952.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ejercicio intenso: el O₂ no alcanza → la lactato deshidrogenasa convierte piruvato en lactato.</tspan><tspan x="58.0" dy="18">• El lactato y los H⁺ se acumulan en el músculo.</tspan><tspan x="58.0" dy="18">• El piruvato no disminuye por falta de producción: se desvía a lactato.</tspan></text><text x="58.0" y="1010.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Lehninger, Principios de bioquímica 8.ª ed.; Guyton y Hall, Fisiología médica 14.ª ed..</tspan></text></svg>