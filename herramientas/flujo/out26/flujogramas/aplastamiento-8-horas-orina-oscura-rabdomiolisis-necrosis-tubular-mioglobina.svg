0">No</tspan></text><text x="678.8" y="1011.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí</tspan></text><text x="866.2" y="1011.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="945.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1056.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1084.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1106.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Aplastamiento prolongado + orina oscura + falla renal = necrosis tubular aguda por mioglobinuria.</tspan><tspan x="58.0" dy="18">• Hidratar con salino de forma agresiva, idealmente desde antes de liberar al atrapado; meta diuresis alta.</tspan><tspan x="58.0" dy="18">• Vigilar potasio (arritmias) y síndrome compartimental.</tspan></text><text x="58.0" y="1164.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Renal Disaster Relief Task Force (ISN); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>