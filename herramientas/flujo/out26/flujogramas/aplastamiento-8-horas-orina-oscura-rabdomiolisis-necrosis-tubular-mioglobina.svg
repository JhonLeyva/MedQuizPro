ata-max="274"><tspan x="50.0" dy="0">Liberación</tspan></text><text x="50.0" y="806.0" font-size="10.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">mioglobina y potasio a la sangre</tspan></text><rect x="548.0" y="784.0" width="99.0" height="20.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0"/><text x="597.5" y="798.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="91"><tspan x="597.5" dy="0">8-12 h</tspan></text><line x1="330.0" y1="794.0" x2="544.0" y2="794.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="828.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Orina oscura y NTA</tspan></text><text x="50.0" y="842.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">creatinina 4,1</tspan></text><rect x="597.5" y="820.0" width="346.5" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="770.8" y="834.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="338"><tspan x="770.8" dy="0">10-24 h</tspan></text><line x1="330.0" y1="830.0" x2="593.5" y2="830.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><line x1="350.0" y1="855.0" x2="944.0" y2="855.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="350.0" y1="851.0" x2="350.0" y2="859.0" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="873.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="350.0" dy="0">0</tspan></text><line x1="449.0" y1="851.0" x2="449.0" y2="859.0" stroke="#94a3b8" stroke-width="1.5"/><text x="449.0" y="873.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="449.0" dy="0">4<