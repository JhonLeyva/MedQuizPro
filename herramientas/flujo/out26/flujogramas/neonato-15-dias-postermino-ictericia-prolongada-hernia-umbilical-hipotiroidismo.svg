<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1069" viewBox="0 0 1000 1069" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ictericia prolongada con hernia umbilical, hipotonía y fontanela grande: hipotiroidismo congénito"><title>Ictericia prolongada con hernia umbilical, hipotonía y fontanela grande: hipotiroidismo congénito</title><rect x="0.75" y="0.75" width="998.5" height="1067.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · ictericia prolongada</tspan></text><rect x="407.8" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="464.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="464.3" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ictericia prolongada del recién nacido</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ictericia que dura más de 14 días: siempre se estudia.</tspan><tspan x="58.0" dy="17">Si se acompaña de hipotonía, hernia umbilical y fontanela grande: tiroides.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Neonato de 15 días, nacido a las 42 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactancia exclusiva; ictérico desde el 3.er día.</tspan><tspan x="640.0" dy="16">Hernia umbilical, tono disminuido y fontanela anterior</tspan><tspan x="640.0" dy="16">grande.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS SIGNOS DEL RECIÉN NACIDO</tspan></text><rect x="40.0" y="285.0" width="310.0" height="470.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="178.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">EL RECIÉN NACIDO DEL CASO</tspan></text><g transform="translate(75.0,333.0) scale(1.0)"><path d="M76 128 C72 110 168 110 164 128 L172 222 C160 248 80 248 68 222 Z" fill="#fde68a" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M72 180 H168 L172 222 C160 248 80 248 68 222 Z" fill="#fde68a" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M76 132 L40 170 L52 184 L82 156 Z" fill="#fde68a" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M164 132 L200 170 L188 184 L158 156 Z" fill="#fde68a" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="44" cy="182" r="10" fill="#fde68a" stroke="#e9b48f" stroke-width="2" /><circle cx="196" cy="182" r="10" fill="#fde68a" stroke="#e9b48f" stroke-width="2" /><path d="M84 236 L70 300 L94 304 L108 244 Z" fill="#fde68a" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156 236 L170 300 L146 304 L132 244 Z" fill="#fde68a" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="80" cy="308" rx="14" ry="7" fill="#fde68a" stroke="#e9b48f" stroke-width="2" /><ellipse cx="160" cy="308" rx="14" ry="7" fill="#fde68a" stroke="#e9b48f" stroke-width="2" /><circle cx="120" cy="70" r="54" fill="#fde68a" stroke="#e9b48f" stroke-width="2" /><circle cx="100" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><circle cx="140" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><path d="M110 96 Q120 102 130 96" fill="none" stroke="#9a6b52" stroke-width="2"/><path d="M116 76 Q120 86 124 76" fill="none" stroke="#9a6b52" stroke-width="2" stroke-linejoin="round" /><circle cx="120" cy="214" r="3" fill="#9a6b52" stroke="none" stroke-width="0" /><ellipse cx="120" cy="214" rx="9" ry="7" fill="#fbcfe8" stroke="#9d174d" stroke-width="1.5" /><ellipse cx="120" cy="24" rx="16" ry="9" fill="#fef9c3" stroke="#a16207" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="150" cy="108" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="112" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="146" cy="222" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="146" y="226" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><circle cx="60" cy="282" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="60" y="286" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text><circle cx="150" cy="20" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="24" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">4</text></g><text x="195.0" y="728.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">1 ictericia, 2 hernia umbilical, 3 hipotonía, 4 fontanela</tspan><tspan x="195.0" dy="15">grande.</tspan></text><rect x="368.0" y="285.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="307.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="311.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">1</tspan></text><text x="408.0" y="311.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Ictericia prolongada</tspan></text><text x="408.0" y="332.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Más de 14 días; bilirrubina indirecta.</tspan></text><rect x="368.0" y="359.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="381.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="385.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">2</tspan></text><text x="408.0" y="385.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Hernia umbilical</tspan></text><text x="408.0" y="406.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Pared abdominal débil.</tspan></text><rect x="368.0" y="433.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="455.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="459.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">3</tspan></text><text x="408.0" y="459.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Hipotonía</tspan></text><text x="408.0" y="480.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Tono muscular disminuido.</tspan></text><rect x="368.0" y="507.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="529.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="533.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">4</tspan></text><text x="408.0" y="533.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Fontanela anterior grande</tspan></text><text x="408.0" y="554.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Retraso de la maduración ósea.</tspan></text><rect x="368.0" y="581.0" width="592.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><circle cx="388.0" cy="603.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">5</tspan></text><text x="408.0" y="607.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Causa: hipotiroidismo congénito</tspan></text><text x="408.0" y="628.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Falta hormona tiroidea; el postérmino es otra pista.</tspan></text><rect x="844.6" y="570.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="585.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="799.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="809.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="831.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Galactosemia</tspan></text><text x="491.2" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Enfermedad de Gilbert</tspan></text><text x="678.8" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Atresia de vías biliares</tspan></text><rect x="775.5" y="812.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Hipotiroidismo congénito</tspan></text><rect x="40.0" y="846.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="846.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="875.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Clave</tspan></text><text x="303.8" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Vómitos, hipoglucemia,</tspan><tspan x="303.8" dy="16">sepsis</tspan></text><text x="491.2" y="875.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Leve, en adolescentes</tspan></text><text x="678.8" y="875.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Acolia, bilirrubina directa</tspan></text><text x="866.2" y="875.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Hernia, hipotonía, fontanela</tspan></text><rect x="40.0" y="809.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="920.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="948.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="970.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ictericia prolongada + hernia umbilical + hipotonía + fontanela grande = hipotiroidismo congénito.</tspan><tspan x="58.0" dy="18">• Confirmar con TSH y T4 libre y dar levotiroxina sin esperar si el cuadro es claro.</tspan><tspan x="58.0" dy="18">• Atresia biliar: acolia y bilirrubina directa alta; galactosemia: vómitos, hipoglucemia y sepsis.</tspan></text><text x="58.0" y="1028.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); AAP y ESPE, hipotiroidismo congénito.</tspan></text></svg>