<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1158" viewBox="0 0 1000 1158" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Insuficiencia cervical por historia: cerclaje profiláctico"><title>Insuficiencia cervical por historia: cerclaje profiláctico</title><rect x="0.75" y="0.75" width="998.5" height="1156.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parto pretérmino · insuficiencia cervical</tspan></text><rect x="435.9" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="523.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="523.1" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Insuficiencia cervical</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El cuello se dilata sin contracciones en el segundo trimestre.</tspan><tspan x="58.0" dy="17">Se sospecha por pérdidas indoloras repetidas antes de las 28 semanas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tercigesta de 10 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dos partos pretérmino indoloros a las 22 y 25</tspan><tspan x="640.0" dy="16">semanas.</tspan><tspan x="640.0" dy="16">Asintomática, cérvix cerrado; longitud cervical 25 mm.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ DICE LA HISTORIA OBSTÉTRICA?</tspan></text><polygon points="220,321.0 260,285.0 740,285.0 780,321.0 740,357.0 260,357.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="321.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="326.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="317.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">¿Tiene pérdidas previas del segundo trimestre sin dolor ni</tspan><tspan x="525.0" dy="18">contracciones?</tspan></text><line x1="500.0" y1="357.0" x2="500.0" y2="377.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="377.0" x2="662.0" y2="377.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="377.0" x2="190.0" y2="406.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,405.0 195.0,405.0 190.0,413.0" fill="#0f766e"/><line x1="662.0" y1="377.0" x2="662.0" y2="406.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,405.0 667.0,405.0 662.0,413.0" fill="#ea580c"/><rect x="174.0" y="385.0" width="32.0" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="399.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">No</tspan></text><rect x="566.0" y="385.0" width="192.0" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="399.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Sí: 22 y 25 semanas (este caso)</tspan></text><rect x="40.0" y="413.0" width="300.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="414.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="437.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Medir el cuello entre las 16 y 24 semanas</tspan></text><text x="58.0" y="458.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Si ≤ 25 mm con parto pretérmino previo:</tspan><tspan x="58.0" dy="16">cerclaje o progesterona vaginal.</tspan></text><rect x="364.0" y="413.0" width="596.0" height="338.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="402.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="417.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="439.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Cerclaje profiláctico a las 12-14 semanas</tspan></text><text x="382.0" y="461.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Sutura en bolsa de tabaco en el cuello (McDonald o Shirodkar).</tspan></text><g transform="translate(512.0,481.0) scale(1.0)"><path d="M40 20 C40 10 260 10 260 20 L260 60 C200 70 180 80 180 90 L180 200 L120 200 L120 90 C120 80 100 70 40 60 Z" fill="#fbcfe8" stroke="#be185d" stroke-width="2" stroke-linejoin="round" /><line x1="150" y1="84" x2="150" y2="200" stroke="#9f1239" stroke-width="2" stroke-dasharray="4 3"/><text x="150" y="40" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">cavidad uterina</text><text x="150" y="40" font-size="10.5" font-weight="800" fill="#be185d" text-anchor="middle" data-max="0">cavidad uterina</text><line x1="200" y1="88" x2="200" y2="200" stroke="#0f766e" stroke-width="2"/><line x1="194" y1="88" x2="206" y2="88" stroke="#0f766e" stroke-width="2"/><line x1="194" y1="200" x2="206" y2="200" stroke="#0f766e" stroke-width="2"/><text x="212" y="149.0" font-size="12" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">25 mm</text><text x="212" y="149.0" font-size="12" font-weight="800" fill="#134e4a" text-anchor="start" data-max="0">25 mm</text><ellipse cx="150" cy="128.5" rx="36" ry="8" fill="none" stroke="#1d4ed8" stroke-width="3" /><text x="40" y="132.5" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">cerclaje</text><text x="40" y="132.5" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="start" data-max="0">cerclaje</text><text x="150" y="218" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">orificio externo</text></g><text x="382.0" y="733.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Cuello de 25 mm y la sutura del cerclaje (azul) que lo mantiene cerrado.</tspan></text><text x="40.0" y="785.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DESPUÉS DEL CERCLAJE</tspan></text><rect x="40.0" y="795.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="796.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="819.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Retiro</tspan></text><text x="58.0" y="840.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">A las 36-37 semanas o antes si inicia el parto.</tspan></text><rect x="351.3" y="795.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="796.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="819.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Control</tspan></text><text x="369.3" y="840.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Ecografía de la longitud cervical.</tspan></text><rect x="662.7" y="795.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="796.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="819.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Evitar</tspan></text><text x="680.7" y="840.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Tocólisis o magnesio no tratan esta causa.</tspan></text><text x="40.0" y="904.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="914.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="936.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="936.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Expectante</tspan></text><rect x="400.5" y="917.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="936.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Cerclaje</tspan></text><text x="678.8" y="936.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Ritodrina</tspan></text><text x="866.2" y="936.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Magnesio</tspan></text><rect x="40.0" y="951.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="951.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="972.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Trata la causa?</tspan></text><text x="303.8" y="972.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: repetiría la pérdida</tspan></text><text x="491.2" y="972.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="972.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: no hay contracciones</tspan></text><text x="866.2" y="972.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="914.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1009.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1037.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1059.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Historia de ≥ 1-2 pérdidas del segundo trimestre indoloras: cerclaje profiláctico a las 12-14 semanas.</tspan><tspan x="58.0" dy="18">• Sin esa historia pero con cérvix ≤ 25 mm antes de las 24 semanas y parto pretérmino previo: cerclaje o progesterona.</tspan><tspan x="58.0" dy="18">• La tocólisis (ritodrina) y el magnesio no tratan la insuficiencia cervical.</tspan></text><text x="58.0" y="1117.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletins n.º 142 (cerclaje); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>