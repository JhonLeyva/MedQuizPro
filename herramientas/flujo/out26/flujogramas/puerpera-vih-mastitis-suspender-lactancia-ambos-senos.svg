.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">SUSPENDER LA LACTANCIA DE AMBOS SENOS</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Alimentar con fórmula</tspan><tspan x="266.5" dy="17">Tratar la mastitis; profilaxis del bebé</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Lactancia exclusiva con TAR</tspan></text><text x="733.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Suspender del seno con mastitis y extraer y desechar</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="557.5" width="328.0" height="302.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="567.5" width="128.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="581.5" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="286"><tspan x="61.0" dy="0">LA MAMA AFECTADA</tspan></text><g data-box="54.0 595.5 300.0 240.0"><g transform="translate(54.0,595.5) scale(1.0)"><circle cx="150" cy="125" r="100" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="150" cy="125" r="24" fill="#d6a684" stroke="#9a6b52" stroke-width="1.5" /><circle cx="150" cy="125" r="8" fill="#9a6b52" stroke="none" stroke-width="0" /><path d="M168 125 L230 125" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M163 138 L207 182" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M150 143 L150 205" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M137 138 L93 182" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M132 125 L70 125" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M137 112 L93 68" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M150 107 L150 45" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M163 112 L207 68" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><line x1="150" y1="22" x2="150" y2="228" stroke="#cbd5e1" stroke-dasharray="4 4"/><line x1="46" y1="125" x2="254" y2="125" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="30" y="20" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">axila</text><path d="M150 125 L54 60 L90 30 Z" fill="#f87171" stroke="none" stroke-width="0" stroke-linejoin="round" opacity="0.55"/><text x="90" y="236" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">cuadrante superoexterno</text></g></g><rect x="390.0" y="557.5" width="570.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="573.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="577.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">1</tspan></text><text x="426.0" y="577.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Mastitis en el cuadrante superoexterno derecho.</tspan></text><rect x="390.0" y="595.5" width="570.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="408.0" cy="611.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="615.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">2</tspan></text><text x="426.0" y="615.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">La inflamación rompe la barrera del tejido: más virus en la leche.</tspan></text><rect x="390.0" y="633.5" width="570.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="649.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="653.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">3</tspan></text><text x="426.0" y="653.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">No basta con dar solo del seno sano.</tspan></text><text x="40.0" y="899.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="909.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="932.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="932.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Lactancia bilateral</tspan></text><rect x="400.5" y="912.5" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="932.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Suspender ambos senos</tspan></text><text x="678.8" y="932.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Vendaje de mamas</tspan></text><text x="866.2" y="932.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Solo el seno sano</tspan></text><rect x="40.0" y="946.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="946.5" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="975.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="975.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Máximo riesgo de transmisión</tspan></text><text x="491.2" y="975.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ninguno</tspan></text><text x="678.8" y="975.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No indicado</tspan></text><text x="866.2" y="967.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">El otro seno también</tspan><tspan x="866.2" dy="16">transmite</tspan></text><rect x="40.0" y="909.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1020.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1048.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1070.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Madre con VIH (norma peruana): sucedáneo de leche materna desde el nacimiento.</tspan><tspan x="58.0" dy="18">• Con mastitis se suspende la lactancia de ambos senos: la leche de los dos lados puede transmitir el virus.</tspan><tspan x="58.0" dy="18">• Tratar la mastitis (antibiótico, vaciado sin dar al bebé) y seguir la profilaxis del recién nacido.</tspan></text><text x="58.0" y="1128.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, norma de prevención de la transmisión materno-infantil del VIH; OMS.</tspan></text></svg>