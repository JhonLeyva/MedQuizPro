<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1003" viewBox="0 0 1000 1003" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Otitis media aguda en un niño de 2 años: el abombamiento del tímpano justifica el antibiótico"><title>Otitis media aguda en un niño de 2 años: el abombamiento del tímpano justifica el antibiótico</title><rect x="0.75" y="0.75" width="998.5" height="1001.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Otorrinolaringología · otitis media aguda</tspan></text><rect x="439.9" y="32.0" width="177.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="528.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="161"><tspan x="528.5" dy="0">OFTALMOLOGÍA Y ORL ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diagnóstico estricto de otitis media aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hace falta líquido en el oído medio + inflamación aguda.</tspan><tspan x="58.0" dy="17">El abombamiento moderado o intenso del tímpano es el signo más específico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 2 años en un centro de salud</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">24 h de fiebre y llanto irritativo.</tspan><tspan x="640.0" dy="16">Otoscopía: presión purulenta en el oído medio.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TÍMPANO CON PUS FRENTE A EFUSIÓN</tspan></text><rect x="40.0" y="279.0" width="438.0" height="304.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="52.0" y="289.0" width="113.3" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="303.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">OMA: ABOMBADO</tspan></text><rect x="362.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="408.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">◆ ESTE CASO</tspan></text><g transform="translate(149.0,317.0) scale(1.0)"><circle cx="110" cy="96" r="88" fill="#fde2e2" stroke="#be123c" stroke-width="3" /><circle cx="110" cy="96" r="74" fill="#fde68a" stroke="#94a3b8" stroke-width="2" /><circle cx="110" cy="96" r="74" fill="none" stroke="#dc2626" stroke-width="4" /><ellipse cx="96" cy="86" rx="26" ry="18" fill="#fffbeb" stroke="none" stroke-width="0" opacity="0.8"/><text x="110" y="204" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">abombado, rojo y opaco</text><text x="110" y="204" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle" data-max="0">abombado, rojo y opaco</text></g><text x="54.0" y="547.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">Abombado, rojo y opaco: pus a presión.</tspan></text><rect x="522.0" y="279.0" width="438.0" height="304.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="534.0" y="289.0" width="129.8" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="303.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">OTITIS CON EFUSIÓN</tspan></text><g transform="translate(631.0,317.0) scale(1.0)"><circle cx="110" cy="96" r="88" fill="#fde2e2" stroke="#be123c" stroke-width="3" /><circle cx="110" cy="96" r="74" fill="#fcd34d" stroke="#94a3b8" stroke-width="2" /><circle cx="80" cy="80" r="6" fill="none" stroke="#a16207" stroke-width="1.5" /><circle cx="130" cy="70" r="6" fill="none" stroke="#a16207" stroke-width="1.5" /><circle cx="100" cy="120" r="6" fill="none" stroke="#a16207" stroke-width="1.5" /><circle cx="140" cy="118" r="6" fill="none" stroke="#a16207" stroke-width="1.5" /><text x="110" y="204" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">ámbar con burbujas</text><text x="110" y="204" font-size="10.5" font-weight="800" fill="#a16207" text-anchor="middle" data-max="0">ámbar con burbujas</text></g><text x="536.0" y="547.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="536.0" dy="0">Ámbar con burbujas: líquido sin infección aguda.</tspan></text><circle cx="500.0" cy="423.0" r="17" fill="#ea580c" stroke="none" stroke-width="0"/><polygon points="494.0,415.0 494.0,431.0 508.0,423.0" fill="#ffffff"/><text x="40.0" y="613.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OTROS HALLAZGOS</tspan></text><rect x="40.0" y="623.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="624.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="647.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Abombamiento intenso</tspan></text><text x="58.0" y="668.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Justifica el antibiótico.</tspan></text><rect x="237.5" y="612.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="627.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="623.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="624.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="647.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Eritema leve con movilidad</tspan></text><text x="369.3" y="668.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Puede ser por llanto o fiebre.</tspan></text><rect x="662.7" y="623.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="624.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="647.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Retraído, martillo marcado</tspan></text><text x="680.7" y="668.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Disfunción de la trompa.</tspan></text><text x="40.0" y="732.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="742.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="773.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="764.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Eritema leve con</tspan><tspan x="303.8" dy="17">movilidad</tspan></text><rect x="400.5" y="745.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="773.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Abombamiento intenso</tspan></text><text x="678.8" y="773.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Retraído</tspan></text><text x="866.2" y="773.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Ámbar con burbujas</tspan></text><rect x="40.0" y="796.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="796.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="817.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Justifica antibiótico?</tspan></text><text x="303.8" y="817.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="817.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="817.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="817.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: es efusión</tspan></text><rect x="40.0" y="742.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="854.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="882.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="904.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Abombamiento intenso + fiebre en &lt; 2 años = OMA: amoxicilina 80-90 mg/kg/día.</tspan><tspan x="58.0" dy="18">• Tímpano ámbar con burbujas: otitis media con efusión (no necesita antibiótico).</tspan><tspan x="58.0" dy="18">• Eritema leve con movilidad normal o tímpano retraído no bastan para diagnosticar OMA.</tspan></text><text x="58.0" y="962.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, otitis media aguda (2013); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>