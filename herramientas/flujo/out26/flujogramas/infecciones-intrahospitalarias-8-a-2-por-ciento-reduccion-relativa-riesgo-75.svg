n></text><circle cx="326.0" cy="453.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="458.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">3</tspan></text><rect x="350.0" y="431.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="432.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="455.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Diferencia (RAR)</tspan></text><text x="368.0" y="476.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">8 − 2 = 6 puntos.</tspan></text><circle cx="326.0" cy="534.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="539.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">4</tspan></text><rect x="350.0" y="512.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="513.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Dividir entre el inicial</tspan></text><text x="368.0" y="557.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">6 ÷ 8 = 0,75.</tspan></text><circle cx="326.0" cy="615.0" r="14" fill="#0f766e" stroke="none" stroke-width="0"/><text x="326.0" y="620.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">5</tspan></text><rect x="350.0" y="593.0" width="610.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="351.0" y="594.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="368.0" y="617.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Resultado</tspan></text><text x="368.0" y="638.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">RRR = 75 %.</tspan></text><rect x="860.2" y="582.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="597.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="783.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="793.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="815.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">65 %</tspan></text><text x="491.2" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">70 %</tspan></text><rect x="588.0" y="796.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">75 %</tspan></text><text x="866.2" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">85 %</tspan></text><rect x="40.0" y="830.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="830.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="851.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Correcto?</tspan></text><text x="303.8" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="851.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí: 6 ÷ 8</tspan></text><text x="866.2" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="793.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="888.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="916.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="938.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• RRR = (8 − 2) ÷ 8 = 0,75 = 75 %.</tspan><tspan x="58.0" dy="18">• La reducción absoluta es 6 puntos (8 % − 2 %); el NNT sería 1 ÷ 0,06 ≈ 17.</tspan><tspan x="58.0" dy="18">• No confundir: la RRR siempre se divide entre 