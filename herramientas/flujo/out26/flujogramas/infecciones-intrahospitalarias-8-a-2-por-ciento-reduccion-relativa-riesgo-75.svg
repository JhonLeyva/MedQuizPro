<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1037" viewBox="0 0 1000 1037" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Infecciones intrahospitalarias que bajan de 8 % a 2 %: reducción relativa del riesgo del 75 %"><title>Infecciones intrahospitalarias que bajan de 8 % a 2 %: reducción relativa del riesgo del 75 %</title><rect x="0.75" y="0.75" width="998.5" height="1035.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · medidas de impacto</tspan></text><rect x="415.3" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="487.0" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reducción relativa del riesgo (RRR)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">RRR = (riesgo inicial − riesgo final) ÷ riesgo inicial.</tspan><tspan x="58.0" dy="17">Dice qué parte del riesgo inicial se eliminó.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hospital con más infecciones</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Incidencia basal 8 %; tras higiene de manos y</tspan><tspan x="640.0" dy="16">bioseguridad, 2 %.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LA CUENTA PASO A PASO</tspan></text><rect x="40.0" y="269.0" width="250.0" height="470.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="118.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">ANTES Y DESPUÉS</tspan></text><g transform="translate(26.0,329.0) scale(1.0)"><text x="118" y="12" font-size="10" font-weight="700" fill="#64748b" text-anchor="start" data-max="0">Incidencia</text><text x="110" y="39" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Antes</text><rect x="118" y="24" width="112" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="24" width="99.6" height="22" rx="4" fill="#94a3b8"/><text x="211.55555555555554" y="39" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="end" data-max="0">8 %</text><text x="110" y="73" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end" data-max="0">Después</text><rect x="118" y="58" width="112" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="58" width="24.9" height="22" rx="4" fill="#ea580c"/><text x="148.88888888888889" y="73" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">2 %</text></g><g transform="translate(56.0,309.0) scale(1.0)"><text x="109" y="150" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Se evitaron 6 de cada 8</text><text x="109" y="150" font-size="11" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">Se evitaron 6 de cada 8</text><text x="109" y="172" font-size="13" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">6 ÷ 8 = 0,75</text><text x="109" y="172" font-size="13" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">6 ÷ 8 = 0,75</text><text x="109" y="196" font-size="14" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">RRR = 75 %</text><text x="109" y="196" font-size="14" font-weight="800" fill="#ea580c" text-anchor="middle" dat