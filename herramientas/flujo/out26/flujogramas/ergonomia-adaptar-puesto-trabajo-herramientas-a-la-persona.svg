<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1205" viewBox="0 0 1000 1205" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La ergonomía adapta el puesto, las herramientas y las tareas a la persona"><title>La ergonomía adapta el puesto, las herramientas y las tareas a la persona</title><rect x="0.75" y="0.75" width="998.5" height="1203.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud ocupacional · ergonomía</tspan></text><rect x="384.5" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="456.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="456.3" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ergonomía</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estudia la interacción entre la persona y su trabajo.</tspan><tspan x="58.0" dy="17">Diseña el puesto según las capacidades físicas y mentales del trabajador.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Por qué la ergonomía mejora la seguridad, el</tspan><tspan x="640.0" dy="16">bienestar y la eficiencia?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS CUATRO OPCIONES FRENTE AL CONCEPTO</tspan></text><line x1="410.3" y1="403.0" x2="340.0" y2="425.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="425.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="347.0" x2="660.0" y2="325.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="325.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="403.0" x2="660.0" y2="425.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="425.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="347.0" x2="340.0" y2="325.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="325.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="375.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="375.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="370.5" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">¿Qué hace la</tspan><tspan x="500.0" dy="19">ergonomía?</tspan></text><rect x="40.0" y="283.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="316.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Adapta el trabajo a la persona</tspan></text><text x="190.0" y="340.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Puesto, herramientas y tareas</tspan></text><rect x="144.6" y="357.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="372.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="383.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="384.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="416.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Optimiza procesos administrativos</tspan></text><text x="190.0" y="440.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Ignora al trabajador</tspan></text><rect x="660.0" y="283.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="284.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="316.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Distribuye recursos con justicia</tspan></text><text x="810.0" y="340.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Es gestión, no ergonomía</tspan></text><rect x="660.0" y="383.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="384.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="416.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Controla riesgos comunitarios</tspan></text><text x="810.0" y="440.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Es salud pública general</tspan></text><text x="40.0" y="517.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Analizar la tarea</tspan></text><line x1="248.5" y1="549.5" x2="267.5" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,544.5 266.5,554.5 274.5,549.5" fill="#0f766e"/><rect x="278.5" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Medir al trabajador</tspan></text><line x1="487.0" y1="549.5" x2="506.0" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,544.5 505.0,554.5 513.0,549.5" fill="#0f766e"/><rect x="517.0" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Rediseñar el puesto</tspan></text><line x1="725.5" y1="549.5" x2="744.5" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,544.5 743.5,554.5 751.5,549.5" fill="#0f766e"/><rect x="755.5" y="529.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="553.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Menos lesiones y errores</tspan></text><text x="40.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="622.0" width="332.0" height="272.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="632.0" width="198.5" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="646.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="290"><tspan x="61.0" dy="0">PUESTO DE TRABAJO (ESQUEMA)</tspan></text><g transform="translate(54.0,660.0) scale(0.95)"><rect x="150" y="120" width="150" height="10" fill="#a16207"/><path d="M170 130 L170 200 M280 130 L280 200" fill="none" stroke="#a16207" stroke-width="4" stroke-linejoin="round" /><rect x="210" y="66" width="70" height="46" rx="4" fill="#1e293b"/><path d="M245 112 L245 120" fill="none" stroke="#1e293b" stroke-width="4" stroke-linejoin="round" /><circle cx="110" cy="50" r="16" fill="#fde7d4" stroke="#e9b48f" stroke-width="1.5" /><path d="M110 66 L106 130 L150 132" fill="none" stroke="#2563eb" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M106 130 L150 132 L150 196" fill="none" stroke="#334155" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 80 L170 116" fill="none" stroke="#2563eb" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="134" width="60" height="10" fill="#64748b"/><path d="M110 144 L110 200 M86 200 L134 200" fill="none" stroke="#64748b" stroke-width="4" stroke-linejoin="round" /><path d="M126 50 L210 82" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="160" y="52" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">pantalla a la altura de los ojos</text><text x="160" y="52" font-size="9.5" font-weight="800" fill="#16a34a" text-anchor="start" data-max="0">pantalla a la altura de los ojos</text><text x="30" y="214" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">el puesto se adapta a la persona</text><text x="30" y="214" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="start" data-max="0">el puesto se adapta a la persona</text></g><rect x="394.0" y="622.0" width="566.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="412.0" cy="640.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="412.0" y="644.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="412.0" dy="0">1</tspan></text><text x="432.0" y="644.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="432.0" dy="0">Pantalla a la altura de los ojos.</tspan></text><rect x="394.0" y="653.0" width="566.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="412.0" cy="671.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="412.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="412.0" dy="0">2</tspan></text><text x="432.0" y="675.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="522"><tspan x="432.0" dy="0">Silla y mesa a la medida.</tspan></text><rect x="394.0" y="684.0" width="566.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="412.0" cy="702.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="412.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="412.0" dy="0">3</tspan></text><text x="432.0" y="706.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="522"><tspan x="432.0" dy="0">Así se evitan lesiones de espalda y cuello.</tspan></text><text x="40.0" y="934.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="944.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="975.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="975.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Procesos administrativos</tspan></text><text x="491.2" y="975.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Distribución equitativa</tspan></text><text x="678.8" y="975.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Riesgos comunitarios</tspan></text><rect x="775.5" y="947.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="966.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Adapta el trabajo a la</tspan><tspan x="866.2" dy="17">persona</tspan></text><rect x="40.0" y="998.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="998.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1019.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Es ergonomía?</tspan></text><text x="303.8" y="1019.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="1019.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="1019.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="1019.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="944.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1056.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1084.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1106.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Porque analiza y adapta puestos, herramientas y tareas a las características de las personas.</tspan><tspan x="58.0" dy="18">• Así previene trastornos musculoesqueléticos, fatiga y errores.</tspan><tspan x="58.0" dy="18">• No es gestión administrativa, ni justicia distributiva, ni control de enfermedades comunitarias.</tspan></text><text x="58.0" y="1164.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OIT; Asociación Internacional de Ergonomía.</tspan></text></svg>