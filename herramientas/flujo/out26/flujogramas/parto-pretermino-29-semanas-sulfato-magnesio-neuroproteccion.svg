<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1153" viewBox="0 0 1000 1153" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Parto pretérmino inminente a las 29 semanas: sulfato de magnesio para proteger el cerebro fetal"><title>Parto pretérmino inminente a las 29 semanas: sulfato de magnesio para proteger el cerebro fetal</title><rect x="0.75" y="0.75" width="998.5" height="1151.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parto pretérmino · neuroprotección fetal</tspan></text><rect x="437.9" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="525.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="525.1" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fármacos en el parto pretérmino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cada uno tiene su fin: tocolítico (ganar 48 h), corticoide (pulmón), magnesio (cerebro).</tspan><tspan x="58.0" dy="17">El magnesio antes de las 32 semanas reduce la parálisis cerebral.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 29 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dinámica uterina y pérdida del tapón mucoso.</tspan><tspan x="640.0" dy="16">5 cm, borramiento 80 %, membranas íntegras.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ FÁRMACO SIRVE PARA QUÉ Y CUÁNDO</tspan></text><rect x="40.0" y="269.0" width="350.0" height="350.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="201.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">TRABAJO DE PARTO PRETÉRMINO</tspan></text><g transform="translate(80.0,301.0) scale(0.82)"><ellipse cx="150" cy="150" rx="124" ry="142" fill="#fbcfe8" stroke="#be185d" stroke-width="3" /><ellipse cx="150" cy="150" rx="108" ry="126" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" /><path d="M40 70 C80 20 170 10 230 30 L210 62 C160 44 100 50 62 88 Z" fill="#9f1239" stroke="#881337" stroke-width="1.5" stroke-linejoin="round" /><ellipse cx="155.7" cy="124.4" rx="41.8" ry="55.099999999999994" fill="#fcd5b5" stroke="#e9b48f" stroke-width="1.6" transform="rotate(-10 155.7 124.4)" /><circle cx="150" cy="202.3" r="34.199999999999996" fill="#fcd5b5" stroke="#e9b48f" stroke-width="1.6" /><path d="M178.5 103.5 q26 17.099999999999998 8 41.8" fill="none" stroke="#e9b48f" stroke-width="4.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M123.4 151.0 q-18 20.9 6 34.199999999999996" fill="none" stroke="#e9b48f" stroke-width="4.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M118 286 L126 322 M182 286 L174 322" fill="none" stroke="#be185d" stroke-width="8" stroke-linejoin="round" /><text x="214" y="316" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">5 cm</text><text x="214" y="316" font-size="11" font-weight="800" fill="#ea580c" text-anchor="start" data-max="0">5 cm</text><text x="250" y="60" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">placenta</text><text x="250" y="60" font-size="10" font-weight="800" fill="#9f1239" text-anchor="start" data-max="0">placenta</text></g><rect x="48.0" y="586.0" width="334.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="215.0" y="607.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="320"><tspan x="215.0" dy="0">Cuello con 5 cm a las 29 semanas: el parto es inminente.</tspan></text><rect x="410.0" y="269.0" width="550.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="411.0" y="270.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="428.0" y="293.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Sulfato de magnesio</tspan></text><text x="428.0" y="314.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Neuroprotección: menos parálisis cerebral (&lt; 32 sem).</tspan></text><rect x="860.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="410.0" y="348.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="349.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="372.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Betametasona</tspan></text><text x="428.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Maduración pulmonar (24-34 sem).</tspan></text><rect x="410.0" y="427.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="428.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Nifedipino</tspan></text><text x="428.0" y="472.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Tocólisis por 48 h para completar el corticoide.</tspan></text><text x="40.0" y="653.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SEMANAS DE GESTACIÓN</tspan></text><line x1="350.0" y1="685.0" x2="350.0" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="424.2" y1="685.0" x2="424.2" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="498.5" y1="685.0" x2="498.5" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="572.8" y1="685.0" x2="572.8" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="647.0" y1="685.0" x2="647.0" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="721.2" y1="685.0" x2="721.2" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="795.5" y1="685.0" x2="795.5" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="869.8" y1="685.0" x2="869.8" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="685.0" x2="944.0" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="689.0" width="920.0" height="32.0" rx="8" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="50.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Sulfato de magnesio</tspan></text><text x="50.0" y="718.0" font-size="10.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">neuroprotección</tspan></text><rect x="424.2" y="696.0" width="297.0" height="20.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0"/><text x="572.8" y="710.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="289"><tspan x="572.8" dy="0">24-32 sem</tspan></text><line x1="330.0" y1="706.0" x2="420.2" y2="706.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="740.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Corticoides</tspan></text><text x="50.0" y="754.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">pulmón fetal</tspan></text><rect x="424.2" y="732.0" width="371.2" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="609.9" y="746.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="363"><tspan x="609.9" dy="0">24-34 sem</tspan></text><line x1="330.0" y1="742.0" x2="420.2" y2="742.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="776.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Tocolíticos</tspan></text><text x="50.0" y="790.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">ganar 48 horas</tspan></text><rect x="424.2" y="768.0" width="371.2" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="609.9" y="782.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="363"><tspan x="609.9" dy="0">24-34 sem</tspan></text><line x1="330.0" y1="778.0" x2="420.2" y2="778.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><line x1="350.0" y1="803.0" x2="944.0" y2="803.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="350.0" y1="799.0" x2="350.0" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="350.0" dy="0">22</tspan></text><line x1="424.2" y1="799.0" x2="424.2" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="424.2" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="424.2" dy="0">24</tspan></text><line x1="498.5" y1="799.0" x2="498.5" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="498.5" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="498.5" dy="0">26</tspan></text><line x1="572.8" y1="799.0" x2="572.8" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="572.8" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="572.8" dy="0">28</tspan></text><line x1="647.0" y1="799.0" x2="647.0" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="647.0" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="647.0" dy="0">30</tspan></text><line x1="721.2" y1="799.0" x2="721.2" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="721.2" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="721.2" dy="0">32</tspan></text><line x1="795.5" y1="799.0" x2="795.5" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="795.5" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="795.5" dy="0">34</tspan></text><line x1="869.8" y1="799.0" x2="869.8" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="869.8" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="869.8" dy="0">36</tspan></text><line x1="944.0" y1="799.0" x2="944.0" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="944.0" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="944.0" dy="0">38</tspan></text><text x="944.0" y="837.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="300"><tspan x="944.0" dy="0">semanas de gestación</tspan></text><line x1="609.9" y1="683.0" x2="609.9" y2="803.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><rect x="564.5" y="666.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="609.9" y="681.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="609.9" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="883.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="893.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="915.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="915.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Nifedipino</tspan></text><rect x="400.5" y="896.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="915.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Sulfato de magnesio</tspan></text><text x="678.8" y="915.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Metformina</tspan></text><text x="866.2" y="915.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Betametasona</tspan></text><rect x="40.0" y="930.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="930.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="951.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Reduce la parálisis</tspan><tspan x="54.0" dy="16">cerebral?</tspan></text><text x="303.8" y="959.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: es tocolítico</tspan></text><text x="491.2" y="959.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="959.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="959.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: es para el pulmón</tspan></text><rect x="40.0" y="893.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1004.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1032.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1054.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Parto pretérmino inminente &lt; 32 semanas: sulfato de magnesio EV para neuroprotección (reduce parálisis cerebral).</tspan><tspan x="58.0" dy="18">• Betametasona: maduración pulmonar (24-34 semanas); nifedipino: tocólisis para completarla.</tspan><tspan x="58.0" dy="18">• La metformina no tiene papel aquí.</tspan></text><text x="58.0" y="1112.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletins n.º 455 y n.º 171; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>