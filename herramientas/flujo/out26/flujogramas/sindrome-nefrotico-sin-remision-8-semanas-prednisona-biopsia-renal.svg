<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1205" viewBox="0 0 1000 1205" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Síndrome nefrótico sin remisión tras 8 semanas de prednisona: biopsia renal"><title>Síndrome nefrótico sin remisión tras 8 semanas de prednisona: biopsia renal</title><rect x="0.75" y="0.75" width="998.5" height="1203.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología pediátrica · síndrome nefrótico</tspan></text><rect x="446.8" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="503.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="503.2" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome nefrótico en el niño</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Casi siempre es de cambios mínimos y responde a la prednisona: no se biopsia de entrada.</tspan><tspan x="58.0" dy="17">Si no responde (corticorresistente), la biopsia define la lesión y el tratamiento.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 4 años con anasarca</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Proteinuria masiva, hipoalbuminemia, hiperlipidemia.</tspan><tspan x="640.0" dy="16">Prednisona 60 mg/m²/día 6 semanas y luego 40 mg/m²</tspan><tspan x="640.0" dy="16">en días alternos; a las 8 semanas sin remisión (80</tspan><tspan x="640.0" dy="16">mg/m²/h).</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EL NIÑO Y EL TIEMPO DE TRATAMIENTO</tspan></text><rect x="40.0" y="301.0" width="350.0" height="350.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="119.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">EL NIÑO DEL CASO</tspan></text><g transform="translate(138.0,341.0) scale(0.7)"><circle cx="110" cy="56" r="42" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="95" cy="52" r="3.5" fill="#334155" stroke="none" stroke-width="0" /><circle cx="125" cy="52" r="3.5" fill="#334155" stroke="none" stroke-width="0" /><path d="M100 74 Q110 80 120 74" fill="none" stroke="#9a6b52" stroke-width="2"/><rect x="102" y="96" width="16" height="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><path d="M74.0 106 H146.0 L150.0 170 H70.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70.0 170 H150.0 C154 206 148.0 222 144.0 232 H76.0 C72.0 222 66 206 70.0 170 Z" fill="#bfdbfe" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M74.0 110 L50.0 120 L40.0 214 L56.0 216 L70.0 150 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M146.0 110 L170.0 120 L180.0 214 L164.0 216 L150.0 150 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="48.0" cy="224" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="172.0" cy="224" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M80 232 H106 L104 364 H84 Z" fill="#dbeafe" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M114 232 H140 L136 364 H116 Z" fill="#dbeafe" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="92" cy="370" rx="14" ry="6" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><ellipse cx="128" cy="370" rx="14" ry="6" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><ellipse cx="95" cy="60" rx="9" ry="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.2" /><ellipse cx="125" cy="60" rx="9" ry="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.2" /><circle cx="146" cy="58" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="146" y="62" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="110" cy="200" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="110" y="204" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><circle cx="150" cy="320" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="324" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text></g><rect x="48.0" y="618.0" width="334.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="215.0" y="639.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="320"><tspan x="215.0" dy="0">Anasarca: 1 párpados, 2 abdomen (ascitis), 3 piernas.</tspan></text><rect x="410.0" y="301.0" width="550.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="411.0" y="302.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="428.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Biopsia renal</tspan></text><text x="428.0" y="346.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Corticorresistente: hay que ver la lesión.</tspan></text><rect x="860.2" y="290.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="305.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="410.0" y="380.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="381.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="404.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Ciclofosfamida</tspan></text><text x="428.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Para corticodependencia, no para resistencia.</tspan></text><rect x="410.0" y="459.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="460.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="483.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Micofenolato</tspan></text><text x="428.0" y="504.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">No es la primera línea; va tras la biopsia.</tspan></text><text x="40.0" y="685.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SEMANAS DE PREDNISONA</tspan></text><line x1="350.0" y1="717.0" x2="350.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="449.0" y1="717.0" x2="449.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="548.0" y1="717.0" x2="548.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="647.0" y1="717.0" x2="647.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="746.0" y1="717.0" x2="746.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="845.0" y1="717.0" x2="845.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="717.0" x2="944.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><text x="50.0" y="736.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Prednisona 60 mg/m²/día</tspan></text><text x="50.0" y="750.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">fase diaria</tspan></text><rect x="350.0" y="728.0" width="297.0" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="498.5" y="742.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="289"><tspan x="498.5" dy="0">0-6 sem</tspan></text><line x1="330.0" y1="738.0" x2="346.0" y2="738.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="772.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">40 mg/m² en días alternos</tspan></text><text x="50.0" y="786.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">fase alterna</tspan></text><rect x="647.0" y="764.0" width="297.0" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="795.5" y="778.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="289"><tspan x="795.5" dy="0">6-12 sem</tspan></text><line x1="330.0" y1="774.0" x2="643.0" y2="774.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="808.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Remisión esperada</tspan></text><text x="50.0" y="822.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">la mayoría en 4 semanas</tspan></text><rect x="350.0" y="800.0" width="198.0" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="449.0" y="814.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="449.0" dy="0">0-4 sem</tspan></text><line x1="330.0" y1="810.0" x2="346.0" y2="810.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><rect x="40.0" y="829.0" width="920.0" height="32.0" rx="8" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="50.0" y="844.0" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Este caso: sin remisión</tspan></text><text x="50.0" y="858.0" font-size="10.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">biopsia renal</tspan></text><rect x="746.0" y="836.0" width="99.0" height="20.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0"/><text x="795.5" y="850.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="91"><tspan x="795.5" dy="0">8-10 sem</tspan></text><line x1="330.0" y1="846.0" x2="742.0" y2="846.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><line x1="350.0" y1="871.0" x2="944.0" y2="871.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="350.0" y1="867.0" x2="350.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="350.0" dy="0">0</tspan></text><line x1="449.0" y1="867.0" x2="449.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="449.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="449.0" dy="0">2</tspan></text><line x1="548.0" y1="867.0" x2="548.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="548.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="548.0" dy="0">4</tspan></text><line x1="647.0" y1="867.0" x2="647.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="647.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="647.0" dy="0">6</tspan></text><line x1="746.0" y1="867.0" x2="746.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="746.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="746.0" dy="0">8</tspan></text><line x1="845.0" y1="867.0" x2="845.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="845.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="845.0" dy="0">10</tspan></text><line x1="944.0" y1="867.0" x2="944.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="944.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="944.0" dy="0">12</tspan></text><text x="944.0" y="905.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="300"><tspan x="944.0" dy="0">semanas de tratamiento</tspan></text><line x1="746.0" y1="715.0" x2="746.0" y2="871.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><rect x="700.6" y="698.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="746.0" y="713.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="746.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="951.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="961.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="983.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Ciclofosfamida</tspan></text><text x="491.2" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Estudio genético</tspan></text><text x="678.8" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Micofenolato</tspan></text><rect x="775.5" y="964.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Biopsia renal</tspan></text><rect x="40.0" y="998.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="998.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1019.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Ahora?</tspan></text><text x="303.8" y="1019.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: es para dependencia</tspan></text><text x="491.2" y="1019.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Complementa, no reemplaza</tspan></text><text x="678.8" y="1019.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No es primera línea</tspan></text><text x="866.2" y="1019.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="961.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1056.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1084.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1106.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sin remisión tras un curso completo de prednisona = corticorresistente: biopsia renal.</tspan><tspan x="58.0" dy="18">• La biopsia suele mostrar glomeruloesclerosis focal y segmentaria; el estudio genético se pide junto o después.</tspan><tspan x="58.0" dy="18">• Primera línea en corticorresistencia: inhibidores de calcineurina; la ciclofosfamida es para corticodependencia.</tspan></text><text x="58.0" y="1164.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO (2021); IPNA, síndrome nefrótico corticorresistente (2020); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>