sión intracraneal que no cede con las medidas</tspan><tspan x="519.0" dy="17">base?</tspan></text><rect x="40.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">OSMOTERAPIA: MANITOL 20 %</tspan></text><text x="266.5" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">0,25-1 g/kg EV en bolo</tspan><tspan x="266.5" dy="17">o solución salina hipertónica 3 %</tspan></text><rect x="507.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Medidas base</tspan></text><text x="733.5" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Cabecera a 30°, sedación, normotermia</tspan><tspan x="733.5" dy="17">Sodio 145-155 mEq/L</tspan></text><text x="40.0" y="573.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="585.5" width="358.0" height="282.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="595.5" width="142.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="609.5" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="316"><tspan x="61.0" dy="0">QUÉ HACE EL MANITOL</tspan></text><g transform="translate(54.0,623.5) scale(1.0)"><circle cx="110" cy="110" r="96" fill="#e7e5e4" stroke="#57534e" stroke-width="5" /><circle cx="110" cy="110" r="88" fill="#fbcfe8" s