<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1302" viewBox="0 0 1000 1302" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="TB bacilífera que rechaza el tratamiento y pide secreto: informar a la autoridad sanitaria"><title>TB bacilífera que rechaza el tratamiento y pide secreto: informar a la autoridad sanitaria</title><rect x="0.75" y="0.75" width="998.5" height="1300.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ética · confidencialidad y salud pública</tspan></text><rect x="431.7" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="503.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="503.5" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Límites de la confidencialidad</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El secreto profesional cede cuando hay riesgo grave para terceros.</tspan><tspan x="58.0" dy="17">La TB es de notificación obligatoria.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 35 años con TB bacilífera</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Rechaza el tratamiento y firma su negativa.</tspan><tspan x="640.0" dy="16">Vive en un cuarto pequeño con 3 compañeros; va a</tspan><tspan x="640.0" dy="16">reuniones en lugares cerrados; pide secreto.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ PESA MÁS?</tspan></text><rect x="493.0" y="335.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 540.0 H560.0 L540.0 520.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="335.0" r="11" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="353.1" x2="614.6" y2="316.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="353.1" x2="357.4" y2="415.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="353.1" x2="413.4" y2="415.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 415.1 H423.4 Q385.4 459.1 347.4 415.1 Z" fill="#ea580c"/><text x="385.4" y="430.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">elige</tspan></text><line x1="614.6" y1="316.9" x2="586.6" y2="378.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="316.9" x2="642.6" y2="378.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 378.9 H652.6 Q614.6 422.9 576.6 378.9 Z" fill="#64748b"/><text x="614.6" y="393.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">cede</tspan></text><text x="500.0" y="567.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">Secreto del paciente frente a riesgo de contagio</tspan></text><rect x="40.0" y="305.0" width="290.0" height="132.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Proteger a los demás</tspan></text><circle cx="62.0" cy="358.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="362.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">TB bacilífera: contagia</tspan></text><circle cx="62.0" cy="384.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Convivientes en cuarto cerrado</tspan></text><circle cx="62.0" cy="410.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Notificación obligatoria</tspan></text><rect x="214.6" y="294.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="305.0" width="290.0" height="132.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Guardar el secreto</tspan></text><circle cx="692.0" cy="358.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="362.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Derecho del paciente</tspan></text><circle cx="692.0" cy="384.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Pero hay riesgo grave para terceros</tspan></text><circle cx="692.0" cy="410.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">La ley permite levantarlo</tspan></text><rect x="40.0" y="601.0" width="920.0" height="76.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="629.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Informar a la autoridad sanitaria y al programa de TB</tspan></text><text x="500.0" y="650.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Ellos estudian a los contactos con la debida reserva.</tspan></text><text x="40.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="729.0" width="332.0" height="262.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="739.0" width="148.2" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="753.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="290"><tspan x="61.0" dy="0">DONDE VIVE (ESQUEMA)</tspan></text><g data-box="54.0 767.0 304.0 200.0"><g transform="translate(54.0,767.0) scale(0.95)"><rect x="10" y="20" width="300" height="160" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="3"/><circle cx="70" cy="92" r="13" fill="#fde7d4" stroke="#e9b48f" stroke-width="1.5" /><path d="M54 150 C54 110 86 110 86 150 Z" fill="#ea580c" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" /><circle cx="150" cy="92" r="13" fill="#fde7d4" stroke="#e9b48f" stroke-width="1.5" /><path d="M134 150 C134 110 166 110 166 150 Z" fill="#bfdbfe" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" /><circle cx="210" cy="92" r="13" fill="#fde7d4" stroke="#e9b48f" stroke-width="1.5" /><path d="M194 150 C194 110 226 110 226 150 Z" fill="#bfdbfe" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" /><circle cx="270" cy="92" r="13" fill="#fde7d4" stroke="#e9b48f" stroke-width="1.5" /><path d="M254 150 C254 110 286 110 286 150 Z" fill="#bfdbfe" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" /><circle cx="100" cy="70" r="3" fill="#dc2626" stroke="none" stroke-width="0" opacity="0.6"/><circle cx="118" cy="80" r="3" fill="#dc2626" stroke="none" stroke-width="0" opacity="0.6"/><circle cx="136" cy="70" r="3" fill="#dc2626" stroke="none" stroke-width="0" opacity="0.6"/><circle cx="154" cy="80" r="3" fill="#dc2626" stroke="none" stroke-width="0" opacity="0.6"/><circle cx="172" cy="70" r="3" fill="#dc2626" stroke="none" stroke-width="0" opacity="0.6"/><circle cx="190" cy="80" r="3" fill="#dc2626" stroke="none" stroke-width="0" opacity="0.6"/><circle cx="208" cy="70" r="3" fill="#dc2626" stroke="none" stroke-width="0" opacity="0.6"/><text x="70" y="170" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">con TB</text><text x="70" y="170" font-size="10" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">con TB</text><text x="210" y="170" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">3 convivientes</text><text x="210" y="170" font-size="10" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">3 convivientes</text><text x="160" y="202" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">cuarto pequeño y cerrado: alto contagio</text><text x="160" y="202" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle" data-max="0">cuarto pequeño y cerrado: alto contagio</text></g></g><rect x="394.0" y="729.0" width="566.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="412.0" cy="744.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="412.0" y="748.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="412.0" dy="0">1</tspan></text><text x="430.0" y="749.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="522"><tspan x="430.0" dy="0">Cuarto pequeño compartido con 3 personas.</tspan></text><rect x="394.0" y="767.0" width="566.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="412.0" cy="782.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="412.0" y="786.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="412.0" dy="0">2</tspan></text><text x="430.0" y="787.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="430.0" dy="0">Además va a reuniones en lugares cerrados.</tspan></text><rect x="394.0" y="805.0" width="566.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="412.0" cy="820.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="412.0" y="824.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="412.0" dy="0">3</tspan></text><text x="430.0" y="825.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="522"><tspan x="430.0" dy="0">Alto riesgo de contagio.</tspan></text><text x="40.0" y="1031.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1041.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1072.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1072.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Alta voluntaria y derivar</tspan></text><text x="491.2" y="1063.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Informar él mismo a los</tspan><tspan x="491.2" dy="17">convivientes</tspan></text><text x="678.8" y="1072.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Respetar y documentar</tspan></text><rect x="775.5" y="1044.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="1063.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Informar a la autoridad</tspan><tspan x="866.2" dy="17">sanitaria</tspan></text><rect x="40.0" y="1095.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="1095.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1116.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1116.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Abandona el caso</tspan></text><text x="491.2" y="1116.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No le corresponde así</tspan></text><text x="678.8" y="1116.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Deja el riesgo</tspan></text><text x="866.2" y="1116.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Ninguno</tspan></text><rect x="40.0" y="1041.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1153.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1181.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1203.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Informar a la autoridad de salud y al equipo de control de TB (notificación y estudio de contactos).</tspan><tspan x="58.0" dy="18">• No es revelar su diagnóstico a los convivientes por cuenta propia ni darle el alta.</tspan><tspan x="58.0" dy="18">• Seguir buscando su aceptación del tratamiento.</tspan></text><text x="58.0" y="1261.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ley General de Salud (Ley 26842); MINSA Perú, norma de tuberculosis.</tspan></text></svg>