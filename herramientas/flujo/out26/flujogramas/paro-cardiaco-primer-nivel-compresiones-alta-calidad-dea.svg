<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1128" viewBox="0 0 1000 1128" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Paro cardiaco en el primer nivel: compresiones de alta calidad y DEA cuanto antes"><title>Paro cardiaco en el primer nivel: compresiones de alta calidad y DEA cuanto antes</title><rect x="0.75" y="0.75" width="998.5" height="1126.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reanimación cardiopulmonar · soporte básico</tspan></text><rect x="473.4" y="32.0" width="132.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="539.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="116"><tspan x="539.5" dy="0">CARDIOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Soporte vital básico con DEA</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lo que más salva cerebro: compresiones inmediatas, con pocas pausas, y desfibrilar</tspan><tspan x="58.0" dy="17">pronto.</tspan><tspan x="58.0" dy="17">El DEA analiza y descarga; las compresiones solo se detienen para eso.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 65 años en paro, centro de salud</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hay AMBU, oxígeno y DEA; nadie entrenado en ACLS.</tspan><tspan x="640.0" dy="16">¿Qué secuencia seguir?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EL CICLO DE LA REANIMACIÓN</tspan></text><rect x="40.0" y="269.0" width="308.0" height="437.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="219.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">COMPRESIONES Y PARCHES DEL DEA</tspan></text><g transform="translate(74.0,307.0) scale(0.72)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde2e2" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><rect x="78" y="96" width="26" height="18" rx="3" fill="#fde047" stroke="#a16207" stroke-width="1.5"/><rect x="156" y="148" width="26" height="18" rx="3" fill="#fde047" stroke="#a16207" stroke-width="1.5"/><path d="M91 96 C80 70 40 70 20 60 M169 148 C196 120 212 90 222 60" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" /><circle cx="120" cy="130" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="120" y="134" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="91" cy="105" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="91" y="109" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><text x="54.0" y="653.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="54.0" dy="0">1 compresiones en el centro del tórax; 2 parches del</tspan><tspan x="54.0" dy="15">DEA (debajo de la clavícula derecha y en el costado</tspan><tspan x="54.0" dy="15">izquierdo).</tspan></text><ellipse cx="662.0" cy="426.0" rx="206.0" ry="120.0" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><polygon points="791.4,332.4 774.8,333.0 780.3,320.1" fill="#0f766e"/><polygon points="853.5,470.9 854.7,454.4 867.0,461.3" fill="#0f766e"/><polygon points="653.0,546.0 668.0,539.0 668.0,553.0" fill="#0f766e"/><polygon points="461.7,455.2 475.1,464.9 462.9,471.7" fill="#0f766e"/><polygon points="549.2,325.4 538.1,337.7 532.7,324.8" fill="#0f766e"/><text x="662.0" y="430.0" font-size="12.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="220"><tspan x="662.0" dy="0">RCP básica con DEA</tspan></text><rect x="574.0" y="279.0" width="176.0" height="54.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><circle cx="576.0" cy="281.0" r="11" fill="#7c2d12" stroke="none" stroke-width="0"/><text x="576.0" y="285.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="576.0" dy="0">1</tspan></text><text x="662.0" y="301.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">Compresiones ya</tspan></text><text x="662.0" y="317.0" font-size="10.5" font-weight="500" font-style="normal" fill="#fff7ed" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">100-120/min, 5-6 cm</tspan></text><rect x="616.6" y="322.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="662.0" y="337.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">◆ ESTE CASO</tspan></text><rect x="769.9" y="361.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="771.9" cy="363.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="771.9" y="367.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="771.9" dy="0">2</tspan></text><text x="857.9" y="383.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">Colocar el DEA</tspan></text><text x="857.9" y="399.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">apenas llegue</tspan></text><rect x="695.1" y="496.1" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="697.1" cy="498.1" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="697.1" y="502.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="697.1" dy="0">3</tspan></text><text x="783.1" y="518.1" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">Analizar el ritmo</tspan></text><text x="783.1" y="534.1" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">pausa mínima</tspan></text><rect x="452.9" y="496.1" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="454.9" cy="498.1" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="454.9" y="502.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="454.9" dy="0">4</tspan></text><text x="540.9" y="518.1" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">Descarga si la indica</tspan></text><text x="540.9" y="534.1" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">y seguir comprimiendo</tspan></text><rect x="378.1" y="361.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="380.1" cy="363.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="380.1" y="367.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="380.1" dy="0">5</tspan></text><text x="466.1" y="383.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">2 minutos de RCP</tspan></text><text x="466.1" y="399.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">30:2 con AMBU</tspan></text><text x="40.0" y="738.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="748.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="749.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="772.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Oxígeno y vía venosa primero</tspan></text><text x="58.0" y="793.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Retrasa las compresiones.</tspan></text><rect x="351.3" y="748.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="749.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="772.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Trasladar en paro</tspan></text><text x="369.3" y="793.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">La RCP en movimiento es de mala calidad.</tspan></text><rect x="662.7" y="748.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="749.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="772.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">DEA antes de comprimir</tspan></text><text x="680.7" y="793.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No se espera al DEA para empezar.</tspan></text><text x="40.0" y="857.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="867.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="898.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="870.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="889.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Compresiones + DEA</tspan><tspan x="303.8" dy="17">apenas llegue</tspan></text><text x="491.2" y="889.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Oxígeno y adrenalina</tspan><tspan x="491.2" dy="17">primero</tspan></text><text x="678.8" y="898.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Trasladar comprimiendo</tspan></text><text x="866.2" y="889.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">DEA primero, luego</tspan><tspan x="866.2" dy="17">compresiones</tspan></text><rect x="40.0" y="921.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="921.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="942.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="942.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Ninguno</tspan></text><text x="491.2" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Retrasa las compresiones</tspan></text><text x="678.8" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">RCP de mala calidad</tspan></text><text x="866.2" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Retrasa las compresiones</tspan></text><rect x="40.0" y="867.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="979.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1007.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1029.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Empezar compresiones de inmediato (100-120/min, 5-6 cm, dejar que el tórax vuelva).</tspan><tspan x="58.0" dy="18">• Colocar el DEA apenas esté disponible; pausar solo para analizar y descargar; reanudar enseguida 2 minutos.</tspan><tspan x="58.0" dy="18">• Ventilar con AMBU 30:2; la vía venosa y la adrenalina vienen después y no deben interrumpir la RCP.</tspan></text><text x="58.0" y="1087.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA, guías de reanimación (2020-2025); ILCOR.</tspan></text></svg>