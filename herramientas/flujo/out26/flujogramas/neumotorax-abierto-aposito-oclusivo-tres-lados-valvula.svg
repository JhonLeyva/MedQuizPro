<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1031" viewBox="0 0 1000 1031" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Neumotórax abierto: apósito oclusivo fijado en tres lados"><title>Neumotórax abierto: apósito oclusivo fijado en tres lados</title><rect x="0.75" y="0.75" width="998.5" height="1029.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma de tórax · neumotórax abierto</tspan></text><rect x="422.8" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="473.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="473.5" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="168.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neumotórax abierto (herida soplante)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El aire entra por la herida en cada inspiración y colapsa el pulmón.</tspan><tspan x="58.0" dy="17">Con pocos recursos se improvisa una válvula de un solo sentido.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="168.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="166.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 25 años con puñalada en el hemitórax</tspan><tspan x="640.0" dy="17">derecho</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Entrada y salida de aire por la herida; SatO₂ 88 %, FR</tspan><tspan x="640.0" dy="16">32.</tspan><tspan x="640.0" dy="16">Sin tubos de tórax ni ventilador; hay que referir.</tspan></text><rect x="640.0" y="229.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="242.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="242.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="290.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO FUNCIONA EL PARCHE DE TRES LADOS</tspan></text><rect x="40.0" y="302.0" width="478.0" height="324.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="312.0" width="141.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="326.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">PARCHE EN LA HERIDA</tspan></text><g transform="translate(54.0,340.0) scale(1.0)"><path d="M20 20 Q100 0 180 20 L186 200 L14 200 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M100 20 L100 200" fill="none" stroke="#e9b48f" stroke-width="1.5" stroke-linejoin="round" /><rect x="36" y="86" width="44" height="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5" opacity="0.9"/><circle cx="58" cy="108" r="6" fill="#7f1d1d" stroke="none" stroke-width="0" /><path d="M34 84 H82 M82 84 V132 M34 84 V132" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linejoin="round" /><text x="58" y="150" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">lado libre</text><text x="58" y="150" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">lado libre</text><text x="100" y="196" font-size="10" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">Hemitórax derecho</text><rect x="212" y="20" width="108" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/><path d="M232 60 L232 130" fill="none" stroke="#e9b48f" stroke-width="8" stroke-linejoin="round" /><path d="M238 60 L238 130" fill="none" stroke="#0369a1" stroke-width="4" stroke-linejoin="round" /><line x1="292.0" y1="95.0" x2="254.0" y2="95.0" stroke="#94a3b8" stroke-width="2"/><polygon points="246.0,95.0 255.0,90.7 255.0,99.3" fill="#94a3b8"/><text x="272" y="88" font-size="16" font-weight="800" fill="#dc2626" text-anchor="middle" data-max="0">✕</text><text x="266" y="150.0" font-size="9.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">el parche se pega:</text><text x="266" y="150.0" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle" data-max="0">el parche se pega:</text><text x="266" y="162.35" font-size="9.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">no entra aire</text><text x="266" y="162.35" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle" data-max="0">no entra aire</text><text x="266" y="40" font-size="11.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Inspira:</text><text x="266" y="40" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Inspira:</text><rect x="330" y="20" width="108" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/><path d="M350 60 L350 130" fill="none" stroke="#e9b48f" stroke-width="8" stroke-linejoin="round" /><path d="M356 60 L356 100 L380 128" fill="none" stroke="#0369a1" stroke-width="4" stroke-linejoin="round" /><line x1="340.0" y1="112.0" x2="412.4" y2="137.4" stroke="#ea580c" stroke-width="2.4"/><polygon points="420.0,140.0 410.1,141.1 412.9,132.9" fill="#ea580c"/><text x="384" y="150.0" font-size="9.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">el aire sale por</text><text x="384" y="150.0" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle" data-max="0">el aire sale por</text><text x="384" y="162.35" font-size="9.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">el lado libre</text><text x="384" y="162.35" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle" data-max="0">el lado libre</text><text x="384" y="40" font-size="11.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Espira:</text><text x="384" y="40" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Espira:</text></g><text x="54.0" y="566.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="450"><tspan x="54.0" dy="0">Cinta en tres lados (naranja); el cuarto lado queda libre.</tspan></text><ellipse cx="747.0" cy="459.0" rx="114.0" ry="120.0" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><polygon points="833.8,380.7 818.4,374.6 828.6,365.0" fill="#0f766e"/><polygon points="821.4,550.4 826.7,534.7 836.8,544.3" fill="#0f766e"/><polygon points="660.2,537.3 675.6,543.4 665.4,553.0" fill="#0f766e"/><polygon points="672.6,367.6 667.3,383.3 657.2,373.7" fill="#0f766e"/><text x="747.0" y="454.5" font-size="12.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="125"><tspan x="747.0" dy="0">Válvula de un solo</tspan><tspan x="747.0" dy="17">sentido</tspan></text><rect x="652.0" y="312.0" width="190.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="654.0" cy="314.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="654.0" y="318.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="654.0" dy="0">1</tspan></text><text x="747.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="170"><tspan x="747.0" dy="0">Inspira</tspan></text><text x="747.0" y="350.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="170"><tspan x="747.0" dy="0">el tórax aspira aire</tspan></text><rect x="766.0" y="432.0" width="190.0" height="54.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><circle cx="768.0" cy="434.0" r="11" fill="#7c2d12" stroke="none" stroke-width="0"/><text x="768.0" y="438.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="768.0" dy="0">2</tspan></text><text x="861.0" y="454.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="170"><tspan x="861.0" dy="0">El parche se pega</tspan></text><text x="861.0" y="470.0" font-size="10.5" font-weight="500" font-style="normal" fill="#fff7ed" text-anchor="middle" data-max="170"><tspan x="861.0" dy="0">sella la herida: no entra aire</tspan></text><rect x="815.6" y="475.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="861.0" y="490.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="861.0" dy="0">◆ ESTE CASO</tspan></text><rect x="652.0" y="552.0" width="190.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="654.0" cy="554.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="654.0" y="558.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="654.0" dy="0">3</tspan></text><text x="747.0" y="574.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="170"><tspan x="747.0" dy="0">Espira</tspan></text><text x="747.0" y="590.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="170"><tspan x="747.0" dy="0">sube la presión en la pleura</tspan></text><rect x="538.0" y="432.0" width="190.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="540.0" cy="434.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="540.0" y="438.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="540.0" dy="0">4</tspan></text><text x="633.0" y="454.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="170"><tspan x="633.0" dy="0">Sale el aire</tspan></text><text x="633.0" y="470.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="170"><tspan x="633.0" dy="0">por el lado libre del parche</tspan></text><text x="40.0" y="658.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LO QUE NO SE DEBE HACER</tspan></text><rect x="40.0" y="668.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="669.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="692.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Sellar los 4 lados</tspan></text><text x="58.0" y="713.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">El aire no sale: neumotórax a tensión.</tspan></text><rect x="351.3" y="668.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="669.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="692.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Gasa suelta o nada</tspan></text><text x="369.3" y="713.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Sigue entrando aire.</tspan></text><rect x="662.7" y="668.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="663.7" y="669.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="680.7" y="692.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Lo correcto</tspan></text><text x="680.7" y="713.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">O₂ + parche de 3 lados + referencia urgente.</tspan></text><rect x="860.2" y="657.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="672.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="777.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="787.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="809.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="809.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">O₂ sin tocar la herida</tspan></text><text x="491.2" y="809.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">AMBU + sellar 4 lados</tspan></text><rect x="588.0" y="790.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="809.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">O₂ + parche de 3 lados</tspan></text><text x="866.2" y="809.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">AMBU + gasas sueltas</tspan></text><rect x="40.0" y="824.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="824.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="845.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sigue entrando aire</tspan></text><text x="491.2" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Riesgo de tensión</tspan></text><text x="678.8" y="845.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Ninguno</tspan></text><text x="866.2" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No corrige la entrada de aire</tspan></text><rect x="40.0" y="787.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="882.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="910.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="932.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Apósito cuadrado fijado en tres lados: sella al inspirar y deja salir el aire al espirar.</tspan><tspan x="58.0" dy="18">• Sellar los cuatro lados puede convertirlo en un neumotórax a tensión.</tspan><tspan x="58.0" dy="18">• Oxígeno, referencia urgente y tubo de tórax (en otro sitio, no por la herida) en el hospital.</tspan></text><text x="58.0" y="990.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025).</tspan></text></svg>