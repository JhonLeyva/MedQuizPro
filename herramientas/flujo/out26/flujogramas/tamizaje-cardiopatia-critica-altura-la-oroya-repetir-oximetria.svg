<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tamizaje de cardiopatía congénita crítica en la altura: zona intermedia, repetir en 1 hora"><title>Tamizaje de cardiopatía congénita crítica en la altura: zona intermedia, repetir en 1 hora</title><rect x="0.75" y="0.75" width="998.5" height="998.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · tamizaje con oximetría de pulso</tspan></text><rect x="476.8" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="533.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="533.3" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tamizaje de cardiopatía congénita crítica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Oximetría en la mano derecha (preductal) y un pie (postductal).</tspan><tspan x="58.0" dy="17">En la altura la saturación normal es menor: el algoritmo peruano ajusta los puntos de corte.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Neonato de 4 días en La Oroya (3745 msnm)</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Estable, sin quejido ni tiraje, buena perfusión.</tspan><tspan x="640.0" dy="16">SatO₂ preductal 87 % y postductal 86 %, bien medidas</tspan><tspan x="640.0" dy="16">y repetidas.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">IMAGEN DEL CASO Y SEMÁFORO DE CONDUCTA</tspan></text><rect x="40.0" y="285.0" width="310.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="103.6" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">DÓNDE SE MIDE</tspan></text><g transform="translate(74.0,325.0) scale(0.95)"><path d="M76 128 C72 110 168 110 164 128 L172 222 C160 248 80 248 68 222 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M72 180 H168 L172 222 C160 248 80 248 68 222 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M76 132 L40 170 L52 184 L82 156 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M164 132 L200 170 L188 184 L158 156 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="44" cy="182" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="196" cy="182" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M84 236 L70 300 L94 304 L108 244 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156 236 L170 300 L146 304 L132 244 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="80" cy="308" rx="14" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><ellipse cx="160" cy="308" rx="14" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="120" cy="70" r="54" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="100" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><circle cx="140" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><path d="M110 96 Q120 102 130 96" fill="none" stroke="#9a6b52" stroke-width="2"/><path d="M116 76 Q120 86 124 76" fill="none" stroke="#9a6b52" stroke-width="2" stroke-linejoin="round" /><circle cx="120" cy="214" r="3" fill="#9a6b52" stroke="none" stroke-width="0" /><circle cx="40" cy="180" r="9" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" /><text x="40" y="206" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">pre 87 %</text><text x="40" y="206" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="middle" data-max="0">pre 87 %</text><circle cx="160" cy="308" r="9" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" /><text x="186" y="326" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">post 86 %</text><text x="186" y="326" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="middle" data-max="0">post 86 %</text></g><rect x="48.0" y="637.0" width="294.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="195.0" y="658.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">Mano derecha (preductal) y pie (postductal):</tspan><tspan x="195.0" dy="15">diferencia de 1 %.</tspan></text><text x="370.0" y="297.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="590"><tspan x="370.0" dy="0">DATOS DEL CASO</tspan></text><rect x="370.0" y="307.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="321.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="325.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="325.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Estable, sin quejido ni tiraje</tspan></text><rect x="370.0" y="339.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="353.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="357.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="357.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Buena perfusión periférica</tspan></text><rect x="370.0" y="371.0" width="590.0" height="28.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="386.0" cy="385.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="386.0" y="389.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">!</tspan></text><text x="404.0" y="389.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">SatO₂ 87 % y 86 %: zona intermedia a 3745 msnm</tspan></text><rect x="370.0" y="403.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="417.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="421.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="421.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Medición confiable y repetida</tspan></text><rect x="370.0" y="445.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="478.0" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="478.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Sobre el umbral de la altitud</tspan></text><text x="430.0" y="484.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Pasa el tamizaje</tspan></text><text x="430.0" y="500.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Alta con controles habituales.</tspan></text><rect x="370.0" y="519.0" width="590.0" height="66.0" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.2"/><circle cx="400.0" cy="552.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="552.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="541.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Zona intermedia, sin síntomas</tspan></text><text x="430.0" y="558.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Repetir en 1 hora</tspan></text><text x="430.0" y="574.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hasta 3 veces; si persiste: referir.</tspan></text><rect x="854.6" y="508.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="523.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ ESTE CASO</tspan></text><rect x="370.0" y="593.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="626.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="626.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="615.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Bajo el umbral o con síntomas</tspan></text><text x="430.0" y="632.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Referir ya</tspan></text><text x="430.0" y="648.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Ecocardiografía; prostaglandina si hay cardiopatía ductus dependiente.</tspan></text><text x="40.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="739.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="770.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Rx de tórax y luego</tspan><tspan x="303.8" dy="17">decidir</tspan></text><text x="491.2" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Referir para</tspan><tspan x="491.2" dy="17">prostaglandina</tspan></text><rect x="588.0" y="742.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Repetir en 1 hora</tspan></text><text x="866.2" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Referir para eco urgente</tspan></text><rect x="40.0" y="793.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="793.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="814.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Adecuada ahora?</tspan></text><text x="303.8" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: no define cardiopatía</tspan></text><text x="491.2" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: sin sospecha clara</tspan></text><text x="678.8" y="814.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí</tspan></text><text x="866.2" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Aún no: zona intermedia</tspan></text><rect x="40.0" y="739.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="851.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="879.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="901.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• En la altura, valores en zona intermedia (85-90 % en La Oroya) sin síntomas: repetir la oximetría en 1 hora.</tspan><tspan x="58.0" dy="18">• Si sigue en zona intermedia (hasta 3 mediciones) o baja del umbral: referir para ecocardiografía.</tspan><tspan x="58.0" dy="18">• Si hay cianosis, dificultad respiratoria o mala perfusión, no se espera: se estabiliza y se refiere.</tspan></text><text x="58.0" y="959.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú y Sociedad Peruana de Pediatría, tamizaje de cardiopatía congénita crítica en la altura; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>