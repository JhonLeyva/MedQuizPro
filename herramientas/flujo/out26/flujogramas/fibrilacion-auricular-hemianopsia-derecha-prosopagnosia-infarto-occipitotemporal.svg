<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1026" viewBox="0 0 1000 1026" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hemianopsia homónima derecha con prosopagnosia por embolia: infarto cortical occipitotemporal"><title>Hemianopsia homónima derecha con prosopagnosia por embolia: infarto cortical occipitotemporal</title><rect x="0.75" y="0.75" width="998.5" height="1024.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedad cerebrovascular · localización</tspan></text><rect x="452.3" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="516.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="516.6" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Territorio de la arteria cerebral posterior</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Corteza occipital: campo visual del lado opuesto.</tspan><tspan x="58.0" dy="17">Región occipitotemporal (giro fusiforme): reconocer caras.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 55 años con FA no anticoagulada</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hace 10 h, de forma súbita, no ve su lado derecho.</tspan><tspan x="640.0" dy="16">Hemianopsia homónima derecha, desorientación en</tspan><tspan x="640.0" dy="16">ese hemicampo y no reconoce caras; sin déficit motor</tspan><tspan x="640.0" dy="16">ni sensitivo.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ZONA EXPLICA CADA SÍNTOMA</tspan></text><rect x="40.0" y="301.0" width="440.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="154.5" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">TC DEL CASO (ESQUEMA)</tspan></text><g transform="translate(52.0,335.0) scale(1.0)"><rect x="0" y="0" width="280" height="260" rx="10" fill="#0b1220"/><ellipse cx="140" cy="132" rx="116" ry="118" fill="#e5e7eb" stroke="none" stroke-width="0" /><ellipse cx="140" cy="132" rx="106" ry="108" fill="#6b7280" stroke="none" stroke-width="0" /><path d="M119 96 C111 120 113 150 127.5 164 L136 150 L136 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><path d="M161 96 C169 120 167 150 152.5 164 L144 150 L144 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><text x="140" y="11" font-size="9" font-weight="800" fill="#94a3b8" text-anchor="middle" data-max="0">adelante</text></g><g transform="translate(52.0,335.0) scale(1.0)"><path d="M168 188 C190 200 214 196 226 176 L238 200 C220 232 180 238 156 226 Z" fill="#374151" stroke="none" stroke-width="0" stroke-linejoin="round" /><circle cx="196" cy="214" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="196" y="218" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="232" cy="166" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="232" y="170" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><circle cx="224" cy="110" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="224" y="114" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text><circle cx="150" cy="128" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="132" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">4</text><text x="200" y="252" font-size="9.5" font-weight="800" fill="#94a3b8" text-anchor="middle" data-max="0">lado izquierdo del paciente →</text></g><rect x="48.0" y="653.0" width="424.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="260.0" y="674.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="410"><tspan x="260.0" dy="0">Zona oscura: infarto occipitotemporal izquierdo (en la TC el lado izquierdo del</tspan><tspan x="260.0" dy="15">paciente queda a la derecha).</tspan></text><rect x="500.0" y="301.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="302.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">1. Corteza occipital</tspan></text><text x="518.0" y="346.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Hemianopsia homónima del lado opuesto.</tspan></text><rect x="500.0" y="380.0" width="460.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="501.0" y="381.0" width="6.0" height="67.0" rx="3" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="518.0" y="404.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">2. Región occipitotemporal (fusiforme)</tspan></text><text x="518.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Hemianopsia + no reconoce caras: este caso.</tspan></text><rect x="860.2" y="369.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="384.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="500.0" y="459.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="460.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="483.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">3. Corteza parietal posterior</tspan></text><text x="518.0" y="504.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Negligencia o apraxia; aquí no.</tspan></text><rect x="500.0" y="538.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="539.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="562.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">4. Tálamo profundo</tspan></text><text x="518.0" y="583.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Déficit sensitivo; aquí no.</tspan></text><text x="40.0" y="755.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="765.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="796.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="796.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Parietal posterior</tspan></text><text x="491.2" y="796.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Parietal</tspan></text><text x="678.8" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Talámico y occipital</tspan><tspan x="678.8" dy="17">profundo</tspan></text><rect x="775.5" y="768.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="796.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Cortical occipitotemporal</tspan></text><rect x="40.0" y="819.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="819.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="840.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Explica todo?</tspan></text><text x="303.8" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: habría déficit sensitivo</tspan></text><text x="866.2" y="840.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="765.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="877.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="905.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="927.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hemianopsia homónima derecha = corteza occipital izquierda.</tspan><tspan x="58.0" dy="18">• Prosopagnosia = corteza occipitotemporal (fusiforme): el territorio es cortical occipitotemporal.</tspan><tspan x="58.0" dy="18">• Sin déficit motor ni sensitivo: no es tálamo profundo ni parietal extenso.</tspan></text><text x="58.0" y="985.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ASA, ictus isquémico (2019); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>