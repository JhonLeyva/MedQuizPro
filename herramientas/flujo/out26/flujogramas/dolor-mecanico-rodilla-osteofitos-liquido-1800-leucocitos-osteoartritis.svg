<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1069" viewBox="0 0 1000 1069" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dolor mecánico de rodilla con osteofitos y líquido sinovial no inflamatorio: osteoartritis"><title>Dolor mecánico de rodilla con osteofitos y líquido sinovial no inflamatorio: osteoartritis</title><rect x="0.75" y="0.75" width="998.5" height="1067.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reumatología · artrosis de rodilla</tspan></text><rect x="397.5" y="32.0" width="242.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="518.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="226"><tspan x="518.7" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Líquido sinovial</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">&lt; 2 000 leucocitos: no inflamatorio (artrosis, trauma).</tspan><tspan x="58.0" dy="17">2 000-50 000: inflamatorio (AR, gota); &gt; 50 000: séptico hasta demostrar lo contrario.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 60 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">2 meses de dolor de rodilla al iniciar el movimiento que</tspan><tspan x="640.0" dy="16">cede con el reposo; sin calor ni eritema.</tspan><tspan x="640.0" dy="16">Rx: pinzamiento medial y osteofitos; líquido: amarillo,</tspan><tspan x="640.0" dy="16">glucosa 82, leucocitos 1 800, 20 % PMN.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE SUMAN LOS DATOS</tspan></text><rect x="40.0" y="301.0" width="250.0" height="470.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="116.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">LÍQUIDO SINOVIAL</tspan></text><g transform="translate(56.0,341.0) scale(1.0)"><rect x="80" y="49" width="44" height="28" fill="#fecaca"/><rect x="80" y="77" width="44" height="131" fill="#fde68a"/><rect x="80" y="208" width="44" height="122" fill="#bbf7d0"/><text x="130" y="66.86078104674912" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">séptico</text><text x="130" y="66.86078104674912" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="start" data-max="0">séptico</text><text x="130" y="146.5" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">inflamatorio</text><text x="130" y="146.5" font-size="10.5" font-weight="800" fill="#a16207" text-anchor="start" data-max="0">inflamatorio</text><text x="130" y="273.01421895325086" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">no inflamatorio</text><text x="130" y="273.01421895325086" font-size="10.5" font-weight="800" fill="#15803d" text-anchor="start" data-max="0">no inflamatorio</text><text x="74" y="334.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">100</text><text x="74" y="212.02843790650175" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">2 000</text><text x="74" y="80.97156209349825" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">50 000</text><path d="M70 212 L134 212" fill="none" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" /><circle cx="102" cy="212.31820264656506" r="6" fill="#ea580c" stroke="#7c2d12" stroke-width="2" /><text x="102" y="236.31820264656506" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">1 800: este caso</text><text x="102" y="236.31820264656506" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">1 800: este caso</text><text x="102" y="16" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Leucocitos en el líquido</text><text x="102" y="16" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">Leucocitos en el líquido</text></g><rect x="48.0" y="723.0" width="234.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="165.0" y="744.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="220"><tspan x="165.0" dy="0">Escala logarítmica: 1 800 cae en la zona</tspan><tspan x="165.0" dy="15">no inflamatoria.</tspan></text><circle cx="326.0" cy="323.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="328.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">1</tspan></text><rect x="350.0" y="301.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="302.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Tipo de dolor</tspan></text><text x="368.0" y="346.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Mecánico: aparece al moverse, cede con reposo.</tspan></text><circle cx="326.0" cy="404.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="409.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">2</tspan></text><rect x="350.0" y="382.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="383.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="406.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Radiografía</tspan></text><text x="368.0" y="427.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Pinzamiento y osteofitos.</tspan></text><circle cx="326.0" cy="485.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="490.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">3</tspan></text><rect x="350.0" y="463.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="464.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="487.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Leucocitos</tspan></text><text x="368.0" y="508.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">1 800/mm³: &lt; 2 000, no inflamatorio.</tspan></text><circle cx="326.0" cy="566.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="571.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">4</tspan></text><rect x="350.0" y="544.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="545.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="568.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Neutrófilos y glucosa</tspan></text><text x="368.0" y="589.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">20 % PMN; glucosa normal.</tspan></text><circle cx="326.0" cy="647.0" r="14" fill="#0f766e" stroke="none" stroke-width="0"/><text x="326.0" y="652.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">5</tspan></text><rect x="350.0" y="625.0" width="610.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="351.0" y="626.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="368.0" y="649.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Resultado</tspan></text><text x="368.0" y="670.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Osteoartritis.</tspan></text><rect x="860.2" y="614.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="629.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="815.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="825.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="847.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="847.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Artritis reumatoide</tspan></text><text x="491.2" y="847.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Artritis infecciosa</tspan></text><rect x="588.0" y="828.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="847.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Osteoartritis</tspan></text><text x="866.2" y="847.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Gota aguda</tspan></text><rect x="40.0" y="862.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="862.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="883.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Líquido esperado</tspan></text><text x="303.8" y="883.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Inflamatorio</tspan></text><text x="491.2" y="883.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Séptico</tspan></text><text x="678.8" y="883.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No inflamatorio</tspan></text><text x="866.2" y="883.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Inflamatorio con cristales</tspan></text><rect x="40.0" y="825.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="920.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="948.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="970.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dolor mecánico + pinzamiento y osteofitos + líquido no inflamatorio = osteoartritis.</tspan><tspan x="58.0" dy="18">• La gota tendría cristales y líquido inflamatorio; la séptica, &gt; 50 000 con glucosa baja.</tspan><tspan x="58.0" dy="18">• Tratamiento: ejercicio, bajar de peso, analgesia; infiltración si hay derrame doloroso.</tspan></text><text x="58.0" y="1028.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR, osteoartritis (2019); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>