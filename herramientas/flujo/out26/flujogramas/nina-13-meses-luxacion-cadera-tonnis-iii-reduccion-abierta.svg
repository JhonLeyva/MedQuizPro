"#475569" text-anchor="middle" data-max="320"><tspan x="215.0" dy="0">Cabeza femoral derecha fuera del acetábulo, arriba y afuera.</tspan></text><rect x="410.0" y="301.0" width="550.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="411.0" y="302.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="428.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Reducción abierta</tspan></text><text x="428.0" y="346.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Luxación alta que no reduce, en niña que camina.</tspan></text><rect x="860.2" y="290.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="305.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="410.0" y="380.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="381.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="404.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Arnés de Pavlik o Frejka</tspan></text><text x="428.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Solo en los primeros meses.</tspan></text><rect x="410.0" y="459.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="460.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="483.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Yeso corto</tspan></text><text x="428.0" y="504.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">No reduce la cadera.</tspan></text><text x="40.0" y="685.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EDAD (MESES)</tspan></text><line x1="350.0" y1="717.0" x2="350.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="449.0" y1="717.0" x2="449.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="548.0" y1="717.0" x2="548.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="647.0" y1="717.0" x2="647.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="746.0" y1="717.0" x2="746.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="845.0" y1="717.0" x2="845.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="717.0" x2="944.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><text x="50.0" y="736.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Arnés de Pavlik</tspan></text><text x="50.0" y="750.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">hasta los 6 meses</tspan></text><rect x="350.0" y="728.0" width="148.5" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="424.2" y="742.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="140"><tspan x="424.2" dy="0">0-6 m</tspan></text><line x1="330.0" y1="738.0" x2="346.0" y2="738.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="772.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Reducción cerrada + yeso</tspan></text><text x="50.0" y="786.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">si la cadera reduce</tspan></text><rect x="498.5" y="764.0" width="297.0" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="647.0" y="778.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="289"><tspan x="647.0" dy="0">6-18 m</tspan></text><line x1="330.0" y1="774.0" x2="494.5" y2="774.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><rect x="40.0" y="793.0" width="920.0" height="32.0" rx="8" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="50.0" y="808.0" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Reducción abierta</tspan></text><text x="50.0" y="822.0" font-size="10.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">luxación alta o falla la cerrada</tspan></text><rect x="647.0" y="800.0" width="297.0" height="20.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0"/><text x="795.5" y="814.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="289"><tspan x="795.5" dy="0">12-24 m</tspan></text><line x1="330.0" y1="810.0" x2="643.0" y2="810.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="844.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">«Doble pañal»</tspan></text><text x="50.0" y="858.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">no trata la luxación</tspan></text><rect x="647.0" y="836.0" width="148.5" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="721.2" y="850.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="140"><tspan x="721.2" dy="0">12-18 m</tspan></text><line x1="330.0" y1="846.0" x2="643.0" y2="846.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><line x1="350.0" y1="871.0" x2="944.0" y2="871.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="350.0" y1="867.0" x2="350.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="350.0" dy="0">0</tspan></text><line x1="449.0" y1="867.0" x2="449.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="449.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="449.0" dy="0">4</tspan></text><line x1="548.0" y1="867.0" x2="548.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="548.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="548.0" dy="0">8</tspan></text><line x1="647.0" y1="867.0" x2="647.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="647.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="647.0" dy="0">12</tspan></text><line x1="746.0" y1="867.0" x2="746.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="746.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="746.0" dy="0">16</tspan></text><line x1="845.0" y1="867.0" x2="845.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="845.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="845.0" dy="0">20</tspan></text><line x1="944.0" y1="867.0" x2="944.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="944.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="944.0" dy="0">24</tspan></text><text x="944.0" y="905.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="300"><tspan x="944.0" dy="0">meses de vida</tspan></text><line x1="671.8" y1="715.0" x2="671.8" y2="871.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><rect x="626.3" y="698.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="671.8" y="713.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="671.8" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="951.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="961.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="983.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Bota de yeso corta</tspan></text><text x="491.2" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Arnés de Pavlik</tspan></text><text x="678.8" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Cojín de Frejka</tspan></text><rect x="775.5" y="964.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Reducción abierta</tspan></text><rect x="40.0" y="998.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="998.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1019.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1019.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No actúa en la cadera</tspan></text><text x="491.2" y="1019.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Solo &lt; 6 meses</tspan></text><text x="678.8" y="1019.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Solo en lactantes pequeños</tspan></text><text x="866.2" y="1019.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Ninguno</tspan></text><rect x="40.0" y="961.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1056.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1084.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1106.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Luxación alta en una niña que ya camina: reducción abierta (a veces con osteotomía).</tspan><tspan x="58.0" dy="18">• El arnés de Pavlik sirve hasta los 6 meses; el «doble pañal» no trata una luxación.</tspan><tspan x="58.0" dy="18">• Lo ideal es detectarla al nacer con Ortolani/Barlow y ecografía.</tspan></text><text x="58.0" y="1164.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAOS, displasia de cadera (2022); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>