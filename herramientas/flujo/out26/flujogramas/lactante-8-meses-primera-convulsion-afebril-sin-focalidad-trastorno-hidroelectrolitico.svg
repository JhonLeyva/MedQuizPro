<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1211" viewBox="0 0 1000 1211" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Primera convulsión sin fiebre ni focalidad en un lactante: buscar un trastorno hidroelectrolítico"><title>Primera convulsión sin fiebre ni focalidad en un lactante: buscar un trastorno hidroelectrolítico</title><rect x="0.75" y="0.75" width="998.5" height="1209.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Convulsiones en el lactante · primera crisis afebril</tspan></text><rect x="496.0" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="552.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="552.5" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Primera convulsión afebril del lactante</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Antes de pensar en epilepsia se descartan causas agudas y corregibles.</tspan><tspan x="58.0" dy="17">Glucosa, sodio, calcio y magnesio bajos son frecuentes en el lactante.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 8 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Episodio convulsivo; afebril, en estado posictal.</tspan><tspan x="640.0" dy="16">Fontanela anterior cerrada, sin signos de focalización.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA CONVULSIÓN A LA CAUSA</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 543.8,369.0 76.2,369.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="341.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Lactante de 8 meses con primera convulsión afebril</tspan></text><line x1="565.9" y1="331.0" x2="606.0" y2="331.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="75.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="651.5" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="651.5" dy="0">Meningitis</tspan></text><rect x="695.0" y="302.0" width="112.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="751.1" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="751.1" dy="0">Craneosinostosis</tspan></text><rect x="813.3" y="302.0" width="69.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="848.1" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="848.1" dy="0">Epilepsia</tspan></text><rect x="614.0" y="334.0" width="160.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="694.4" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="694.4" dy="0">Trastorno hidroelectrolítico</tspan></text><polygon points="76.2,373.0 543.8,373.0 507.5,429.0 112.5,429.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="401.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="405.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="405.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Fiebre, fontanela abombada o rigidez de nuca?</tspan></text><line x1="529.6" y1="401.0" x2="606.0" y2="401.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="388.0" width="87.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="657.5" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="657.5" dy="0">✕ Meningitis</tspan></text><line x1="636.0" y1="401.5" x2="691.1" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,433.0 507.5,433.0 471.2,493.0 148.8,493.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="463.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="467.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="459.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Cráneo deformado con suturas</tspan><tspan x="320.0" dy="17">fusionadas?</tspan></text><line x1="493.4" y1="463.0" x2="606.0" y2="463.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="450.0" width="124.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="676.2" y="467.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="676.2" dy="0">✕ Craneosinostosis</tspan></text><line x1="636.0" y1="463.5" x2="728.4" y2="463.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,497.0 471.2,497.0 435.0,557.0 185.0,557.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="527.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="531.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="523.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Crisis repetidas sin causa</tspan><tspan x="320.0" dy="17">aguda?</tspan></text><line x1="457.1" y1="527.0" x2="606.0" y2="527.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="514.0" width="81.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="654.9" y="531.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="654.9" dy="0">✕ Epilepsia</tspan></text><line x1="636.0" y1="527.5" x2="685.9" y2="527.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="561.0" x2="310.0" y2="580.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,579.0 315.0,579.0 310.0,587.0" fill="#0f766e"/><rect x="140.0" y="591.0" width="340.0" height="74.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="620.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Trastorno hidroelectrolítico</tspan></text><text x="310.0" y="644.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Glucosa, sodio, calcio, magnesio</tspan></text><rect x="370.6" y="580.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="595.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="590.4" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="610.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="628.4" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Sin fiebre, sin foco y primera crisis: primero descartar una</tspan><tspan x="628.0" dy="16">causa metabólica aguda.</tspan></text><text x="40.0" y="705.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="717.9" width="358.0" height="182.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="727.9" width="157.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="741.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="316"><tspan x="61.0" dy="0">LO QUE SE PIDE PRIMERO</tspan></text><g transform="translate(54.0,755.9) scale(1.0)"><rect x="28" y="6" width="24" height="86" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><rect x="30" y="40" width="20" height="50" rx="9" fill="#fde68a"/><rect x="25" y="0" width="30" height="12" rx="3" fill="#ea580c"/><text x="40" y="112" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Glucosa</text><text x="40" y="112" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Glucosa</text><rect x="112" y="6" width="24" height="86" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><rect x="114" y="40" width="20" height="50" rx="9" fill="#bae6fd"/><rect x="109" y="0" width="30" height="12" rx="3" fill="#ea580c"/><text x="124" y="112" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Sodio</text><text x="124" y="112" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Sodio</text><rect x="196" y="6" width="24" height="86" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><rect x="198" y="40" width="20" height="50" rx="9" fill="#e9d5ff"/><rect x="193" y="0" width="30" height="12" rx="3" fill="#ea580c"/><text x="208" y="112" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Calcio</text><text x="208" y="112" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Calcio</text><rect x="280" y="6" width="24" height="86" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><rect x="282" y="40" width="20" height="50" rx="9" fill="#bbf7d0"/><rect x="277" y="0" width="30" height="12" rx="3" fill="#94a3b8"/><text x="292" y="112" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Magnesio</text><text x="292" y="112" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Magnesio</text></g><rect x="420.0" y="717.9" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="735.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="739.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">1</tspan></text><text x="458.0" y="739.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Glucosa: la hipoglucemia es la causa corregible más rápida.</tspan></text><rect x="420.0" y="748.9" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="766.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="770.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">2</tspan></text><text x="458.0" y="770.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Sodio y calcio bajos (hiponatremia, hipocalcemia).</tspan></text><rect x="420.0" y="779.9" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="797.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="801.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">3</tspan></text><text x="458.0" y="801.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Magnesio si el calcio no sube.</tspan></text><text x="40.0" y="939.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="949.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="980.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="980.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Craneosinostosis</tspan></text><text x="491.2" y="980.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Epilepsia</tspan></text><rect x="588.0" y="952.9" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="972.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Trastorno</tspan><tspan x="678.8" dy="17">hidroelectrolítico</tspan></text><text x="866.2" y="980.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Meningitis</tspan></text><rect x="40.0" y="1003.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1003.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1024.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="303.8" y="1024.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No causa convulsiones</tspan></text><text x="491.2" y="1024.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Es la primera crisis</tspan></text><text x="678.8" y="1024.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí</tspan></text><text x="866.2" y="1024.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sin fiebre</tspan></text><rect x="40.0" y="949.9" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1061.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1089.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1111.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primera crisis afebril sin focalidad: lo más probable es una causa metabólica o hidroelectrolítica.</tspan><tspan x="58.0" dy="18">• Pedir glucosa, sodio, calcio y magnesio de inmediato y corregir.</tspan><tspan x="58.0" dy="18">• Epilepsia requiere crisis repetidas no provocadas; meningitis suele dar fiebre.</tspan></text><text x="58.0" y="1169.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); AAP, primera crisis no febril.</tspan></text></svg>