<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1158" viewBox="0 0 1000 1158" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Quemadura de 2.º grado en manos en un adulto mayor: primeros cuidados y referencia"><title>Quemadura de 2.º grado en manos en un adulto mayor: primeros cuidados y referencia</title><rect x="0.75" y="0.75" width="998.5" height="1156.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Quemaduras · manejo inicial en el primer nivel</tspan></text><rect x="474.2" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="524.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="524.8" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Quemadura de espesor parcial</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ampollas y dolor: dañan la epidermis y parte de la dermis.</tspan><tspan x="58.0" dy="17">En el primer nivel: enfriar y lavar, cubrir, calmar el dolor y decidir si se refiere.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 73 años, puesto de salud</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fuego al cocinar hace 1 hora; dolor moderado.</tspan><tspan x="640.0" dy="16">Ampollas en ambas manos y antebrazos: 16 % de</tspan><tspan x="640.0" dy="16">superficie.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿ES UNA QUEMADURA QUE SE REFIERE?</tspan></text><rect x="40.0" y="285.0" width="642.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="512"><tspan x="56.0" dy="0">CRITERIOS DE REFERENCIA (ABA)</tspan></text><text x="666.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="666.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="319.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="329.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="344.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="343.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Espesor parcial &gt; 10 % en mayores de 60 años</tspan></text><text x="86.0" y="359.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Tiene 16 % y 73 años</tspan></text><text x="666.0" y="343.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="365.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="375.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="390.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="389.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Manos, cara, pies, genitales o articulaciones mayores</tspan></text><text x="86.0" y="405.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Ambas manos y antebrazos</tspan></text><text x="666.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="411.0" width="642.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="421.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="436.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✕</tspan></text><text x="86.0" y="435.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Espesor total (3.er grado) en cualquier extensión</tspan></text><text x="86.0" y="451.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Hay ampollas: es de espesor parcial</tspan></text><text x="666.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">No</tspan></text><rect x="40.0" y="457.0" width="642.0" height="46.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="467.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="482.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✕</tspan></text><text x="86.0" y="481.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Quemadura eléctrica, química o por inhalación</tspan></text><text x="86.0" y="497.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Fue por fuego, sin lesión inhalatoria</tspan></text><text x="666.0" y="481.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">No</tspan></text><rect x="40.0" y="503.0" width="642.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="513.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="528.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="527.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Enfermedades previas que compliquen la evolución</tspan></text><text x="86.0" y="543.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">No se menciona</tspan></text><text x="666.0" y="527.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="549.0" width="642.0" height="74.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="571.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="610"><tspan x="56.0" dy="0">Cumple 2 de 5 · basta 1 criterio</tspan></text><text x="56.0" y="591.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="610"><tspan x="56.0" dy="0">Se refiere tras lavar con agua, cubrir con apósito estéril sin romper las ampollas y dar</tspan><tspan x="56.0" dy="17">analgesia</tspan></text><rect x="40.0" y="285.0" width="642.0" height="338.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="702.0" y="285.0" width="258.0" height="436.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="714.0" y="295.0" width="120.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="723.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="723.0" dy="0">ZONAS QUEMADAS</tspan></text><g transform="translate(736.0,323.0) scale(0.78)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#ea580c" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#ea580c" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#ea580c" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#ea580c" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><text x="716.0" y="683.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Naranja: manos y antebrazos con ampollas</tspan><tspan x="716.0" dy="15">(2.º grado, 16 %).</tspan></text><text x="40.0" y="753.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ NO HACER EN EL PRIMER NIVEL</tspan></text><rect x="40.0" y="763.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="764.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="787.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Romper las ampollas</tspan></text><text x="58.0" y="808.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Expone la dermis: más dolor e infección; el</tspan><tspan x="58.0" dy="16">desbridamiento es en sala.</tspan></text><rect x="351.3" y="763.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="764.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="787.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Antibiótico profiláctico</tspan></text><text x="369.3" y="808.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No previene la infección y selecciona resistencias.</tspan></text><rect x="662.7" y="763.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="663.7" y="764.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="680.7" y="787.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Lo correcto</tspan></text><text x="680.7" y="808.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Agua, apósito estéril, analgesia y referencia.</tspan></text><rect x="860.2" y="752.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="767.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="888.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="898.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="920.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="920.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Desbridar + sulfadiazina</tspan></text><rect x="400.5" y="901.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="920.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Lavar, cubrir y referir</tspan></text><text x="678.8" y="920.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Desbridar y ambulatorio</tspan></text><text x="866.2" y="920.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Antibiótico EV y control</tspan></text><rect x="40.0" y="935.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="935.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="964.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Error</tspan></text><text x="303.8" y="956.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Rompe ampollas y da</tspan><tspan x="303.8" dy="16">antibiótico</tspan></text><text x="491.2" y="964.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ninguno</tspan></text><text x="678.8" y="956.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No refiere una quemadura</tspan><tspan x="678.8" dy="16">mayor</tspan></text><text x="866.2" y="964.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Antibiótico sin indicación</tspan></text><rect x="40.0" y="898.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1009.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1037.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1059.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Lavar con agua a temperatura ambiente; no romper las ampollas (son un apósito natural).</tspan><tspan x="58.0" dy="18">• No hay antibióticos profilácticos en quemaduras.</tspan><tspan x="58.0" dy="18">• Quemadura mayor en &gt; 60 años (&gt; 10 %) o en manos: referir a hospital con servicio de quemados.</tspan></text><text x="58.0" y="1117.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: American Burn Association, criterios de referencia; ATLS 11.ª ed. (2025).</tspan></text></svg>