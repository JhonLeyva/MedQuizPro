<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1432" viewBox="0 0 1000 1432" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Peritonitis bacteriana espontánea con daño renal: cefotaxima y albúmina"><title>Peritonitis bacteriana espontánea con daño renal: cefotaxima y albúmina</title><rect x="0.75" y="0.75" width="998.5" height="1430.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cirrosis · peritonitis bacteriana espontánea</tspan></text><rect x="455.7" y="32.0" width="180.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="545.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="164"><tspan x="545.8" dy="0">GASTROENTEROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Peritonitis bacteriana espontánea (PBE)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección del líquido ascítico sin foco quirúrgico, casi siempre por gramnegativos.</tspan><tspan x="58.0" dy="17">Diagnóstico: ≥ 250 polimorfonucleares/mm³ en el líquido.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 58 años con cirrosis alcohólica</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre, dolor difuso, creatinina de 0,9 a 1,7; bilirrubina</tspan><tspan x="640.0" dy="16">4,2.</tspan><tspan x="640.0" dy="16">Líquido: 720 PMN/mm³; bacilos gramnegativos.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="577.8" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="577.8" y1="271.0" x2="577.8" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="572.8,299.0 582.8,299.0 577.8,307.0" fill="#94a3b8"/><line x1="577.8" y1="365.0" x2="577.8" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="395.0" x2="811.3" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="395.0" x2="344.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,423.0 349.3,423.0 344.3,431.0" fill="#94a3b8"/><line x1="811.3" y1="395.0" x2="811.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,423.0 816.3,423.0 811.3,431.0" fill="#94a3b8"/><line x1="344.3" y1="489.0" x2="344.3" y2="534.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="534.5" x2="500.0" y2="534.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="534.5" x2="188.7" y2="563.5" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,562.5 193.7,562.5 188.7,570.5" fill="#94a3b8"/><line x1="500.0" y1="534.5" x2="500.0" y2="563.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,562.5 505.0,562.5 500.0,570.5" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="577.8" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="577.8" y1="271.0" x2="577.8" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="572.8,299.0 582.8,299.0 577.8,307.0" fill="#0f766e"/><line x1="577.8" y1="365.0" x2="577.8" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="395.0" x2="577.8" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="395.0" x2="344.3" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,423.0 349.3,423.0 344.3,431.0" fill="#0f766e"/><line x1="344.3" y1="489.0" x2="344.3" y2="534.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="534.5" x2="344.3" y2="534.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="534.5" x2="188.7" y2="563.5" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,562.5 193.7,562.5 188.7,570.5" fill="#0f766e"/><rect x="332.3" y="404.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="344.3" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="344.3" dy="0">Sí</tspan></text><rect x="797.2" y="404.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><rect x="176.6" y="543.5" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="556.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Sí</tspan></text><rect x="485.9" y="543.5" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="556.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">No</tspan></text><polygon points="317.8,336.0 343.8,307.0 811.8,307.0 837.8,336.0 811.8,365.0 343.8,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="363.8" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="363.8" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="363.8" dy="0">?</tspan></text><text x="596.8" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="596.8" dy="0">¿Líquido ascítico con ≥ 250 PMN/mm³?</tspan></text><polygon points="84.3,460.0 110.3,431.0 578.3,431.0 604.3,460.0 578.3,489.0 110.3,489.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="130.3" cy="460.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="130.3" y="465.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="130.3" dy="0">?</tspan></text><text x="363.3" y="464.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="363.3" dy="0">¿Creatinina &gt; 1 mg/dL o bilirrubina &gt; 4 mg/dL?</tspan></text><rect x="40.0" y="570.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="598.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">CEFOTAXIMA + ALBÚMINA</tspan></text><text x="188.7" y="621.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Albúmina 1,5 g/kg día 1 y 1 g/kg día 3</tspan><tspan x="188.7" dy="17">Cefotaxima 5-7 días</tspan></text><rect x="351.3" y="570.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="607.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Cefotaxima</tspan></text><text x="500.0" y="630.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Albúmina según el caso</tspan></text><rect x="662.7" y="431.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">No es PBE</tspan></text><text x="811.3" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Si el cultivo es positivo: bacteriascitis</tspan></text><text x="40.0" y="700.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="712.9" width="328.0" height="392.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="722.9" width="155.9" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="736.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="286"><tspan x="61.0" dy="0">ASCITIS Y PARACENTESIS</tspan></text><g transform="translate(54.0,750.9) scale(1.0)"><path d="M18 16 Q150 -6 282 16 L292 300 Q150 334 8 300 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M28 40 Q150 10 272 40" fill="none" stroke="#d6a684" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M24 42 C60 20 176 22 188 42 L182 66 C150 92 86 110 26 112 Z" fill="#e7a882" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="112" cy="104" rx="11" ry="17" fill="#86efac" stroke="#9a6b52" stroke-width="1.8" transform="rotate(-20 112 104)" /><path d="M178 44 C214 30 256 46 254 84 C252 116 222 132 190 128 C178 126 172 116 180 110 C204 110 222 98 220 80 C218 62 200 58 184 64 Z" fill="#fbcfe8" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="266" cy="78" rx="14" ry="30" fill="#c4b5fd" stroke="#9a6b52" stroke-width="1.8" transform="rotate(12 266 78)" /><path d="M150 118 C124 116 116 142 124 160 C132 176 158 176 170 168" fill="none" stroke="#e879a0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 136 C176 124 214 122 246 116 C252 124 246 132 238 134 C206 140 178 146 156 150 Z" fill="#fde68a" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><path d="M58 262 L52 170" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 148 L240 146" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 160 L250 246" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 246 C250 268 226 286 196 286 C176 286 170 272 160 276" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="60" cy="270" rx="15" ry="13" fill="#fed7aa" stroke="#9a6b52" stroke-width="1.8" /><path d="M58 282 C56 296 66 304 74 300" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 180 C120 166 150 196 178 176 C206 158 226 190 206 206 C182 222 150 196 126 214 C104 230 136 248 162 236 C190 224 220 240 206 258 C190 272 150 250 120 262 C102 268 84 262 76 266" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 262 C84 264 78 266 72 268" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="306" rx="22" ry="12" fill="#fef9c3" stroke="#9a6b52" stroke-width="1.8" /><path d="M22 170 C18 230 30 290 70 300 L70 250 C40 240 34 200 40 170 Z" fill="#7dd3fc" stroke="none" stroke-width="0" stroke-linejoin="round" opacity="0.55"/><path d="M278 170 C282 230 270 290 230 300 L230 250 C260 240 266 200 260 170 Z" fill="#7dd3fc" stroke="none" stroke-width="0" stroke-linejoin="round" opacity="0.55"/><path d="M312 262 L252 248" fill="none" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round" /><text x="300" y="282" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">paracentesis</text><text x="300" y="282" font-size="10" font-weight="800" fill="#1e3a8a" text-anchor="end" data-max="0">paracentesis</text><text x="10" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><rect x="390.0" y="712.9" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="730.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="734.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">1</tspan></text><text x="428.0" y="734.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Ascitis (azul) en los flancos y la pelvis.</tspan></text><rect x="390.0" y="743.9" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="761.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="765.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">2</tspan></text><text x="428.0" y="765.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Paracentesis diagnóstica: 720 PMN/mm³ confirma la PBE.</tspan></text><rect x="390.0" y="774.9" width="570.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="408.0" cy="792.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="796.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">3</tspan></text><text x="428.0" y="796.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">El daño renal (creatinina 1,7) obliga a dar albúmina.</tspan></text><text x="40.0" y="1144.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1154.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1185.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1185.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Amikacina + albúmina</tspan></text><text x="491.2" y="1177.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Ciprofloxacino +</tspan><tspan x="491.2" dy="17">cristaloides</tspan></text><rect x="588.0" y="1157.9" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="1185.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Cefotaxima + albúmina</tspan></text><text x="866.2" y="1185.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Metronidazol</tspan></text><rect x="40.0" y="1208.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1208.9" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1237.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1237.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Nefrotóxica</tspan></text><text x="491.2" y="1229.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sin albúmina; cristaloides no</tspan><tspan x="491.2" dy="16">evitan el SHR</tspan></text><text x="678.8" y="1237.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Ninguno</tspan></text><text x="866.2" y="1237.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No cubre gramnegativos</tspan></text><rect x="40.0" y="1154.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1282.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1310.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1332.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• PBE: cefalosporina de 3.ª generación (cefotaxima o ceftriaxona) 5-7 días.</tspan><tspan x="58.0" dy="18">• Si creatinina &gt; 1 o bilirrubina &gt; 4: albúmina 1,5 g/kg el día 1 y 1 g/kg el día 3 (evita el síndrome hepatorrenal).</tspan><tspan x="58.0" dy="18">• Evitar aminoglucósidos (nefrotóxicos); después, profilaxis secundaria.</tspan></text><text x="58.0" y="1390.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EASL, cirrosis descompensada (2018); AASLD (2021).</tspan></text></svg>