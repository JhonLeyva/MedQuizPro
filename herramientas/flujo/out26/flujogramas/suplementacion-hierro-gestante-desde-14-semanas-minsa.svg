nt-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="951.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Demasiado tarde</tspan></text><text x="678.8" y="951.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Demasiado temprano</tspan></text><text x="866.2" y="951.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Es cuando se inicia el calcio</tspan></text><rect x="40.0" y="893.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="988.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1016.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1038.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hierro profiláctico: 60 mg de hierro elemental + 400 µg de ácido fólico al día desde las 14 semanas.</tspan><tspan x="58.0" dy="18">• Esperar al 2.º trimestre evita empeorar las náuseas del primero; la demanda de hierro sube desde entonces.</tspan><tspan x="58.0" dy="18">• Si hay anemia, la dosis es de tratamiento (120 mg) desde el diagnóstico.</tspan></text><text x="58.0" y="1096.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, norma de suplementación con micronutrientes; RM 251-2024-MINSA (anemia).</tspan></text></svg>