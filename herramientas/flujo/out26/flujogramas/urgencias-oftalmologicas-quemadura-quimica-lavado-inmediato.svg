<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="967" viewBox="0 0 1000 967" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La quemadura química del ojo es una urgencia verdadera: lavar en minutos"><title>La quemadura química del ojo es una urgencia verdadera: lavar en minutos</title><rect x="0.75" y="0.75" width="998.5" height="965.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Oftalmología · urgencias</tspan></text><rect x="346.3" y="32.0" width="177.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="434.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="161"><tspan x="434.8" dy="0">OFTALMOLOGÍA Y ORL ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Urgencias oculares</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Algunas se tratan en minutos (química, oclusión arterial); otras en horas o días.</tspan><tspan x="58.0" dy="17">Los álcalis (lejía, amoníaco) penetran más que los ácidos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de estas situaciones es una urgencia ocular</tspan><tspan x="640.0" dy="16">verdadera?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">IMAGEN Y SEMÁFORO DE URGENCIA</tspan></text><rect x="40.0" y="269.0" width="310.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="110.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">LAVADO OCULAR</tspan></text><g transform="translate(50.0,345.0) scale(0.95)"><ellipse cx="150" cy="110" rx="120" ry="60" fill="#ffffff" stroke="#334155" stroke-width="2.5" /><circle cx="150" cy="110" r="44" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2" /><circle cx="150" cy="110" r="18" fill="#0f172a" stroke="none" stroke-width="0" /><ellipse cx="150" cy="110" rx="120" ry="60" fill="none" stroke="#dc2626" stroke-width="3" opacity="0.5"/><rect x="10" y="10" width="50" height="34" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="35" y="32" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">suero</text><text x="35" y="32" font-size="10" font-weight="800" fill="#075985" text-anchor="middle" data-max="0">suero</text><path d="M60 30 C100 30 120 50 132 70" fill="none" stroke="#0284c7" stroke-width="4" stroke-linejoin="round" /><circle cx="140" cy="76" r="3" fill="#38bdf8" stroke="none" stroke-width="0" /><circle cx="154" cy="82" r="3" fill="#38bdf8" stroke="none" stroke-width="0" /><circle cx="168" cy="88" r="3" fill="#38bdf8" stroke="none" stroke-width="0" /><circle cx="182" cy="94" r="3" fill="#38bdf8" stroke="none" stroke-width="0" /><circle cx="196" cy="100" r="3" fill="#38bdf8" stroke="none" stroke-width="0" /><text x="150" y="194" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">lavar 15-30 min hasta pH neutro</text><text x="150" y="194" font-size="10.5" font-weight="800" fill="#0369a1" text-anchor="middle" data-max="0">lavar 15-30 min hasta pH neutro</text></g><rect x="48.0" y="636.0" width="294.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="195.0" y="657.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">Lavar primero, examinar después.</tspan></text><text x="370.0" y="281.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="590"><tspan x="370.0" dy="0">LAS OPCIONES</tspan></text><rect x="370.0" y="291.0" width="590.0" height="28.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="386.0" cy="305.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="386.0" y="309.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">!</tspan></text><text x="404.0" y="309.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Quemadura química por limpiador</tspan></text><rect x="370.0" y="323.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="337.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="341.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="341.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Golpe contuso con visión normal</tspan></text><rect x="370.0" y="355.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="369.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="373.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="373.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Orzuelo de 24 horas</tspan></text><rect x="370.0" y="387.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="401.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="405.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="405.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Pterigion que invade la córnea</tspan></text><rect x="370.0" y="429.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="462.0" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="462.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Días o semanas</tspan></text><text x="430.0" y="468.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Programado</tspan></text><text x="430.0" y="484.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Orzuelo, pterigion, golpe sin lesión.</tspan></text><rect x="370.0" y="503.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="536.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="536.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="525.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Horas</tspan></text><text x="430.0" y="542.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Urgente</tspan></text><text x="430.0" y="558.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Trauma con baja de visión, glaucoma agudo, úlcera corneal.</tspan></text><rect x="370.0" y="577.0" width="590.0" height="66.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/><circle cx="400.0" cy="610.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="610.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="599.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Minutos</tspan></text><text x="430.0" y="616.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Urgencia verdadera</tspan></text><text x="430.0" y="632.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Quemadura química, oclusión de la arteria central.</tspan></text><rect x="854.6" y="566.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="581.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="745.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Pterigion</tspan></text><text x="491.2" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Golpe sin baja de visión</tspan></text><text x="678.8" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Orzuelo</tspan></text><rect x="775.5" y="726.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Quemadura química</tspan></text><rect x="40.0" y="760.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="760.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="781.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Urgencia verdadera?</tspan></text><text x="303.8" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="781.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="723.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="818.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="846.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="868.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Quemadura química: lavar de inmediato con suero o agua 15-30 min, hasta pH 7,0-7,4, antes de examinar.</tspan><tspan x="58.0" dy="18">• Luego evaluar córnea y limbo y referir a oftalmología.</tspan><tspan x="58.0" dy="18">• Pterigion y orzuelo no son urgentes; el trauma contuso sin baja de visión se evalúa sin prisa extrema.</tspan></text><text x="58.0" y="926.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO; Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>