<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1132" viewBox="0 0 1000 1132" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Desprendimiento prematuro de placenta grave: cesárea de emergencia"><title>Desprendimiento prematuro de placenta grave: cesárea de emergencia</title><rect x="0.75" y="0.75" width="998.5" height="1130.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hemorragias del tercer trimestre · desprendimiento de placenta</tspan></text><rect x="573.3" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="660.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="660.5" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Desprendimiento prematuro de placenta (DPP)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La placenta se separa antes del parto: sangra por detrás y el útero se contrae sin relajar.</tspan><tspan x="58.0" dy="17">Con compromiso fetal o materno, el parto es inmediato.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Secundigesta de 34 semanas, cesárea previa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor súbito, intenso y continuo con sangrado oscuro</tspan><tspan x="640.0" dy="16">escaso; PA 170/100.</tspan><tspan x="640.0" dy="16">Útero hipertónico; FCF 160 con desaceleraciones</tspan><tspan x="640.0" dy="16">tardías; Hb 7,5; plaquetas 110 000.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿ES UN DESPRENDIMIENTO GRAVE?</tspan></text><rect x="40.0" y="301.0" width="596.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="466"><tspan x="56.0" dy="0">SIGNOS DEL CASO</tspan></text><text x="620.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="620.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="335.0" width="596.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="345.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="359.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Dolor súbito, intenso y continuo</tspan></text><text x="86.0" y="375.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">No cede entre contracciones</tspan></text><text x="620.0" y="359.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sí</tspan></text><rect x="40.0" y="381.0" width="596.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="391.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="406.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="405.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Sangrado vaginal oscuro y escaso</tspan></text><text x="86.0" y="421.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">La sangre se acumula detrás</tspan></text><text x="620.0" y="405.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sí</tspan></text><rect x="40.0" y="427.0" width="596.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="437.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="452.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="451.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Útero hipertónico y doloroso</tspan></text><text x="86.0" y="467.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">«Útero de madera»</tspan></text><text x="620.0" y="451.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sí</tspan></text><rect x="40.0" y="473.0" width="596.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="483.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="498.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="497.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Compromiso fetal</tspan></text><text x="86.0" y="513.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Variabilidad mínima y desaceleraciones tardías</tspan></text><text x="620.0" y="497.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sí</tspan></text><rect x="40.0" y="519.0" width="596.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="529.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="544.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="543.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Anemia o coagulopatía</tspan></text><text x="86.0" y="559.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Hb 7,5; plaquetas y fibrinógeno bajando</tspan></text><text x="620.0" y="543.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sí</tspan></text><rect x="40.0" y="565.0" width="596.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="587.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="564"><tspan x="56.0" dy="0">Cumple 5 de 5 · feto comprometido o madre inestable</tspan></text><text x="56.0" y="607.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="564"><tspan x="56.0" dy="0">DPP grave: cesárea de emergencia con reposición de sangre y derivados</tspan></text><rect x="40.0" y="301.0" width="596.0" height="321.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="656.0" y="301.0" width="304.0" height="410.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="668.0" y="311.0" width="147.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="677.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="677.0" dy="0">QUÉ PASA EN EL ÚTERO</tspan></text><g transform="translate(670.0,339.0) scale(0.92)"><ellipse cx="150" cy="150" rx="124" ry="142" fill="#fbcfe8" stroke="#be185d" stroke-width="3" /><ellipse cx="150" cy="150" rx="108" ry="126" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" /><path d="M40 70 C80 20 170 10 230 30 L210 62 C160 44 100 50 62 88 Z" fill="#9f1239" stroke="#881337" stroke-width="1.5" stroke-linejoin="round" /><ellipse cx="155.7" cy="124.4" rx="41.8" ry="55.099999999999994" fill="#fcd5b5" stroke="#e9b48f" stroke-width="1.6" transform="rotate(-10 155.7 124.4)" /><circle cx="150" cy="202.3" r="34.199999999999996" fill="#fcd5b5" stroke="#e9b48f" stroke-width="1.6" /><path d="M178.5 103.5 q26 17.099999999999998 8 41.8" fill="none" stroke="#e9b48f" stroke-width="4.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M123.4 151.0 q-18 20.9 6 34.199999999999996" fill="none" stroke="#e9b48f" stroke-width="4.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M138 288 L138 324 M162 288 L162 324" fill="none" stroke="#be185d" stroke-width="8" stroke-linejoin="round" /><path d="M70 62 C110 44 176 36 222 44 L214 70 C170 66 120 72 84 92 Z" fill="#450a0a" stroke="none" stroke-width="0" stroke-linejoin="round" opacity="0.9"/><path d="M150 324 q-4 10 0 16 q4 10 0 16" fill="none" stroke="#450a0a" stroke-width="3" stroke-linejoin="round" /><text x="248" y="20" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Hematoma</text><text x="248" y="20" font-size="10.5" font-weight="800" fill="#450a0a" text-anchor="start" data-max="0">Hematoma</text><text x="248" y="34" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">retroplacentario</text><text x="248" y="34" font-size="10.5" font-weight="800" fill="#450a0a" text-anchor="start" data-max="0">retroplacentario</text><line x1="246" y1="38" x2="200" y2="52" stroke="#334155" stroke-width="1.3"/><circle cx="200" cy="52" r="2.6" fill="#334155"/></g><text x="670.0" y="673.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="276"><tspan x="670.0" dy="0">Coágulo entre la placenta y la pared: poco sangrado</tspan><tspan x="670.0" dy="15">afuera.</tspan></text><text x="40.0" y="743.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="753.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="754.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="777.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Magnesio como tocolítico</tspan></text><text x="58.0" y="798.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Contraindicado: no se frena un DPP.</tspan></text><rect x="351.3" y="753.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="754.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="777.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Inducción con oxitocina</tspan></text><text x="369.3" y="798.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">El feto no tolera esperar el parto vaginal.</tspan></text><rect x="662.7" y="753.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="754.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="777.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Manejo expectante</tspan></text><text x="680.7" y="798.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Solo en DPP leve, lejos del término y con todo</tspan><tspan x="680.7" dy="16">estable.</tspan></text><text x="40.0" y="878.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="888.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="910.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="910.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Magnesio tocolítico</tspan></text><rect x="400.5" y="891.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="910.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Cesárea de emergencia</tspan></text><text x="678.8" y="910.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Inducción</tspan></text><text x="866.2" y="910.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Expectante</tspan></text><rect x="40.0" y="925.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="925.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="946.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Adecuada?</tspan></text><text x="303.8" y="946.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="946.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="946.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: feto comprometido</tspan></text><text x="866.2" y="946.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="888.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="983.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1011.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1033.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• DPP con feto vivo comprometido o madre inestable: cesárea de emergencia.</tspan><tspan x="58.0" dy="18">• El sangrado externo escaso engaña: la sangre queda detrás de la placenta.</tspan><tspan x="58.0" dy="18">• Vigilar coagulopatía (fibrinógeno, plaquetas) y reponer sangre y derivados.</tspan></text><text x="58.0" y="1091.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletins; Williams Obstetricia 26.ª ed. (2022); MINSA Perú, guía de hemorragia obstétrica.</tspan></text></svg>