<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1071" viewBox="0 0 1000 1071" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fiebre y dolor en hipocondrio derecho tras una disentería: absceso hepático amebiano"><title>Fiebre y dolor en hipocondrio derecho tras una disentería: absceso hepático amebiano</title><rect x="0.75" y="0.75" width="998.5" height="1069.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parasitosis · amebiasis extraintestinal</tspan></text><rect x="424.9" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="493.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="493.3" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Amebiasis extraintestinal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Entamoeba histolytica cruza la pared del colon y sube por la vena porta.</tspan><tspan x="58.0" dy="17">El hígado es el sitio más frecuente: absceso único en el lóbulo derecho.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 32 años, zona rural</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">10 días de fiebre y dolor en hipocondrio derecho que</tspan><tspan x="640.0" dy="16">empeora con la tos.</tspan><tspan x="640.0" dy="16">Disentería hace 2 meses que se autolimitó.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÓNDE SE VA LA AMEBA</tspan></text><rect x="40.0" y="285.0" width="440.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="137.5" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">ABDOMEN (ESQUEMA)</tspan></text><g transform="translate(112.0,319.0) scale(1.0)"><path d="M18 16 Q150 -6 282 16 L292 300 Q150 334 8 300 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M28 40 Q150 10 272 40" fill="none" stroke="#d6a684" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M24 42 C60 20 176 22 188 42 L182 66 C150 92 86 110 26 112 Z" fill="#ea580c" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="112" cy="104" rx="11" ry="17" fill="#86efac" stroke="#9a6b52" stroke-width="1.8" transform="rotate(-20 112 104)" /><path d="M178 44 C214 30 256 46 254 84 C252 116 222 132 190 128 C178 126 172 116 180 110 C204 110 222 98 220 80 C218 62 200 58 184 64 Z" fill="#fbcfe8" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="266" cy="78" rx="14" ry="30" fill="#c4b5fd" stroke="#9a6b52" stroke-width="1.8" transform="rotate(12 266 78)" /><path d="M150 118 C124 116 116 142 124 160 C132 176 158 176 170 168" fill="none" stroke="#e879a0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 136 C176 124 214 122 246 116 C252 124 246 132 238 134 C206 140 178 146 156 150 Z" fill="#fde68a" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><path d="M58 262 L52 170" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 148 L240 146" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 160 L250 246" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 246 C250 268 226 286 196 286 C176 286 170 272 160 276" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="60" cy="270" rx="15" ry="13" fill="#fed7aa" stroke="#9a6b52" stroke-width="1.8" /><path d="M58 282 C56 296 66 304 74 300" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 180 C120 166 150 196 178 176 C206 158 226 190 206 206 C182 222 150 196 126 214 C104 230 136 248 162 236 C190 224 220 240 206 258 C190 272 150 250 120 262 C102 268 84 262 76 266" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 262 C84 264 78 266 72 268" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="306" rx="22" ry="12" fill="#fef9c3" stroke="#9a6b52" stroke-width="1.8" /><ellipse cx="66" cy="70" rx="20" ry="15" fill="#fde68a" stroke="#b45309" stroke-width="2.5" /><circle cx="66" cy="70" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="66" y="74" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="40" cy="22" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="40" y="26" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><circle cx="150" cy="250" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="254" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text><circle cx="266" cy="78" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="266" y="82" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">4</text><text x="10" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><rect x="48.0" y="637.0" width="424.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="260.0" y="658.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="410"><tspan x="260.0" dy="0">1 hígado (absceso en amarillo), 2 hacia el pulmón derecho, 3 peritoneo, 4</tspan><tspan x="260.0" dy="15">bazo.</tspan></text><rect x="500.0" y="285.0" width="460.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="501.0" y="286.0" width="6.0" height="67.0" rx="3" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="518.0" y="309.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">1. Hígado</tspan></text><text x="518.0" y="330.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">El más frecuente: llega por la vena porta. Este caso.</tspan></text><rect x="860.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="500.0" y="364.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="365.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="388.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">2. Pulmón y pleura derecha</tspan></text><text x="518.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Por extensión de un absceso hepático.</tspan></text><rect x="500.0" y="443.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="444.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">3. Peritoneo</tspan></text><text x="518.0" y="488.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Si el absceso se rompe.</tspan></text><rect x="500.0" y="522.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="523.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="546.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">4. Bazo</tspan></text><text x="518.0" y="567.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Muy raro.</tspan></text><rect x="40.0" y="699.0" width="920.0" height="78.0" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="60.0" y="725.0" font-size="13" font-weight="800" font-style="normal" fill="#92400e" text-anchor="start" data-max="700"><tspan x="60.0" dy="0">Qué hacer</tspan></text><text x="60.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#78350f" text-anchor="start" data-max="700"><tspan x="60.0" dy="0">Ecografía del hígado; serología para ameba.</tspan><tspan x="60.0" dy="16">Metronidazol 10 días y luego paromomicina; drenar si es grande o no mejora.</tspan></text><text x="40.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="827.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="849.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Bazo</tspan></text><text x="491.2" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Pulmones</tspan></text><text x="678.8" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Peritoneo</tspan></text><rect x="775.5" y="830.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Hígado</tspan></text><rect x="40.0" y="864.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="864.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="885.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Frecuencia</tspan></text><text x="303.8" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Rara</tspan></text><text x="491.2" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Por extensión</tspan></text><text x="678.8" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Por ruptura</tspan></text><text x="866.2" y="885.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">La más frecuente</tspan></text><rect x="40.0" y="827.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="922.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="950.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="972.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Disentería previa + fiebre + dolor en hipocondrio derecho = absceso hepático amebiano.</tspan><tspan x="58.0" dy="18">• Ecografía: lesión única en el lóbulo derecho; contenido «pasta de anchoas».</tspan><tspan x="58.0" dy="18">• Metronidazol y luego un amebicida luminal; drenaje si es grande o no mejora.</tspan></text><text x="58.0" y="1030.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IDSA; Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>