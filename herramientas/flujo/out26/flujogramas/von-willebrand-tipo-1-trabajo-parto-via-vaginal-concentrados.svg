"500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">El concentrado corrige el FvW y el FVIII</tspan></text><circle cx="62.0" cy="427.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="431.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Menos sangrado que una cirugía</tspan></text><rect x="214.6" y="311.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="326.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="322.0" width="290.0" height="164.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="350.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Cesárea (o instrumentado)</tspan></text><circle cx="692.0" cy="375.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="379.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">La cirugía agrega sangrado en una</tspan><tspan x="704.0" dy="16">coagulopatía</tspan></text><circle cx="692.0" cy="417.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="421.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">El instrumentado lesiona al feto (puede</tspan><tspan x="704.0" dy="16">heredarla)</tspan></text><circle cx="692.0" cy="459.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Solo si hay indicación obstétrica</tspan></text><rect x="40.0" 