e="#cbd5e1" stroke-width="1.2"/><circle cx="468.0" cy="764.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="468.0" y="768.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="468.0" dy="0">1</tspan></text><text x="488.0" y="768.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="466"><tspan x="488.0" dy="0">Pega la plaqueta al colágeno del vaso lesionado.</tspan></text><rect x="450.0" y="777.0" width="510.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="468.0" cy="795.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="468.0" y="799.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="468.0" dy="0">2</tspan></text><text x="488.0" y="799.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="466"><tspan x="488.0" dy="0">Transporta y protege al factor VIII.</tspan></text><rect x="450.0" y="808.0" width="510.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="468.0" cy="826.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="468.0" y="830.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="468.0" dy="0">3</tspan></text><text x="488.0" y="830.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="466"><tspan x="488.0" dy="0">Si falta, sangra más la placenta al desprenderse: por eso se repone.</tspan></text><text x="40.0" y="1048.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1058.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1080.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1080.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Cesárea + tranexámico</tspan></text><rect x="400.5" y="1061.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="1080.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Vaginal con concentrados</tspan></text><text x="678.8" y="1080.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Vaginal instrumentado</tspan></text><text x="866.2" y="1080.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Cesárea programada</tspan></text><rect x="40.0" y="1095.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1095.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1116.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1116.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sin indicación obstétrica</tspan></text><text x="491.2" y="1116.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ninguno</tspan></text><text x="678.8" y="1116.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Riesgo de sangrado fetal</tspan></text><text x="866.2" y="1116.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sin indicación</tspan></text><rect x="40.0" y="1058.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1153.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1181.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1203.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Vía de parto según indicación obstétrica: vaginal si no hay otra razón.</tspan><tspan x="58.0" dy="18">• Con FvW o FVIII &lt; 50 %: concentrado de FvW/FVIII (o desmopresina en tipo 1 que responde) para el parto.</tspan><tspan x="58.0" dy="18">• Evitar partos instrumentados y maniobras traumáticas; vigilar la hemorragia posparto (ácido tranexámico).</tspan></text><text x="58.0" y="1261.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASH/ISTH/NHF/WFH, guía de von Willebrand (2021); ACOG Practice Bulletins.</tspan></text></svg>