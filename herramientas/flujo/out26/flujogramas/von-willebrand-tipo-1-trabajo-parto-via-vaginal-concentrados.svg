" data-max="524"><tspan x="58.0" dy="0">La enfermedad no indica cesárea por sí misma.</tspan><tspan x="58.0" dy="17">Si los niveles están bajos al final del embarazo, se reponen para el parto.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="168.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="166.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 37 semanas, von Willebrand tipo</tspan><tspan x="640.0" dy="17">1</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niveles bajos de factor de von Willebrand y factor VIII.</tspan><tspan x="640.0" dy="16">Trabajo de parto espontáneo, cefálico, sin otras</tspan><tspan x="640.0" dy="16">complicaciones.</tspan></text><rect x="640.0" y="229.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="242.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="242.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="290.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ PESA MÁS EN ESTA PACIENTE?</tspan></text><rect x="493.0" y="352.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 557.0 H560.0 L540.0 537.0 