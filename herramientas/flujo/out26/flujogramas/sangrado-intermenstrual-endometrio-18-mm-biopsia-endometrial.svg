<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1027" viewBox="0 0 1000 1027" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sangrado intermenstrual con endometrio de 18 mm: biopsia endometrial"><title>Sangrado intermenstrual con endometrio de 18 mm: biopsia endometrial</title><rect x="0.75" y="0.75" width="998.5" height="1025.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hemorragia uterina anormal · evaluación del endometrio</tspan></text><rect x="532.3" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="619.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="619.4" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hemorragia uterina anormal (PALM-COEIN)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Primero se buscan causas estructurales: pólipo, adenomiosis, mioma, malignidad.</tspan><tspan x="58.0" dy="17">El endometrio engrosado con sangrado persistente se biopsia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 35 años, nulípara</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">3 meses de sangrado intermenstrual; no usa</tspan><tspan x="640.0" dy="16">hormonas.</tspan><tspan x="640.0" dy="16">Eco TV: útero de 7,5 cm sin miomas, endometrio de 18</tspan><tspan x="640.0" dy="16">mm.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿HAY QUE BIOPSIAR EL ENDOMETRIO?</tspan></text><rect x="40.0" y="301.0" width="572.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="442"><tspan x="56.0" dy="0">INDICACIONES DE BIOPSIA ENDOMETRIAL</tspan></text><text x="596.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="596.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="335.0" width="572.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="345.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="359.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="422"><tspan x="86.0" dy="0">Sangrado anormal persistente</tspan></text><text x="86.0" y="375.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="422"><tspan x="86.0" dy="0">3 meses de sangrado intermenstrual</tspan></text><text x="596.0" y="359.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="596.0" dy="0">Sí</tspan></text><rect x="40.0" y="381.0" width="572.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="391.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="406.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="405.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="422"><tspan x="86.0" dy="0">Endometrio engrosado en la eco</tspan></text><text x="86.0" y="421.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="422"><tspan x="86.0" dy="0">18 mm (se espera ≤ 14 mm en la premenopausia)</tspan></text><text x="596.0" y="405.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="596.0" dy="0">Sí</tspan></text><rect x="40.0" y="427.0" width="572.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="437.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="452.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✕</tspan></text><text x="86.0" y="451.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="422"><tspan x="86.0" dy="0">Edad ≥ 45 años</tspan></text><text x="86.0" y="467.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="422"><tspan x="86.0" dy="0">Tiene 35</tspan></text><text x="596.0" y="451.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="596.0" dy="0">No</tspan></text><rect x="40.0" y="473.0" width="572.0" height="46.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="483.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="498.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="497.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="422"><tspan x="86.0" dy="0">Exposición a estrógenos sin oposición (obesidad, anovulación)</tspan></text><text x="86.0" y="513.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="422"><tspan x="86.0" dy="0">No se describe</tspan></text><text x="596.0" y="497.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="596.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="519.0" width="572.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="529.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="544.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="543.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="422"><tspan x="86.0" dy="0">Falla del tratamiento médico</tspan></text><text x="86.0" y="559.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="422"><tspan x="86.0" dy="0">Aún no recibió</tspan></text><text x="596.0" y="543.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="596.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="565.0" width="572.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="587.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="540"><tspan x="56.0" dy="0">Cumple 2 de 5 · basta con sangrado persistente + endometrio engrosado</tspan></text><text x="56.0" y="607.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="540"><tspan x="56.0" dy="0">Biopsia endometrial ambulatoria (cánula de Pipelle)</tspan></text><rect x="40.0" y="301.0" width="572.0" height="321.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="632.0" y="301.0" width="328.0" height="317.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="644.0" y="311.0" width="113.5" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="653.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="653.0" dy="0">ÚTERO DEL CASO</tspan></text><g transform="translate(646.0,339.0) scale(1.0)"><path d="M90 40 C90 10 210 10 210 40 L204 140 C198 170 102 170 96 140 Z" fill="#f9a8d4" stroke="#be185d" stroke-width="2.5" stroke-linejoin="round" /><path d="M132 44 L168 44 L159.0 140 L141.0 140 Z" fill="#fda4af" stroke="#be185d" stroke-width="1.5" stroke-linejoin="round" /><line x1="132" y1="76" x2="168" y2="76" stroke="#0f766e" stroke-width="2"/><text x="230" y="80" font-size="11.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">18 mm</text><text x="230" y="80" font-size="11.5" font-weight="800" fill="#134e4a" text-anchor="start" data-max="0">18 mm</text><line x1="228" y1="76" x2="168" y2="76" stroke="#0f766e" stroke-width="1.3"/><circle cx="168" cy="76" r="2.6" fill="#0f766e"/><path d="M138 160 L138 200 L162 200 L162 160" fill="#f9a8d4" stroke="#be185d" stroke-width="2" stroke-linejoin="round" /><text x="150" y="226" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">endometrio</text><text x="150" y="226" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="middle" data-max="0">endometrio</text></g><text x="646.0" y="595.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="300"><tspan x="646.0" dy="0">Endometrio (rosado oscuro) engrosado: 18 mm.</tspan></text><text x="40.0" y="654.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="664.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="665.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="688.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Eco de control en un mes</tspan></text><text x="58.0" y="709.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Retrasa el diagnóstico.</tspan></text><rect x="351.3" y="664.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="665.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="688.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Resonancia</tspan></text><text x="369.3" y="709.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No da diagnóstico histológico.</tspan></text><rect x="662.7" y="664.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="665.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="688.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Progestágenos</tspan></text><text x="680.7" y="709.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Se dan después de conocer la histología.</tspan></text><text x="40.0" y="773.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="783.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="805.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="805.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Eco en un mes</tspan></text><text x="491.2" y="805.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Resonancia</tspan></text><text x="678.8" y="805.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Progestágenos</tspan></text><rect x="775.5" y="786.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="805.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Biopsia endometrial</tspan></text><rect x="40.0" y="820.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="820.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="841.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Da el diagnóstico?</tspan></text><text x="303.8" y="841.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="841.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="841.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="841.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="783.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="878.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="906.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="928.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sangrado anormal persistente + endometrio engrosado: biopsia endometrial (Pipelle) aun antes de los 45 años.</tspan><tspan x="58.0" dy="18">• Busca hiperplasia con o sin atipia, pólipo o carcinoma.</tspan><tspan x="58.0" dy="18">• Tratar con progestágenos sin biopsia puede ocultar una lesión.</tspan></text><text x="58.0" y="986.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletins n.º 128 y 136; FIGO, sistema PALM-COEIN (2018).</tspan></text></svg>