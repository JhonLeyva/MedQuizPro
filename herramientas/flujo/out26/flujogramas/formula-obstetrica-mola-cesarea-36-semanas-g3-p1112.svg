<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1101" viewBox="0 0 1000 1101" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fórmula obstétrica con mola y cesárea pretérmino: G3 P1112"><title>Fórmula obstétrica con mola y cesárea pretérmino: G3 P1112</title><rect x="0.75" y="0.75" width="998.5" height="1099.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Historia obstétrica · fórmula G P</tspan></text><rect x="390.7" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="477.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="477.9" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fórmula obstétrica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">G = total de gestaciones, sin importar cómo terminaron.</tspan><tspan x="58.0" dy="17">P = cuatro números: a término, pretérmino, abortos, hijos vivos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 34 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hijo de 6 años por parto eutócico a las 38 semanas;</tspan><tspan x="640.0" dy="16">mola evacuada hace 2 años.</tspan><tspan x="640.0" dy="16">Hoy: cesárea a las 36 semanas por eclampsia, recién</tspan><tspan x="640.0" dy="16">nacido vivo.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE CUENTA CASILLA POR CASILLA</tspan></text><rect x="40.0" y="301.0" width="250.0" height="470.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="111.9" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">SUS EMBARAZOS</tspan></text><g transform="translate(56.0,347.0) scale(1.0)"><line x1="30" y1="20" x2="30" y2="320" stroke="#cbd5e1" stroke-width="3"/><circle cx="30" cy="30.0" r="16" fill="#16a34a" stroke="#ffffff" stroke-width="3" /><text x="30" y="35.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><text x="56" y="26.0" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Parto a las 38 sem</text><text x="56" y="42.0" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">hijo de 6 años</text><rect x="56" y="50.0" width="116" height="18" rx="9" fill="#ffedd5" stroke="#ea580c"/><text x="63" y="63.0" font-size="10" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">a término + vivo</text><circle cx="30" cy="170.0" r="16" fill="#7c3aed" stroke="#ffffff" stroke-width="3" /><text x="30" y="175.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><text x="56" y="166.0" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Mola hace 2 años</text><text x="56" y="182.0" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">evacuación</text><rect x="56" y="190.0" width="52" height="18" rx="9" fill="#ffedd5" stroke="#ea580c"/><text x="63" y="203.0" font-size="10" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">aborto</text><circle cx="30" cy="310.0" r="16" fill="#ea580c" stroke="#ffffff" stroke-width="3" /><text x="30" y="315.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text><text x="56" y="306.0" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Cesárea a las 36 sem</text><text x="56" y="322.0" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">recién nacido vivo</text><rect x="56" y="330.0" width="123" height="18" rx="9" fill="#ffedd5" stroke="#ea580c"/><text x="63" y="343.0" font-size="10" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">pretérmino + vivo</text></g><rect x="48.0" y="723.0" width="234.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="165.0" y="744.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="220"><tspan x="165.0" dy="0">Tres gestaciones: dos hijos vivos y un</tspan><tspan x="165.0" dy="15">aborto (la mola).</tspan></text><circle cx="326.0" cy="323.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="328.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">1</tspan></text><rect x="350.0" y="301.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="302.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">G: gestaciones</tspan></text><text x="368.0" y="346.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Parto, mola y la actual = 3.</tspan></text><circle cx="326.0" cy="404.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="409.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">2</tspan></text><rect x="350.0" y="382.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="383.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="406.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">T: a término</tspan></text><text x="368.0" y="427.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Solo el parto de 38 semanas = 1.</tspan></text><circle cx="326.0" cy="485.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="490.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">3</tspan></text><rect x="350.0" y="463.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="464.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="487.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">P: pretérmino</tspan></text><text x="368.0" y="508.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">La cesárea de 36 semanas = 1.</tspan></text><circle cx="326.0" cy="566.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="571.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">4</tspan></text><rect x="350.0" y="544.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="545.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="568.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">A: abortos</tspan></text><text x="368.0" y="589.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">La mola = 1.</tspan></text><circle cx="326.0" cy="647.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="652.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">5</tspan></text><rect x="350.0" y="625.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="626.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="649.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">V: hijos vivos</tspan></text><text x="368.0" y="670.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">El de 6 años y el recién nacido = 2.</tspan></text><circle cx="326.0" cy="728.0" r="14" fill="#0f766e" stroke="none" stroke-width="0"/><text x="326.0" y="733.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">6</tspan></text><rect x="350.0" y="706.0" width="610.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="351.0" y="707.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="368.0" y="730.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Resultado</tspan></text><text x="368.0" y="751.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">G3 P1112</tspan></text><rect x="860.2" y="695.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="710.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="831.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="841.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="863.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">G3 P2012</tspan></text><rect x="400.5" y="844.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">G3 P1112</tspan></text><text x="678.8" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">G2 P1112</tspan></text><text x="866.2" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">G2 P2012</tspan></text><rect x="40.0" y="878.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="878.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="907.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Error</tspan></text><text x="303.8" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Cuenta las 36 sem como</tspan><tspan x="303.8" dy="16">término</tspan></text><text x="491.2" y="907.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ninguno</tspan></text><text x="678.8" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No cuenta la mola como</tspan><tspan x="678.8" dy="16">gestación</tspan></text><text x="866.2" y="907.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Dos errores juntos</tspan></text><rect x="40.0" y="841.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="952.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="980.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1002.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La mola cuenta como gestación y como aborto (termina antes de las 20-22 semanas).</tspan><tspan x="58.0" dy="18">• A término = 37 semanas o más; pretérmino = antes de las 37.</tspan><tspan x="58.0" dy="18">• El último número son los hijos vivos actualmente (2).</tspan></text><text x="58.0" y="1060.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia; MINSA Perú, historia clínica perinatal.</tspan></text></svg>