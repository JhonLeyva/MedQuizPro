ext-anchor="middle" data-max="410"><tspan x="260.0" dy="0">Naranja: mediastino posterior con esófago y aorta (óvalo: dilatación).</tspan></text><rect x="500.0" y="301.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="302.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">1. Anterior</tspan></text><text x="518.0" y="346.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Timo, ganglios.</tspan></text><rect x="500.0" y="380.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="381.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="404.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">2. Medio</tspan></text><text x="518.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Corazón, pericardio, frénicos.</tspan></text><rect x="500.0" y="459.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="460.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="483.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">3. Superior</tspan></text><text x="518.0" y="504.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Vena cava superior, tronco pulmonar, tráquea.</tspan></text><rect x="500.0" y="538.0" width="460.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="501.0" y="539.0" width="6.0" height="67.0" rx="3" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="518.0" y="562.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">4. Posterior</tspan></text><text x="518.0" y="583.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Aorta descendente, esófago, ácigos: este caso.</tspan></text><rect x="860.2" y="527.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="542.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="755.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="765.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="787.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Vena cava superior</tspan></text><rect x="400.5" y="768.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Esófago torácico</tspan></text><text x="678.8" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Frénico derecho</tspan></text><text x="866.2" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Tronco pulmonar</tspan></text><rect x="40.0" y="802.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="802.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="823.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Compartimento</tspan></text><text x="303.8" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Superior/medio</tspan></text><text x="491.2" y="823.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Posterior: este caso</tspan></text><text x="678.8" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Medio</tspan></text><text x="866.2" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Medio</tspan></text><rect x="40.0" y="765.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="860.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="888.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="910.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La aorta descendente está en el mediastino posterior, al lado del esófago.</tspan><tspan x="58.0" dy="18">• Un aneurisma ahí puede comprimir el esófago (disfagia).</tspan><tspan x="58.0" dy="18">• Vena cava superior, tronco pulmonar y frénico derecho están en otros compartimentos.</tspan></text><text x="58.0" y="968.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Moore, Anatomía con orientación clínica 9.ª ed.; Latarjet, Anatomía humana 5.ª ed..</tspan></text></svg>