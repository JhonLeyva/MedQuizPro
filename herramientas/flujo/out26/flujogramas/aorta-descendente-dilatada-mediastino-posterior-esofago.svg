<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1009" viewBox="0 0 1000 1009" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dilatación de la aorta descendente: en el mediastino posterior, junto al esófago"><title>Dilatación de la aorta descendente: en el mediastino posterior, junto al esófago</title><rect x="0.75" y="0.75" width="998.5" height="1007.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Anatomía · mediastino</tspan></text><rect x="333.9" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="413.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="413.3" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Compartimentos del mediastino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Anterior: timo; medio: corazón y grandes vasos; posterior: aorta descendente, esófago,</tspan><tspan x="58.0" dy="17">ácigos y conducto torácico.</tspan><tspan x="58.0" dy="17">Una masa posterior comprime lo que comparte ese espacio.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 55 años, fumador</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Rx: dilatación fusiforme de la aorta torácica</tspan><tspan x="640.0" dy="16">descendente.</tspan><tspan x="640.0" dy="16">Delante de los cuerpos vertebrales; corazón y tráquea</tspan><tspan x="640.0" dy="16">sin compromiso.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HAY EN CADA COMPARTIMENTO</tspan></text><rect x="40.0" y="301.0" width="440.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="208.0" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">MEDIASTINO DE PERFIL (ESQUEMA)</tspan></text><g transform="translate(92.0,355.0) scale(1.0)"><path d="M40 20 L290 20 L300 240 L30 240 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" /><path d="M260 20 L262 240" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linejoin="round" /><rect x="262" y="30" width="30" height="26" rx="4" fill="#e7e5e4" stroke="#78716c"/><rect x="262" y="64" width="30" height="26" rx="4" fill="#e7e5e4" stroke="#78716c"/><rect x="262" y="98" width="30" height="26" rx="4" fill="#e7e5e4" stroke="#78716c"/><rect x="262" y="132" width="30" height="26" rx="4" fill="#e7e5e4" stroke="#78716c"/><rect x="262" y="166" width="30" height="26" rx="4" fill="#e7e5e4" stroke="#78716c"/><rect x="262" y="200" width="30" height="26" rx="4" fill="#e7e5e4" stroke="#78716c"/><text x="277" y="254" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">vértebras</text><text x="277" y="254" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">vértebras</text><rect x="40" y="20" width="70" height="220" fill="#e0f2fe" opacity="0.6"/><text x="75" y="252" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">anterior</text><text x="75" y="252" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">anterior</text><ellipse cx="150" cy="150" rx="50" ry="56" fill="#fecaca" stroke="#b91c1c" stroke-width="2" /><text x="150" y="154" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text