<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1203" viewBox="0 0 1000 1203" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ictericia obstructiva: la enzima que sube es la fosfatasa alcalina"><title>Ictericia obstructiva: la enzima que sube es la fosfatasa alcalina</title><rect x="0.75" y="0.75" width="998.5" height="1201.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ictericia · patrones de laboratorio</tspan></text><rect x="396.9" y="32.0" width="180.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="164"><tspan x="487.0" dy="0">GASTROENTEROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Patrones del perfil hepático</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hepatocelular: suben mucho AST y ALT.</tspan><tspan x="58.0" dy="17">Colestásico (obstrucción): suben fosfatasa alcalina, GGT y bilirrubina directa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 25 años con ictericia tras un cólico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Vesícula palpable.</tspan><tspan x="640.0" dy="16">Bilirrubina directa elevada.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ENZIMA SUBE EN CADA CASO</tspan></text><line x1="410.9" y1="404.9" x2="340.0" y2="428.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="428.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="345.1" x2="660.0" y2="321.4" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="321.4" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="403.0" x2="660.0" y2="425.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="425.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="347.0" x2="340.0" y2="325.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="325.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="375.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="375.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="361.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">Ictericia con</tspan><tspan x="500.0" dy="19">bilirrubina directa</tspan><tspan x="500.0" dy="19">alta</tspan></text><rect x="40.0" y="279.4" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="308.2" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Fosfatasa alcalina</tspan></text><text x="190.0" y="331.9" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Enzima del epitelio biliar: sube en la</tspan><tspan x="190.0" dy="17">obstrucción</tspan></text><rect x="144.6" y="360.6" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="375.6" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="386.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="387.6" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="420.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">AST</tspan></text><text x="190.0" y="444.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Sube mucho en el daño del hepatocito</tspan></text><rect x="660.0" y="279.4" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="280.4" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="313.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">ALT</tspan></text><text x="810.0" y="336.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">La más específica de hepatitis</tspan></text><rect x="660.0" y="379.4" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="380.4" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="408.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Glucuronosiltransferasa</tspan></text><text x="810.0" y="431.9" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Conjuga la bilirrubina dentro del hígado; no se</tspan><tspan x="810.0" dy="17">usa como marcador</tspan></text><text x="40.0" y="517.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Cólico y luego ictericia</tspan></text><line x1="248.5" y1="549.5" x2="267.5" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,544.5 266.5,554.5 274.5,549.5" fill="#0f766e"/><rect x="278.5" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Bilirrubina directa alta</tspan></text><line x1="487.0" y1="549.5" x2="506.0" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,544.5 505.0,554.5 513.0,549.5" fill="#0f766e"/><rect x="517.0" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Patrón colestásico</tspan></text><line x1="725.5" y1="549.5" x2="744.5" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,544.5 743.5,554.5 751.5,549.5" fill="#0f766e"/><rect x="755.5" y="529.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="553.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Fosfatasa alcalina alta</tspan></text><text x="40.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="622.0" width="358.0" height="287.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="632.0" width="124.6" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="646.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="316"><tspan x="61.0" dy="0">PATRÓN ESPERADO</tspan></text><g transform="translate(54.0,660.0) scale(1.0)"><text x="118" y="12" font-size="10" font-weight="700" fill="#64748b" text-anchor="start" data-max="0">Veces el valor normal</text><text x="110" y="39" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end" data-max="0">Fosfatasa alc.</text><rect x="118" y="24" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="24" width="80.8" height="22" rx="4" fill="#ea580c"/><text x="204.8" y="39" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">↑↑</text><text x="110" y="73" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">GGT</text><rect x="118" y="58" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="58" width="101.0" height="22" rx="4" fill="#94a3b8"/><text x="225.0" y="73" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">↑↑</text><text x="110" y="107" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Bilirrubina D</text><rect x="118" y="92" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="92" width="90.9" height="22" rx="4" fill="#94a3b8"/><text x="214.9" y="107" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">↑↑</text><text x="110" y="141" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">AST</text><rect x="118" y="126" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="126" width="28.3" height="22" rx="4" fill="#94a3b8"/><text x="152.28" y="141" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">normal o ↑</text><text x="110" y="175" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">ALT</text><rect x="118" y="160" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="160" width="30.3" height="22" rx="4" fill="#94a3b8"/><text x="154.3" y="175" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">normal o ↑</text><line x1="138.2" y1="20" x2="138.2" y2="194" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 3"/><text x="138.2" y="206" font-size="10" font-weight="800" fill="#0f766e" text-anchor="middle" data-max="0">normal</text></g><text x="54.0" y="886.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="330"><tspan x="54.0" dy="0">Esquema del patrón (no son valores del paciente).</tspan></text><rect x="420.0" y="622.0" width="540.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="438.0" cy="640.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="644.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">1</tspan></text><text x="458.0" y="644.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Colestasis: fosfatasa alcalina y GGT suben varias veces.</tspan></text><rect x="420.0" y="653.0" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="671.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">2</tspan></text><text x="458.0" y="675.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">AST y ALT suben poco (menos de 5 veces).</tspan></text><rect x="420.0" y="684.0" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="702.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">3</tspan></text><text x="458.0" y="706.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Si AST y ALT subieran &gt; 10 veces, el patrón sería hepatocelular.</tspan></text><text x="40.0" y="949.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="959.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="981.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="981.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">AST</tspan></text><text x="491.2" y="981.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">ALT</tspan></text><text x="678.8" y="981.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Glucuronosiltransferasa</tspan></text><rect x="775.5" y="962.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="981.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Fosfatasa alcalina</tspan></text><rect x="40.0" y="996.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="996.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1017.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Patrón</tspan></text><text x="303.8" y="1017.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Hepatocelular</tspan></text><text x="491.2" y="1017.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Hepatocelular</tspan></text><text x="678.8" y="1017.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No se mide</tspan></text><text x="866.2" y="1017.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Colestásico</tspan></text><rect x="40.0" y="959.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1054.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1082.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1104.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Obstrucción de la vía biliar: la bilirrubina conjugada refluye a la sangre y sube la fosfatasa alcalina.</tspan><tspan x="58.0" dy="18">• La GGT confirma que la fosfatasa es de origen biliar (y no ósea).</tspan><tspan x="58.0" dy="18">• Primer estudio: ecografía para ver si la vía biliar está dilatada.</tspan></text><text x="58.0" y="1162.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harrison Principios de Medicina Interna 22.ª ed. (2025); ACG, evaluación de pruebas hepáticas anormales (2017).</tspan></text></svg>