<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1347" viewBox="0 0 1000 1347" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Útero grande, globuloso y blando con dismenorrea progresiva: adenomiosis"><title>Útero grande, globuloso y blando con dismenorrea progresiva: adenomiosis</title><rect x="0.75" y="0.75" width="998.5" height="1345.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Sangrado uterino y dolor pélvico · adenomiosis</tspan></text><rect x="480.3" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="567.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="567.4" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Útero aumentado de tamaño</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Miomas: útero grande, irregular y duro.</tspan><tspan x="58.0" dy="17">Adenomiosis: útero grande, regular, globuloso y blando, con dismenorrea.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 42 años, G3 P3003, 3 cesáreas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Menstruaciones abundantes (6 toallas/día por 8 días).</tspan><tspan x="640.0" dy="16">Dismenorrea progresiva; útero de 12 cm, regular,</tspan><tspan x="640.0" dy="16">globuloso y blando.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL ÚTERO GRANDE AL DIAGNÓSTICO</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 543.8,385.0 76.2,385.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Útero de 12 cm con menorragia y dismenorrea</tspan></text><line x1="565.9" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="318.0" width="81.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="654.8" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="654.8" dy="0">Miomatosis</tspan></text><rect x="701.5" y="318.0" width="119.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="761.3" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="761.3" dy="0">Pólipo endometrial</tspan></text><rect x="827.0" y="318.0" width="89.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="871.7" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="871.7" dy="0">Adenomiosis</tspan></text><rect x="614.0" y="350.0" width="138.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="683.2" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="683.2" dy="0">Cáncer de endometrio</tspan></text><polygon points="76.2,389.0 543.8,389.0 507.5,445.0 112.5,445.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="417.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="421.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="421.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Útero irregular, duro, con nódulos?</tspan></text><line x1="529.6" y1="417.0" x2="606.0" y2="417.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="404.0" width="93.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="660.8" y="421.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="660.8" dy="0">✕ Miomatosis</tspan></text><line x1="636.0" y1="417.5" x2="697.6" y2="417.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,449.0 507.5,449.0 471.2,509.0 148.8,509.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="479.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="483.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="475.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Sangrado intermenstrual con útero</tspan><tspan x="320.0" dy="17">normal?</tspan></text><line x1="493.4" y1="479.0" x2="606.0" y2="479.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="466.0" width="131.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="679.8" y="483.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="679.8" dy="0">✕ Pólipo endometrial</tspan></text><line x1="636.0" y1="479.5" x2="735.6" y2="479.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,513.0 471.2,513.0 435.0,573.0 185.0,573.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="543.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="547.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="539.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Posmenopausia o</tspan><tspan x="320.0" dy="17">sangrado posmenopáusico?</tspan></text><line x1="457.1" y1="543.0" x2="606.0" y2="543.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="530.0" width="150.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="689.3" y="547.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="689.3" dy="0">✕ Cáncer de endometrio</tspan></text><line x1="636.0" y1="543.5" x2="754.5" y2="543.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="577.0" x2="310.0" y2="596.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,595.0 315.0,595.0 310.0,603.0" fill="#0f766e"/><rect x="140.0" y="607.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="636.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Adenomiosis</tspan></text><text x="310.0" y="660.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Útero globuloso, regular y blando; dismenorrea</tspan><tspan x="310.0" dy="17">progresiva</tspan></text><rect x="370.6" y="596.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="611.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="614.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="634.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="652.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">El útero es grande pero simétrico y blando: el endometrio</tspan><tspan x="628.0" dy="16">infiltra todo el miometrio.</tspan></text><text x="40.0" y="738.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="750.9" width="328.0" height="302.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="760.9" width="130.0" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="774.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="286"><tspan x="61.0" dy="0">EL ÚTERO DEL CASO</tspan></text><g transform="translate(54.0,788.9) scale(1.0)"><path d="M60 40 C60 0 240 0 240 40 L232 150 C224 190 76 190 68 150 Z" fill="#f9a8d4" stroke="#be185d" stroke-width="2.5" stroke-linejoin="round" /><circle cx="90" cy="60" r="4" fill="#9d174d" stroke="none" stroke-width="0" opacity="0.7"/><circle cx="210" cy="70" r="4" fill="#9d174d" stroke="none" stroke-width="0" opacity="0.7"/><circle cx="100" cy="130" r="4" fill="#9d174d" stroke="none" stroke-width="0" opacity="0.7"/><circle cx="200" cy="140" r="4" fill="#9d174d" stroke="none" stroke-width="0" opacity="0.7"/><circle cx="150" cy="30" r="4" fill="#9d174d" stroke="none" stroke-width="0" opacity="0.7"/><circle cx="120" cy="100" r="4" fill="#9d174d" stroke="none" stroke-width="0" opacity="0.7"/><circle cx="190" cy="104" r="4" fill="#9d174d" stroke="none" stroke-width="0" opacity="0.7"/><path d="M130 60 L170 60 L162 130 L138 130 Z" fill="#fecdd3" stroke="#be185d" stroke-width="1.5" stroke-linejoin="round" /><text x="150" y="210" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Útero grande, globuloso y blando:</text><text x="150" y="210" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="middle" data-max="0">Útero grande, globuloso y blando:</text><text x="150" y="224" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">endometrio dentro del músculo</text><text x="150" y="224" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="middle" data-max="0">endometrio dentro del músculo</text></g><rect x="390.0" y="750.9" width="570.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="408.0" cy="768.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="772.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">1</tspan></text><text x="428.0" y="772.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Miometrio engrosado de forma difusa, con islotes de endometrio (puntos).</tspan></text><rect x="390.0" y="781.9" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="799.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="803.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">2</tspan></text><text x="428.0" y="803.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Sangra más y duele más con cada menstruación.</tspan></text><rect x="390.0" y="812.9" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="830.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="834.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">3</tspan></text><text x="428.0" y="834.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">No forma nódulos como los miomas.</tspan></text><text x="40.0" y="1092.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1102.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1125.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1125.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Leiomiomatosis</tspan></text><text x="491.2" y="1125.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Pólipo endometrial</tspan></text><rect x="588.0" y="1105.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="1125.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Adenomiosis</tspan></text><text x="866.2" y="1125.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Cáncer de endometrio</tspan></text><rect x="40.0" y="1139.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1139.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1160.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Útero</tspan></text><text x="303.8" y="1160.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Irregular y duro</tspan></text><text x="491.2" y="1160.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Normal</tspan></text><text x="678.8" y="1160.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Globuloso y blando</tspan></text><text x="866.2" y="1160.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sangrado posmenopáusico</tspan></text><rect x="40.0" y="1102.9" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1197.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1225.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1247.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Multípara &gt; 40 años con menorragia + dismenorrea progresiva + útero globuloso blando = adenomiosis.</tspan><tspan x="58.0" dy="18">• Cesáreas y legrados previos aumentan el riesgo.</tspan><tspan x="58.0" dy="18">• Confirmación por eco TV o resonancia; tratamiento: DIU de levonorgestrel o histerectomía si ya no desea hijos.</tspan></text><text x="58.0" y="1305.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG; Williams Ginecología 4.ª ed.</tspan></text></svg>