<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1421" viewBox="0 0 1000 1421" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Prolapso uterino con úlcera cervical: primero biopsia, luego colpocleisis"><title>Prolapso uterino con úlcera cervical: primero biopsia, luego colpocleisis</title><rect x="0.75" y="0.75" width="998.5" height="1419.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Prolapso de órganos pélvicos · lesión cervical</tspan></text><rect x="472.8" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="560.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="560.0" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="168.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lesión sospechosa en un prolapso</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Una úlcera friable que sangra puede ser un cáncer de cuello.</tspan><tspan x="58.0" dy="17">Primero se sabe qué es y después se opera.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="168.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="166.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 85 años sin vida sexual hace &gt; 10</tspan><tspan x="640.0" dy="17">años</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Prolapso uterino estadio IV de larga evolución.</tspan><tspan x="640.0" dy="16">Sangrado reciente; cérvix expuesto con lesión ulcerada</tspan><tspan x="640.0" dy="16">y friable.</tspan></text><line x1="640.0" y1="238.0" x2="670.0" y2="238.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="242.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="258.0" x2="320.0" y2="288.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="288.0" x2="577.8" y2="288.0" stroke="#94a3b8" stroke-width="2"/><line x1="577.8" y1="288.0" x2="577.8" y2="317.0" stroke="#94a3b8" stroke-width="2"/><polygon points="572.8,316.0 582.8,316.0 577.8,324.0" fill="#94a3b8"/><line x1="577.8" y1="394.0" x2="577.8" y2="424.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="424.0" x2="811.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="424.0" x2="344.3" y2="453.0" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,452.0 349.3,452.0 344.3,460.0" fill="#94a3b8"/><line x1="811.3" y1="424.0" x2="811.3" y2="453.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,452.0 816.3,452.0 811.3,460.0" fill="#94a3b8"/><line x1="344.3" y1="518.0" x2="344.3" y2="563.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="563.5" x2="500.0" y2="563.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="563.5" x2="188.7" y2="592.5" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,591.5 193.7,591.5 188.7,599.5" fill="#94a3b8"/><line x1="500.0" y1="563.5" x2="500.0" y2="592.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,591.5 505.0,591.5 500.0,599.5" fill="#94a3b8"/><line x1="320.0" y1="258.0" x2="320.0" y2="288.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="288.0" x2="577.8" y2="288.0" stroke="#0f766e" stroke-width="3"/><line x1="577.8" y1="288.0" x2="577.8" y2="317.0" stroke="#0f766e" stroke-width="3"/><polygon points="572.8,316.0 582.8,316.0 577.8,324.0" fill="#0f766e"/><line x1="577.8" y1="394.0" x2="577.8" y2="424.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="424.0" x2="577.8" y2="424.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="424.0" x2="344.3" y2="453.0" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,452.0 349.3,452.0 344.3,460.0" fill="#0f766e"/><line x1="344.3" y1="518.0" x2="344.3" y2="563.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="563.5" x2="344.3" y2="563.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="563.5" x2="188.7" y2="592.5" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,591.5 193.7,591.5 188.7,599.5" fill="#0f766e"/><rect x="310.3" y="433.0" width="68.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="344.3" y="445.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="344.3" dy="0">Sí: biopsia</tspan></text><rect x="797.2" y="433.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="445.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><rect x="160.6" y="572.5" width="56.2" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="585.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Benigna</tspan></text><rect x="473.1" y="572.5" width="53.8" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="585.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Maligna</tspan></text><polygon points="317.8,359.0 343.8,324.0 811.8,324.0 837.8,359.0 811.8,394.0 343.8,394.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="363.8" cy="359.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="363.8" y="364.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="363.8" dy="0">?</tspan></text><text x="596.8" y="355.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="596.8" dy="0">¿Hay una lesión cervical sospechosa (úlcera friable que</tspan><tspan x="596.8" dy="17">sangra)?</tspan></text><polygon points="84.3,489.0 110.3,460.0 578.3,460.0 604.3,489.0 578.3,518.0 110.3,518.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="130.3" cy="489.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="130.3" y="494.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="130.3" dy="0">?</tspan></text><text x="363.3" y="493.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="363.3" dy="0">Resultado de la biopsia dirigida</tspan></text><rect x="40.0" y="599.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="627.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">COLPOCLEISIS</tspan></text><text x="188.7" y="650.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">85 años y sin vida sexual</tspan><tspan x="188.7" dy="17">Estrógeno local previo para la úlcera</tspan></text><rect x="351.3" y="599.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="636.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Tratar el cáncer</tspan></text><text x="500.0" y="659.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Estadificación y manejo oncológico</tspan></text><rect x="662.7" y="460.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="488.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Pesario o cirugía del prolapso</tspan></text><text x="811.3" y="511.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Según deseo y estado general</tspan></text><text x="40.0" y="729.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="741.9" width="348.0" height="368.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="751.9" width="93.5" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="765.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="306"><tspan x="61.0" dy="0">LO QUE SE VE</tspan></text><g transform="translate(54.0,779.9) scale(1.0)"><ellipse cx="58" cy="170" rx="16" ry="30" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2" transform="rotate(20 58 170)" /><path d="M246 20 C300 70 300 170 250 236 L236 226 C280 164 278 76 232 32 Z" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round" /><text x="40" y="214" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">pubis</text><text x="298" y="250" font-size="10" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">sacro</text><line x1="20" y1="262" x2="300" y2="262" stroke="#e9b48f" stroke-width="3"/><text x="24" y="256" font-size="10" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">periné</text><path d="M252 40 C262 110 236 170 204 206 C190 222 182 240 178 262" fill="none" stroke="#fcd34d" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/><path d="M252 40 C262 110 236 170 204 206 C190 222 182 240 178 262" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round" /><path d="M168 150 C156 196 140 230 128 262" fill="none" stroke="#f9a8d4" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M168 150 C156 196 140 230 128 262" fill="none" stroke="#be185d" stroke-width="1.5" stroke-linejoin="round" /><path d="M78 110 C74 70 140 62 146 104 C150 136 132 150 108 150 C88 150 80 132 78 110 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round" /><path d="M120 250 C110 220 140 200 160 214 C176 226 170 254 156 268 Z" fill="#fbcfe8" stroke="#be185d" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142" cy="280" rx="22" ry="11" fill="#fda4af" stroke="#be185d" stroke-width="2" /><ellipse cx="146" cy="282" rx="9" ry="5" fill="#7f1d1d" stroke="none" stroke-width="0" /><text x="160" y="300" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">cérvix fuera de la vulva, con úlcera</text><text x="160" y="300" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">cérvix fuera de la vulva, con úlcera</text></g><rect x="410.0" y="741.9" width="550.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="759.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="763.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">1</tspan></text><text x="448.0" y="763.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="448.0" dy="0">Útero descendido: el cérvix queda fuera de la vulva.</tspan></text><rect x="410.0" y="772.9" width="550.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="428.0" cy="790.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="794.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">2</tspan></text><text x="448.0" y="794.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="506"><tspan x="448.0" dy="0">Úlcera friable en el cérvix expuesto: puede ser decúbito o cáncer.</tspan></text><rect x="410.0" y="803.9" width="550.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="821.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="825.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">3</tspan></text><text x="448.0" y="825.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="448.0" dy="0">Por eso la biopsia va primero.</tspan></text><text x="40.0" y="1149.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1159.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1190.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1190.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Histerectomía sin biopsia</tspan></text><rect x="400.5" y="1162.9" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="1182.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Biopsia y colpocleisis si</tspan><tspan x="491.2" dy="17">benigna</tspan></text><text x="678.8" y="1190.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Colporrafia con cierre</tspan></text><text x="866.2" y="1190.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Estrógenos y pesario</tspan></text><rect x="40.0" y="1213.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1213.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1234.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1234.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Opera sin saber si es cáncer</tspan></text><text x="491.2" y="1234.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ninguno</tspan></text><text x="678.8" y="1234.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No estudia la lesión</tspan></text><text x="866.2" y="1234.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Retrasa el diagnóstico</tspan></text><rect x="40.0" y="1159.9" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1271.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1299.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1321.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Lesión cervical sospechosa: biopsia dirigida antes de cualquier cirugía.</tspan><tspan x="58.0" dy="18">• Benigna (úlcera de decúbito) + sin vida sexual + edad avanzada: colpocleisis (cirugía corta y eficaz).</tspan><tspan x="58.0" dy="18">• Maligna: tratar el cáncer de cuello según su estadio.</tspan></text><text x="58.0" y="1379.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG n.º 214; guía NCCN de cáncer de cuello uterino.</tspan></text></svg>