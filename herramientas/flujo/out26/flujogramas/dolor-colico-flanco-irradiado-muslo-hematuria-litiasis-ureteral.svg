font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Hematuria microscópica: el cálculo irrita la mucosa.</tspan></text><text x="40.0" y="1163.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1173.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1196.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1196.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Pielonefritis</tspan></text><text x="491.2" y="1196.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Poliquistosis</tspan></text><text x="678.8" y="1196.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Tumor vesical</tspan></text><rect x="775.5" y="1176.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="1196.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Litiasis ureteral</tspan></text><rect x="40.0" y="1210.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="1210.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1231.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="303.8" y="1231.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: sin fiebre</tspan></text><text x="491.2" y="1231.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: sin masas ni HTA</tspan></text><text x="678.8" y="1231.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: es indoloro</tspan></text><text x="866.2" y="1231.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="1173.9" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1268.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1296.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1318.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dolor cólico de flanco irradiado + hematuria microscópica sin fiebre = litiasis ureteral.</tspan><tspan x="58.0" dy="18">• Confirmar con ecografía o TC sin contraste; analgesia con AINE.</tspan><tspan x="58.0" dy="18">• Fiebre o leucocituria cambiarían el cuadro (riñón obstruido e infectado).</tspan></text><text x="58.0" y="1376.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EAU, guías de urología (2024); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>