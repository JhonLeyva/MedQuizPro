<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1111" viewBox="0 0 1000 1111" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="TB y VIH con carga viral alta pese a buena adherencia: la rifampicina baja el antirretroviral"><title>TB y VIH con carga viral alta pese a buena adherencia: la rifampicina baja el antirretroviral</title><rect x="0.75" y="0.75" width="998.5" height="1109.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Coinfección TB-VIH · interacciones</tspan></text><rect x="407.1" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="475.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="475.5" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rifampicina y antirretrovirales</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La rifampicina es un inductor enzimático potente (CYP3A4, UGT1A1).</tspan><tspan x="58.0" dy="17">Baja los niveles de inhibidores de proteasa, dolutegravir y otros.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 38 años con sida y TB bacilífera</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">CD4 120; inició TAR y antituberculosos.</tspan><tspan x="640.0" dy="16">A los 2 meses: carga viral alta y CD4 bajos pese a</tspan><tspan x="640.0" dy="16">buena adherencia.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS CUATRO OPCIONES FRENTE AL CASO</tspan></text><line x1="410.3" y1="419.0" x2="340.0" y2="441.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="441.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="363.0" x2="660.0" y2="341.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="341.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="419.0" x2="660.0" y2="441.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="441.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="363.0" x2="340.0" y2="341.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="341.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="391.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="391.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="386.5" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">Carga viral alta con</tspan><tspan x="500.0" dy="19">rifampicina</tspan></text><rect x="40.0" y="299.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="332.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Cambiar a TAR compatible</tspan></text><text x="190.0" y="356.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Dolutegravir cada 12 h o efavirenz</tspan></text><rect x="144.6" y="373.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="388.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="399.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="400.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="432.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Quitar la rifampicina</tspan></text><text x="190.0" y="456.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Debilita el tratamiento de la TB</tspan></text><rect x="660.0" y="299.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="300.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="332.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Retrasar el TAR</tspan></text><text x="810.0" y="356.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Con CD4 bajos aumenta la mortalidad</tspan></text><rect x="660.0" y="399.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="400.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="432.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">No cambiar nada</tspan></text><text x="810.0" y="456.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">La interacción sigue</tspan></text><text x="40.0" y="533.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="545.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">TB + VIH</tspan></text><line x1="248.5" y1="565.5" x2="267.5" y2="565.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,560.5 266.5,570.5 274.5,565.5" fill="#0f766e"/><rect x="278.5" y="545.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Rifampicina + TAR</tspan></text><line x1="487.0" y1="565.5" x2="506.0" y2="565.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,560.5 505.0,570.5 513.0,565.5" fill="#0f766e"/><rect x="517.0" y="545.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Carga viral alta</tspan></text><line x1="725.5" y1="565.5" x2="744.5" y2="565.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,560.5 743.5,570.5 751.5,565.5" fill="#0f766e"/><rect x="755.5" y="545.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="569.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Ajustar el TAR</tspan></text><text x="40.0" y="626.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="638.0" width="358.0" height="162.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="648.0" width="178.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="662.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="316"><tspan x="61.0" dy="0">NIVEL DEL ANTIRRETROVIRAL</tspan></text><g transform="translate(54.0,676.0) scale(1.0)"><text x="118" y="12" font-size="10" font-weight="700" fill="#64748b" text-anchor="start" data-max="0">Nivel en sangre (%)</text><text x="110" y="39" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Sin rifampicina</text><rect x="118" y="24" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="24" width="183.6" height="22" rx="4" fill="#94a3b8"/><text x="295.6363636363636" y="39" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="end" data-max="0">nivel eficaz</text><text x="110" y="73" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end" data-max="0">Con rifampicina</text><rect x="118" y="58" width="202" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="58" width="55.1" height="22" rx="4" fill="#ea580c"/><text x="179.0909090909091" y="73" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">muy bajo</text></g><rect x="420.0" y="638.0" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="656.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="660.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">1</tspan></text><text x="458.0" y="660.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">La rifampicina acelera su metabolismo en el hígado.</tspan></text><rect x="420.0" y="669.0" width="540.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="438.0" cy="687.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">2</tspan></text><text x="458.0" y="691.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">El nivel cae por debajo del eficaz.</tspan></text><rect x="420.0" y="700.0" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="718.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="722.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">3</tspan></text><text x="458.0" y="722.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Por eso falla aunque lo tome bien.</tspan></text><text x="40.0" y="840.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="850.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="881.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="872.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Cambiar rifampicina por</tspan><tspan x="303.8" dy="17">etambutol</tspan></text><text x="491.2" y="881.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Retrasar el TAR</tspan></text><rect x="588.0" y="853.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="881.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">TAR compatible</tspan></text><text x="866.2" y="872.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Profilaxis a contactos, sin</tspan><tspan x="866.2" dy="17">cambios</tspan></text><rect x="40.0" y="904.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="904.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="925.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="925.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Debilita el esquema de TB</tspan></text><text x="491.2" y="925.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Más mortalidad</tspan></text><text x="678.8" y="925.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Ninguno</tspan></text><text x="866.2" y="925.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No corrige la interacción</tspan></text><rect x="40.0" y="850.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="962.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="990.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1012.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Falla con buena adherencia en quien recibe rifampicina: pensar en la interacción.</tspan><tspan x="58.0" dy="18">• Ajustar el TAR a uno compatible: dolutegravir 50 mg cada 12 h o efavirenz.</tspan><tspan x="58.0" dy="18">• No quitar la rifampicina (es la base del tratamiento) ni retrasar el TAR.</tspan></text><text x="58.0" y="1070.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, TB-VIH (2022); MINSA Perú.</tspan></text></svg>