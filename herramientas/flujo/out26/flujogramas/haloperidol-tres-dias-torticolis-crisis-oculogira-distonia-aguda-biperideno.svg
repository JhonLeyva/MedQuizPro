 font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="368.0" dy="0">1</tspan></text><text x="386.0" y="609.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="566"><tspan x="386.0" dy="0">Tortícolis dolorosa.</tspan></text><rect x="350.0" y="627.5" width="610.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="368.0" cy="643.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="368.0" y="647.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="368.0" dy="0">2</tspan></text><text x="386.0" y="647.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="566"><tspan x="386.0" dy="0">Crisis oculógira: ojos hacia arriba.</tspan></text><rect x="350.0" y="665.5" width="610.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="368.0" cy="681.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="368.0" y="685.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="368.0" dy="0">3</tspan></text><text x="386.0" y="685.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="566"><tspan x="386.0" dy="0">Lengua que protruye: le cuesta hablar.</tspan></text><text x="40.0" y="923.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="933.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="956.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="956.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Clonazepam</tspan></text><text x="491.2" y="956.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Levodopa</tspan></text><text x="678.8" y="956.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Orfenadrina</tspan></text><rect x="775.5" y="936.5" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="956.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Biperideno</tspan></text><rect x="40.0" y="970.5" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="970.5" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="991.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Comentario</tspan></text><text x="303.8" y="991.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Coadyuvante</tspan></text><text x="491.2" y="991.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No se usa</tspan></text><text x="678.8" y="991.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Menos usado</tspan></text><text x="866.2" y="991.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Elección</tspan></text><rect x="40.0" y="933.5" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1028.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1056.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1078.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Distonía aguda: anticolinérgico (biperideno IM o EV); difenhidramina es alternativa.</tspan><tspan x="58.0" dy="18">• Mejora en minutos; seguir el anticolinérgico unos días o cambiar de antipsicótico.</tspan><tspan x="58.0" dy="18">• Si hubiera laringoespasmo: urgencia de vía aérea. La levodopa no se usa.</tspan></text><text x="58.0" y="1136.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Maudsley Prescribing Guidelines (2021); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>