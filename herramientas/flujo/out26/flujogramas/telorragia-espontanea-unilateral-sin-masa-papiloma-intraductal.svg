<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1267" viewBox="0 0 1000 1267" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Secreción con sangre por un solo pezón y sin masa: papiloma intraductal"><title>Secreción con sangre por un solo pezón y sin masa: papiloma intraductal</title><rect x="0.75" y="0.75" width="998.5" height="1265.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Patología mamaria · secreción por el pezón</tspan></text><rect x="455.7" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="542.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="542.9" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Secreción por el pezón</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bilateral, lechosa y provocada: casi siempre benigna (fisiológica o hormonal).</tspan><tspan x="58.0" dy="17">Espontánea, unilateral, de un conducto y con sangre: estudiar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 23 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Secreción sanguinolenta espontánea por el pezón</tspan><tspan x="640.0" dy="16">derecho de 2 semanas.</tspan><tspan x="640.0" dy="16">No gestante ni lactante; sin masa ni adenopatías.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS CUATRO OPCIONES FRENTE AL CASO</tspan></text><line x1="410.9" y1="420.9" x2="340.0" y2="444.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="444.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="363.0" x2="660.0" y2="341.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="341.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="420.9" x2="660.0" y2="444.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="444.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="363.0" x2="340.0" y2="341.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="341.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="391.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="391.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="377.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">Telorragia</tspan><tspan x="500.0" dy="19">espontánea</tspan><tspan x="500.0" dy="19">unilateral sin masa</tspan></text><rect x="40.0" y="295.4" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="324.2" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Papiloma intraductal</tspan></text><text x="190.0" y="347.9" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Tumor benigno dentro de un conducto que</tspan><tspan x="190.0" dy="17">sangra</tspan></text><rect x="144.6" y="376.6" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="391.6" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="402.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="403.6" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="436.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Fibroadenoma</tspan></text><text x="190.0" y="460.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Nódulo móvil, sin secreción</tspan></text><rect x="660.0" y="295.4" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="296.4" width="6.0" height="89.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="324.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Cáncer de mama</tspan></text><text x="810.0" y="347.9" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Más probable con masa, edad mayor o</tspan><tspan x="810.0" dy="17">retracción</tspan></text><rect x="660.0" y="402.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="403.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="436.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Tumor filoides</tspan></text><text x="810.0" y="460.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Masa que crece rápido, sin secreción</tspan></text><text x="40.0" y="533.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Mujer joven</tspan></text><line x1="248.5" y1="574.0" x2="267.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,569.0 266.5,579.0 274.5,574.0" fill="#0f766e"/><rect x="278.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Secreción con sangre de un</tspan><tspan x="380.8" dy="17">solo lado</tspan></text><line x1="487.0" y1="574.0" x2="506.0" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,569.0 505.0,579.0 513.0,574.0" fill="#0f766e"/><rect x="517.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Sin masa palpable</tspan></text><line x1="725.5" y1="574.0" x2="744.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,569.0 743.5,579.0 751.5,574.0" fill="#0f766e"/><rect x="755.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="578.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Papiloma intraductal</tspan></text><text x="40.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="655.0" width="328.0" height="302.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="665.0" width="147.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="679.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="286"><tspan x="61.0" dy="0">DÓNDE ESTÁ LA LESIÓN</tspan></text><g data-box="54.0 693.0 300.0 240.0"><g transform="translate(54.0,693.0) scale(1.0)"><circle cx="150" cy="125" r="100" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="150" cy="125" r="24" fill="#d6a684" stroke="#9a6b52" stroke-width="1.5" /><circle cx="150" cy="125" r="8" fill="#9a6b52" stroke="none" stroke-width="0" /><path d="M168 125 L230 125" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M163 138 L207 182" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M150 143 L150 205" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M137 138 L93 182" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M132 125 L70 125" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M137 112 L93 68" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M150 107 L150 45" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M163 112 L207 68" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><line x1="150" y1="22" x2="150" y2="228" stroke="#cbd5e1" stroke-dasharray="4 4"/><line x1="46" y1="125" x2="254" y2="125" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="30" y="20" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">axila</text><path d="M150 125 L90 70" fill="none" stroke="#be185d" stroke-width="4" stroke-linejoin="round" /><ellipse cx="116" cy="100" rx="8" ry="5" fill="#e11d48" stroke="#881337" stroke-width="1.2" /><path d="M150 133 q-4 10 0 16 q4 -6 0 -16 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="1" stroke-linejoin="round" /><text x="120" y="172" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">papiloma dentro de un conducto</text><text x="120" y="172" font-size="10.5" font-weight="800" fill="#881337" text-anchor="middle" data-max="0">papiloma dentro de un conducto</text><text x="150" y="222" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">secreción con sangre por el pezón</text><text x="150" y="222" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle" data-max="0">secreción con sangre por el pezón</text></g></g><rect x="390.0" y="655.0" width="570.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="408.0" cy="670.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">1</tspan></text><text x="426.0" y="675.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Pequeño papiloma dentro de un conducto cerca de la areola.</tspan></text><rect x="390.0" y="693.0" width="570.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="708.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="712.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">2</tspan></text><text x="426.0" y="713.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Es frágil y vascular: sangra hacia el conducto.</tspan></text><rect x="390.0" y="731.0" width="570.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="746.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="750.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">3</tspan></text><text x="426.0" y="751.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Por eso la secreción es de un solo conducto y un solo lado.</tspan></text><text x="40.0" y="997.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1007.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1029.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1029.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Fibroadenoma</tspan></text><text x="491.2" y="1029.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Cáncer de mama</tspan></text><text x="678.8" y="1029.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Tumor filoides</tspan></text><rect x="775.5" y="1010.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="1029.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Papiloma intraductal</tspan></text><rect x="40.0" y="1044.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="1044.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1065.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Da telorragia sin</tspan><tspan x="54.0" dy="16">masa?</tspan></text><text x="303.8" y="1073.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="1073.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Raro sin masa en joven</tspan></text><text x="678.8" y="1073.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="1073.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="1007.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1118.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1146.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1168.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Telorragia espontánea unilateral sin masa en mujer joven = papiloma intraductal (la causa más frecuente).</tspan><tspan x="58.0" dy="18">• Estudio: ecografía (± mamografía si ≥ 30-35 años); tratamiento: extirpación del conducto afectado.</tspan><tspan x="58.0" dy="18">• Si hay masa, retracción o edad mayor: descartar cáncer.</tspan></text><text x="58.0" y="1226.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NCCN, secreción por el pezón (2024); Bland y Copeland, La Mama 5.ª ed.</tspan></text></svg>