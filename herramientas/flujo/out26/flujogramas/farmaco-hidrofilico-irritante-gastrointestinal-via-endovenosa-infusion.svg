<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1011" viewBox="0 0 1000 1011" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fármaco muy hidrofílico, irritante digestivo y que necesita niveles rápidos: vía endovenosa en infusión"><title>Fármaco muy hidrofílico, irritante digestivo y que necesita niveles rápidos: vía endovenosa en infusión</title><rect x="0.75" y="0.75" width="998.5" height="1009.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · vías de administración</tspan></text><rect x="425.6" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="505.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="505.0" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Elegir la vía de administración</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se descartan las vías que no cumplen cada requisito del fármaco.</tspan><tspan x="58.0" dy="17">La EV da biodisponibilidad del 100 % y control de la velocidad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fármaco muy hidrofílico, muy irritante para la mucosa</tspan><tspan x="640.0" dy="16">digestiva.</tspan><tspan x="640.0" dy="16">Se necesitan concentraciones rápidas y seguras.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ VÍA CUMPLE TODO?</tspan></text><rect x="40.0" y="285.0" width="642.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="512"><tspan x="56.0" dy="0">REQUISITOS DEL FÁRMACO</tspan></text><text x="666.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="666.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="319.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="329.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="344.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="343.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">No pasar por la mucosa digestiva (irritante)</tspan></text><text x="86.0" y="359.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Descarta la oral</tspan></text><text x="666.0" y="343.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="365.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="375.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="390.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="389.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">No depender de cruzar membranas (hidrofílico)</tspan></text><text x="86.0" y="405.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Oral e inhalatoria absorben mal</tspan></text><text x="666.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="411.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="421.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="436.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="435.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Niveles rápidos</tspan></text><text x="86.0" y="451.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">La IM es más lenta e irregular</tspan></text><text x="666.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="457.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="467.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="482.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="481.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Seguridad: poder ajustar la velocidad</tspan></text><text x="86.0" y="497.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">La infusión se controla y se detiene</tspan></text><text x="666.0" y="481.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="503.0" width="642.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="513.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="528.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✕</tspan></text><text x="86.0" y="527.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Efecto solo local</tspan></text><text x="86.0" y="543.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Se busca efecto sistémico</tspan></text><text x="666.0" y="527.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">No</tspan></text><rect x="40.0" y="549.0" width="642.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="571.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="610"><tspan x="56.0" dy="0">Cumple 4 de 5 · cumplir los 4</tspan></text><text x="56.0" y="591.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="610"><tspan x="56.0" dy="0">Endovenosa en infusión controlada</tspan></text><rect x="40.0" y="285.0" width="642.0" height="321.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="702.0" y="285.0" width="258.0" height="267.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="714.0" y="295.0" width="124.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="723.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="723.0" dy="0">LAS VÍAS POSIBLES</tspan></text><g transform="translate(718.0,333.0) scale(0.75)"><rect x="10" y="10" width="120" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="70.0" y="27.0" font-size="10" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">Oral</text><text x="70.0" y="40.0" font-size="10" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">irrita, absorbe mal</text><rect x="10" y="64" width="120" height="40" rx="8" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/><text x="70.0" y="81.0" font-size="10" font-weight="800" fill="#92400e" text-anchor="middle" data-max="0">Intramuscular</text><text x="70.0" y="94.0" font-size="10" font-weight="800" fill="#92400e" text-anchor="middle" data-max="0">duele, lenta</text><rect x="10" y="118" width="120" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="70.0" y="135.0" font-size="10" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">Inhalatoria</text><text x="70.0" y="148.0" font-size="10" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">no sistémica así</text><rect x="10" y="172" width="120" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="70.0" y="192.0" font-size="10" font-weight="800" fill="#166534" text-anchor="middle" data-max="0">Endovenosa</text><text x="70.0" y="205.0" font-size="10" font-weight="800" fill="#166534" text-anchor="middle" data-max="0">100 % y controlada</text><rect x="210" y="20" width="44" height="64" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><path d="M232 84 L232 150 C232 170 210 180 196 196" fill="none" stroke="#0369a1" stroke-width="3" stroke-linejoin="round" /><text x="232" y="56" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">infusión</text><text x="232" y="56" font-size="9.5" font-weight="800" fill="#075985" text-anchor="middle" data-max="0">infusión</text><line x1="196.0" y1="196.0" x2="148.0" y2="196.0" stroke="#16a34a" stroke-width="2.4"/><polygon points="140.0,196.0 149.0,191.7 149.0,200.3" fill="#16a34a"/></g><text x="716.0" y="529.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Solo la EV cumple todos los requisitos.</tspan></text><text x="40.0" y="638.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="648.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="649.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="672.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Oral recubierta</tspan></text><text x="58.0" y="693.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Sigue absorbiendo mal un fármaco hidrofílico.</tspan></text><rect x="351.3" y="648.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="649.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="672.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">IM profunda</tspan></text><text x="369.3" y="693.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Dolorosa con un irritante y más lenta.</tspan></text><rect x="662.7" y="648.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="663.7" y="649.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="680.7" y="672.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Lo correcto</tspan></text><text x="680.7" y="693.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">EV en infusión controlada.</tspan></text><rect x="860.2" y="637.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="652.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="757.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="767.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="789.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="789.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Oral recubierta</tspan></text><text x="491.2" y="789.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">IM profunda</tspan></text><text x="678.8" y="789.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Inhalatoria</tspan></text><rect x="775.5" y="770.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="789.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">EV en infusión</tspan></text><rect x="40.0" y="804.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="804.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="825.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="825.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Absorbe mal</tspan></text><text x="491.2" y="825.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Dolor, lenta</tspan></text><text x="678.8" y="825.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No es sistémica así</tspan></text><text x="866.2" y="825.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Ninguno</tspan></text><rect x="40.0" y="767.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="862.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="890.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="912.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hidrofílico: cruza mal membranas → la vía oral absorbe poco.</tspan><tspan x="58.0" dy="18">• Irritante: no por boca y mal tolerado en el músculo.</tspan><tspan x="58.0" dy="18">• Rápido y seguro: endovenosa en infusión controlada (se ajusta la velocidad).</tspan></text><text x="58.0" y="970.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman &amp; Gilman, Bases farmacológicas 14.ª ed. (2023).</tspan></text></svg>