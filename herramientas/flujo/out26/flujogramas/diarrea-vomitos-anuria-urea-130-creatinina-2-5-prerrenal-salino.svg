<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1053" viewBox="0 0 1000 1053" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diarrea y vómitos con anuria, urea 130 y creatinina 2,5: lesión renal prerrenal, solución salina"><title>Diarrea y vómitos con anuria, urea 130 y creatinina 2,5: lesión renal prerrenal, solución salina</title><rect x="0.75" y="0.75" width="998.5" height="1051.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Lesión renal aguda · prerrenal</tspan></text><rect x="378.4" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="442.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="442.1" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lesión renal aguda prerrenal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El riñón está sano pero le llega poca sangre por falta de volumen.</tspan><tspan x="58.0" dy="17">Si se repone a tiempo, la función vuelve.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 25 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">3 días de diarrea abundante y vómitos; no tolera</tspan><tspan x="640.0" dy="16">líquidos; no orina hace 12 h.</tspan><tspan x="640.0" dy="16">Deshidratada; urea 130 mg/dL, creatinina 2,5 mg/dL.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE CALCULA Y SE RAZONA</tspan></text><rect x="40.0" y="285.0" width="250.0" height="470.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="197.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">LA PACIENTE Y SU LABORATORIO</tspan></text><g transform="translate(52.0,325.0) scale(1.0)"><text x="118" y="12" font-size="10" font-weight="700" fill="#64748b" text-anchor="start" data-max="0">Relación BUN/creatinina</text><text x="110" y="39" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end" data-max="0">BUN/creat.</text><rect x="118" y="24" width="92" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="24" width="73.6" height="22" rx="4" fill="#ea580c"/><text x="185.60000000000002" y="39" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="end" data-max="0">24</text><text x="110" y="73" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Corte</text><rect x="118" y="58" width="92" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="58" width="61.3" height="22" rx="4" fill="#94a3b8"/><text x="173.33333333333331" y="73" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="end" data-max="0">20</text></g><g transform="translate(106.0,425.0) scale(0.55)"><circle cx="120" cy="40" r="28" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse 