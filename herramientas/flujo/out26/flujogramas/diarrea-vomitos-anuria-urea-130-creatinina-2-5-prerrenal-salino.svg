idth="234.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="165.0" y="728.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="220"><tspan x="165.0" dy="0">1 mucosas secas; 2 no orina.</tspan><tspan x="165.0" dy="15">BUN/creatinina 24.</tspan></text><circle cx="326.0" cy="307.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="312.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">1</tspan></text><rect x="350.0" y="285.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="286.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="309.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Urea a BUN</tspan></text><text x="368.0" y="330.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">130 ÷ 2,14 ≈ 61 mg/dL.</tspan></text><circle cx="326.0" cy="388.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="393.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">2</tspan></text><rect x="350.0" y="366.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="367.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="390.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">BUN/creatinina</tspan></text><text x="368.0" y="411.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">61 ÷ 2,5 ≈ 24 (&gt; 20).</tspan></text><circle cx="326.0" cy="469.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="474.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">3</tspan></text><rect x="350.0" y="447.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="448.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="471.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Clínica</tspan></text><text x="368.0" y="492.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Diarrea, vómitos, deshidratada, sin orinar.</tspan></text><circle cx="326.0" cy="550.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="555.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">4</tspan></text><rect x="350.0" y="528.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="529.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="552.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Tipo de lesión</tspan></text><text x="368.0" y="573.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Prerrenal: falta volumen.</tspan></text><circle cx="326.0" cy="631.0" r="14" fill="#0f766e" stroke="none" stroke-width="0"/><text x="326.0" y="636.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">5</tspan></text><rect x="350.0" y="609.0" width="610.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="351.0" y="610.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="368.0" y="633.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Resultado</tspan></text><text x="368.0" y="654.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Solución salina 0,9 % EV.</tspan></text><rect x="860.2" y="598.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="613.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="799.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="809.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="831.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Diálisis de emergencia</tspan></text><text x="491.2" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Diuréticos EV</tspan></text><rect x="588.0" y="812.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Solución salina EV</tspan></text><text x="866.2" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Derivar a nefrología</tspan></text><rect x="40.0" y="846.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="846.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="867.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sin indicación</tspan></text><text x="491.2" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Empeoran la volemia</tspan></text><text x="678.8" y="867.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Ninguno</tspan></text><text x="866.2" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Retrasa la hidratación</tspan></text><rect x="40.0" y="809.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="904.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="932.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="954.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pérdidas digestivas + deshidratación + BUN/creatinina &gt; 20 = lesión renal prerrenal.</tspan><tspan x="58.0" dy="18">• Conducta inicial: solución salina 0,9 % EV y vigilar la diuresis.</tspan><tspan x="58.0" dy="18">• La diálisis, los diuréticos o derivar sin hidratar no corrigen la causa.</tspan></text><text x="58.0" y="1012.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO, lesión renal aguda (2012); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>