0" y="514.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sí</tspan></text><rect x="40.0" y="536.0" width="596.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="546.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="561.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="560.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Pérdida de la altura de la presentación</tspan></text><text x="86.0" y="576.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">No se describe</tspan></text><text x="620.0" y="560.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="582.0" width="596.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="604.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="564"><tspan x="56.0" dy="0">Cumple 4 de 5 · cicatriz previa + estos signos</tspan></text><text x="56.0" y="624.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="564"><tspan x="56.0" dy="0">Rotura uterina: cesárea de emergencia y reanimación</tspan></text><rect x="40.0" y="318.0" width="596.0" height="321.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="656.0" y="318.0" width="304.0" height="410.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="668.0" y="328.0" width="73.7" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="677.0" y="342.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="677.0" dy="0">QUÉ PASÓ</tspan></text><g transform="translate(670.0,356.0) scale(0.92)"><ellipse cx="150" cy="150" rx="124" ry="142" fill="#fbcfe8" stroke="#be185d" stroke-width="3" /><ellipse cx="150" cy="150" rx="108" ry="126" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" /><path d="M40 70 C80 20 170 10 230 30 L210 62 C160 44 100 50 62 88 Z" fill="#9f1239" stroke="#881337" stroke-width="1.5" stroke-linejoin="round" /><ellipse cx="155.7" cy="124.4" rx="41.8" ry="55.099999999999994" fill="#fcd5b5" stroke="#e9b48f" stroke-width="1.6" transform="rotate(-10 155.7 124.4)" /><circle cx="150" cy="202.3" r="34.199999999999996" fill="#fcd5b5" stroke="#e9b48f" stroke-width="1.6" /><path d="M178.5 103.5 q26 17.099999999999998 8 41.8" fill="none" stroke="#e9b48f" stroke-width="4.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M123.4 151.0 q-18 20.9 6 34.199999999999996" fill="none" stroke="#e9b48f" stroke-width="4.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M138 288 L138 324 M162 288 L162 324" fill="none" stroke="#be185d" stroke-width="8" stroke-linejoin="round" /><path d="M44 230 L58 216 L50 204 L66 190" fill="none" stroke="#7f1d1d" stroke-width="5" stroke-linejoin="round" /><ellipse cx="20" cy="250" rx="20" ry="30" fill="#b91c1c" stroke="none" stroke-width="0" opacity="0.8"/><text x="4" y="300" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Desgarro del segmento</text><text x="4" y="300" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="start" data-max="0">Desgarro del segmento</text><text x="4" y="314" font-size="10" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">(cicatriz previa)</text><text x="4" y="314" font-size="10" font-weight="600" fill="#7f1d1d" text-anchor="start" data-max="0">(cicatriz previa)</text><text x="250" y="60" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">placenta</text><text x="250" y="60" font-size="10" font-weight="800" fill="#9f1239" text-anchor="start" data-max="0">placenta</text></g><text x="670.0" y="690.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="276"><tspan x="670.0" dy="0">La cicatriz del segmento se abre y sangra dentro del</tspan><tspan x="670.0" dy="15">abdomen.</tspan></text><text x="40.0" y="760.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="770.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="771.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="794.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Oxitocina o misoprostol</tspan></text><text x="58.0" y="815.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Empeoran la rotura.</tspan></text><rect x="351.3" y="770.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="771.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="794.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Instrumentar el parto</tspan></text><text x="369.3" y="815.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">El feto no está en el canal; no es posible.</tspan></text><rect x="662.7" y="770.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="663.7" y="771.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="680.7" y="794.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Cesárea de emergencia</tspan></text><text x="680.7" y="815.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Salva a madre y feto.</tspan></text><rect x="860.2" y="759.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="774.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="879.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="889.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="911.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="892.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Cesárea de emergencia</tspan></text><text x="491.2" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Oxitocina</tspan></text><text x="678.8" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Instrumentado</tspan></text><text x="866.2" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Misoprostol</tspan></text><rect x="40.0" y="926.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="926.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="947.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Adecuada?</tspan></text><text x="303.8" y="947.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="889.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="984.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1012.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1034.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Signo más temprano: alteración de la FCF (bradicardia); luego dolor, cese de contracciones, sangrado y shock.</tspan><tspan x="58.0" dy="18">• Conducta: cesárea (laparotomía) de emergencia con reanimación materna.</tspan><tspan x="58.0" dy="18">• Nunca oxitocina, misoprostol ni instrumentar.</tspan></text><text x="58.0" y="1092.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletins n.º 205 (parto vaginal tras cesárea, 2019); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>