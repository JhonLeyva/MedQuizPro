<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1133" viewBox="0 0 1000 1133" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dolor súbito, cese de contracciones y bradicardia tras cesárea previa: rotura uterina"><title>Dolor súbito, cese de contracciones y bradicardia tras cesárea previa: rotura uterina</title><rect x="0.75" y="0.75" width="998.5" height="1131.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parto vaginal tras cesárea · rotura uterina</tspan></text><rect x="445.4" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="532.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="532.6" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="184.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rotura uterina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Complicación temida del parto vaginal después de una cesárea (0,5-1 %).</tspan><tspan x="58.0" dy="17">El útero se abre, pierde fuerza y el feto queda sin oxígeno.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="184.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="182.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Secundigesta de 39 semanas con cesárea</tspan><tspan x="640.0" dy="17">previa</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Prueba de trabajo de parto; en fase activa: dolor súbito</tspan><tspan x="640.0" dy="16">muy intenso.</tspan><tspan x="640.0" dy="16">Cesan las contracciones, bradicardia fetal persistente,</tspan><tspan x="640.0" dy="16">cae la PA.</tspan></text><rect x="640.0" y="245.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="258.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="258.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="306.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿SE ROMPIÓ EL ÚTERO?</tspan></text><rect x="40.0" y="318.0" width="596.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="340.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="466"><tspan x="56.0" dy="0">SIGNOS DE ROTURA UTERINA</tspan></text><text x="620.0" y="340.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="620.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="352.0" width="596.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="362.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="376.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Bradicardia fetal persistente</tspan></text><text x="86.0" y="392.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Suele ser el primer signo</tspan></text><text x="620.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="620.0" dy="0">Sí</tspan></text><rect x="40.0" y="398.0" width="596.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="408.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="423.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="422.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="446"><tspan x="86.0" dy="0">Dolor abdominal súbito e intenso</tspan></text><text x="86.0" y="438.0" font-size="10.5" font-weight="500" font-style=