<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1178" viewBox="0 0 1000 1178" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Quemadura eléctrica: el daño mayor está en el músculo pegado al hueso"><title>Quemadura eléctrica: el daño mayor está en el músculo pegado al hueso</title><rect x="0.75" y="0.75" width="998.5" height="1176.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Quemaduras · lesión eléctrica</tspan></text><rect x="377.1" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="427.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="427.7" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Quemadura eléctrica de alto voltaje</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La piel de entrada y salida puede verse casi normal (lesión en iceberg).</tspan><tspan x="58.0" dy="17">El hueso resiste más la corriente, se calienta y cocina el músculo que lo rodea.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Técnico electricista de 34 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Alto voltaje: entrada en la mano derecha y salida en el</tspan><tspan x="640.0" dy="16">pie izquierdo.</tspan><tspan x="640.0" dy="16">Piel con lesiones superficiales en ambos sitios.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR FUERA Y POR DENTRO</tspan></text><rect x="40.0" y="295.0" width="438.0" height="448.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="305.0" width="176.3" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">TRAYECTO DE LA CORRIENTE</tspan></text><g transform="translate(183.0,337.0) scale(0.75)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#fde68a" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde68a" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><path d="M37 252 L56 170 L84 112 L120 150 L140 250 L146 360 L142 426" fill="none" stroke="#facc15" stroke-width="5" stroke-linejoin="round" stroke-dasharray="8 5"/><circle cx="37" cy="252" r="11" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="37" y="256" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">E</text><circle cx="142" cy="426" r="11" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="142" y="430" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">S</text><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><text x="54.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">E = entrada (mano derecha), S = salida (pie izquierdo). La corriente</tspan><tspan x="54.0" dy="16">atraviesa brazo, tórax y pierna.</tspan></text><rect x="522.0" y="295.0" width="438.0" height="448.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="534.0" y="305.0" width="209.6" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">CORTE A LO LARGO DEL TRAYECTO</tspan></text><rect x="844.6" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><g transform="translate(544.0,363.0) scale(1.2)"><rect x="14" y="30" width="176" height="14" fill="#fcd9bd"/><text x="198" y="41.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Epidermis</text><text x="198" y="41.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Epidermis</text><rect x="14" y="44" width="176" height="24" fill="#f9c0a8"/><text x="198" y="60.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Dermis papilar</text><text x="198" y="60.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Dermis papilar</text><rect x="14" y="68" width="176" height="46" fill="#f4a99b"/><text x="198" y="95.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Dermis reticular</text><text x="198" y="95.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Dermis reticular</text><rect x="14" y="114" width="176" height="42" fill="#fde68a"/><text x="198" y="139.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Hipodermis (grasa)</text><text x="198" y="139.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Hipodermis (grasa)</text><rect x="14" y="156" width="176" height="38" fill="#f87171"/><text x="198" y="179.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Músculo</text><text x="198" y="179.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Músculo</text><rect x="14" y="194" width="176" height="30" fill="#e7e5e4"/><text x="198" y="213.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Hueso</text><text x="198" y="213.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Hueso</text><path d="M60 44 L62 100 M60 44 L56 30" stroke="#78350f" stroke-width="2" fill="none"/><ellipse cx="62" cy="104" rx="5" ry="7" fill="#fca5a5" stroke="#9a3412"/><path d="M130 72 q6 6 0 12 q-6 6 0 12 q6 6 0 12" stroke="#0369a1" stroke-width="2" fill="none"/><path d="M150 50 L150 110" stroke="#eab308" stroke-width="2"/><rect x="14" y="194" width="176" height="30" fill="#fb923c"/><rect x="14" y="156" width="176" height="38" fill="#7f1d1d" opacity="0.35"/><circle cx="40" cy="30" r="5" fill="#57534e"/><text x="102.0" y="182" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Músculo pegado al hueso: necrosis</text><text x="102.0" y="182" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">Músculo pegado al hueso: necrosis</text><text x="102.0" y="216" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Hueso: más resistencia, más calor</text><text x="102.0" y="216" font-size="10.5" font-weight="800" fill="#7c2d12" text-anchor="middle" data-max="0">Hueso: más resistencia, más calor</text><text x="40" y="20" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Piel casi intacta</text><text x="40" y="20" font-size="10.5" font-weight="800" fill="#44403c" text-anchor="start" data-max="0">Piel casi intacta</text></g><text x="536.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="536.0" dy="0">El hueso se calienta y el músculo que lo toca se necrosa, aunque la piel se</tspan><tspan x="536.0" dy="16">vea casi intacta.</tspan></text><circle cx="500.0" cy="503.0" r="17" fill="#ea580c" stroke="none" stroke-width="0"/><polygon points="494.0,495.0 494.0,511.0 508.0,503.0" fill="#ffffff"/><text x="40.0" y="773.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONSECUENCIAS QUE HAY QUE BUSCAR</tspan></text><rect x="40.0" y="783.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="784.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="807.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Rabdomiólisis</tspan></text><text x="58.0" y="828.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">CPK alta y mioglobinuria: riesgo de falla renal; más</tspan><tspan x="58.0" dy="16">líquidos.</tspan></text><rect x="351.3" y="783.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="784.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="807.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Síndrome compartimental</tspan></text><text x="369.3" y="828.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Dolor y tensión del miembro: fasciotomía.</tspan></text><rect x="662.7" y="783.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="784.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="807.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Arritmias</tspan></text><text x="680.7" y="828.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">ECG y monitoreo cardiaco.</tspan></text><text x="40.0" y="908.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="918.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="940.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="940.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Hueso cortical</tspan></text><rect x="400.5" y="921.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="940.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Músculo junto al hueso</tspan></text><text x="678.8" y="940.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Piel de la mano</tspan></text><text x="866.2" y="940.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Grasa subcutánea</tspan></text><rect x="40.0" y="955.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="955.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="984.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mayor daño profundo?</tspan></text><text x="303.8" y="976.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: se calienta pero es el que</tspan><tspan x="303.8" dy="16">transmite el calor</tspan></text><text x="491.2" y="984.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="984.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: lesión superficial</tspan></text><text x="866.2" y="984.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="918.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1029.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1057.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1079.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El músculo profundo en contacto con el hueso sufre la mayor necrosis a lo largo del trayecto.</tspan><tspan x="58.0" dy="18">• Riesgos: síndrome compartimental, rabdomiólisis (mioglobinuria → falla renal) y arritmias.</tspan><tspan x="58.0" dy="18">• Por eso se reponen más líquidos que en una quemadura térmica y se busca diuresis de 1-1,5 mL/kg/h.</tspan></text><text x="58.0" y="1137.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025); American Burn Association.</tspan></text></svg>