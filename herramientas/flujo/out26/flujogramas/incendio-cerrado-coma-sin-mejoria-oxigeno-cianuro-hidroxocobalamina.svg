<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1125" viewBox="0 0 1000 1125" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Víctima de incendio en coma que no mejora con oxígeno al 100 %: cianuro, hidroxocobalamina"><title>Víctima de incendio en coma que no mejora con oxígeno al 100 %: cianuro, hidroxocobalamina</title><rect x="0.75" y="0.75" width="998.5" height="1124.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · inhalación de humo</tspan></text><rect x="395.9" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="475.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="475.3" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Humo de incendio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lleva monóxido de carbono y también cianuro (por la combustión de plásticos y lana).</tspan><tspan x="58.0" dy="17">El cianuro bloquea la citocromo oxidasa: la célula no puede usar el oxígeno.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 35 años en un hotel incendiado</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Glasgow 6, estable, PaO₂ 98 mmHg.</tspan><tspan x="640.0" dy="16">Intubada con oxígeno al 100 %, sin mejoría.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="733.5" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#94a3b8"/><line x1="733.5" y1="391.0" x2="733.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,419.0 738.5,419.0 733.5,427.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="391.0" x2="733.5" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="733.5" y1="391.0" x2="733.5" y2="420.0" stroke="#0f766e" stroke-width="3"/><polygon points="728.5,419.0 738.5,419.0 733.5,427.0" fill="#0f766e"/><rect x="254.4" y="400.0" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="266.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí</tspan></text><rect x="659.6" y="400.0" width="147.8" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="733.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No: coma, acidosis láctica</tspan></text><polygon points="240.0,326.0 266.0,291.0 734.0,291.0 760.0,326.0 734.0,361.0 266.0,361.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="326.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="331.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="322.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Víctima de incendio con alteración de conciencia: ¿mejora</tspan><tspan x="519.0" dy="17">con O₂ al 100 %?</tspan></text><rect x="40.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Monóxido de carbono</tspan></text><text x="266.5" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Seguir O₂ 100 %</tspan><tspan x="266.5" dy="17">Cámara hiperbárica si es grave</tspan></text><rect x="507.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="733.5" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">HIDROXOCOBALAMINA EV</tspan></text><text x="733.5" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">5 g en 15 minutos</tspan><tspan x="733.5" dy="17">Antídoto del cianuro</tspan></text><text x="40.0" y="557.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="569.5" width="351.0" height="262.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="579.5" width="165.6" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="593.5" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="309"><tspan x="61.0" dy="0">DÓNDE ACTÚA EL CIANURO</tspan></text><g transform="translate(54.0,607.5) scale(0.95)"><ellipse cx="170" cy="96" rx="150" ry="78" fill="#fed7aa" stroke="#c2410c" stroke-width="3" /><ellipse cx="170" cy="96" rx="132" ry="62" fill="#ffedd5" stroke="none" stroke-width="0" /><path d="M44 96 C60 50 76 140 92 96 C108 50 124 140 140 96 C156 50 172 140 188 96 C204 50 220 140 236 96 C252 50 268 140 284 96" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round" /><rect x="196" y="18" width="96" height="30" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="244.0" y="30.0" font-size="10" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">citocromo</text><text x="244.0" y="43.0" font-size="10" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">oxidasa</text><circle cx="244" cy="62" r="11" fill="#1e293b" stroke="none" stroke-width="0" /><text x="244" y="66" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">CN</text><text x="170" y="190" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">El cianuro bloquea la respiración celular:</text><text x="170" y="190" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">El cianuro bloquea la respiración celular:</text><text x="170" y="204" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">hay O₂ en la sangre, pero la célula no lo usa</text><text x="170" y="204" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">hay O₂ en la sangre, pero la célula no lo usa</text></g><rect x="413.0" y="569.5" width="547.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="431.0" cy="587.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="591.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">1</tspan></text><text x="451.0" y="591.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">Bloquea la citocromo oxidasa de la mitocondria.</tspan></text><rect x="413.0" y="600.5" width="547.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="431.0" cy="618.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="622.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">2</tspan></text><text x="451.0" y="622.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">La célula no usa el O₂ aunque la sangre lo tenga.</tspan></text><rect x="413.0" y="631.5" width="547.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="431.0" cy="649.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="653.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">3</tspan></text><text x="451.0" y="653.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">Por eso la PaO₂ es normal y el paciente sigue en coma.</tspan></text><text x="40.0" y="871.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="881.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="904.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Cámara hiperbárica</tspan></text><rect x="400.5" y="884.5" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Hidroxocobalamina EV</tspan></text><text x="678.8" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">N-acetilcisteína</tspan></text><text x="866.2" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Bicarbonato</tspan></text><rect x="40.0" y="918.5" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="918.5" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="939.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Sirve para</tspan></text><text x="303.8" y="939.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Monóxido de carbono</tspan></text><text x="491.2" y="939.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Cianuro: este caso</tspan></text><text x="678.8" y="939.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Paracetamol</tspan></text><text x="866.2" y="939.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Tricíclicos, acidosis</tspan></text><rect x="40.0" y="881.5" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="976.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1004.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1026.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Incendio en espacio cerrado + coma que no mejora con O₂ al 100 % = sospechar cianuro.</tspan><tspan x="58.0" dy="18">• Antídoto: hidroxocobalamina EV (se une al cianuro y forma cianocobalamina, que se elimina por la orina).</tspan><tspan x="58.0" dy="18">• Una PaO₂ normal no descarta la intoxicación: el problema está en la célula, no en la sangre.</tspan></text><text x="58.0" y="1084.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman &amp; Gilman, Bases farmacológicas 14.ª ed. (2023); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>