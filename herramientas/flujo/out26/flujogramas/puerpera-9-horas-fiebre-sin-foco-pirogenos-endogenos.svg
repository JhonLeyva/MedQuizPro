d5e1" stroke-width="1.5"/><rect x="411.0" y="523.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="546.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Mastitis</tspan></text><text x="428.0" y="567.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Semanas 2-4: mama roja y dolorosa.</tspan></text><text x="40.0" y="669.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÍAS DESPUÉS DEL PARTO</tspan></text><line x1="350.0" y1="701.0" x2="350.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="498.5" y1="701.0" x2="498.5" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="647.0" y1="701.0" x2="647.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="795.5" y1="701.0" x2="795.5" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="701.0" x2="944.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="705.0" width="920.0" height="32.0" rx="8" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="50.0" y="720.0" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Pirógenos endógenos</tspan></text><text x="50.0" y="734.0" font-size="10.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">primeras 24 h</tspan></text><rect x="350.0" y="712.0" width="21.2" height="20.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0"/><text x="377.2" y="726.0" font-size="10" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="80"><tspan x="377.2" dy="0">0-1 d</tspan></text><line x1="330.0" y1="722.0" x2="346.0" y2="722.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="5