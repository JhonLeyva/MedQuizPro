1019.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Síntomas adrenérgicos</tspan></text><text x="866.2" y="1019.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Hipotiroidismo: este caso</tspan></text><rect x="40.0" y="961.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1056.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1084.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1106.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ictericia prolongada + macroglosia + hernia umbilical + hipotonía = hipotiroidismo congénito.</tspan><tspan x="58.0" dy="18">• Tratamiento: levotiroxina oral 10-15 µg/kg/día desde ya (idealmente antes de las 2 semanas de vida).</tspan><tspan x="58.0" dy="18">• Metimazol, propiltiouracilo y propranolol son para el hipertiroidismo.</tspan></text><text x="58.0" y="1164.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP y ESPE, hipotiroidismo congénito (2020-2023); MINSA Perú, tamizaje neonatal.</tspan></text></svg>