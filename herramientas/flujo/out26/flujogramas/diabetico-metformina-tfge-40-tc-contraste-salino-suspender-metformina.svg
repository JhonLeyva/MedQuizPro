<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="984" viewBox="0 0 1000 984" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diabético con metformina y TFGe 40 que recibirá contraste: hidratar con salino y suspender metformina"><title>Diabético con metformina y TFGe 40 que recibirá contraste: hidratar con salino y suspender metformina</title><rect x="0.75" y="0.75" width="998.5" height="982.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Lesión renal · prevención con contraste yodado</tspan></text><rect x="482.3" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="546.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="546.0" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Contraste yodado y riñón</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Con TFG reducida aumenta el riesgo de lesión renal por contraste.</tspan><tspan x="58.0" dy="17">La medida que la previene es la hidratación EV con salino isotónico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 65 años con DM2 y metformina</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sospecha de tumor renal: TC con contraste.</tspan><tspan x="640.0" dy="16">PA 130/80, hidratado, TFGe 40.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">IMAGEN DEL CASO Y SEMÁFORO DE CONDUCTA</tspan></text><rect x="40.0" y="269.0" width="310.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="164.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">FUNCIÓN RENAL DEL CASO</tspan></text><g data-box="60.0 305.0 270.0 200.0"><g transform="translate(50.0,345.0) scale(1.0)"><text x="118" y="12" font-size="10" font-weight="700" fill="#64748b" text-anchor="start" data-max="0">mL/min/1,73 m²</text><text x="110" y="39" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end" data-max="0">TFGe</text><rect x="118" y="24" width="152" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="24" width="67.6" height="22" rx="4" fill="#ea580c"/><text x="191.55555555555554" y="39" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">40</text><text x="110" y="73" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Precaución</text><rect x="118" y="58" width="152" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="58" width="76.0" height="22" rx="4" fill="#94a3b8"/><text x="200.0" y="73" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">&lt; 45</text><text x="110" y="107" font-size="11" font-weight="600" fill="#334155" text-anchor="end" data-max="0">Alto riesgo</text><rect x="118" y="92" width="152" height="22" rx="4" fill="#f1f5f9"/><rect x="118" y="92" width="50.7" height="22" rx="4" fill="#94a3b8"/><text x="174.66666666666666" y="107" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">&lt; 30</text></g></g><rect x="48.0" y="636.0" width="294.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="195.0" y="657.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">TFGe de 40: zona de precaución.</tspan></text><text x="370.0" y="281.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="590"><tspan x="370.0" dy="0">DATOS DEL CASO</tspan></text><rect x="370.0" y="291.0" width="590.0" height="28.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="386.0" cy="305.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="386.0" y="309.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">!</tspan></text><text x="404.0" y="309.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Diabético con metformina</tspan></text><rect x="370.0" y="323.0" width="590.0" height="28.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="386.0" cy="337.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="386.0" y="341.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">!</tspan></text><text x="404.0" y="341.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">TFGe 40</tspan></text><rect x="370.0" y="355.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="369.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="373.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="373.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Hidratado, PA normal</tspan></text><rect x="370.0" y="387.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="401.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="405.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="405.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Necesita TC con contraste</tspan></text><rect x="370.0" y="429.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="462.0" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="462.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">TFGe ≥ 45</tspan></text><text x="430.0" y="468.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Sin medidas especiales</tspan></text><text x="430.0" y="484.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hidratación oral; mantener la metformina.</tspan></text><rect x="370.0" y="503.0" width="590.0" height="66.0" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.2"/><circle cx="400.0" cy="536.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="536.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="525.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">TFGe 30-44</tspan></text><text x="430.0" y="542.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hidratar y suspender metformina</tspan></text><text x="430.0" y="558.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Salino 0,9 % EV antes y después; reanudar a las 48 h.</tspan></text><rect x="854.6" y="492.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="507.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ ESTE CASO</tspan></text><rect x="370.0" y="577.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="610.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="610.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="599.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">TFGe &lt; 30 o lesión aguda</tspan></text><text x="430.0" y="616.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Reconsiderar el contraste</tspan></text><text x="430.0" y="632.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Estudio alternativo o dosis mínima con hidratación.</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="754.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Diuréticos y restringir</tspan><tspan x="303.8" dy="17">líquidos</tspan></text><rect x="400.5" y="726.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Suspender metformina +</tspan><tspan x="491.2" dy="17">salino EV</tspan></text><text x="678.8" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">N-acetilcisteína</tspan></text><text x="866.2" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Hemodiálisis profiláctica</tspan></text><rect x="40.0" y="777.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="777.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="798.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Previene?</tspan></text><text x="303.8" y="798.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Empeora</tspan></text><text x="491.2" y="798.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="798.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sin beneficio</tspan></text><text x="866.2" y="798.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sin beneficio</tspan></text><rect x="40.0" y="723.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="835.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="863.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="885.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• TFGe reducida: salino 0,9 % EV antes y después del contraste.</tspan><tspan x="58.0" dy="18">• Suspender la metformina el día del estudio y reanudarla a las 48 h si la creatinina está estable (riesgo de acidosis láctica).</tspan><tspan x="58.0" dy="18">• Diuréticos, N-acetilcisteína y hemodiálisis profiláctica no previenen la lesión.</tspan></text><text x="58.0" y="943.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR, manual de contraste (2024); ESUR (2018); KDIGO.</tspan></text></svg>