/><text x="74.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Representa al grupo típico</tspan></text><rect x="214.6" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="289.0" width="290.0" height="132.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Media</tspan></text><circle cx="692.0" cy="342.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Suma ÷ número de datos</tspan></text><circle cx="692.0" cy="368.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Los valores altos la jalan</tspan></text><circle cx="692.0" cy="394.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Exagera el valor típico</tspan></text><rect x="40.0" y="585.0" width="920.0" height="76.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="613.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Mediana para datos asimétricos</tspan></text><text x="500.0" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#