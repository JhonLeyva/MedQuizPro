o).</tspan><tspan x="58.0" dy="18">• Distribución simétrica: media (con desviación estándar).</tspan><tspan x="58.0" dy="18">• El rango es de dispersión; la moda es útil en variables categóricas.</tspan></text><text x="58.0" y="1228.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed..</tspan></text></svg>