stroke-width="4" opacity="0.7"/><circle cx="160" cy="150" r="24" fill="#fecaca" stroke="#b91c1c" stroke-width="2" /><circle cx="152" cy="144" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="166" cy="154" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="156" cy="160" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="169" cy="141" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="160" cy="150" r="24" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.7"/><circle cx="110" cy="150" r="24" fill="#fecaca" stroke="#b91c1c" stroke-width="2" /><circle cx="102" cy="144" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="116" cy="154" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="106" cy="160" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="119" cy="141" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="110" cy="150" r="24" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.7"/><circle cx="90" cy="115" r="24" fill="#fecaca" stroke="#b91c1c" stroke-width="2" /><circle cx="82" cy="109" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="96" cy="119" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="86" cy="125" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="99" cy="106" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="90" cy="115" r="24" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.7"/><circle cx="130" cy="112" r="24" fill="#fecaca" stroke="#b91c1c" stroke-width="2" /><circle cx="122" cy="106" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="136" cy="116" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="126" cy="122" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="139" cy="103" r="3.2" fill="#4c1d95" stroke="none" stroke-width="0" /><circle cx="130" cy="112" r="24" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.7"/></g><text x="54.0" y="539.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="892"><tspan x="54.0" dy="0">Proliferación de células y depósitos inmunes en casi todos los glomérulos: daño activo.</tspan></text><text x="40.0" y="607.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="290"><tspan x="40.0" dy="0">¿QUÉ TAN GRAVE ES?</tspan></text><rect x="40.0" y="619.0" width="290.0" height="30.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="56.0" cy="634.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="56.0" y="638.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">!</tspan></text><text x="74.0" y="638.0" font-size="11.5" font-weight="600" font-style="normal" fill="#9f1239" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Creatinina 3,1 mg/dL</tspan></text><rect x="40.0" y="655.0" width="290.0" height="30.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="56.0" cy="670.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="56.0" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">!</tspan></text><text x="74.0" y="674.0" font-size="11.5" font-weight="600" font-style="normal" fill="#9f1239" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Cilindros hemáticos y hematuria dismórfica</tspan></text><rect x="40.0" y="691.0" width="290.0" height="30.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="56.0" cy="706.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="56.0" y="710.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">!</tspan></text><text x="74.0" y="710.0" font-size="11.5" font-weight="600" font-style="normal" fill="#9f1239" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Sin mejoría al subir el corticoide</tspan></text><rect x="40.0" y="731.0" width="290.0" height="52.0" rx="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="185.0" y="749.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="266"><tspan x="185.0" dy="0">CLASE IV ACTIVA: inmunosupresor de</tspan><tspan x="185.0" dy="17">inducción</tspan></text><rect x="390.0" y="757.0" width="124.5" height="108.0" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="410.0" cy="777.0" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="410.0" y="782.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="410.0" dy="0">1</tspan></text><text x="400.0" y="809.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="400.0" dy="0">Base</tspan></text><text x="400.0" y="829.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="104"><tspan x="400.0" dy="0">Hidroxicloroquina,</tspan><tspan x="400.0" dy="15">IECA o ARA II.</tspan></text><line x1="517.5" y1="847.0" x2="528.5" y2="847.0" stroke="#94a3b8" stroke-width="2"/><polygon points="527.5,842.0 527.5,852.0 535.5,847.0" fill="#94a3b8"/><rect x="538.5" y="723.0" width="124.5" height="142.0" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="558.5" cy="743.0" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="558.5" y="748.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="558.5" dy="0">2</tspan></text><text x="548.5" y="775.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="548.5" dy="0">Pulsos de</tspan><tspan x="548.5" dy="16">corticoide</tspan></text><text x="548.5" y="811.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="104"><tspan x="548.5" dy="0">Metilprednisolona y</tspan><tspan x="548.5" dy="15">luego prednisona.</tspan></text><line x1="666.0" y1="847.0" x2="677.0" y2="847.0" stroke="#94a3b8" stroke-width="2"/><polygon points="676.0,842.0 676.0,852.0 684.0,847.0" fill="#94a3b8"/><rect x="687.0" y="689.0" width="124.5" height="176.0" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="1.8"/><circle cx="707.0" cy="709.0" r="12" fill="#ffffff" stroke="none" stroke-width="0"/><text x="707.0" y="714.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="707.0" dy="0">3</tspan></text><text x="697.0" y="741.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="104"><tspan x="697.0" dy="0">Ciclofosfamida</tspan><tspan x="697.0" dy="16">EV</tspan></text><text x="697.0" y="777.0" font-size="11" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="104"><tspan x="697.0" dy="0">Inducción;</tspan><tspan x="697.0" dy="15">alternativa:</tspan><tspan x="697.0" dy="15">micofenolato.</tspan></text><line x1="814.5" y1="847.0" x2="825.5" y2="847.0" stroke="#94a3b8" stroke-width="2"/><polygon points="824.5,842.0 824.5,852.0 832.5,847.0" fill="#94a3b8"/><rect x="703.8" y="854.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="749.2" y="869.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="749.2" dy="0">◆ ESTE CASO</tspan></text><rect x="835.5" y="655.0" width="124.5" height="210.0" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="855.5" cy="675.0" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="855.5" y="680.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="855.5" dy="0">4</tspan></text><text x="845.5" y="707.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="845.5" dy="0">Mantenimiento</tspan></text><text x="845.5" y="727.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="104"><tspan x="845.5" dy="0">Micofenolato o</tspan><tspan x="845.5" dy="15">azatioprina.</tspan></text><path d="M330.0 757.0 H368.0 V625.0 H721.0 V679.0" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round"/><polygon points="714.0,677.0 728.0,677.0 721.0,688.0" fill="#ea580c"/><text x="555.5" y="617.0" font-size="11" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="331"><tspan x="555.5" dy="0">Clase IV grave</tspan></text><text x="392.0" y="895.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="570"><tspan x="392.0" dy="0">Toda nefritis lúpica: base + corticoide; luego se escala según la clase.</tspan></text><text x="392.0" y="911.0" font-size="11" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="start" data-max="570"><tspan x="392.0" dy="0">Este caso: clase IV con creatinina alta → ciclofosfamida de inducción.</tspan></text><text x="40.0" y="955.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="965.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="987.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="968.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Ciclofosfamida</tspan></text><text x="491.2" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Rituximab</tspan></text><text x="678.8" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Azatioprina</tspan></text><text x="866.2" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Metotrexato</tspan></text><rect x="40.0" y="1002.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1002.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1023.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Comentario</tspan></text><text x="303.8" y="1023.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Inducción de elección aquí</tspan></text><text x="491.2" y="1023.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Refractarios</tspan></text><text x="678.8" y="1023.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Mantenimiento</tspan></text><text x="866.2" y="1023.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No para nefritis</tspan></text><rect x="40.0" y="965.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1060.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1088.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1110.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Clase IV activa con creatinina alta: inducción con ciclofosfamida EV (NIH o Euro-Lupus) + pulsos de corticoide.</tspan><tspan x="58.0" dy="18">• El micofenolato es alternativa de inducción; mantenimiento con micofenolato o azatioprina.</tspan><tspan x="58.0" dy="18">• Siempre hidroxicloroquina y bloqueo del sistema renina-angiotensina.</tspan></text><text x="58.0" y="1168.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO, nefritis lúpica (2024); EULAR (2023).</tspan></text></svg>