<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1216" viewBox="0 0 1000 1216" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Trauma lumbar con hematuria macroscópica en paciente estable: TC con contraste"><title>Trauma lumbar con hematuria macroscópica en paciente estable: TC con contraste</title><rect x="0.75" y="0.75" width="998.5" height="1214.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma renal · estudio por imágenes</tspan></text><rect x="416.7" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="480.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="480.4" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trauma renal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sospechar con golpe en el flanco, equimosis lumbar y hematuria.</tspan><tspan x="58.0" dy="17">En el paciente estable, la TC con contraste (con fase tardía) clasifica la lesión.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 35 años atropellado hace 2 h</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor en el flanco izquierdo, equimosis lumbar, orina</tspan><tspan x="640.0" dy="16">rojiza.</tspan><tspan x="640.0" dy="16">PA 105/70, FC 92; abdomen blando sin irritación</tspan><tspan x="640.0" dy="16">peritoneal.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ ESTUDIO PEDIR?</tspan></text><polygon points="220,337.0 260,301.0 740,301.0 780,337.0 740,373.0 260,373.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="337.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="342.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="333.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">Trauma con sospecha de lesión renal: ¿el paciente está</tspan><tspan x="525.0" dy="18">estable?</tspan></text><line x1="500.0" y1="373.0" x2="500.0" y2="393.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="393.0" x2="662.0" y2="393.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="393.0" x2="190.0" y2="422.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,421.0 195.0,421.0 190.0,429.0" fill="#0f766e"/><line x1="662.0" y1="393.0" x2="662.0" y2="422.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,421.0 667.0,421.0 662.0,429.0" fill="#ea580c"/><rect x="145.1" y="401.0" width="89.9" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="415.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">No: inestable</tspan></text><rect x="586.3" y="401.0" width="151.4" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="415.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Sí: PA 105/70, hematuria</tspan></text><rect x="40.0" y="429.0" width="300.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="430.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="453.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">FAST y quirófano</tspan></text><text x="58.0" y="474.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Si hay líquido libre o no responde a fluidos.</tspan><tspan x="58.0" dy="16">Exploración quirúrgica.</tspan></text><rect x="364.0" y="429.0" width="596.0" height="380.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="418.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="433.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="455.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">TC con contraste EV</tspan></text><text x="382.0" y="477.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Con fase tardía (excretora) para ver fuga de orina.</tspan><tspan x="382.0" dy="16">Clasifica la lesión de I a V.</tspan></text><g transform="translate(527.0,513.0) scale(0.9)"><path d="M50 40 C20 50 20 130 50 140 C70 146 84 120 76 90 C84 60 70 34 50 40 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" /><path d="M250 40 C280 50 280 130 250 140 C230 146 216 120 224 90 C216 60 230 34 250 40 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" /><path d="M76 96 C90 150 118 200 136 232" fill="none" stroke="#fde68a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M224 96 C210 150 182 200 164 232" fill="none" stroke="#fde68a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="244" rx="44" ry="30" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" /><text x="150" y="250" font-size="10" font-weight="800" fill="#a16207" text-anchor="middle" data-max="0">vejiga</text><text x="10" y="16" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="16" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text><path d="M242 60 L256 80 L244 96 L258 116" fill="none" stroke="#7f1d1d" stroke-width="4" stroke-linejoin="round" /><ellipse cx="272" cy="100" rx="22" ry="40" fill="#b91c1c" stroke="none" stroke-width="0" transform="rotate(opacity="0.55" 272 100)" /></g><text x="382.0" y="791.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Riñón izquierdo lesionado (esquema): la TC muestra la laceración y el hematoma alrededor.</tspan></text><text x="40.0" y="843.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SIGUE</tspan></text><rect x="40.0" y="853.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="854.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="877.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Grados I-III</tspan></text><text x="58.0" y="898.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Casi siempre manejo conservador.</tspan></text><rect x="237.5" y="842.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="857.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="853.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="854.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="877.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Grados IV-V</tspan></text><text x="369.3" y="898.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Según estabilidad: angioembolización o cirugía.</tspan></text><rect x="662.7" y="853.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="854.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="877.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Control</tspan></text><text x="680.7" y="898.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Hematocrito y orina seriados; reposo.</tspan></text><text x="40.0" y="962.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="972.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="994.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="975.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="994.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">TC con contraste</tspan></text><text x="491.2" y="994.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Rx simple</tspan></text><text x="678.8" y="994.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Cistografía retrógrada</tspan></text><text x="866.2" y="994.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">FAST</tspan></text><rect x="40.0" y="1009.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1009.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1030.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Para qué sirve</tspan></text><text x="303.8" y="1030.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Riñón: este caso</tspan></text><text x="491.2" y="1030.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No ve el riñón</tspan></text><text x="678.8" y="1030.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Vejiga</tspan></text><text x="866.2" y="1030.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Líquido libre en el inestable</tspan></text><rect x="40.0" y="972.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1067.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1095.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1117.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Trauma cerrado + hematuria macroscópica + estable = TC con contraste EV (fase excretora tardía).</tspan><tspan x="58.0" dy="18">• Gradúa la lesión (AAST I-V) y muestra fuga de orina o daño del pedículo.</tspan><tspan x="58.0" dy="18">• FAST no ve bien el riñón; la cistografía es para la vejiga; la Rx simple no aporta.</tspan></text><text x="58.0" y="1175.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAST; ATLS 11.ª ed. (2025); EAU, guías de urología (2024).</tspan></text></svg>