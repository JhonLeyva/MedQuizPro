50" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="110" y="154" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text></g></g><text x="54.0" y="653.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="54.0" dy="0">1 crecimiento (peso y talla), 2 desarrollo, 3</tspan><tspan x="54.0" dy="15">alimentación y salud.</tspan></text><ellipse cx="662.0" cy="433.0" rx="206.0" ry="120.0" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><polygon points="791.4,339.4 774.8,340.0 780.3,327.1" fill="#0f766e"/><polygon points="853.5,477.9 854.7,461.4 867.0,468.3" fill="#0f766e"/><polygon points="653.0,553.0 668.0,546.0 668.0,560.0" fill="#0f766e"/><polygon points="461.7,462.2 475.1,471.9 462.9,478.7" fill="#0f766e"/><polygon points="549.2,332.4 538.1,344.7 532.7,331.8" fill="#0f766e"/><text x="662.0" y="437.0" font-size="12.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="220"><tspan x="662.0" dy="0">Vigilancia integral</tspan></text><rect x="574.0" y="286.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="576.0" cy="288.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="576.0" y="292.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="576.0" dy="0">1</tspan></text><text x="662.0" y="308.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">Evaluar crecimiento</tspan></text><text x="662.0" y="324.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">peso, talla, perímetro</tspan></text><rect x="769.9" y="368.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="771.9" cy="370.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="771.9" y="374.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="771.9" dy="0">2</tspan></text><text x="857.9" y="390.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">Evaluar desarrollo</tspan></text><text x="857.9" y="406.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">motor, lenguaje, social</tspan></text><rect x="695.1" y="503.1" width="176.0" height="54.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><circle cx="697.1" cy="505.1" r="11" fill="#7c2d12" stroke="none" stroke-width="0"/><text x="697.1" y="509.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="697.1" dy="0">3</tspan></text><text x="783.1" y="525.1" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">Detectar a tiempo</tspan></text><text x="783.1" y="541.1" font-size="10.5" font-weight="500" font-style="normal" fill="#fff7ed" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">riesgos o alteraciones</tspan></text><rect x="737.7" y="546.1" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="783.1" y="561.1" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="783.1" dy="0">◆ ESTE CASO</tspan></text><rect x="452.9" y="496.1" width="176.0" height="68.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="454.9" cy="498.1" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="454.9" y="502.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="454.9" dy="0">4</tspan></text><text x="540.9" y="518.1" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">Intervenir</tspan></text><text x="540.9" y="534.1" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">consejería, suplementos,</tspan><tspan x="540.9" dy="14">vacunas</tspan></text><rect x="378.1" y="368.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="380.1" cy="370.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="380.1" y="374.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="380.1" dy="0">5</tspan></text><text x="466.1" y="390.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">Seguir</tspan></text><text x="466.1" y="406.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">próximo control o referencia</tspan></text><text x="40.0" y="723.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="733.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="734.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="757.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Solo registrar medidas</tspan></text><text x="58.0" y="778.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">No es un requisito administrativo.</tspan></text><rect x="351.3" y="733.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="734.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="757.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Solo suplementos y vacunas</tspan></text><text x="369.3" y="778.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Son parte, no el objetivo.</tspan></text><rect x="662.7" y="733.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="734.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="757.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Solo nutrición y examen</tspan></text><text x="680.7" y="778.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Olvida el desarrollo y el entorno.</tspan></text><text x="40.0" y="842.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="852.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="883.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="883.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Registrar la curva</tspan></text><text x="491.2" y="883.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Suplementos y vacunas</tspan></text><rect x="588.0" y="855.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="874.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Vigilancia integral y</tspan><tspan x="678.8" dy="17">detección</tspan></text><text x="866.2" y="874.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Solo evaluación</tspan><tspan x="866.2" dy="17">nutricional</tspan></text><rect x="40.0" y="906.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="906.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="927.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Objetivo principal?</tspan></text><text x="303.8" y="927.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: es una herramienta</tspan></text><text x="491.2" y="927.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: es una acción</tspan></text><text x="678.8" y="927.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí</tspan></text><text x="866.2" y="927.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: es incompleto</tspan></text><rect x="40.0" y="852.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="964.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="992.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1014.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Objetivo: vigilar de manera continua e integral el crecimiento y desarrollo para detectar a tiempo riesgos o alteraciones.</tspan><tspan x="58.0" dy="18">• Con lo detectado se hacen acciones de prevención y promoción (consejería, suplementos, vacunas, referencia).</tspan><tspan x="58.0" dy="18">• No es un trámite antropométrico ni solo la entrega de suplementos o vacunas.</tspan></text><text x="58.0" y="1072.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, NTS de control de crecimiento y desarrollo de la niña y el niño menor de cinco años.</tspan></text></svg>