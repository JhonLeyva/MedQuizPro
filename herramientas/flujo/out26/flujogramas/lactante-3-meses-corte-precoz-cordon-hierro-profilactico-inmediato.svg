<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1222" viewBox="0 0 1000 1222" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante de 3 meses con factores de riesgo de anemia: hierro profiláctico desde ahora"><title>Lactante de 3 meses con factores de riesgo de anemia: hierro profiláctico desde ahora</title><rect x="0.75" y="0.75" width="998.5" height="1220.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nutrición · suplementación de hierro en el lactante</tspan></text><rect x="498.0" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="554.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="554.5" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Suplementación de hierro en el lactante</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Las reservas de hierro del nacimiento se agotan hacia los 4-6 meses.</tspan><tspan x="58.0" dy="17">Con factores de riesgo las reservas son menores y el hierro preventivo se adelanta.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 3 meses en CRED</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">37 semanas, madre adolescente sin controles, corte</tspan><tspan x="640.0" dy="16">precoz del cordón.</tspan><tspan x="640.0" dy="16">Lactancia exclusiva, ganancia de peso limítrofe,</tspan><tspan x="640.0" dy="16">palidez; activa y reactiva.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LA LACTANTE Y CUÁNDO EMPEZAR EL HIERRO</tspan></text><rect x="40.0" y="301.0" width="350.0" height="350.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="149.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">LA LACTANTE DEL CASO</tspan></text><g transform="translate(116.0,341.0) scale(0.82)"><path d="M76 128 C72 110 168 110 164 128 L172 222 C160 248 80 248 68 222 Z" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M72 180 H168 L172 222 C160 248 80 248 68 222 Z" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M76 132 L40 170 L52 184 L82 156 Z" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M164 132 L200 170 L188 184 L158 156 Z" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="44" cy="182" r="10" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" /><circle cx="196" cy="182" r="10" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" /><path d="M84 236 L70 300 L94 304 L108 244 Z" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156 236 L170 300 L146 304 L132 244 Z" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="80" cy="308" rx="14" ry="7" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" /><ellipse cx="160" cy="308" rx="14" ry="7" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" /><circle cx="120" cy="70" r="54" fill="#fdf3ec" stroke="#e9b48f" stroke-width="2" /><circle cx="100" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><circle cx="140" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><path d="M110 96 Q120 102 130 96" fill="none" stroke="#9a6b52" stroke-width="2"/><path d="M116 76 Q120 86 124 76" fill="none" stroke="#9a6b52" stroke-width="2" stroke-linejoin="round" /><circle cx="120" cy="214" r="3" fill="#9a6b52" stroke="none" stroke-width="0" /><circle cx="120" cy="214" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="120" y="218" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="150" cy="92" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="96" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text></g><rect x="48.0" y="618.0" width="334.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="215.0" y="639.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="320"><tspan x="215.0" dy="0">1 cordón cortado antes de tiempo; 2 palidez.</tspan></text><rect x="410.0" y="301.0" width="550.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="411.0" y="302.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="428.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Profiláctica, de inmediato</tspan></text><text x="428.0" y="346.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Tiene factores de riesgo: no se espera a los 4 meses.</tspan></text><rect x="860.2" y="290.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="305.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="410.0" y="380.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="381.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="404.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Esperar a los 4 meses</tspan></text><text x="428.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Solo para el lactante a término sin riesgo.</tspan></text><rect x="410.0" y="459.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="460.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="483.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Dosis terapéutica</tspan></text><text x="428.0" y="504.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Solo con anemia confirmada por hemoglobina.</tspan></text><text x="40.0" y="685.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EDAD DEL LACTANTE (MESES)</tspan></text><line x1="350.0" y1="717.0" x2="350.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="449.0" y1="717.0" x2="449.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="548.0" y1="717.0" x2="548.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="647.0" y1="717.0" x2="647.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="746.0" y1="717.0" x2="746.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="845.0" y1="717.0" x2="845.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="717.0" x2="944.0" y2="871.0" stroke="#e2e8f0" stroke-width="1"/><text x="50.0" y="736.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Prematuro o bajo peso</tspan></text><text x="50.0" y="750.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">desde los 30 días</tspan></text><rect x="399.5" y="728.0" width="247.5" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="523.2" y="742.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="240"><tspan x="523.2" dy="0">1-6 m</tspan></text><line x1="330.0" y1="738.0" x2="395.5" y2="738.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><rect x="40.0" y="757.0" width="920.0" height="32.0" rx="8" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="50.0" y="772.0" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Con factores de riesgo</tspan></text><text x="50.0" y="786.0" font-size="10.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">profiláctica desde ya</tspan></text><rect x="498.5" y="764.0" width="148.5" height="20.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0"/><text x="572.8" y="778.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="140"><tspan x="572.8" dy="0">3-6 m</tspan></text><line x1="330.0" y1="774.0" x2="494.5" y2="774.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="808.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">A término sin riesgo</tspan></text><text x="50.0" y="822.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">desde los 4 meses</tspan></text><rect x="548.0" y="800.0" width="99.0" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="597.5" y="814.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="91"><tspan x="597.5" dy="0">4-6 m</tspan></text><line x1="330.0" y1="810.0" x2="544.0" y2="810.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="844.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Desde los 6 meses</tspan></text><text x="50.0" y="858.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">hierro y alimentos ricos en hierro</tspan></text><rect x="647.0" y="836.0" width="297.0" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="795.5" y="850.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="289"><tspan x="795.5" dy="0">6-12 m</tspan></text><line x1="330.0" y1="846.0" x2="643.0" y2="846.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><line x1="350.0" y1="871.0" x2="944.0" y2="871.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="350.0" y1="867.0" x2="350.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="350.0" dy="0">0</tspan></text><line x1="449.0" y1="867.0" x2="449.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="449.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="449.0" dy="0">2</tspan></text><line x1="548.0" y1="867.0" x2="548.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="548.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="548.0" dy="0">4</tspan></text><line x1="647.0" y1="867.0" x2="647.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="647.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="647.0" dy="0">6</tspan></text><line x1="746.0" y1="867.0" x2="746.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="746.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="746.0" dy="0">8</tspan></text><line x1="845.0" y1="867.0" x2="845.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="845.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="845.0" dy="0">10</tspan></text><line x1="944.0" y1="867.0" x2="944.0" y2="875.0" stroke="#94a3b8" stroke-width="1.5"/><text x="944.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="944.0" dy="0">12</tspan></text><text x="944.0" y="905.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="300"><tspan x="944.0" dy="0">meses de vida</tspan></text><line x1="498.5" y1="715.0" x2="498.5" y2="871.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><rect x="453.1" y="698.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="498.5" y="713.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="498.5" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="951.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="961.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="992.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Inmediata, terapéutica</tspan></text><rect x="400.5" y="964.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Inmediata, profiláctica</tspan></text><text x="678.8" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">A los 4 meses,</tspan><tspan x="678.8" dy="17">terapéutica</tspan></text><text x="866.2" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">A los 4 meses, profiláctica</tspan></text><rect x="40.0" y="1015.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1015.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1036.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Correcta?</tspan></text><text x="303.8" y="1036.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: sin anemia confirmada</tspan></text><text x="491.2" y="1036.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="1036.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="1036.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Tarde: tiene riesgo</tspan></text><rect x="40.0" y="961.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1073.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1101.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1123.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Corte precoz del cordón + gestación sin controles + madre adolescente: menos reservas de hierro.</tspan><tspan x="58.0" dy="18">• Conducta: hierro por vía oral a dosis profiláctica de inmediato, sin esperar a los 4 meses.</tspan><tspan x="58.0" dy="18">• La dosis terapéutica se reserva para la anemia confirmada con hemoglobina.</tspan></text><text x="58.0" y="1181.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, norma técnica de prevención y control de la anemia; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>