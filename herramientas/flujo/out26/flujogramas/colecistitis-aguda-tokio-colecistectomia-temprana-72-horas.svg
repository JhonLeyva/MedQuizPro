" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Colecistectomía diferida</tspan></text><text x="428.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">A las 6 semanas: riesgo de nuevo cuadro mientras espera.</tspan></text><rect x="410.0" y="459.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="460.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="483.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Colecistostomía percutánea</tspan></text><text x="428.0" y="504.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Solo si el riesgo quirúrgico es muy alto.</tspan></text><text x="40.0" y="669.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÍAS DESDE EL INICIO DEL DOLOR</tspan></text><line x1="350.0" y1="701.0" x2="350.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="424.2" y1="701.0" x2="424.2" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="498.5" y1="701.0" x2="498.5" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="572.8" y1="701.0" x2="572.8" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="647.0" y1="701.0" x2="647.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="721.2" y1="701.0" x2="721.2" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="795.5" y1="701.0" x2="795.5" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="869.8" y1="701.0" x2="869.8" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="701.0" x2="944.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="705.0" width="920.0" height="32.0" rx="8" fill="#f0fdfa