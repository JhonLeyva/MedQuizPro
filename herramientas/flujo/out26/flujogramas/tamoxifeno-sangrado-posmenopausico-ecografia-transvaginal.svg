chor="middle" data-max="272"><tspan x="190.0" dy="0">Para estadificar un cáncer ya diagnosticado</tspan></text><rect x="660.0" y="299.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="300.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="332.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Laparoscopía</tspan></text><text x="810.0" y="356.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Invasiva; no evalúa la cavidad uterina</tspan></text><rect x="660.0" y="399.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="400.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="432.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Histerectomía profiláctica</tspan></text><text x="810.0" y="456.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Excesiva sin diagnóstico</tspan></text><text x="40.0" y="533.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="545.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Tamoxifeno 4 años</tspan></text><line x1="248.5" y1="565.5" x2="267.5" y2="565.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,560.5 266.5,570.5 274.5,565.5" fill="#0f766e"/><rect x="278.5" y="545.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Sangrado posmenopáusico</tspan></text><line x1="487.0" y1="565.5" x2="506.0" y2="565.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,560.5 505.0,570.5 513.0,565.5" fill="#0f766e"/><rect x="517.0" y="545.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Eco TV: grosor</tspan></text><line x1="725.5" y1="565.5" x2="744.5" y2="565.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,560.5 743.5,570.5 751.5,565.5" fill="#0f766e"/><rect x="755.5" y="545.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="569.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Biopsia si &gt; 4 mm</tspan></text><text x="40.0" y="626.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="638.0" width="328.0" height="302.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="648.0" width="190.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="662.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="286"><tspan x="61.0" dy="0">ENDOMETRIO CON TAMOXIFENO</tspan></text><g transform="translate(54.0,676.0) scale(1.0)"><path d="M90 40 C90 10 210 10 210 40 L204 140 C198 170 102 170 96 140 Z" fill="#f9a8d4" stroke="#be185d" stroke-width="2.5" stroke-linejoin="round" /><path d="M134 44 L166 44 L158.0 140 L142.0 140 Z" fill="#fda4af" stroke="#be185d" stroke-width="1.5" stroke-linejoin="round" /><line x1="134" y1="76" x2="166" y2="76" stroke="#0f766e" stroke-width="2"/><text x="230" y="80" font-size="11.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">&gt; 4-5 mm</text><text x="230" y="80" font-size="11.5" font-weight="800" fill="#134e4a" text-anchor="start" data-max="0">&gt; 4-5 mm</text><line x1="228" y1="76" x2="166" y2="76" stroke="#0f766e" stroke-width="1.3"/><circle cx="166" cy="76" r="2.6" fill="#0f766e"/><ellipse cx="150" cy="104" rx="7" ry="10" fill="#e11d48" stroke="#9f1239" stroke-width="1.2" /><text x="230" y="110" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">pólipo o hiperplasia</text><text x="230" y="110" font-size="10.5" font-weight="800" fill="#9f1239" text-anchor="start" data-max="0">pólipo o hiperplasia</text><path d="M138 160 L138 200 L162 200 L162 160" fill="#f9a8d4" stroke="#be185d" stroke-width="2" stroke-linejoin="round" /><text x="150" y="226" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">endometrio</text><text x="150" y="226" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="middle" data-max="0">endometrio</text></g><rect x="390.0" y="638.0" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="656.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="660.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">1</tspan></text><text x="428.0" y="660.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">El tamoxifeno actúa como estrógeno en el endometrio.</tspan></text><rect x="390.0" y="669.0" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="687.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">2</tspan></text><text x="428.0" y="691.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Puede causar pólipos, hiperplasia y cáncer.</tspan></text><rect x="390.0" y="700.0" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="718.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="722.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">3</tspan></text><text x="428.0" y="722.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">La eco mide el grosor y guía la biopsia.</tspan></text><text x="40.0" y="980.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="990.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1012.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="993.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="1012.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Eco transvaginal</tspan></text><text x="491.2" y="1012.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Resonancia</tspan></text><text x="678.8" y="1012.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Laparoscopía</tspan></text><text x="866.2" y="1012.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Histerectomía</tspan></text><rect x="40.0" y="1027.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1027.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1048.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primer paso?</tspan></text><text x="303.8" y="1048.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="1048.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="1048.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="1048.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="990.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1085.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1113.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1135.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primer paso: ecografía transvaginal para medir el endometrio.</tspan><tspan x="58.0" dy="18">• Endometrio ≤ 4 mm: bajo riesgo; &gt; 4 mm o irregular: biopsia (o histeroscopía).</tspan><tspan x="58.0" dy="18">• Con tamoxifeno el endometrio puede verse grueso por cambios subendometriales: ante sangrado, se biopsia.</tspan></text><text x="58.0" y="1193.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG n.º 734 (2018) y n.º 601 (tamoxifeno); NCCN.</tspan></text></svg>