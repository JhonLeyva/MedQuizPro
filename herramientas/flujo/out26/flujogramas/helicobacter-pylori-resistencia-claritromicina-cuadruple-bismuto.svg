<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1156" viewBox="0 0 1000 1156" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="H. pylori con resistencia alta a claritromicina: cuádruple con bismuto"><title>H. pylori con resistencia alta a claritromicina: cuádruple con bismuto</title><rect x="0.75" y="0.75" width="998.5" height="1154.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Helicobacter pylori · erradicación</tspan></text><rect x="396.9" y="32.0" width="180.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="164"><tspan x="487.0" dy="0">GASTROENTEROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Erradicación de Helicobacter pylori</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El esquema depende de la resistencia a claritromicina en la zona.</tspan><tspan x="58.0" dy="17">Si es &gt; 15 %, la triple terapia clásica falla con frecuencia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 35 años con dispepsia</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">H. pylori confirmado.</tspan><tspan x="640.0" dy="16">Vive en zona con resistencia a claritromicina &gt; 15 %.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RESISTENCIA DE LA ZONA Y ESQUEMA</tspan></text><text x="202.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ MOMENTO</tspan></text><rect x="202.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Primera línea</tspan></text><rect x="587.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="773.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Si falla</tspan></text><text x="40.0" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ RESISTENCIA A</tspan><tspan x="40.0" dy="15">CLARITROMICINA</tspan></text><rect x="40.0" y="338.0" width="150.0" height="90.5" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="387.7" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">&lt; 15 %</tspan></text><rect x="202.0" y="338.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="339.0" width="6.0" height="88.5" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="388.5" y="366.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Triple con claritromicina 14 d</tspan></text><text x="388.5" y="389.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">IBP + claritromicina + amoxicilina</tspan><tspan x="388.5" dy="17">o cuádruple con bismuto</tspan></text><rect x="587.0" y="338.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="339.0" width="6.0" height="88.5" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="374.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Cuádruple con bismuto</tspan></text><text x="773.5" y="397.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">o levofloxacino</tspan></text><rect x="40.0" y="440.5" width="150.0" height="90.5" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="490.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">&gt; 15 % (Perú)</tspan></text><rect x="202.0" y="440.5" width="373.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="468.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Cuádruple con bismuto 14 d</tspan></text><text x="388.5" y="491.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">IBP + bismuto + tetraciclina</tspan><tspan x="388.5" dy="17">+ metronidazol</tspan></text><rect x="343.1" y="519.9" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="388.5" y="534.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="388.5" dy="0">◆ ESTE CASO</tspan></text><rect x="587.0" y="440.5" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="441.5" width="6.0" height="88.5" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="773.5" y="477.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Triple con levofloxacino</tspan></text><text x="773.5" y="500.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">o rifabutina</tspan></text><text x="40.0" y="580.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="592.9" width="358.0" height="252.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="602.9" width="189.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="616.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="316"><tspan x="61.0" dy="0">LA BACTERIA EN EL ESTÓMAGO</tspan></text><g data-box="54.0 630.9 330.0 190.0"><g transform="translate(54.0,630.9) scale(1.0)"><rect x="0" y="110" width="330" height="80" fill="#fbcfe8"/><path d="M20 110 L24 176 L40 176 L44 110" fill="#ffffff" stroke="#be185d" stroke-width="1.2" stroke-linejoin="round" /><path d="M72 110 L76 176 L92 176 L96 110" fill="#ffffff" stroke="#be185d" stroke-width="1.2" stroke-linejoin="round" /><path d="M124 110 L128 176 L144 176 L148 110" fill="#ffffff" stroke="#be185d" stroke-width="1.2" stroke-linejoin="round" /><path d="M176 110 L180 176 L196 176 L200 110" fill="#ffffff" stroke="#be185d" stroke-width="1.2" stroke-linejoin="round" /><path d="M228 110 L232 176 L248 176 L252 110" fill="#ffffff" stroke="#be185d" stroke-width="1.2" stroke-linejoin="round" /><path d="M280 110 L284 176 L300 176 L304 110" fill="#ffffff" stroke="#be185d" stroke-width="1.2" stroke-linejoin="round" /><rect x="0" y="70" width="330" height="40" fill="#bae6fd" opacity="0.8"/><text x="6" y="64" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Moco</text><text x="6" y="64" font-size="10.5" font-weight="800" fill="#0369a1" text-anchor="start" data-max="0">Moco</text><text x="6" y="104" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Epitelio</text><text x="6" y="104" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="start" data-max="0">Epitelio</text><text x="165" y="26" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Luz gástrica: ácido (HCl)</text><text x="165" y="26" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle" data-max="0">Luz gástrica: ácido (HCl)</text><path d="M62 88 q6 -8 12 0 q6 8 12 0 q6 -8 12 0" fill="none" stroke="#16a34a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M98 88 l14 -6 M98 88 l14 2" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-linejoin="round" /><path d="M142 92 q6 -8 12 0 q6 8 12 0 q6 -8 12 0" fill="none" stroke="#16a34a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M178 92 l14 -6 M178 92 l14 2" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-linejoin="round" /><path d="M222 86 q6 -8 12 0 q6 8 12 0 q6 -8 12 0" fill="none" stroke="#16a34a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M258 86 l14 -6 M258 86 l14 2" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-linejoin="round" /><circle cx="118" cy="60" r="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2" opacity="0.9"/><text x="118" y="64" font-size="10.5" font-weight="800" fill="#4338ca" text-anchor="middle" data-max="0">NH₃</text><text x="260" y="60" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Ureasa → NH₃</text><text x="260" y="60" font-size="10.5" font-weight="800" fill="#4338ca" text-anchor="middle" data-max="0">Ureasa → NH₃</text><text x="260" y="74" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">neutraliza el ácido</text><text x="260" y="74" font-size="10" font-weight="800" fill="#4338ca" text-anchor="middle" data-max="0">neutraliza el ácido</text></g></g><rect x="420.0" y="592.9" width="540.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="608.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="612.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">1</tspan></text><text x="456.0" y="612.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="456.0" dy="0">H. pylori vive bajo el moco, pegada al epitelio.</tspan></text><rect x="420.0" y="630.9" width="540.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="646.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="650.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">2</tspan></text><text x="456.0" y="650.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="456.0" dy="0">Su ureasa produce amoníaco que neutraliza el ácido a su alrededor.</tspan></text><rect x="420.0" y="668.9" width="540.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="684.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="688.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">3</tspan></text><text x="456.0" y="688.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="456.0" dy="0">Por eso el IBP ayuda: menos ácido, mejor efecto de los antibióticos.</tspan></text><text x="40.0" y="884.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="894.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="925.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="917.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">IBP + sucralfato +</tspan><tspan x="303.8" dy="17">doxiciclina</tspan></text><rect x="400.5" y="897.9" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="925.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Cuádruple con bismuto</tspan></text><text x="678.8" y="925.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">IBP + levofloxacino</tspan></text><text x="866.2" y="925.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Cuádruple sin bismuto</tspan></text><rect x="40.0" y="948.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="948.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="969.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="969.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No es un esquema válido</tspan></text><text x="491.2" y="969.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ninguno</tspan></text><text x="678.8" y="969.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Es de rescate, no de inicio</tspan></text><text x="866.2" y="969.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Lleva claritromicina: falla aquí</tspan></text><rect x="40.0" y="894.9" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1006.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1034.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1056.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Resistencia &gt; 15 % (como en el Perú): cuádruple con bismuto 14 días = IBP + bismuto + tetraciclina + metronidazol.</tspan><tspan x="58.0" dy="18">• Confirmar la erradicación con test de aliento o antígeno en heces ≥ 4 semanas después.</tspan><tspan x="58.0" dy="18">• Si falla: esquema con levofloxacino (o rifabutina).</tspan></text><text x="58.0" y="1114.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Maastricht VI / Florencia (2022); ACG (2024).</tspan></text></svg>