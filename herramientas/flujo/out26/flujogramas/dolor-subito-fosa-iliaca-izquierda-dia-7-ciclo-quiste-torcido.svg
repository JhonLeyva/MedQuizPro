<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1189" viewBox="0 0 1000 1189" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dolor súbito con masa anexial al día 7 del ciclo: quiste a pedículo torcido"><title>Dolor súbito con masa anexial al día 7 del ciclo: quiste a pedículo torcido</title><rect x="0.75" y="0.75" width="998.5" height="1187.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Dolor pélvico agudo · torsión anexial</tspan></text><rect x="418.0" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="505.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="505.2" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dolor pélvico y día del ciclo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El cuerpo lúteo hemorrágico aparece en la fase lútea (después de ovular).</tspan><tspan x="58.0" dy="17">La torsión puede ocurrir en cualquier momento, con dolor brusco y masa dolorosa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 25 años, FUR hace 7 días</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor súbito e intenso en FII de 4 h que empeora al</tspan><tspan x="640.0" dy="16">moverse.</tspan><tspan x="640.0" dy="16">Masa anexial izquierda muy dolorosa; sin sangrado.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EN QUÉ MOMENTO DEL CICLO ESTÁ</tspan></text><rect x="40.0" y="285.0" width="350.0" height="350.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="170.6" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">ANEXO IZQUIERDO TORCIDO</tspan></text><g data-box="50.0 321.0 330.0 240.0"><g transform="translate(50.0,341.0) scale(1.0)"><path d="M130 60 C130 30 200 30 200 60 L196 130 C190 150 140 150 134 130 Z" fill="#fbcfe8" stroke="#be185d" stroke-width="2" stroke-linejoin="round" /><path d="M152 146 L152 176 L178 176 L178 146" fill="#fbcfe8" stroke="#be185d" stroke-width="2" stroke-linejoin="round" /><text x="165" y="100" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">útero</text><text x="165" y="100" font-size="10.5" font-weight="800" fill="#be185d" text-anchor="middle" data-max="0">útero</text><path d="M130 60 C100 40 85 40 55 60" fill="none" stroke="#f472b6" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="55" cy="86" rx="20" ry="14" fill="#fde68a" stroke="#ca8a04" stroke-width="1.6" /><text x="55" y="118" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">ovario normal</text><path d="M200 60 C230 40 245 40 275 60" fill="none" stroke="#f472b6" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><line x1="223.5" y1="44" x2="229.5" y2="60" stroke="#ea580c" stroke-width="3"/><line x1="230.5" y1="44" x2="236.5" y2="60" stroke="#ea580c" stroke-width="3"/><line x1="237.5" y1="44" x2="243.5" y2="60" stroke="#ea580c" stroke-width="3"/><line x1="244.5" y1="44" x2="250.5" y2="60" stroke="#ea580c" stroke-width="3"/><line x1="251.5" y1="44" x2="257.5" y2="60" stroke="#ea580c" stroke-width="3"/><circle cx="275" cy="100" r="46" fill="#7e22ce" stroke="#3b0764" stroke-width="2.5" /><circle cx="283" cy="94" r="26" fill="#a855f7" stroke="none" stroke-width="0" opacity="0.6"/><text x="275" y="164" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">8 cm, torcido</text><text x="275" y="164" font-size="10.5" font-weight="800" fill="#581c87" text-anchor="middle" data-max="0">8 cm, torcido</text><text x="237.5" y="34" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">pedículo girado</text><text x="237.5" y="34" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">pedículo girado</text><text x="10" y="14" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="320" y="14" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g></g><rect x="48.0" y="587.0" width="334.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="215.0" y="608.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="320"><tspan x="215.0" dy="0">El ovario izquierdo girado sobre su pedículo: isquemia y</tspan><tspan x="215.0" dy="15">dolor.</tspan></text><rect x="410.0" y="285.0" width="550.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="411.0" y="286.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="428.0" y="309.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Quiste a pedículo torcido</tspan></text><text x="428.0" y="330.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Dolor súbito + masa dolorosa: cualquier fase.</tspan></text><rect x="860.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="410.0" y="364.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="365.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="388.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Cuerpo lúteo hemorrágico</tspan></text><text x="428.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Fase lútea (después del día 14).</tspan></text><rect x="410.0" y="443.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="444.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Ectópico o aborto</tspan></text><text x="428.0" y="488.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Requieren embarazo: FUR hace 7 días, poco probable.</tspan></text><text x="40.0" y="669.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÍAS DEL CICLO MENSTRUAL</tspan></text><line x1="350.0" y1="701.0" x2="350.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="498.5" y1="701.0" x2="498.5" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="647.0" y1="701.0" x2="647.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="795.5" y1="701.0" x2="795.5" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="701.0" x2="944.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><text x="50.0" y="720.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Menstruación</tspan></text><text x="50.0" y="734.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">FUR</tspan></text><rect x="371.2" y="712.0" width="84.9" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="413.6" y="726.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="77"><tspan x="413.6" dy="0">1-5 d</tspan></text><line x1="330.0" y1="722.0" x2="367.2" y2="722.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><rect x="40.0" y="741.0" width="920.0" height="32.0" rx="8" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="50.0" y="756.0" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Fase folicular</tspan></text><text x="50.0" y="770.0" font-size="10.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">este caso: día 7</tspan></text><rect x="371.2" y="748.0" width="275.8" height="20.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0"/><text x="509.1" y="762.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="268"><tspan x="509.1" dy="0">1-14 d</tspan></text><line x1="330.0" y1="758.0" x2="367.2" y2="758.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="792.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Ovulación</tspan></text><text x="50.0" y="806.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0"></tspan></text><rect x="625.8" y="784.0" width="42.4" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="674.2" y="798.0" font-size="10" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="80"><tspan x="674.2" dy="0">13-15 d</tspan></text><line x1="330.0" y1="794.0" x2="621.8" y2="794.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="828.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Fase lútea</tspan></text><text x="50.0" y="842.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">cuerpo lúteo hemorrágico</tspan></text><rect x="668.2" y="820.0" width="275.8" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="806.1" y="834.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="268"><tspan x="806.1" dy="0">15-28 d</tspan></text><line x1="330.0" y1="830.0" x2="664.2" y2="830.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><line x1="350.0" y1="855.0" x2="944.0" y2="855.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="350.0" y1="851.0" x2="350.0" y2="859.0" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="873.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="350.0" dy="0">0</tspan></text><line x1="498.5" y1="851.0" x2="498.5" y2="859.0" stroke="#94a3b8" stroke-width="1.5"/><text x="498.5" y="873.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="498.5" dy="0">7</tspan></text><line x1="647.0" y1="851.0" x2="647.0" y2="859.0" stroke="#94a3b8" stroke-width="1.5"/><text x="647.0" y="873.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="647.0" dy="0">14</tspan></text><line x1="795.5" y1="851.0" x2="795.5" y2="859.0" stroke="#94a3b8" stroke-width="1.5"/><text x="795.5" y="873.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="795.5" dy="0">21</tspan></text><line x1="944.0" y1="851.0" x2="944.0" y2="859.0" stroke="#94a3b8" stroke-width="1.5"/><text x="944.0" y="873.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="944.0" dy="0">28</tspan></text><text x="944.0" y="889.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="300"><tspan x="944.0" dy="0">días del ciclo</tspan></text><line x1="498.5" y1="699.0" x2="498.5" y2="855.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><rect x="453.1" y="682.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="498.5" y="697.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="498.5" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="935.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="945.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="967.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Ectópico tubárico</tspan></text><rect x="400.5" y="948.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Quiste torcido</tspan></text><text x="678.8" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Cuerpo lúteo hemorrágico</tspan></text><text x="866.2" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Aborto incompleto</tspan></text><rect x="40.0" y="982.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="982.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1003.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja con el día 7?</tspan></text><text x="303.8" y="1003.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: menstruó hace 7 días</tspan></text><text x="491.2" y="1003.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="1003.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: aparece en fase lútea</tspan></text><text x="866.2" y="1003.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: sin embarazo ni sangrado</tspan></text><rect x="40.0" y="945.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1040.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1068.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1090.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dolor brusco que empeora con el movimiento + masa anexial dolorosa = quiste a pedículo torcido.</tspan><tspan x="58.0" dy="18">• Día 7 del ciclo (fase folicular): aún no hay cuerpo lúteo y el embarazo es improbable.</tspan><tspan x="58.0" dy="18">• Urgencia quirúrgica: laparoscopía para destorcer y conservar el ovario.</tspan></text><text x="58.0" y="1148.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletins n.º 783; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>