<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1222" viewBox="0 0 1000 1222" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diarrea con moco y sangre, fiebre y más de 100 leucocitos por campo: Shigella"><title>Diarrea con moco y sangre, fiebre y más de 100 leucocitos por campo: Shigella</title><rect x="0.75" y="0.75" width="998.5" height="1220.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedad diarreica · diarrea inflamatoria</tspan></text><rect x="453.0" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="521.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="521.3" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diarrea inflamatoria (disentería)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Gérmenes que invaden el colon: moco, sangre, fiebre y leucocitos en heces.</tspan><tspan x="58.0" dy="17">En el adulto con fiebre alta y disentería aguda, Shigella es la más probable.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 30 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">2 días de cólicos en fosa ilíaca izquierda y 6</tspan><tspan x="640.0" dy="16">deposiciones con moco y sangre; T 38,5 °C.</tspan><tspan x="640.0" dy="16">Heces: leucocitos &gt; 100/campo y hematíes; sin</tspan><tspan x="640.0" dy="16">parásitos.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA DISENTERÍA AL GERMEN</tspan></text><text x="614.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,325.0 580.0,325.0 531.7,401.0 88.3,401.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="341.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="373.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Diarrea con moco, sangre y fiebre de 38,5 °C</tspan></text><line x1="559.8" y1="363.0" x2="606.0" y2="363.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="334.0" width="143.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="685.8" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="685.8" dy="0">E. coli enterotoxigénica</tspan></text><rect x="763.7" y="334.0" width="72.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="799.9" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="799.9" dy="0">Norovirus</tspan></text><rect x="842.0" y="334.0" width="76.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="880.2" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="880.2" dy="0">Amebiasis</tspan></text><rect x="614.0" y="366.0" width="63.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="645.9" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="645.9" dy="0">Shigella</tspan></text><polygon points="88.3,405.0 531.7,405.0 483.3,461.0 136.7,461.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="433.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="437.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="437.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Diarrea acuosa, sin sangre ni leucocitos?</tspan></text><line x1="511.5" y1="433.0" x2="606.0" y2="433.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="420.0" width="155.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="691.9" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="691.9" dy="0">✕ E. coli enterotoxigénica</tspan></text><line x1="636.0" y1="433.5" x2="759.8" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="775.8" y="420.0" width="84.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="818.0" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="818.0" dy="0">✕ Norovirus</tspan></text><line x1="797.8" y1="433.5" x2="850.2" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,465.0 483.3,465.0 435.0,525.0 185.0,525.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="495.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="499.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="491.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Trofozoítos en heces, curso</tspan><tspan x="320.0" dy="17">de semanas, poca fiebre?</tspan></text><line x1="463.2" y1="495.0" x2="606.0" y2="495.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="482.0" width="87.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="657.9" y="499.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="657.9" dy="0">✕ Amebiasis</tspan></text><line x1="636.0" y1="495.5" x2="691.7" y2="495.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="529.0" x2="310.0" y2="548.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,547.0 315.0,547.0 310.0,555.0" fill="#0f766e"/><rect x="140.0" y="559.0" width="340.0" height="74.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="588.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Shigella</tspan></text><text x="310.0" y="612.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Fiebre alta + disentería + leucocitos &gt; 100</tspan></text><rect x="370.6" y="548.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="563.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="558.4" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="578.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="596.4" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Muchos leucocitos y fiebre alta: bacteria que invade el</tspan><tspan x="628.0" dy="16">colon.</tspan></text><text x="40.0" y="673.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="685.9" width="308.0" height="242.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="695.9" width="167.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="709.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="266"><tspan x="61.0" dy="0">GERMEN (GRAM, ESQUEMA)</tspan></text><g data-box="54.0 723.9 280.0 180.0"><g transform="translate(74.0,723.9) scale(1.1)"><circle cx="110" cy="80" r="76" fill="#fff1f2" stroke="#94a3b8" stroke-width="3" /><rect x="84" y="48" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(71 84 48)"/><rect x="75" y="45" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(72 75 45)"/><rect x="152" y="104" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(138 152 104)"/><rect x="82" y="83" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(50 82 83)"/><rect x="77" y="48" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(39 77 48)"/><rect x="153" y="106" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(145 153 106)"/><rect x="140" y="55" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(56 140 55)"/><rect x="123" y="99" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(154 123 99)"/></g></g><rect x="370.0" y="685.9" width="590.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="388.0" cy="701.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="705.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">1</tspan></text><text x="406.0" y="705.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="406.0" dy="0">Bacilos gramnegativos.</tspan></text><rect x="370.0" y="723.9" width="590.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="388.0" cy="739.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="743.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">2</tspan></text><text x="406.0" y="743.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="406.0" dy="0">Shigella invade la mucosa del colon.</tspan></text><rect x="370.0" y="761.9" width="590.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="388.0" cy="777.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="781.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">3</tspan></text><text x="406.0" y="781.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="406.0" dy="0">Basta un inóculo muy pequeño para contagiar.</tspan></text><text x="40.0" y="967.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="977.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1000.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1000.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">E. coli enterotoxigénica</tspan></text><rect x="400.5" y="980.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="1000.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Shigella</tspan></text><text x="678.8" y="1000.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Amebiasis</tspan></text><text x="866.2" y="1000.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Norovirus</tspan></text><rect x="40.0" y="1014.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1014.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1035.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="303.8" y="1035.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: acuosa</tspan></text><text x="491.2" y="1035.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="1035.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: sin trofozoítos</tspan></text><text x="866.2" y="1035.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: acuosa</tspan></text><rect x="40.0" y="977.9" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1072.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1100.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1122.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Disentería aguda + fiebre alta + muchos leucocitos en heces = diarrea inflamatoria por Shigella.</tspan><tspan x="58.0" dy="18">• Coprocultivo y antibiótico (azitromicina o ciprofloxacino según sensibilidad), hidratación.</tspan><tspan x="58.0" dy="18">• La amebiasis es más lenta, con menos fiebre y trofozoítos; ETEC y norovirus dan diarrea acuosa.</tspan></text><text x="58.0" y="1180.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, guía de enfermedad diarreica; IDSA (2017).</tspan></text></svg>