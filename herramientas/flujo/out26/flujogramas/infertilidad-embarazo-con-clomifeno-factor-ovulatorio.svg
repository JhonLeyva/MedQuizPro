<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1048" viewBox="0 0 1000 1048" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Embarazo logrado con clomifeno: la causa era ovulatoria"><title>Embarazo logrado con clomifeno: la causa era ovulatoria</title><rect x="0.75" y="0.75" width="998.5" height="1046.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infertilidad · factor ovulatorio</tspan></text><rect x="372.9" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="460.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="460.1" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Factores de infertilidad</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ovulatorio, tubárico, uterino, cervical y masculino.</tspan><tspan x="58.0" dy="17">El clomifeno solo corrige la falta de ovulación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 34 años con infertilidad de 2 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recibe citrato de clomifeno por vía oral.</tspan><tspan x="640.0" dy="16">Tras varios ciclos logra gestar.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CORRIGE EL CLOMIFENO</tspan></text><rect x="40.0" y="269.0" width="328.0" height="358.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="214.6" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">EJE HIPOTÁLAMO-HIPÓFISIS-OVARIO</tspan></text><g data-box="54.0 307.0 300.0 296.0"><g transform="translate(54.0,307.0) scale(1.0)"><ellipse cx="150" cy="34" rx="70" ry="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" /><text x="150" y="39" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Hipotálamo</text><text x="150" y="39" font-size="11" font-weight="800" fill="#3730a3" text-anchor="middle" data-max="0">Hipotálamo</text><line x1="150.0" y1="58.0" x2="150.0" y2="86.0" stroke="#6366f1" stroke-width="2.4"/><polygon points="150.0,94.0 145.7,85.0 154.3,85.0" fill="#6366f1"/><text x="160" y="80" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">GnRH</text><text x="160" y="80" font-size="10.5" font-weight="800" fill="#3730a3" text-anchor="start" data-max="0">GnRH</text><ellipse cx="150" cy="116" rx="52" ry="20" fill="#fae8ff" stroke="#a21caf" stroke-width="2" /><text x="150" y="121" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Hipófisis</text><text x="150" y="121" font-size="11" font-weight="800" fill="#86198f" text-anchor="middle" data-max="0">Hipófisis</text><line x1="150.0" y1="138.0" x2="150.0" y2="168.0" stroke="#a21caf" stroke-width="2.4"/><polygon points="150.0,176.0 145.7,167.0 154.3,167.0" fill="#a21caf"/><text x="160" y="162" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">FSH y LH</text><text x="160" y="162" font-size="10.5" font-weight="800" fill="#86198f" text-anchor="start" data-max="0">FSH y LH</text><ellipse cx="150" cy="206" rx="62" ry="30" fill="#fef3c7" stroke="#ca8a04" stroke-width="2" /><circle cx="170" cy="202" r="16" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" /><text x="128" y="210" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Ovario</text><text x="128" y="210" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle" data-max="0">Ovario</text><text x="208" y="246" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">folículo → ovulación</text><text x="208" y="246" font-size="10.5" font-weight="800" fill="#92400e" text-anchor="middle" data-max="0">folículo → ovulación</text><path d="M86 206 C30 180 30 60 80 36" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="6" y="128" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">estrógenos (–)</text><text x="6" y="128" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="start" data-max="0">estrógenos (–)</text><circle cx="80" cy="36" r="13" fill="#ffffff" stroke="#ea580c" stroke-width="3" /><path d="M72 28 L88 44 M88 28 L72 44" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round" /><text x="20" y="276" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Clomifeno bloquea el receptor: el hipotálamo</text><text x="20" y="276" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="start" data-max="0">Clomifeno bloquea el receptor: el hipotálamo</text><text x="20" y="290" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">«no ve» estrógenos y sube la GnRH</text><text x="20" y="290" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="start" data-max="0">«no ve» estrógenos y sube la GnRH</text></g></g><ellipse cx="672.0" cy="433.0" rx="196.0" ry="120.0" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><polygon points="818.3,352.8 801.8,351.0 809.1,339.0" fill="#0f766e"/><polygon points="802.9,522.6 812.1,508.7 819.4,520.7" fill="#0f766e"/><polygon points="525.7,513.2 542.2,515.0 534.9,527.0" fill="#0f766e"/><polygon points="541.1,343.4 531.9,357.3 524.6,345.3" fill="#0f766e"/><text x="672.0" y="437.0" font-size="12.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="200"><tspan x="672.0" dy="0">Inducción de la ovulación</tspan></text><rect x="584.0" y="279.0" width="176.0" height="68.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="586.0" cy="281.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="586.0" y="285.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="586.0" dy="0">1</tspan></text><text x="672.0" y="301.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="672.0" dy="0">Clomifeno</tspan></text><text x="672.0" y="317.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="672.0" dy="0">bloquea el receptor de</tspan><tspan x="672.0" dy="14">estrógeno</tspan></text><rect x="780.0" y="406.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="782.0" cy="408.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="782.0" y="412.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="782.0" dy="0">2</tspan></text><text x="868.0" y="428.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="868.0" dy="0">Hipotálamo</tspan></text><text x="868.0" y="444.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="868.0" dy="0">sube la GnRH</tspan></text><rect x="584.0" y="526.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="586.0" cy="528.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="586.0" y="532.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="586.0" dy="0">3</tspan></text><text x="672.0" y="548.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="672.0" dy="0">Hipófisis</tspan></text><text x="672.0" y="564.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="672.0" dy="0">más FSH y LH</tspan></text><rect x="388.0" y="406.0" width="176.0" height="54.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><circle cx="390.0" cy="408.0" r="11" fill="#7c2d12" stroke="none" stroke-width="0"/><text x="390.0" y="412.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="390.0" dy="0">4</tspan></text><text x="476.0" y="428.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="156"><tspan x="476.0" dy="0">Ovario</tspan></text><text x="476.0" y="444.0" font-size="10.5" font-weight="500" font-style="normal" fill="#fff7ed" text-anchor="middle" data-max="156"><tspan x="476.0" dy="0">madura el folículo y ovula</tspan></text><rect x="430.6" y="449.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="476.0" y="464.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="476.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="659.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OTROS FACTORES Y SU TRATAMIENTO</tspan></text><rect x="40.0" y="669.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="670.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="693.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Tubárico</tspan></text><text x="58.0" y="714.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Fecundación in vitro.</tspan></text><rect x="351.3" y="669.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="670.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="693.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Uterino</tspan></text><text x="369.3" y="714.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Cirugía (miomas, pólipos, septos).</tspan></text><rect x="662.7" y="669.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="670.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="693.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Cervical</tspan></text><text x="680.7" y="714.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Inseminación intrauterina.</tspan></text><text x="40.0" y="778.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="788.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="810.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="810.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Cervical</tspan></text><rect x="400.5" y="791.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="810.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Ovulatorio</tspan></text><text x="678.8" y="810.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Uterino</tspan></text><text x="866.2" y="810.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Tubárico</tspan></text><rect x="40.0" y="825.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="825.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="846.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Lo corrige el</tspan><tspan x="54.0" dy="16">clomifeno?</tspan></text><text x="303.8" y="854.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="854.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="854.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="854.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="788.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="899.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="927.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="949.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Clomifeno (SERM): bloquea los receptores de estrógeno del hipotálamo → más GnRH → más FSH/LH → ovulación.</tspan><tspan x="58.0" dy="18">• Si funcionó, el problema era la anovulación (p. ej., ovario poliquístico).</tspan><tspan x="58.0" dy="18">• Letrozol es hoy la primera línea en ovario poliquístico; el factor tubárico necesita FIV.</tspan></text><text x="58.0" y="1007.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASRM, infertilidad (2021); Speroff Endocrinología Ginecológica 9.ª ed.</tspan></text></svg>