<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1285" viewBox="0 0 1000 1285" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dependencia de heroína con recaídas: mantenimiento con metadona"><title>Dependencia de heroína con recaídas: mantenimiento con metadona</title><rect x="0.75" y="0.75" width="998.5" height="1283.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trastornos por uso de sustancias · opioides</tspan></text><rect x="460.4" y="32.0" width="124.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="522.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="108"><tspan x="522.6" dy="0">PSIQUIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trastorno por uso de opioides</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los agonistas de larga duración (metadona, buprenorfina) son el tratamiento de base.</tspan><tspan x="58.0" dy="17">Quitan la abstinencia y el deseo y reducen la mortalidad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 32 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">4 años de heroína EV diaria; recae tras cada</tspan><tspan x="640.0" dy="16">suspensión brusca.</tspan><tspan x="640.0" dy="16">Busca un programa ambulatorio de mantenimiento a</tspan><tspan x="640.0" dy="16">largo plazo.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ CONVIENE?</tspan></text><rect x="493.0" y="351.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 556.0 H560.0 L540.0 536.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="351.0" r="11" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="369.1" x2="614.6" y2="332.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="369.1" x2="357.4" y2="431.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="369.1" x2="413.4" y2="431.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 431.1 H423.4 Q385.4 475.1 347.4 431.1 Z" fill="#ea580c"/><text x="385.4" y="446.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">elige</tspan></text><line x1="614.6" y1="332.9" x2="586.6" y2="394.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="332.9" x2="642.6" y2="394.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 394.9 H652.6 Q614.6 438.9 576.6 394.9 Z" fill="#64748b"/><text x="614.6" y="409.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">no</tspan></text><text x="500.0" y="583.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">Mantenimiento en dependencia de heroína</tspan></text><rect x="40.0" y="321.0" width="290.0" height="132.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Metadona</tspan></text><circle cx="62.0" cy="374.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Agonista de larga duración (24-36 h)</tspan></text><circle cx="62.0" cy="400.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="404.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Quita abstinencia y deseo</tspan></text><circle cx="62.0" cy="426.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="430.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Menos mortalidad y recaídas</tspan></text><rect x="214.6" y="310.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="321.0" width="290.0" height="132.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Sedantes o suspensión brusca</tspan></text><circle cx="692.0" cy="374.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">No ocupan el receptor opioide</tspan></text><circle cx="692.0" cy="400.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="404.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Abstinencia intensa: recae</tspan></text><circle cx="692.0" cy="426.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="430.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Benzodiacepinas suman riesgo</tspan></text><rect x="40.0" y="617.0" width="920.0" height="76.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="645.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Metadona en un programa de mantenimiento</tspan></text><text x="500.0" y="666.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Con dosis estable y apoyo psicosocial.</tspan></text><text x="40.0" y="733.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="745.0" width="378.0" height="246.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="755.0" width="198.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="769.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="336"><tspan x="61.0" dy="0">NIVEL DE OPIOIDE EN LA SANGRE</tspan></text><g transform="translate(54.0,783.0) scale(0.92)"><rect x="40" y="14" width="310" height="140" fill="#f8fafc" stroke="#cbd5e1"/><rect x="40" y="32" width="310" height="34" fill="#fecaca" opacity="0.5"/><text x="346" y="44" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">euforia / sobredosis</text><text x="346" y="44" font-size="9.5" font-weight="800" fill="#dc2626" text-anchor="end" data-max="0">euforia / sobredosis</text><rect x="40" y="118" width="310" height="36" fill="#fde68a" opacity="0.5"/><text x="346" y="148" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">abstinencia</text><text x="346" y="148" font-size="9.5" font-weight="800" fill="#a16207" text-anchor="end" data-max="0">abstinencia</text><polyline points="40,146.0 42,145.9 44,145.5 46,144.4 48,142.3 50,138.9 52,134.2 54,128.0 56,120.4 58,111.6 60,101.7 62,91.2 64,80.2 66,69.4 68,59.0 70,49.5 72,41.4 74,35.0 76,30.6 78,28.3 80,28.3 82,30.6 84,35.0 86,41.4 88,49.5 90,59.0 92,69.4 94,80.2 96,91.2 98,101.7 100,111.6 102,120.4 104,128.0 106,134.2 108,138.9 110,142.3 112,144.4 114,145.5 116,145.9 118,146.0 120,145.9 122,145.5 124,144.4 126,142.3 128,138.9 130,134.2 132,128.0 134,120.4 136,111.6 138,101.7 140,91.2 142,80.2 144,69.4 146,59.0 148,49.5 150,41.4 152,35.0 154,30.6 156,28.3 158,28.3 160,30.6 162,35.0 164,41.4 166,49.5 168,59.0 170,69.4 172,80.2 174,91.2 176,101.7 178,111.6 180,120.4 182,128.0 184,134.2 186,138.9 188,142.3 190,144.4 192,145.5 194,145.9 196,146.0 198,145.9 200,145.5 202,144.4 204,142.3 206,138.9 208,134.2 210,128.0 212,120.4 214,111.6 216,101.7 218,91.2 220,80.2 222,69.4 224,59.0 226,49.5 228,41.4 230,35.0 232,30.6 234,28.3 236,28.3 238,30.6 240,35.0 242,41.4 244,49.5 246,59.0 248,69.4 250,80.2 252,91.2 254,101.7 256,111.6 258,120.4 260,128.0 262,134.2 264,138.9 266,142.3 268,144.4 270,145.5 272,145.9 274,146.0 276,145.9 278,145.5 280,144.4 282,142.3 284,138.9 286,134.2 288,128.0 290,120.4 292,111.6 294,101.7 296,91.2 298,80.2 300,69.4 302,59.0 304,49.5 306,41.4 308,35.0 310,30.6 312,28.3 314,28.3 316,30.6 318,35.0 320,41.4 322,49.5 324,59.0 326,69.4 328,80.2 330,91.2 332,101.7 334,111.6 336,120.4 338,128.0 340,134.2 342,138.9 344,142.3 346,144.4 348,145.5" fill="none" stroke="#dc2626" stroke-width="2.4"/><line x1="40" y1="92" x2="350" y2="92" stroke="#0f766e" stroke-width="3"/><line x1="46" y1="176" x2="66" y2="176" stroke="#dc2626" stroke-width="3"/><text x="70" y="180" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">heroína: picos y caídas</text><text x="70" y="180" font-size="10" font-weight="800" fill="#dc2626" text-anchor="start" data-max="0">heroína: picos y caídas</text><line x1="216" y1="176" x2="236" y2="176" stroke="#0f766e" stroke-width="3"/><text x="240" y="180" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">metadona: nivel estable</text><text x="240" y="180" font-size="10" font-weight="800" fill="#0f766e" text-anchor="start" data-max="0">metadona: nivel estable</text></g><rect x="440.0" y="745.0" width="520.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="458.0" cy="763.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="458.0" y="767.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="458.0" dy="0">1</tspan></text><text x="478.0" y="767.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="476"><tspan x="478.0" dy="0">La heroína sube y baja: euforia y luego abstinencia.</tspan></text><rect x="440.0" y="776.0" width="520.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="458.0" cy="794.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="458.0" y="798.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="458.0" dy="0">2</tspan></text><text x="478.0" y="798.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="476"><tspan x="478.0" dy="0">La metadona da un nivel estable.</tspan></text><rect x="440.0" y="807.0" width="520.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="458.0" cy="825.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="458.0" y="829.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="458.0" dy="0">3</tspan></text><text x="478.0" y="829.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="476"><tspan x="478.0" dy="0">Sin picos ni caídas, el deseo baja.</tspan></text><text x="40.0" y="1031.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1041.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1063.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1044.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="1063.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Metadona</tspan></text><text x="491.2" y="1063.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Diazepam</tspan></text><text x="678.8" y="1063.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Haloperidol</tspan></text><text x="866.2" y="1063.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Ácido valproico</tspan></text><rect x="40.0" y="1078.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1078.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1099.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Trata la dependencia?</tspan></text><text x="303.8" y="1099.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="1099.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="1099.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="1099.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="1041.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1136.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1164.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1186.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mantenimiento con metadona (o buprenorfina): nivel estable sin picos ni abstinencia.</tspan><tspan x="58.0" dy="18">• Reduce sobredosis, infecciones por inyección y delitos; se combina con apoyo psicosocial.</tspan><tspan x="58.0" dy="18">• Benzodiacepinas, haloperidol o valproato no tratan la dependencia de opioides.</tspan></text><text x="58.0" y="1244.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, tratamiento de la dependencia de opioides; ASAM (2020).</tspan></text></svg>