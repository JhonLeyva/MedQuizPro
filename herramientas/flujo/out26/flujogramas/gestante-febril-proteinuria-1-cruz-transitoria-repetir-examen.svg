89.7,415.0 915.7,444.0 889.7,473.0 421.7,473.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="441.7" cy="444.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="449.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="448.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">¿Persiste la proteinuria al repetir sin fiebre?</tspan></text><rect x="351.3" y="571.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="608.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Cuantificar y estudiar</tspan></text><text x="500.0" y="631.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Proteína/creatinina u orina de 24 h</tspan></text><rect x="662.7" y="571.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="811.3" y="599.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">PROTEINURIA TRANSITORIA</tspan></text><text x="811.3" y="622.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Tranquilizar y explicar</tspan><tspan x="811.3" dy="17">Control prenatal habitual</tspan></text><text x="40.0" y="701.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="713.9" width="388.0" height="152.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="723.9" width="116.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="737.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="346"><tspan x="61.0" dy="0">LA TIRA REACTIVA</tspan></text><g data-box="54.0 751.9 360.0 90.0"><g transform="translate(54.0,751.9) scale(1.0)"><rect x="10" y="30" width="350" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1"/><rect x="22" y="34" width="42" height="22" rx="3" fill="#fef9c3" stroke="#94a3b8" stroke-width="1"/><text x="43" y="22" font-size="10" font-weight="600" fill="#334155" text-anchor="middle" data-max="0">Leucocitos</text><text x="43" y="78" font-size="11" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">neg</text><rect x="88" y="34" width="42" height="22" rx="3" fill="#fef9c3" stroke="#94a3b8" stroke-width="1"/><text x="109" y="22" font-size="10" font-weight="600" fill="#334155" text-anchor="middle" data-max="0">Nitritos</text><text x="109" y="78" font-size="11" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">neg</text><rect x="154" y="34" width="42" height="22" rx="3" fill="#a3e635" stroke="#ea580c" stroke-width="3"/><text x="175" y="22" font-size="10" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Proteínas</text><text x="175" y="78" font-size="11" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">1+</text><rect x="220" y="34" width="42" height="22" rx="3" fill="#fef3c7" stroke="#94a3b8" stroke-width="1"/><text x="241" y="22" font-size="10" font-weight="600" fill="#334155" text-anchor="middle" data-max="0">Sangre</text><text x="241" y="78" font-size="11" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">neg</text><rect x="286" y="34" width="42" height="22" rx="3" fill="#bfdbfe" stroke="#94a3b8" stroke-width="1"/><text x="307" y="22" font-size="10" font-weight="600" fill="#334155" text-anchor="middle" data-max="0">Glucosa</text><text x="307" y="78" font-size="11" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">neg</text></g></g><rect x="450.0" y="713.9" width="510.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="468.0" cy="729.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="468.0" y="733.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="468.0" dy="0">1</tspan></text><text x="486.0" y="733.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="466"><tspan x="486.0" dy="0">Proteínas 1+ y el resto negativo.</tspan></text><rect x="450.0" y="751.9" width="510.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="468.0" cy="767.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="468.0" y="771.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="468.0" dy="0">2</tspan></text><text x="486.0" y="771.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="466"><tspan x="486.0" dy="0">La fiebre puede hacer que la tira marque proteínas.</tspan></text><rect x="450.0" y="789.9" width="510.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="468.0" cy="805.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="468.0" y="809.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="468.0" dy="0">3</tspan></text><text x="486.0" y="809.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="466"><tspan x="486.0" dy="0">Repetir cuando esté afebril.</tspan></text><text x="40.0" y="905.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="915.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="946.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="918.9" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="946.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Repetir y explicar</tspan></text><text x="491.2" y="938.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Restricción proteica y</tspan><tspan x="491.2" dy="17">reposo</tspan></text><text x="678.8" y="946.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Inmunosupresor</tspan></text><text x="866.2" y="946.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Hospitalizar por nefrótico</tspan></text><rect x="40.0" y="969.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="969.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="990.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Adecuada?</tspan></text><text x="303.8" y="990.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="990.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: sin base</tspan></text><text x="678.8" y="990.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: no hay diagnóstico</tspan></text><text x="866.2" y="990.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: no hay síndrome nefrótico</tspan></text><rect x="40.0" y="915.9" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1027.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1055.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1077.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Proteinuria 1+ aislada con fiebre y PA normal: explicar que suele ser transitoria y repetir el examen al mejorar.</tspan><tspan x="58.0" dy="18">• Si persiste: cuantificar (proteína/creatinina en muestra aislada o orina de 24 h).</tspan><tspan x="58.0" dy="18">• No restricción proteica, reposo ni inmunosupresores sin diagnóstico.</tspan></text><text x="58.0" y="1135.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO; ACOG n.º 222 (hipertensión en el embarazo).</tspan></text></svg>