<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="977" viewBox="0 0 1000 977" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Quejido y crepitantes finos difusos: compromiso alveolointersticial"><title>Quejido y crepitantes finos difusos: compromiso alveolointersticial</title><rect x="0.75" y="0.75" width="998.5" height="975.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Dificultad respiratoria del lactante · localizar el nivel</tspan></text><rect x="505.6" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="562.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="562.1" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dónde está el problema respiratorio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cada nivel tiene su signo: estridor (extratorácico), sibilancias (intratorácico),</tspan><tspan x="58.0" dy="17">crepitantes y quejido (alveolointersticial), respiración irregular (central).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 4 meses con 24 h de dificultad</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">FR 68, retracciones subcostales, quejido espiratorio.</tspan><tspan x="640.0" dy="16">Crepitantes finos difusos; sin sibilancias ni estridor.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUATRO NIVELES, CUATRO SIGNOS</tspan></text><rect x="40.0" y="269.0" width="440.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="201.7" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">NIVELES DE LA VÍA RESPIRATORIA</tspan></text><g transform="translate(92.0,303.0) scale(1.0)"><circle cx="150" cy="30" r="26" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" /><text x="150" y="34" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">cerebro</text><text x="150" y="34" font-size="10" font-weight="800" fill="#3730a3" text-anchor="middle" data-max="0">cerebro</text><path d="M142 60 L142 110 L158 110 L158 60 Z" fill="#bae6fd" stroke="#0369a1" stroke-width="2" stroke-linejoin="round" /><path d="M150 110 L150 150 M150 150 C120 170 90 190 70 220 M150 150 C180 170 210 190 230 220" fill="none" stroke="#0369a1" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="62" cy="232" r="11" fill="#ea580c" stroke="#be185d" stroke-width="1.5" /><circle cx="78" cy="246" r="11" fill="#ea580c" stroke="#be185d" stroke-width="1.5" /><circle cx="222" cy="232" r="11" fill="#ea580c" stroke="#be185d" stroke-width="1.5" /><circle cx="238" cy="246" r="11" fill="#ea580c" stroke="#be185d" stroke-width="1.5" /><circle cx="70" cy="260" r="11" fill="#ea580c" stroke="#be185d" stroke-width="1.5" /><circle cx="230" cy="260" r="11" fill="#ea580c" stroke="#be185d" stroke-width="1.5" /><text x="184" y="86" font-size="10.5" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Extratorácica: estridor</text><text x="184" y="86" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">Extratorácica: estridor</text><text x="196" y="176" font-size="10.5" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Intratorácica: sibilancias</text><text x="196" y="176" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">Intratorácica: sibilancias</text><text x="150" y="290" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Alveolointersticial: crepitantes, quejido</text><text x="150" y="290" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">Alveolointersticial: crepitantes, quejido</text><text x="184" y="36" font-size="10.5" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Central: respiración irregular</text><text x="184" y="36" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">Central: respiración irregular</text></g><rect x="48.0" y="636.0" width="424.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="260.0" y="657.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="410"><tspan x="260.0" dy="0">En naranja, los alveolos: nivel del caso.</tspan></text><rect x="500.0" y="269.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="270.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="293.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">1. Obstrucción extratorácica</tspan></text><text x="518.0" y="314.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Estridor inspiratorio (laringitis, cuerpo extraño alto).</tspan></text><rect x="500.0" y="348.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="349.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="372.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">2. Obstrucción intratorácica</tspan></text><text x="518.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Sibilancias y espiración prolongada (bronquiolitis, asma).</tspan></text><rect x="500.0" y="427.0" width="460.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="501.0" y="428.0" width="6.0" height="67.0" rx="3" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="518.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">3. Compromiso alveolointersticial</tspan></text><text x="518.0" y="472.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Crepitantes finos, quejido, taquipnea: este caso.</tspan></text><rect x="860.2" y="416.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="431.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="500.0" y="506.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="507.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="530.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">4. Insuficiencia de origen central</tspan></text><text x="518.0" y="551.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Respiración irregular o apneas sin esfuerzo respiratorio.</tspan></text><text x="40.0" y="723.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="733.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="755.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="755.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Extratorácica</tspan></text><rect x="400.5" y="736.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="755.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Alveolointersticial</tspan></text><text x="678.8" y="755.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Intratorácica</tspan></text><text x="866.2" y="755.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Central</tspan></text><rect x="40.0" y="770.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="770.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="791.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Signo típico</tspan></text><text x="303.8" y="791.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Estridor</tspan></text><text x="491.2" y="791.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Crepitantes y quejido</tspan></text><text x="678.8" y="791.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sibilancias</tspan></text><text x="866.2" y="791.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Respiración irregular</tspan></text><rect x="40.0" y="733.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="828.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="856.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="878.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Quejido espiratorio + crepitantes finos + taquipnea = compromiso alveolointersticial (neumonía, edema).</tspan><tspan x="58.0" dy="18">• El quejido cierra la glotis al final de la espiración para mantener los alveolos abiertos (PEEP propia).</tspan><tspan x="58.0" dy="18">• Sin estridor ni sibilancias: no es obstrucción de la vía aérea.</tspan></text><text x="58.0" y="936.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); OMS, AIEPI.</tspan></text></svg>