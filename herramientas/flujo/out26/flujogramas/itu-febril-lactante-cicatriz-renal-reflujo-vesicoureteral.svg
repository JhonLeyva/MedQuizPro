<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1296" viewBox="0 0 1000 1296" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="ITU febril con cicatrices renales en lactantes: reflujo vesicoureteral"><title>ITU febril con cicatrices renales en lactantes: reflujo vesicoureteral</title><rect x="0.75" y="0.75" width="998.5" height="1294.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología pediátrica · reflujo vesicoureteral</tspan></text><rect x="459.8" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="516.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="516.3" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nefropatía por reflujo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Si la válvula entre uréter y vejiga falla, la orina infectada sube al riñón.</tspan><tspan x="58.0" dy="17">Las pielonefritis repetidas dejan cicatrices: hipertensión y enfermedad renal crónica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Programa de vigilancia en un hospital regional</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">20 % de lactantes con primera ITU febril tiene</tspan><tspan x="640.0" dy="16">cicatrices en la gammagrafía.</tspan><tspan x="640.0" dy="16">La cistouretrografía muestra la misma anomalía en la</tspan><tspan x="640.0" dy="16">mayoría.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS CUATRO OPCIONES FRENTE AL CASO</tspan></text><line x1="410.9" y1="436.9" x2="340.0" y2="460.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="460.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="377.1" x2="660.0" y2="353.4" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="353.4" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="436.9" x2="660.0" y2="460.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="460.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.9" y1="377.1" x2="340.0" y2="353.4" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="353.4" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="407.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="407.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="402.5" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">ITU febril + cicatriz</tspan><tspan x="500.0" dy="19">renal</tspan></text><rect x="40.0" y="307.8" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="336.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Reflujo vesicoureteral</tspan></text><text x="190.0" y="360.3" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">La cistouretrografía lo muestra; es la causa</tspan><tspan x="190.0" dy="17">más común de cicatriz</tspan></text><rect x="144.6" y="389.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="404.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="415.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="416.0" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="443.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Estenosis pieloureteral</tspan></text><text x="190.0" y="467.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Da hidronefrosis; no se ve en la</tspan><tspan x="190.0" dy="17">cistouretrografía</tspan></text><rect x="660.0" y="307.8" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="308.8" width="6.0" height="89.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="336.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Valvas de uretra posterior</tspan></text><text x="810.0" y="360.3" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Solo en varones; obstrucción y vejiga de</tspan><tspan x="810.0" dy="17">esfuerzo</tspan></text><rect x="660.0" y="415.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="416.0" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="443.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Doble sistema pielocalicial</tspan></text><text x="810.0" y="467.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Variante; a veces se asocia a reflujo, pero no</tspan><tspan x="810.0" dy="17">es la regla</tspan></text><text x="40.0" y="549.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="561.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="585.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Primera ITU febril</tspan></text><line x1="248.5" y1="581.5" x2="267.5" y2="581.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,576.5 266.5,586.5 274.5,581.5" fill="#0f766e"/><rect x="278.5" y="561.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="585.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Ecografía renal</tspan></text><line x1="487.0" y1="581.5" x2="506.0" y2="581.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,576.5 505.0,586.5 513.0,581.5" fill="#0f766e"/><rect x="517.0" y="561.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="585.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Cistouretrografía: reflujo</tspan></text><line x1="725.5" y1="581.5" x2="744.5" y2="581.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,576.5 743.5,586.5 751.5,581.5" fill="#0f766e"/><rect x="755.5" y="561.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="585.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Profilaxis y seguimiento</tspan></text><text x="40.0" y="642.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="654.0" width="318.0" height="332.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="664.0" width="213.2" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="678.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="276"><tspan x="61.0" dy="0">REFLUJO DE ORINA HACIA EL RIÑÓN</tspan></text><g transform="translate(54.0,692.0) scale(0.95)"><path d="M50 40 C20 50 20 130 50 140 C70 146 84 120 76 90 C84 60 70 34 50 40 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" /><path d="M250 40 C280 50 280 130 250 140 C230 146 216 120 224 90 C216 60 230 34 250 40 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" /><path d="M76 96 C90 150 118 200 136 232" fill="none" stroke="#fde68a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M224 96 C210 150 182 200 164 232" fill="none" stroke="#fde68a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="244" rx="44" ry="30" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" /><text x="150" y="250" font-size="10" font-weight="800" fill="#a16207" text-anchor="middle" data-max="0">vejiga</text><text x="10" y="16" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="16" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text><path d="M76 96 C90 150 118 200 136 232" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/><line x1="128.0" y1="214.0" x2="123.2" y2="203.3" stroke="#ea580c" stroke-width="2.2"/><polygon points="120.0,196.0 127.6,202.5 119.7,206.0" fill="#ea580c"/><line x1="112.0" y1="178.0" x2="107.2" y2="167.3" stroke="#ea580c" stroke-width="2.2"/><polygon points="104.0,160.0 111.6,166.5 103.7,170.0" fill="#ea580c"/><line x1="96.0" y1="142.0" x2="91.2" y2="131.3" stroke="#ea580c" stroke-width="2.2"/><polygon points="88.0,124.0 95.6,130.5 87.7,134.0" fill="#ea580c"/><path d="M50 60 C40 70 40 110 50 120" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linejoin="round" /><text x="96" y="150" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">orina que sube</text><text x="96" y="150" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="start" data-max="0">orina que sube</text></g><rect x="380.0" y="654.0" width="580.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="398.0" cy="672.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="398.0" y="676.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="398.0" dy="0">1</tspan></text><text x="418.0" y="676.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="536"><tspan x="418.0" dy="0">La orina sube desde la vejiga por el uréter (flechas).</tspan></text><rect x="380.0" y="685.0" width="580.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="398.0" cy="703.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="398.0" y="707.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="398.0" dy="0">2</tspan></text><text x="418.0" y="707.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="536"><tspan x="418.0" dy="0">Lleva bacterias al riñón: pielonefritis.</tspan></text><rect x="380.0" y="716.0" width="580.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="398.0" cy="734.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="398.0" y="738.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="398.0" dy="0">3</tspan></text><text x="418.0" y="738.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="536"><tspan x="418.0" dy="0">Cada pielonefritis puede dejar una cicatriz.</tspan></text><text x="40.0" y="1026.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1036.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1058.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1058.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Estenosis pieloureteral</tspan></text><text x="491.2" y="1058.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Valvas uretrales</tspan></text><text x="678.8" y="1058.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Doble sistema</tspan></text><rect x="775.5" y="1039.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="1058.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Reflujo vesicoureteral</tspan></text><rect x="40.0" y="1073.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="1073.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1094.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Explica cicatrices tras</tspan><tspan x="54.0" dy="16">ITU?</tspan></text><text x="303.8" y="1102.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="1102.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Solo varones</tspan></text><text x="678.8" y="1102.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Poco frecuente</tspan></text><text x="866.2" y="1102.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="1036.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1147.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1175.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1197.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ITU febril + cicatriz renal + hallazgo en la cistouretrografía = reflujo vesicoureteral.</tspan><tspan x="58.0" dy="18">• Detectarlo y tratarlo a tiempo (profilaxis o cirugía según grado) reduce nuevas cicatrices.</tspan><tspan x="58.0" dy="18">• Valvas uretrales: solo varones y con obstrucción; estenosis pieloureteral: hidronefrosis sin reflujo.</tspan></text><text x="58.0" y="1255.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, guía de ITU febril; EAU/ESPU, reflujo vesicoureteral (2023); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>