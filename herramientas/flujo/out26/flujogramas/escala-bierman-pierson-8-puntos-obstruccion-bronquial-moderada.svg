x="120" cy="214" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="120" y="218" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text></g><rect x="340.0" y="645.0" width="620.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="663.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="667.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">1</tspan></text><text x="378.0" y="667.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="378.0" dy="0">Cianosis alrededor de la boca solo al llorar: 1 punto.</tspan></text><rect x="340.0" y="676.0" width="620.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="694.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="698.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">2</tspan></text><text x="378.0" y="698.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="378.0" dy="0">Tiraje subcostal e intercostal: 2 puntos.</tspan></text><rect x="340.0" y="707.0" width="620.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="725.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">3</tspan></text><text x="378.0" y="729.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="378.0" dy="0">Sibilancias que se oyen a distancia y FR 58: 3 + 2 puntos.</tspan></text><text x="40.0" y="1047.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1057.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1079.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1079.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">6</tspan></text><rect x="400.5" y="1060.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="1079.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">8</tspan></text><text x="678.8" y="1079.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">7</tspan></text><text x="866.2" y="1079.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">9</tspan></text><rect x="40.0" y="1094.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1094.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1115.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Por qué</tspan></text><text x="303.8" y="1115.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Subestima sibilancias o FR</tspan></text><text x="491.2" y="1115.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Suma correcta</tspan></text><text x="678.8" y="1115.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Cuenta 1 en FR o tiraje</tspan></text><text x="866.2" y="1115.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Cuenta 2 en cianosis</tspan></text><rect x="40.0" y="1057.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1152.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1180.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1202.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• A partir de los 6 meses: FR 46-60 = 2 puntos.</tspan><tspan x="58.0" dy="18">• Sibilancias audibles sin estetoscopio = 3; tiraje subcostal + intercostal = 2; cianosis perioral con el llanto = 1.</tspan><tspan x="58.0" dy="18">• Total 8: obstrucción moderada (tratamiento en emergencia y reevaluar).</tspan></text><text x="58.0" y="1260.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Bierman CW, Pierson WE (1974), modificada; MINSA, guía de síndrome obstructivo bronquial.</tspan></text></svg>