ht="800" fill="#0369a1" text-anchor="middle" data-max="0">FVIII</text><text x="20" y="40" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Factor de von Willebrand (violeta):</text><text x="20" y="40" font-size="10.5" font-weight="800" fill="#6d28d9" text-anchor="start" data-max="0">Factor de von Willebrand (violeta):</text><text x="20" y="54" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">puente entre colágeno y plaqueta</text><text x="20" y="54" font-size="10.5" font-weight="800" fill="#6d28d9" text-anchor="start" data-max="0">puente entre colágeno y plaqueta</text><text x="20" y="68" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">y protege al factor VIII</text><text x="20" y="68" font-size="10.5" font-weight="800" fill="#6d28d9" text-anchor="start" data-max="0">y protege al factor VIII</text></g></g><rect x="414.0" y="728.9" width="546.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="432.0" cy="744.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="432.0" y="748.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="432.0" dy="0">1</tspan></text><text x="450.0" y="748.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="502"><tspan x="450.0" dy="0">Une la plaqueta al colágeno del vaso lesionado.</tspan></text><rect x="414.0" y="766.9" width="546.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="432.0" cy="782.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="432.0" y="786.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="432.0" dy="0">2</tspan></text><text x="450.0" y="786.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="502"><tspan x="450.0" dy="0">Si falta, la plaqueta no se pega: sangrado de mucosas.</tspan></text><rect x="414.0" y="804.9" width="546.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="432.0" cy="820.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="432.0" y="824.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="432.0" dy="0">3</tspan></text><text x="450.0" y="824.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="502"><tspan x="450.0" dy="0">La ristocetina mide esa función en el laboratorio.</tspan></text><text x="40.0" y="1010.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1020.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1043.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1043.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Factor VII</tspan></text><rect x="400.5" y="1023.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="1043.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Cofactor de ristocetina</tspan></text><text x="678.8" y="1043.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Factor IX</tspan></text><text x="866.2" y="1043.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Inhibidor del FVIII</tspan></text><rect x="40.0" y="1057.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1057.9" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1086.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1086.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Daría TP largo</tspan></text><text x="491.2" y="1086.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ninguno</tspan></text><text x="678.8" y="1078.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Hemofilia B: varones y TTPa</tspan><tspan x="678.8" dy="16">largo</tspan></text><text x="866.2" y="1086.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">TTPa largo</tspan></text><rect x="40.0" y="1020.9" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1131.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1159.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1181.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sangrado mucocutáneo + familia afectada de ambos sexos + plaquetas y TP normales = sospechar von Willebrand.</tspan><tspan x="58.0" dy="18">• El TTPa puede ser normal en la forma leve: pedir actividad del cofactor de ristocetina, antígeno vWF y FVIII.</tspan><tspan x="58.0" dy="18">• Los factores VII y IX y los inhibidores no explican este patrón.</tspan></text><text x="58.0" y="1239.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASH/ISTH/NHF/WFH, von Willebrand (2021).</tspan></text></svg>