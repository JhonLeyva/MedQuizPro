<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1341" viewBox="0 0 1000 1341" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mastitis que no mejora y masa fluctuante: absceso mamario, drenaje"><title>Mastitis que no mejora y masa fluctuante: absceso mamario, drenaje</title><rect x="0.75" y="0.75" width="998.5" height="1339.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Puerperio · mastitis y absceso mamario</tspan></text><rect x="434.5" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="521.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="521.7" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mastitis puerperal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación de la mama que lacta, casi siempre por S. aureus.</tspan><tspan x="58.0" dy="17">Si no mejora en 48-72 h o aparece una masa fluctuante: absceso.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Puérpera de 3 semanas con lactancia exclusiva</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mastitis tratada con dicloxacilina; a las 72 h sigue con</tspan><tspan x="640.0" dy="16">fiebre.</tspan><tspan x="640.0" dy="16">Masa fluctuante de 5 cm en el cuadrante</tspan><tspan x="640.0" dy="16">superoexterno izquierdo.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="422.2" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="287.0" x2="422.2" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,315.0 427.2,315.0 422.2,323.0" fill="#94a3b8"/><line x1="422.2" y1="381.0" x2="422.2" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="411.0" x2="655.7" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="411.0" x2="188.7" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,439.0 193.7,439.0 188.7,447.0" fill="#94a3b8"/><line x1="655.7" y1="411.0" x2="655.7" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,439.0 660.7,439.0 655.7,447.0" fill="#94a3b8"/><line x1="655.7" y1="505.0" x2="655.7" y2="550.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="550.5" x2="811.3" y2="550.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="550.5" x2="500.0" y2="579.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,578.5 505.0,578.5 500.0,586.5" fill="#94a3b8"/><line x1="811.3" y1="550.5" x2="811.3" y2="579.5" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,578.5 816.3,578.5 811.3,586.5" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="422.2" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="287.0" x2="422.2" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,315.0 427.2,315.0 422.2,323.0" fill="#0f766e"/><line x1="422.2" y1="381.0" x2="422.2" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="411.0" x2="655.7" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="411.0" x2="655.7" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,439.0 660.7,439.0 655.7,447.0" fill="#0f766e"/><line x1="655.7" y1="505.0" x2="655.7" y2="550.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="550.5" x2="655.7" y2="550.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="550.5" x2="500.0" y2="579.5" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,578.5 505.0,578.5 500.0,586.5" fill="#0f766e"/><rect x="176.6" y="420.0" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Sí</tspan></text><rect x="641.5" y="420.0" width="28.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="655.7" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="655.7" dy="0">No</tspan></text><rect x="487.9" y="559.5" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="500.0" y="572.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Sí</tspan></text><rect x="797.2" y="559.5" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="572.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><polygon points="162.2,352.0 188.2,323.0 656.2,323.0 682.2,352.0 656.2,381.0 188.2,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">¿Mejora la mastitis a las 48-72 h de antibiótico?</tspan></text><rect x="40.0" y="447.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Completar antibiótico</tspan></text><text x="188.7" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Vaciar la mama: seguir lactando</tspan></text><polygon points="395.7,476.0 421.7,447.0 889.7,447.0 915.7,476.0 889.7,505.0 421.7,505.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="441.7" cy="476.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="481.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="480.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">¿Hay una masa fluctuante (colección)?</tspan></text><rect x="351.3" y="586.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="614.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">DRENAJE + ANTIBIÓTICO</tspan></text><text x="500.0" y="637.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Punción ecoguiada o incisión según el tamaño</tspan><tspan x="500.0" dy="17">Seguir lactando</tspan></text><rect x="662.7" y="586.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="623.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Ecografía y cambiar antibiótico</tspan></text><text x="811.3" y="646.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Cubrir SAMR si es probable</tspan></text><text x="40.0" y="716.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="728.9" width="328.0" height="302.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="738.9" width="113.9" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="752.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="286"><tspan x="61.0" dy="0">LO QUE SE PALPA</tspan></text><g transform="translate(54.0,766.9) scale(1.0)"><circle cx="150" cy="125" r="100" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="150" cy="125" r="24" fill="#d6a684" stroke="#9a6b52" stroke-width="1.5" /><circle cx="150" cy="125" r="8" fill="#9a6b52" stroke="none" stroke-width="0" /><path d="M168 125 L230 125" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M163 138 L207 182" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M150 143 L150 205" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M137 138 L93 182" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M132 125 L70 125" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M137 112 L93 68" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M150 107 L150 45" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><path d="M163 112 L207 68" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linejoin="round" /><line x1="150" y1="22" x2="150" y2="228" stroke="#cbd5e1" stroke-dasharray="4 4"/><line x1="46" y1="125" x2="254" y2="125" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="270" y="20" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">axila</text><circle cx="202" cy="76" r="34" fill="#fca5a5" stroke="#b91c1c" stroke-width="2.5" /><circle cx="202" cy="76" r="18" fill="#fde68a" stroke="#ca8a04" stroke-width="1.5" /><text x="202" y="34" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">absceso de 5 cm</text><text x="202" y="34" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">absceso de 5 cm</text><text x="210" y="236" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">cuadrante superoexterno</text></g><rect x="390.0" y="728.9" width="570.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="408.0" cy="746.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="750.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">1</tspan></text><text x="428.0" y="750.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Colección de 5 cm en el cuadrante superoexterno de la mama izquierda.</tspan></text><rect x="390.0" y="759.9" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="777.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="781.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">2</tspan></text><text x="428.0" y="781.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Fiebre que persiste pese al antibiótico: el pus no se esteriliza sin drenar.</tspan></text><rect x="390.0" y="790.9" width="570.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="808.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="812.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">3</tspan></text><text x="428.0" y="812.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="428.0" dy="0">Por su tamaño, el drenaje suele ser quirúrgico.</tspan></text><text x="40.0" y="1070.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1080.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1103.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1083.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="1103.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Drenaje + antibiótico</tspan></text><text x="491.2" y="1103.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Mastectomía parcial</tspan></text><text x="678.8" y="1103.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Más antibiótico y calor</tspan></text><text x="866.2" y="1103.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Suspender la lactancia</tspan></text><rect x="40.0" y="1117.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1117.9" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1146.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1146.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Ninguno</tspan></text><text x="491.2" y="1146.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Excesiva</tspan></text><text x="678.8" y="1146.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No drena el pus</tspan></text><text x="866.2" y="1138.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No es necesario; empeora la</tspan><tspan x="866.2" dy="16">congestión</tspan></text><rect x="40.0" y="1080.9" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1191.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1219.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1241.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Absceso mamario: drenaje (punción ecoguiada si es pequeño; quirúrgico si es grande) + antibiótico antiestafilocócico.</tspan><tspan x="58.0" dy="18">• Mantener la lactancia con la mama sana y, si se puede, con la afectada: vaciar la mama ayuda.</tspan><tspan x="58.0" dy="18">• Si recurre o no mejora: cultivo y descartar carcinoma inflamatorio.</tspan></text><text x="58.0" y="1299.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ABM, protocolo de mastitis (2022); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>