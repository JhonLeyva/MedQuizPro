<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1097" viewBox="0 0 1000 1097" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Estado epiléptico: más consumo de oxígeno y peor ventilación"><title>Estado epiléptico: más consumo de oxígeno y peor ventilación</title><rect x="0.75" y="0.75" width="998.5" height="1095.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Estado epiléptico · repercusión sistémica</tspan></text><rect x="444.7" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="501.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="501.2" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estado epiléptico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis de más de 5 minutos o varias sin recuperar la conciencia.</tspan><tspan x="58.0" dy="17">Las contracciones musculares y la actividad cerebral disparan la demanda de oxígeno.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 6 años en estado epiléptico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hipotensión, hipoxemia y acidosis láctica.</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE ENCADENAN LOS PROBLEMAS</tspan></text><rect x="40.0" y="253.0" width="308.0" height="422.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="263.0" width="142.2" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="277.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">QUÉ FALLA EN EL NIÑO</tspan></text><g data-box="54.0 291.0 280.0 330.0"><g transform="translate(94.0,291.0) scale(0.86)"><circle cx="110" cy="56" r="42" fill="#fed7aa" stroke="#e9b48f" stroke-width="2" /><circle cx="95" cy="52" r="3.5" fill="#334155" stroke="none" stroke-width="0" /><circle cx="125" cy="52" r="3.5" fill="#334155" stroke="none" stroke-width="0" /><path d="M100 74 Q110 80 120 74" fill="none" stroke="#9a6b52" stroke-width="2"/><rect x="102" y="96" width="16" height="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><path d="M74.0 106 H146.0 L150.0 170 H70.0 Z" fill="#fed7aa" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70.0 170 H150.0 C154 206 148.0 222 144.0 232 H76.0 C72.0 222 66 206 70.0 170 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M74.0 110 L50.0 120 L40.0 214 L56.0 216 L70.0 150 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M146.0 110 L170.0 120 L180.0 214 L164.0 216 L150.0 150 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="48.0" cy="224" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="172.0" cy="224" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M80 232 H106 L104 364 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M114 232 H140 L136 364 H116 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="92" cy="370" rx="14" ry="6" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><ellipse cx="128" cy="370" rx="14" ry="6" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="50" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="110" y="54" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="50" cy="180" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="50" y="184" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><circle cx="110" cy="136" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="110" y="140" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text></g></g><text x="54.0" y="637.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="54.0" dy="0">1 neuronas y 2 músculos consumen O₂; 3 la</tspan><tspan x="54.0" dy="15">respiración se altera.</tspan></text><ellipse cx="662.0" cy="410.0" rx="206.0" ry="120.0" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><polygon points="791.4,316.4 774.8,317.0 780.3,304.1" fill="#0f766e"/><polygon points="853.5,454.9 854.7,438.4 867.0,445.3" fill="#0f766e"/><polygon points="653.0,530.0 668.0,523.0 668.0,537.0" fill="#0f766e"/><polygon points="461.7,439.2 475.1,448.9 462.9,455.7" fill="#0f766e"/><polygon points="549.2,309.4 538.1,321.7 532.7,308.8" fill="#0f766e"/><text x="662.0" y="414.0" font-size="12.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="220"><tspan x="662.0" dy="0">Estado epiléptico</tspan></text><rect x="574.0" y="263.0" width="176.0" height="54.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><circle cx="576.0" cy="265.0" r="11" fill="#7c2d12" stroke="none" stroke-width="0"/><text x="576.0" y="269.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="576.0" dy="0">1</tspan></text><text x="662.0" y="285.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">Más consumo de O₂</tspan></text><text x="662.0" y="301.0" font-size="10.5" font-weight="500" font-style="normal" fill="#fff7ed" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">neuronas y músculos</tspan></text><rect x="616.6" y="306.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="662.0" y="321.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">◆ ESTE CASO</tspan></text><rect x="769.9" y="345.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="771.9" cy="347.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="771.9" y="351.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="771.9" dy="0">2</tspan></text><text x="857.9" y="367.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">Ventilación alterada</tspan></text><text x="857.9" y="383.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">contracciones y apneas</tspan></text><rect x="695.1" y="480.1" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="697.1" cy="482.1" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="697.1" y="486.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="697.1" dy="0">3</tspan></text><text x="783.1" y="502.1" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">Hipoxemia</tspan></text><text x="783.1" y="518.1" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">menos O₂ en la sangre</tspan></text><rect x="452.9" y="480.1" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="454.9" cy="482.1" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="454.9" y="486.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="454.9" dy="0">4</tspan></text><text x="540.9" y="502.1" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">Acidosis láctica</tspan></text><text x="540.9" y="518.1" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">metabolismo anaerobio</tspan></text><rect x="378.1" y="345.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="380.1" cy="347.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="380.1" y="351.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="380.1" dy="0">5</tspan></text><text x="466.1" y="367.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">Hipotensión</tspan></text><text x="466.1" y="383.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">acidosis y vasodilatación</tspan></text><text x="40.0" y="707.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="717.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="718.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="741.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Sepsis</tspan></text><text x="58.0" y="762.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">No hay foco ni fiebre descrita.</tspan></text><rect x="351.3" y="717.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="718.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="741.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Hipoglucemia</tspan></text><text x="369.3" y="762.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No explica la hipoxemia.</tspan></text><rect x="662.7" y="717.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="718.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="741.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Reacción a fármacos</tspan></text><text x="680.7" y="762.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No explica todo el conjunto.</tspan></text><text x="40.0" y="826.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="836.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="867.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="867.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Sepsis</tspan></text><text x="491.2" y="867.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Hipoglucemia</tspan></text><text x="678.8" y="858.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Reacción a</tspan><tspan x="678.8" dy="17">anticonvulsivos</tspan></text><rect x="775.5" y="839.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="858.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Más consumo de O₂ +</tspan><tspan x="866.2" dy="17">mala ventilación</tspan></text><rect x="40.0" y="890.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="890.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="911.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Explica todo?</tspan></text><text x="303.8" y="911.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="911.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="911.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="911.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="836.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="948.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="976.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="998.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mecanismo común: aumento del consumo de oxígeno (músculo y neuronas) + alteración de la ventilación.</tspan><tspan x="58.0" dy="18">• El oxígeno no alcanza → metabolismo anaerobio → acidosis láctica → vasodilatación e hipotensión.</tspan><tspan x="58.0" dy="18">• Por eso el ABC (oxígeno, vía aérea) va junto con la benzodiacepina.</tspan></text><text x="58.0" y="1056.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); Neurocritical Care Society, estado epiléptico (2012).</tspan></text></svg>