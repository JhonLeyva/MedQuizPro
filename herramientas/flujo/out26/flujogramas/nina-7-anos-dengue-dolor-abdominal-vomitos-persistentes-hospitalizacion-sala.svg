anchor="start" data-max="546"><tspan x="404.0" dy="0">Vómitos persistentes</tspan></text><rect x="370.0" y="371.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="385.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="389.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="389.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Sin shock ni sangrado grave</tspan></text><rect x="370.0" y="403.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="417.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="421.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="421.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Consciente, sin falla de órganos</tspan></text><rect x="370.0" y="445.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="478.0" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="478.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Sin signos de alarma (A)</tspan></text><text x="430.0" y="484.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Casa</tspan></text><text x="430.0" y="500.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hidratación oral, paracetamol; volver si aparecen signos de alarma.</tspan></text><rect x="370.0" y="519.0" width="590.0" height="66.0" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.2"/><circle cx="400.0" cy="552.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="552.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="541.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Con signos de alarma (B)</tspan></text><text x="430.0" y="558.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hospitalizar en sala</tspan></text><text x="430.0" y="574.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Cristaloides EV y hematocrito seriado.</tspan></text><rect x="854.6" y="508.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="523.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ ESTE CASO</tspan></text><rect x="370.0" y="593.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="626.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="626.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="615.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Dengue grave (C)</tspan></text><text x="430.0" y="632.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Cuidados intensivos</tspan></text><text x="430.0" y="648.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Shock, sangrado grave o falla de órganos.</tspan></text><text x="40.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="739.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="761.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">UCI pediátrica</tspan></text><text x="491.2" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Observar en emergencia</tspan></text><rect x="588.0" y="742.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Hospitalizar en sala</tspan></text><text x="866.2" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Ambulatorio con SRO</tspan></text><rect x="40.0" y="776.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="776.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="805.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuándo?</tspan></text><text x="303.8" y="805.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Dengue grave</tspan></text><text x="491.2" y="797.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Insuficiente con signos de</tspan><tspan x="491.2" dy="16">alarma</tspan></text><text x="678.8" y="805.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Signos de alarma: este caso</tspan></text><text x="866.2" y="805.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sin signos de alarma</tspan></text><rect x="40.0" y="739.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="850.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="878.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="900.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dolor abdominal intenso y vómitos persistentes son signos de alarma: anuncian fuga de plasma.</tspan><tspan x="58.0" dy="18">• Dengue con signos de alarma sin shock: hospitalizar en sala, cristaloides EV y hematocrito seriado.</tspan><tspan x="58.0" dy="18">• La fase crítica empieza al bajar la fiebre (días 3-7): vigilar de cerca.</tspan></text><text x="58.0" y="958.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OPS, guía de dengue (2016); MINSA Perú, norma técnica de dengue.</tspan></text></svg>