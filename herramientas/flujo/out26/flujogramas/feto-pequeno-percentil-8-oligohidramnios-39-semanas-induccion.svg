<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1184" viewBox="0 0 1000 1184" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Feto pequeño con oligohidramnios a las 39 semanas: inducir el parto"><title>Feto pequeño con oligohidramnios a las 39 semanas: inducir el parto</title><rect x="0.75" y="0.75" width="998.5" height="1182.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Restricción del crecimiento · feto pequeño a término</tspan></text><rect x="509.7" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="596.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="596.9" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Feto pequeño para la edad gestacional</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Peso fetal &lt; p10. El Doppler y el líquido amniótico dicen si está comprometido.</tspan><tspan x="58.0" dy="17">A término, un feto pequeño con oligohidramnios no gana nada quedándose.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 39 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">AU 30 cm; peso fetal en p8; líquido amniótico</tspan><tspan x="640.0" dy="16">disminuido.</tspan><tspan x="640.0" dy="16">Doppler umbilical y cerebral media normales.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿SEGUIR O TERMINAR?</tspan></text><polygon points="220,320.0 260,285.0 740,285.0 780,320.0 740,355.0 260,355.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="320.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="325.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="325.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">¿Feto &lt; p10 con oligohidramnios y ya a término?</tspan></text><line x1="500.0" y1="355.0" x2="500.0" y2="375.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="375.0" x2="662.0" y2="375.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="375.0" x2="190.0" y2="404.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,403.0 195.0,403.0 190.0,411.0" fill="#0f766e"/><line x1="662.0" y1="375.0" x2="662.0" y2="404.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,403.0 667.0,403.0 662.0,411.0" fill="#ea580c"/><rect x="94.1" y="383.0" width="191.9" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="397.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">No (pretérmino, líquido normal)</tspan></text><rect x="579.1" y="383.0" width="165.8" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="397.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Sí: 39 semanas (este caso)</tspan></text><rect x="40.0" y="411.0" width="300.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="412.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="435.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Vigilancia con Doppler</tspan></text><text x="58.0" y="456.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Crecimiento cada 2-3 semanas</tspan><tspan x="58.0" dy="16">Terminar a las 37-39 según el caso</tspan></text><rect x="364.0" y="411.0" width="596.0" height="366.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="400.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="415.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="437.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Terminar la gestación: inducción</tspan></text><text x="382.0" y="459.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Doppler normal: tolera el parto; se intenta la vía vaginal con monitoreo.</tspan></text><g transform="translate(472.0,479.0) scale(1.1)"><rect x="44" y="12" width="250" height="180" fill="#f8fafc" stroke="#cbd5e1"/><polyline points="44.0,141.0 56.5,135.7 69.0,130.4 81.5,125.1 94.0,119.7 106.5,114.3 119.0,108.9 131.5,103.4 144.0,97.9 156.5,92.4 169.0,86.9 181.5,81.3 194.0,75.7 206.5,70.0 219.0,64.4 231.5,58.7 244.0,53.0 256.5,47.3 269.0,41.5 281.5,35.8 294.0,30.0" fill="none" stroke="#94a3b8" stroke-width="1.4"/><text x="298" y="34.0" font-size="10" font-weight="700" fill="#64748b" text-anchor="start" data-max="0">p97</text><polyline points="44.0,147.8 56.5,143.2 69.0,138.6 81.5,134.0 94.0,129.4 106.5,124.7 119.0,120.0 131.5,115.3 144.0,110.5 156.5,105.7 169.0,100.9 181.5,96.0 194.0,91.2 206.5,86.3 219.0,81.4 231.5,76.5 244.0,71.5 256.5,66.6 269.0,61.6 281.5,56.6 294.0,51.6" fill="none" stroke="#94a3b8" stroke-width="1.4"/><text x="298" y="55.599999999999994" font-size="10" font-weight="700" fill="#64748b" text-anchor="start" data-max="0">p90