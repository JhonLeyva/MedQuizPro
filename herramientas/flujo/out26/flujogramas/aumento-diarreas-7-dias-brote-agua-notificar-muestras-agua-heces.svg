<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Aumento inusual de diarreas por posible agua contaminada: notificar y tomar muestras de agua y heces"><title>Aumento inusual de diarreas por posible agua contaminada: notificar y tomar muestras de agua y heces</title><rect x="0.75" y="0.75" width="998.5" height="1129.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Vigilancia epidemiológica · estudio de brote</tspan></text><rect x="458.8" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="530.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="530.6" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Brote</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Más casos de los esperados en un lugar y tiempo, con una fuente común probable.</tspan><tspan x="58.0" dy="17">Lo primero: notificar y confirmar la causa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Médico de una zona rural</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Aumento inusual de diarreas en 7 días.</tspan><tspan x="640.0" dy="16">Sospecha de transmisión por el agua.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="733.5" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#94a3b8"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="379.0" x2="733.5" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#0f766e"/><rect x="252.4" y="388.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="266.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No</tspan></text><rect x="665.9" y="388.0" width="135.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="733.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí: diarreas en aumento</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Hay más casos de lo esperado (posible brote)?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Vigilancia habitual</tspan></text><text x="266.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Atender y registrar</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="733.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">NOTIFICAR Y TOMAR MUESTRAS</tspan></text><text x="733.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Agua y heces para el laboratorio</tspan><tspan x="733.5" dy="17">Pone en marcha al sistema</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="557.5" width="358.0" height="262.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="567.5" width="177.7" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="581.5" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="316"><tspan x="61.0" dy="0">CURVA DE CASOS (ESQUEMA)</tspan></text><g transform="translate(54.0,595.5) scale(1.0)"><rect x="46" y="12" width="270" height="150" fill="#f8fafc" stroke="#cbd5e1"/><rect x="46" y="138.0" width="270" height="24.0" fill="#bbf7d0" opacity="0.35"/><text x="312" y="150.0" font-size="9.5" font-weight="700" fill="#334155" text-anchor="end" data-max="0">lo esperado</text><polyline points="46.0,150.0 91.0,150.0 136.0,144.0 181.0,126.0 226.0,90.0 271.0,54.0 316.0,30.0" fill="none" stroke="#0f766e" stroke-width="2.5"/><circle cx="316.0" cy="30.0" r="7" fill="#ea580c" stroke="#7c2d12" stroke-width="2" /><text x="326.0" y="20.0" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">hoy</text><text x="326.0" y="20.0" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">hoy</text><text x="181.0" y="188" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">Días</text><text x="4" y="20" font-size="10" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">Casos de diarrea</text><text x="46.0" y="175" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">1</text><text x="181.0" y="175" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">4</text><text x="316.0" y="175" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">7</text><text x="42" y="166.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">0</text><text x="42" y="91.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">12.5</text><text x="42" y="16.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">25</text></g><rect x="420.0" y="557.5" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="575.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="579.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">1</tspan></text><text x="458.0" y="579.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Lo habitual son 2-3 casos al día.</tspan></text><rect x="420.0" y="588.5" width="540.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="438.0" cy="606.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="610.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">2</tspan></text><text x="458.0" y="610.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">En una semana subieron mucho: posible brote.</tspan></text><rect x="420.0" y="619.5" width="540.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="637.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="641.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">3</tspan></text><text x="458.0" y="641.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="458.0" dy="0">Hay que confirmar la fuente: el agua.</tspan></text><text x="40.0" y="859.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="869.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="900.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="872.5" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="892.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Notificar y tomar</tspan><tspan x="303.8" dy="17">muestras</tspan></text><text x="491.2" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Charlas en escuelas</tspan></text><text x="678.8" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Antidiarreicos masivos</tspan></text><text x="866.2" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Construir pozos</tspan></text><rect x="40.0" y="923.5" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="923.5" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="944.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Inmediata?</tspan></text><text x="303.8" y="944.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="944.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Después</tspan></text><text x="678.8" y="944.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="944.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Largo plazo</tspan></text><rect x="40.0" y="869.5" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="981.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1009.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1031.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Acción inmediata: notificar al sistema de vigilancia y coordinar muestras de agua y de heces.</tspan><tspan x="58.0" dy="18">• Luego: definición de caso, búsqueda activa, curva epidémica y medidas de control (agua segura, cloración).</tspan><tspan x="58.0" dy="18">• Charlas, pozos nuevos o antidiarreicos masivos no son lo primero.</tspan></text><text x="58.0" y="1089.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, investigación de brotes; MINSA Perú, vigilancia epidemiológica.</tspan></text></svg>