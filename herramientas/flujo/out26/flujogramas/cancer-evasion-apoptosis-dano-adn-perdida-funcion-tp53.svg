<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1273" viewBox="0 0 1000 1273" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Célula cancerosa que no muere pese al ADN dañado: pérdida de función de TP53"><title>Célula cancerosa que no muere pese al ADN dañado: pérdida de función de TP53</title><rect x="0.75" y="0.75" width="998.5" height="1271.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Patología · bases moleculares del cáncer</tspan></text><rect x="442.7" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="522.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="522.1" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">p53, el guardián del genoma</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ante daño del ADN frena el ciclo para reparar; si no se puede, ordena la apoptosis.</tspan><tspan x="58.0" dy="17">Es el gen más mutado en los cánceres humanos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué cambio explica más directamente que la célula</tspan><tspan x="640.0" dy="16">no muera ante el daño del ADN?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="422.2" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="255.0" x2="422.2" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,283.0 427.2,283.0 422.2,291.0" fill="#94a3b8"/><line x1="422.2" y1="349.0" x2="422.2" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="655.7" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="188.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,407.0 193.7,407.0 188.7,415.0" fill="#94a3b8"/><line x1="655.7" y1="379.0" x2="655.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,407.0 660.7,407.0 655.7,415.0" fill="#94a3b8"/><line x1="655.7" y1="473.0" x2="655.7" y2="518.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="518.5" x2="811.3" y2="518.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="518.5" x2="500.0" y2="547.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,546.5 505.0,546.5 500.0,554.5" fill="#94a3b8"/><line x1="811.3" y1="518.5" x2="811.3" y2="547.5" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,546.5 816.3,546.5 811.3,554.5" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="422.2" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="255.0" x2="422.2" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,283.0 427.2,283.0 422.2,291.0" fill="#0f766e"/><line x1="422.2" y1="349.0" x2="422.2" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="379.0" x2="655.7" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="379.0" x2="655.7" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,407.0 660.7,407.0 655.7,415.0" fill="#0f766e"/><line x1="655.7" y1="473.0" x2="655.7" y2="518.5" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="518.5" x2="811.3" y2="518.5" stroke="#0f766e" stroke-width="3"/><line x1="811.3" y1="518.5" x2="811.3" y2="547.5" stroke="#0f766e" stroke-width="3"/><polygon points="806.3,546.5 816.3,546.5 811.3,554.5" fill="#0f766e"/><rect x="174.5" y="388.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">No</tspan></text><rect x="643.6" y="388.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="655.7" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="655.7" dy="0">Sí</tspan></text><rect x="487.9" y="527.5" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="540.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Sí</tspan></text><rect x="760.3" y="527.5" width="102.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="811.3" y="540.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No: TP53 mutado</tspan></text><polygon points="162.2,320.0 188.2,291.0 656.2,291.0 682.2,320.0 656.2,349.0 188.2,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">¿Hay daño del ADN?</tspan></text><rect x="40.0" y="415.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Ciclo celular normal</tspan></text><text x="188.7" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">División controlada</tspan></text><polygon points="395.7,444.0 421.7,415.0 889.7,415.0 915.7,444.0 889.7,473.0 421.7,473.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="441.7" cy="444.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="449.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="448.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">¿p53 funciona?</tspan></text><rect x="351.3" y="554.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="582.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Reparar o apoptosis</tspan></text><text x="500.0" y="605.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Se frena el ciclo</tspan><tspan x="500.0" dy="17">Si no se repara: muere</tspan></text><rect x="662.7" y="554.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="811.3" y="582.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">LA CÉLULA DAÑADA SOBREVIVE</tspan></text><text x="811.3" y="605.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Evade la apoptosis</tspan><tspan x="811.3" dy="17">Acumula más mutaciones</tspan></text><text x="40.0" y="684.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="696.9" width="351.0" height="282.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="706.9" width="96.5" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="720.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="309"><tspan x="61.0" dy="0">QUÉ HACE P53</tspan></text><g transform="translate(54.0,734.9) scale(0.95)"><path d="M14 30 Q20 42 26 30" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" /><path d="M26 30 Q32 18 38 30" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" /><path d="M38 30 Q44 42 50 30" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" /><path d="M50 30 Q56 18 62 30" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" /><path d="M62 30 Q68 42 74 30" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" /><path d="M74 30 Q80 18 86 30" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" /><text x="50" y="60" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">ADN dañado</text><text x="50" y="60" font-size="10" font-weight="800" fill="#2563eb" text-anchor="middle" data-max="0">ADN dañado</text><line x1="92.0" y1="30.0" x2="122.0" y2="30.0" stroke="#334155" stroke-width="2"/><polygon points="130.0,30.0 121.0,34.3 121.0,25.7" fill="#334155"/><rect x="132" y="14" width="76" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="170.0" y="34.2" font-size="12" font-weight="800" fill="#166534" text-anchor="middle" data-max="0">p53</text><line x1="170.0" y1="46.0" x2="96.8" y2="91.8" stroke="#16a34a" stroke-width="2"/><polygon points="90.0,96.0 95.3,87.5 99.9,94.9" fill="#16a34a"/><line x1="170.0" y1="46.0" x2="243.2" y2="91.8" stroke="#16a34a" stroke-width="2"/><polygon points="250.0,96.0 240.1,94.9 244.7,87.5" fill="#16a34a"/><rect x="30" y="98" width="120" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="90.0" y="111.85" font-size="10.5" font-weight="800" fill="#166534" text-anchor="middle" data-max="0">Frena el ciclo</text><text x="90.0" y="125.5" font-size="10.5" font-weight="800" fill="#166534" text-anchor="middle" data-max="0">y repara</text><rect x="190" y="98" width="120" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="250.0" y="111.85" font-size="10.5" font-weight="800" fill="#166534" text-anchor="middle" data-max="0">Si no se puede:</text><text x="250.0" y="125.5" font-size="10.5" font-weight="800" fill="#166534" text-anchor="middle" data-max="0">apoptosis</text><rect x="60" y="166" width="220" height="46" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="170.0" y="185.85000000000002" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="middle" data-max="0">TP53 mutado: la célula dañada</text><text x="170.0" y="199.50000000000003" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="middle" data-max="0">sigue dividiéndose (cáncer)</text><path d="M140 30 L200 30" fill="none" stroke="#dc2626" stroke-width="0" stroke-linejoin="round" /></g><rect x="413.0" y="696.9" width="547.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="431.0" cy="714.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="718.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">1</tspan></text><text x="451.0" y="718.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">Detecta el daño del ADN.</tspan></text><rect x="413.0" y="727.9" width="547.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="431.0" cy="745.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="749.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">2</tspan></text><text x="451.0" y="749.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">Frena el ciclo o lleva a la apoptosis.</tspan></text><rect x="413.0" y="758.9" width="547.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="431.0" cy="776.9" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="780.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">3</tspan></text><text x="451.0" y="780.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">Sin p53: la célula dañada sigue dividiéndose.</tspan></text><text x="40.0" y="1018.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1028.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1051.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1051.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Más BAX/BAK</tspan></text><text x="491.2" y="1051.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Caspasas activas</tspan></text><text x="678.8" y="1051.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Menos BCL-2</tspan></text><rect x="775.5" y="1031.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="1051.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Pérdida de TP53</tspan></text><rect x="40.0" y="1065.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="1065.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1086.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Efecto</tspan></text><text x="303.8" y="1086.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Más apoptosis</tspan></text><text x="491.2" y="1086.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Más apoptosis</tspan></text><text x="678.8" y="1086.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Más apoptosis</tspan></text><text x="866.2" y="1086.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Evade la apoptosis</tspan></text><rect x="40.0" y="1028.9" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1123.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1151.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1173.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pérdida de función de TP53: la célula dañada no se detiene ni muere.</tspan><tspan x="58.0" dy="18">• Más BAX/BAK o caspasas activas favorecerían la apoptosis (lo contrario).</tspan><tspan x="58.0" dy="18">• En el cáncer BCL-2 suele aumentar, no disminuir.</tspan></text><text x="58.0" y="1231.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Robbins y Cotran, Patología estructural y funcional 10.ª ed..</tspan></text></svg>