-anchor="start" data-max="300"><tspan x="648.0" dy="0">Centro de salud I-3</tspan></text><text x="648.0" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="300"><tspan x="648.0" dy="0">Primer nivel y puerta de entrada.</tspan></text><rect x="630.0" y="356.0" width="330.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="631.0" y="357.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="648.0" y="380.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="300"><tspan x="648.0" dy="0">Hospitales</tspan></text><text x="648.0" y="401.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="300"><tspan x="648.0" dy="0">Son segundo y tercer nivel.</tspan></text><rect x="630.0" y="435.0" width="330.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="631.0" y="436.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="648.0" y="459.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="300"><tspan x="648.0" dy="0">Puesto I-1</tspan></text><text x="648.0" y="480.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="300"><tspan x="648.0" dy="0">Sin médico; aquí sin función de entrada.</tspan></text><text x="40.0" y="737.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="749.0" width="348.0" height="228.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="759.0" width="109.6" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="773.0" font-size="10" font-weight="800" font-style="normal" fill="#0f7