<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1336" viewBox="0 0 1000 1336" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Absceso perianal en diabética: drenaje quirúrgico inmediato"><title>Absceso perianal en diabética: drenaje quirúrgico inmediato</title><rect x="0.75" y="0.75" width="998.5" height="1334.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Patología anal · absceso anorrectal</tspan></text><rect x="408.5" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="459.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="459.1" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Absceso perianal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección de una glándula anal que forma pus junto al ano.</tspan><tspan x="58.0" dy="17">Si hay pus (fluctuación), el tratamiento es drenar; el antibiótico solo no basta.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 52 años con diabetes mal controlada</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">3 días de dolor anal intenso y fiebre de 38,5 °C.</tspan><tspan x="640.0" dy="16">Tumefacción roja, fluctuante y dolorosa en el margen</tspan><tspan x="640.0" dy="16">anal posterior.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="577.8" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="577.8" y1="271.0" x2="577.8" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="572.8,299.0 582.8,299.0 577.8,307.0" fill="#94a3b8"/><line x1="577.8" y1="365.0" x2="577.8" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="395.0" x2="811.3" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="395.0" x2="344.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,423.0 349.3,423.0 344.3,431.0" fill="#94a3b8"/><line x1="811.3" y1="395.0" x2="811.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,423.0 816.3,423.0 811.3,431.0" fill="#94a3b8"/><line x1="344.3" y1="489.0" x2="344.3" y2="551.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="551.5" x2="500.0" y2="551.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="551.5" x2="188.7" y2="580.5" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,579.5 193.7,579.5 188.7,587.5" fill="#94a3b8"/><line x1="500.0" y1="551.5" x2="500.0" y2="580.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,579.5 505.0,579.5 500.0,587.5" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="577.8" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="577.8" y1="271.0" x2="577.8" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="572.8,299.0 582.8,299.0 577.8,307.0" fill="#0f766e"/><line x1="577.8" y1="365.0" x2="577.8" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="395.0" x2="577.8" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="395.0" x2="344.3" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,423.0 349.3,423.0 344.3,431.0" fill="#0f766e"/><line x1="344.3" y1="489.0" x2="344.3" y2="551.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="551.5" x2="344.3" y2="551.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="551.5" x2="188.7" y2="580.5" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,579.5 193.7,579.5 188.7,587.5" fill="#0f766e"/><rect x="332.3" y="404.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="344.3" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="344.3" dy="0">Sí</tspan></text><rect x="797.2" y="404.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><rect x="176.6" y="560.5" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="573.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Sí</tspan></text><rect x="485.9" y="560.5" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="573.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">No</tspan></text><polygon points="317.8,336.0 343.8,307.0 811.8,307.0 837.8,336.0 811.8,365.0 343.8,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="363.8" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="363.8" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="363.8" dy="0">?</tspan></text><text x="596.8" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="596.8" dy="0">¿La tumoración perianal es fluctuante (hay pus)?</tspan></text><polygon points="84.3,460.0 110.3,431.0 578.3,431.0 604.3,460.0 578.3,489.0 110.3,489.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="130.3" cy="460.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="130.3" y="465.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="130.3" dy="0">?</tspan></text><text x="363.3" y="464.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="363.3" dy="0">¿Diabetes, inmunosupresión o signos sistémicos?</tspan></text><rect x="40.0" y="587.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="615.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">DRENAJE INMEDIATO + HOSPITALIZAR</tspan></text><text x="188.7" y="638.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Antibiótico EV y control de la glucemia</tspan><tspan x="188.7" dy="17">Vigilar necrosis (Fournier)</tspan></text><rect x="351.3" y="587.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="624.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Drenaje en consultorio</tspan></text><text x="500.0" y="647.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Alta con analgesia y baños de asiento</tspan></text><rect x="662.7" y="431.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Celulitis sin colección</tspan></text><text x="811.3" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Antibiótico y control en 24-48 h</tspan><tspan x="811.3" dy="17">Eco si hay duda</tspan></text><text x="40.0" y="717.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="729.9" width="328.0" height="312.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="739.9" width="158.9" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="753.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="286"><tspan x="61.0" dy="0">LO QUE SE VE AL EXAMEN</tspan></text><g data-box="54.0 767.9 300.0 250.0"><g transform="translate(54.0,767.9) scale(1.0)"><path d="M20 30 C60 10 130 16 150 40 C170 16 240 10 280 30 C300 90 300 190 270 230 C230 250 170 244 150 214 C130 244 70 250 30 230 C0 190 0 90 20 30 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="150" cy="128" r="20" fill="#be185d" stroke="#831843" stroke-width="2" /><circle cx="150" cy="128" r="7" fill="#500724" stroke="none" stroke-width="0" /><line x1="159.0" y1="128.0" x2="169.0" y2="128.0" stroke="#831843" stroke-width="1.2"/><line x1="157.8" y1="132.5" x2="166.5" y2="137.5" stroke="#831843" stroke-width="1.2"/><line x1="154.5" y1="135.8" x2="159.5" y2="144.5" stroke="#831843" stroke-width="1.2"/><line x1="150.0" y1="137.0" x2="150.0" y2="147.0" stroke="#831843" stroke-width="1.2"/><line x1="145.5" y1="135.8" x2="140.5" y2="144.5" stroke="#831843" stroke-width="1.2"/><line x1="142.2" y1="132.5" x2="133.5" y2="137.5" stroke="#831843" stroke-width="1.2"/><line x1="141.0" y1="128.0" x2="131.0" y2="128.0" stroke="#831843" stroke-width="1.2"/><line x1="142.2" y1="123.5" x2="133.5" y2="118.5" stroke="#831843" stroke-width="1.2"/><line x1="145.5" y1="120.2" x2="140.5" y2="111.5" stroke="#831843" stroke-width="1.2"/><line x1="150.0" y1="119.0" x2="150.0" y2="109.0" stroke="#831843" stroke-width="1.2"/><line x1="154.5" y1="120.2" x2="159.5" y2="111.5" stroke="#831843" stroke-width="1.2"/><line x1="157.8" y1="123.5" x2="166.5" y2="118.5" stroke="#831843" stroke-width="1.2"/><text x="150" y="58" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">12 · anterior</text><text x="112" y="206" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">6 · posterior</text><ellipse cx="150" cy="174" rx="32" ry="20" fill="#f87171" stroke="#b91c1c" stroke-width="2" opacity="0.9"/><ellipse cx="150" cy="172" rx="14" ry="8" fill="#fde68a" stroke="#ca8a04" stroke-width="1.2" /><text x="150" y="226" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Roja, caliente y fluctuante (pus)</text><text x="150" y="226" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Roja, caliente y fluctuante (pus)</text><line x1="120" y1="172" x2="180" y2="172" stroke="#111827" stroke-width="2" stroke-dasharray="5 3"/><text x="150" y="240" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">- - - incisión y drenaje</text><text x="150" y="240" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">- - - incisión y drenaje</text></g></g><rect x="390.0" y="729.9" width="570.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="408.0" cy="745.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="749.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">1</tspan></text><text x="426.0" y="749.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Tumoración roja, caliente y fluctuante en el margen posterior: es pus.</tspan></text><rect x="390.0" y="767.9" width="570.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="783.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="787.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">2</tspan></text><text x="426.0" y="787.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Línea discontinua: la incisión de drenaje.</tspan></text><rect x="390.0" y="805.9" width="570.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="821.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="825.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">3</tspan></text><text x="426.0" y="825.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">La diabetes mal controlada puede hacer que la infección se extienda rápido.</tspan></text><text x="40.0" y="1081.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1091.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1114.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1114.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Ecografía primero</tspan></text><text x="491.2" y="1114.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">ATB EV y glucemia</tspan></text><text x="678.8" y="1114.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Observar 48-72 h</tspan></text><rect x="775.5" y="1094.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="1114.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Drenaje + hospitalizar</tspan></text><rect x="40.0" y="1128.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="1128.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1149.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1149.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Retrasa el drenaje</tspan></text><text x="491.2" y="1149.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">El pus no se cura sin drenar</tspan></text><text x="678.8" y="1149.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Peligroso en diabética</tspan></text><text x="866.2" y="1149.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Ninguno</tspan></text><rect x="40.0" y="1091.9" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1186.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1214.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1236.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Absceso perianal fluctuante: incisión y drenaje de inmediato, sin esperar imágenes.</tspan><tspan x="58.0" dy="18">• Diabética o inmunosuprimida: hospitalizar, controlar la glucosa y dar antibiótico (riesgo de Fournier).</tspan><tspan x="58.0" dy="18">• Crepitación o celulitis extensa: pensar en infección necrotizante y desbridar.</tspan></text><text x="58.0" y="1294.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASCRS, guía de abscesos y fístulas anorrectales (2022).</tspan></text></svg>