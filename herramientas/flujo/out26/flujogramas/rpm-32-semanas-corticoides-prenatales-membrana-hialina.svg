<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1031" viewBox="0 0 1000 1031" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Corticoides prenatales en RPM de 32 semanas: menos membrana hialina"><title>Corticoides prenatales en RPM de 32 semanas: menos membrana hialina</title><rect x="0.75" y="0.75" width="998.5" height="1029.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parto pretérmino · maduración pulmonar fetal</tspan></text><rect x="470.0" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="557.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="557.2" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Corticoides prenatales</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Betametasona 12 mg IM, 2 dosis cada 24 h (o dexametasona).</tspan><tspan x="58.0" dy="17">Indicados entre las 24 y 34 semanas si hay riesgo de parto pretérmino.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Secundigesta de 32 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Rotura prematura de membranas de 8 h.</tspan><tspan x="640.0" dy="16">Sin corioamnionitis ni trabajo de parto.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO ACTÚA EL CORTICOIDE EN EL PULMÓN FETAL</tspan></text><rect x="40.0" y="269.0" width="388.0" height="324.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="164.2" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">ALVEOLO DEL PREMATURO</tspan></text><g transform="translate(54.0,307.0) scale(1.0)"><rect x="6" y="4" width="168" height="182" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><path d="M50 90 C60 70 120 70 130 90 C120 104 60 104 50 90 Z" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" stroke-linejoin="round" /><text x="90" y="164" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Colapsa: membrana hialina</text><text x="90" y="164" font-size="10.5" font-weight="800" fill="#b91c1c" text-anchor="middle" data-max="0">Colapsa: membrana hialina</text><text x="90" y="24" font-size="11.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Sin surfactante</text><text x="90" y="24" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Sin surfactante</text><rect x="186" y="4" width="168" height="182" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><circle cx="270" cy="90" r="52" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" /><circle cx="270" cy="90" r="48" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="3 3"/><ellipse cx="226" cy="118" rx="10" ry="7" fill="#fde68a" stroke="#ca8a04" stroke-width="1.2" /><text x="270" y="164" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Abierto: se ventila</text><text x="270" y="164" font-size="10.5" font-weight="800" fill="#0369a1" text-anchor="middle" data-max="0">Abierto: se ventila</text><text x="310" y="34" font-size="10" font-weight="800" fill="#a16207" text-anchor="middle" data-max="0">surfactante</text><text x="270" y="24" font-size="11.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Con surfactante</text><text x="270" y="24" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Con surfactante</text><text x="270" y="130" font-size="9.5" font-weight="800" fill="#a16207" text-anchor="start" data-max="0">neumocito II</text></g><text x="54.0" y="513.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="360"><tspan x="54.0" dy="0">Sin surfactante el alveolo colapsa; con surfactante queda abierto.</tspan></text><ellipse cx="702.0" cy="426.0" rx="166.0" ry="120.0" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><polygon points="826.7,346.4 810.4,343.3 818.6,332.0" fill="#0f766e"/><polygon points="812.1,516.1 820.1,501.7 828.3,513.0" fill="#0f766e"/><polygon points="577.3,505.6 593.6,508.7 585.4,520.0" fill="#0f766e"/><polygon points="591.9,335.9 583.9,350.3 575.7,339.0" fill="#0f766e"/><text x="702.0" y="430.0" font-size="12.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="140"><tspan x="702.0" dy="0">Maduración pulmonar</tspan></text><rect x="614.0" y="279.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="616.0" cy="281.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="616.0" y="285.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="616.0" dy="0">1</tspan></text><text x="702.0" y="301.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="702.0" dy="0">Betametasona a la madre</tspan></text><text x="702.0" y="317.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="702.0" dy="0">cruza la placenta</tspan></text><rect x="780.0" y="399.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="782.0" cy="401.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="782.0" y="405.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="782.0" dy="0">2</tspan></text><text x="868.0" y="421.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="868.0" dy="0">Neumocito tipo II</tspan></text><text x="868.0" y="437.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="868.0" dy="0">madura y produce</tspan></text><rect x="614.0" y="519.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="616.0" cy="521.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="616.0" y="525.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="616.0" dy="0">3</tspan></text><text x="702.0" y="541.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="702.0" dy="0">Surfactante</tspan></text><text x="702.0" y="557.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="702.0" dy="0">baja la tensión superficial</tspan></text><rect x="448.0" y="399.0" width="176.0" height="54.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><circle cx="450.0" cy="401.0" r="11" fill="#7c2d12" stroke="none" stroke-width="0"/><text x="450.0" y="405.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="450.0" dy="0">4</tspan></text><text x="536.0" y="421.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="156"><tspan x="536.0" dy="0">Alveolo abierto</tspan></text><text x="536.0" y="437.0" font-size="10.5" font-weight="500" font-style="normal" fill="#fff7ed" text-anchor="middle" data-max="156"><tspan x="536.0" dy="0">menos membrana hialina</tspan></text><rect x="490.6" y="442.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="536.0" y="457.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="536.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="625.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ NO HACE</tspan></text><rect x="40.0" y="635.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="636.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="659.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Malformaciones renales</tspan></text><text x="58.0" y="680.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">No las previene.</tspan></text><rect x="351.3" y="635.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="636.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="659.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Restricción del crecimiento</tspan></text><text x="369.3" y="680.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No la corrige.</tspan></text><rect x="662.7" y="635.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="636.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="659.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Hipoplasia pulmonar</tspan></text><text x="680.7" y="680.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Depende del oligohidramnios temprano, no del</tspan><tspan x="680.7" dy="16">surfactante.</tspan></text><text x="40.0" y="760.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="770.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="801.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="773.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="801.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Menos membrana hialina</tspan></text><text x="491.2" y="801.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Malformaciones renales</tspan></text><text x="678.8" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Restricción del</tspan><tspan x="678.8" dy="17">crecimiento</tspan></text><text x="866.2" y="801.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Hipoplasia pulmonar</tspan></text><rect x="40.0" y="824.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="824.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="845.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Demostrado?</tspan></text><text x="303.8" y="845.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="770.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="882.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="910.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="932.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Beneficio principal: menos síndrome de dificultad respiratoria (membrana hialina).</tspan><tspan x="58.0" dy="18">• También reducen hemorragia intraventricular, enterocolitis necrotizante y muerte neonatal.</tspan><tspan x="58.0" dy="18">• No evitan malformaciones, restricción del crecimiento ni la hipoplasia pulmonar por oligohidramnios.</tspan></text><text x="58.0" y="990.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletins n.º 713 (2017, reafirmado); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>