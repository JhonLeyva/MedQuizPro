<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Raquitismo carencial: sin calcitriol no se absorbe calcio ni fósforo"><title>Raquitismo carencial: sin calcitriol no se absorbe calcio ni fósforo</title><rect x="0.75" y="0.75" width="998.5" height="1128.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nutrición · raquitismo por déficit de vitamina D</tspan></text><rect x="476.1" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="532.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="532.6" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Raquitismo nutricional</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Falta vitamina D: el intestino no absorbe calcio ni fósforo.</tspan><tspan x="58.0" dy="17">El cartílago de crecimiento no se mineraliza: muñecas anchas, rosario costal, piernas</tspan><tspan x="58.0" dy="17">arqueadas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 15 meses, poca exposición solar</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactancia exclusiva hasta los 10 meses; retraso de la</tspan><tspan x="640.0" dy="16">marcha.</tspan><tspan x="640.0" dy="16">Muñecas anchas, rosario costal, genu varo; Rx:</tspan><tspan x="640.0" dy="16">metáfisis en copa.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ FALLA EN LA VÍA DE LA VITAMINA D</tspan></text><rect x="40.0" y="301.0" width="308.0" height="407.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="119.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">EL NIÑO DEL CASO</tspan></text><g transform="translate(94.0,339.0) scale(0.86)"><circle cx="110" cy="56" r="42" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="95" cy="52" r="3.5" fill="#334155" stroke="none" stroke-width="0" /><circle cx="125" cy="52" r="3.5" fill="#334155" stroke="none" stroke-width="0" /><path d="M100 74 Q110 80 120 74" fill="none" stroke="#9a6b52" stroke-width="2"/><rect x="102" y="96" width="16" height="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><path d="M74.0 106 H146.0 L150.0 170 H70.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70.0 170 H150.0 C154 206 148.0 222 144.0 232 H76.0 C72.0 222 66 206 70.0 170 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M74.0 110 L50.0 120 L40.0 214 L56.0 216 L70.0 150 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M146.0 110 L170.0 120 L180.0 214 L164.0 216 L150.0 150 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="48.0" cy="224" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="172.0" cy="224" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M80 232 L106 232 Q86 300 104 364 L84 364 Q56 300 80 232 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M114 232 L140 232 Q164 300 136 364 L116 364 Q134 300 114 232 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="92" cy="370" rx="14" ry="6" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><ellipse cx="128" cy="370" rx="14" ry="6" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="40" cy="222" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="40" y="226" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="110" cy="136" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="110" y="140" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><circle cx="64" cy="300" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="64" y="304" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text></g><text x="54.0" y="685.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="54.0" dy="0">1 muñecas anchas, 2 rosario costal, 3 genu varo.</tspan></text><ellipse cx="662.0" cy="458.0" rx="206.0" ry="120.0" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><polygon points="791.4,364.4 774.8,365.0 780.3,352.1" fill="#0f766e"/><polygon points="853.5,502.9 854.7,486.4 867.0,493.3" fill="#0f766e"/><polygon points="653.0,578.0 668.0,571.0 668.0,585.0" fill="#0f766e"/><polygon points="461.7,487.2 475.1,496.9 462.9,503.7" fill="#0f766e"/><polygon points="549.2,357.4 538.1,369.7 532.7,356.8" fill="#0f766e"/><text x="662.0" y="462.0" font-size="12.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="220"><tspan x="662.0" dy="0">Vitamina D</tspan></text><rect x="574.0" y="311.0" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="576.0" cy="313.0" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="576.0" y="317.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="576.0" dy="0">1</tspan></text><text x="662.0" y="333.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">Sol en la piel</tspan></text><text x="662.0" y="349.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="662.0" dy="0">forma vitamina D3</tspan></text><rect x="769.9" y="393.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="771.9" cy="395.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="771.9" y="399.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="771.9" dy="0">2</tspan></text><text x="857.9" y="415.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">Hígado</tspan></text><text x="857.9" y="431.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="857.9" dy="0">25-OH vitamina D</tspan></text><rect x="695.1" y="528.1" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="697.1" cy="530.1" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="697.1" y="534.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="697.1" dy="0">3</tspan></text><text x="783.1" y="550.1" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">Riñón</tspan></text><text x="783.1" y="566.1" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="783.1" dy="0">1,25-(OH)₂ D: calcitriol</tspan></text><rect x="452.9" y="528.1" width="176.0" height="54.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><circle cx="454.9" cy="530.1" r="11" fill="#7c2d12" stroke="none" stroke-width="0"/><text x="454.9" y="534.1" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="454.9" dy="0">4</tspan></text><text x="540.9" y="550.1" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">Intestino</tspan></text><text x="540.9" y="566.1" font-size="10.5" font-weight="500" font-style="normal" fill="#fff7ed" text-anchor="middle" data-max="156"><tspan x="540.9" dy="0">absorbe calcio y fósforo</tspan></text><rect x="495.5" y="571.1" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="540.9" y="586.1" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="540.9" dy="0">◆ ESTE CASO</tspan></text><rect x="378.1" y="393.9" width="176.0" height="54.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/><circle cx="380.1" cy="395.9" r="11" fill="#134e4a" stroke="none" stroke-width="0"/><text x="380.1" y="399.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="380.1" dy="0">5</tspan></text><text x="466.1" y="415.9" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">Hueso</tspan></text><text x="466.1" y="431.9" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="466.1" dy="0">mineraliza el cartílago</tspan></text><text x="40.0" y="740.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="750.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="751.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="774.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Toxicidad por vitamina D</tspan></text><text x="58.0" y="795.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Daría hipercalcemia, no raquitismo.</tspan></text><rect x="351.3" y="750.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="751.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="774.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Más reabsorción renal de fósforo</tspan></text><text x="369.3" y="795.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Al revés: el fósforo se pierde.</tspan></text><rect x="662.7" y="750.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="751.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="774.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">PTH alta con hipercalcemia</tspan></text><text x="680.7" y="795.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">La PTH sube, pero el calcio no está alto.</tspan></text><text x="40.0" y="859.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="869.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="900.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="900.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Toxicidad por 25-OH D</tspan></text><text x="491.2" y="891.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Más reabsorción de</tspan><tspan x="491.2" dy="17">fósforo</tspan></text><text x="678.8" y="900.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">PTH con hipercalcemia</tspan></text><rect x="775.5" y="872.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="891.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Mala mineralización por</tspan><tspan x="866.2" dy="17">poco calcitriol</tspan></text><rect x="40.0" y="923.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="923.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="944.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Explica el cuadro?</tspan></text><text x="303.8" y="944.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="944.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="944.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="944.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="869.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="981.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1009.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1031.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mecanismo: poco calcitriol (1,25-(OH)₂ vitamina D) → menos absorción intestinal de calcio y fósforo → mala mineralización.</tspan><tspan x="58.0" dy="18">• La PTH sube para mantener el calcio (calcio normal o bajo, fósforo bajo, fosfatasa alcalina alta).</tspan><tspan x="58.0" dy="18">• Prevención: vitamina D 400 UI/día en lactantes con lactancia exclusiva.</tspan></text><text x="58.0" y="1089.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); Consenso global de raquitismo nutricional (2016).</tspan></text></svg>