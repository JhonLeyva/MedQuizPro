<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Disentería en niña con desnutrición y cardiopatía: coprocultivo e iniciar antibiótico"><title>Disentería en niña con desnutrición y cardiopatía: coprocultivo e iniciar antibiótico</title><rect x="0.75" y="0.75" width="998.5" height="1298.9" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedad diarreica aguda · disentería</tspan></text><rect x="436.5" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="493.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="493.0" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Disentería (diarrea con sangre)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Casi siempre bacteriana e invasiva: Shigella es la principal en niños.</tspan><tspan x="58.0" dy="17">Se trata con antibiótico; en el niño de riesgo no se espera el cultivo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Anita, 15 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cardiopatía congénita y desnutrición moderada; 3 días</tspan><tspan x="640.0" dy="16">de heces con moco, 2 con sangre.</tspan><tspan x="640.0" dy="16">Hidratada, conectada; abdomen globuloso con ruidos</tspan><tspan x="640.0" dy="16">aumentados, no doloroso.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="422.2" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="287.0" x2="422.2" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,315.0 427.2,315.0 422.2,323.0" fill="#94a3b8"/><line x1="422.2" y1="381.0" x2="422.2" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="411.0" x2="655.7" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="411.0" x2="188.7" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,439.0 193.7,439.0 188.7,447.0" fill="#94a3b8"/><line x1="655.7" y1="411.0" x2="655.7" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,439.0 660.7,439.0 655.7,447.0" fill="#94a3b8"/><line x1="655.7" y1="505.0" x2="655.7" y2="550.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="550.5" x2="811.3" y2="550.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="550.5" x2="500.0" y2="579.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,578.5 505.0,578.5 500.0,586.5" fill="#94a3b8"/><line x1="811.3" y1="550.5" x2="811.3" y2="579.5" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,578.5 816.3,578.5 811.3,586.5" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="422.2" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="287.0" x2="422.2" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,315.0 427.2,315.0 422.2,323.0" fill="#0f766e"/><line x1="422.2" y1="381.0" x2="422.2" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="411.0" x2="655.7" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="411.0" x2="655.7" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,439.0 660.7,439.0 655.7,447.0" fill="#0f766e"/><line x1="655.7" y1="505.0" x2="655.7" y2="550.5" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="550.5" x2="811.3" y2="550.5" stroke="#0f766e" stroke-width="3"/><line x1="811.3" y1="550.5" x2="811.3" y2="579.5" stroke="#0f766e" stroke-width="3"/><polygon points="806.3,578.5 816.3,578.5 811.3,586.5" fill="#0f766e"/><rect x="174.5" y="420.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">No</tspan></text><rect x="643.6" y="420.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="655.7" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="655.7" dy="0">Sí</tspan></text><rect x="485.9" y="559.5" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="572.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">No</tspan></text><rect x="799.3" y="559.5" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="811.3" y="572.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Sí</tspan></text><polygon points="162.2,352.0 188.2,323.0 656.2,323.0 682.2,352.0 656.2,381.0 188.2,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">¿Hay sangre en las heces (disentería)?</tspan></text><rect x="40.0" y="447.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Diarrea acuosa</tspan></text><text x="188.7" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Hidratación y zinc; sin antibiótico</tspan></text><polygon points="395.7,476.0 421.7,447.0 889.7,447.0 915.7,476.0 889.7,505.0 421.7,505.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="441.7" cy="476.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="481.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="480.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">¿Desnutrición, cardiopatía u otro factor de riesgo?</tspan></text><rect x="351.3" y="586.5" width="297.3" height="108.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="632.5" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Antibiótico oral empírico</tspan></text><text x="500.0" y="655.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Control a las 48 h</tspan></text><rect x="662.7" y="586.5" width="297.3" height="108.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="811.3" y="614.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">COPROCULTIVO E INICIAR</tspan><tspan x="811.3" dy="18.5">ANTIBIÓTICO</tspan></text><text x="811.3" y="656.2" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">No esperar el resultado</tspan><tspan x="811.3" dy="17">Ajustar con el antibiograma</tspan></text><text x="40.0" y="735.4" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="747.4" width="308.0" height="242.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="757.4" width="257.6" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="771.4" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="266"><tspan x="61.0" dy="0">GERMEN MÁS PROBABLE (GRAM, ESQUEMA)</tspan></text><g transform="translate(74.0,785.4) scale(1.1)"><circle cx="110" cy="80" r="76" fill="#fff1f2" stroke="#94a3b8" stroke-width="3" /><rect x="84" y="48" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(71 84 48)"/><rect x="75" y="45" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(72 75 45)"/><rect x="152" y="104" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(138 152 104)"/><rect x="82" y="83" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(50 82 83)"/><rect x="77" y="48" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(39 77 48)"/><rect x="153" y="106" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(145 153 106)"/><rect x="140" y="55" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(56 140 55)"/><rect x="123" y="99" width="13" height="5" rx="2.5" fill="#e11d48" transform="rotate(154 123 99)"/></g><rect x="370.0" y="747.4" width="590.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="388.0" cy="765.4" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="769.4" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">1</tspan></text><text x="408.0" y="769.4" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="408.0" dy="0">Bacilos gramnegativos: Shigella, Campylobacter, E. coli invasiva.</tspan></text><rect x="370.0" y="778.4" width="590.0" height="25.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="388.0" cy="796.4" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="800.4" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">2</tspan></text><text x="408.0" y="800.4" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="408.0" dy="0">Invaden la mucosa: moco y sangre en las heces.</tspan></text><rect x="370.0" y="809.4" width="590.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="388.0" cy="827.4" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="831.4" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">3</tspan></text><text x="408.0" y="831.4" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="546"><tspan x="408.0" dy="0">Desnutrición y cardiopatía: más riesgo de complicarse.</tspan></text><text x="40.0" y="1029.4" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1039.4" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1070.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1042.4" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="1061.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Coprocultivo e iniciar</tspan><tspan x="303.8" dy="17">antibiótico</tspan></text><text x="491.2" y="1070.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Coprocultivo y esperar</tspan></text><text x="678.8" y="1070.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Hemocultivo y esperar</tspan></text><text x="866.2" y="1061.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Hemocultivo e iniciar</tspan><tspan x="866.2" dy="17">antibiótico</tspan></text><rect x="40.0" y="1093.4" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1093.4" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1114.4" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1114.4" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Ninguno</tspan></text><text x="491.2" y="1114.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Retrasa el tratamiento</tspan></text><text x="678.8" y="1114.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Estudio equivocado y retrasa</tspan></text><text x="866.2" y="1114.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Estudio equivocado</tspan></text><rect x="40.0" y="1039.4" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1151.4" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1179.4" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1201.4" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Diarrea con sangre = disentería: antibiótico empírico (ciprofloxacino o azitromicina según la norma).</tspan><tspan x="58.0" dy="18">• Con desnutrición o cardiopatía: tomar coprocultivo e iniciar el antibiótico sin esperar el resultado.</tspan><tspan x="58.0" dy="18">• El hemocultivo no es el estudio para disentería en una niña estable.</tspan></text><text x="58.0" y="1259.4" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, guía de enfermedad diarreica aguda en niños; OMS.</tspan></text></svg>