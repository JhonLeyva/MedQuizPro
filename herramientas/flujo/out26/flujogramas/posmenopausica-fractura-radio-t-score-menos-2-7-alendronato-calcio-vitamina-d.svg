<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1166" viewBox="0 0 1000 1166" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Osteoporosis con fractura por fragilidad y T -2,7: alendronato semanal con calcio y vitamina D"><title>Osteoporosis con fractura por fragilidad y T -2,7: alendronato semanal con calcio y vitamina D</title><rect x="0.75" y="0.75" width="998.5" height="1164.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Metabolismo óseo · osteoporosis</tspan></text><rect x="397.5" y="32.0" width="242.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="518.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="226"><tspan x="518.7" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Osteoporosis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diagnóstico: T-score ≤ -2,5 o una fractura por fragilidad.</tspan><tspan x="58.0" dy="17">Con fractura previa el riesgo de otra es alto: necesita fármaco.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 67 años posmenopáusica</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fractura de radio distal al caer de su altura hace 6</tspan><tspan x="640.0" dy="16">meses.</tspan><tspan x="640.0" dy="16">DXA: T -2,7 en cuello femoral; sin ERC ni corticoides;</tspan><tspan x="640.0" dy="16">pocos lácteos y poco sol.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DENSIDAD ÓSEA Y CONDUCTA</tspan></text><rect x="70.0" y="311.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="562.5" width="24.0" height="74.5" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="599.8" x2="130.0" y2="599.8" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="563.5" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="585.5" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Normal</tspan></text><text x="240.0" y="585.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">T ≥ -1</tspan></text><text x="144.0" y="606.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Hábitos saludables</tspan></text><rect x="75.0" y="480.0" width="24.0" height="74.5" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="517.2" x2="130.0" y2="517.2" stroke="#f59e0b" stroke-width="2"/><rect x="130.0" y="481.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="503.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Osteopenia</tspan></text><text x="240.0" y="503.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">T -1 a -2,5</tspan></text><text x="144.0" y="524.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Según riesgo (FRAX)</tspan></text><rect x="75.0" y="397.5" width="24.0" height="74.5" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="434.8" x2="130.0" y2="434.8" stroke="#f97316" stroke-width="2"/><rect x="130.0" y="398.5" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="420.5" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Osteoporosis</tspan></text><text x="240.0" y="420.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">T ≤ -2,5</tspan></text><text x="144.0" y="441.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Tratar</tspan></text><rect x="75.0" y="315.0" width="24.0" height="74.5" rx="8" fill="#e11d48" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="352.2" x2="130.0" y2="352.2" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="316.0" width="330.0" height="72.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="338.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Grave</tspan></text><text x="240.0" y="338.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">T ≤ -2,5 + fractura</tspan></text><text x="144.0" y="359.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Tratar ya</tspan></text><rect x="354.6" y="305.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="320.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><text x="470.0" y="315.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">QUÉ SE HACE</tspan></text><rect x="470.0" y="329.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="371.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="376.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="364.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Alendronato 70 mg semanal</tspan></text><text x="528.0" y="387.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">En ayunas, de pie 30 minutos</tspan></text><rect x="844.6" y="318.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="333.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><line x1="498.0" y1="415.0" x2="498.0" y2="428.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,427.0 503.0,427.0 498.0,435.0" fill="#0f766e"/><rect x="470.0" y="437.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="479.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="484.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="472.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Calcio y vitamina D</tspan></text><text x="528.0" y="495.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Siempre junto al fármaco</tspan></text><line x1="498.0" y1="523.0" x2="498.0" y2="536.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,535.0 503.0,535.0 498.0,543.0" fill="#0f766e"/><rect x="470.0" y="545.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="587.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="592.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="580.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Prevenir caídas</tspan></text><text x="528.0" y="603.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Ejercicio, casa segura</tspan></text><text x="40.0" y="681.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="693.0" width="390.0" height="162.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="703.0" width="164.0" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="717.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="348"><tspan x="61.0" dy="0">DENSITOMETRÍA DEL CASO</tspan></text><g data-box="54.0 731.0 362.0 100.0"><g transform="translate(54.0,731.0) scale(0.95)"><rect x="20" y="30" width="136" height="26" fill="#bbf7d0"/><rect x="156" y="30" width="102" height="26" fill="#fde68a"/><rect x="258" y="30" width="102" height="26" fill="#fecaca"/><text x="88.0" y="72" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">normal</text><text x="88.0" y="72" font-size="10.5" font-weight="800" fill="#15803d" text-anchor="middle" data-max="0">normal</text><text x="207.0" y="72" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">osteopenia</text><text x="207.0" y="72" font-size="10.5" font-weight="800" fill="#a16207" text-anchor="middle" data-max="0">osteopenia</text><text x="309.0" y="72" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">osteoporosis</text><text x="309.0" y="72" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle" data-max="0">osteoporosis</text><text x="20.0" y="92" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">1</text><text x="88.0" y="92" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">0</text><text x="156.0" y="92" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">-1</text><text x="258.0" y="92" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">-2,5</text><text x="360.0" y="92" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">-4</text><path d="M272 18 L272 64" fill="none" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" /><text x="271.6" y="12" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">T = -2,7</text><text x="271.6" y="12" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">T = -2,7</text></g></g><rect x="452.0" y="693.0" width="508.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="470.0" cy="708.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="470.0" y="712.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="470.0" dy="0">1</tspan></text><text x="488.0" y="713.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="464"><tspan x="488.0" dy="0">T -2,7: rango de osteoporosis.</tspan></text><rect x="452.0" y="731.0" width="508.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="470.0" cy="746.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="470.0" y="750.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="470.0" dy="0">2</tspan></text><text x="488.0" y="751.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="464"><tspan x="488.0" dy="0">Más la fractura de radio por fragilidad.</tspan></text><rect x="452.0" y="769.0" width="508.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="470.0" cy="784.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="470.0" y="788.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="470.0" dy="0">3</tspan></text><text x="488.0" y="789.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="464"><tspan x="488.0" dy="0">Riesgo alto de una nueva fractura.</tspan></text><text x="40.0" y="895.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="905.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="936.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="908.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="927.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Alendronato + calcio y</tspan><tspan x="303.8" dy="17">vitamina D</tspan></text><text x="491.2" y="927.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Calcio, vitamina D y</tspan><tspan x="491.2" dy="17">ejercicio</tspan></text><text x="678.8" y="927.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Zoledrónico sin calcio ni</tspan><tspan x="678.8" dy="17">vitamina D</tspan></text><text x="866.2" y="936.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">DXA anual y esperar</tspan></text><rect x="40.0" y="959.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="959.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="980.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="980.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Ninguno</tspan></text><text x="491.2" y="980.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No basta con fractura previa</tspan></text><text x="678.8" y="980.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Falta calcio y vitamina D</tspan></text><text x="866.2" y="980.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Retrasa el tratamiento</tspan></text><rect x="40.0" y="905.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1017.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1045.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1067.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Osteoporosis con fractura: bifosfonato (alendronato 70 mg semanal) + calcio y vitamina D.</tspan><tspan x="58.0" dy="18">• Calcio y vitamina D solos no bastan; el ácido zoledrónico también necesita calcio y vitamina D.</tspan><tspan x="58.0" dy="18">• Prevenir caídas y revisar a los 3-5 años.</tspan></text><text x="58.0" y="1125.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AACE (2020); Endocrine Society (2019); NOF.</tspan></text></svg>