<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1195" viewBox="0 0 1000 1195" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cáncer gástrico temprano: la ecoendoscopía mide la profundidad"><title>Cáncer gástrico temprano: la ecoendoscopía mide la profundidad</title><rect x="0.75" y="0.75" width="998.5" height="1193.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cáncer gástrico · estadificación local</tspan></text><rect x="419.4" y="32.0" width="180.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="509.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="164"><tspan x="509.6" dy="0">GASTROENTEROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="168.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cáncer gástrico temprano</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Limitado a mucosa o submucosa (T1), con o sin ganglios.</tspan><tspan x="58.0" dy="17">Si solo toca la mucosa puede resecarse por endoscopía; si invade más, cirugía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="168.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="166.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 62 años con lesión superficial en</tspan><tspan x="640.0" dy="17">cuerpo</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Biopsia: adenocarcinoma bien diferenciado en</tspan><tspan x="640.0" dy="16">mucosa/submucosa.</tspan><tspan x="640.0" dy="16">Se pide ecoendoscopía (EUS).</tspan></text><rect x="640.0" y="229.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="242.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="242.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="290.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ESTUDIO RESPONDE QUÉ</tspan></text><polygon points="220,338.0 260,302.0 740,302.0 780,338.0 740,374.0 260,374.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="338.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="343.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="334.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">¿Qué hay que saber para decidir entre endoscopía o</tspan><tspan x="525.0" dy="18">cirugía?</tspan></text><line x1="500.0" y1="374.0" x2="500.0" y2="394.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="394.0" x2="662.0" y2="394.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="394.0" x2="190.0" y2="423.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,422.0 195.0,422.0 190.0,430.0" fill="#0f766e"/><line x1="662.0" y1="394.0" x2="662.0" y2="423.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,422.0 667.0,422.0 662.0,430.0" fill="#ea580c"/><rect x="119.9" y="402.0" width="140.3" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="416.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">Metástasis a distancia</tspan></text><rect x="588.9" y="402.0" width="146.1" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="416.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Profundidad: este caso</tspan></text><rect x="40.0" y="430.0" width="300.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="431.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="454.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">TC de tórax, abdomen y pelvis</tspan></text><text x="58.0" y="475.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Ve hígado, pulmón y peritoneo.</tspan><tspan x="58.0" dy="16">No distingue las capas de la pared.</tspan></text><rect x="364.0" y="430.0" width="596.0" height="358.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="419.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="434.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="456.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Ecoendoscopía (EUS)</tspan></text><text x="382.0" y="478.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">La sonda de ultrasonido en la punta del endoscopio ve cada capa de la pared.</tspan></text><g transform="translate(452.0,498.0) scale(1.2)"><rect x="20" y="30" width="170" height="30" fill="#f9a8d4" stroke="#ffffff" stroke-width="1"/><text x="200" y="49.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Mucosa</text><text x="200" y="49.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Mucosa</text><rect x="20" y="60" width="170" height="8" fill="#f472b6" stroke="#ffffff" stroke-width="1"/><text x="200" y="68.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Muscular de la mucosa</text><text x="200" y="68.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Muscular de la mucosa</text><rect x="20" y="68" width="170" height="36" fill="#fde68a" stroke="#ffffff" stroke-width="1"/><text x="200" y="90.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Submucosa</text><text x="200" y="90.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Submucosa</text><rect x="20" y="104" width="170" height="52" fill="#fca5a5" stroke="#ffffff" stroke-width="1"/><text x="200" y="134.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Muscular propia</text><text x="200" y="134.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Muscular propia</text><rect x="20" y="156" width="170" height="20" fill="#fef3c7" stroke="#ffffff" stroke-width="1"/><text x="200" y="170.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Subserosa</text><text x="200" y="170.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Subserosa</text><rect x="20" y="176" width="170" height="10" fill="#a7f3d0" stroke="#ffffff" stroke-width="1"/><text x="200" y="185.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Serosa</text><text x="200" y="185.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Serosa</text><text x="4" y="12" font-size="10" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">Luz del órgano</text><path d="M64 26 C60 60 70 92 98 102 C124 96 138 60 132 26 Z" fill="#ea580c" stroke="#9a3412" stroke-width="2" stroke-linejoin="round" opacity="0.9"/><text x="98" y="22" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Tumor</text><text x="98" y="22" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="middle" data-max="0">Tumor</text><line x1="16" y1="32" x2="16" y2="58" stroke="#0f766e" stroke-width="3"/><text x="12" y="49.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T1a</text><text x="12" y="49.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T1a</text><line x1="16" y1="70" x2="16" y2="102" stroke="#0f766e" stroke-width="3"/><text x="12" y="90.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T1b</text><text x="12" y="90.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T1b</text><line x1="16" y1="106" x2="16" y2="154" stroke="#0f766e" stroke-width="3"/><text x="12" y="134.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T2</text><text x="12" y="134.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T2</text><path d="M178 4 L178 22" fill="none" stroke="#334155" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M166 30 Q178 36 190 30" fill="none" stroke="#0ea5e9" stroke-width="1.6"/><path d="M160 39 Q178 46 196 39" fill="none" stroke="#0ea5e9" stroke-width="1.6"/><path d="M154 48 Q178 56 202 48" fill="none" stroke="#0ea5e9" stroke-width="1.6"/><path d="M148 57 Q178 66 208 57" fill="none" stroke="#0ea5e9" stroke-width="1.6"/><text x="192" y="12" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">sonda de ultrasonido</text><text x="192" y="12" font-size="10" font-weight="800" fill="#0369a1" text-anchor="start" data-max="0">sonda de ultrasonido</text></g><text x="382.0" y="770.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">La EUS distingue si el tumor queda en la mucosa (T1a) o llega a la submucosa (T1b).</tspan></text><text x="40.0" y="822.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE SEGÚN LO QUE MUESTRE</tspan></text><rect x="40.0" y="832.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="833.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="856.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">T1a (mucosa)</tspan></text><text x="58.0" y="877.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Disección endoscópica submucosa.</tspan></text><rect x="351.3" y="832.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="833.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="856.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">T1b (submucosa)</tspan></text><text x="369.3" y="877.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Gastrectomía con linfadenectomía.</tspan></text><rect x="662.7" y="832.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="833.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="856.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Ganglio sospechoso</tspan></text><text x="680.7" y="877.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Punción guiada por EUS.</tspan></text><text x="40.0" y="941.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="951.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="973.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Carcinomatosis</tspan></text><text x="491.2" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Ganglios perihepáticos</tspan></text><text x="678.8" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Cadena linfática</tspan></text><rect x="775.5" y="954.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Capas gástricas</tspan></text><rect x="40.0" y="988.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="988.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1009.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Lo ve mejor la EUS?</tspan></text><text x="303.8" y="1009.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: TC o laparoscopía</tspan></text><text x="491.2" y="1009.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: TC</tspan></text><text x="678.8" y="1009.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Solo ganglios vecinos</tspan></text><text x="866.2" y="1009.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí: su función principal</tspan></text><rect x="40.0" y="951.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1046.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1074.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1096.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La ecoendoscopía ve la pared por capas: define la T (mucosa vs submucosa) y ganglios vecinos.</tspan><tspan x="58.0" dy="18">• T1a sin factores de riesgo: disección endoscópica submucosa (DES).</tspan><tspan x="58.0" dy="18">• T1b o con factores de riesgo: gastrectomía con linfadenectomía. La TC busca metástasis a distancia.</tspan></text><text x="58.0" y="1154.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Japanese Gastric Cancer Association (2021); NCCN, cáncer gástrico (2024).</tspan></text></svg>