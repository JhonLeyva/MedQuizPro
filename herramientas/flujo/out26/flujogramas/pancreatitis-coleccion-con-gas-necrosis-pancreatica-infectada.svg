<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1173" viewBox="0 0 1000 1173" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Colección pancreática con gas: necrosis infectada"><title>Colección pancreática con gas: necrosis infectada</title><rect x="0.75" y="0.75" width="998.5" height="1171.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pancreatitis aguda · complicaciones locales</tspan></text><rect x="459.8" y="32.0" width="180.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="550.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="164"><tspan x="550.0" dy="0">GASTROENTEROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Colecciones de la pancreatitis (Atlanta)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se ordenan por tiempo (antes o después de 4 semanas) y contenido (líquido o necrosis).</tspan><tspan x="58.0" dy="17">Gas dentro de la colección = infección.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 55 años con pancreatitis</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Día 5: fiebre persistente y leucocitosis.</tspan><tspan x="640.0" dy="16">TC: colección pancreática con gas en su interior.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIEMPO Y CONTENIDO DE LA COLECCIÓN</tspan></text><text x="202.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ CONTENIDO</tspan></text><rect x="202.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="388.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Solo líquido</tspan></text><rect x="587.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Con necrosis</tspan></text><text x="40.0" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ TIEMPO DESDE EL</tspan><tspan x="40.0" dy="15">INICIO</tspan></text><rect x="40.0" y="338.0" width="150.0" height="76.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="380.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">&lt; 4 semanas</tspan></text><rect x="202.0" y="338.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="339.0" width="6.0" height="74.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="388.5" y="367.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Colección líquida aguda</tspan></text><text x="388.5" y="390.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Sin pared; suele resolverse</tspan></text><rect x="587.0" y="338.0" width="373.0" height="76.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="367.6" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Colección necrótica aguda</tspan></text><text x="773.5" y="390.6" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Día 5 + gas = INFECTADA</tspan></text><rect x="728.1" y="403.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="773.5" y="418.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="773.5" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="426.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="468.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">≥ 4 semanas</tspan></text><rect x="202.0" y="426.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="427.0" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Seudoquiste</tspan></text><text x="388.5" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Pared definida, solo líquido</tspan></text><rect x="587.0" y="426.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="427.0" width="6.0" height="74.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="773.5" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Necrosis encapsulada</tspan></text><text x="773.5" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Pared + restos sólidos</tspan></text><text x="40.0" y="552.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="564.0" width="348.0" height="282.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="574.0" width="157.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="588.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="306"><tspan x="61.0" dy="0">LA COLECCIÓN DEL CASO</tspan></text><g data-box="54.0 602.0 320.0 220.0"><g transform="translate(54.0,602.0) scale(1.0)"><path d="M10 30 Q160 -10 310 30 L310 200 Q160 230 10 200 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 40 C120 20 220 20 262 46 C280 70 262 92 220 92 C170 92 120 96 86 86 C62 78 56 54 70 40 Z" fill="#fbcfe8" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><text x="166" y="64" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Estómago</text><text x="166" y="64" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="middle" data-max="0">Estómago</text><ellipse cx="160" cy="196" rx="16" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8" /><text x="160" y="200" font-size="9" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">col.</text><path d="M40 150 C80 130 150 130 200 132 C240 134 272 128 290 118 C300 132 292 148 272 152 C230 160 150 162 90 170 C60 174 36 166 40 150 Z" fill="#fdba74" stroke="#9a6b52" stroke-width="2" stroke-linejoin="round" /><text x="100" y="168" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Páncreas</text><text x="100" y="168" font-size="10.5" font-weight="800" fill="#92400e" text-anchor="middle" data-max="0">Páncreas</text><path d="M126 96 C160 86 214 92 236 110 C240 132 206 142 170 140 C136 138 116 124 126 96 Z" fill="#a8a29e" stroke="#57534e" stroke-width="3" stroke-linejoin="round" /><circle cx="150" cy="112" r="7" fill="#78716c" opacity="0.7"/><circle cx="184" cy="120" r="9" fill="#78716c" opacity="0.7"/><circle cx="212" cy="110" r="6" fill="#78716c" opacity="0.7"/><circle cx="170" cy="102" r="5" fill="#78716c" opacity="0.7"/><circle cx="144" cy="104" r="4" fill="#111827" stroke="#ffffff" stroke-width="0.8"/><circle cx="160" cy="120" r="4" fill="#111827" stroke="#ffffff" stroke-width="0.8"/><circle cx="196" cy="106" r="4" fill="#111827" stroke="#ffffff" stroke-width="0.8"/><circle cx="220" cy="120" r="4" fill="#111827" stroke="#ffffff" stroke-width="0.8"/><circle cx="178" cy="132" r="4" fill="#111827" stroke="#ffffff" stroke-width="0.8"/><circle cx="206" cy="128" r="4" fill="#111827" stroke="#ffffff" stroke-width="0.8"/></g></g><rect x="410.0" y="564.0" width="550.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="579.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="583.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">1</tspan></text><text x="446.0" y="584.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">Colección con restos necróticos detrás del estómago.</tspan></text><rect x="410.0" y="602.0" width="550.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="428.0" cy="617.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="621.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">2</tspan></text><text x="446.0" y="622.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">Burbujas negras: gas producido por bacterias.</tspan></text><rect x="410.0" y="640.0" width="550.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="655.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">3</tspan></text><text x="446.0" y="660.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">Con fiebre y leucocitosis al día 5: necrosis pancreática infectada.</tspan></text><text x="40.0" y="886.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="896.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="927.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="918.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Colección peripancreática</tspan><tspan x="303.8" dy="17">aguda</tspan></text><text x="491.2" y="927.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Seudoquiste</tspan></text><text x="678.8" y="927.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Absceso pancreático</tspan></text><rect x="775.5" y="899.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="927.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Necrosis infectada</tspan></text><rect x="40.0" y="950.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="950.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="979.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Por qué</tspan></text><text x="303.8" y="979.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No tiene gas ni necrosis</tspan></text><text x="491.2" y="971.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Aparece después de 4</tspan><tspan x="491.2" dy="16">semanas</tspan></text><text x="678.8" y="979.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Término ya no usado</tspan></text><text x="866.2" y="979.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Gas + necrosis + fiebre</tspan></text><rect x="40.0" y="896.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1024.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1052.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1074.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Gas en una colección necrótica = necrosis infectada (bacterias productoras de gas).</tspan><tspan x="58.0" dy="18">• Antibiótico que penetre en la necrosis (carbapenémico) y, si no mejora, drenaje escalonado.</tspan><tspan x="58.0" dy="18">• Desbridamiento idealmente después de 4 semanas, cuando la necrosis se encapsula.</tspan></text><text x="58.0" y="1132.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Clasificación de Atlanta revisada (2012); AGA, necrosis pancreática (2020).</tspan></text></svg>