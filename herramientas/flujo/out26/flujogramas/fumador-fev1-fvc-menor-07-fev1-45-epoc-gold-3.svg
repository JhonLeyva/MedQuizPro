0" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">1</tspan></text><rect x="350.0" y="301.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="302.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Relación FEV1/FVC</tspan></text><text x="368.0" y="346.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">&lt; 0,7 tras broncodilatador: obstrucción.</tspan></text><circle cx="326.0" cy="404.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="409.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">2</tspan></text><rect x="350.0" y="382.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="383.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="406.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Reversibilidad</tspan></text><text x="368.0" y="427.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">No significativa: no es asma.</tspan></text><circle cx="326.0" cy="485.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="490.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">3</tspan></text><rect x="350.0" y="463.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="464.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="487.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Gravedad</tspan></text><text x="368.0" y="508.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">FEV1 45 % = GOLD 3 (grave).</tspan></text><circle cx="326.0" cy="566.0" r="14" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="326.0" y="571.0" font-size="13" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">4</tspan></text><rect x="350.0" y="544.0" width="610.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="351.0" y="545.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="368.0" y="568.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Exacerbaciones</tspan></text><text x="368.0" y="589.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">2 con corticoide en 1 año: grupo E.</tspan></text><circle cx="326.0" cy="647.0" r="14" fill="#0f766e" stroke="none" stroke-width="0"/><text x="326.0" y="652.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">5</tspan></text><rect x="350.0" y="625.0" width="610.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="351.0" y="626.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="368.0" y="649.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">Resultado</tspan></text><text x="368.0" y="670.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="582"><tspan x="368.0" dy="0">EPOC estable moderada-grave.</tspan></text><rect x="860.2" y="614.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="629.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="815.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="825.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="856.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="856.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Mixto asma-EPOC</tspan></text><text x="491.2" y="847.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Bronquitis sin</tspan><tspan x="491.2" dy="17">obstrucción</tspan></text><text x="678.8" y="856.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Asma persistente</tspan></text><rect x="775.5" y="828.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="856.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">EPOC moderada-grave</tspan></text><rect x="40.0" y="879.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="879.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="908.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="900.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sin asma previa ni</tspan><tspan x="303.8" dy="16">reversibilidad</tspan></text><text x="491.2" y="908.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí hay obstrucción</tspan></text><text x="678.8" y="908.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No revierte</tspan></text><text x="866.2" y="908.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Ninguno</tspan></text><rect x="40.0" y="825.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="953.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="981.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1003.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• FEV1/FVC &lt; 0,7 que no revierte en un fumador sin asma = EPOC.</tspan><tspan x="58.0" dy="18">• FEV1 45 % = GOLD 3 (grave, 30-49 %); 2 exacerbaciones con corticoide = grupo E.</tspan><tspan x="58.0" dy="18">• Eosinófilos ≥ 300: anuncian que el corticoide inhalado ayudará más; no lo convierten en asma.</tspan></text><text x="58.0" y="1061.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GOLD (2025); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>