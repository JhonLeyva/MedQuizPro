<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1102" viewBox="0 0 1000 1102" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fumador con FEV1/FVC &lt; 0,7 sin reversibilidad y FEV1 45 %: EPOC moderada-grave"><title>Fumador con FEV1/FVC &lt; 0,7 sin reversibilidad y FEV1 45 %: EPOC moderada-grave</title><rect x="0.75" y="0.75" width="998.5" height="1100.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">EPOC · diagnóstico y gravedad</tspan></text><rect x="385.2" y="32.0" width="129.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="450.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="114"><tspan x="450.1" dy="0">NEUMOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diagnóstico de EPOC</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Exposición (tabaco) + síntomas + espirometría posbroncodilatador con FEV1/FVC &lt; 0,7.</tspan><tspan x="58.0" dy="17">El FEV1 da la gravedad (GOLD 1-4); las exacerbaciones, el grupo (A, B, E).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 60 años, 40 paquetes-año</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tos productiva y disnea progresiva de 3 años; 2</tspan><tspan x="640.0" dy="16">exacerbaciones con corticoide en 1 año.</tspan><tspan x="640.0" dy="16">FEV1/FVC &lt; 0,7 sin reversibilidad; FEV1 45 %;</tspan><tspan x="640.0" dy="16">eosinófilos 350/µL; sin asma previa.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE LEE LA ESPIROMETRÍA PASO A PASO</tspan></text><rect x="40.0" y="301.0" width="250.0" height="470.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="163.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">ESPIROMETRÍA (ESQUEMA)</tspan></text><g data-box="56.0 341.0 218.0 330.0"><g transform="translate(36.0,351.0) scale(1.0)"><rect x="44" y="14" width="170" height="250" fill="#f8fafc" stroke="#cbd5e1"/><polyline points="44.0,264.0 46.8,230.0 49.7,201.0 52.5,176.3 55.3,155.3 58.2,137.3 61.0,122.1 63.8,109.0 66.7,97.9 69.5,88.5 72.3,80.4 75.2,73.6 78.0,67.7 80.8,62.7 83.7,58.5 86.5,54.9 89.3,51.8 92.2,49.2 95.0,46.9 97.8,45.0 100.7,43.4 103.5,42.0 106.3,40.8 109.2,39.8 112.0,38.9 114.8,38.2 117.7,37.6 120.5,37.1 123.3,36.6 126.2,36.2 129.0,35.9 131.8,35.6 134.7,35.4 137.5,35.2 140.3,35.0 143.2,34.9 146.0,34.7 148.8,34.6 151.7,34.5 154.5,34.4 157.3,34.4 160.2,34.3 163.0,34.3 165.8,34.2 168.7,34.2 171.5,34.2 174.3,34.1 177.2,34.1 180.0,34.1 182.8,34.1 185.7,34.1 188.5,34.1 191.3,34.1 194.2,34.0 197.0,34.0 199.8,34.0 202.7,34.0 205.5,34.0 208.3,34.0 211.2,34.0 214.0,34.0" fill="none" stroke="#0f766e" stroke-width="2.6"/><circle cx="72.33333333333333" cy="80.43619913877075" r="4.5" fill="#0f766e" stroke="#ffffff" stroke-width="1.5" /><text x="210.0" y="28.00000000000003" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">normal: 0,80</text><text x="210.0" y="28.00000000000003" font-size="10.5" font-weight="800" fill="#0f766e" text-anchor="end" data-max="0">normal: 0,80</text><polyline points="44.0,264.0 46.8,250.9 49.7,238.9 52.5,227.7 55.3,217.4 58.2,208.0 61.0,199.2 63.8,191.1 66.7,183.6 69.5,176.7 72.3,170.4 75.2,164.5 78.0,159.1 80.8,154.1 83.7,149.5 86.5,145.2 89.3,141.3 92.2,137.6 95.0,134.3 97.8,131.2 100.7,128.3 103.5,125.7 106.3,123.2 109.2,121.0 112.0,118.9 114.8,117.0 117.7,115.2 