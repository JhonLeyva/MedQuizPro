<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="964" viewBox="0 0 1000 964" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cistocele y rectocele con periné amplio: colporrafia anterior, posterior y perineorrafia"><title>Cistocele y rectocele con periné amplio: colporrafia anterior, posterior y perineorrafia</title><rect x="0.75" y="0.75" width="998.5" height="962.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Prolapso de órganos pélvicos · cirugía por compartimento</tspan></text><rect x="543.9" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="631.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="631.0" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Prolapso de órganos pélvicos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se corrige cada compartimento dañado: anterior, posterior, apical y periné.</tspan><tspan x="58.0" dy="17">En mujeres con vida sexual se evitan las técnicas que cierran la vagina.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Multípara de 68 años, sexualmente activa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Bulto vaginal, presión pélvica y disfunción miccional.</tspan><tspan x="640.0" dy="16">Cistocele II, rectocele III, introito laxo y periné amplio.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ COMPARTIMENTOS ESTÁN DAÑADOS</tspan></text><rect x="40.0" y="269.0" width="552.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="422"><tspan x="56.0" dy="0">HALLAZGO → PROCEDIMIENTO</tspan></text><text x="576.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="576.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="303.0" width="552.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="313.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="328.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="327.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="402"><tspan x="86.0" dy="0">Cistocele grado II → colporrafia anterior</tspan></text><text x="86.0" y="343.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="402"><tspan x="86.0" dy="0">Compartimento anterior</tspan></text><text x="576.0" y="327.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="576.0" dy="0">Sí</tspan></text><rect x="40.0" y="349.0" width="552.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="359.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="374.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="373.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="402"><tspan x="86.0" dy="0">Rectocele grado III → colporrafia posterior</tspan></text><text x="86.0" y="389.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="402"><tspan x="86.0" dy="0">Compartimento posterior</tspan></text><text x="576.0" y="373.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="576.0" dy="0">Sí</tspan></text><rect x="40.0" y="395.0" width="552.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="405.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="420.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="419.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="402"><tspan x="86.0" dy="0">Introito laxo y periné amplio → perineorrafia</tspan></text><text x="86.0" y="435.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="402"><tspan x="86.0" dy="0">Reconstruye el cuerpo perineal</tspan></text><text x="576.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="576.0" dy="0">Sí</tspan></text><rect x="40.0" y="441.0" width="552.0" height="46.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="451.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="466.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✕</tspan></text><text x="86.0" y="465.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="402"><tspan x="86.0" dy="0">Prolapso apical (útero o cúpula)</tspan></text><text x="86.0" y="481.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="402"><tspan x="86.0" dy="0">No descrito: no hace falta suspensión apical</tspan></text><text x="576.0" y="465.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="576.0" dy="0">No</tspan></text><rect x="40.0" y="487.0" width="552.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="497.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="512.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✕</tspan></text><text x="86.0" y="511.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="402"><tspan x="86.0" dy="0">Sin vida sexual (permitiría colpocleisis)</tspan></text><text x="86.0" y="527.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="402"><tspan x="86.0" dy="0">Es sexualmente activa</tspan></text><text x="576.0" y="511.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="576.0" dy="0">No</tspan></text><rect x="40.0" y="533.0" width="552.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="555.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="520"><tspan x="56.0" dy="0">Cumple 3 de 5 · se repara cada compartimento dañado</tspan></text><text x="56.0" y="575.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="520"><tspan x="56.0" dy="0">Colporrafia anterior + posterior + perineorrafia</tspan></text><rect x="40.0" y="269.0" width="552.0" height="321.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="612.0" y="269.0" width="348.0" height="368.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="624.0" y="279.0" width="104.6" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="633.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="633.0" dy="0">CORTE SAGITAL</tspan></text><g transform="translate(626.0,307.0) scale(1.0)"><ellipse cx="58" cy="170" rx="16" ry="30" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2" transform="rotate(20 58 170)" /><path d="M246 20 C300 70 300 170 250 236 L236 226 C280 164 278 76 232 32 Z" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round" /><text x="40" y="214" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">pubis</text><text x="298" y="250" font-size="10" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">sacro</text><line x1="20" y1="262" x2="300" y2="262" stroke="#e9b48f" stroke-width="3"/><text x="24" y="256" font-size="10" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">periné</text><path d="M252 40 C262 110 236 170 204 196 C160 206 170 236 178 262" fill="none" stroke="#fcd34d" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/><path d="M252 40 C262 110 236 170 204 196 C160 206 170 236 178 262" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round" /><path d="M168 150 C156 196 140 230 128 262" fill="none" stroke="#f9a8d4" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M168 150 C156 196 140 230 128 262" fill="none" stroke="#be185d" stroke-width="1.5" stroke-linejoin="round" /><path d="M78 110 C74 70 140 62 146 104 C150 136 132 150 108 150 C88 150 80 132 78 110 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round" /><ellipse cx="140" cy="196" rx="20" ry="24" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" /><path d="M112 150 C124 162 132 170 136 176" fill="none" stroke="#fef9c3" stroke-width="14" stroke-linejoin="round" /><ellipse cx="176" cy="108" rx="40" ry="26" fill="#fbcfe8" stroke="#be185d" stroke-width="2" transform="rotate(-50 176 108)" /><ellipse cx="168" cy="146" rx="12" ry="10" fill="#fbcfe8" stroke="#be185d" stroke-width="2" /><text x="200" y="70" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">útero</text><text x="200" y="70" font-size="10.5" font-weight="800" fill="#be185d" text-anchor="start" data-max="0">útero</text><text x="8" y="40" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Cistocele: la vejiga baja</text><text x="8" y="40" font-size="10.5" font-weight="800" fill="#a16207" text-anchor="start" data-max="0">Cistocele: la vejiga baja</text><text x="8" y="54" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">por la pared anterior</text><text x="8" y="54" font-size="10.5" font-weight="800" fill="#a16207" text-anchor="start" data-max="0">por la pared anterior</text><line x1="60" y1="58" x2="132" y2="190" stroke="#a16207" stroke-width="1.3"/><circle cx="132" cy="190" r="2.6" fill="#a16207"/><text x="236" y="284" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Rectocele: el recto</text><text x="236" y="284" font-size="10.5" font-weight="800" fill="#b45309" text-anchor="middle" data-max="0">Rectocele: el recto</text><text x="236" y="298" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">empuja la pared posterior</text><text x="236" y="298" font-size="10.5" font-weight="800" fill="#b45309" text-anchor="middle" data-max="0">empuja la pared posterior</text><line x1="236" y1="274" x2="178" y2="214" stroke="#b45309" stroke-width="1.3"/><circle cx="178" cy="214" r="2.6" fill="#b45309"/></g><text x="40.0" y="677.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="687.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="718.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="718.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Suspensión uterosacra</tspan></text><text x="491.2" y="709.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Histerectomía sin</tspan><tspan x="491.2" dy="17">colporrafia</tspan></text><text x="678.8" y="718.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Colpocleisis</tspan></text><rect x="775.5" y="690.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="709.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Colporrafia ant. + post. +</tspan><tspan x="866.2" dy="17">perineorrafia</tspan></text><rect x="40.0" y="741.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="741.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="770.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="762.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Trata el ápice, no estos</tspan><tspan x="303.8" dy="16">defectos</tspan></text><text x="491.2" y="770.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Deja cistocele y rectocele</tspan></text><text x="678.8" y="770.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Cierra la vagina</tspan></text><text x="866.2" y="770.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Ninguno</tspan></text><rect x="40.0" y="687.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="815.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="843.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="865.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cistocele → colporrafia anterior; rectocele → colporrafia posterior; introito laxo → perineorrafia.</tspan><tspan x="58.0" dy="18">• La suspensión uterosacra o la sacropexia son para el prolapso apical.</tspan><tspan x="58.0" dy="18">• La colpocleisis solo si no desea vida sexual.</tspan></text><text x="58.0" y="923.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG n.º 214 (prolapso); Te Linde Ginecología Quirúrgica 12.ª ed.</tspan></text></svg>