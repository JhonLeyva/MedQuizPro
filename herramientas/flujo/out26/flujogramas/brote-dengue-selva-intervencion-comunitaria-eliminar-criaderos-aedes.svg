#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="431.0" cy="704.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="708.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">2</tspan></text><text x="451.0" y="708.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">Las larvas viven en agua estancada.</tspan></text><rect x="413.0" y="717.0" width="547.0" height="25.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="431.0" cy="735.0" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="739.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">3</tspan></text><text x="451.0" y="739.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="503"><tspan x="451.0" dy="0">Sin criaderos no hay mosquitos nuevos.</tspan></text><text x="40.0" y="947.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="957.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="979.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="979.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Antibióticos a contactos</tspan></text><rect x="400.5" y="960.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="979.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Eliminar criaderos</tspan></text><text x="678.8" y="979.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Vacunar a todos</tspan></text><text x="866.2" y="979.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Aislamiento domiciliario</tspan></text><rect x="40.0" y="994.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="994.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1015.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Prioritaria?</tspan></text><text x="303.8" y="1015.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No sirve</tspan></text><text x="491.2" y="1015.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="1015.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No en el brote</tspan></text><text x="866.2" y="1015.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No corta la transmisión</tspan></text><rect x="40.0" y="957.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1052.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1080.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1102.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Prioridad: control vectorial (eliminar criaderos, larvicidas, fumigación focal en brotes) con la comunidad.</tspan><tspan x="58.0" dy="18">• Los antibióticos no sirven (es un virus); aislar en casa no detiene al mosquito.</tspan><tspan x="58.0" dy="18">• La vacuna no es la medida principal para cortar un brote.</tspan></text><text x="58.0" y="1160.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, norma técnica de dengue; OPS.</tspan></text></svg>