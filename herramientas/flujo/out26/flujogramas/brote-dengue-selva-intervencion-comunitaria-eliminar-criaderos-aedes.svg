274.5,574.0" fill="#0f766e"/><rect x="278.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Sospecha de brote</tspan></text><line x1="487.0" y1="574.0" x2="506.0" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,569.0 505.0,579.0 513.0,574.0" fill="#0f766e"/><rect x="517.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Buscar criaderos</tspan></text><line x1="725.5" y1="574.0" x2="744.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,569.0 743.5,579.0 751.5,574.0" fill="#0f766e"/><rect x="755.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="569.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Eliminarlos con la</tspan><tspan x="857.8" dy="17">comunidad</tspan></text><text x="40.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="655.0" width="351.0" height="252.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="665.0" width="244.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="679.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="309"><tspan x="61.0" dy="0">DÓNDE SE CRÍA EL MOSQUITO (ESQUEMA)</tspan></text><g transform="translate(54.0,693.0) scale(0.95)"><path d="M20 150 L80 150 L72 190 L28 190 Z" fill="#94a