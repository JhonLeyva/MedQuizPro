<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1066" viewBox="0 0 1000 1066" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Calcificaciones periventriculares con microcefalia: citomegalovirus congénito"><title>Calcificaciones periventriculares con microcefalia: citomegalovirus congénito</title><rect x="0.75" y="0.75" width="998.5" height="1064.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infecciones congénitas · CMV y toxoplasmosis</tspan></text><rect x="476.2" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="532.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="532.6" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infecciones congénitas (TORCH)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La ubicación de las calcificaciones orienta el germen.</tspan><tspan x="58.0" dy="17">CMV: alrededor de los ventrículos. Toxoplasma: dispersas en el cerebro.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido a término</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Madre con cuadro seudogripal en el primer trimestre.</tspan><tspan x="640.0" dy="16">Microcefalia; eco: ventriculomegalia y calcificaciones</tspan><tspan x="640.0" dy="16">periventriculares.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÓNDE ESTÁN LAS CALCIFICACIONES</tspan></text><rect x="40.0" y="295.0" width="438.0" height="368.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="52.0" y="305.0" width="123.0" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">CITOMEGALOVIRUS</tspan></text><rect x="362.6" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="408.0" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">◆ ESTE CASO</tspan></text><g transform="translate(119.0,333.0) scale(1.0)"><rect x="0" y="0" width="280" height="260" rx="10" fill="#0b1220"/><path d="M140 10 L14 250 Q140 290 266 250 Z" fill="#1f2937" stroke="none" stroke-width="0" stroke-linejoin="round" /><ellipse cx="140" cy="132" rx="116" ry="118" fill="none" stroke="#e5e7eb" stroke-width="1" /><ellipse cx="140" cy="132" rx="106" ry="108" fill="#6b7280" stroke="none" stroke-width="0" /><path d="M110 96 C102 120 104 150 123.0 164 L136 150 L136 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><path d="M170 96 C178 120 176 150 157.0 164 L144 150 L144 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><circle cx="104" cy="100" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="100" cy="124" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="106" cy="150" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="176" cy="100" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="180" cy="126" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="174" cy="152" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><text x="140" y="250" font-size="9.5" font-weight="800" fill="#94a3b8" text-anchor="middle" data-max="0"></text></g><text x="54.0" y="611.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">Ventrículos grandes con calcificaciones pegadas a sus paredes (esquema</tspan><tspan x="54.0" dy="16">de eco transfontanelar).</tspan></text><rect x="522.0" y="295.0" width="438.0" height="368.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="534.0" y="305.0" width="111.1" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">TOXOPLASMOSIS</tspan></text><g transform="translate(601.0,333.0) scale(1.0)"><rect x="0" y="0" width="280" height="260" rx="10" fill="#0b1220"/><path d="M140 10 L14 250 Q140 290 266 250 Z" fill="#1f2937" stroke="none" stroke-width="0" stroke-linejoin="round" /><ellipse cx="140" cy="132" rx="116" ry="118" fill="none" stroke="#e5e7eb" stroke-width="1" /><ellipse cx="140" cy="132" rx="106" ry="108" fill="#6b7280" stroke="none" stroke-width="0" /><path d="M119 96 C111 120 113 150 127.5 164 L136 150 L136 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><path d="M161 96 C169 120 167 150 152.5 164 L144 150 L144 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><circle cx="70" cy="90" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="210" cy="160" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="120" cy="200" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="190" cy="70" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="90" cy="180" r="4" fill="#ffffff" stroke="none" stroke-width="0" /><text x="140" y="250" font-size="9.5" font-weight="800" fill="#94a3b8" text-anchor="middle" data-max="0"></text></g><text x="536.0" y="611.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="536.0" dy="0">Calcificaciones dispersas por todo el cerebro.</tspan></text><circle cx="500.0" cy="463.0" r="17" fill="#ea580c" stroke="none" stroke-width="0"/><polygon points="494.0,455.0 494.0,471.0 508.0,463.0" fill="#ffffff"/><text x="40.0" y="693.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OTRAS PISTAS</tspan></text><rect x="40.0" y="703.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="704.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="727.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">CMV</tspan></text><text x="58.0" y="748.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Hipoacusia, petequias, hepatoesplenomegalia.</tspan></text><rect x="237.5" y="692.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="707.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="703.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="704.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="727.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Toxoplasma</tspan></text><text x="369.3" y="748.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Coriorretinitis, hidrocefalia.</tspan></text><rect x="662.7" y="703.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="704.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="727.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Rubeola</tspan></text><text x="680.7" y="748.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Cataratas, cardiopatía, sordera.</tspan></text><text x="40.0" y="812.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="822.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="844.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Herpes simple</tspan></text><rect x="400.5" y="825.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Citomegalovirus</tspan></text><text x="678.8" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Toxoplasmosis</tspan></text><text x="866.2" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Rubeola</tspan></text><rect x="40.0" y="859.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="859.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="880.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Clave</tspan></text><text x="303.8" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Vesículas, encefalitis</tspan></text><text x="491.2" y="880.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Periventriculares</tspan></text><text x="678.8" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Difusas</tspan></text><text x="866.2" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Cataratas y cardiopatía</tspan></text><rect x="40.0" y="822.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="917.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="945.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="967.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• CMV congénito: calcificaciones periventriculares + microcefalia + hipoacusia neurosensorial.</tspan><tspan x="58.0" dy="18">• Toxoplasmosis: calcificaciones difusas, hidrocefalia y coriorretinitis.</tspan><tspan x="58.0" dy="18">• Confirmar con PCR para CMV en orina o saliva en las primeras 3 semanas; valganciclovir si es sintomático.</tspan></text><text x="58.0" y="1025.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); Consenso internacional de CMV congénito (2017).</tspan></text></svg>