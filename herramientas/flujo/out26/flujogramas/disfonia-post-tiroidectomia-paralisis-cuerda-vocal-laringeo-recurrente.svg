troke="none" stroke-width="0"/><text x="388.0" y="385.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">2</tspan></text><text x="408.0" y="385.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Cuerda vocal paralizada</tspan></text><text x="408.0" y="406.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Del lado del nervio lesionado.</tspan></text><rect x="368.0" y="433.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="455.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="459.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">3</tspan></text><text x="408.0" y="459.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Voz bitonal o débil</tspan></text><text x="408.0" y="480.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Cierre glótico incompleto.</tspan></text><rect x="368.0" y="507.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="529.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="533.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">4</tspan></text><text x="408.0" y="533.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Si es bilateral: estridor</tspan></text><text x="408.0" y="554.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Urgencia de vía aérea.</tspan></text><rect x="368.0" y="581.0" width="592.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><circle cx="388.0" cy="603.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">5</tspan></text><text x="408.0" y="607.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Nervio: laríngeo recurrente</tspan></text><text x="408.0" y="628.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Rama del vago (X).</tspan></text><rect x="844.6" y="570.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="585.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="799.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="809.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="831.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Laríngeo superior externo</tspan></text><rect x="400.5" y="812.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Laríngeo recurrente</tspan></text><text x="678.8" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Glosofaríngeo</tspan></text><text x="866.2" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Simpático cervical</tspan></text><rect x="40.0" y="846.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="846.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="867.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Produce</tspan></text><text x="303.8" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Voz débil en agudos</tspan></text><text x="491.2" y="867.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Parálisis de la cuerda</tspan></text><text x="678.8" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Disfagia, gusto 1/3 posterior</tspan></text><text x="866.2" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Horner</tspan></text><rect x="40.0" y="809.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="904.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="932.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="954.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Lesión del laríngeo recurrente: parálisis de la cuerda vocal del mismo lado y disfonía.</tspan><tspan x="58.0" dy="18">• Bilateral: estridor y compromiso de la vía aérea.</tspan><tspan x="58.0" dy="18">• Laríngeo superior (rama externa): voz débil en tonos agudos (cricotiroideo), no parálisis de la cuerda.</tspan></text><text x="58.0" y="1012.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Moore, Anatomía con orientación clínica 9.ª ed.; Latarjet, Anatomía humana 5.ª ed..</tspan></text></svg>