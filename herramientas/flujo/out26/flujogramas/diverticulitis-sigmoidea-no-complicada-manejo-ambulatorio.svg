<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diverticulitis no complicada: cuándo se trata en casa"><title>Diverticulitis no complicada: cuándo se trata en casa</title><rect x="0.75" y="0.75" width="998.5" height="998.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedad diverticular · diverticulitis aguda</tspan></text><rect x="465.9" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="516.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="516.6" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diverticulitis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación de un divertículo, casi siempre del sigmoides: dolor en FII y fiebre.</tspan><tspan x="58.0" dy="17">La TC dice si es complicada (absceso, perforación, fístula, obstrucción).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 48 años, dolor en FII de 2 días</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">T 38 °C, estable, tolera la vía oral, sin comorbilidades.</tspan><tspan x="640.0" dy="16">TC: diverticulitis sigmoidea no complicada.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">IMAGEN DEL CASO Y SEMÁFORO DE CONDUCTA</tspan></text><rect x="40.0" y="269.0" width="310.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="182.9" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">DÓNDE ESTÁ LA INFLAMACIÓN</tspan></text><g transform="translate(60.0,311.0) scale(0.9)"><path d="M18 16 Q150 -6 282 16 L292 300 Q150 334 8 300 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M28 40 Q150 10 272 40" fill="none" stroke="#d6a684" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M24 42 C60 20 176 22 188 42 L182 66 C150 92 86 110 26 112 Z" fill="#e7a882" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="112" cy="104" rx="11" ry="17" fill="#86efac" stroke="#9a6b52" stroke-width="1.8" transform="rotate(-20 112 104)" /><path d="M178 44 C214 30 256 46 254 84 C252 116 222 132 190 128 C178 126 172 116 180 110 C204 110 222 98 220 80 C218 62 200 58 184 64 Z" fill="#fbcfe8" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="266" cy="78" rx="14" ry="30" fill="#c4b5fd" stroke="#9a6b52" stroke-width="1.8" transform="rotate(12 266 78)" /><path d="M150 118 C124 116 116 142 124 160 C132 176 158 176 170 168" fill="none" stroke="#e879a0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 136 C176 124 214 122 246 116 C252 124 246 132 238 134 C206 140 178 146 156 150 Z" fill="#fde68a" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><path d="M58 262 L52 170" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 148 L240 146" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 160 L250 246" fill="none" stroke="#ea580c" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 246 C250 268 226 286 196 286 C176 286 170 272 160 276" fill="none" stroke="#ea580c" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="60" cy="270" rx="15" ry="13" fill="#fed7aa" stroke="#9a6b52" stroke-width="1.8" /><path d="M58 282 C56 296 66 304 74 300" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 180 C120 166 150 196 178 176 C206 158 226 190 206 206 C182 222 150 196 126 214 C104 230 136 248 162 236 C190 224 220 240 206 258 C190 272 150 250 120 262 C102 268 84 262 76 266" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 262 C84 264 78 266 72 268" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="306" rx="22" ry="12" fill="#fef9c3" stroke="#9a6b52" stroke-width="1.8" /><circle cx="206" cy="262" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="206" y="266" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><text x="10" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><rect x="48.0" y="621.0" width="294.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="195.0" y="642.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">Naranja: colon descendente y sigmoides; 1 =</tspan><tspan x="195.0" dy="15">divertículo inflamado en la FII.</tspan></text><text x="370.0" y="281.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="590"><tspan x="370.0" dy="0">DATOS QUE PERMITEN TRATAR EN CASA</tspan></text><rect x="370.0" y="291.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="305.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="309.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="309.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">TC: no complicada (sin absceso ni perforación)</tspan></text><rect x="370.0" y="323.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="337.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="341.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="341.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Tolera la vía oral</tspan></text><rect x="370.0" y="355.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="369.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="373.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="373.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Hemodinámicamente estable</tspan></text><rect x="370.0" y="387.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="401.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="405.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="405.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Sin comorbilidad ni inmunosupresión</tspan></text><rect x="370.0" y="429.0" width="590.0" height="66.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><circle cx="400.0" cy="462.0" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="462.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">No complicada, tolera la vía oral</tspan></text><text x="430.0" y="468.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Ambulatorio</tspan></text><text x="430.0" y="484.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Dieta líquida, antibiótico oral y control en 48-72 h.</tspan></text><rect x="854.6" y="418.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="433.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ ESTE CASO</tspan></text><rect x="370.0" y="503.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="536.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="536.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="525.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">No tolera, comorbilidad o absceso &lt; 3 cm</tspan></text><text x="430.0" y="542.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hospitalizar</tspan></text><text x="430.0" y="558.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Antibiótico EV; absceso grande: drenaje percutáneo.</tspan></text><rect x="370.0" y="577.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="610.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="610.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="599.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Peritonitis purulenta o fecal</tspan></text><text x="430.0" y="616.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Cirugía urgente</tspan></text><text x="430.0" y="632.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Lavado o resección (Hartmann).</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="754.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Hospitalizar con ATB EV</tspan></text><text x="491.2" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Sigmoidectomía</tspan><tspan x="491.2" dy="17">inmediata</tspan></text><text x="678.8" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Colectomía tras 7 días</tspan></text><rect x="775.5" y="726.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Ambulatorio</tspan></text><rect x="40.0" y="777.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="777.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="806.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuándo?</tspan></text><text x="303.8" y="798.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Si no tolera o hay</tspan><tspan x="303.8" dy="16">comorbilidad</tspan></text><text x="491.2" y="806.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Peritonitis generalizada</tspan></text><text x="678.8" y="806.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No se indica de rutina</tspan></text><text x="866.2" y="806.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Este caso</tspan></text><rect x="40.0" y="723.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="851.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="879.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="901.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• No complicada + tolera la vía oral + inmunocompetente + estable = manejo ambulatorio.</tspan><tspan x="58.0" dy="18">• Dieta líquida progresiva; antibiótico oral en el Perú (o sin antibiótico en casos seleccionados).</tspan><tspan x="58.0" dy="18">• Hospitalizar si no tolera la vía oral, hay comorbilidad, inmunosupresión o dolor intenso.</tspan></text><text x="58.0" y="959.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASCRS, guía de diverticulitis (2020); WSES (2020).</tspan></text></svg>