<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1324" viewBox="0 0 1000 1324" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Displasia de cadera a los 9 meses: la Rx de pelvis y cómo leerla"><title>Displasia de cadera a los 9 meses: la Rx de pelvis y cómo leerla</title><rect x="0.75" y="0.75" width="998.5" height="1322.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ortopedia infantil · displasia del desarrollo de la cadera (DDC)</tspan></text><rect x="564.4" y="32.0" width="150.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="639.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="134"><tspan x="639.5" dy="0">TRAUMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Displasia del desarrollo de la cadera</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cadera inestable o luxada desde el nacimiento; riesgo: parto podálico, sexo femenino,</tspan><tspan x="58.0" dy="17">primogénito, familiar con DDC.</tspan><tspan x="58.0" dy="17">El examen depende de la edad: ecografía antes de que osifique la cabeza femoral, Rx</tspan><tspan x="58.0" dy="17">después.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 9 meses, parto podálico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Arrastra la pierna izquierda al gatear.</tspan><tspan x="640.0" dy="16">Abducción limitada y miembro inferior izquierdo más</tspan><tspan x="640.0" dy="16">corto.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ EXAMEN PEDIR SEGÚN LA EDAD</tspan></text><polygon points="220,321.0 260,285.0 740,285.0 780,321.0 740,357.0 260,357.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="321.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="326.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="317.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">¿Ya se osificó el núcleo de la cabeza femoral? (aparece</tspan><tspan x="525.0" dy="18">hacia los 4-6 meses)</tspan></text><line x1="500.0" y1="357.0" x2="500.0" y2="377.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="377.0" x2="662.0" y2="377.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="377.0" x2="190.0" y2="406.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,405.0 195.0,405.0 190.0,413.0" fill="#0f766e"/><line x1="662.0" y1="377.0" x2="662.0" y2="406.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,405.0 667.0,405.0 662.0,413.0" fill="#ea580c"/><rect x="136.0" y="385.0" width="107.9" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="399.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">NO: &lt; 4-6 meses</tspan></text><rect x="621.6" y="385.0" width="80.8" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="399.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">SÍ: 9 meses</tspan></text><rect x="40.0" y="413.0" width="300.0" height="101.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="414.0" width="6.0" height="99.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="437.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Ecografía de caderas (Graf)</tspan></text><text x="58.0" y="458.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">El núcleo aún es cartílago y no se ve en la Rx.</tspan><tspan x="58.0" dy="16">Se mide el ángulo alfa: normal 60° o más.</tspan><tspan x="58.0" dy="16">Se acompaña de Ortolani y Barlow.</tspan></text><rect x="364.0" y="413.0" width="596.0" height="424.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="402.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="417.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="439.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Rx AP de pelvis y caderas</tspan></text><text x="382.0" y="461.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Con el núcleo ya osificado, la Rx muestra dónde está la cabeza femoral respecto del acetábulo.</tspan></text><g transform="translate(382.0,481.0) scale(1.0)"><rect x="0" y="0" width="560" height="300" rx="10" fill="#0b1220"/><rect x="262" y="0" width="36" height="16" rx="3" fill="#94a3b8"/><rect x="262" y="20" width="36" height="18" rx="3" fill="#94a3b8"/><path d="M250 40 H310 L300 146 C294 172 266 172 260 146 Z" fill="#64748b"/><path d="M255 40 C205 12 120 16 92 56 C76 86 88 118 116 130 L132 131 L204 151 L244 116 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/><path d="M305 40 C355 12 440 16 468 56 C486 80 478 98 452 100 L430 98 L356 151 L316 116 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/><path d="M206 160 C234 160 262 170 272 186 L272 214 C254 222 234 222 222 214 C214 232 204 244 196 238 C190 218 192 186 206 160 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/><ellipse cx="238" cy="197" rx="17" ry="12" fill="#0b1220"/><path d="M354 160 C326 160 298 170 288 186 L288 214 C306 222 326 222 338 214 C346 232 356 244 364 238 C370 218 368 186 354 160 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/><ellipse cx="322" cy="197" rx="17" ry="12" fill="#0b1220"/><path d="M140 190 L186 197 L178 300 L142 300 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/><circle cx="162" cy="174" r="11" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/><path d="M436 146 L484 154 L474 300 L440 300 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/><circle cx="462" cy="128" r="7" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/><line x1="60" y1="155" x2="500" y2="155" stroke="#22d3ee" stroke-width="2.2"/><line x1="132" y1="70" x2="132" y2="262" stroke="#22d3ee" stroke-width="2.2" stroke-dasharray="6 4"/><line x1="430" y1="70" x2="430" y2="262" stroke="#22d3ee" stroke-width="2.2" stroke-dasharray="6 4"/><line x1="204" y1="151" x2="118" y2="128" stroke="#ea580c" stroke-width="2.5"/><line x1="356" y1="151" x2="440" y2="92" stroke="#ea580c" stroke-width="2.5"/><path d="M254 184 C232 180 206 186 188 198 L181 262" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M306 184 C328 180 348 182 362 190" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M437 150 L441 262" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="462" cy="128" r="15" fill="none" stroke="#ea580c" stroke-width="2.5"/><text x="16" y="22" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="start" data-max="0">D</text><text x="544" y="22" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="end" data-max="0">I</text><text x="64" y="172" font-size="11" font-weight="800" fill="#22d3ee" text-anchor="start" data-max="0">Hilgenreiner</text><text x="132" y="62" font-size="11" font-weight="800" fill="#22d3ee" text-anchor="middle" data-max="0">Perkins</text><text x="430" y="62" font-size="11" font-weight="800" fill="#22d3ee" text-anchor="middle" data-max="0">Perkins</text><text x="92" y="147" font-size="11" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">IA ~15°</text><text x="506" y="48" font-size="11" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">IA ~35°</text><text x="240" y="272" font-size="11" font-weight="800" fill="#facc15" text-anchor="middle" data-max="0">Shenton</text><text x="240" y="285" font-size="11" font-weight="800" fill="#facc15" text-anchor="middle" data-max="0">continuo</text><text x="400" y="232" font-size="11" font-weight="800" fill="#facc15" text-anchor="middle" data-max="0">Shenton</text><text x="400" y="245" font-size="11" font-weight="800" fill="#facc15" text-anchor="middle" data-max="0">roto</text><text x="518" y="112" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">núcleo arriba</text><text x="518" y="125" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">y afuera</text></g><text x="382.0" y="803.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Esquema dibujado de la Rx. Cadera izquierda (derecha de la imagen): núcleo pequeño arriba y</tspan><tspan x="382.0" dy="16">afuera, techo acetabular empinado (índice acetabular aumentado) y línea de Shenton rota.</tspan></text><text x="40.0" y="871.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DESPUÉS DEL DIAGNÓSTICO: TRATAMIENTO SEGÚN LA EDAD</tspan></text><rect x="40.0" y="881.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="882.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="905.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Menos de 6 meses</tspan></text><text x="58.0" y="926.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Arnés de Pavlik si la cadera se reduce.</tspan></text><rect x="351.3" y="881.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="882.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="905.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">6 a 18 meses</tspan></text><text x="369.3" y="926.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Reducción cerrada bajo anestesia (abierta si no se</tspan><tspan x="369.3" dy="16">logra) y yeso en espica.</tspan></text><rect x="548.8" y="870.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="594.3" y="885.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="594.3" dy="0">◆ ESTE CASO</tspan></text><rect x="662.7" y="881.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="882.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="905.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Más de 18 meses</tspan></text><text x="680.7" y="926.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Reducción abierta, a menudo con osteotomía de</tspan><tspan x="680.7" dy="16">pelvis o fémur.</tspan></text><text x="40.0" y="1004.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1014.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1036.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1017.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="1036.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Rx de pelvis</tspan></text><text x="491.2" y="1036.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Arnés de Pavlik</tspan></text><text x="678.8" y="1036.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Ecografía de caderas</tspan></text><text x="866.2" y="1036.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Observar 3 meses</tspan></text><rect x="40.0" y="1051.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1051.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1080.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Cuándo sirve</tspan></text><text x="303.8" y="1072.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Desde los 4-6 meses, con</tspan><tspan x="303.8" dy="16">núcleo osificado</tspan></text><text x="491.2" y="1072.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Menores de 6 meses con</tspan><tspan x="491.2" dy="16">cadera reducible</tspan></text><text x="678.8" y="1080.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Menores de 4-6 meses</tspan></text><text x="866.2" y="1072.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Nunca con un examen</tspan><tspan x="866.2" dy="16">anormal</tspan></text><rect x="40.0" y="1101.0" width="920.0" height="50.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1101.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1130.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿En este caso?</tspan></text><text x="303.8" y="1130.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="1122.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: tiene 9 meses y aún no</tspan><tspan x="491.2" dy="16">hay diagnóstico</tspan></text><text x="678.8" y="1130.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: el núcleo ya se osificó</tspan></text><text x="866.2" y="1130.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: retrasa el tratamiento</tspan></text><rect x="40.0" y="1014.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1175.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1203.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1225.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Menor de 4-6 meses: ecografía de caderas; mayor de 4-6 meses: Rx AP de pelvis.</tspan><tspan x="58.0" dy="18">• Normal: el núcleo femoral está en el cuadrante inferointerno (bajo Hilgenreiner y medial a Perkins); en la DDC sube y se va afuera.</tspan><tspan x="58.0" dy="18">• Índice acetabular mayor de 30° al año y línea de Shenton rota apoyan displasia o luxación.</tspan></text><text x="58.0" y="1283.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Tachdjian Ortopedia Pediátrica 6.ª ed.; guía AAOS de displasia del desarrollo de la cadera.</tspan></text></svg>