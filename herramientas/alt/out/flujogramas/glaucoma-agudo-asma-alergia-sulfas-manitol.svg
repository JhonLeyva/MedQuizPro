.2,390.0 543.8,390.0 507.5,446.0 112.5,446.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="418.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="422.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="422.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">Asma bronquial: evitar betabloqueadores</tspan></text><line x1="529.6" y1="418.0" x2="606.0" y2="418.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="405.0" width="71.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="649.7" y="422.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="649.7" dy="0">✕ Timolol</tspan></text><line x1="636.0" y1="418.5" x2="675.4" y2="418.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,450.0 507.5,450.0 471.2,510.0 148.8,510.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="480.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="484.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="476.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">Alergia a sulfas: evitar inhibidores de</tspan><tspan x="320.0" dy="17">anhidrasa</tspan></text><line x1="493.4" y1="480.0" x2="606.0" y2="480.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="467.0" width="100.2" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="664.1" y="484.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="664.1" dy="0">✕ Dorzolamida</tspan></text><line x1="636.0" y1="480.5" x2="704.2" y2="480.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="720.2" y="467.0" width="110.2" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="775.3" y="484.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="775.3" dy="0">✕ Acetazolamida</tspan></text><line x1="742.2" y1="480.5" x2="820.4" y2="480.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,514.0 471.2,514.0 435.0,591.0 185.0,591.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="552.5" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="556.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="540.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">En la crisis: latanoprost es</tspan><tspan x="320.0" dy="17">lento: tarda horas en bajar</tspan><tspan x="320.0" dy="17">la PIO</tspan></text><line x1="457.1" y1="552.5" x2="606.0" y2="552.5" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="539.5" width="96.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="662.1" y="557.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="662.1" dy="0">✕ Latanoprost</tspan></text><line x1="636.0" y1="553.0" x2="700.3" y2="553.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="595.0" x2="310.0" y2="614.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,613.0 315.0,613.0 310.0,621.0" fill="#0f766e"/><rect x="140.0" y="625.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="654.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">MANITOL EV</tspan></text><text x="310.0" y="678.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Diurético osmótico: deshidrata el vítreo</tspan><tspan x="310.0" dy="17">+ pilocarpina; luego iridotomía láser</tspan></text><rect x="370.6" y="614.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="629.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="632.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="652.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="670.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">La iridotomía láser en ambos ojos es el tratamiento</tspan><tspan x="628.0" dy="16">definitivo y preventivo.</tspan></text><rect x="40.0" y="740.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="768.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="790.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Factores: mujer, edad avanzada, hipermetropía, midriasis (anticolinérgicos, penumbra).</tspan><tspan x="58.0" dy="18">• Acetazolamida y dorzolamida son sulfonamidas: evitarlas si hay alergia.</tspan><tspan x="58.0" dy="18">• El timolol puede desencadenar broncoespasmo aunque sea tópico.</tspan></text><text x="58.0" y="848.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO – Primary Angle-Closure Disease Preferred Practice Pattern (2020) · EGS – Terminology and Guidelines for Glaucoma 5.ª ed. (2020)</tspan></text></svg>