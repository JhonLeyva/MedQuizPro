<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1103" viewBox="0 0 1000 1103" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Atropellado con disnea marcada, PA 80/50, SatO₂ 85 %, tráquea desviada y murmullo vesicular ausente en el hemitórax izquierdo: neumotórax a tensión, descompresión inmediata con aguja o angiocatéter"><title>Atropellado con disnea marcada, PA 80/50, SatO₂ 85 %, tráquea desviada y murmullo vesicular ausente en el hemitórax izquierdo: neumotórax a tensión, descompresión inmediata con aguja o angiocatéter</title><rect x="0.75" y="0.75" width="998.5" height="1101.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma torácico · neumotórax a tensión</tspan></text><rect x="435.8" y="32.0" width="146.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="509.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="131"><tspan x="509.3" dy="0">CIRUGÍA RESIDENTADO</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neumotórax a tensión</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El aire entra al espacio pleural y no sale (válvula): colapsa el pulmón, empuja el mediastino</tspan><tspan x="58.0" dy="17">y comprime las venas.</tspan><tspan x="58.0" dy="17">Cae el retorno venoso: shock obstructivo con tráquea desviada hacia el lado contrario.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 25 años, atropellado</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Disnea marcada, sudoración, extremidades frías.</tspan><tspan x="640.0" dy="16">PA 80/50, FR 28, SatO₂ 85 %, tráquea desviada y sin</tspan><tspan x="640.0" dy="16">murmullo vesicular izquierdo.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS SIGNOS VITALES DEL CASO</tspan></text><rect x="40.0" y="285.0" width="470.0" height="334.0" rx="16" fill="#0b1220" stroke="#334155" stroke-width="3"/><rect x="52.0" y="297.0" width="150.0" height="24.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/><text x="62.0" y="314.0" font-size="10.5" font-weight="800" font-style="normal" fill="#5eead4" text-anchor="start" data-max="132"><tspan x="62.0" dy="0">MONITOR · TRAUMA</tspan></text><rect x="58.0" y="335.0" width="211.0" height="82.0" rx="10" fill="#0c1e3d" stroke="#60a5fa" stroke-width="1.5"/><text x="70.0" y="357.0" font-size="11.5" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">PA</tspan></text><text x="163.5" y="393.0" font-size="26" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">80/50</tspan></text><text x="257.0" y="357.0" font-size="10.5" font-weight="700" font-style="normal" fill="#60a5fa" text-anchor="end" data-max="106"><tspan x="257.0" dy="0">mmHg ▼</tspan></text><rect x="281.0" y="335.0" width="211.0" height="82.0" rx="10" fill="#0c1e3d" stroke="#60a5fa" stroke-width="1.5"/><text x="293.0" y="357.0" font-size="11.5" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">SatO₂</tspan></text><text x="386.5" y="393.0" font-size="26" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">85</tspan></text><text x="480.0" y="357.0" font-size="10.5" font-weight="700" font-style="normal" fill="#60a5fa" text-anchor="end" data-max="106"><tspan x="480.0" dy="0">% ▼</tspan></text><rect x="58.0" y="427.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="70.0" y="449.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">FR</tspan></text><text x="163.5" y="485.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">28</tspan></text><text x="257.0" y="449.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="257.0" dy="0">rpm ▲</tspan></text><rect x="281.0" y="427.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="293.0" y="449.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">TRÁQUEA</tspan></text><text x="386.5" y="485.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">desviada</tspan></text><text x="480.0" y="449.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="480.0" dy="0"> ▲</tspan></text><rect x="58.0" y="519.0" width="211.0" height="82.0" rx="10" fill="#0c1e3d" stroke="#60a5fa" stroke-width="1.5"/><text x="70.0" y="541.0" font-size="11.5" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">MV IZQ.</tspan></text><text x="163.5" y="577.0" font-size="26" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">ausente</tspan></text><text x="257.0" y="541.0" font-size="10.5" font-weight="700" font-style="normal" fill="#60a5fa" text-anchor="end" data-max="106"><tspan x="257.0" dy="0"> ▼</tspan></text><rect x="281.0" y="519.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="293.0" y="541.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">PIEL</tspan></text><text x="386.5" y="577.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">fría, sudada</tspan></text><text x="480.0" y="541.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="480.0" dy="0"> ▲</tspan></text><rect x="528.0" y="310.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="335.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Shock + hipoxemia + MV ausente</tspan></text><text x="543.0" y="352.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Neumotórax a tensión: es clínico, no esperar la radiografía.</tspan></text><rect x="528.0" y="375.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="400.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Tráquea desviada al lado sano</tspan></text><text x="543.0" y="417.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">El mediastino es empujado por el aire a presión.</tspan></text><rect x="528.0" y="440.0" width="432.0" height="73.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="465.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Primero descomprimir</tspan></text><text x="543.0" y="482.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Catéter 14 G largo (≈ 7 cm); en el lado izquierdo, 2.º espacio en la línea</tspan><tspan x="543.0" dy="16">medioclavicular.</tspan></text><rect x="528.0" y="521.0" width="432.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="543.0" y="546.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Después</tspan></text><text x="543.0" y="563.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Tubo de tórax conectado a sello de agua; reevaluar con la secuencia</tspan><tspan x="543.0" dy="16">ABCDE.</tspan></text><rect x="40.0" y="637.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="663.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Neumotórax a tensión con shock = descompresión inmediata con catéter</tspan></text><text x="60.0" y="682.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Luego, tubo de drenaje torácico: es el tratamiento definitivo.</tspan></text><text x="40.0" y="749.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="759.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="790.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="781.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tracción costal</tspan><tspan x="285.0" dy="17">izquierda</tspan></text><rect x="363.0" y="762.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="781.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Descompresión con</tspan><tspan x="435.0" dy="17">angiocatéter</tspan></text><text x="585.0" y="781.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Toracotomía mínima</tspan><tspan x="585.0" dy="17">con drenaje laminar</tspan></text><text x="735.0" y="790.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ventilación asistida</tspan></text><text x="885.0" y="781.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Toracotomía a cielo</tspan><tspan x="885.0" dy="17">abierto</tspan></text><rect x="40.0" y="813.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="813.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="842.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Procedimiento</tspan><tspan x="54.0" dy="16">inmediato?</tspan></text><text x="285.0" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no existe en el</tspan><tspan x="285.0" dy="16">trauma torácico</tspan></text><text x="435.0" y="842.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: alivia la tensión en</tspan><tspan x="435.0" dy="16">segundos</tspan></text><text x="585.0" y="834.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el drenaje laminar</tspan><tspan x="585.0" dy="16">no sirve en</tspan><tspan x="585.0" dy="16">neumotórax</tspan></text><text x="735.0" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la presión positiva</tspan><tspan x="735.0" dy="16">aumenta la tensión</tspan></text><text x="885.0" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es una medida</tspan><tspan x="885.0" dy="16">extrema, no la inicial</tspan></text><rect x="40.0" y="759.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="903.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="931.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="953.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Es un diagnóstico clínico: NO esperar la radiografía.</tspan><tspan x="58.0" dy="18">• Descompresión inmediata con catéter 14 G: 5.º espacio intercostal, línea axilar anterior (ATLS), o 2.º espacio, línea medioclavicular; en el lado izquierdo</tspan><tspan x="58.0" dy="18">   se prefiere el 2.º por el riesgo de lesión cardíaca.</tspan><tspan x="58.0" dy="18">• Las agujas más largas fallan menos (−7,8 % por cada cm; unos 7 cm); si no alcanza, toracostomía con dedo o con tubo. Después, tubo de tórax: es el</tspan><tspan x="58.0" dy="18">   tratamiento definitivo.</tspan></text><text x="58.0" y="1047.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025), neumotórax a tensión; World J Emerg Surg 2025, metaanálisis de longitud de aguja y sitio de descompresión (PMID 40383767); ESC/ETC</tspan><tspan x="58.0" dy="15">(European Trauma Course).</tspan></text></svg>