<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plataforma · MedQuizPlus</title>
<meta name="description" content="Tu espacio de entrenamiento en MedQuizPlus: bancos de preguntas, simuladores y progreso.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script>
  try { var t = localStorage.getItem("mqp_tema"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="../styles.css?v=20260930-materias">
<link rel="stylesheet" href="app.css?v=20260930-materias">
</head>
<body class="app-body">

<a class="skip-link" href="#vista">Saltar al contenido</a>

<div class="shell">
  <!-- ====================== NAVEGACIÓN LATERAL ====================== -->
  <aside class="side" id="side" aria-label="Plataforma">
    <div class="side__top">
      <a class="brand" href="#/inicio" aria-label="MedQuizPlus, inicio de la plataforma">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
        <span>MedQuiz<span class="brand__plus">Plus</span></span>
      </a>
      <button class="side__close" type="button" id="sideClose">
        <span class="sr-only">Cerrar menú</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <!-- las rutas son #/<ruta>; app.js marca la activa con aria-current -->
    <nav class="side__nav" id="sideNav" aria-label="Secciones">
      <a href="#/inicio" data-ruta="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>Inicio</a>
      <a href="#/examenes" data-ruta="examenes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Exámenes</a>
      <a href="#/banco" data-ruta="banco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M8 7h7M8 11h5"/></svg>Banco de preguntas</a>
      <a href="#/simuladores" data-ruta="simuladores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>Simuladores</a>
      <p class="side__label">Seguimiento</p>
      <a href="#/progreso" data-ruta="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-7M3 20h18"/></svg>Mi progreso</a>
      <a href="#/falladas" data-ruta="falladas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>Preguntas falladas<span class="side__count" id="cntFalladas" hidden></span></a>
      <a href="#/favoritas" data-ruta="favoritas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>Favoritas<span class="side__count" id="cntFavoritas" hidden></span></a>
      <a href="#/perfil" data-ruta="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.4-3.6 4.4-5.5 8-5.5s6.6 1.9 8 5.5"/></svg>Perfil</a>
    </nav>

    <div class="side__foot">
      <button class="theme-btn" type="button" id="themeToggle" aria-pressed="false" title="Cambiar tema claro / oscuro">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="theme-btn__label">Modo oscuro</span>
      </button>
      <a class="side__web" href="../">← Volver a la web</a>
    </div>
  </aside>
  <div class="side-scrim" id="sideScrim" hidden></div>

  <!-- ====================== CONTENIDO ====================== -->
  <div class="shell__main">
    <header class="topbar">
      <button class="topbar__menu" type="button" id="sideOpen" aria-controls="side" aria-expanded="false">
        <span class="sr-only">Abrir menú</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <p class="topbar__title" id="tbTitle">Inicio</p>
      <a class="topbar__exam badge badge--brand" id="tbExam" href="#/perfil" title="Examen que estás preparando">ENAM</a>
    </header>

    <main class="vista" id="vista" tabindex="-1">
      <div id="vistaRuta" aria-live="polite"></div>
      <!-- simulador compartido con la web pública (se monta desde main.js) -->
      <div class="vista__sesion" id="vistaSesion">
        <div data-mqp-practica></div>
      </div>
    </main>
  </div>
</div>

<!-- navegación inferior (móvil) -->
<nav class="tabbar" aria-label="Accesos rápidos">
  <a href="#/inicio" data-ruta="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="#/banco" data-ruta="banco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/></svg>Banco</a>
  <a href="#/simuladores" data-ruta="simuladores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/></svg>Simuladores</a>
  <a href="#/progreso" data-ruta="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-7M3 20h18"/></svg>Progreso</a>
</nav>

<!-- chat:inicio -->
<div data-mqp-chat></div>
<!-- chat:fin -->

<script defer src="../catalogo.js?v=20260930-materias"></script>
<script defer src="../algoritmos.js?v=20260927-2"></script>
<script defer src="../main.js?v=20260930-materias"></script>
<script defer src="app.js?v=20260930-materias"></script>
</body>
</html>
